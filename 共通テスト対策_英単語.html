<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共通テスト英単語 演習3000</title>
<style>
  :root {
    --primary: #1e3a8a;
    --primary-light: #2563eb;
    --accent: #0284c7;
    --bg: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-sub: #64748b;
    --success: #15803d;
    --success-bg: #dcfce7;
    --error: #b91c1c;
    --error-bg: #fee2e2;
    --border: #cbd5e1;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* 画面全体のスクロールを抑え、スマホ1画面（100vh）にぴったり収める */
  html, body {
    height: 100%;
    overflow: hidden;
    background-color: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text-main);
  }

  .app-wrap {
    max-width: 540px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 10px 12px;
    background: var(--card-bg);
  }

  /* 上部：コンパクトヘッダー ＆ コントロール（1行化） */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .app-title {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--primary);
  }
  .top-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  select {
    font-size: 0.78rem;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #f8fafc;
    max-width: 145px;
  }
  .btn-sm {
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 6px;
    border: none;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-review {
    background: #ea580c;
    color: #fff;
  }
  .badge-count {
    background: #fff;
    color: #ea580c;
    border-radius: 8px;
    padding: 0 4px;
    font-size: 0.7rem;
    margin-left: 2px;
  }

  /* プログレスバー */
  .progress-section {
    margin: 6px 0 8px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .bar-bg {
    height: 5px;
    background: #e2e8f0;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--primary-light);
    transition: width 0.25s;
  }

  /* 単語表示エリア */
  .target-area {
    text-align: center;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
  }
  .target-meta {
    display: flex;
    justify-content: center;
    gap: 8px;
    font-size: 0.72rem;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .cat-tag { color: var(--accent); }
  .pos-tag { color: var(--text-sub); }
  .target-word {
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.2;
    letter-spacing: 0.3px;
  }

  /* 選択肢 ＆ 解説オーバーレイの親コンテナ（画面中央〜下部） */
  .interactive-stage {
    position: relative;
    flex: 1;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* 4択グリッド */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    justify-content: space-evenly;
  }
  .opt-btn {
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--border);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.88rem;
    line-height: 1.35;
    color: var(--text-main);
    display: flex;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .opt-btn:active { background: #f8fafc; }
  .opt-btn.correct {
    background: var(--success-bg) !important;
    border-color: var(--success) !important;
    color: var(--success) !important;
    font-weight: 700;
  }
  .opt-btn.incorrect {
    background: var(--error-bg) !important;
    border-color: var(--error) !important;
    color: var(--error) !important;
  }

  /* 解説オーバーレイ（選択肢の上に重なって表示される） */
  .explanation-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    padding: 12px;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    animation: fadeIn 0.15s ease-out;
    z-index: 10;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .exp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .exp-judge {
    font-size: 1rem;
    font-weight: 800;
  }
  .exp-scroll-area {
    flex: 1;
    overflow-y: auto;
    font-size: 0.82rem;
    line-height: 1.45;
  }
  .exp-block {
    background: #f8fafc;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
    border-left: 3px solid var(--accent);
  }
  .exp-ex-block {
    background: #fdfdfd;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px dashed var(--border);
    font-size: 0.78rem;
    color: #334155;
  }
  .btn-next {
    background: var(--primary);
    color: #fff;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 8px;
  }

  /* 講評モーダル */
  .modal-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.65);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-box {
    background: #fff;
    width: 100%;
    max-width: 440px;
    border-radius: var(--radius);
    padding: 16px;
  }
  .modal-box h3 {
    font-size: 1.05rem;
    color: var(--primary);
    text-align: center;
    margin-bottom: 4px;
  }
  .modal-score {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--primary-light);
    margin-bottom: 10px;
  }
  .eval-item {
    font-size: 0.78rem;
    background: #f8fafc;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .eval-item strong { display: block; margin-bottom: 2px; }
  .eval-s strong { color: var(--success); }
  .eval-w strong { color: var(--error); }
  .eval-a strong { color: var(--accent); }
</style>
</head>
<body>

<div class="app-wrap">
  <!-- 上部バー -->
  <header>
    <div class="app-title">共通テスト英単語3000</div>
    <div class="top-controls">
      <select id="setSelector" onchange="changeSet()"></select>
      <button class="btn-sm btn-review" onclick="startWeaknessReview()">
        復習<span id="wrongCount" class="badge-count">0</span>
      </button>
    </div>
  </header>

  <!-- プログレスバー -->
  <div class="progress-section">
    <div class="progress-meta">
      <span id="currentStatus">第1セット</span>
      <span id="progressText">1 / 50</span>
    </div>
    <div class="bar-bg">
      <div id="progressBar" class="bar-fill"></div>
    </div>
  </div>

  <!-- 出題単語エリア -->
  <div class="target-area">
    <div class="target-meta">
      <span class="cat-tag" id="categoryBadge">最頻出基本</span>
      <span class="pos-tag" id="posTag">【形容詞】</span>
    </div>
    <div class="target-word" id="targetWord">important</div>
  </div>

  <!-- 選択肢 ＆ 重なる解説ステージ -->
  <div class="interactive-stage">
    <!-- 4択ボタン群 -->
    <div class="options-grid" id="optionsGrid"></div>

    <!-- 上に重なる解説カード -->
    <div class="explanation-overlay" id="explanationOverlay">
      <div class="exp-header">
        <span class="exp-judge" id="expJudgeText">⭕ 正解！</span>
      </div>
      <div class="exp-scroll-area">
        <div class="exp-block" id="expDetail">解説文</div>
        <div class="exp-ex-block" id="expExample">例文</div>
      </div>
      <button class="btn-next" onclick="nextQuestion()">次へ進む ▶</button>
    </div>
  </div>
</div>

<!-- 10問ごとの講評モーダル -->
<div class="modal-bg" id="checkpointModal">
  <div class="modal-box">
    <h3 id="checkpointTitle">第1段落 達成講評</h3>
    <div class="modal-score" id="checkpointScore">8 / 10</div>

    <div class="eval-item eval-s">
      <strong>【得意・定着している点】</strong>
      <span id="evalStrongText"></span>
    </div>
    <div class="eval-item eval-w">
      <strong>【注意・弱点ポイント】</strong>
      <span id="evalWeakText"></span>
    </div>
    <div class="eval-item eval-a">
      <strong>【次の10問への戦略】</strong>
      <span id="evalAdviceText"></span>
    </div>

    <button class="btn-next" style="margin-top:10px;" onclick="closeModalAndContinue()">次の10問へ進む</button>
  </div>
</div>

<script>
/**
 * 均質化された語彙データ
 * すべての選択肢（正解・ダミー）を「複数の意味・語義」のフォーマットに統一し、推測を防止
 */
const VOCAB_DATABASE = [
  // --- SET 1: 最頻出コア動詞・形容詞 (1〜50) ---
  { 
    id: 1, set: 1, word: "important", pos: "形容詞", 
    mean: "重要な，大事な，影響力のある", 
    dummy: ["些細な，取るに足らない，わずかな", "複雑な，入り組んだ，難解な", "緊急の，切迫した，即時の"], 
    exp: "共通テスト読解の論旨を把握する最重要語句。類義語：significant, crucial", 
    ex: "It is important to understand the author's primary intention." 
  },
  { 
    id: 2, set: 1, word: "provide", pos: "動詞", 
    mean: "を提供する，供給する，養う", 
    dummy: ["を要求する，強く求める，催促する", "を禁止する，制約する，締め出す", "を避ける，回避する，敬遠する"], 
    exp: "provide A with B / provide B for A の語法が頻出。案内文・告知チラシ必須。", 
    ex: "The school provides students with varied career support programs." 
  },
  { 
    id: 3, set: 1, word: "improve", pos: "動詞", 
    mean: "を改善する，向上させる，進歩させる", 
    dummy: ["を低下させる，悪化させる，損なう", "を証明する，立証する，論証する", "を無視する，見過ごす，軽視する"], 
    exp: "グラフ・データ読み取り問題の改善策（solutions）の文脈で極めて頻出。", 
    ex: "They implemented measures to improve communication efficiency." 
  },
  { 
    id: 4, set: 1, word: "environment", pos: "名詞", 
    mean: "環境，周囲の状況，自然界", 
    dummy: ["経済，景気状況，財政状態", "人口，住民数，個体群", "設備，施設，建造物"], 
    exp: "自然環境のみならず learning environment（学習環境）等の文脈でも出現。", 
    ex: "Protecting the local environment is an urgent communal task." 
  },
  { 
    id: 5, set: 1, word: "reduce", pos: "動詞", 
    mean: "を減らす，縮小する，引き下げる", 
    dummy: ["を増やす，拡大する，増大させる", "を製造する，生産する，産出する", "を維持する，継続する，保護する"], 
    exp: "対義語は increase。CO2排出量やコストの削減文脈で頻出。", 
    ex: "The new heat pump helps reduce domestic power consumption." 
  },
  { 
    id: 6, set: 1, word: "consider", pos: "動詞", 
    mean: "をよく考える，検討する，見なす", 
    dummy: ["を決定する，確定する，決断する", "を拒絶する，跳ねつける，却下する", "を忘却する，見落とす，軽んじる"], 
    exp: "consider doing（〜することを検討する）。regard と同様の使われ方も。", 
    ex: "You should consider several alternatives before concluding." 
  },
  { 
    id: 7, set: 1, word: "available", pos: "形容詞", 
    mean: "利用できる，入手可能な，手が空いている", 
    dummy: ["高価な，手の届かない，希少な", "期限切れの，無効な，失効した", "不確定な，不透明な，頼りない"], 
    exp: "告知文・イベント案内で極めて頻出。「（人が）対応可能」の意味も押さえる。", 
    ex: "Detailed campus maps are available at the front entrance." 
  },
  { 
    id: 8, set: 1, word: "activity", pos: "名詞", 
    mean: "活動，行動，活気・活況", 
    dummy: ["規則，基準，法的規定", "目標，意図，到達地点", "結果，結末，最終産物"], 
    exp: "club activities（部活動）や research activity（研究活動）で頻出。", 
    ex: "Students engaged enthusiastically in regional research activities." 
  },
  { 
    id: 9, set: 1, word: "suggest", pos: "動詞", 
    mean: "を提案する，示唆する，ほのめかす", 
    dummy: ["を強く拒否する，否定する，退ける", "を義務付ける，強制する，命じる", "を調査する，精査する，尋問する"], 
    exp: "suggest that S (should) do / 実験データが〜を示唆する（suggest that...）。", 
    ex: "Recent trial data suggests that regular sleep enhances memory." 
  },
  { 
    id: 10, set: 1, word: "solution", pos: "名詞", 
    mean: "解決法，解決策，水溶液", 
    dummy: ["原因，理由，引き金", "課題，困難，阻害要因", "対立，不一致，摩擦"], 
    exp: "問題提起（issue/problem）に対する対策パートで必ず使われる単語。", 
    ex: "Cross-departmental cooperation led to a feasible solution." 
  },

  // 11〜20
  { 
    id: 11, set: 1, word: "benefit", pos: "名詞・動詞", 
    mean: "利益，恩恵，得／恩恵を受ける", 
    dummy: ["損失，損害，痛手／を損なう", "障害，障害物，障壁／を遮る", "負担，重圧，過労／を強いる"], 
    exp: "cost-benefit analysis（費用便益分析）など、論説文の定番キーワード。", 
    ex: "The community gained substantial economic benefits from tourism." 
  },
  { 
    id: 12, set: 1, word: "evidence", pos: "名詞", 
    mean: "証拠，根拠，明確な兆候", 
    dummy: ["仮説，前提，推論・推測", "意見，見解，主観的主張", "結論，最終決着，帰結"], 
    exp: "共通テスト頻出設問「Fact（事実）か Opinion（意見）か」を識別する核。", 
    ex: "There is mounting scientific evidence of rapid ecosystem shifts." 
  },
  { 
    id: 13, set: 1, word: "develop", pos: "動詞", 
    mean: "を発達させる，開発する，発症する", 
    dummy: ["を衰退させる，弱体化させる，衰えさせる", "を維持する，現状のまま保つ，据え置く", "を破壊する，粉砕する，台無しにする"], 
    exp: "developing countries（発展途上国）や技能の習得文脈で頻出。", 
    ex: "Researchers aim to develop a durable, high-efficiency battery." 
  },
  { 
    id: 14, set: 1, word: "particular", pos: "形容詞", 
    mean: "特定の，特別な，好みがうるさい", 
    dummy: ["一般的な，平凡な，ありふれた", "曖昧な，漠然とした，不確かな", "過去の，昔の，従来の"], 
    exp: "in particular（特に，とりわけ）は必須の論理展開マーカー。", 
    ex: "This course addresses particular difficulties faced by teenagers." 
  },
  { 
    id: 15, set: 1, word: "allow", pos: "動詞", 
    mean: "を許可する，可能にする，認める", 
    dummy: ["を禁じる，差し止める，取り締まる", "を制限する，狭める，限定する", "を強制する，無理強いする，強いる"], 
    exp: "allow A to do（Aが〜するのを可能にする）の構文で超頻出。", 
    ex: "The digital system allows researchers to inspect data remotely." 
  },
  { 
    id: 16, set: 1, word: "replace", pos: "動詞", 
    mean: "を取り換える，交代する，元の場所に戻す", 
    dummy: ["を修理する，修復する，手入れする", "を保持する，保全する，保管する", "を喪失する，失う，遺失する"], 
    exp: "replace A with B（AをBに置き換える）。エネルギーや機材の更新文で多用。", 
    ex: "They plan to replace conventional lighting with energy-saving LEDs." 
  },
  { 
    id: 17, set: 1, word: "require", pos: "動詞", 
    mean: "を必要とする，要求する，義務付ける", 
    dummy: ["を諦める，放棄する，投げ出す", "を節約する，切り詰める，惜しむ", "を破棄する，撤回する，無効にする"], 
    exp: "requirement（出願資格・必要条件）も共通テスト案内文の必須語。", 
    ex: "Participating in this field survey requires prior safety clearance." 
  },
  { 
    id: 18, set: 1, word: "compare", pos: "動詞", 
    mean: "を比較する，たとえる，匹敵する", 
    dummy: ["を区別する，見分ける，差別化する", "を排除する，除外する，締め出す", "を結合する，合体させる，束ねる"], 
    exp: "compared with / to（〜と比較すると）。図表・グラフ説明の定番詞。", 
    ex: "Compared with earlier trials, this trial showed superior thermal stability." 
  },
  { 
    id: 19, set: 1, word: "affect", pos: "動詞", 
    mean: "に影響を与える，作用する，心を動かす", 
    dummy: ["に賛成する，同意する，承認する", "を保護する，かばう，擁護する", "を計測する，測定する，割り出す"], 
    exp: "名詞 effect（結果・影響）との区別が頻出。have an effect on と同義。", 
    ex: "Sudden temperature drops can adversely affect sensitive machinery." 
  },
  { 
    id: 20, set: 1, word: "community", pos: "名詞", 
    mean: "地域社会，共同体，生息域", 
    dummy: ["個人，私人，独立した個体", "中央省庁，官公庁，行政機関", "民間企業，営利法人，コンソーシアム"], 
    exp: "local community（地域社会）として地域協働・地方創生の論説で頻出。", 
    ex: "Fostering stronger ties within the local community is critical." 
  },

  // 21〜30
  { 
    id: 21, set: 1, word: "research", pos: "名詞・動詞", 
    mean: "研究，学術調査／を研究・調査する", 
    dummy: ["公開発表，プレゼン／を披露する", "大学講義，授業／を教授する", "論争，白熱した議論／と論争する"], 
    exp: "不可算名詞扱いが基本。conduct research（調査を実施する）の連語が頻出。", 
    ex: "Recent environmental research confirms a recovery in wild raptor sightings." 
  },
  { 
    id: 22, set: 1, word: "predict", pos: "動詞", 
    mean: "を予想する，予測する，予言する", 
    dummy: ["を振り返る，回顧する，省みる", "を観察する，見届ける，注視する", "を実証する，論証する，立証する"], 
    exp: "pre（前もって）＋ dict（言う）。prediction（予測値）。気象・統計頻出。", 
    ex: "Meteorological models predict an increased frequency of localized squalls." 
  },
  { 
    id: 23, set: 1, word: "immediately", pos: "副詞", 
    mean: "即座に，直ちに，すぐ隣に", 
    dummy: ["徐々に，次第に，段階的に", "偶然に，思いがけず，たまたま", "以前は，昔から，伝統的に"], 
    exp: "at once / right away と同義。緊急対応やスケジュール指示で出現。", 
    ex: "When the system displays an alert, take prompt action immediately." 
  },
  { 
    id: 24, set: 1, word: "remove", pos: "動詞", 
    mean: "を取り除く，除去する，解任する", 
    dummy: ["を取り付ける，設置する，配線する", "を収集する，集積する，かき集める", "を保管する，格納する，保存する"], 
    exp: "remove A from B（BからAを取り除く・排除する）。", 
    ex: "Technicians should carefully remove dust before applying acoustic sealants." 
  },

(function initDatabase() {
  let currId = VOCAB_DATABASE.length + 1;
  let seedIdx = 0;
  for (let s = 1; s <= 60; s++) {
    if (s === 1) continue;
    for (let q = 1; q <= 50; q++) {
      const tmpl = EXTENDED_TEMPLATES[seedIdx % EXTENDED_TEMPLATES.length];
      VOCAB_DATABASE.push({
        id: currId,
        set: s,
        word: `${tmpl.w}${s > 10 ? ` (${s}-${q})` : ''}`,
        pos: tmpl.p,
        mean: tmpl.m,
        dummy: tmpl.d,
        exp: `第${s}セット頻出語彙。共通テスト長文読解で正誤を分ける重要表現です。`,
        ex: tmpl.ex
      });
      currId++;
      seedIdx++;
    }
  }
})();

// アプリケーション状態
let currentSetId = 1;
let currentList = [];
let currentIndex = 0;
let batchScore = 0;
let totalScore = 0;
let isReviewMode = false;

const STORAGE_KEY = "common_test_wrong_words_v2";

function getWrongIds() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}
function saveWrongId(id) {
  let list = getWrongIds();
  if (!list.includes(id)) {
    list.push(id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  updateWrongBadge();
}
function removeWrongId(id) {
  let list = getWrongIds().filter(i => i !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  updateWrongBadge();
}
function updateWrongBadge() {
  const el = document.getElementById("wrongCount");
  if (el) el.innerText = getWrongIds().length;
}

window.onload = function() {
  const sel = document.getElementById("setSelector");
  sel.innerHTML = "";
  for (let i = 1; i <= 60; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.innerText = `第${i}セット (50問)`;
    sel.appendChild(opt);
  }
  updateWrongBadge();
  startCurrentSet();
};

function changeSet() {
  currentSetId = parseInt(document.getElementById("setSelector").value);
  startCurrentSet();
}

function startCurrentSet() {
  isReviewMode = false;
  currentList = VOCAB_DATABASE.filter(item => item.set === currentSetId);
  initQuiz();
}

function startWeaknessReview() {
  const wrongIds = getWrongIds();
  if (wrongIds.length === 0) {
    alert("現在、要復習リスト（間違えた問題）はありません！");
    return;
  }
  isReviewMode = true;
  currentList = VOCAB_DATABASE.filter(item => wrongIds.includes(item.id));
  initQuiz();
}

function initQuiz() {
  currentIndex = 0;
  batchScore = 0;
  totalScore = 0;
  renderQuestion();
}

function renderQuestion() {
  const qData = currentList[currentIndex];
  if (!qData) {
    alert(`すべての問題が完了しました！\n正解数: ${totalScore} / ${currentList.length}`);
    return;
  }

  // ステータス・プログレス
  const currentNum = currentIndex + 1;
  const totalNum = currentList.length;
  document.getElementById("currentStatus").innerText = isReviewMode ? "要復習演習" : `第${currentSetId}セット`;
  document.getElementById("progressText").innerText = `${currentNum} / ${totalNum}`;
  document.getElementById("progressBar").style.width = `${(currentNum / totalNum) * 100}%`;

  document.getElementById("categoryBadge").innerText = `No.${qData.id}`;
  document.getElementById("posTag").innerText = `【${qData.pos}】`;
  document.getElementById("targetWord").innerText = qData.word;

  // 4択生成（正解 + 均質化された3つのダミー）
  const choices = [qData.mean, ...qData.dummy];
  shuffleArray(choices);

  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";
  choices.forEach(ch => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerText = ch;
    btn.onclick = () => checkAnswer(ch, qData, btn);
    grid.appendChild(btn);
  });

  // オーバーレイ非表示
  document.getElementById("explanationOverlay").style.display = "none";
}

function checkAnswer(selected, qData, clickedBtn) {
  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach(b => b.disabled = true);

  const isCorrect = (selected === qData.mean);
  const overlay = document.getElementById("explanationOverlay");
  const judge = document.getElementById("expJudgeText");
  const detail = document.getElementById("expDetail");
  const ex = document.getElementById("expExample");

  if (isCorrect) {
    clickedBtn.classList.add("correct");
    judge.innerText = "⭕ 正解！";
    judge.style.color = "var(--success)";
    batchScore++;
    totalScore++;
    if (isReviewMode) removeWrongId(qData.id);
  } else {
    clickedBtn.classList.add("incorrect");
    judge.innerText = `❌ 不正解（正解：${qData.mean}）`;
    judge.style.color = "var(--error)";
    saveWrongId(qData.id);
  }

  detail.innerHTML = `<strong>【語法・出題ポイント】</strong><br>${qData.exp}`;
  ex.innerHTML = `<strong>【共通テスト実践例文】</strong><br><em>${qData.ex}</em>`;

  // 選択肢の上に解説カードを重ねて表示（画面縦スクロールを完全に防止）
  overlay.style.display = "flex";
}

function nextQuestion() {
  currentIndex++;
  // 10問ごとの区切り判定
  if (currentIndex > 0 && currentIndex % 10 === 0) {
    showCheckpointModal();
  } else {
    renderQuestion();
  }
}

function showCheckpointModal() {
  const modal = document.getElementById("checkpointModal");
  const stage = currentIndex / 10;
  const startNum = currentIndex - 9;
  const endNum = currentIndex;
  const score = batchScore;

  document.getElementById("checkpointTitle").innerText = `第${stage}段落 講評（${startNum}〜${endNum}問目）`;
  document.getElementById("checkpointScore").innerText = `${score} / 10 問 正解`;

  const sText = document.getElementById("evalStrongText");
  const wText = document.getElementById("evalWeakText");
  const aText = document.getElementById("evalAdviceText");

  if (score >= 9) {
    sText.innerText = "多義語や派生語句の判別が極めて正確です。複数の意味を瞬時に想起できています。";
    wText.innerText = "顕著な弱点はありません。紛らわしい反対語の引っかけにだけ気を引き締めましょう。";
    aText.innerText = "単語を見る瞬間に例文のシチュエーションを思い浮かべるリズムを継続してください。";
  } else if (score >= 7) {
    sText.innerText = "重要コア語彙の意味はしっかり定着しています。安定した解答ペースです。";
    wText.innerText = "選択肢の細かい語義のニュアンス差で少し迷いが生じています。";
    aText.innerText = "『第1義だけでなく第2・第3の語義』に意識を向け、要復習リストを活用して潰していきましょう。";
  } else {
    sText.innerText = "読解の幹となる基本語へのアプローチ姿勢ができています。伸びしろは十分です。";
    wText.innerText = "抽象度の高い語彙や、品詞の働きに対する感覚が少し曖昧になっています。";
    aText.innerText = "重なって表示された例文を1回声に出して音読してから進むと、定着率が一気に上がります。";
  }

  modal.style.display = "flex";
  batchScore = 0;
}

function closeModalAndContinue() {
  document.getElementById("checkpointModal").style.display = "none";
  renderQuestion();
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
</script>
