 0, "exp": "正解は「選択肢4」です。正解 海面12℃は露点16℃より低く、移流してきた空気が冷やされると飽和・凝結に達する。水蒸気量が同じなら昇温で相対湿度は下がる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-524", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 同じ緯度・標高なら、内陸のほうが大きな年較差になりやすい。表と位置の対応を逆にしている。」", "options": ["選択肢1", "時差", "試験", "Q：日本海側"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 同じ緯度・標高なら、内陸のほうが大きな年較差になりやすい。表と位置の対応を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-525", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 暖寒流は気温の水準に影響するが、Qの厳冬と大きな年較差を、同じ西岸の暖流沿岸として説明するのは合わない。」", "options": ["選択肢2", "地球的課題", "気候", "選択肢3"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 暖寒流は気温の水準に影響するが、Qの厳冬と大きな年較差を、同じ西岸の暖流沿岸として説明するのは合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-526", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 表の差は気温の季節変化であり、標高差も小さい。高山の風上・風下だけでは、海洋性と大陸性ほどこの年較差の違いを説明できない。」", "options": ["選択肢3", "情報の限界", "その他", "科目名"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 表の差は気温の季節変化であり、標高差も小さい。高山の風上・風下だけでは、海洋性と大陸性ほどこの年較差の違いを説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-527", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pの年較差15℃はQの40℃より小さい。海からの風を受けるPの海洋性と、夏冬に陸面の影響が強いQの大陸性が差を説明する。」", "options": ["選択肢4", "気候・自然環境", "エネルギー資源", "熱帯（A）"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Pの年較差15℃はQの40℃より小さい。海からの風を受けるPの海洋性と、夏冬に陸面の影響が強いQの大陸性が差を説明する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-528", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Xの年較差は2℃、観測日の日較差は20℃。赤道付近では日射の季節差が小さい一方、高地の晴天日には夜間の冷却により昼夜差が大きくなりうる。」", "options": ["選択肢1", "世界の諸地域・日本", "人口", "国公立二次（論述）"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Xの年較差は2℃、観測日の日較差は20℃。赤道付近では日射の季節差が小さい一方、高地の晴天日には夜間の冷却により昼夜差が大きくなりうる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-529", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域対応は合うが、赤道付近の日射の季節差は中緯度より小さい。夜の放射冷却は最低気温を下げ、晴天日の昼夜差を大きくする方向に働く。」", "options": ["選択肢2", "B年", "図法", "海岸の地形"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 地域対応は合うが、赤道付近の日射の季節差は中緯度より小さい。夜の放射冷却は最低気温を下げ、晴天日の昼夜差を大きくする方向に働く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-530", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域の対応が逆であり、放射冷却が昼夜差を小さくするとする因果も逆。日射の年変化と一日の熱収支を区別する必要がある。」", "options": ["選択肢3", "図表になると迷う", "調査対象", "鉱産資源"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 地域の対応が逆であり、放射冷却が昼夜差を小さくするとする因果も逆。日射の年変化と一日の熱収支を区別する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-531", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 説明した特徴自体はXと合うが、Xの年較差2℃は候補の低緯度高地に対応する。西ヨーロッパ沿岸は低緯度ほど年中の日射条件が一定ではない。」", "options": ["選択肢4", "答えを見れば分かる", "気候・自然環境", "民族・宗教・言語"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 説明した特徴自体はXと合うが、Xの年較差2℃は候補の低緯度高地に対応する。西ヨーロッパ沿岸は低緯度ほど年中の日射条件が一定ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-532", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 舗装や建物への置換は一般に植生・土壌からの蒸発散を減らす。蒸散増加を都市の高温化の原因とする点が逆である。」", "options": ["選択肢1", "地図", "A年", "調査対象"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 舗装や建物への置換は一般に植生・土壌からの蒸発散を減らす。蒸散増加を都市の高温化の原因とする点が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-533", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 都市と郊外の差は昼1℃、夜4℃である。建物・舗装の蓄熱と夜間の放熱、人工排熱などが都市の冷えにくさに関係する。」", "options": ["選択肢2", "地点", "2択から決められない", "人口・都市・生活文化"], "ans": 0, "exp": "正解は「選択肢2」です。正解 都市と郊外の差は昼1℃、夜4℃である。建物・舗装の蓄熱と夜間の放熱、人工排熱などが都市の冷えにくさに関係する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-534", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 郊外の低い夜間気温を、都市より多い蓄熱で説明するのは逆である。植生の蒸発散は日中の昇温を抑える側に働く。」", "options": ["選択肢3", "位置", "地図", "図表になると迷う"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 郊外の低い夜間気温を、都市より多い蓄熱で説明するのは逆である。植生の蒸発散は日中の昇温を抑える側に働く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-535", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人工排熱は人間の活動に伴う熱であり、郊外の裸地自体が増やす熱ではない。表から都市への移流増加も示されていない。」", "options": ["選択肢4", "地下水", "データ", "領域"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 人工排熱は人間の活動に伴う熱であり、郊外の裸地自体が増やす熱ではない。表から都市への移流増加も示されていない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-536", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海面へ下げる換算では気温を加算する。高いQからさらに気温を引くと補正の向きが逆になる。」", "options": ["選択肢1", "現在の地図", "堆積物", "礫・砂・泥の割合"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 海面へ下げる換算では気温を加算する。高いQからさらに気温を引くと補正の向きが逆になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-537", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 換算後には1℃の差が残る。またモデルで一致しても、海流や海陸配置など標高以外の要因がないとは証明できない。」", "options": ["選択肢3", "雲底", "時刻帯", "地表からの深さ（m）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 換算後には1℃の差が残る。またモデルで一致しても、海流や海陸配置など標高以外の要因がないとは証明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-538", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 標高差が大きく影響するという判断はよいが、換算後はQが1℃高い。補正後の大小関係を逆にしている。」", "options": ["選択肢4", "さらに下", "乾季（11〜3月）", "林齢構成"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 標高差が大きく影響するという判断はよいが、換算後はQが1℃高い。補正後の大小関係を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-539", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 フェーンの下降空気は一般に断熱的に昇温し、相対湿度が低下する。冷えて飽和するという説明が逆である。」", "options": ["選択肢1", "雨季（6〜9月）", "期間", "輸送"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 フェーンの下降空気は一般に断熱的に昇温し、相対湿度が低下する。冷えて飽和するという説明が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-540", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海陸の温度差による風の場面ではない。また夜間には冷気が斜面を下り盆地にたまりやすい。」", "options": ["選択肢2", "総労働時間", "原料炭", "10年前"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 海陸の温度差による風の場面ではない。また夜間には冷気が斜面を下り盆地にたまりやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-541", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 寒流上への水平移動という条件は示されていない。晴れた盆地で下層から冷える鉛直分布は放射冷却による霧と対応する。」", "options": ["選択肢3", "期間", "輸送機関", "40〜64歳"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 寒流上への水平移動という条件は示されていない。晴れた盆地で下層から冷える鉛直分布は放射冷却による霧と対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-542", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 地表付近3℃に対して上空100mは7℃で逆転層がある。地表付近が露点3℃まで冷えており、放射冷却による霧が生じうる。」", "options": ["選択肢4", "地域", "前期", "店舗"], "ans": 0, "exp": "正解は「選択肢4」です。正解 地表付近3℃に対して上空100mは7℃で逆転層がある。地表付近が露点3℃まで冷えており、放射冷却による霧が生じうる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-543", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 近隣都市の気温極値だけでは、対象地点の降水の季節配分も平均気温も判定できない。」", "options": ["選択肢1", "輸送", "40〜64歳", "主要河川"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 近隣都市の気温極値だけでは、対象地点の降水の季節配分も平均気温も判定できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-544", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 気候は長期間の平均的な状態を扱う。温帯か、暖候期の乾燥が持続的な季節特徴かを調べるには、そろえた基準期間の月別気温・降水量が必要である。」", "options": ["選択肢2", "貨物", "地区", "Q 東側"], "ans": 0, "exp": "正解は「選択肢2」です。正解 気候は長期間の平均的な状態を扱う。温帯か、暖候期の乾燥が持続的な季節特徴かを調べるには、そろえた基準期間の月別気温・降水量が必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-545", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 大雨や雷の極端現象を調べる資料で、暖候期と寒候期の平均降水配分や気温条件を直接比較できない。」", "options": ["選択肢3", "時点", "作物", "P：太平洋側"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 大雨や雷の極端現象を調べる資料で、暖候期と寒候期の平均降水配分や気温条件を直接比較できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-546", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 一か月の極端な値はその年の天候の特徴であり、地域の年間の平均的な気候区分を判断する資料として不足する。」", "options": ["選択肢4", "前期", "作物X", "選択肢1"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 一か月の極端な値はその年の天候の特徴であり、地域の年間の平均的な気候区分を判断する資料として不足する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-547", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 夏に少雨となるPが西岸型、夏雨のQが東岸型である。水分不足の方向はよいが、東西の配置が逆である。」", "options": ["選択肢1", "18〜24歳", "P 西側", "細かい火山灰"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 夏に少雨となるPが西岸型、夏雨のQが東岸型である。水分不足の方向はよいが、東西の配置が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-548", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは冬雨・夏乾燥、Qは夏雨であり、この緯度帯の西岸と東岸の典型に対応する。同程度の夏の気温なら少雨のPで季節的な不足が大きくなりやすい。」", "options": ["選択肢2", "65歳以上", "最大流量", "気候帯"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pは冬雨・夏乾燥、Qは夏雨であり、この緯度帯の西岸と東岸の典型に対応する。同程度の夏の気温なら少雨のPで季節的な不足が大きくなりやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-549", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域対応も逆であり、年量が等しいことから季節の水分条件まで等しいとすることもできない。」", "options": ["選択肢3", "海外就労者から家族への送金", "放牧地", "共通テスト"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 地域対応も逆であり、年量が等しいことから季節の水分条件まで等しいとすることもできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-550", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域対応は正しいが、年量が同じでも夏の降水量は大きく違う。暖かい時期に雨が少ないPで不足が生じやすい。」", "options": ["選択肢4", "店舗", "選択肢1", "河川がつくる地形"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 地域対応は正しいが、年量が同じでも夏の降水量は大きく違う。暖かい時期に雨が少ないPで不足が生じやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-551", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Xは320≦450＜640なのでBS、Yは450≧240なので非Bである。高温ほど蒸発散の可能量が大きくなりやすく、同じ雨量でも水分条件は異なる。」", "options": ["選択肢1", "作物", "侵食", "エネルギー資源"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Xは320≦450＜640なのでBS、Yは450≧240なので非Bである。高温ほど蒸発散の可能量が大きくなりやすく、同じ雨量でも水分条件は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-552", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 X・Yの大小関係を逆にしている。一般に高温のほうが大気の水分要求が大きくなりやすい。」", "options": ["選択肢2", "時期", "地理総合，歴史総合，公共", "村落"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 X・Yの大小関係を逆にしている。一般に高温のほうが大気の水分要求が大きくなりやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-553", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 背景は合うが、Xの年量450mmはR/2＝320mm以上なので砂漠のBWではなくBSとなる。」", "options": ["選択肢3", "降水季節性", "熱帯（A）", "地球的課題"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 背景は合うが、Xの年量450mmはR/2＝320mm以上なので砂漠のBWではなくBSとなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-554", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年量は同じでも乾燥限界が異なる。降水量だけを固定した閾値で区分すると、気温による水分条件を見落とす。」", "options": ["選択肢4", "区分", "試験", "産業・資源・流通"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 年量は同じでも乾燥限界が異なる。降水量だけを固定した閾値で区分すると、気温による水分条件を見落とす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-555", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは年中多雨なので夏季乾燥の硬葉樹林と合わない。Rは夏も7℃で、タイガより高緯度側のツンドラに対応する。」", "options": ["選択肢1", "流通", "気候", "用語があいまい"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Pは年中多雨なので夏季乾燥の硬葉樹林と合わない。Rは夏も7℃で、タイガより高緯度側のツンドラに対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-556", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは年中高温多雨、Qは全月高温で長い冬の乾季、Rは最暖月7℃である。それぞれ熱帯雨林、サバナ、ツンドラの気候条件と対応する。」", "options": ["選択肢2", "最大流量", "その他", "地図"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pは年中高温多雨、Qは全月高温で長い冬の乾季、Rは最暖月7℃である。それぞれ熱帯雨林、サバナ、ツンドラの気候条件と対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-557", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは合うが、硬葉樹林は温帯の夏季乾燥に適応する植生でQの冬季乾燥と違う。Rは夏が森林成立に十分暖かくない。」", "options": ["選択肢3", "P：太平洋側", "エネルギー資源", "地表勾配"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pは合うが、硬葉樹林は温帯の夏季乾燥に適応する植生でQの冬季乾燥と違う。Rは夏が森林成立に十分暖かくない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-558", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Rは合うが、Pにはサバナを特徴づける明瞭な乾季がない。Qでは冬の長い乾季が熱帯雨林の連続的な生育を制約する。」", "options": ["選択肢4", "観光地", "人口", "12〜2月／6〜8月の各月降水量"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Rは合うが、Pにはサバナを特徴づける明瞭な乾季がない。Qでは冬の長い乾季が熱帯雨林の連続的な生育を制約する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-559", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 森林の極限付近では、夏の暖かさと生育期間の短さが樹木の生育を大きく制約する。冷帯のタイガからツンドラへの変化に対応する。」", "options": ["選択肢1", "周辺部", "図法", "さらに下"], "ans": 0, "exp": "正解は「選択肢1」です。正解 森林の極限付近では、夏の暖かさと生育期間の短さが樹木の生育を大きく制約する。冷帯のタイガからツンドラへの変化に対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-560", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 冬の寒さも関係するが、厳寒に耐える針葉樹もある。森林の北限を考える中心的な手掛かりは夏の暖かさである。」", "options": ["選択肢2", "選択肢4", "調査対象", "産地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 冬の寒さも関係するが、厳寒に耐える針葉樹もある。森林の北限を考える中心的な手掛かりは夏の暖かさである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-561", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 水分は植生に重要だが、ここでは高緯度へ向かう森林限界の問題である。年量と一日の大雨だけでは夏の低温を捉えられない。」", "options": ["選択肢3", "侵食", "気候・自然環境", "原料炭"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 水分は植生に重要だが、ここでは高緯度へ向かう森林限界の問題である。年量と一日の大雨だけでは夏の低温を捉えられない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-562", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 降雪や日照も関係しうるが、冬だけの指標では生育期の熱の不足を直接比較できない。」", "options": ["選択肢4", "科目名", "A年", "時点"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 降雪や日照も関係しうるが、冬だけの指標では生育期の熱の不足を直接比較できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-563", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 赤道低地に冬の低温への適応を置く点も、地中海沿岸の特徴を夏緑樹の冬落葉とする点も合わない。」", "options": ["選択肢1", "系統地理", "2択から決められない", "25〜39歳"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 赤道低地に冬の低温への適応を置く点も、地中海沿岸の特徴を夏緑樹の冬落葉とする点も合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-564", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aの小さく硬い葉は夏の水分損失を抑える適応と関係する。Bの夏緑樹の落葉は冬の低温期を越す性質で、温帯の異なる制約を示す。」", "options": ["選択肢2", "気候帯", "地図", "住宅地"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Aの小さく硬い葉は夏の水分損失を抑える適応と関係する。Bの夏緑樹の落葉は冬の低温期を越す性質で、温帯の異なる制約を示す。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-565", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域例は合うが、Aは夏の乾燥、Bは冬の低温という制約を逆にしている。」", "options": ["選択肢3", "温帯（C）", "データ", "時期"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 地域例は合うが、Aは夏の乾燥、Bは冬の低温という制約を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-566", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの適応の説明は合うが、年中多雨の赤道低地は夏季乾燥の典型ではない。Bの冬季落葉の例を地中海性気候の代表にするのも合わない。」", "options": ["選択肢4", "試験", "堆積物", "P 西側"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aの適応の説明は合うが、年中多雨の赤道低地は夏季乾燥の典型ではない。Bの冬季落葉の例を地中海性気候の代表にするのも合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-567", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 高温と豊富な水分は化学的風化を進め、溶けやすい成分を運び出す。残りやすい酸化物が赤色などに関係する。」", "options": ["選択肢1", "私大（一般選抜）", "1日目", "時刻"], "ans": 0, "exp": "正解は「選択肢1」です。正解 高温と豊富な水分は化学的風化を進め、溶けやすい成分を運び出す。残りやすい酸化物が赤色などに関係する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-568", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 可溶性塩類の集積は乾燥地域で水が蒸発しやすい条件と関係する。多雨で溶脱が進む資料の条件とは逆である。」", "options": ["選択肢2", "プレート境界", "時刻帯", "周辺部"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 可溶性塩類の集積は乾燥地域で水が蒸発しやすい条件と関係する。多雨で溶脱が進む資料の条件とは逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-569", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 灰白色の溶脱層と下方の集積はポドゾル化の特徴である。提示された深い赤色の風化層とは形成過程が違う。」", "options": ["選択肢3", "海岸の地形", "乾季（11〜3月）", "低い平均気温"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 灰白色の溶脱層と下方の集積はポドゾル化の特徴である。提示された深い赤色の風化層とは形成過程が違う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-570", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 草の根に由来する厚い黒色腐植層はチェルノーゼムなどの草原土壌に対応する。深い赤色風化層の主な説明とは異なる。」", "options": ["選択肢4", "主要作物の栽培条件と主産地", "期間", "地理総合"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 草の根に由来する厚い黒色腐植層はチェルノーゼムなどの草原土壌に対応する。深い赤色風化層の主な説明とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-571", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 草原の腐植形成の説明は合うが、ラトソルは湿潤熱帯の強い化学的風化・溶脱を特徴とする土壌で、観察地点の名称と合わない。」", "options": ["選択肢1", "エネルギー資源", "原料炭", "試験"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 草原の腐植形成の説明は合うが、ラトソルは湿潤熱帯の強い化学的風化・溶脱を特徴とする土壌で、観察地点の名称と合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-572", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 中緯度草原の根などに由来する有機物と、分解・溶脱の条件により、腐植の多い厚い黒色表層が形成される。チェルノーゼムの特徴である。」", "options": ["選択肢2", "工業の変化", "輸送機関", "大地形"], "ans": 0, "exp": "正解は「選択肢2」です。正解 中緯度草原の根などに由来する有機物と、分解・溶脱の条件により、腐植の多い厚い黒色表層が形成される。チェルノーゼムの特徴である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-573", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 名称と過程の組合せ自体は湿潤熱帯の土壌として整合するが、設問は中緯度草原の厚い黒色腐植層を示している。地域と観察条件に合わない。」", "options": ["選択肢3", "都市", "前期", "林業・水産業"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 名称と過程の組合せ自体は湿潤熱帯の土壌として整合するが、設問は中緯度草原の厚い黒色腐植層を示している。地域と観察条件に合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-574", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 土壌名は合うが、示した過程は湿潤熱帯の赤色土壌の特徴である。チェルノーゼムの黒色表層では鉄の酸化物より腐植の蓄積に着目する。」", "options": ["選択肢4", "生活文化", "40〜64歳", "都市"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 土壌名は合うが、示した過程は湿潤熱帯の赤色土壌の特徴である。チェルノーゼムの黒色表層では鉄の酸化物より腐植の蓄積に着目する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-575", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 ラトソルの主な特徴は湿潤熱帯の強い風化・溶脱である。草原の腐植形成とポドゾルの灰白色層を混ぜている。」", "options": ["選択肢1", "地形図", "地区", "GIS"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 ラトソルの主な特徴は湿潤熱帯の強い風化・溶脱である。草原の腐植形成とポドゾルの灰白色層を混ぜている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-576", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 移動の説明は合うが、チェルノーゼムは中緯度草原の厚い黒色腐植層が特徴で、この灰白色層との対応とは違う。」", "options": ["選択肢2", "調査対象", "作物", "気候・自然環境"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 移動の説明は合うが、チェルノーゼムは中緯度草原の厚い黒色腐植層が特徴で、この灰白色層との対応とは違う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-577", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 灰白色の溶脱層と、その下の有機物・鉄などの集積層はポドゾルの特徴である。水による上から下への物質移動と対応する。」", "options": ["選択肢3", "利益相反の有無", "作物X", "今の状態"], "ans": 0, "exp": "正解は「選択肢3」です。正解 灰白色の溶脱層と、その下の有機物・鉄などの集積層はポドゾルの特徴である。水による上から下への物質移動と対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-578", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 土壌名は合うが、塩類が上昇して表層に集まる説明は乾燥地域などの塩類集積である。資料の上層溶脱・下層集積と逆向きになる。」", "options": ["選択肢4", "産業・資源・流通", "P 西側", "斜面"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 土壌名は合うが、塩類が上昇して表層に集まる説明は乾燥地域などの塩類集積である。資料の上層溶脱・下層集積と逆向きになる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-579", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qの説明は合うが、Pの黒色は腐植と関係する。塩類の表層集積は乾燥地などでみられ、黒色腐植層を説明する過程ではない。」", "options": ["選択肢1", "防災・環境・地域調査", "最大流量", "位置"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Qの説明は合うが、Pの黒色は腐植と関係する。塩類の表層集積は乾燥地などでみられ、黒色腐植層を説明する過程ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-580", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの説明は合うが、Qは高い地下水位で酸素が乏しい条件である。鉄の酸化による赤褐色化と還元による灰色化を逆にしている。」", "options": ["選択肢2", "今の状態", "放牧地", "標高データ"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pの説明は合うが、Qは高い地下水位で酸素が乏しい条件である。鉄の酸化による赤褐色化と還元による灰色化を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-581", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 火山灰由来の鉱物は有機物を保持し、黒い表層の形成に関係する。排水不良で酸素が乏しい低地では、鉄が還元され灰色を示す土層ができやすい。」", "options": ["選択肢3", "2択から決められない", "選択肢1", "時刻帯"], "ans": 0, "exp": "正解は「選択肢3」です。正解 火山灰由来の鉱物は有機物を保持し、黒い表層の形成に関係する。排水不良で酸素が乏しい低地では、鉄が還元され灰色を示す土層ができやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-582", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは腐植の保持、Qは排水不良に伴う還元が適切である。乾燥地の塩類集積と排水良好な場所の酸化をそれぞれ当てはめている。」", "options": ["選択肢4", "メッシュ", "侵食", "総労働時間"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pは腐植の保持、Qは排水不良に伴う還元が適切である。乾燥地の塩類集積と排水良好な場所の酸化をそれぞれ当てはめている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-583", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 凍結した層は一般に下向きの浸透を妨げる側に働く。水を通しやすいため上昇し続けるという説明ではない。」", "options": ["選択肢1", "領域", "地理総合，歴史総合，公共", "鉄鉱石"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 凍結した層は一般に下向きの浸透を妨げる側に働く。水を通しやすいため上昇し続けるという説明ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-584", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 表層が融けても、深部の地温は0℃以下に保たれている。表層と深部の状態を区別する必要がある。」", "options": ["選択肢2", "候補", "熱帯（A）", "100,000人"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 表層が融けても、深部の地温は0℃以下に保たれている。表層と深部の状態を区別する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-585", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 夏に融ける活動層の下には永久凍土が残る。平坦な場所では下方への排水が制約され、融雪水や降水が表層にたまりやすい。」", "options": ["選択肢3", "地表勾配", "試験", "18〜24歳"], "ans": 0, "exp": "正解は「選択肢3」です。正解 夏に融ける活動層の下には永久凍土が残る。平坦な場所では下方への排水が制約され、融雪水や降水が表層にたまりやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-586", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 毎年融けるのは活動層であり、永久凍土は少なくとも2年連続で0℃以下の地盤を指す。」", "options": ["選択肢4", "堆積物", "気候", "地区"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 毎年融けるのは活動層であり、永久凍土は少なくとも2年連続で0℃以下の地盤を指す。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-587", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 7月という計算は合うが、地中海沿岸の夏の不足を冬の多雨で説明することはできない。」", "options": ["選択肢1", "標高データ", "その他", "C（中国沿海部）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 7月という計算は合うが、地中海沿岸の夏の不足を冬の多雨で説明することはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-588", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 5月末80mm、6月末10mm、7月は10＋40−170＝−120mmとなり初めて不足が生じる。夏の乾燥と高い蒸発散要求が原因である。」", "options": ["選択肢2", "2日目", "エネルギー資源", "区分"], "ans": 0, "exp": "正解は「選択肢2」です。正解 5月末80mm、6月末10mm、7月は10＋40−170＝−120mmとなり初めて不足が生じる。夏の乾燥と高い蒸発散要求が原因である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-589", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 6月のP−Eは−70mmだが、5月からの80mmがあるので月末10mm残る。月の収支が負でも直ちに不足とはならない。」", "options": ["選択肢3", "山頂", "人口", "総流出量"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 6月のP−Eは−70mmだが、5月からの80mmがあるので月末10mm残る。月の収支が負でも直ちに不足とはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-590", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 7月に貯留が尽きるので8月を待たない。気温低下は蒸発散を減らす方向であり、不足開始の原因とは逆である。」", "options": ["選択肢4", "地表からの深さ（m）", "図法", "中心部"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 7月に貯留が尽きるので8月を待たない。気温低下は蒸発散を減らす方向であり、不足開始の原因とは逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-591", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 昼の長さは合うが、北半球では6月に太陽の南中高度も高い。二つの効果がともに夏の日射を増やす。」", "options": ["選択肢1", "乾季（11〜3月）", "調査対象", "侵食"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 昼の長さは合うが、北半球では6月に太陽の南中高度も高い。二つの効果がともに夏の日射を増やす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-592", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南中高度がQで低い点は合うが、昼の長さもQのほうが短い。日射の二つの要素を別の季節にしている。」", "options": ["選択肢2", "産地", "気候・自然環境", "地誌"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 南中高度がQで低い点は合うが、昼の長さもQのほうが短い。日射の二つの要素を別の季節にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-593", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 6月の南半球は冬側なので、同じ絶対緯度ならQの昼は短く太陽高度も低い。」", "options": ["選択肢3", "方式", "A年", "寒帯（E）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 6月の南半球は冬側なので、同じ絶対緯度ならQの昼は短く太陽高度も低い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-594", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 6月には北半球が太陽に向く側へ傾くため、同じ絶対緯度なら北半球のPが長い昼と高い南中高度をもつ。」", "options": ["選択肢4", "鉄鉱石", "2択から決められない", "プレート境界"], "ans": 0, "exp": "正解は「選択肢4」です。正解 6月には北半球が太陽に向く側へ傾くため、同じ絶対緯度なら北半球のPが長い昼と高い南中高度をもつ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-595", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 これは貿易風が強まるラニーニャ時の方向に近い。表は東風が弱いことと中・東部の高水温を示している。」", "options": ["選択肢1", "拠点", "地図", "食料問題"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 これは貿易風が強まるラニーニャ時の方向に近い。表は東風が弱いことと中・東部の高水温を示している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-596", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 東風が弱まると西へ暖水を寄せる働きが弱まり、暖水が東へ広がる。東部の湧昇も弱まり、対流の活発な海域が東へ移るというエルニーニョの典型と合う。」", "options": ["選択肢2", "輸送機関", "データ", "人口"], "ans": 0, "exp": "正解は「選択肢2」です。正解 東風が弱まると西へ暖水を寄せる働きが弱まり、暖水が東へ広がる。東部の湧昇も弱まり、対流の活発な海域が東へ移るというエルニーニョの典型と合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-597", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 貿易風は平常時に海水を西へ押す。向きが逆であり、表の東部高水温は冷水湧昇の強化とも合わない。」", "options": ["選択肢3", "10年前", "堆積物", "地形図"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 貿易風は平常時に海水を西へ押す。向きが逆であり、表の東部高水温は冷水湧昇の強化とも合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-598", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 東への暖水の広がりは東部の高水温に関係する。海面水温低下と対流弱化という部分が表の状態とは逆になる。」", "options": ["選択肢4", "後期", "1日目", "地図・GIS・地形"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 東への暖水の広がりは東部の高水温に関係する。海面水温低下と対流弱化という部分が表の状態とは逆になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-599", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは合うが、Qの斜面の差は地形性上昇、Rの境界付近の広域雨は前線性上昇と対応する。」", "options": ["選択肢1", "25〜39歳", "時刻帯", "B年"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Pは合うが、Qの斜面の差は地形性上昇、Rの境界付近の広域雨は前線性上昇と対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-600", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは合うが、Pに継続的な寒暖気団の境界は示されず、Rには前線の停滞が与えられている。対流性と前線性を逆にしている。」", "options": ["選択肢2", "出国前の20〜39歳人口", "乾季（11〜3月）", "メッシュ"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Qは合うが、Pに継続的な寒暖気団の境界は示されず、Rには前線の停滞が与えられている。対流性と前線性を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-601", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは赤道低地の午後の加熱による対流、Qは海からの風を受ける斜面の地形性上昇、Rは暖気と寒気の境界に沿う前線性上昇が主な説明となる。」", "options": ["選択肢3", "地区", "期間", "データ"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Pは赤道低地の午後の加熱による対流、Qは海からの風を受ける斜面の地形性上昇、Rは暖気と寒気の境界に沿う前線性上昇が主な説明となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-602", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Rは合うが、Pは低地で午後に発達する対流、Qは山地の風上という地形条件が主要な手掛かりである。」", "options": ["選択肢4", "バス", "原料炭", "現在の地図"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Rは合うが、Pは低地で午後に発達する対流、Qは山地の風上という地形条件が主要な手掛かりである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-603", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 用水を確保しても水稲の生育に必要な温度の制約は残る。熱帯低地の二期作を、冬の冷涼な地域へそのまま当てはめている。」", "options": ["選択肢1", "A（日本）", "輸送機関", "山頂"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 用水を確保しても水稲の生育に必要な温度の制約は残る。熱帯低地の二期作を、冬の冷涼な地域へそのまま当てはめている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-604", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 米は高温と十分な水を要し、小麦の成熟・収穫には比較的乾燥した条件が適する。高温多雨と冬の低温への対応が逆である。」", "options": ["選択肢2", "主要河川", "前期", "農場"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 米は高温と十分な水を要し、小麦の成熟・収穫には比較的乾燥した条件が適する。高温多雨と冬の低温への対応が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-605", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 小麦は水田稲作のような湛水栽培を行う作物ではない。米と麦の水条件を取り違えている。」", "options": ["選択肢3", "産業", "40〜64歳", "地域"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 小麦は水田稲作のような湛水栽培を行う作物ではない。米と麦の水条件を取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-606", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 夏季の高温と季節風の雨を水田稲作に利用し、冬は比較的冷涼な条件で小麦を作る。冬の少雨にはかんがいが重要となる。」", "options": ["選択肢4", "P 西側", "地区", "輸送機関"], "ans": 0, "exp": "正解は「選択肢4」です。正解 夏季の高温と季節風の雨を水田稲作に利用し、冬は比較的冷涼な条件で小麦を作る。冬の少雨にはかんがいが重要となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-607", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 棚田では斜面を段状にして水平な田面と畦で水を保つ。後背湿地は自然堤防より低く、排水が悪いことが多い。」", "options": ["選択肢1", "河川水面と排水口の高低", "作物", "年齢層"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 棚田では斜面を段状にして水平な田面と畦で水を保つ。後背湿地は自然堤防より低く、排水が悪いことが多い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-608", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 棚田の説明は正しいが、後背湿地の細粒土は透水性が低く、周囲より低い位置とも重なって排水不良になりやすい。」", "options": ["選択肢2", "総流出量", "作物X", "海外就労者から家族への送金"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 棚田の説明は正しいが、後背湿地の細粒土は透水性が低く、周囲より低い位置とも重なって排水不良になりやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-609", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 水田には湛水のための畦などが必要で、地下水位が低いことだけでは水を保てない。畑地は一般に低湿な後背湿地より自然堤防の排水条件が有利である。」", "options": ["選択肢3", "Q：日本海側", "P 西側", "A（日本）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 水田には湛水のための畦などが必要で、地下水位が低いことだけでは水を保てない。畑地は一般に低湿な後背湿地より自然堤防の排水条件が有利である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-610", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 棚田は斜面に平坦面を設けて湛水する。沖積低地では自然堤防は比較的排水がよく、後背湿地は低湿になる。」", "options": ["選択肢4", "計画", "最大流量", "出荷先"], "ans": 0, "exp": "正解は「選択肢4」です。正解 棚田は斜面に平坦面を設けて湛水する。沖積低地では自然堤防は比較的排水がよく、後背湿地は低湿になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-611", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 土地生産性と労働生産性の大小がともに逆である。Pの単収が高いことを労働の効率と取り違えている。」", "options": ["選択肢1", "選択肢2", "放牧地", "最大流量"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 土地生産性と労働生産性の大小がともに逆である。Pの単収が高いことを労働の効率と取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-612", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの単収は6t/haで高いが、労働1時間当たりは0.01tでQの0.04tより低い。面積当たりと労働当たりは別の尺度である。」", "options": ["選択肢2", "P–Q", "選択肢1", "計画"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pの単収は6t/haで高いが、労働1時間当たりは0.01tでQの0.04tより低い。面積当たりと労働当たりは別の尺度である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-613", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは60÷10＝6t/ha、Qは400÷100＝4t/ha。労働生産性はPが0.01t/時、Qが0.04t/時で、Qの省力的な経営と整合する。」", "options": ["選択肢3", "低い平均気温", "侵食", "徒歩分析"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Pは60÷10＝6t/ha、Qは400÷100＝4t/ha。労働生産性はPが0.01t/時、Qが0.04t/時で、Qの省力的な経営と整合する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-614", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは単収が低く、労働投入も100時間/haでPの600時間/haより少ない。規模が大きいだけで全指標は高くならない。」", "options": ["選択肢4", "地理総合，地理探究", "地理総合，歴史総合，公共", "系統地理"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Qは単収が低く、労働投入も100時間/haでPの600時間/haより少ない。規模が大きいだけで全指標は高くならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-615", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xでは水稲を年2回収穫しない。Yの乾季作も水稲であり、作物の区別を確認する必要がある。」", "options": ["選択肢1", "地誌", "熱帯（A）", "冷帯（D）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Xでは水稲を年2回収穫しない。Yの乾季作も水稲であり、作物の区別を確認する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-616", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xの冬作は小麦である。温帯では冬の低温が水稲栽培を制約し、小麦などの裏作と組み合わせる。」", "options": ["選択肢2", "熱帯（A）", "試験", "気候"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Xの冬作は小麦である。温帯では冬の低温が水稲栽培を制約し、小麦などの裏作と組み合わせる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-617", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xは水稲と小麦という異なる作物なので二毛作。Yは水稲を二度作る二期作で、呼び方が逆である。」", "options": ["選択肢3", "冷帯（D）", "気候", "主要作物の栽培条件と主産地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Xは水稲と小麦という異なる作物なので二毛作。Yは水稲を二度作る二期作で、呼び方が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-618", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Xは異なる二作物の二毛作、Yは同一作物の二期作である。Yの乾季作には高温に加え用水確保が必要となる。」", "options": ["選択肢4", "共通テスト", "その他", "主な工業"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Xは異なる二作物の二毛作、Yは同一作物の二期作である。Yの乾季作には高温に加え用水確保が必要となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-619", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 冬小麦の説明は合うが、夏の乾燥下で根域への供給を減らすほど収量が高まるとはいえない。節水は不要な損失を減らし必要な水を供給することである。」", "options": ["選択肢1", "地形", "エネルギー資源", "時差"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 冬小麦の説明は合うが、夏の乾燥下で根域への供給を減らすほど収量が高まるとはいえない。節水は不要な損失を減らし必要な水を供給することである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-620", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 冬小麦の季節は合っているが、点滴かんがいは主に根域へ少量ずつ送水する方式である。地表全体を湿らせる散水と区別する。」", "options": ["選択肢2", "大地形", "人口", "利益相反の有無"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 冬小麦の季節は合っているが、点滴かんがいは主に根域へ少量ずつ送水する方式である。地表全体を湿らせる散水と区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-621", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地中海沿岸では一般に冬に降水が多く、夏に乾燥する。東アジアの季節風地域の季節性を当てはめている。」", "options": ["選択肢3", "その他", "図法", "A年"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 地中海沿岸では一般に冬に降水が多く、夏に乾燥する。東アジアの季節風地域の季節性を当てはめている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-622", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 冬の降水は冬小麦の生育を支える。夏作の野菜は乾燥期に水が必要となり、根域へ送水する方法は節水につながる。」", "options": ["選択肢4", "食料問題", "調査対象", "答えを見れば分かる"], "ans": 0, "exp": "正解は「選択肢4」です。正解 冬の降水は冬小麦の生育を支える。夏作の野菜は乾燥期に水が必要となり、根域へ送水する方法は節水につながる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-623", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 分母を耕地面積にすると土地生産性は上がる。1作当たりの収量が上がったのではなく年間の延べ作付が増えた。」", "options": ["選択肢1", "鉱産資源", "気候・自然環境", "候補"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 分母を耕地面積にすると土地生産性は上がる。1作当たりの収量が上がったのではなく年間の延べ作付が増えた。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-624", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 耕地は100haで変わらない。延べ作付面積の増加を、新たに開墾した土地の面積と混同している。」", "options": ["選択肢2", "主な工業", "A年", "旧版地図"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 耕地は100haで変わらない。延べ作付面積の増加を、新たに開墾した土地の面積と混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-625", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 延べ作付面積÷耕地面積は100％から150％へ上がる。土地の年間利用度は低下ではなく上昇している。」", "options": ["選択肢3", "村落", "2択から決められない", "雲底"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 延べ作付面積÷耕地面積は100％から150％へ上がる。土地の年間利用度は低下ではなく上昇している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-626", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 耕地1ha当たり収穫量は5tから7.5tに増える。一方、延べ作付面積当たりは両年5tで、作付回数の増加が総収穫を押し上げている。」", "options": ["選択肢4", "図法", "地図", "乾季（11〜3月）"], "ans": 0, "exp": "正解は「選択肢4」です。正解 耕地1ha当たり収穫量は5tから7.5tに増える。一方、延べ作付面積当たりは両年5tで、作付回数の増加が総収穫を押し上げている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-627", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは自給粗飼料の基盤が広い北海道東部、Qは飲用乳の需要地に近い大都市近郊に対応する。」", "options": ["選択肢1", "GIS", "データ", "時間帯"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Pは自給粗飼料の基盤が広い北海道東部、Qは飲用乳の需要地に近い大都市近郊に対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-628", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qの飲用向けは90％でPより高い。市場への近さと保存・流通条件を読むべきで、夏の冷涼さに結び付けるのは不適切。」", "options": ["選択肢2", "調査方法", "堆積物", "貨物"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Qの飲用向けは90％でPより高い。市場への近さと保存・流通条件を読むべきで、夏の冷涼さに結び付けるのは不適切。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-629", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは狭い飼料作物面積と高い購入飼料依存を示す。北海道の草地基盤の広さを説明したことにはならない。」", "options": ["選択肢3", "地図・GIS・地形", "1日目", "後期"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Qは狭い飼料作物面積と高い購入飼料依存を示す。北海道の草地基盤の広さを説明したことにはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-630", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは飼料作物面積が広く、市場からも遠いので北海道東部に対応する。大都市近郊は土地確保が制約されやすい。」", "options": ["選択肢4", "人口・都市・生活文化", "時刻帯", "海外へ出国した20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pは飼料作物面積が広く、市場からも遠いので北海道東部に対応する。大都市近郊は土地確保が制約されやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-631", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは冬春の温暖さ、Qは夏の冷涼さを利用する。大市場から遠くても出荷時期をずらすことと輸送網により園芸産地が成り立つ。」", "options": ["選択肢1", "A年", "乾季（11〜3月）", "作物"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Pは冬春の温暖さ、Qは夏の冷涼さを利用する。大市場から遠くても出荷時期をずらすことと輸送網により園芸産地が成り立つ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-632", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qの距離は250km、Rは30kmなので近郊はRに対応する。Qの夏季出荷には冷涼な気候が関わる。」", "options": ["選択肢2", "用語があいまい", "期間", "産業"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Qの距離は250km、Rは30kmなので近郊はRに対応する。Qの夏季出荷には冷涼な気候が関わる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-633", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 P・QはRより市場から遠い。距離だけでは月別出荷の違いを説明できず、気候と栽培施設を見る必要がある。」", "options": ["選択肢3", "時間が足りない", "原料炭", "指標"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 P・QはRより市場から遠い。距離だけでは月別出荷の違いを説明できず、気候と栽培施設を見る必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-634", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 冬春に出荷するPは温暖な沿岸で保温・加温を利用する促成的な作型に対応する。高冷地は夏季の出荷が典型となる。」", "options": ["選択肢4", "斜面", "輸送機関", "観光地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 冬春に出荷するPは温暖な沿岸で保温・加温を利用する促成的な作型に対応する。高冷地は夏季の出荷が典型となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-635", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは輸送費が20小さいが暖房費が40大きい。市場への近さだけでなくエネルギー費との合計を比べる必要がある。」", "options": ["選択肢1", "Pからの水平距離", "前期", "P–Q"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Qは輸送費が20小さいが暖房費が40大きい。市場への近さだけでなくエネルギー費との合計を比べる必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-636", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pが有利という結論は同じでも、輸送費は変わっていない。増えたのは暖房費の差で、気候条件の影響は大きくなっている。」", "options": ["選択肢2", "データ", "40〜64歳", "地理総合，歴史総合，公共"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pが有利という結論は同じでも、輸送費は変わっていない。増えたのは暖房費の差で、気候条件の影響は大きくなっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-637", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの輸送費はQより高く、暖房費も倍増している。どちらの費用も小さいという説明は表に合わない。」", "options": ["選択肢3", "礫・砂・泥の割合", "地区", "温帯（C）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pの輸送費はQより高く、暖房費も倍増している。どちらの費用も小さいという説明は表に合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-638", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 燃料費倍増後の計はPが20＋30＝50、Qが60＋10＝70。温暖地の暖房費の優位が輸送費の不利を上回る。」", "options": ["選択肢4", "旧版地図", "作物", "地形"], "ans": 0, "exp": "正解は「選択肢4」です。正解 燃料費倍増後の計はPが20＋30＝50、Qが60＋10＝70。温暖地の暖房費の優位が輸送費の不利を上回る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-639", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 輸入品の値上がりは同じ輸出収入で買える量を減らす。輸出価格低下と逆方向に相殺するものではない。」", "options": ["選択肢1", "12〜2月／6〜8月の各月降水量", "作物X", "ホイットルセイの農業地域区分"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 輸入品の値上がりは同じ輸出収入で買える量を減らす。輸出価格低下と逆方向に相殺するものではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-640", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 輸出収入は80×0.8＋20＝84。穀物価格は1.25倍なので、購入可能量は84÷1.25＝67.2となる。」", "options": ["選択肢2", "3日目", "P 西側", "工業の変化"], "ans": 0, "exp": "正解は「選択肢2」です。正解 輸出収入は80×0.8＋20＝84。穀物価格は1.25倍なので、購入可能量は84÷1.25＝67.2となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-641", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 20％下落するのは輸出全体ではなくコーヒー部分だけ。また輸入穀物の価格上昇も購買力に影響する。」", "options": ["選択肢3", "時刻帯", "最大流量", "図法"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 20％下落するのは輸出全体ではなくコーヒー部分だけ。また輸入穀物の価格上昇も購買力に影響する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-642", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 コーヒー収入は80から64になるが、その他20を加えると輸出全体は84。さらに輸入価格が上がるため64％ではない。」", "options": ["選択肢4", "季節", "放牧地", "情報の限界"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 コーヒー収入は80から64になるが、その他20を加えると輸出全体は84。さらに輸入価格が上がるため64％ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-643", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 購入飼料は家畜を通して農場へ窒素を持ち込む。肥料投入が不変なので、購入飼料の増加だけでは余剰は解消しない。」", "options": ["選択肢1", "農場", "選択肢2", "防災・環境・地域調査"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 購入飼料は家畜を通して農場へ窒素を持ち込む。肥料投入が不変なので、購入飼料の増加だけでは余剰は解消しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-644", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 堆肥は農場内部の循環であり、外から入る窒素を減らすわけではない。外部投入と外部搬出の差を見る必要がある。」", "options": ["選択肢2", "林齢構成", "侵食", "時間が足りない"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 堆肥は農場内部の循環であり、外から入る窒素を減らすわけではない。外部投入と外部搬出の差を見る必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-645", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 表に示す投入は50から70、農産物による搬出は35で不変なので、その差は15から35へ増える。堆肥の内部循環があっても、外部投入に応じた養分管理が必要である。」", "options": ["選択肢3", "時間帯", "地理総合，歴史総合，公共", "地点"], "ans": 0, "exp": "正解は「選択肢3」です。正解 表に示す投入は50から70、農産物による搬出は35で不変なので、その差は15から35へ増える。堆肥の内部循環があっても、外部投入に応じた養分管理が必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-646", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 購入飼料に含まれる窒素の一部は排せつ物になる。表では畜産物などによる搬出量は変わっていない。」", "options": ["選択肢4", "原料炭", "熱帯（A）", "堆積物"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 購入飼料に含まれる窒素の一部は排せつ物になる。表では畜産物などによる搬出量は変わっていない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-647", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 利用間隔は短くなる。再利用の頻度が増すことと、十分な植生が育つ前に焼くことが地力に影響する。」", "options": ["選択肢1", "用地", "試験", "3日目"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 利用間隔は短くなる。再利用の頻度が増すことと、十分な植生が育つ前に焼くことが地力に影響する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-648", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 休閑中には植生の再生や有機物の供給が進む。収穫をしないことを養分回復に無意味と捉えるのは誤り。」", "options": ["選択肢2", "100,000人", "気候", "雨季（6〜9月）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 休閑中には植生の再生や有機物の供給が進む。収穫をしないことを養分回復に無意味と捉えるのは誤り。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-649", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 1回の作付け年数は同じでも、再び使うまでの周期は14年から5年へ短くなるので、土地利用は強まる。」", "options": ["選択肢3", "現在", "その他", "方式"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 1回の作付け年数は同じでも、再び使うまでの周期は14年から5年へ短くなるので、土地利用は強まる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-650", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 作付け割合は2/14から2/5へ増える。休閑中に植生や有機物が回復する時間が減り、従来の循環を維持しにくくなる。」", "options": ["選択肢4", "年齢層", "エネルギー資源", "用地"], "ans": 0, "exp": "正解は「選択肢4」です。正解 作付け割合は2/14から2/5へ増える。休閑中に植生や有機物が回復する時間が減り、従来の循環を維持しにくくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-651", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 塩類の供給経路は合っているが、地下水位を高く保つと毛管上昇が起こりやすく、蒸発による地表の塩類集積を助長する。」", "options": ["選択肢1", "40〜64歳", "人口", "前期"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 塩類の供給経路は合っているが、地下水位を高く保つと毛管上昇が起こりやすく、蒸発による地表の塩類集積を助長する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-652", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 塩を含むかんがい水も供給源となるが、排水不良のまま水を増やすと地下水位がさらに上がる。洗脱には塩を含む水が根域外へ排出される経路が必要である。」", "options": ["選択肢2", "海外へ出国した20〜39歳人口", "図法", "出国前の20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 塩を含むかんがい水も供給源となるが、排水不良のまま水を増やすと地下水位がさらに上がる。洗脱には塩を含む水が根域外へ排出される経路が必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-653", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 浅い地下水から水が上昇し、蒸発で塩類が地表付近に残る。排水によって地下水位を管理し、必要な洗脱も検討する。」", "options": ["選択肢3", "住宅地", "調査対象", "区域"], "ans": 0, "exp": "正解は「選択肢3」です。正解 浅い地下水から水が上昇し、蒸発で塩類が地表付近に残る。排水によって地下水位を管理し、必要な洗脱も検討する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-654", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 毛管上昇と溶脱では水の移動方向が異なる。強い蒸発は塩を水とともに除くのではなく、地表付近に残す働きを持つ。」", "options": ["選択肢4", "区域", "気候・自然環境", "降水季節性"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 毛管上昇と溶脱では水の移動方向が異なる。強い蒸発は塩を水とともに除くのではなく、地表付近に残す働きを持つ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-655", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 取水は100から60なので40減る。流域の水消費は取水から再利用可能な戻り水を差し引いて求める。」", "options": ["選択肢1", "C（中国沿海部）", "A年", "河川水面と排水口の高低"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 取水は100から60なので40減る。流域の水消費は取水から再利用可能な戻り水を差し引いて求める。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-656", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 取水は40減るが、下流へ戻る水も20減る。取水削減をそのまま流域全体の節水とみなすことはできない。」", "options": ["選択肢2", "作物X", "2択から決められない", "放牧地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 取水は40減るが、下流へ戻る水も20減る。取水削減をそのまま流域全体の節水とみなすことはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-657", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 後期の取水量60を削減量と取り違えている。節水量は変更前と変更後の差で判断する。」", "options": ["選択肢3", "出荷先", "地図", "選択肢4"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 後期の取水量60を削減量と取り違えている。節水量は変更前と変更後の差で判断する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-658", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 取水削減は100−60＝40。水消費は前期100−30＝70、後期60−10＝50で、削減は20となる。」", "options": ["選択肢4", "Q 東側", "データ", "地理総合，地理探究"], "ans": 0, "exp": "正解は「選択肢4」です。正解 取水削減は100−60＝40。水消費は前期100−30＝70、後期60−10＝50で、削減は20となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-659", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 熱量ベースはカロリーが重みである。金額が高い野菜でも、熱量の大きい穀物と同じ重みにはならない。」", "options": ["選択肢1", "指標", "堆積物", "乾燥帯（B）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 熱量ベースはカロリーが重みである。金額が高い野菜でも、熱量の大きい穀物と同じ重みにはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-660", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 数量が同じでも国産品の価格・付加価値が変われば国産生産額が変わる。熱量ベースとの違いを示している。」", "options": ["選択肢2", "時刻", "1日目", "私大（一般選抜）"], "ans": 0, "exp": "正解は「選択肢2」です。正解 数量が同じでも国産品の価格・付加価値が変われば国産生産額が変わる。熱量ベースとの違いを示している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-661", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 供給熱量ベースでは畜産物の飼料自給率を反映する。国内飼育の事実だけで国産熱量の全てになるわけではない。」", "options": ["選択肢3", "放牧地", "時刻帯", "その他"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 供給熱量ベースでは畜産物の飼料自給率を反映する。国内飼育の事実だけで国産熱量の全てになるわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-662", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 生産額は数量に加えて価格の影響を受ける。生産額ベースの上昇から熱量の同率増加は導けない。」", "options": ["選択肢4", "中心部", "乾季（11〜3月）", "工業立地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 生産額は数量に加えて価格の影響を受ける。生産額ベースの上昇から熱量の同率増加は導けない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-663", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 純増の計算は正しいが、若齢林は成長途上である。若齢林が多いことを、当面の大径材の供給力の高さと同一視できない。」", "options": ["選択肢1", "選択肢3", "期間", "生活文化"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 純増の計算は正しいが、若齢林は成長途上である。若齢林が多いことを、当面の大径材の供給力の高さと同一視できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-664", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 どちらも1,000−800＝200m³増えるが、供給に適する林齢の分布は異なる。Pで成熟林を伐った後の更新と、続いて伐採する林分の量が持続的供給の検討に必要である。」", "options": ["選択肢2", "徒歩分析", "原料炭", "調査方法"], "ans": 0, "exp": "正解は「選択肢2」です。正解 どちらも1,000−800＝200m³増えるが、供給に適する林齢の分布は異なる。Pで成熟林を伐った後の更新と、続いて伐採する林分の量が持続的供給の検討に必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-665", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 純増が正でも、伐採適齢の林分の不足や更新後の成長待ちが起こり得る。総量の収支条件だけでは年ごとの供給継続を保証しない。」", "options": ["選択肢3", "細かい火山灰", "輸送機関", "世界の諸地域・日本"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 純増が正でも、伐採適齢の林分の不足や更新後の成長待ちが起こり得る。総量の収支条件だけでは年ごとの供給継続を保証しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-666", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 純増200m³は成長1,000から伐採800を引いた量で、伐採可能量そのものではない。齢級の分散は供給の平準化に役立つが、この等式は成り立たない。」", "options": ["選択肢4", "地理総合，歴史総合，公共", "前期", "2択から決められない"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 純増200m³は成長1,000から伐採800を引いた量で、伐採可能量そのものではない。齢級の分散は供給の平準化に役立つが、この等式は成り立たない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-667", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 エルニーニョでは暖水が東へ広がる。冷たく栄養塩の多い水の湧昇が強まるなら、表の水温上昇・栄養塩低下とは整合しない。」", "options": ["選択肢1", "地理総合", "40〜64歳", "Pからの水平距離"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 エルニーニョでは暖水が東へ広がる。冷たく栄養塩の多い水の湧昇が強まるなら、表の水温上昇・栄養塩低下とは整合しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-668", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 ペルー沖の変化を偏西風の南下と寒流強化で説明するのは不適切。寒流・湧昇の強化なら表の水温上昇と整合しない。」", "options": ["選択肢2", "乾燥帯（B）", "地区", "地下水"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 ペルー沖の変化を偏西風の南下と寒流強化で説明するのは不適切。寒流・湧昇の強化なら表の水温上昇と整合しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-669", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 エルニーニョ時は東部赤道太平洋の暖水域の広がりや躍層の変化などで沿岸湧昇の栄養塩供給が弱まり、生産力が低下し得る。」", "options": ["選択肢3", "寒帯（E）", "作物", "2日目"], "ans": 0, "exp": "正解は「選択肢3」です。正解 エルニーニョ時は東部赤道太平洋の暖水域の広がりや躍層の変化などで沿岸湧昇の栄養塩供給が弱まり、生産力が低下し得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-670", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 強い湧昇は一般に冷たく栄養塩の多い水を表層へ供給する。表では温暖化と栄養塩低下が起きており、この説明とは逆。」", "options": ["選択肢4", "国公立二次（論述）", "作物X", "季節"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 強い湧昇は一般に冷たく栄養塩の多い水を表層へ供給する。表では温暖化と栄養塩低下が起きており、この説明とは逆。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-671", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海水交換が弱いと酸素供給も制約されやすい。有機物の分解による酸素消費に補給が追いつかない場合がある。」", "options": ["選択肢1", "気候", "P 西側", "期間"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 海水交換が弱いと酸素供給も制約されやすい。有機物の分解による酸素消費に補給が追いつかない場合がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-672", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Qは飼料を外から投入し、残餌やふんが沈む。弱い海水交換と重なることで、海底環境への負荷が増えやすい。」", "options": ["選択肢2", "河川がつくる地形", "最大流量", "拠点"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Qは飼料を外から投入し、残餌やふんが沈む。弱い海水交換と重なることで、海底環境への負荷が増えやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-673", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 カキでもふんや偽ふんが生じる。無給餌であることと、有機物が底に沈まないことは同じではない。」", "options": ["選択肢3", "ホイットルセイの農業地域区分", "放牧地", "現在"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 カキでもふんや偽ふんが生じる。無給餌であることと、有機物が底に沈まないことは同じではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-674", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 カキ養殖は通常、海中の植物プランクトンなどを利用する無給餌養殖である。魚類の給餌養殖と取り違えている。」", "options": ["選択肢4", "林業・水産業", "選択肢1", "65歳以上"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 カキ養殖は通常、海中の植物プランクトンなどを利用する無給餌養殖である。魚類の給餌養殖と取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-675", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 魚群探知機の改良は通常、魚群の発見と操業効率を高める方向に働く。漁獲効率の低下を直接引き起こしたとする説明は適切でない。」", "options": ["選択肢1", "工業立地", "侵食", "バス"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 魚群探知機の改良は通常、魚群の発見と操業効率を高める方向に働く。漁獲効率の低下を直接引き起こしたとする説明は適切でない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-676", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 隻日で割ると操業量の違いは調整できるが、1隻1日の漁獲能力の変化までは除けない。25％という低下率を資源量へそのまま移せない。」", "options": ["選択肢2", "人口", "地理総合，歴史総合，公共", "作物X"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 隻日で割ると操業量の違いは調整できるが、1隻1日の漁獲能力の変化までは除けない。25％という低下率を資源量へそのまま移せない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-677", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 1隻1日当たりは2tから1.5tへ下がる。総漁獲量の増加には操業努力の増加が含まれ、総量の大小だけで資源量の増減を決められない。」", "options": ["選択肢3", "民族・宗教・言語", "熱帯（A）", "流通"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 1隻1日当たりは2tから1.5tへ下がる。総漁獲量の増加には操業努力の増加が含まれ、総量の大小だけで資源量の増減を決められない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-678", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 前期1,000÷500＝2、後期1,200÷800＝1.5。探知機の改良によって同じ資源量でも漁獲効率が変わるため、技術の影響を調整して資源の変化を推定する。」", "options": ["選択肢4", "時差", "試験", "Q：日本海側"], "ans": 0, "exp": "正解は「選択肢4」です。正解 前期1,000÷500＝2、後期1,200÷800＝1.5。探知機の改良によって同じ資源量でも漁獲効率が変わるため、技術の影響を調整して資源の変化を推定する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-679", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qのアフリカ南西岸も寒流域である。また養殖が天然魚を飼料に使う場合、養殖と天然漁業の資源利用は結び付いている。」", "options": ["選択肢1", "地球的課題", "気候", "選択肢3"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Qのアフリカ南西岸も寒流域である。また養殖が天然魚を飼料に使う場合、養殖と天然漁業の資源利用は結び付いている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-680", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pはペルー沖、Qはベンゲラ海流が流れるアフリカ南西岸に対応し、寒流域の湧昇が栄養塩を供給する。Pの生産力の変動は魚粉を介して離れた養殖地域へ伝わり得る。」", "options": ["選択肢2", "情報の限界", "その他", "科目名"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pはペルー沖、Qはベンゲラ海流が流れるアフリカ南西岸に対応し、寒流域の湧昇が栄養塩を供給する。Pの生産力の変動は魚粉を介して離れた養殖地域へ伝わり得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-681", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 両地域とも暖流域ではなく寒流・湧昇域である。エルニーニョ時の東部太平洋では、表面水温上昇と栄養塩供給の低下が同時に起こり得る。」", "options": ["選択肢3", "気候・自然環境", "エネルギー資源", "熱帯（A）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 両地域とも暖流域ではなく寒流・湧昇域である。エルニーニョ時の東部太平洋では、表面水温上昇と栄養塩供給の低下が同時に起こり得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-682", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは太平洋、Qは大西洋に面し、同じ海域ではない。Qへの影響はその地域の観測で判断すべきで、Pの局地的な変化をそのまま当てはめられない。」", "options": ["選択肢4", "世界の諸地域・日本", "人口", "国公立二次（論述）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pは太平洋、Qは大西洋に面し、同じ海域ではない。Qへの影響はその地域の観測で判断すべきで、Pの局地的な変化をそのまま当てはめられない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-683", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 天然ガスも石炭も化石燃料である。化石燃料の割合はP80％、Q90％となり、石油の割合が低いことだけで判断できない。」", "options": ["選択肢1", "B年", "図法", "海岸の地形"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 天然ガスも石炭も化石燃料である。化石燃料の割合はP80％、Q90％となり、石油の割合が低いことだけで判断できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-684", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 国産供給はいずれも30で、Pは30/100、Qは30/200。石油の比率は50％から25％へ下がるが、輸入燃料の比率は70％から85％へ上がる。」", "options": ["選択肢2", "図表になると迷う", "調査対象", "鉱産資源"], "ans": 0, "exp": "正解は「選択肢2」です。正解 国産供給はいずれも30で、Pは30/100、Qは30/200。石油の比率は50％から25％へ下がるが、輸入燃料の比率は70％から85％へ上がる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-685", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 自給率は正しいが、石油輸入量は両国50で同じ。Qの石油構成比25％がPの50％の半分なのは総供給量が大きいためである。」", "options": ["選択肢3", "答えを見れば分かる", "気候・自然環境", "民族・宗教・言語"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 自給率は正しいが、石油輸入量は両国50で同じ。Qの石油構成比25％がPの50％の半分なのは総供給量が大きいためである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-686", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 国産水力・風力などの量はともに20だが、構成比はP20％、Q10％で異なる。絶対量と総供給に占める割合を区別する。」", "options": ["選択肢4", "地図", "A年", "調査対象"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 国産水力・風力などの量はともに20だが、構成比はP20％、Q10％で異なる。絶対量と総供給に占める割合を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-687", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 国内で消費するという意味の国内供給と、国内資源で賄う国産供給は違う。輸入石油は自給分にならない。」", "options": ["選択肢1", "地点", "2択から決められない", "人口・都市・生活文化"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 国内で消費するという意味の国内供給と、国内資源で賄う国産供給は違う。輸入石油は自給分にならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-688", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 表は電源構成と一次エネルギー構成で分母が異なる。水力・地熱が豊富でも、非電力の輸送需要で輸入石油を使う場合がある。」", "options": ["選択肢2", "位置", "地図", "図表になると迷う"], "ans": 0, "exp": "正解は「選択肢2」です。正解 表は電源構成と一次エネルギー構成で分母が異なる。水力・地熱が豊富でも、非電力の輸送需要で輸入石油を使う場合がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-689", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 発電はエネルギー利用の一部である。輸送用などの燃料を含む一次エネルギー全体へ電源構成の割合を移すことはできない。」", "options": ["選択肢3", "地下水", "データ", "領域"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 発電はエネルギー利用の一部である。輸送用などの燃料を含む一次エネルギー全体へ電源構成の割合を移すことはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-690", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 石油が船舶・航空など発電以外に使われているため、一次エネルギー構成から電源構成は直接求められない。」", "options": ["選択肢4", "現在の地図", "堆積物", "礫・砂・泥の割合"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 石油が船舶・航空など発電以外に使われているため、一次エネルギー構成から電源構成は直接求められない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-691", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 バブ・エル・マンデブ海峡は紅海の南の出口である。図のペルシア湾出口とは異なり、供給国数を増やしても航路集中は残る。」", "options": ["選択肢2", "雲底", "時刻帯", "地表からの深さ（m）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 バブ・エル・マンデブ海峡は紅海の南の出口である。図のペルシア湾出口とは異なり、供給国数を増やしても航路集中は残る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-692", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 スエズ運河は紅海と地中海を結ぶ。日本へ向かう図の東向き航路のYはマラッカ海峡である。」", "options": ["選択肢3", "さらに下", "乾季（11〜3月）", "林齢構成"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 スエズ運河は紅海と地中海を結ぶ。日本へ向かう図の東向き航路のYはマラッカ海峡である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-693", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 ペルシア湾出口はホルムズ海峡、マレー半島とスマトラ島の間がマラッカ海峡である。湾内の供給国を増やすだけでは出口の共通性は解消しない。」", "options": ["選択肢4", "雨季（6〜9月）", "期間", "輸送"], "ans": 0, "exp": "正解は「選択肢4」です。正解 ペルシア湾出口はホルムズ海峡、マレー半島とスマトラ島の間がマラッカ海峡である。湾内の供給国を増やすだけでは出口の共通性は解消しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-694", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 天然ガスは冷却して液化すると体積が小さくなる。基地設備への投資が必要だが、管路で結ばれていない市場も海上で結べる。」", "options": ["選択肢1", "総労働時間", "原料炭", "10年前"], "ans": 0, "exp": "正解は「選択肢1」です。正解 天然ガスは冷却して液化すると体積が小さくなる。基地設備への投資が必要だが、管路で結ばれていない市場も海上で結べる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-695", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの名称は正しいが、パイプライン輸送は専用船を使わない。管路内を送る方式と船内輸送を混同している。」", "options": ["選択肢2", "期間", "輸送機関", "40〜64歳"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pの名称は正しいが、パイプライン輸送は専用船を使わない。管路内を送る方式と船内輸送を混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-696", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 連続した管路で輸送するPはパイプライン方式である。LNGは冷却・液化して専用船で運ぶ方式である。」", "options": ["選択肢3", "地域", "前期", "店舗"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 連続した管路で輸送するPはパイプライン方式である。LNGは冷却・液化して専用船で運ぶ方式である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-697", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qの記述はLNG方式の特徴である。海底を通す場合もパイプラインは固定した管路に沿って輸送する。」", "options": ["選択肢4", "輸送", "40〜64歳", "主要河川"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Qの記述はLNG方式の特徴である。海底を通す場合もパイプラインは固定した管路に沿って輸送する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-698", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 地域内需要100と送電可能量の上限80で利用可能量は180。既存発電180で達しており、追加分を利用するには送電・蓄電・需要調整などが必要。」", "options": ["選択肢1", "貨物", "地区", "Q 東側"], "ans": 0, "exp": "正解は「選択肢1」です。正解 地域内需要100と送電可能量の上限80で利用可能量は180。既存発電180で達しており、追加分を利用するには送電・蓄電・需要調整などが必要。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-699", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域内需要と送電可能量の上限を引いた20MWは余剰発電ではない。余剰は発電量から地域内需要を引いて求める。」", "options": ["選択肢2", "時点", "作物", "P：太平洋側"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 地域内需要と送電可能量の上限を引いた20MWは余剰発電ではない。余剰は発電量から地域内需要を引いて求める。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-700", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 送電可能量の上限は既存の余剰発電80MWで使われる。追加分だけを80MWと比較すると既存発電からの送電を見落とす。」", "options": ["選択肢3", "前期", "作物X", "選択肢1"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 送電可能量の上限は既存の余剰発電80MWで使われる。追加分だけを80MWと比較すると既存発電からの送電を見落とす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-701", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 既存の余剰80MWが送電可能量の上限80MWを使い切る。すでに送る予定の量と追加設備の発電量を別々に同じ余力へ割り当てることはできない。」", "options": ["選択肢4", "18〜24歳", "P 西側", "細かい火山灰"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 既存の余剰80MWが送電可能量の上限80MWを使い切る。すでに送る予定の量と追加設備の発電量を別々に同じ余力へ割り当てることはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-702", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 昼は80−60＝20MW、夕方は85−10＝75MWで55MW増。時間を移せる需要を昼へ動かすことは変動の緩和につながる。」", "options": ["選択肢1", "65歳以上", "最大流量", "気候帯"], "ans": 0, "exp": "正解は「選択肢1」です。正解 昼は80−60＝20MW、夕方は85−10＝75MWで55MW増。時間を移せる需要を昼へ動かすことは変動の緩和につながる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-703", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 75MWは夕方の必要量で増加量ではない。夕方は日射が弱くなるため、太陽光の設備増設だけで常に対応できるとはいえない。」", "options": ["選択肢2", "海外就労者から家族への送金", "放牧地", "共通テスト"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 75MWは夕方の必要量で増加量ではない。夕方は日射が弱くなるため、太陽光の設備増設だけで常に対応できるとはいえない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-704", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 需要だけなら5MW増だが、太陽光は50MW減る。夕方の充電を増やすと太陽光以外に必要な電力はさらに増える。」", "options": ["選択肢3", "店舗", "選択肢1", "河川がつくる地形"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 需要だけなら5MW増だが、太陽光は50MW減る。夕方の充電を増やすと太陽光以外に必要な電力はさらに増える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-705", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 太陽光の減少は残りの供給必要量を増やす。50MWという太陽光の差を、調整電源の減少と逆に捉えている。」", "options": ["選択肢4", "作物", "侵食", "エネルギー資源"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 太陽光の減少は残りの供給必要量を増やす。50MWという太陽光の差を、調整電源の減少と逆に捉えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-706", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年間はPが大きいが、乾季流量は出力を直接制約する。Pの乾季出力指数は50×2＝100でQの20×8＝160より小さい。」", "options": ["選択肢1", "時期", "地理総合，歴史総合，公共", "村落"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 年間はPが大きいが、乾季流量は出力を直接制約する。Pの乾季出力指数は50×2＝100でQの20×8＝160より小さい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-707", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは乾季には有利でも、年間指数は20×(12＋8)＝400。Pの50×(20＋2)＝1,100を下回る。」", "options": ["選択肢2", "降水季節性", "熱帯（A）", "地球的課題"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Qは乾季には有利でも、年間指数は20×(12＋8)＝400。Pの50×(20＋2)＝1,100を下回る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-708", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 PとQの水量も等しくなく、発電は落差にも依存する。流量だけで年間量を決めることはできない。」", "options": ["選択肢3", "区分", "試験", "産業・資源・流通"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 PとQの水量も等しくなく、発電は落差にも依存する。流量だけで年間量を決めることはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-709", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 年間指数はPが1,100、Qが400。乾季はP100・Q160なので、年間の大きさと渇水期の供給力を区別する必要がある。」", "options": ["選択肢4", "流通", "気候", "用語があいまい"], "ans": 0, "exp": "正解は「選択肢4」です。正解 年間指数はPが1,100、Qが400。乾季はP100・Q160なので、年間の大きさと渇水期の供給力を区別する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-710", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 アイスランドは大西洋中央海嶺上、日本はプレートの沈み込みに関連する火山帯にあり、地下の熱資源を利用する。」", "options": ["選択肢1", "最大流量", "その他", "地図"], "ans": 0, "exp": "正解は「選択肢1」です。正解 アイスランドは大西洋中央海嶺上、日本はプレートの沈み込みに関連する火山帯にあり、地下の熱資源を利用する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-711", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 発電で利用する主な熱源は地下深部の熱である。比較的浅い地下の安定した温度を空調などに使う地中熱利用と区別する。」", "options": ["選択肢2", "P：太平洋側", "エネルギー資源", "地表勾配"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 発電で利用する主な熱源は地下深部の熱である。比較的浅い地下の安定した温度を空調などに使う地中熱利用と区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-712", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 アイスランドは大西洋中央海嶺、日本は沈み込み帯に関係する火山地域で、安定陸塊ではない。地下深部の熱を利用する地熱発電を考える。」", "options": ["選択肢3", "観光地", "人口", "12〜2月／6〜8月の各月降水量"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 アイスランドは大西洋中央海嶺、日本は沈み込み帯に関係する火山地域で、安定陸塊ではない。地下深部の熱を利用する地熱発電を考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-713", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 境界の対応が逆である。アイスランドはプレートが離れる大西洋中央海嶺、日本はプレートの沈み込みに関連する。」", "options": ["選択肢4", "周辺部", "図法", "さらに下"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 境界の対応が逆である。アイスランドはプレートが離れる大西洋中央海嶺、日本はプレートの沈み込みに関連する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-714", "cat
