<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>共通テスト対策 地理</title>
  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --sub: #334155;
      --pri: #0f766e; --pri-bg: #ccfbf1; --bdr: #cbd5e1;
      --ok: #15803d; --ok-bg: #dcfce7; --ng: #b91c1c; --ng-bg: #fee2e2;
      --warn: #b45309; --warn-bg: #fef3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071112; --card: #102022; --text: #f0fdfa; --sub: #cbd5e1;
        --pri: #2dd4bf; --pri-bg: rgba(45, 212, 191, 0.16); --bdr: #264246;
        --ok: #4ade80; --ok-bg: rgba(74, 222, 128, 0.16); --ng: #f87171; --ng-bg: rgba(248, 113, 113, 0.16);
        --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    #app {
      display: flex; flex-direction: column; width: 100%; height: 100vh; height: 100dvh;
      max-width: 720px; margin: 0 auto;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      gap: 6px;
    }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 40px; gap: 8px; flex-shrink: 0; }
    .hbtn { font-size: 14px; font-weight: 800; color: var(--pri); background: var(--card); border: 2px solid var(--bdr); padding: 5px 10px; border-radius: 10px; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .htitle { font-size: 17px; font-weight: 900; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
    .view { display: none; flex-direction: column; width: 100%; height: 100%; min-height: 0; gap: 6px; }
    .view.active { display: flex; }
    .home-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; min-height: 0; gap: 6px; }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0; }
    .stat-box { background: var(--pri-bg); color: var(--pri); border-radius: 10px; padding: 6px 4px; text-align: center; font-weight: 800; }
    .stat-box b { display: block; font-size: 19px; line-height: 1.15; }
    .stat-box span { font-size: 12px; }
    .field { flex-shrink: 0; }
    .field label { display: block; font-size: 13px; font-weight: 800; color: var(--sub); margin-bottom: 2px; }
    select { width: 100%; height: 42px; padding: 4px 10px; font-size: 15px; font-weight: 700; border-radius: 10px; border: 2px solid var(--bdr); background: var(--card); color: var(--text); }
    .btn { width: 100%; flex: 1; min-height: 44px; max-height: 54px; border-radius: 12px; font-size: 17px; font-weight: 900; cursor: pointer; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; text-decoration: none; gap: 6px; }
    .btn-pri { background: var(--pri); color: #ffffff; }
    @media (prefers-color-scheme: dark) { .btn-pri { color: #071112; } }
    .btn-sec { background: var(--card); color: var(--text); border-color: var(--bdr); font-size: 15px; }
    .btn-rev { background: var(--ng-bg); color: var(--ng); border-color: var(--ng); }
    .btn-link { background: var(--pri-bg); color: var(--pri); border-color: var(--pri); font-size: 14px; max-height: 42px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; min-height: 42px; max-height: 50px; }
    .pbar { height: 7px; background: var(--bdr); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
    .pfill { height: 100%; width: 0%; background: var(--pri); transition: width 0.25s ease; }
    .meta-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-shrink: 0; }
    .badge { font-size: 13px; font-weight: 800; padding: 3px 9px; border-radius: 8px; background: var(--pri-bg); color: var(--pri); }
    .badge.s { background: var(--warn-bg); color: var(--warn); }
    .q-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 14px; padding: 10px 12px; flex: 0 1 auto; max-height: 34%; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
    .q-text { font-size: 19px; font-weight: 800; line-height: 1.4; }
    .q-hl { color: var(--pri); font-weight: 900; background: var(--pri-bg); padding: 1px 4px; border-radius: 4px; border-bottom: 2px solid var(--pri); }
    .q-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--sub); }
    .tts-btn { font-size: 13px; font-weight: 800; color: var(--pri); background: var(--pri-bg); border: none; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    .opts { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
    .opt-btn { flex: 1; min-height: 0; width: 100%; background: var(--card); border: 2px solid var(--bdr); border-radius: 12px; padding: 6px 12px; font-size: 17px; font-weight: 800; line-height: 1.25; color: var(--text); text-align: left; cursor: pointer; display: flex; align-items: center; overflow: hidden; }
    .opt-btn.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
    .opt-btn.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }
    .exp-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border: 2px solid var(--pri); border-radius: 16px; padding: 12px; display: none; flex-direction: column; gap: 7px; max-height: 68%; overflow-y: auto; z-index: 30; box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.28); }
    .exp-sheet.active { display: flex; }
    .exp-head { font-size: 20px; font-weight: 900; }
    .exp-ans { font-size: 17px; font-weight: 900; background: var(--ok-bg); color: var(--ok); padding: 6px 10px; border-radius: 10px; }
    .exp-body { font-size: 15px; font-weight: 700; line-height: 1.45; color: var(--sub); }
    .exp-sheet .btn, .exp-sheet .row2 { flex: 0 0 auto; max-height: none; }
    .listen-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 16px; padding: 14px; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; text-align: center; gap: 10px; }
    .listen-badge { font-size: 14px; font-weight: 900; color: var(--pri); background: var(--pri-bg); padding: 5px 12px; border-radius: 999px; align-self: center; }
    .listen-main { font-size: 19px; font-weight: 800; line-height: 1.45; overflow-y: auto; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .listen-card .btn { flex: 0 0 auto; max-height: 48px; }
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); display: none; align-items: center; justify-content: center; padding: 14px max(14px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); z-index: 60; }
    .modal.active { display: flex; }
    .mbox { background: var(--card); border: 2px solid var(--bdr); border-radius: 16px; padding: 16px; width: 100%; max-width: 480px; max-height: 90dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: center; }
    .mbox .btn { flex: 0 0 auto; max-height: none; }
    .mtitle { font-size: 19px; font-weight: 900; }
    .mscore { font-size: 32px; font-weight: 900; color: var(--pri); }
    .mtext { font-size: 16px; font-weight: 700; line-height: 1.5; color: var(--sub); text-align: left; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <a class="hbtn" href="index.html">‹ 問題集一覧</a>
    <div class="htitle">共通テスト対策 地理</div>
    <button class="hbtn" onclick="openStats()">成績</button>
  </header>
  <main>
    <div id="v-home" class="view active">
      <div class="home-card">
        <div class="stat-row">
          <div class="stat-box"><span>収録問題</span><b id="s-tot">0</b></div>
          <div class="stat-box"><span>学習済み</span><b id="s-lrn">0</b></div>
          <div class="stat-box"><span>要復習</span><b id="s-rev">0</b></div>
        </div>
        <div class="field">
          <label for="f-cat">学習グループ（分野別）</label>
          <select id="f-cat">
            <option value="ALL">全分野（バランス出題）</option>
            <option value="CHISHI">地誌（日本・世界）</option>
            <option value="STATS_GRAPH">統計・グラフ読解</option>
            <option value="TOPO_CLIM">自然環境（地形・気候）</option>
            <option value="RES_IND">資源・エネルギー・産業・貿易</option>
            <option value="POP_URB">人口・都市・村落・生活文化</option>
            <option value="MAP_GIS">地図・GIS・防災・地域調査</option>
          </select>
        </div>
        <div class="field">
          <label for="f-pri">重要度</label>
          <select id="f-pri">
            <option value="ALL">すべて</option>
            <option value="S">★ 最重要（超頻出）</option>
            <option value="A">● 重要（定番・応用）</option>
          </select>
        </div>
        <button class="btn btn-pri" onclick="startQuiz('NORMAL')">10問テストを始める</button>
        <button class="btn btn-rev" id="b-rev" style="display:none;" onclick="startQuiz('REVIEW')">間違えた問題を復習（<span id="rev-n">0</span>問）</button>
        <button class="btn btn-sec" onclick="startListen()">🎧 きくだけモード（誤答優先）</button>
        <div class="row2">
          <button class="btn btn-sec" onclick="exportProg()">進捗エクスポート</button>
          <button class="btn btn-sec" onclick="importProg()">進捗インポート</button>
        </div>
      </div>
    </div>
    <div id="v-quiz" class="view">
      <div class="pbar"><div class="pfill" id="p-fill"></div></div>
      <div class="meta-bar">
        <span class="badge" id="q-cat">分野</span>
        <span class="badge s" id="q-pri">★ 最重要</span>
        <span id="q-num" style="font-size:15px;font-weight:900;">1 / 10</span>
      </div>
      <div class="q-card">
        <div class="q-text" id="q-txt"></div>
        <div class="q-foot">
          <span id="q-id">ID</span>
          <button class="tts-btn" onclick="speak(curList[idx].q)">🔊 問題を聞く</button>
        </div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="exp-sheet" id="sheet">
        <div class="exp-head" id="sh-head"></div>
        <div class="exp-ans" id="sh-ans"></div>
        <div class="exp-body" id="sh-exp"></div>
        <a id="sh-ref" class="btn btn-link" href="#" target="_blank" rel="noopener noreferrer">🗺️ 解説・資料ページを見る ↗</a>
        <div class="row2">
          <button class="btn btn-sec" onclick="speak(curList[idx].options[curList[idx].ans] + '。' + curList[idx].exp)">🔊 解説を聞く</button>
          <button class="btn btn-pri" onclick="nextQ()">次の問題へ ›</button>
        </div>
      </div>
    </div>
    <div id="v-listen" class="view">
      <div class="listen-card">
        <div class="listen-badge" id="l-badge">きくだけモード</div>
        <div class="listen-main" id="l-main">音声を準備しています...</div>
        <button class="btn btn-sec" onclick="stopListen()">停止して戻る</button>
      </div>
    </div>
  </main>
</div>
<div class="modal" id="m-res">
  <div class="mbox">
    <div class="mtitle">10問セッション終了</div>
    <div class="mscore" id="r-sc">0 / 10</div>
    <div class="mtext" id="r-msg" style="text-align:center;"></div>
    <button class="btn btn-pri" onclick="closeRes('NEXT')">次の10問へ進む</button>
    <button class="btn btn-rev" id="r-rev" onclick="closeRes('REV')">間違えた問題を復習する</button>
    <button class="btn btn-sec" onclick="closeRes('HOME')">メニューに戻る</button>
  </div>
</div>
<div class="modal" id="m-adv">
  <div class="mbox">
    <div class="mtitle">💡 30問達成！地理攻略のコツ</div>
    <div class="mtext" id="adv-txt"></div>
    <button class="btn btn-pri" onclick="document.getElementById('m-adv').classList.remove('active')">学習を続ける</button>
  </div>
</div>
<div class="modal" id="m-st">
  <div class="mbox">
    <div class="mtitle">学習成績・進捗状況</div>
    <div class="mtext" id="st-body"></div>
    <button class="btn btn-sec" onclick="document.getElementById('m-st').classList.remove('active')">閉じる</button>
    <button class="btn btn-sec" style="color:var(--ng);border-color:var(--ng);font-size:14px;" onclick="resetProg()">進捗データをリセット</button>
  </div>
</div>
<script>
const BANK = [{"id": "GEO-CS-01", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "S", "q": "モンスーンアジアでは、夏季に海洋から吹く［ 空欄 ］の影響で雨季となり、沖積平野を中心に集約的な水田稲作が広く営まれている。", "options": ["季節風（モンスーン）", "偏西風", "貿易風", "フェーン風"], "ans": 0, "exp": "モンスーンアジアは夏の南西〜南東季節風によって降水量が多くなり、高温多雨の環境を活かした水田稲作と高い人口支持力が特徴です。", "refUrl": "https://ichigo-drill.jp/chiritankyu", "refLabel": "いちごドリル 地理探究"}, {"id": "GEO-CS-02", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "S", "q": "ヨーロッパにおいて、域内の関税撤廃や共通通貨ユーロの導入、国境検査の撤廃など統合を進めてきた地域機構は［ 空欄 ］である。", "options": ["EU（ヨーロッパ連合）", "ASEAN", "USMCA", "MERCOSUR"], "ans": 0, "exp": "EUは単一市場や共通通貨、シェンゲン協定による移動の自由など、高度な経済・地域統合を進めてきました。", "refUrl": "https://geo.ewrs.jp/high/tankyu/", "refLabel": "ちりナビ 地理探究"}, {"id": "GEO-CS-03", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "S", "q": "アメリカ合衆国の中西部からグレートプレーンズにかけては、降水量や土壌条件に応じた小麦・トウモロコシ・大豆などの［ 空欄 ］が行われている。", "options": ["適地適作（商業的農業）", "焼畑移動農業", "オアシス農業", "棚田稲作"], "ans": 0, "exp": "アメリカの農業は自然条件に即して農業地域が分化（コーンベルト、小麦地帯、酪農地帯など）する適地適作が顕著です。", "refUrl": "https://ichigo-drill.jp/chiritankyu", "refLabel": "いちごドリル 地理探究"}, {"id": "GEO-CS-04", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "A", "q": "南アメリカ大陸の太平洋側を南北に縦断する険しい山脈は［ 空欄 ］山脈であり、環太平洋造山帯に属する新期造山帯である。", "options": ["アンデス", "ロッキー", "アルプス", "ウラル"], "ans": 0, "exp": "アンデス山脈はナスカプレートと南アメリカプレートの収束帯に位置し、銅資源や高地文明の歴史を持ちます。", "refUrl": "https://ichigo-drill.jp/chiritankyu", "refLabel": "いちごドリル 地理探究"}, {"id": "GEO-CS-05", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "A", "q": "日本の地域構造において、大都市圏への人口集中・流動と、地方都市や中山間地域における少子高齢化・［ 空欄 ］などの地域課題が併存している。", "options": ["担い手不足・地域活性化", "全道一斉の人口爆発", "年間降水量ゼロ化", "海溝の完全消滅"], "ans": 0, "exp": "都市圏への一極集中・流動と地方の少子高齢化・地域維持の両面から、地域特性に応じた施策や防災・交通が議論されます。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地形・地理情報"}, {"id": "GEO-CS-06", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "S", "q": "東南アジアの地域協力機構である［ 空欄 ］は、域内の経済統合や安定、国際協調を目的に設立された枠組みである。", "options": ["ASEAN（東南アジア諸国連合）", "EU", "OPEC", "NATO"], "ans": 0, "exp": "ASEANは域内貿易の自由化やサプライチェーンの連携を進め、近年は経済成長と若年人口を背景に重要な貿易相手となっています。", "refUrl": "https://ichigo-drill.jp/chiritankyu", "refLabel": "いちごドリル 地理探究"}, {"id": "GEO-CS-07", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "A", "q": "西アジア・北アフリカ地域に広く分布する乾燥帯では、伝統的に［ 空欄 ］（季節に応じた家畜の移動）や灌漑農業が見られる。", "options": ["遊牧・移牧", "水田二期作", "酪農専業", "大規模森林伐採"], "ans": 0, "exp": "降水量が少なく不安定な乾燥地域では、水草を求めて家畜を移動させる遊牧や、河川・地下水を活用した灌漑農業が営まれます。", "refUrl": "https://geo.ewrs.jp/high/tankyu/", "refLabel": "ちりナビ 地理探究"}, {"id": "GEO-CS-08", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "A", "q": "オーストラリアの農業では、内陸部の乾燥・半乾燥地域で［ 空欄 ］（羊・牛の放牧）が行われ、南西部や東部沿岸では小麦栽培や酪農も見られる。", "options": ["粗放的牧畜", "集約的園芸", "焼畑農業", "水田稲作"], "ans": 0, "exp": "広大な草地を活かした羊・牛の放牧や小麦輸出が特徴で、近年は鉄鉱石・石炭・LNGなどの鉱産資源輸出も大きな比重を占めます。", "refUrl": "https://ichigo-drill.jp/chiritankyu", "refLabel": "いちごドリル 地理探究"}, {"id": "GEO-CS-09", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "A", "q": "日本の工業地域において、自動車産業を中心に部品メーカーが集積し、内陸・臨海部を結んで発展してきた地域として代表的なのは［ 空欄 ］である。", "options": ["中京工業地帯", "京浜工業地帯", "阪神工業地帯", "北九州工業地帯"], "ans": 0, "exp": "中京工業地帯は輸送用機械器具（自動車・関連部品）の出荷額が大きく、日本の製造業を牽引する中核地域の一つです。", "refUrl": "https://www.meti.go.jp/", "refLabel": "経済産業省 産業データ"}, {"id": "GEO-CS-10", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "A", "q": "日本の農業において、北海道の畑作・酪農と都府県の小規模経営を比較したとき、北海道では1戸あたりの［ 空欄 ］が大きい傾向がある。", "options": ["経営耕地面積", "夏期平均気温", "梅雨の期間", "台風の接近頻度"], "ans": 0, "exp": "北海道は広大な農地と大型機械化により経営規模が大きく、小麦・ばれいしょ・てん菜・豆類・生乳などの生産割合が高いです。", "refUrl": "https://www.maff.go.jp/", "refLabel": "農林水産省 農業統計"}, {"id": "GEO-SG-01", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "雨温図において、月別平均気温が最も高くなる時期（夏）に降水量が極端に少なく、冬に偏西風で雨が多くなる特徴を示すのは［ 空欄 ］気候である。", "options": ["地中海性", "熱帯雨林", "西岸海洋性", "ツンドラ"], "ans": 0, "exp": "地中海性気候（Cs）は夏に亜熱帯高圧帯で乾燥し、冬に寒帯前線・偏西風帯に入って降水がもたらされます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "ロジカ 共通テスト地理対策"}, {"id": "GEO-SG-02", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "人口ピラミッドにおいて、出生率の低下により底辺（年少人口）が狭まり、高齢層の比率が高い形状を［ 空欄 ］型と呼ぶ。", "options": ["つぼ", "富士山", "釣鐘", "三角"], "ans": 0, "exp": "つぼ型人口ピラミッドは少子高齢化が進む先進国に典型的で、将来的な人口減少傾向を示します。", "refUrl": "https://www.stat.go.jp/", "refLabel": "総務省統計局 人口ピラミッド"}, {"id": "GEO-SG-03", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "貿易統計のグラフを分析する際、シェア（構成比）が低下していても、全体の貿易総額が急拡大していれば［ 空欄 ］は増加している場合がある。", "options": ["実額（金額の絶対値）", "関税率", "失業率", "相関係数"], "ans": 0, "exp": "共通テストでは「割合の減少」と「実額の増減」を取り違えさせる引っかけ問題が頻出します。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "ロジカ 共通テスト地理対策"}, {"id": "GEO-SG-04", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "2つの変数の関係を表す散布図において、一方の値が増加すると他方の値も増加する傾向があるとき、両者には［ 空欄 ］の相関があるという。", "options": ["正", "負", "無", "逆転"], "ans": 0, "exp": "右肩上がりの点群の広がりは正の相関を示します。ただし相関の存在が直ちに直接の因果関係を意味するわけではありません。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "ロジカ 共通テスト地理対策"}, {"id": "GEO-SG-05", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "箱ひげ図において、箱の下端から上端までの長さはデータの中央50%が集まる［ 空欄 ］を表している。", "options": ["四分位範囲（IQR）", "平均値の2倍", "全データの最大値", "標準誤差"], "ans": 0, "exp": "第1四分位数（Q1）から第3四分位数（Q3）までの差が四分位範囲（IQR）であり、外れ値の影響を受けにくい散らばり指標です。", "refUrl": "https://www.dnc.ac.jp/kyotsu/kakomondai/", "refLabel": "大学入試センター 過去問"}, {"id": "GEO-SG-06", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "ハイサーグラフ（温雨図）では、横軸に月平均気温、縦軸に月降水量をとり、各月の点を月順に線で結ぶことで［ 空欄 ］の季節変化を視覚化する。", "options": ["気温と降水量", "人口と面積", "輸出額と輸入額", "標高と気圧"], "ans": 0, "exp": "ハイサーグラフは1年の気温と降水量の組み合わせ推移を1つの図上で比較できる便利なグラフです。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "ロジカ 共通テスト地理対策"}, {"id": "GEO-SG-07", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "国や地域の経済規模や生活水準を比較する際、人口規模の違いをならすために用いられる代表的な指標は［ 空欄 ］である。", "options": ["1人あたりGDP（国内総生産）", "国土面積の平方根", "年間日照時間の合計", "海岸線の延長"], "ans": 0, "exp": "人口の多い国は総GDPが大きくなりやすいため、所得や経済水準の比較には1人あたりGDPがよく用いられます。", "refUrl": "https://www.stat.go.jp/", "refLabel": "総務省統計局 経済統計"}, {"id": "GEO-SG-08", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "2つの事象に高い相関係数が見られても、実際には第3の要因（気温や都市規模など）が双方に影響しているだけの関係を［ 空欄 ］と呼ぶ。", "options": ["擬似相関", "完全正相関", "移動平均", "等高線間隔"], "ans": 0, "exp": "見かけ上の相関にだまされず、背景にある共通要因や因果の向きを吟味することが共通テストの資料読解では重要です。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "ロジカ 共通テスト地理対策"}, {"id": "GEO-TC-01", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "S", "q": "プレートテクトニクスにおいて、日本列島付近のように海洋プレートが大陸プレートの下に沈み込む場所にできる海底の深い溝を［ 空欄 ］と呼ぶ。", "options": ["海溝", "海嶺", "地溝帯", "大陸棚"], "ans": 0, "exp": "プレートの沈み込み帯には水深6,000m以上の海溝が形成され、巨大地震や火山活動の震源域となります。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地形・地理情報"}, {"id": "GEO-TC-02", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "S", "q": "河川が山地から平野に出る谷口にできる地形が扇状地であるのに対し、河口付近で流れが緩やかになり砂泥が堆積してできる地形は［ 空欄 ］である。", "options": ["三角州（デルタ）", "河岸段丘", "カルスト", "砂嘴"], "ans": 0, "exp": "三角州（デルタ）は微小な砂泥が堆積した低湿地で、水田や水運に利用される反面、洪水・高潮リスクがあります。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地形・地理情報"}, {"id": "GEO-TC-03", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "S", "q": "西ヨーロッパが同緯度のユーラシア大陸東岸より冬に温暖なのは、沖合を流れる暖流の［ Ｘ ］と、その上空を吹く［ Ｙ ］の影響である。", "options": ["［Ｘ］北大西洋海流 ［Ｙ］偏西風", "［Ｘ］親潮（千島海流）［Ｙ］季節風", "［Ｘ］ペルー海流  ［Ｙ］貿易風", "［Ｘ］黒潮（日本海流）［Ｙ］極偏東風"], "ans": 0, "exp": "高緯度まで北上する暖流の北大西洋海流と偏西風により、ロンドンやパリなどは冬でも比較的温和な西岸海洋性気候となります。", "refUrl": "https://www.jma.go.jp/", "refLabel": "気象庁 気候データ"}, {"id": "GEO-TC-04", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "A", "q": "湿潤な空気が山脈を越えて風下側に吹き下りる際、水分を失って乾燥し気温が著しく上昇する現象を［ 空欄 ］現象と呼ぶ。", "options": ["フェーン", "エルニーニョ", "ラニーニャ", "ヒートアイランド"], "ans": 0, "exp": "山を越える際に水蒸気が凝結して雨を降らせ、風下では乾燥した高温気流となって農作物被害や火災リスクを高めます。", "refUrl": "https://www.jma.go.jp/", "refLabel": "気象庁 気候データ"}, {"id": "GEO-TC-05", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "S", "q": "プレート同士が引き離される発散的境界で、マントル物質が上昇して新しい海洋地殻がつくられる海底山脈を［ 空欄 ］と呼ぶ。", "options": ["海嶺", "海溝", "扇状地", "鍾乳洞"], "ans": 0, "exp": "大西洋中央海嶺などが代表例で、火山活動や地震が見られ、アイスランドのように海嶺が海面上に現れる地域もあります。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地形・地理情報"}, {"id": "GEO-TC-06", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "A", "q": "石灰岩が雨水や地下水によって溶食されてできる地形を［ 空欄 ］地形と呼び、すり鉢状の凹地であるドリーネなどが特徴である。", "options": ["カルスト", "フィヨルド", "リアス", "砂丘"], "ans": 0, "exp": "秋吉台（山口県）や平尾台（福岡県）などが有名で、水はけが良いため畑作や放牧地に利用されることがあります。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地形・地理情報"}, {"id": "GEO-TC-07", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "A", "q": "赤道付近の低緯度帯で年間を通して高温多雨となり、常緑広葉樹の密林（セルバなど）が発達する気候帯は［ 空欄 ］気候である。", "options": ["熱帯雨林（Af）", "ステップ（BS）", "砂漠（BW）", "亜寒帯（D）"], "ans": 0, "exp": "熱帯雨林気候では気温の年較差が小さく、スコールなどの雨が多く見られます。", "refUrl": "https://www.jma.go.jp/", "refLabel": "気象庁 気候データ"}, {"id": "GEO-TC-08", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "A", "q": "氷河が谷を削ってつくったU字谷に海水が浸入して形成された、急峻な崖に囲まれた細長い入り江を［ 空欄 ］と呼ぶ。", "options": ["フィヨルド", "ラグーン", "三角州", "自然堤防"], "ans": 0, "exp": "ノルウェー西岸やチリ南部などに見られ、水深が深く静穏な地形を活かして港湾や養殖などに利用されます。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地形・地理情報"}, {"id": "GEO-RI-01", "cat": "RES_IND", "catName": "資源・産業・貿易", "priority": "S", "q": "液化天然ガス（LNG）は、主成分のメタンを約［ 空欄 ］℃まで冷却して液化し、体積を約600分の1に圧縮して専用船で海上輸送される。", "options": ["-162", "-20", "0", "100"], "ans": 0, "exp": "LNGは超低温（約-162℃）で液体化することで、パイプラインのない日本などの島国への大量輸送が可能になりました。", "refUrl": "https://www.enecho.meti.go.jp/", "refLabel": "資源エネルギー庁 天然ガス"}, {"id": "GEO-RI-02", "cat": "RES_IND", "catName": "資源・産業・貿易", "priority": "S", "q": "二国間や地域間で関税の撤廃・削減や投資ルールの調和などを取り決め、自由な貿易を促進する協定を［ 空欄 ］（自由貿易協定）と呼ぶ。", "options": ["FTA", "WHO", "OPEC", "NPO"], "ans": 0, "exp": "FTA（Free Trade Agreement）は関税撤廃等を中心とし、知的財産やサービスを含むEPA（経済連携協定）とともに推進されています。", "refUrl": "https://www.jetro.go.jp/", "refLabel": "JETRO 貿易協定"}, {"id": "GEO-RI-03", "cat": "RES_IND", "catName": "資源・産業・貿易", "priority": "A", "q": "大都市の巨大な消費市場の近くに立地し、鮮度が求められる生鮮野菜・花き・牛乳などを集約的に生産する農業は［ 空欄 ］である。", "options": ["近郊農業", "園芸農業（遠郊）", "焼畑農業", "遊牧"], "ans": 0, "exp": "近郊農業は輸送コストと鮮度保持の優位性を活かし、ビニールハウス等の施設園芸を組み合わせて高収益を狙います。", "refUrl": "https://www.maff.go.jp/", "refLabel": "農林水産省 統計"}, {"id": "GEO-RI-04", "cat": "RES_IND", "catName": "資源・産業・貿易", "priority": "A", "q": "ある国が他国に比べて相対的に得意な財の生産に特化して輸出・輸入を行うことで双方の利益が高まる国際貿易の原理は［ 空欄 ］の原理である。", "options": ["比較優位", "絶対優位", "機会損失", "等価交換"], "ans": 0, "exp": "リカードが提唱した比較優位の原理は、自由貿易やグローバルな国際分業を理論づける基礎概念です。", "refUrl": "https://www.jetro.go.jp/", "refLabel": "JETRO 貿易統計"}, {"id": "GEO-RI-05", "cat": "RES_IND", "catName": "資源・産業・貿易", "priority": "S", "q": "太陽光・風力・水力・地熱などのように、自然界で繰り返し再生・補充され、枯渇しにくく温室効果ガスの排出が少ないエネルギーを［ 空欄 ］と呼ぶ。", "options": ["再生可能エネルギー", "化石燃料", "一次産品", "可採埋蔵量"], "ans": 0, "exp": "エネルギー安全保障と脱炭素化の両立に向けて導入が拡大しており、気象条件による発電量変動への調整力や送電網整備が課題です。", "refUrl": "https://www.enecho.meti.go.jp/", "refLabel": "資源エネルギー庁 エネルギー"}, {"id": "GEO-RI-06", "cat": "RES_IND", "catName": "資源・産業・貿易", "priority": "A", "q": "アルミニウムの原料となる鉱石は［ 空欄 ］であり、精錬に大量の電力を要するため安価な電力が得られる地域などに工場が立地しやすい。", "options": ["ボーキサイト", "鉄鉱石", "銅鉱", "リン鉱石"], "ans": 0, "exp": "アルミ精錬は電力消費量が非常に大きいため、電力コストや立地条件が産業配置に大きく影響します。", "refUrl": "https://www.meti.go.jp/", "refLabel": "経済産業省 資源・産業"}, {"id": "GEO-PU-01", "cat": "POP_URB", "catName": "人口・都市・文化", "priority": "S", "q": "近代化や衛生・医療水準の向上に伴い、多死多産から多子少死を経て［ 空欄 ］へと人口構造が移り変わる現象を人口転換と呼ぶ。", "options": ["少死少産", "多死多産", "少死多産", "多死少産"], "ans": 0, "exp": "人口転換は経済発展とともに「多死多産→多子少死（人口爆発）→少死少産（安定・減少）」へと進むモデルです。", "refUrl": "https://www.stat.go.jp/", "refLabel": "総務省統計局 人口統計"}, {"id": "GEO-PU-02", "cat": "POP_URB", "catName": "人口・都市・文化", "priority": "S", "q": "大都市中心部の地価高騰や環境悪化により住宅が郊外へ流出し、都心の夜間人口が急減する現象を［ 空欄 ］化現象と呼ぶ。", "options": ["ドーナツ", "スプロール", "ジェントリフィケーション", "コンパクトシティ"], "ans": 0, "exp": "都心の昼間人口と夜間人口の格差が広がるドーナツ化現象に対し、近年は都心回帰や再開発による居住変化も見られます。", "refUrl": "https://www.stat.go.jp/", "refLabel": "総務省統計局 都市人口"}, {"id": "GEO-PU-03", "cat": "POP_URB", "catName": "人口・都市・文化", "priority": "A", "q": "イスラム教圏において、豚肉やアルコールの摂取が禁じられるなど、宗教的な戒律に適合した食品や商品・サービスを［ 空欄 ］と呼ぶ。", "options": ["ハラール", "コーシャ", "アヒンサー", "カースト"], "ans": 0, "exp": "ハラールは食品だけでなく化粧品・医薬品や観光対応など多岐にわたり、グローバル市場でも重要です。", "refUrl": "https://www.bunka.go.jp/", "refLabel": "文化庁 文化情報"}, {"id": "GEO-PU-04", "cat": "POP_URB", "catName": "人口・都市・文化", "priority": "A", "q": "行政上の市区町村境界にかかわらず、通勤・通学や買い物などで中心都市に依存する周辺地域を一体として捉えた区域を［ 空欄 ］と呼ぶ。", "options": ["都市圏", "自然地域", "水系流域", "限界集落"], "ans": 0, "exp": "都市圏は人の流動実態（通勤率など）に基づいて設定され、交通政策や地域計画を考える単位として活用されます。", "refUrl": "https://www.stat.go.jp/", "refLabel": "総務省統計局 都市圏設定"}, {"id": "GEO-PU-05", "cat": "POP_URB", "catName": "人口・都市・文化", "priority": "S", "q": "都市圏の拡大に伴って無秩序に市街地が郊外へ広がり、農地や緑地の減少、インフラ整備の非効率などを招く現象を［ 空欄 ］現象と呼ぶ。", "options": ["スプロール", "リニア", "コンバージェンス", "デフレーション"], "ans": 0, "exp": "スプロール現象への対策として、市街化区域・市街化調整区域の線引きやコンパクトシティ（拠点集約型都市）などの考え方が用いられます。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 土地利用・都市"}, {"id": "GEO-PU-06", "cat": "POP_URB", "catName": "人口・都市・文化", "priority": "A", "q": "世界的な文化の伝播・均質化が進む一方で、地域固有の伝統・食文化・景観などを見直し守ろうとする動きは［ 空欄 ］とも関連づけられる。", "options": ["地域文化の継承・多様性維持", "等高線間隔の一定化", "時差の廃止", "プレート沈み込み停止"], "ans": 0, "exp": "グローバル化とローカルな文化の尊重は対立するだけでなく、地域の魅力やアイデンティティを再発見する動きにもつながります。", "refUrl": "https://www.bunka.go.jp/", "refLabel": "文化庁 文化情報"}, {"id": "GEO-MG-01", "cat": "MAP_GIS", "catName": "地図・GIS・防災", "priority": "S", "q": "地理空間情報をコンピュータ上で統合・管理し、重ね合わせや検索・空間分析を行う技術・システムは［ 空欄 ］（地理情報システム）である。", "options": ["GIS", "GPS", "DNS", "SNS"], "ans": 0, "exp": "GIS（Geographic Information System）は地形図・航空写真・人口・地価・ハザード情報などを重ね合わせて分析・可視化します。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地理院地図・GIS"}, {"id": "GEO-MG-02", "cat": "MAP_GIS", "catName": "地図・GIS・防災", "priority": "S", "q": "地形図において、主曲線（等高線）の間隔が極めて狭くなっている場所は、斜面の傾斜が［ 空欄 ］であることを示している。", "options": ["急（険しい）", "緩やか", "完全な水平", "地下空洞"], "ans": 0, "exp": "水平距離が短い間に標高が大きく変化するため、等高線が密集している場所は崖や急斜面を意味します。", "refUrl": "https://maps.gsi.go.jp/", "refLabel": "地理院地図を開く"}, {"id": "GEO-MG-03", "cat": "MAP_GIS", "catName": "地図・GIS・防災", "priority": "S", "q": "自然災害による被害を最小限に抑えるため、洪水・土砂崩れ・津波などの予測危険区域や避難場所・経路を示した地図は［ 空欄 ］である。", "options": ["ハザードマップ", "路線価図", "地質図", "白地図"], "ans": 0, "exp": "自治体が作成・配布するハザードマップは、想定最大規模降雨や高潮リスクなど事前学習と迅速な避難に不可欠です。", "refUrl": "https://disaportal.gsi.go.jp/", "refLabel": "ハザードマップポータル"}, {"id": "GEO-MG-04", "cat": "MAP_GIS", "catName": "地図・GIS・防災", "priority": "A", "q": "航海用海図に用いられるメルカトル図法は角度が正しく描かれる正角図法であるが、高緯度ほど［ 空欄 ］が著しく拡大して描かれる短所がある。", "options": ["面積", "経度間隔", "水深", "標高"], "ans": 0, "exp": "メルカトル図法ではグリーンランドが南米大陸と同等に見えるなど、極に近づくほど面積の歪みが極端に大きくなります。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地図の投影法"}, {"id": "GEO-MG-05", "cat": "MAP_GIS", "catName": "地図・GIS・防災", "priority": "A", "q": "地域調査（野外調査）において、現地に足を運んで景観観察、写真撮影、地元住民への聞き取りなどを行う活動を［ 空欄 ］と呼ぶ。", "options": ["フィールドワーク", "シミュレーション", "ブレーンストーミング", "クラウドソーシング"], "ans": 0, "exp": "事前調査の統計・地図と現地でのフィールドワークを照合することで、地域課題の背景や実態を深く探究できます。", "refUrl": "https://maps.gsi.go.jp/", "refLabel": "地理院地図を開く"}, {"id": "GEO-MG-06", "cat": "MAP_GIS", "catName": "地図・GIS・防災", "priority": "A", "q": "兵庫県明石市を通る東経135度子午線が日本の標準時子午線であり、イギリス・グリニッジを通る本初子午線との時差は［ 空欄 ］時間である。", "options": ["+9", "+6", "+12", "-9"], "ans": 0, "exp": "経度15度ごとに1時間の時差が生じるため、135 ÷ 15 = 9時間、日本の方が進んでいます（UTC+9）。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 経度・時差"}, {"id": "GEO-WEB-01", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「基礎確認は概念・技能、標準演習は知識と資料の対応、複合演習は複数の条件や資料を結び付ける問題です。段階は編集上の目安です。」", "options": ["分野・学習段階を選ぶ", "地図は凡例・方位・縮尺", "統計は単位・年次・分母", "雨温図は気温から降水へ"], "ans": 0, "exp": "基礎確認は概念・技能、標準演習は知識と資料の対応、複合演習は複数の条件や資料を結び付ける問題です。段階は編集上の目安です。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-02", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「見慣れない図表でも、地域名を当てようと急ぐ必要はありません。まず資料の条件をそろえ、その資料から確かに言えることを探します。地形・気候・産業の知識は、読み取った特徴の理由を考えるときに使いましょう。」", "options": ["共通テスト地理の資料は、読む順番を決める", "選んだ根拠を、今度は80字で説明してみる", "降水の季節差を風帯から説明する", "緯度が近い地域の降水差"], "ans": 0, "exp": "見慣れない図表でも、地域名を当てようと急ぐ必要はありません。まず資料の条件をそろえ、その資料から確かに言えることを探します。地形・気候・産業の知識は、読み取った特徴の理由を考えるときに使いましょう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-03", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「色や記号が何を表すかを先に確認。等高線なら標高と間隔、分布図なら「量」か「割合」かを確かめます。隣り合う地域や上流・下流との位置関係も根拠になります。」", "options": ["地図は凡例・方位・縮尺", "降水の季節差を風帯から説明する", "条件に沿って短く説明する", "共通テスト地理の対策でよくある質問"], "ans": 0, "exp": "色や記号が何を表すかを先に確認。等高線なら標高と間隔、分布図なら「量」か「割合」かを確かめます。隣り合う地域や上流・下流との位置関係も根拠になります。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-04", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「人数と構成比、総額と1人当たりを区別。割合が上がっても実数が増えたとは限りません。別の年や違う範囲の数値を、そのまま比べないことが大切です。」", "options": ["統計は単位・年次・分母", "緯度が近い地域の降水差", "共通テスト地理の対策でよくある質問", "乗り継ぎと時差"], "ans": 0, "exp": "人数と構成比、総額と1人当たりを区別。割合が上がっても実数が増えたとは限りません。別の年や違う範囲の数値を、そのまま比べないことが大切です。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-05", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「最暖月・最寒月、気温の年較差、降水量の季節差を順に読みます。7月が夏とは限りません。雨が少ない時期が現地の夏か冬かを、気温の曲線と合わせて確かめます。」", "options": ["雨温図は気温から降水へ", "読み取りと意見を分ける", "標準時と太陽の南中", "メルカトル図法の面積補正"], "ans": 0, "exp": "最暖月・最寒月、気温の年較差、降水量の季節差を順に読みます。7月が夏とは限りません。雨が少ない時期が現地の夏か冬かを、気温の曲線と合わせて確かめます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-06", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「短く書くと、読み取れたことと、説明しきれていないことが見えてきます。以下は四択300問とは別の6題です。資料に基づく説明から始め、面接の追加質問では自分の考えも言葉にしてみましょう。」", "options": ["選んだ根拠を、今度は80字で説明してみる", "地理総合・地理探究の出題範囲と過去問を確認する", "画像の拡大と地図の情報量", "分水界を越える導水"], "ans": 0, "exp": "短く書くと、読み取れたことと、説明しきれていないことが見えてきます。以下は四択300問とは別の6題です。資料に基づく説明から始め、面接の追加質問では自分の考えも言葉にしてみましょう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-07", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A・Bに当たる地形名を挙げ、堆積物や排水性と土地利用の関係を80字以内で説明してください。」", "options": ["氾濫原の微地形と土地利用", "緯経度・南中高度・地方時", "等高線・縮尺・斜面方位", "空間結合と集計単位の限界"], "ans": 0, "exp": "A・Bに当たる地形名を挙げ、堆積物や排水性と土地利用の関係を80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-08", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「この地域で住宅地が広がる場合、昔の土地利用図を調べることにどのような意味がありますか？」", "options": ["面接なら、さらにこう聞かれるかも", "標準時と太陽の南中", "河床縦断と勾配の変化", "段丘面と火山灰による年代比較"], "ans": 0, "exp": "この地域で住宅地が広がる場合、昔の土地利用図を調べることにどのような意味がありますか？", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-09", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「夏と冬の降水の違いが生じる理由を、気圧帯・風帯の季節移動に触れて80字以内で説明してください。」", "options": ["降水の季節差を風帯から説明する", "縮尺と斜面の比較", "ラスターの集約と土地利用", "谷の断面と支谷の高さ"], "ans": 0, "exp": "夏と冬の降水の違いが生じる理由を、気圧帯・風帯の季節移動に触れて80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-10", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「この降水の季節差は、栽培する作物や農業用水の確保にどう関係するでしょうか？」", "options": ["面接なら、さらにこう聞かれるかも", "回転した地図と太陽の方位", "座標参照系と位置のずれ", "地形の形成作用の対応"], "ans": 0, "exp": "この降水の季節差は、栽培する作物や農業用水の確保にどう関係するでしょうか？", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-11", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ボーキサイトの産地とアルミニウム製錬の立地が一致しない理由を、80字以内で説明してください。」", "options": ["鉱石の産地と製錬工場の立地", "メルカトル図法の面積補正", "段丘面と火山灰による年代比較", "年降水量が同じ二つの季節配分"], "ans": 0, "exp": "ボーキサイトの産地とアルミニウム製錬の立地が一致しない理由を、80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-12", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「電力の価格だけで の都市化と洪水の変化", "谷口の堆積地と水利用", "海に近い中緯度の年変化", "月別の土壌水分を追う"], "ans": 0, "exp": "都市化によって河川の流量ピークが早まり、大きくなりやすい理由を、80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-18", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「流域全体で洪水への備えを考えるとき、上流と下流でどのような協力が必要でしょうか？」", "options": ["面接なら、さらにこう聞かれるかも", "段丘面と火山灰による年代比較", "赤道付近で雨季が二度現れる理由", "作付け暦の読み取り"], "ans": 0, "exp": "流域全体で洪水への備えを考えるとき、上流と下流でどのような協力が必要でしょうか？", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-19", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「指定語句、字数、設問が求める理由・比較・変化を確認。解答に必要な要素をそろえる練習へ進みます。」", "options": ["条件に沿って短く説明する", "沈水海岸の形成過程と地域", "低気圧の移動と中緯度の風", "耕種と畜産の結び付き"], "ans": 0, "exp": "指定語句、字数、設問が求める理由・比較・変化を確認。解答に必要な要素をそろえる練習へ進みます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-20", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「数字から言えることと、対策として提案することを分け、効果・負担・限界まで考えます。」", "options": ["読み取りと意見を分ける", "岩石の性質と地表・地下の排水", "ヨーロッパ西岸の冬の温和さ", "養殖方式と湾の環境"], "ans": 0, "exp": "数字から言えることと、対策として提案することを分け、効果・負担・限界まで考えます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-21", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「人口・観光・環境などへの関心を、自分の経験や大学で学びたい内容と結びつけます。」", "options": ["理由と具体例を口で伝える", "海底拡大と海洋地殻の年代", "標高補正で二地点を比べる", "風力資源と消費地の位置"], "ans": 0, "exp": "人口・観光・環境などへの関心を、自分の経験や大学で学びたい内容と結びつけます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-22", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「総合型・学校推薦型も検討する人は、出願資格と選考内容を方式別に確認してください。以下は地理と関わる関心テーマからの案内です。各方式で地理の試験が課されるという意味ではありません。」", "options": ["地理のテーマから、大学別の準備を探す", "横ずれ境界と地震・地殻の生成", "地域の自然植生", "製鉄所の立地条件の変化"], "ans": 0, "exp": "総合型・学校推薦型も検討する人は、出願資格と選考内容を方式別に確認してください。以下は地理と関わる関心テーマからの案内です。各方式で地理の試験が課されるという意味ではありません。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-23", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「このページは「地理総合、地理探究」の学習を想定した単元別教材です。「地理総合／歴史総合／公共」の地理総合部分とは試験の組み合わせや範囲が異なります。出願時の科目選択と、志望校が認める科目を公式資料で確認してください。」", "options": ["地理総合・地理探究の出題範囲と過去問を確認する", "旧版地図と微地形の照合", "森林の土壌断面と物質移動", "情報処理施設の立地"], "ans": 0, "exp": "このページは「地理総合、地理探究」の学習を想定した単元別教材です。「地理総合／歴史総合／公共」の地理総合部分とは試験の組み合わせや範囲が異なります。出願時の科目選択と、志望校が認める科目を公式資料で確認してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-24", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「すべて無料・登録不要で利用できます。分野別の一覧から読む方法と、5・10・20問ずつ演習する方法があります。個別添削や面接練習などの有料指導とは別の教材です。」", "options": ["共通テスト地理の対策でよくある質問", "南アメリカ低緯度の雨季と植生", "太平洋赤道域の東西差", "工程分業と地域間の結び付き"], "ans": 0, "exp": "すべて無料・登録不要で利用できます。分野別の一覧から読む方法と、5・10・20問ずつ演習する方法があります。個別添削や面接練習などの有料指導とは別の教材です。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-25", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「人口・環境・貿易は公共・政治経済とも、地域の成り立ちは歴史とも関わります。地理の演習で気になったテーマを、別の教科から確かめることもできます。」", "options": ["公共・政治経済、日本史とつなげて学ぶ", "年降水量が同じ二つの季節配分", "作付け暦の読み取り", "人口密度の分母"], "ans": 0, "exp": "人口・環境・貿易は公共・政治経済とも、地域の成り立ちは歴史とも関わります。地理の演習で気になったテーマを、別の教科から確かめることもできます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-26", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。Pは北緯40度・東経140度、Qは北緯20度・東経130度。緯経線は模式的な格子。」", "options": ["緯経度・南中高度・地方時", "気候の季節性と世界の分布", "施設園芸の費用と立地", "年齢集団の追跡"], "ans": 0, "exp": "北が上。Pは北緯40度・東経140度、Qは北緯20度・東経130度。緯経線は模式的な格子。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-27", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「地球を半径一定の球とし、大円の全周を40000kmとする。地点Pの対蹠点Rの座標と、地表に沿うP–R間の最短距離の組合せはどれか。」", "options": ["対蹠点と最短距離", "乾燥限界と植生の変化", "圃場と流域の水収支", "国際移動と地域経済"], "ans": 0, "exp": "地球を半径一定の球とし、大円の全周を40000kmとする。地点Pの対蹠点Rの座標と、地表に沿うP–R間の最短距離の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-28", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ1°×1°の緯経線メッシュA・Bに、それぞれ10万人が住む。表の近似値を用いると、Bの人口密度はAの何倍か。また、この比較で面積の違いが生じる理由はどれか。」", "options": ["緯経線メッシュと人口密度", "海に近い中緯度の年変化", "漁獲統計と資源評価", "都市を数える範囲"], "ans": 0, "exp": "同じ1°×1°の緯経線メッシュA・Bに、それぞれ10万人が住む。表の近似値を用いると、Bの人口密度はAの何倍か。また、この比較で面積の違いが生じる理由はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-29", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「東経135°の地方時を標準時として用いる地域を考える。東経120°の地点Aと東経150°の地点Bで太陽が南中する標準時の組合せはどれか。均時差と夏時間は無視する。」", "options": ["標準時と太陽の南中", "寒冷地域の気温と半球", "天然ガスの輸送体系", "生活拠点の再配置"], "ans": 0, "exp": "東経135°の地方時を標準時として用いる地域を考える。東経120°の地点Aと東経150°の地点Bで太陽が南中する標準時の組合せはどれか。均時差と夏時間は無視する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-30", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「太平洋上のA島からB島へ東向きに20分かけて移動する。A島を5月1日0時10分に出発したとき、B島の到着日時はどれか。採用標準時は表の通りで、夏時間はない。」", "options": ["日付変更線と標準時", "日本の冬の降水の地域差", "鉱石処理と輸送の分業", "集落形態と生産の場"], "ans": 0, "exp": "太平洋上のA島からB島へ東向きに20分かけて移動する。A島を5月1日0時10分に出発したとき、B島の到着日時はどれか。採用標準時は表の通りで、夏時間はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-31", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「東京を10月14日22時に出発し、10時間後に都市Lへ到着する。Lで2時間待ち、4時間の飛行で都市Nに着く。Nの到着日時はどれか。表の標準時を使い、夏時間は考えない。」", "options": ["乗り継ぎと時差", "低緯度の風と島の斜面", "海外生産の費用比較", "文化が広がる経路"], "ans": 0, "exp": "東京を10月14日22時に出発し、10時間後に都市Lへ到着する。Lで2時間待ち、4時間の飛行で都市Nに着く。Nの到着日時はどれか。表の標準時を使い、夏時間は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-32", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「異なる縮尺の地図で二つの直線的な斜面P・Qを測った。表から、水平距離が短い方と、平均勾配が大きい方の組合せはどれか。」", "options": ["縮尺と斜面の比較", "海陸風と日変化", "情報処理施設の立地", "中国東部の農業地域比較"], "ans": 0, "exp": "異なる縮尺の地図で二つの直線的な斜面P・Qを測った。表から、水平距離が短い方と、平均勾配が大きい方の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-33", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「地図A・Bに示された各調査区内の集落数を比較する。投影のひずみは無視し、集落密度を実面積1km²当たりの集落数とする。Aの集落密度はBの何倍か。」", "options": ["地図面積と集落密度", "ヨーロッパ西岸の冬の温和さ", "果実輸入と季節差", "海峡と中継貿易"], "ans": 0, "exp": "地図A・Bに示された各調査区内の集落数を比較する。投影のひずみは無視し、集落密度を実面積1km²当たりの集落数とする。Aの集落密度はBの何倍か。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-34", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「元の地図で4cmが実距離1kmを表す縮尺棒を、地図と同じ倍率で拡大する模式図。」", "options": ["画像の拡大と地図の情報量", "低緯度高地と中緯度沿岸", "生産移転と排出統計", "乾燥地域の地下水の更新速度"], "ans": 0, "exp": "元の地図で4cmが実距離1kmを表す縮尺棒を、地図と同じ倍率で拡大する模式図。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-35", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北向き矢印は右向き。PとQは同じ高さにあり、QがPより右側に位置する。」", "options": ["回転した地図と太陽の方位", "盆地の明け方の鉛直気温", "高齢人口の変化を比べる", "西ヨーロッパの園芸農業"], "ans": 0, "exp": "北向き矢印は右向き。PとQは同じ高さにあり、QがPより右側に位置する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-36", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「世界各地の森林の分布面積を色の付いた領域の広さで比較する地図Xと、東京から各都市への最短距離・出発時の方位を読む地図Yを作る。図法の組合せとして適切なものはどれか。」", "options": ["用途に応じた投影法", "同じ降水量でも異なる乾燥の程度", "出生率低下後の人口", "アフリカの降水と植生"], "ans": 0, "exp": "世界各地の森林の分布面積を色の付いた領域の広さで比較する地図Xと、東京から各都市への最短距離・出発時の方位を読む地図Yを作る。図法の組合せとして適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-37", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Oを中心に半径1000kmと2000kmの円。PはOの北1000km、QはOの東2000km。上と右はOでの方位。」", "options": ["正距方位図法と大圏航路", "葉の特徴と季節的乾燥", "都市圏内部の住所移動", "アンデスの高度と土地利用"], "ans": 0, "exp": "Oを中心に半径1000kmと2000kmの円。PはOの北1000km、QはOの東2000km。上と右はOでの方位。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-38", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「メルカトル図法上で小領域P・Qの面積を測った。表の局所的な面積拡大率を使って補正すると、実面積のP：Qはどれか。各領域内では拡大率一定とみなす。」", "options": ["メルカトル図法の面積補正", "森林の土壌断面と物質移動", "国境を越える通勤", "オセアニアの輸出と自然環境"], "ans": 0, "exp": "メルカトル図法上で小領域P・Qの面積を測った。表の局所的な面積拡大率を使って補正すると、実面積のP：Qはどれか。各領域内では拡大率一定とみなす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-39", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「両図とも北が上で同じ縮尺。A・Bとも北から130m、120m、110m、100mの等高線が平行に並ぶ。Aの等高線間隔はBの半分である。水平距離300mの縮尺棒は両図で同じ長さ。」", "options": ["等高線・縮尺・斜面方位", "月別の土壌水分を追う", "都市を数える範囲", "低地の土地利用と浸水"], "ans": 0, "exp": "両図とも北が上で同じ縮尺。A・Bとも北から130m、120m、110m、100mの等高線が平行に並ぶ。Aの等高線間隔はBの半分である。水平距離300mの縮尺棒は両図で同じ長さ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-40", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。北側から140m、120m、100mの3本の等高線が並び、各線の中央部分は北へ屈曲する。南北方向の中央補助線に沿って北から140m、120m、100mの順に交わる。」", "options": ["等高線と河川の左右", "地域の雨の成因を比べる", "都市の規模分布", "土地被覆と貯留施設"], "ans": 0, "exp": "北が上。北側から140m、120m、100mの3本の等高線が並び、各線の中央部分は北へ屈曲する。南北方向の中央補助線に沿って北から140m、120m、100mの順に交わる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-41", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。北側から140m、120m、100mの3本の等高線が並び、各線の中央部分は南へ屈曲する。南北方向の中央補助線に沿って北から140m、120m、100mの順に交わる。」", "options": ["等高線と雨水の流れ", "穀物農場の生産性", "通勤の地域間結合", "施設の指定と地形条件"], "ans": 0, "exp": "北が上。北側から140m、120m、100mの3本の等高線が並び、各線の中央部分は南へ屈曲する。南北方向の中央補助線に沿って北から140m、120m、100mの順に交わる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-42", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。山頂Sを囲む同心の閉じた等高線は外から100m、120m、140m。160m線はなく、山頂まで内側ほど高い。Rは外側の100m等高線上にある。」", "options": ["等高線の標高範囲と比高", "農地面積と延べ作付面積", "山間地域のサービス変化", "電源構成と総排出量"], "ans": 0, "exp": "北が上。山頂Sを囲む同心の閉じた等高線は外から100m、120m、140m。160m線はなく、山頂まで内側ほど高い。Rは外側の100m等高線上にある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-43", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「折れ線の断面図。Pから0・1・2・3・4kmの地表標高は順に100・130・140・160・200m。鉛直方向は水平より拡大している。」", "options": ["断面図の視通と鉛直倍率", "施設園芸の費用と立地", "主食となる作物と環境", "湾に流れ込む負荷"], "ans": 0, "exp": "折れ線の断面図。Pから0・1・2・3・4kmの地表標高は順に100・130・140・160・200m。鉛直方向は水平より拡大している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-44", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「河川の縦断測量で表の値を得た。上流側P–Qと下流側Q–Rについて、平均河床勾配の組合せと、それに対応する典型的な変化として適切なものはどれか。」", "options": ["河床縦断と勾配の変化", "熱帯林地域の土地利用", "人口推計の二つの経路", "観光客の集中する時間"], "ans": 0, "exp": "河川の縦断測量で表の値を得た。上流側P–Qと下流側Q–Rについて、平均河床勾配の組合せと、それに対応する典型的な変化として適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-45", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。中央に南北の尾根、西側に河川A、東側に河川B。Pは尾根の西側で、西のAへ下る矢印がある。」", "options": ["分水界を越える導水", "食料自給率の二つの指標", "中国の沿海部と内陸部", "集計区域と人口密度"], "ans": 0, "exp": "北が上。中央に南北の尾根、西側に河川A、東側に河川B。Pは尾根の西側で、西のAへ下る矢印がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-46", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「地域資料館の候補地を、駅への徒歩経路が800m以内で、平坦な自然堤防または段丘面にある土地から選ぶ。切土・盛土は行わない。表で対象となる候補と、判定に必要な処理の組合せはどれか。」", "options": ["GISと地形条件の重ね合わせ", "養殖方式と湾の環境", "海峡と中継貿易", "交通施策の効果を確かめる"], "ans": 0, "exp": "地域資料館の候補地を、駅への徒歩経路が800m以内で、平坦な自然堤防または段丘面にある土地から選ぶ。切土・盛土は行わない。表で対象となる候補と、判定に必要な処理の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-47", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。駅Sを中心とする半径500mの円。AとDは内側、Cは円の最南点上、Bは東側の円外。」", "options": ["直線の到達圏と道路の到達圏", "エネルギー源の構成と自給", "ヒマラヤ周辺の輸送条件", "鉱産資源と工業（ウェーバーの工業立地論）"], "ans": 0, "exp": "北が上。駅Sを中心とする半径500mの円。AとDは内側、Cは円の最南点上、Bは東側の円外。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-48", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「S–Aは4分、A–Tは7分、S–Bは6分、B–Tは3分、A–Bは3分。全区間は双方向で通行可。」", "options": ["交通ネットワークの結節点", "天然ガスの輸送体系", "中央アジアの交通と資源", "統計は単位・年次・分母"], "ans": 0, "exp": "S–Aは4分、A–Tは7分、S–Bは6分、B–Tは3分、A–Bは3分。全区間は双方向で通行可。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-49", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上の3行4列。各セルは100m四方。上段は森林・森林・畑・畑、中段は森林・畑・畑・宅地、下段は森林・森林・宅地・宅地。」", "options": ["ラスターの集約と土地利用", "水力発電と季節流量", "北大西洋の島国のエネルギー", "合計特殊出生率が下がっても人口が増える理由"], "ans": 0, "exp": "北が上の3行4列。各セルは100m四方。上段は森林・森林・畑・畑、中段は森林・畑・畑・宅地、下段は森林・森林・宅地・宅地。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-50", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「市全体で店舗への徒歩アクセスを分析するGISと、商業施設内の売場面積を測るGISを作る。店舗の表し方として適切な組合せはどれか。」", "options": ["縮尺・目的と点線面データ", "原料と製品の重量変化", "西アフリカの内陸国と港", "地理総合・地理探究の出題範囲と過去問を確認する"], "ans": 0, "exp": "市全体で店舗への徒歩アクセスを分析するGISと、商業施設内の売場面積を測るGISを作る。店舗の表し方として適切な組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-51", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ100haの区域で、旧時点から新時点への土地利用の移り変わりを表にした。旧農地が宅地になった面積と、区域全体の宅地の純増面積の組合せはどれか。」", "options": ["土地利用の遷移と都市化", "つの工場用地", "カナダの資源と製錬", "日付変更線と標準時"], "ans": 0, "exp": "同じ100haの区域で、旧時点から新時点への土地利用の移り変わりを表にした。旧農地が宅地になった面積と、区域全体の宅地の純増面積の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-52", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「店舗の点データを行政区の面データと空間結合した結果が表である。地区の商業施設の集中度について、表から適切に判断した説明はどれか。」", "options": ["空間結合と集計単位の限界", "供給網の分散と輸送拠点", "南米の資源輸出と価格", "正距方位図法と大圏航路"], "ans": 0, "exp": "店舗の点データを行政区の面データと空間結合した結果が表である。地区の商業施設の集中度について、表から適切に判断した説明はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-53", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「元は20m四方を4つの10m四方セルに区切り、値は100・100・100・180m。平均120mを同じ20m四方の1セルに格納する。」", "options": ["標高データの解像度と集約方法", "情報処理施設の立地", "オセアニアの輸出と自然環境", "河床縦断と勾配の変化"], "ans": 0, "exp": "元は20m四方を4つの10m四方セルに区切り、値は100・100・100・180m。平均120mを同じ20m四方の1セルに格納する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-54", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「異なる機関の道路データと建物データを重ねたところ、複数の交差点と建物でほぼ一様な位置のずれが見られた。表のメタデータを踏まえ、最初の処理として最も適切なものはどれか。」", "options": ["座標参照系と位置のずれ", "貨物の価値と輸送手段", "日本の地域と農業構成", "土地利用の遷移と都市化"], "ans": 0, "exp": "異なる機関の道路データと建物データを重ねたところ、複数の交差点と建物でほぼ一様な位置のずれが見られた。表のメタデータを踏まえ、最初の処理として最も適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-55", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ資料から、農地率を濃淡で示す階級区分図Xと、農地面積を円の面積で示す比例記号図Yを作る。Xが最も濃い地区と、Yの円が最も大きい地区の組合せはどれか。」", "options": ["階級区分図と比例記号図", "輸出額の変化と産業構造", "湾内外の津波記録", "段丘面と火山灰による年代比較"], "ans": 0, "exp": "同じ資料から、農地率を濃淡で示す階級区分図Xと、農地面積を円の面積で示す比例記号図Yを作る。Xが最も濃い地区と、Yの円が最も大きい地区の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-56", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。上部に山地と谷口があり、川は谷口から低地へ分かれ、Xの扇形の砂礫堆積地をつくる。」", "options": ["谷口の堆積地と水利用", "中継港と地域経済", "支流の合流と流量ピーク", "谷の断面と支谷の高さ"], "ans": 0, "exp": "北が上。上部に山地と谷口があり、川は谷口から低地へ分かれ、Xの扇形の砂礫堆積地をつくる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-57", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。北から来た川は河口で3本に分かれ、砂泥の堆積地が南の海へ張り出す。海は下側、陸地は上側。」", "options": ["河口の堆積地と海岸線の変化", "地域人口の増減要因", "沿岸の土地履歴と災害記録", "地形の形成作用の対応"], "ans": 0, "exp": "北が上。北から来た川は河口で3本に分かれ、砂泥の堆積地が南の海へ張り出す。海は下側、陸地は上側。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-58", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中央の川の両岸に微高地Aがあり、Aより外側のBは低い。洪水時の堆積による自然地形で人工堤防はない。」", "options": ["氾濫原の微地形と堆積物", "高齢人口の変化を比べる", "都市気温の比較地点", "年降水量が同じ二つの季節配分"], "ans": 0, "exp": "中央の川の両岸に微高地Aがあり、Aより外側のBは低い。洪水時の堆積による自然地形で人工堤防はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-59", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中央に現在の川、左右のやや高い段にII、さらに高い段にI。段階的な下刻で旧河床面が取り残された設定。」", "options": ["段丘面と火山灰による年代比較", "死亡率の地域比較", "季節と発電資源", "モンスーン気候と熱帯雨林気候の区別"], "ans": 0, "exp": "中央に現在の川、左右のやや高い段にII、さらに高い段にI。段階的な下刻で旧河床面が取り残された設定。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-60", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「川は左下から上部へ曲がり右下へ流れる。湾曲の外側である上側岸にP、内側である下側岸にQ。」", "options": ["蛇行河川の侵食と流路変化", "年齢集団の追跡", "湾に流れ込む負荷", "赤道付近で雨季が二度現れる理由"], "ans": 0, "exp": "川は左下から上部へ曲がり右下へ流れる。湾曲の外側である上側岸にP、内側である下側岸にQ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-61", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「日本の同じ平野で、河道から離れた二つの堆積地A・Bを調べた。表の特徴と整合する地形の組合せはどれか。」", "options": ["粒径資料からみる堆積環境", "移動率と年齢構成", "国際河川の季節配分", "海陸風と日変化"], "ans": 0, "exp": "日本の同じ平野で、河道から離れた二つの堆積地A・Bを調べた。表の特徴と整合する地形の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-62", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のA・Bは沈水によって生じた海岸の観察記録である。地形名と、同じ成因の海岸が広く見られる地域の組合せとして適切なものはどれか。」", "options": ["沈水海岸の形成過程と地域", "移住を生む条件", "市街地更新と災害条件", "都市の夜の気温と土地被覆"], "ans": 0, "exp": "表のA・Bは沈水によって生じた海岸の観察記録である。地形名と、同じ成因の海岸が広く見られる地域の組合せとして適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-63", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「平面図。左上が陸、右と下が海。沿岸方向に右へ運ばれた砂が、陸から右へ伸びる細長いXをつくる。X先端は島や対岸に接しない。」", "options": ["砂の移動と海岸堆積地形", "国境を越える通勤", "駅距離と商業の分布", "高緯度の森林の境界"], "ans": 0, "exp": "平面図。左上が陸、右と下が海。沿岸方向に右へ運ばれた砂が、陸から右へ伸びる細長いXをつくる。X先端は島や対岸に接しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-64", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「断面図。海成の堆積物と貝化石を含む旧海岸の平坦面が、右側の現在の海面より上にある。」", "options": ["海成段丘と地盤の隆起", "都市区域の変更", "地区別の回答と人口構成", "月別の土壌水分を追う"], "ans": 0, "exp": "断面図。海成の堆積物と貝化石を含む旧海岸の平坦面が、右側の現在の海面より上にある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-65", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「内陸の台地で、円形のくぼみが多く、地表を流れる川が少ない一方、地下洞窟には流水がある。露出する岩石には貝殻などの化石が含まれる。この地形の形成と土地利用上の特徴を説明するものはどれか。」", "options": ["岩石の性質と地表・地下の排水", "昼夜の人口と都市機能", "気候要素と大気大循環（恒風・海流）", "作付け暦の読み取り"], "ans": 0, "exp": "内陸の台地で、円形のくぼみが多く、地表を流れる川が少ない一方、地下洞窟には流水がある。露出する岩石には貝殻などの化石が含まれる。この地形の形成と土地利用上の特徴を説明するものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-66", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Aは細い谷底を持つV字状の断面で流水の侵食痕がある。Bは広い谷底と急な側壁を持つU字状の断面で、岩盤に平行な擦痕がある。」", "options": ["谷の断面と支谷の高さ", "都市圏の人口配置の変化", "人口動態・人口転換モデル・国際人口移動", "耕種と畜産の結び付き"], "ans": 0, "exp": "Aは細い谷底を持つV字状の断面で流水の侵食痕がある。Bは広い谷底と急な側壁を持つU字状の断面で、岩盤に平行な擦痕がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-67", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「かつて氷河のあった谷でA・Bの堆積物を調べた。形成過程の組合せとして適切なものはどれか。」", "options": ["氷河周辺の堆積物の識別", "生活拠点の再配置", "統計は単位・年次・分母", "養殖方式と湾の環境"], "ans": 0, "exp": "かつて氷河のあった谷でA・Bの堆積物を調べた。形成過程の組合せとして適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-68", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「海の下にある左右のプレートが中央から離れる向きに動く断面図。中央の下から高温物質が上昇している。」", "options": ["海底拡大と海洋地殻の年代", "通勤の地域間結合", "降水の季節差を風帯から説明する", "風力資源と消費地の位置"], "ans": 0, "exp": "海の下にある左右のプレートが中央から離れる向きに動く断面図。中央の下から高温物質が上昇している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-69", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「左の海洋プレートは右へ進み、右側の陸側プレートの下へ傾いて沈み込む。境界の地表近くに海溝、陸側に火山がある。」", "options": ["沈み込みと震源の分布", "購買行動と中心地の階層", "条件に沿って短く説明する", "製鉄所の立地条件の変化"], "ans": 0, "exp": "左の海洋プレートは右へ進み、右側の陸側プレートの下へ傾いて沈み込む。境界の地表近くに海溝、陸側に火山がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-70", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A・Bの観察記録を、形成が続く地域の代表例と結び付ける。最も適切な組合せはどれか。」", "options": ["山脈・地溝とプレート境界", "地域平均と都市化", "共通テスト地理の対策でよくある質問", "情報処理施設の立地"], "ans": 0, "exp": "A・Bの観察記録を、形成が続く地域の代表例と結び付ける。最も適切な組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-71", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「縦の境界線の左がA、右がB。Aの矢印は上向き、Bは下向きで、両者は境界線に平行に反対方向へ進む。」", "options": ["横ずれ境界と地震・地殻の生成", "東南アジアの文化分布", "標準時と太陽の南中", "工程分業と地域間の結び付き"], "ans": 0, "exp": "縦の境界線の左がA、右がB。Aの矢印は上向き、Bは下向きで、両者は境界線に平行に反対方向へ進む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-72", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「東が右、西が左。東端に0百万年前の火山、その西に2百万年前、さらに西に4百万年前の火山。地下供給源は東端に固定している。」", "options": ["火山列の年代とプレート移動速度", "住居の形と環境", "画像の拡大と地図の情報量", "人口密度の分母"], "ans": 0, "exp": "東が右、西が左。東端に0百万年前の火山、その西に2百万年前、さらに西に4百万年前の火山。地下供給源は東端に固定している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-73", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「次の地形のうち、侵食による地形と堆積による地形を正しく並べたものはどれか。」", "options": ["地形の形成作用の対応", "人口推計の二つの経路", "等高線・縮尺・斜面方位", "年齢集団の追跡"], "ans": 0, "exp": "次の地形のうち、侵食による地形と堆積による地形を正しく並べたものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-74", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「平野のXについて表の資料を得た。地形の解釈と、追加調査でその解釈を確かめる方法として適切なものはどれか。」", "options": ["旧版地図と微地形の照合", "中国東部の農業地域比較", "河床縦断と勾配の変化", "国際移動と地域経済"], "ans": 0, "exp": "平野のXについて表の資料を得た。地形の解釈と、追加調査でその解釈を確かめる方法として適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-75", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。西の山地から出た川は谷口Aで扇状の低地へ入り、東へ流れて海に注ぐBで分流する。Aは谷口、Bは河口。」", "options": ["河川沿いの堆積物と土地利用", "内陸アジアの牧畜", "ラスターの集約と土地利用", "都市を数える範囲"], "ans": 0, "exp": "北が上。西の山地から出た川は谷口Aで扇状の低地へ入り、東へ流れて海に注ぐBで分流する。Aは谷口、Bは河口。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-76", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「地点Pは緯度30〜40度の低地にある。雨温図に合う半球・大陸内の位置・夏の水蒸気の供給の組合せを選べ。」", "options": ["雨温図から大陸東西の違いを読む", "東南アジアの農産物と地域", "座標参照系と位置のずれ", "生活拠点の再配置"], "ans": 0, "exp": "地点Pは緯度30〜40度の低地にある。雨温図に合う半球・大陸内の位置・夏の水蒸気の供給の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-77", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「南アメリカ内陸の低緯度にある地点Pについて、乾季の季節と自然植生の組合せを選べ。植生は伐採・放牧の影響を受ける前を考える。」", "options": ["南アメリカ低緯度の雨季と植生", "南アジアの都市と産業", "段丘面と火山灰による年代比較", "集落形態と生産の場"], "ans": 0, "exp": "南アメリカ内陸の低緯度にある地点Pについて、乾季の季節と自然植生の組合せを選べ。植生は伐採・放牧の影響を受ける前を考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-78", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「雨温図の地点Pは低地で、古い地表に自然林が広がる。気候と、森林を長期間伐採した際に注意すべき土壌の性質の組合せを選べ。」", "options": ["高温多雨な低地の自然環境", "ヒマラヤ周辺の輸送条件", "海成段丘と地盤の隆起", "文化が広がる経路"], "ans": 0, "exp": "雨温図の地点Pは低地で、古い地表に自然林が広がる。気候と、森林を長期間伐採した際に注意すべき土壌の性質の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-79", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「図は地点P、表は地点Qの資料である。P・Qは北緯45度前後で標高差は小さい。Pの年較差と、Qより年較差が大きい主な背景の組合せを選べ。」", "options": ["年較差と大陸性", "西アジアの海上輸送路", "沈み込みと震源の分布", "中国東部の農業地域比較"], "ans": 0, "exp": "図は地点P、表は地点Qの資料である。P・Qは北緯45度前後で標高差は小さい。Pの年較差と、Qより年較差が大きい主な背景の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-80", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「図のPと、表のQは北半球の温帯低地で、乾燥帯には属さない。Pの年降水量と、Qに適した気候の説明の組合せを選べ。」", "options": ["年降水量が同じ二つの季節配分", "西アジアの気候と農業の差", "旧版地図と微地形の照合", "海峡と中継貿易"], "ans": 0, "exp": "図のPと、表のQは北半球の温帯低地で、乾燥帯には属さない。Pの年降水量と、Qに適した気候の説明の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-81", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「図は東アジアの温帯低地を想定したPである。6〜8月の降水が年量に占める割合と、この季節に多雨となる背景の組合せを選べ。」", "options": ["夏季降水割合と東アジアの季節風", "西ヨーロッパの園芸農業", "年較差と大陸性", "乾燥地域の地下水の更新速度"], "ans": 0, "exp": "図は東アジアの温帯低地を想定したPである。6〜8月の降水が年量に占める割合と、この季節に多雨となる背景の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-82", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北緯35度前後の大陸西岸にあるPの雨温図である。降水の季節変化を説明する組合せを選べ。」", "options": ["大陸西岸の降水と季節変化", "乾燥国の人口と耕地", "大陸内部の気温と水分条件", "西ヨーロッパの園芸農業"], "ans": 0, "exp": "北緯35度前後の大陸西岸にあるPの雨温図である。降水の季節変化を説明する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-83", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Pの年変化をもつ気候がみられる地域と、その自然植生の組合せを選べ。図は実測値ではなく、特定都市を同定するものではない。」", "options": ["気候の季節性と世界の分布", "西アフリカの内陸国と港", "冷帯と寒帯を分ける夏の気温", "アフリカの降水と植生"], "ans": 0, "exp": "Pの年変化をもつ気候がみられる地域と、その自然植生の組合せを選べ。図は実測値ではなく、特定都市を同定するものではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-84", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Pは北緯25〜30度、低地にある。雨温図に合う気候と、その緯度帯で広い乾燥地域が形成される主な大気の動きの組合せを選べ。」", "options": ["少雨地域の位置と大気循環", "北米の農業と水利用",  "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北緯20度の海洋に、南北に長い山地をもつ島がある。年間を通じて貿易風が卓越するとしたとき、風向と降水量が多くなりやすい斜面の組合せを選べ。」", "options": ["低緯度の風と島の斜面", "季節と発電資源", "集荷と配送の拠点配置", "日付変更線と標準時"], "ans": 0, "exp": "北緯20度の海洋に、南北に長い山地をもつ島がある。年間を通じて貿易風が卓越するとしたとき、風向と降水量が多くなりやすい斜面の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-99", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表の低気圧の移動に関係する大規模な風と、その風が大陸西岸の気候に与える影響の組合せを選べ。」", "options": ["低気圧の移動と中緯度の風", "観光地のごみ指標", "輸出額の変化と産業構造", "正距方位図法と大圏航路"], "ans": 0, "exp": "表の低気圧の移動に関係する大規模な風と、その風が大陸西岸の気候に与える影響の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-100", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「インド半島西岸で6〜9月に降水が増え、同緯度でも西ガーツ山脈の西側が東側より多雨となる。この特徴に合う説明を選べ。」", "options": ["南アジアの降水の東西差", "湿地と炭素の動き", "原料調達を含む供給網", "河床縦断と勾配の変化"], "ans": 0, "exp": "インド半島西岸で6〜9月に降水が増え、同緯度でも西ガーツ山脈の西側が東側より多雨となる。この特徴に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-101", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北側が海、南側が陸の海岸で、晴天・弱い一般風の日に表の温度を観測した。午後と明け方の地表付近の局地風の組合せを選べ。」", "options": ["海陸風と日変化", "沿岸の漂着物と季節", "年齢構成と扶養負担", "土地利用の遷移と都市化"], "ans": 0, "exp": "北側が海、南側が陸の海岸で、晴天・弱い一般風の日に表の温度を観測した。午後と明け方の地表付近の局地風の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-102", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「南アメリカ南部の南緯45度付近を、西の太平洋側から東の内陸側へ調べた。表の降水差に合う説明を選べ。」", "options": ["山脈両側の降水量", "観光客の集中する時間", "年齢集団の追跡", "氾濫原の微地形と堆積物"], "ans": 0, "exp": "南アメリカ南部の南緯45度付近を、西の太平洋側から東の内陸側へ調べた。表の降水差に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-103", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表の空気塊がPから山頂を越えてQへ移動する。Qの気温と、Pに比べた相対湿度の変化の組合せを選べ。」", "options": ["山を越える空気の温度と湿度", "市街地更新と災害条件", "年齢別にみる転出", "岩石の性質と地表・地下の排水"], "ans": 0, "exp": "表の空気塊がPから山頂を越えてQへ移動する。Qの気温と、Pに比べた相対湿度の変化の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-104", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ北緯50度前後の低地で、Pはヨーロッパの大西洋沿岸、Qは北アメリカ大陸東岸を想定する。表の冬季の差を説明する組合せを選べ。」", "options": ["ヨーロッパ西岸の冬の温和さ", "建物の階と土地利用", "都市人口の伸び方", "火山列の年代とプレート移動速度"], "ans": 0, "exp": "同じ北緯50度前後の低地で、Pはヨーロッパの大西洋沿岸、Qは北アメリカ大陸東岸を想定する。表の冬季の差を説明する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-105", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北太平洋北部で、南からの湿った空気が寒流域へ移動した。表の条件で霧ができる過程と、同じ水蒸気量のまま暖流域へ進んだ場合の相対湿度の変化を選べ。」", "options": ["海上の霧と露点", "周遊観光と延べ人数", "昼夜の人口と都市機能", "年較差と大陸性"], "ans": 0, "exp": "北太平洋北部で、南からの湿った空気が寒流域へ移動した。表の条件で霧ができる過程と、同じ水蒸気量のまま暖流域へ進んだ場合の相対湿度の変化を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-106", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「P・Qは北緯50度前後の同程度の標高にある。海洋からの距離と卓越風を踏まえると、表に合う組合せはどれか。」", "options": ["同緯度の東西比較", "空中写真の季節と農地", "市街地の広がりと交通", "乾燥限界と植生の変化"], "ans": 0, "exp": "P・Qは北緯50度前後の同程度の標高にある。海洋からの距離と卓越風を踏まえると、表に合う組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-107", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のX・Yは、東アフリカの赤道付近の高地と、西ヨーロッパの海岸低地のいずれかを想定する。地域と気温変化の説明が正しいものを選べ。」", "options": ["低緯度高地と中緯度沿岸", "あわせて使いたい無料プリント", "交通手段と都市の成長", "低緯度高地の気候を分解する"], "ans": 0, "exp": "表のX・Yは、東アフリカの赤道付近の高地と、西ヨーロッパの海岸低地のいずれかを想定する。地域と気温変化の説明が正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-108", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同緯度・同標高の都市中心部と郊外で、風が弱く晴れた日に表の結果を得た。夜の差を説明する土地被覆と熱の働きを選べ。」", "options": ["都市の夜の気温と土地被覆", "気候要素と大気大循環（恒風・海流）", "地域平均と都市化", "南アジアの降水の東西差"], "ans": 0, "exp": "同緯度・同標高の都市中心部と郊外で、風が弱く晴れた日に表の結果を得た。夜の差を説明する土地被覆と熱の働きを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-109", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同緯度のPとQの平均気温を、標高0mに換算して比較する。100m高くなると0.6℃低下するモデルを使うとき、換算後の差と判断として正しいものを選べ。」", "options": ["標高補正で二地点を比べる", "鉱産資源と工業（ウェーバーの工業立地論）", "文化が広がる経路", "低緯度高地と中緯度沿岸"], "ans": 0, "exp": "同緯度のPとQの平均気温を、標高0mに換算して比較する。100m高くなると0.6℃低下するモデルを使うとき、換算後の差と判断として正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-110", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「盆地で晴天・弱風の明け方に表を得た。地表付近の露点は3℃である。起こりやすい現象とその過程の組合せを選べ。」", "options": ["盆地の明け方の鉛直気温", "国家・民族・領土と地政学", "住宅地の世代と移動", "高緯度の森林の境界"], "ans": 0, "exp": "盆地で晴天・弱風の明け方に表を得た。地表付近の露点は3℃である。起こりやすい現象とその過程の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-111", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある北半球の温帯地域で、1年だけ7月降水量が5mmとなった。その地域を地中海性気候へ分類し直すか検討するとき、最も必要な追加資料を選べ。」", "options": ["気候区分に使う資料の期間", "地図は凡例・方位・縮尺", "内陸アジアの牧畜", "月別の土壌水分を追う"], "ans": 0, "exp": "ある北半球の温帯地域で、1年だけ7月降水量が5mmとなった。その地域を地中海性気候へ分類し直すか検討するとき、最も必要な追加資料を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-112", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「P・Qは北緯35度前後の低地で、年平均気温と年降水量は等しい。表の季節配分から、大陸の東西と夏の水分条件について正しいものを選べ。」", "options": ["東西岸の降水配分を比較する", "選んだ根拠を、今度は80字で説明してみる", "東南アジアの一次産品と工業", "作付け暦の読み取り"], "ans": 0, "exp": "P・Qは北緯35度前後の低地で、年平均気温と年降水量は等しい。表の季節配分から、大陸の東西と夏の水分条件について正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-113", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「年降水量Pが乾燥限界R未満ならB、R/2未満ならBW、R/2以上R未満ならBSとする。表の判定と背景の組合せを選べ。」", "options": ["同じ降水量でも異なる乾燥の程度", "降水の季節差を風帯から説明する", "国境を越える流域の利用", "耕種と畜産の結び付き"], "ans": 0, "exp": "年降水量Pが乾燥限界R未満ならB、R/2未満ならBW、R/2以上R未満ならBSとする。表の判定と背景の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-114", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「土地利用の影響を受ける前の植生を考える。表のP・Q・Rに対応する植生の組合せを選べ。」", "options": ["地域の自然植生", "緯度が近い地域の降水差", "西アジアの気候と農業の差", "養殖方式と湾の環境"], "ans": 0, "exp": "土地利用の影響を受ける前の植生を考える。表のP・Q・Rに対応する植生の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-115", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「シベリアを南から北へ進むと、針葉樹林の広い地域から、低い草本やコケ類の多い地域へ移る。この変化と最も直接に関係する気候指標を選べ。」", "options": ["高緯度の森林の境界", "読み取りと意見を分ける", "北欧の資源と地形", "風力資源と消費地の位置"], "ans": 0, "exp": "シベリアを南から北へ進むと、針葉樹林の広い地域から、低い草本やコケ類の多い地域へ移る。この変化と最も直接に関係する気候指標を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-116", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「温帯のAでは夏に少雨、Bでは冬に低温となり、Aの樹木は硬い葉を保ち、Bの広葉樹の多くは冬に葉を落とす。適応と地域例の組合せを選べ。」", "options": ["葉の特徴と季節的乾燥", "地理総合・地理探究の出題範囲と過去問を確認する", "アフリカの降水と植生", "製鉄所の立地条件の変化"], "ans": 0, "exp": "温帯のAでは夏に少雨、Bでは冬に低温となり、Aの樹木は硬い葉を保ち、Bの広葉樹の多くは冬に葉を落とす。適応と地域例の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-117", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「南アメリカの湿潤熱帯で、古く安定した地表の土壌を調べた。赤色で深い風化層があり、溶けて移動しやすい成分は少ない。この特徴の形成過程を選べ。」", "options": ["湿潤地域の土壌断面", "緯経度・南中高度・地方時", "北米の国境を越える製造業", "情報処理施設の立地"], "ans": 0, "exp": "南アメリカの湿潤熱帯で、古く安定した地表の土壌を調べた。赤色で深い風化層があり、溶けて移動しやすい成分は少ない。この特徴の形成過程を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-118", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ユーラシア中緯度の草原で、厚く黒い表層と豊富な腐植をもつ土壌を観察した。名称と、湿潤熱帯の赤色土壌との違いを説明する組合せを選べ。」", "options": ["草原の表層と土壌形成", "標準時と太陽の南中", "農地所有の偏り", "工程分業と地域間の結び付き"], "ans": 0, "exp": "ユーラシア中緯度の草原で、厚く黒い表層と豊富な腐植をもつ土壌を観察した。名称と、湿潤熱帯の赤色土壌との違いを説明する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-119", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北ヨーロッパの冷涼な森林で表の断面を観察した。土壌名と、上層から下層への物質移動の組合せを選べ。」", "options": ["森林の土壌断面と物質移動", "縮尺と斜面の比較", "北海道の畑作地域", "人口密度の分母"], "ans": 0, "exp": "北ヨーロッパの冷涼な森林で表の断面を観察した。土壌名と、上層から下層への物質移動の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-120", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ気候・植生の地域でPには黒い火山灰土、Qには地下水位の高い低地の灰色の土がみられた。Pの黒色とQの灰色を、それぞれ説明する主な過程を選べ。」", "options": ["気候が同じでも違う土壌", "回転した地図と太陽の方位", "異なる地域に共通する農業立地", "年齢集団の追跡"], "ans": 0, "exp": "同じ気候・植生の地域でPには黒い火山灰土、Qには地下水位の高い低地の灰色の土がみられた。Pの黒色とQの灰色を、それぞれ説明する主な過程を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-121", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表は高緯度の平坦な土地の地温である。深さ0.2mでは毎夏融解・毎冬凍結し、1.5m以下は3年間0℃以下だった。夏に地表付近が湿地化しやすい理由を選べ。」", "options": ["高緯度の地温と水の動き", "メルカトル図法の面積補正", "低地の断面と水面", "国際移動と地域経済"], "ans": 0, "exp": "表は高緯度の平坦な土地の地温である。深さ0.2mでは毎夏融解・毎冬凍結し、1.5m以下は3年間0℃以下だった。夏に地表付近が湿地化しやすい理由を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-122", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北半球の地中海沿岸を想定した資料である。5月初めの土壌水分貯留は100mm。各月にP−Eを加え、0mmを下回る分は不足量とする。このモデルで初めて不足が生じる月と、その背景を選べ。」", "options": ["月別の土壌水分を追う", "等高線と雨水の流れ", "斜面・谷の災害", "都市を数える範囲"], "ans": 0, "exp": "北半球の地中海沿岸を想定した資料である。5月初めの土壌水分貯留は100mm。各月にP−Eを加え、0mmを下回る分は不足量とする。このモデルで初めて不足が生じる月と、その背景を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-123", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「緯度の絶対値と標高が等しい北緯35度のPと南緯35度のQを比べる。6月の昼の長さと南中高度の組合せとして正しいものを選べ。」", "options": ["つの半球の日射の季節", "河床縦断と勾配の変化", "施設の指定と地形条件", "生活拠点の再配置"], "ans": 0, "exp": "緯度の絶対値と標高が等しい北緯35度のPと南緯35度のQを比べる。6月の昼の長さと南中高度の組合せとして正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-124", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「太平洋赤道域で、表の状態が数か月以上続いている。平常時からの変化として整合する組合せを選べ。」", "options": ["太平洋赤道域の東西差", "直線の到達圏と道路の到達圏", "農業地域の気候対策", "集落形態と生産の場"], "ans": 0, "exp": "太平洋赤道域で、表の状態が数か月以上続いている。平常時からの変化として整合する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-125", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「P・Q・Rの多雨を説明する主なしくみを対応させたものを選べ。」", "options": ["地域の雨の成因を比べる", "縮尺・目的と点線面データ", "熱帯の斜面耕地", "文化が広がる経路"], "ans": 0, "exp": "P・Q・Rの多雨を説明する主なしくみを対応させたものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-126", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「インド北部の平野を想定した資料で、雨季と乾季に組み合わせる穀物と、その作付けを支える条件として適切なものを選べ。」", "options": ["モンスーン地域の作付け", "標高データの解像度と集約方法", "湿地と炭素の動き", "中国東部の農業地域比較"], "ans": 0, "exp": "インド北部の平野を想定した資料で、雨季と乾季に組み合わせる穀物と、その作付けを支える条件として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-127", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「斜面の棚田Pと沖積低地の水田Qを比較した。地形と水利用の関係について、適切な説明を選べ。」", "options": ["斜面と低地の農地利用", "谷口の堆積地と水利用", "観光の季節性と水需要", "海峡と中継貿易"], "ans": 0, "exp": "斜面の棚田Pと沖積低地の水田Qを比較した。地形と水利用の関係について、適切な説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-128", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ穀物を作る農場P・Qについて、土地生産性と労働生産性の比較、および経営の説明がともに適切なものを選べ。労働時間は農場全体の年間合計である。」", "options": ["穀物農場の生産性", "段丘面と火山灰による年代比較", "上流施設と海岸の変化", "乾燥地域の地下水の更新速度"], "ans": 0, "exp": "同じ穀物を作る農場P・Qについて、土地生産性と労働生産性の比較、および経営の説明がともに適切なものを選べ。労働時間は農場全体の年間合計である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-129", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「資料のX・Yの呼び方と、それを可能にする条件の組合せを選べ。」", "options": ["作付け暦の読み取り", "沈水海岸の形成過程と地域", "周遊観光と延べ人数", "西ヨーロッパの園芸農業"], "ans": 0, "exp": "資料のX・Yの呼び方と、それを可能にする条件の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-130", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「地中海沿岸の産地で、冬小麦と夏季出荷の野菜を栽培する。降水の季節性と作物の違いを踏まえた説明を選べ。」", "options": ["地中海沿岸の作物と水利用", "岩石の性質と地表・地下の排水", "交通施策の効果を確かめる", "アフリカの降水と植生"], "ans": 0, "exp": "地中海沿岸の産地で、冬小麦と夏季出荷の野菜を栽培する。降水の季節性と作物の違いを踏まえた説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-131", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある地区で圃場整備とかんがい整備が行われた。表から読み取れる変化と、農業の変化の説明として適切なものを選べ。」", "options": ["農地面積と延べ作付面積", "海底拡大と海洋地殻の年代", "ケッペンの気候区分と植生・土壌", "アンデスの高度と土地利用"], "ans": 0, "exp": "ある地区で圃場整備とかんがい整備が行われた。表から読み取れる変化と、農業の変化の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-132", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「P・Qは、北海道東部の草地型酪農地域と大都市近郊の酪農地域の特徴を単純化したものである。対応と立地の説明として適切なものを選べ。」", "options": ["つの酪農地域", "横ずれ境界と地震・地殻の生成", "国家・民族・領土と地政学", "オセアニアの輸出と自然環境"], "ans": 0, "exp": "P・Qは、北海道東部の草地型酪農地域と大都市近郊の酪農地域の特徴を単純化したものである。対応と立地の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-133", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表は同じ野菜を作る三つの産地の例である。P・Q・Rの立地と出荷の説明として適切なものを選べ。」", "options": ["野菜産地の出荷時期", "旧版地図と微地形の照合", "雨温図は気温から降水へ", "低地の土地利用と浸水"], "ans": 0, "exp": "表は同じ野菜を作る三つの産地の例である。P・Q・Rの立地と出荷の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-134", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同一品質・同一収量のトマトを冬に出荷するP・Q産地を比較する。燃料単価だけが2倍になったとき、収益が高い産地とその理由の組合せを選べ。販売収入と表以外の費用は等しい。」", "options": ["施設園芸の費用と立地", "南アメリカ低緯度の雨季と植生", "鉱石の産地と製錬工場の立地", "土地被覆と貯留施設"], "ans": 0, "exp": "同一品質・同一収量のトマトを冬に出荷するP・Q産地を比較する。燃料単価だけが2倍になったとき、収益が高い産地とその理由の組合せを選べ。販売収入と表以外の費用は等しい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-135", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「P国はコーヒーに輸出を依存し、食料を輸入する。コーヒーの輸出量は変わらず価格が20％下落、その他の輸出額は不変だった。同時に輸入穀物の単価が25％上昇した。輸出収入の全額で買える穀物量は以前の何％になるか。」", "options": ["商品作物への依存と交易", "年降水量が同じ二つの季節配分", "読み取りと意見を分ける", "施設の指定と地形条件"], "ans": 0, "exp": "P国はコーヒーに輸出を依存し、食料を輸入する。コーヒーの輸出量は変わらず価格が20％下落、その他の輸出額は不変だった。同時に輸入穀物の単価が25％上昇した。輸出収入の全額で買える穀物量は以前の何％になるか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-136", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「畑作と畜産を組み合わせた農場で、家畜頭数は変えず購入飼料を増やした。表に示す外部投入と農産物による搬出を比較した窒素収支について、適切な説明を選べ。表以外の投入・搬出条件は変わらないとする。」", "options": ["耕種と畜産の結び付き", "気候の季節性と世界の分布", "公共・政治経済、日本史とつなげて学ぶ", "電源構成と総排出量"], "ans": 0, "exp": "畑作と畜産を組み合わせた農場で、家畜頭数は変えず購入飼料を増やした。表に示す外部投入と農産物による搬出を比較した窒素収支について、適切な説明を選べ。表以外の投入・搬出条件は変わらないとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-137", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「熱帯林地域の移動耕作で、同じ区画の作付けは2年間のまま、休閑期間が12年から3年になった。この変化の説明として適切なものを選べ。」", "options": ["熱帯林地域の土地利用", "乾燥限界と植生の変化", "日付変更線と標準時", "湾に流れ込む負荷"], "ans": 0, "exp": "熱帯林地域の移動耕作で、同じ区画の作付けは2年間のまま、休閑期間が12年から3年になった。この変化の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-138", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中央アジアの乾燥地を想定した圃場で、かんがい開始後に地下水位が上昇し、地表付近の塩分濃度が増えた。表から考えられる主な過程と対策の組合せを選べ。」", "options": ["乾燥地のかんがいと土壌", "海に近い中緯度の年変化", "回転した地図と太陽の方位", "観光客の集中する時間"], "ans": 0, "exp": "中央アジアの乾燥地を想定した圃場で、かんがい開始後に地下水位が上昇し、地表付近の塩分濃度が増えた。表から考えられる主な過程と対策の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-139", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「かんがい方式の変更後、作物の収穫量は変わらなかった。取水のうち下流に戻る水は再利用でき、その他はこの流域外へ失われるとする。圃場の節水量と流域全体の水消費削減量の組合せを選べ。」", "options": ["圃場と流域の水収支", "寒冷地域の気温と半球", "等高線と河川の左右", "集計区域と人口密度"], "ans": 0, "exp": "かんがい方式の変更後、作物の収穫量は変わらなかった。取水のうち下流に戻る水は再利用でき、その他はこの流域外へ失われるとする。圃場の節水量と流域全体の水消費削減量の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-140", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「日本の食料自給率について、供給熱量ベースと生産額ベースの違いを踏まえた説明として適切なものを選べ。」", "options": ["食料自給率の二つの指標", "日本の冬の降水の地域差", "分水界を越える導水", "交通施策の効果を確かめる"], "ans": 0, "exp": "日本の食料自給率について、供給熱量ベースと生産額ベースの違いを踏まえた説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-141", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当
