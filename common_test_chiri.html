切なものはどれか。\n「不正解 PとS、QとTが辺で接しているため上下は分離していない。加えてP・Qだけでは合計5,000人に満たない。」", "options": ["選択肢3", "領域", "地理総合，歴史総合，公共", "鉄鉱石"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 PとS、QとTが辺で接しているため上下は分離していない。加えてP・Qだけでは合計5,000人に満たない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-892", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 面積0.25km²なので基準人口は各1,000人である。Rを除く5区はTなどを通じ連続し、合計6,500人で基準を満たす。」", "options": ["選択肢4", "候補", "熱帯（A）", "100,000人"], "ans": 0, "exp": "正解は「選択肢4」です。正解 面積0.25km²なので基準人口は各1,000人である。Rを除く5区はTなどを通じ連続し、合計6,500人で基準を満たす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-893", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 通勤圏は通勤による結び付きで区域を設定するが、その区域の人口が全員通勤者という意味ではない。総人口と通勤者数を混同している。」", "options": ["選択肢1", "地表勾配", "試験", "18〜24歳"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 通勤圏は通勤による結び付きで区域を設定するが、その区域の人口が全員通勤者という意味ではない。総人口と通勤者数を混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-894", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 B−Aは行政市域外の連続市街地に住む人口である。そこからAへの実際の通勤通学流入数はOD資料などがなければ分からない。」", "options": ["選択肢2", "堆積物", "気候", "地区"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 B−Aは行政市域外の連続市街地に住む人口である。そこからAへの実際の通勤通学流入数はOD資料などがなければ分からない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-895", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 C−Aは行政市域外かつ通勤圏内の常住人口である。地元就業者に限らず、中心部への通勤者や非就業者も含む。」", "options": ["選択肢3", "標高データ", "その他", "C（中国沿海部）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 C−Aは行政市域外かつ通勤圏内の常住人口である。地元就業者に限らず、中心部への通勤者や非就業者も含む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-896", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 包含関係からC−Bは連続市街地の外側で通勤圏に含まれる区域である。常住人口なので、通勤する就業者だけでなく子どもや非就業者なども含む。」", "options": ["選択肢4", "2日目", "エネルギー資源", "区分"], "ans": 0, "exp": "正解は「選択肢4」です。正解 包含関係からC−Bは連続市街地の外側で通勤圏に含まれる区域である。常住人口なので、通勤する就業者だけでなく子どもや非就業者なども含む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-897", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 通勤通学の流入と流出を逆に加減している。昼間人口では流入を足し流出を引く。」", "options": ["選択肢1", "山頂", "人口", "総流出量"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 通勤通学の流入と流出を逆に加減している。昼間人口では流入を足し流出を引く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-898", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aの昼間人口は10−2＋5＝13万人、Bは20−6＋2＝16万人で、夜間人口を100とした比率は130・80となる。Aは流入超過である。」", "options": ["選択肢2", "地表からの深さ（m）", "図法", "中心部"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Aの昼間人口は10−2＋5＝13万人、Bは20−6＋2＝16万人で、夜間人口を100とした比率は130・80となる。Aは流入超過である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-899", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 比率計算は合うが、役割の説明が逆である。Bは昼間に人口が減る住宅地としての性格が強い。」", "options": ["選択肢3", "乾季（11〜3月）", "調査対象", "侵食"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 比率計算は合うが、役割の説明が逆である。Bは昼間に人口が減る住宅地としての性格が強い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-900", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 流出を差し引かずに計算している。さらに比率が100を超える市を、純流出する市とみなす説明は合わない。」", "options": ["選択肢4", "産地", "気候・自然環境", "地誌"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 流出を差し引かずに計算している。さらに比率が100を超える市を、純流出する市とみなす説明は合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-901", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは高い地価と昼間人口、Qは低い昼夜間人口比率、Rは製造業雇用の多さが特徴である。単一指標ではなく3指標を重ねると一意に対応する。」", "options": ["選択肢1", "方式", "A年", "寒帯（E）"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Pは高い地価と昼間人口、Qは低い昼夜間人口比率、Rは製造業雇用の多さが特徴である。単一指標ではなく3指標を重ねると一意に対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-902", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Rは製造業が雇用の6割を占めるので工業地区に合う。Qは雇用集積が弱く、昼間人口も少ない。」", "options": ["選択肢2", "鉄鉱石", "2択から決められない", "プレート境界"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Rは製造業が雇用の6割を占めるので工業地区に合う。Qは雇用集積が弱く、昼間人口も少ない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-903", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは製造業比率が低く地価が高い。Rの工業雇用の多さを中心業務地区の特徴と取り違えている。」", "options": ["選択肢3", "拠点", "地図", "食料問題"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pは製造業比率が低く地価が高い。Rの工業雇用の多さを中心業務地区の特徴と取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-904", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは就業者を集める地区、Qは昼間に常住者が流出する地区であり、住宅地と中心業務地区の対応が逆である。」", "options": ["選択肢4", "輸送機関", "データ", "人口"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pは就業者を集める地区、Qは昼間に常住者が流出する地区であり、住宅地と中心業務地区の対応が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-905", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Bは公共交通の結節点で、事務所床面積割合と地価が高い。広い土地より対面接触や顧客への接近性を重視する業務が集積する条件に合う。」", "options": ["選択肢1", "10年前", "堆積物", "地形図"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Bは公共交通の結節点で、事務所床面積割合と地価が高い。広い土地より対面接触や顧客への接近性を重視する業務が集積する条件に合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-906", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Dは公園・農地が多く地価も低い。低密度の外縁部として整合し、高度な業務集積ではない。」", "options": ["選択肢2", "後期", "1日目", "地図・GIS・地形"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Dは公園・農地が多く地価も低い。低密度の外縁部として整合し、高度な業務集積ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-907", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Cは倉庫・工場用地と道路輸送への適性が中心であり、業務の中心地区とは異なる。」", "options": ["選択肢3", "25〜39歳", "時刻帯", "B年"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Cは倉庫・工場用地と道路輸送への適性が中心であり、業務の中心地区とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-908", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは住宅利用が多く、夜間人口が昼間人口を上回る。高い居住密度だけでは中心業務地区と判断できない。」", "options": ["選択肢4", "出国前の20〜39歳人口", "乾季（11〜3月）", "メッシュ"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aは住宅利用が多く、夜間人口が昼間人口を上回る。高い居住密度だけでは中心業務地区と判断できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-909", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 第2期の中心部人口は10％増であり、居住機能が空洞化したという説明と合わない。」", "options": ["選択肢1", "地区", "期間", "データ"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 第2期の中心部人口は10％増であり、居住機能が空洞化したという説明と合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-910", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 第1期は基準人口が与えられていないため都市圏全体の純増減は確定しない。第2期の郊外人口は増加ではない。」", "options": ["選択肢2", "バス", "原料炭", "現在の地図"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 第1期は基準人口が与えられていないため都市圏全体の純増減は確定しない。第2期の郊外人口は増加ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-911", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 第1期は中心部が減少し郊外が増加する。第2期は中心部が増加し、住宅開発の条件とも合わせて都心への居住回復と説明できる。」", "options": ["選択肢3", "A（日本）", "輸送機関", "山頂"], "ans": 0, "exp": "正解は「選択肢3」です。正解 第1期は中心部が減少し郊外が増加する。第2期は中心部が増加し、住宅開発の条件とも合わせて都心への居住回復と説明できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-912", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 中心部から郊外への分散と、中心部への回復を逆にしている。第2期の郊外人口は両区域で減少する。」", "options": ["選択肢4", "主要河川", "前期", "農場"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 中心部から郊外への分散と、中心部への回復を逆にしている。第2期の郊外人口は両区域で減少する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-913", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 AはBの5倍で管理機能も集中し、首位都市の突出がみられる。理想的な順位・規模法則なら第2位は首位の2分の1で、首位/第2位は2である。」", "options": ["選択肢1", "産業", "40〜64歳", "地域"], "ans": 0, "exp": "正解は「選択肢1」です。正解 AはBの5倍で管理機能も集中し、首位都市の突出がみられる。理想的な順位・規模法則なら第2位は首位の2分の1で、首位/第2位は2である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-914", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 首位都市型という判断は合うが、A/B＝800/160＝5である。理想的な順位・規模分布の比2とは一致しない。」", "options": ["選択肢2", "P 西側", "地区", "輸送機関"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 首位都市型という判断は合うが、A/B＝800/160＝5である。理想的な順位・規模分布の比2とは一致しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-915", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 都市人口が順位順に減れば全て順位・規模法則に合うという意味ではない。第2位なら400万人となる理想的分布に対し、Bは160万人である。」", "options": ["選択肢3", "河川水面と排水口の高低", "作物", "年齢層"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 都市人口が順位順に減れば全て順位・規模法則に合うという意味ではない。第2位なら400万人となる理想的分布に対し、Bは160万人である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-916", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Bが道路の結節点でも、管理機能の集中先は資料ではAである。人口もAが突出しており、多極分散型とは対応しない。」", "options": ["選択肢4", "総流出量", "作物X", "海外就労者から家族への送金"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Bが道路の結節点でも、管理機能の集中先は資料ではAである。人口もAが突出しており、多極分散型とは対応しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-917", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 都市形態は合う。約44％減はPをQと比べた1−1/1.8に当たり、QをPと比べる本問では大小を逆にしている。」", "options": ["選択肢1", "Q：日本海側", "P 西側", "A（日本）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 都市形態は合う。約44％減はPをQと比べた1−1/1.8に当たり、QをPと比べる本問では大小を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-918", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 住宅の飛び地が複数あるだけでは、商業・業務など都市機能の中心が複数成立する多核化とは区別する。また費用の比較方向も逆である。」", "options": ["選択肢2", "計画", "最大流量", "出荷先"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 住宅の飛び地が複数あるだけでは、商業・業務など都市機能の中心が複数成立する多核化とは区別する。また費用の比較方向も逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-919", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 費用は合うが、都心回帰は中心部への居住人口の回復である。外側へ不連続に広がる住宅配置を都心回帰とは呼ばない。」", "options": ["選択肢3", "選択肢1", "放牧地", "最大流量"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 費用は合うが、都心回帰は中心部への居住人口の回復である。外側へ不連続に広がる住宅配置を都心回帰とは呼ばない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-920", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 農地等を挟む不連続な住宅開発はスプロールの特徴である。人口と1km当たり費用が等しいため、1人当たり維持費も1.8倍、すなわち80％増となる。」", "options": ["選択肢4", "P–Q", "選択肢1", "計画"], "ans": 0, "exp": "正解は「選択肢4」です。正解 農地等を挟む不連続な住宅開発はスプロールの特徴である。人口と1km当たり費用が等しいため、1人当たり維持費も1.8倍、すなわち80％増となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-921", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 複数の生活拠点へ居住とサービスを誘導し、公共交通で拠点を結ぶ案である。必ずしも一か所に全人口を集める考えではない。」", "options": ["選択肢1", "低い平均気温", "侵食", "徒歩分析"], "ans": 0, "exp": "正解は「選択肢1」です。正解 複数の生活拠点へ居住とサービスを誘導し、公共交通で拠点を結ぶ案である。必ずしも一か所に全人口を集める考えではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-922", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人口減少下で住宅地を広く分散させる案は、一定の利用者密度を持つ拠点形成や公共交通沿線への誘導と合いにくい。」", "options": ["選択肢2", "地理総合，地理探究", "地理総合，歴史総合，公共", "系統地理"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 人口減少下で住宅地を広く分散させる案は、一定の利用者密度を持つ拠点形成や公共交通沿線への誘導と合いにくい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-923", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 道路ICへの集中は自動車での接近性を重視する案で、資料の公共交通沿線人口を増やす目標との対応が弱い。」", "options": ["選択肢3", "地誌", "熱帯（A）", "冷帯（D）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 道路ICへの集中は自動車での接近性を重視する案で、資料の公共交通沿線人口を増やす目標との対応が弱い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-924", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 生活サービスを住宅地や公共交通拠点から離せば、徒歩や公共交通での利用が難しくなる方向に働く。」", "options": ["選択肢4", "熱帯（A）", "試験", "気候"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 生活サービスを住宅地や公共交通拠点から離せば、徒歩や公共交通での利用が難しくなる方向に働く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-925", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 平均待ち時間はA15分、B5分である。全行程を足すと10分差が残る。」", "options": ["選択肢1", "冷帯（D）", "気候", "主要作物の栽培条件と主産地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 平均待ち時間はA15分、B5分である。全行程を足すと10分差が残る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-926", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 駅までの徒歩はAが短いが、列車の待ち時間と乗車時間も必要である。接近性を一部分の時間で判定できない。」", "options": ["選択肢2", "共通テスト", "その他", "主な工業"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 駅までの徒歩はAが短いが、列車の待ち時間と乗車時間も必要である。接近性を一部分の時間で判定できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-927", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは5＋15＋25＝45分、Bは10＋5＋20＝35分である。距離が長くても速い列車と高頻度運行で時間距離が短くなる。」", "options": ["選択肢3", "地形", "エネルギー資源", "時差"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Aは5＋15＋25＝45分、Bは10＋5＋20＝35分である。距離が長くても速い列車と高頻度運行で時間距離が短くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-928", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは実距離が短いが、待ち時間の長さが総所要時間を増やす。物理距離と時間距離の順位は一致しない。」", "options": ["選択肢4", "大地形", "人口", "利益相反の有無"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aは実距離が短いが、待ち時間の長さが総所要時間を増やす。物理距離と時間距離の順位は一致しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-929", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 非運転者の実際の移動手段に合う到達圏人口が必要である。公共交通での到達可能割合はA80％、B40％でBが低い。」", "options": ["選択肢1", "その他", "図法", "A年"], "ans": 0, "exp": "正解は「選択肢1」です。正解 非運転者の実際の移動手段に合う到達圏人口が必要である。公共交通での到達可能割合はA80％、B40％でBが低い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-930", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人口密度は交通サービスの条件に関係するが、個々の施設への到達可能性を直接測る指標ではない。」", "options": ["選択肢2", "食料問題", "調査対象", "答えを見れば分かる"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 人口密度は交通サービスの条件に関係するが、個々の施設への到達可能性を直接測る指標ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-931", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 自動車による圏域は非運転者の条件に合わない。自動車ならBが有利でも、公共交通で同じとは限らない。」", "options": ["選択肢3", "鉱産資源", "気候・自然環境", "候補"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 自動車による圏域は非運転者の条件に合わない。自動車ならBが有利でも、公共交通で同じとは限らない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-932", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 施設数は供給量の指標だが、地理的な配置や交通経路を含まない。両地区の施設数も同じである。」", "options": ["選択肢4", "主な工業", "A年", "旧版地図"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 施設数は供給量の指標だが、地理的な配置や交通経路を含まない。両地区の施設数も同じである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-933", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Sの市内勤務者は1＋3＋1＝5千人で居住就業者10千人より少ない。Tは1＋2＋7＝10千人で均衡している。」", "options": ["選択肢1", "村落", "2択から決められない", "雲底"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Sの市内勤務者は1＋3＋1＝5千人で居住就業者10千人より少ない。Tは1＋2＋7＝10千人で均衡している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-934", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 居住地別の行を読むとSのC依存が強い。勤務地別の列と取り違えると逆の理解になる。」", "options": ["選択肢2", "図法", "地図", "乾季（ 。割合と交通量を区別する。」", "options": ["選択肢3", "A年", "乾季（11〜3月）", "作物"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 分担率は下がったが通勤者総数が増えたため実数は増えている。割合と交通量を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-940", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 実数計算が逆であり、集計値から個々の住民の手段変更も特定できない。新規流入者の交通選択なども考えられる。」", "options": ["選択肢4", "用語があいまい", "期間", "産業"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 実数計算が逆であり、集計値から個々の住民の手段変更も特定できない。新規流入者の交通選択なども考えられる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-941", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 0kmは業務120、4kmは住宅45、6kmは農業27が最高である。都心への接近性を強く求める業務ほど距離に伴う地代低下が大きいモデルである。」", "options": ["選択肢1", "時間が足りない", "原料炭", "指標"], "ans": 0, "exp": "正解は「選択肢1」です。正解 0kmは業務120、4kmは住宅45、6kmは農業27が最高である。都心への接近性を強く求める業務ほど距離に伴う地代低下が大きいモデルである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-942", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 4kmでは住宅45が農業33より高く、6kmでは農業27が住宅25より高い。住宅と農業の位置が逆である。」", "options": ["選択肢2", "斜面", "輸送機関", "観光地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 4kmでは住宅45が農業33より高く、6kmでは農業27が住宅25より高い。住宅と農業の位置が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-943", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 都心では業務120が住宅85を上回る。住宅が高い人口密度を持つことと、地代負担力が最大であることは別である。」", "options": ["選択肢3", "Pからの水平距離", "前期", "P–Q"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 都心では業務120が住宅85を上回る。住宅が高い人口密度を持つことと、地代負担力が最大であることは別である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-944", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": いる。採算上の供給縮小と、残る住民の到達可能性の悪化が並存しうる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-954", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 利用実績は便数や行き先の減少でも落ちる。移動したい需要がそのまま消えたことを意味しない。」", "options": ["選択肢2", "原料炭", "熱帯（A）", "堆積物"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 利用実績は便数や行き先の減少でも落ちる。移動したい需要がそのまま消えたことを意味しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-955", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高齢者向けに需要の種類が変わる可能性はあるが、販売総額や所得は示されていない。需要の拡大が人口減少を上回ったと確定する根拠はない。」", "options": ["選択肢3", "用地", "試験", "3日目"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 高齢者向けに需要の種類が変わる可能性はあるが、販売総額や所得は示されていない。需要の拡大が人口減少を上回ったと確定する根拠はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-956", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 施設が人口より速く減る場合もあり、位置が遠くなれば到達時間は増える。人口減少だけから改善は結論できない。」", "options": ["選択肢4", "100,000人", "気候", "雨季（6〜9月）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 施設が人口より速く減る場合もあり、位置が遠くなれば到達時間は増える。人口減少だけから改善は結論できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-957", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域平均の上昇は、所得水準の高い都市部の人口割合が増えたためである。各区域の所得増や全員の個人所得増を示さない。」", "options": ["選択肢1", "現在", "その他", "方式"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 地域平均の上昇は、所得水準の高い都市部の人口割合が増えたためである。各区域の所得増や全員の個人所得増を示さない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-958", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 前期は400×0.4＋200×0.6＝280万円、後期は400×0.7＋200×0.3＝340万円である。区域内の所得水準は一定で、人口構成の変化が平均を押し上げている。」", "options": ["選択肢2", "年齢層", "エネルギー資源", "用地"], "ans": 0, "exp": "正解は「選択肢2」です。正解 前期は400×0.4＋200×0.6＝280万円、後期は400×0.7＋200×0.3＝340万円である。区域内の所得水準は一定で、人口構成の変化が平均を押し上げている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-959", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 二つの区域平均を単純平均せず、それぞれの人口割合で重み付けする。人口構成が変わると地域全体の平均も変わる。」", "options": ["選択肢3", "40〜64歳", "人口", "前期"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 二つの区域平均を単純平均せず、それぞれの人口割合で重み付けする。人口構成が変わると地域全体の平均も変わる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-960", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 都市部の人口割合が40→70％へ増え、都市部の所得が農村より高いので、地域平均は上昇する。」", "options": ["選択肢4", "海外へ出国した20〜39歳人口", "図法", "出国前の20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 都市部の人口割合が40→70％へ増え、都市部の所得が農村より高いので、地域平均は上昇する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-961", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 西部と南部の言語圏が逆である。スイス内の言語分布は国境を越えた周辺の言語圏との関係で捉える。」", "options": ["選択肢1", "住宅地", "調査対象", "区域"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 西部と南部の言語圏が逆である。スイス内の言語分布は国境を越えた周辺の言語圏との関係で捉える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-962", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 西側のフランス、北側のドイツ、南側のイタリアとの文化的連続性が言語圏に反映される。スイスは一国内に複数の言語圏を持つ。」", "options": ["選択肢2", "区域", "気候・自然環境", "降水季節性"], "ans": 0, "exp": "正解は「選択肢2」です。正解 西側のフランス、北側のドイツ、南側のイタリアとの文化的連続性が言語圏に反映される。スイスは一国内に複数の言語圏を持つ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-963", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北部と南部の言語圏を逆にしている。ティチーノはイタリア語圏として知られる。」", "options": ["選択肢3", "C（中国沿海部）", "A年", "河川水面と排水口の高低"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 北部と南部の言語圏を逆にしている。ティチーノはイタリア語圏として知られる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-964", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 西部と北部の言語圏が逆である。ジュネーブはフランス語圏、チューリヒはドイツ語圏にある。」", "options": ["選択肢4", "作物X", "2択から決められない", "放牧地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 西部と北部の言語圏が逆である。ジュネーブはフランス語圏、チューリヒはドイツ語圏にある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-965", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 複数回答であり同じ人が場面に応じ複数言語を使える。家庭言語と職場の言語は排他的な分類ではない。」", "options": ["選択肢1", "出荷先", "地図", "選択肢4"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 複数回答であり同じ人が場面に応じ複数言語を使える。家庭言語と職場の言語は排他的な分類ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-966", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 言語の広域性と、ある地区での使用率は別である。Mの広域共通語という条件も問題文に示されている。」", "options": ["選択肢2", "Q 東側", "データ", "地理総合，地理探究"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 言語の広域性と、ある地区での使用率は別である。Mの広域共通語という条件も問題文に示されている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-967", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 職場での使用言語は母語とは限らない。家庭でLを使う割合も高く、Mの職場使用率だけで母語構成を確定できない。」", "options": ["選択肢3", "指標", "堆積物", "乾燥帯（B）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 職場での使用言語は母語とは限らない。家庭でLを使う割合も高く、Mの職場使用率だけで母語構成を確定できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-968", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 都市部では家庭でLが80％、職場でMが75％と高い。場面ごとの使用が重なりうるので、共通語と地域語の併用という説明に合う。」", "options": ["選択肢4", "時刻", "1日目", "私大（一般選抜）"], "ans": 0, "exp": "正解は「選択肢4」です。正解 都市部では家庭でLが80％、職場でMが75％と高い。場面ごとの使用が重なりうるので、共通語と地域語の併用という説明に合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-969", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 インドネシアはイスラム教徒が多数を占め、海上交易を通じた伝播と関係する。フィリピンはスペイン統治の歴史を背景にカトリックが広くみられる。」", "options": ["選択肢1", "放牧地", "時刻帯", "その他"], "ans": 0, "exp": "正解は「選択肢1」です。正解 インドネシアはイスラム教徒が多数を占め、海上交易を通じた伝播と関係する。フィリピンはスペイン統治の歴史を背景にカトリックが広くみられる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-970", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 タイでは上座部仏教が広く信仰される。Qのカトリックとスペイン統治の組合せもインドネシアには対応しない。」", "options": ["選択肢2", "中心部", "乾季（11〜3月）", "工業立地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 タイでは上座部仏教が広く信仰される。Qのカトリックとスペイン統治の組合せもインドネシアには対応しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-971", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは合うが、タイの主要宗教はカトリックではなく仏教であり、Qのスペイン統治の条件にも合わない。」", "options": ["選択肢3", "選択肢2", "期間", "生活文化"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pは合うが、タイの主要宗教はカトリックではなく仏教であり、Qのスペイン統治の条件にも合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-972", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 イスラム教とカトリックの主要な分布を逆にしている。両国とも島嶼部にあるが、宗教史は異なる。」", "options": ["選択肢4", "徒歩分析", "原料炭", "調査方法"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 イスラム教とカトリックの主要な分布を逆にしている。両国とも島嶼部にあるが、宗教史は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-973", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは冷涼なアンデス高地と結び付くジャガイモ、Qは熱帯アメリカから広がったキャッサバに対応する。現在の栽培地だけでなく、伝播前の地域と環境を合わせて読む。」", "options": ["選択肢1", "細かい火山灰", "輸送機関", "世界の諸地域・日本"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Pは冷涼なアンデス高地と結び付くジャガイモ、Qは熱帯アメリカから広がったキャッサバに対応する。現在の栽培地だけでなく、伝播前の地域と環境を合わせて読む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-974", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは合うが、タロイモを冷涼なアンデス高地起源の作物とする点が誤りである。Pはジャガイモに対応する。」", "options": ["選択肢2", "地理総合，歴史総合，公共", "前期", "2択から決められない"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Qは合うが、タロイモを冷涼なアンデス高地起源の作物とする点が誤りである。Pはジャガイモに対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-975", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは合うが、タロイモはアジア方面に起源を持つ作物で、アメリカから他大陸へ伝わったというQの条件に合わない。」", "options": ["選択肢3", "地理総合", "40〜64歳", "Pからの水平距離"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pは合うが、タロイモはアジア方面に起源を持つ作物で、アメリカから他大陸へ伝わったというQの条件に合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-976", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 どちらもアメリカ大陸に起源を持つが、キャッサバは熱帯、ジャガイモは冷涼な高地と結び付く。適応環境が逆になっている。」", "options": ["選択肢4", "乾燥帯（B）", "地区", "地下水"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 どちらもアメリカ大陸に起源を持つが、キャッサバは熱帯、ジャガイモは冷涼な高地と結び付く。適応環境が逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-977", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 近隣の小都市より遠い大都市へ先に伝わり、企業間の交流もある。大都市間の結び付きを先に通る階層的拡散に対応する。」", "options": ["選択肢1", "寒帯（E）", "作物", "2日目"], "ans": 0, "exp": "正解は「選択肢1」です。正解 近隣の小都市より遠い大都市へ先に伝わり、企業間の交流もある。大都市間の結び付きを先に通る階層的拡散に対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-978", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 移住を伴わないと明示されており、担い手の定住移動による移転は説明にならない。」", "options": ["選択肢2", "国公立二次（論述）", "作物X", "季節"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 移住を伴わないと明示されており、担い手の定住移動による移転は説明にならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-979", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 近接的拡散が支配的なら近いaへの早期伝播を想定するが、資料ではBの方が先である。」", "options": ["選択肢3", "気候", "P 西側", "期間"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 近接的拡散が支配的なら近いaへの早期伝播を想定するが、資料ではBの方が先である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-980", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 A・B間の情報交換と採用順序が示されているため、相互交流のない独立発生とみなす根拠がない。」", "options": ["選択肢4", "河川がつくる地形", "最大流量", "拠点"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 A・B間の情報交換と採用順序が示されているため、相互交流のない独立発生とみなす根拠がない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-981", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qの説明は合う。床を地面から離す構造を、地面との直接的な熱伝導を増やす仕組みとは説明できない。」", "options": ["選択肢1", "ホイットルセイの農業地域区分", "放牧地", "現在"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Qの説明は合う。床を地面から離す構造を、地面との直接的な熱伝導を増やす仕組みとは説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-982", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 高床は居住部分を地表の湿気や増水から離し、床下の通風を確保する。厚い土壁は熱を蓄える容量が大きく、外気の温度変化が室内へ伝わるのを遅らせる。」", "options": ["選択肢2", "林業・水産業", "選択肢1", "65歳以上"], "ans": 0, "exp": "正解は「選択肢2」です。正解 高床は居住部分を地表の湿気や増水から離し、床下の通風を確保する。厚い土壁は熱を蓄える容量が大きく、外気の温度変化が室内へ伝わるのを遅らせる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-983", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは地面に接することで冷却する構造ではなく、高床の空間や通風に意味がある。Qも蓄熱が少なくなるのではなく、大きな熱容量を利用する。」", "options": ["選択肢3", "工業立地", "侵食", "バス"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pは地面に接することで冷却する構造ではなく、高床の空間や通風に意味がある。Qも蓄熱が少なくなるのではなく、大きな熱容量を利用する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-984", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの説明は合う。厚い土壁は同じ材料の薄壁より熱容量が大きく、外気温へ素早く追随させるための構造ではない。」", "options": ["選択肢4", "人口", "地理総合，歴史総合，公共", "作物X"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pの説明は合う。厚い土壁は同じ材料の薄壁より熱容量が大きく、外気温へ素早く追随させるための構造ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-985", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 失業率は失業者数を労働力人口で割る加重平均である。人口構成が異なるため、区域率の単純平均では比較できない。」", "options": ["選択肢1", "民族・宗教・言語", "熱帯（A）", "流通"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 失業率は失業者数を労働力人口で割る加重平均である。人口構成が異なるため、区域率の単純平均では比較できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-986", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 区域別ではAが低いが、労働力人口の構成比が異なるため、市全体では逆転する。単純に部分の順位を全体へ移せない。」", "options": ["選択肢2", "時差", "試験", "Q：日本海側"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 区域別ではAが低いが、労働力人口の構成比が異なるため、市全体では逆転する。単純に部分の順位を全体へ移せない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-987", "cat": "CLIM", "catName": "統計・気候(Web)", "priorit "参照元の解説ページを見る"}, {"id": "GEO-WEB-1001", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 重慶・武漢・上海は長江の流域にあり、長江水運は内陸と上海周辺を結ぶ。」", "options": ["選択肢2", "雨季（6〜9月）", "期間", "輸送"], "ans": 0, "exp": "正解は「選択肢2」です。正解 重慶・武漢・上海は長江の流域にあり、長江水運は内陸と上海周辺を結ぶ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1002", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 黄河は華北を流れて渤海に注ぐ。3都市を順に結ぶ河川ではない。」", "options": ["選択肢3", "総労働時間", "原料炭", "10年前"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 黄河は華北を流れて渤海に注ぐ。3都市を順に結ぶ河川ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1003", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 河川名は正しいが、長江下流の出口は渤海ではなく東シナ海側に位置する。」", "options": ["選択肢4", "期間", "輸送機関", "40〜64歳"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 河川名は正しいが、長江下流の出口は渤海ではなく東シナ海側に位置する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1004", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域も穀物も取り違えている。稲作に必要な生育期の水・熱条件を確認する。」", "options": ["選択肢1", "地域", "前期", "店舗"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 地域も穀物も取り違えている。稲作に必要な生育期の水・熱条件を確認する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1005", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 華北と長江以南の気候の対応が逆になっている。Qの温暖多雨条件は南方に近い。」", "options": ["選択肢2", "輸送", "40〜64歳", "主要河川"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 華北と長江以南の気候の対応が逆になっている。Qの温暖多雨条件は南方に近い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1006", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 冬の低温と年降水量の少なさからPを華北、多雨で冬も比較的温暖なQを南方に対応させる。」", "options": ["選択肢3", "貨物", "地区", "Q 東側"], "ans": 0, "exp": "正解は「選択肢3」です。正解 冬の低温と年降水量の少なさからPを華北、多雨で冬も比較的温暖なQを南方に対応させる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1007", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域の対応は正しいが、主要穀物の傾向が逆。華北は小麦などの畑作、南方は稲作が目立つ。」", "options": ["選択肢4", "時点", "作物", "P：太平洋側"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 地域の対応は正しいが、主要穀物の傾向が逆。華北は小麦などの畑作、南方は稲作が目立つ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1008", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 総額ベースの製品輸出には輸入部品の価値も入るため、輸出額と国内付加価値は一致しない。」", "options": ["選択肢1", "前期", "作物X", "選択肢2"], "ans": 0, "exp": "正解は「選択肢1」です。正解 総額ベースの製品輸出には輸入部品の価値も入るため、輸出額と国内付加価値は一致しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1009", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 輸入中間財自体の価値はA・Bなどで生み出された部分であり、CのGDPに全額加算しない。」", "options": ["選択肢2", "18〜24歳", "P 西側", "細かい火山灰"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 輸入中間財自体の価値はA・Bなどで生み出された部分であり、CのGDPに全額加算しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1010", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 組立国の付加価値は輸入中間財の価値を除いて考える。最終製品の輸出額全体ではない。」", "options": ["選択肢3", "65歳以上", "最大流量", "気候帯"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 組立国の付加価値は輸入中間財の価値を除いて考える。最終製品の輸出額全体ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1011", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 部品をCに輸出した取引はA・Bの輸出統計に残る。最終組立の場所によって過去の貿易が消えるわけではない。」", "options": ["選択肢4", "海外就労者から家族への送金", "放牧地", "共通テスト"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 部品をCに輸出した取引はA・Bの輸出統計に残る。最終組立の場所によって過去の貿易が消えるわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1012", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 研究開発では専門人材・大学・企業間の知識交流なども重要。一般的な賃金の低さだけでは集積の優位を置き換えられない。」", "options": ["選択肢1", "店舗", "選択肢2", "河川がつくる地形"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 研究開発では専門人材・大学・企業間の知識交流なども重要。一般的な賃金の低さだけでは集積の優位を置き換えられない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1013", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qの輸送費は改善しても35で、沿海Pの20より高い。輸入原料を大量に使う工業の港湾近接の利点は残る。」", "options": ["選択肢2", "作物", "侵食", "エネルギー資源"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Qの輸送費は改善しても35で、沿海Pの20より高い。輸入原料を大量に使う工業の港湾近接の利点は残る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1014", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Q/Pは100/180から130/220へ上がるが、差P−Qは80から90へ拡大する。比率と絶対差を区別する。」", "options": ["選択肢3", "時期", "地理総合，歴史総合，公共", "村落"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Q/Pは100/180から130/220へ上がるが、差P−Qは80から90へ拡大する。比率と絶対差を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1015", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 内陸Qの輸送費指数は80から35へ下がる。賃金は依然Pより低く、労働集約的な組立の移転条件が改善する。」", "options": ["選択肢4", "降水季節性", "熱帯（A）", "地球的課題"], "ans": 0, "exp": "正解は「選択肢4」です。正解 内陸Qの輸送費指数は80から35へ下がる。賃金は依然Pより低く、労働集約的な組立の移転条件が改善する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1016", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 夏の山地と冬の低地などを定住拠点から利用する移牧の説明。事例の家族全体の生活拠点の移動とは区別する。」", "options": ["選択肢1", "区分", "試験", "産業・資源・流通"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 夏の山地と冬の低地などを定住拠点から利用する移牧の説明。事例の家族全体の生活拠点の移動とは区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1017", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 家族と家畜が牧草・水などに応じて生活拠点を移す事例は遊牧に対応する。移動の経路や形態は地域・家族によって異なる。」", "options": ["選択肢2", "流通", "気候", "用語があいまい"], "ans": 0, "exp": "正解は「選択肢2」です。正解 家族と家畜が牧草・水などに応じて生活拠点を移す事例は遊牧に対応する。移動の経路や形態は地域・家族によって異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1018", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 大牧場での定住経営は企業的牧畜の典型。生活拠点を牧草・水に応じて移す事例と異なる。」", "options": ["選択肢3", "最大流量", "その他", "地図"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 大牧場での定住経営は企業的牧畜の典型。生活拠点を牧草・水に応じて移す事例と異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1019", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 混合農業は耕種と畜産を同じ経営で結ぶ方式。事例には耕地で飼料を生産する条件がない。」", "options": ["選択肢4", "P：太平洋側", "エネルギー資源", "地表勾配"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 混合農業は耕種と畜産を同じ経営で結ぶ方式。事例には耕地で飼料を生産する条件がない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1020", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは低塩分で、雨季の流量増加は淡水による塩分低下に働く。濃縮とは読めない。」", "options": ["選択肢1", "観光地", "人口", "12〜2月／6〜8月の各月降水量"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Qは低塩分で、雨季の流量増加は淡水による塩分低下に働く。濃縮とは読めない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"i catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 島の相対位置とプレート境界の種類をともに取り違えている。島の火山活動でも拡大境界と沈み込み境界は異なる。」", "options": ["選択肢3", "気候帯", "地図", "住宅地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 島の相対位置とプレート境界の種類をともに取り違えている。島の火山活動でも拡大境界と沈み込み境界は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1027", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 島名は合うが、プレートが離れる海嶺上の火山活動はアイスランドなどの例。ジャワ島の成因とは異なる。」", "options": ["選択肢4", "温帯（C）", "データ", "時期"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 島名は合うが、プレートが離れる海嶺上の火山活動はアイスランドなどの例。ジャワ島の成因とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1028", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 タイとベトナムはいずれも米の生産が盛んだが、流域・領域の位置を取り違えている。」", "options": ["選択肢1", "試験", "堆積物", "P 西側"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 タイとベトナムはいずれも米の生産が盛んだが、流域・領域の位置を取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1029", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 タイはマレー半島とボルネオ島北部に分かれた国家ではない。作物だけで判断しない。」", "options": ["選択肢2", "私大（一般選抜）", "1日目", "時刻"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 タイはマレー半島とボルネオ島北部に分かれた国家ではない。作物だけで判断しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1030", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 マレーシアの国土は半島部と島嶼部に分かれる。ベトナムの南北デルタとの対応が逆。」", "options": ["選択肢3", "プレート境界", "時刻帯", "周辺部"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 マレーシアの国土は半島部と島嶼部に分かれる。ベトナムの南北デルタとの対応が逆。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1031", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 チャオプラヤ川はタイ、マレー半島とボルネオ島北部はマレーシア、紅河・メコンの両デルタはベトナムに対応する。」", "options": ["選択肢4", "海岸の地形", "乾季（11〜3月）", "低い平均気温"], "ans": 0, "exp": "正解は「選択肢4」です。正解 チャオプラヤ川はタイ、マレー半島とボルネオ島北部はマレーシア、紅河・メコンの両デルタはベトナムに対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1032", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 インド洋と南シナ海を結ぶ航路上の位置と港湾・精製設備が、輸入原油を使う産業を支える。」", "options": ["選択肢1", "主要作物の栽培条件と主産地", "期間", "地理総合"], "ans": 0, "exp": "正解は「選択肢1」です。正解 インド洋と南シナ海を結ぶ航路上の位置と港湾・精製設備が、輸入原油を使う産業を支える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1033", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海峡の位置と原料の調達先の両方が合わない。採掘地と精製・中継地を区別する。」", "options": ["選択肢2", "エネルギー資源", "原料炭", "試験"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 海峡の位置と原料の調達先の両方が合わない。採掘地と精製・中継地を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1034", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 航路は合うが、シンガポールの精製業を大規模な国内油田の存在で説明できない。」", "options": ["選択肢3", "工業の変化", "輸送機関", "大地形"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 航路は合うが、シンガポールの精製業を大規模な国内油田の存在で説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1035", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 ホルムズ海峡はペルシャ湾の出口で、シンガポールの位置ではない。」", "options": ["選択肢4", "都市", "前期", "林業・水産業"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 ホルムズ海峡はペルシャ湾の出口で、シンガポールの位置ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1036", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 マレーシアは天然ゴム・パーム油の生産で知られる。新時点の一次産品は300×0.20＝60、旧時点は100×0.50＝50である。」", "options": ["選択肢1", "生活文化", "40〜64歳", "都市"], "ans": 0, "exp": "正解は「選択肢1」です。正解 マレーシアは天然ゴム・パーム油の生産で知られる。新時点の一次産品は300×0.20＝60、旧時点は100×0.50＝50である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1037", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 金額の計算は合うが、マレーシアを代表する農産原料の組合せは天然ゴム・パーム油。カカオ・コーヒーの代表的産地と区別する。」", "options": ["選択肢2", "地形図", "地区", "GIS"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 金額の計算は合うが、マレーシアを代表する農産原料の組合せは天然ゴム・パーム油。カカオ・コーヒーの代表的産地と区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1038", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 農産原料は合うが、20は構成比の数値。総輸出額300に20％を掛ける必要がある。」", "options": ["選択肢3", "調査対象", "作物", "気候・自然環境"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 農産原料は合うが、20は構成比の数値。総輸出額300に20％を掛ける必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1039", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 農産原料の地域対応と、構成比・金額の区別の双方が合わない。工業化しても一次産品の輸出額が減るとは限らない。」", "options": ["選択肢4", "利益相反の有無", "作物X", "今の状態"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 農産原料の地域対応と、構成比・金額の区別の双方が合わない。工業化しても一次産品の輸出額が減るとは限らない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1040", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 南部内陸のベンガルールはIT産業集積で知られる。東部のコルカタでは河川交通やジュート産業の歴史が重要。」", "options": ["選択肢1", "産業・資源・流通", "P 西側", "斜面"], "ans": 0, "exp": "正解は「選択肢1」です。正解 南部内陸のベンガルールはIT産業集積で知られる。東部のコルカタでは河川交通やジュート産業の歴史が重要。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページ "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 夏の風向は合うが、北インドの冬の季節風は主に大陸側から吹き、乾燥しやすい。冬の北東季節風で雨を受けるインド南東岸などの条件と混同しない。」", "options": ["選択肢4", "山頂", "人口", "総流出量"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 夏の風向は合うが、北インドの冬の季節風は主に大陸側から吹き、乾燥しやすい。冬の北東季節風で雨を受けるインド南東岸などの条件と混同しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1052", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは天津で費用200ドルだが、Pの180ドルより高い。単価の低さだけで最安とは判断できない。」", "options": ["選択肢1", "地表からの深さ（m）", "図法", "中心部"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Qは天津で費用200ドルだが、Pの180ドルより高い。単価の低さだけで最安とは判断できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1053", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 最安の180ドルとなるPはベンガル湾側のコルカタ。天津はより北東で渤海側に位置するQである。」", "options": ["選択肢2", "乾季（11〜3月）", "調査対象", "侵食"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 最安の180ドルとなるPはベンガル湾側のコルカタ。天津はより北東で渤海側に位置するQである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1054", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 北緯23度・東経88度付近のPはコルカタ。Pは40＋1000×0.14＝180、Qは20＋2000×0.09＝200でPが安い。」", "options": ["選択肢3", "産地", "気候・自然環境", "地誌"], "ans": 0, "exp": "正解は「選択肢3」です。正解 北緯23度・東経88度付近のPはコルカタ。Pは40＋1000×0.14＝180、Qは20＋2000×0.09＝200でPが安い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1055", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの港名は合うが、200ドルはQの経路費である。港・海上費と陸上費を経路別に合計する。」", "options": ["選択肢4", "方式", "A年", "寒帯（E）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pの港名は合うが、200ドルはQの経路費である。港・海上費と陸上費を経路別に合計する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1056", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 季節調節の読み方は合うが、貯水池内に土砂がたまれば、その分が下流へ流れにくくなる。」", "options": ["選択肢1", "鉄鉱石", "2択から決められない", "プレート境界"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 季節調節の読み方は合うが、貯水池内に土砂がたまれば、その分が下流へ流れにくくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1057", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年合計と季節配分を混同し、貯水池にたまる土砂と下流へ通過する土砂の関係も逆にしている。」", "options": ["選択肢2", "拠点", "地図", "食料問題"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 年合計と季節配分を混同し、貯水池にたまる土砂と下流へ通過する土砂の関係も逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1058", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 貯留と放流は水が下流へ届く時期を調節する。土砂は貯水池に捕捉されるため、下流への供給が減る方向に働く。」", "options": ["選択肢3", "輸送機関", "データ", "人口"], "ans": 0, "exp": "正解は「選択肢3」です。正解 貯留と放流は水が下流へ届く時期を調節する。土砂は貯水池に捕捉されるため、下流への供給が減る方向に働く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1059", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年合計が同じでも季節配分が変われば乾季の利用可能量は変わる。土砂供給減少の方向は正しい。」", "options": ["選択肢4", "10年前", "堆積物", "地形図"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 年合計が同じでも季節配分が変われば乾季の利用可能量は変わる。土砂供給減少の方向は正しい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1060", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 これは現在の河川から涵養される浅い地下水の説明。水が深い地層にあることや、井戸から出ることだけで更新性を判断しない。」", "options": ["選択肢1", "後期", "1日目", "地図・GIS・地形"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 これは現在の河川から涵養される浅い地下水の説明。水が深い地層にあることや、井戸から出ることだけで更新性を判断しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1061", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 これは海岸や環礁の淡水レンズの説明。塩水化への注意は必要だが、内陸の化石地下水の由来・更新速度とは異なる。」", "options": ["選択肢2", "25〜39歳", "時刻帯", "B年"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 これは海岸や環礁の淡水レンズの説明。塩水化への注意は必要だが、内陸の化石地下水の由来・更新速度とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1062", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 化石地下水は過去の気候条件で貯留され、現在の補給が極めて小さい水。利用には現存する水量を消費する面がある。」", "options": ["選択肢3", "出国前の20〜39歳人口", "乾季（11〜3月）", "メッシュ"], "ans": 0, "exp": "正解は「選択肢3」です。正解 化石地下水は過去の気候条件で貯留され、現在の補給が極めて小さい水。利用には現存する水量を消費する面がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1063", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 これは現在の降水が循環するカルスト地域の地下水の説明。化石地下水の『化石』は石灰岩中の化石を指す語ではない。」", "options": ["選択肢4", "地区", "期間", "データ"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 これは現在の降水が循環するカルスト地域の地下水の説明。化石地下水の『化石』は石灰岩中の化石を指す語ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1064", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 紅海の出口を示す別の経路と混同している。イランとアラビア半島に囲まれるPはペルシャ湾である。」", "options": ["選択肢1", "バス", "原料炭", "現在の地図"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 紅海の出口を示す別の経路と混同している。イランとアラビア半島に囲まれるPはペルシャ湾である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1065", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pはペルシャ湾で、その出口はホルムズ海峡。オマーン湾からアラビア海・インド洋を経てマラッカ海峡へ向かう。」", "options": ["選択肢2", "A（日本）", "輸送機関", "山頂"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pはペルシャ湾で、その出口はホルムズ海峡。オマーン湾からアラビア海・インド洋を経てマラッカ海峡へ向かう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1066", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 アラビア海を通る点は合うが、バブエルマンデブ海峡は紅海とアデン湾の間で、図のPの出口ではない。」", "options": ["選択肢3", "主要河川", "前期", "農場"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 アラビア海を通る点は合うが、バブエルマンデブ海峡は紅海とアデン湾の間で、図のPの出口ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1067", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海峡名は合うが、紅海はアラビア半島の西側。マラッカ海峡へ向かうこの航路では紅海へ入らない。」", "options": ["選択肢4", "産業", "40〜64歳", "地域"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 海峡名は合うが、紅海はアラビア半島の西側。マラッカ海峡へ向かうこの航路では紅海へ入らない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1068", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 湖名は合うが、蒸発で失われる水と、湖に残る塩類を区別する。塩類総量が同じなら水量減少で濃度は上がる。」", "options": ["選択肢1", "P 西側", "地区", "輸送機関"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 湖名は合うが、蒸発で失われる水と、湖に残る塩類を区別する。塩類総量が同じなら水量減少で濃度は上がる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1069", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 アムダリヤ川・シルダリヤ川の流入先はアラル海。塩類が残ったまま水量が減れば、濃度は高くなる。」", "options": ["選択肢2", "河川水面と排水口の高低", "作物", "年齢層"], "ans": 0, "exp": "正解は「選択肢2」です。正解 アムダリヤ川・シルダリヤ川の流入先はアラル海。塩類が残ったまま水量が減れば、濃度は高くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1070", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 濃度の方向は合うが、示された河川の流入先はカスピ海ではなくアラル海。内陸湖同士でも流域が異なる。」", "options": ["選択肢3" はどれか。\n「不正解 トルクメニスタンはカスピ海に面し、天然ガスの生産でも知られるが、中国とは直接国境を接しない。」", "options": ["選択肢4", "低い平均気温", "侵食", "徒歩分析"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 トルクメニスタンはカスピ海に面し、天然ガスの生産でも知られるが、中国とは直接国境を接しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1076", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは7月降水量が5mmで夏は乾燥する。モンスーンによる夏の多雨と取り違えている。」", "options": ["選択肢1", "地理総合，地理探究", "地理総合，歴史総合，公共", "系統地理"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Pは7月降水量が5mmで夏は乾燥する。モンスーンによる夏の多雨と取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1077", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの対応は合うが、Qは年80mmの少雨で、夏のモンスーンに依存する天水稲作の条件ではない。」", "options": ["選択肢2", "地誌", "熱帯（A）", "冷帯（D）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pの対応は合うが、Qは年80mmの少雨で、夏のモンスーンに依存する天水稲作の条件ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1078", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 両地域を夏季多雨のモンスーン地域と取り違えている。年合計と月別の両方を確認する。」", "options": ["選択肢3", "熱帯（A）", "試験", "気候"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 両地域を夏季多雨のモンスーン地域と取り違えている。年合計と月別の両方を確認する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1079", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは冬に雨が多い地中海性気候、Qは通年少雨の内陸乾燥地域。冬雨と灌漑という異なる水条件を読む。」", "options": ["選択肢4", "冷帯（D）", "気候", "主要作物の栽培条件と主産地"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Pは冬に雨が多い地中海性気候、Qは通年少雨の内陸乾燥地域。冬雨と灌漑という異なる水条件を読む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1080", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・ "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 ガーナの代表的な輸出用樹木作物はカカオ。売上0.8×10000＝8000から原料5000を控除すると3000ドル。」", "options": ["選択肢2", "農場", "選択肢1", "防災・環境・地域調査"], "ans": 0, "exp": "正解は「選択肢2」です。正解 ガーナの代表的な輸出用樹木作物はカカオ。売上0.8×10000＝8000から原料5000を控除すると3000ドル。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1106", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 作物名は合うが、5000ドルは原料購入費であり、控除後の残額は3000ドルである。」", "options": ["選択肢3", "林齢構成", "侵食", "時間が足りない"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 作物名は合うが、5000ドルは原料購入費であり、控除後の残額は3000ドルである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1107", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 作物と計算の両方が異なる。加工後の重量に単価を掛けてから原料費を控除する。」", "options": ["選択肢4", "時間帯", "地理総合，歴史総合，公共", "地点"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 作物と計算の両方が異なる。加工後の重量に単価を掛けてから原料費を控除する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1108", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 低緯度で年較差が小さい点は合うが、同緯度では一般に高地ほど冷涼になる。平均気温の高度差を逆にしている。」", "options": ["選択肢1", "原料炭", "熱帯（A）", "堆積物"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 低緯度で年較差が小さい点は合うが、同緯度では一般に高地ほど冷涼になる。平均気温の高度差を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1109", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 標高は平均的な気温を下げる一方、赤道に近いため太陽高度・昼の長さの季節差が小さく、年較差は中緯度内陸より小さい。」", "options": ["選択肢2", "用地", "試験", "3日目"], "ans": 0, "exp": "正解は「選択肢2」です。正解 標高は平均的な気温を下げる一方、赤道に近いため太陽高度・昼の長さの季節差が小さく、年較差は中緯度内陸より小さい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1110", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 標高による平均気温の変化と、緯度による季節差の双方を取り違えている。冷涼な気候が必ず大きな年較差を伴うわけではない。」", "options": ["選択肢3", "100,000人", "気候", "雨季（6〜9月）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 標高による平均気温の変化と、緯度による季節差の双方を取り違えている。冷涼な気候が必ず大きな年較差を伴うわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1111", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 標高による冷涼さは合うが、寒冷な高地であることと夏冬の気温差が大きいことは同じではない。年較差には緯度も関係する。」", "options": ["選択肢4", "現在", "その他", "方式"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 標高による冷涼さは合うが、寒冷な高地であることと夏冬の気温差が大きいことは同じではない。年較差には緯度も関係する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1112", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 ブルキナファソの位置は合うが、ガーナの港が面するのはギニア湾。地中海沿岸の港と取り違えている。」", "options": ["選択肢1", "年齢層", "エネルギー資源", "用地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 ブルキナファソの位置は合うが、ガーナの港が面するのはギニア湾。地中海沿岸の港と取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1113", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 砂漠の南北と沿岸海域の双方が逆。内陸国とその貨物が通過する沿岸国を分けて位置を捉える。」", "options": ["選択肢2", "40〜64歳", "人口", "前期"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 砂漠の南北と沿岸海域の双方が逆。内陸国とその貨物が通過する沿岸国を分けて位置を捉える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1114", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 ブルキナファソはサハラ南側の内陸国。南方のガーナの港はギニア湾に面し、利用には陸路で国境を越える。」", "options": ["選択肢3", "海外へ出国した20〜39歳人口", "図法", "出国前の20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢3」です。正解 ブルキナファソはサハラ南側の内陸国。南方のガーナの港はギニア湾に面し、利用には陸路で国境を越える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1115", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 港の海域は合うが、ブルキナファソはサハラ北側のマグレブ地域ではない。砂漠南縁側の位置を確認する。」", "options": ["選択肢4", "住宅地", "調査対象", "区域"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 港の海域は合うが、ブルキナファソはサハラ北側のマグレブ地域ではない。砂漠南縁側の位置を確認する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1116", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは北半球夏に短い雨季、Qは通年多雨、Rは南半球夏に雨季をもつ。緯度帯と季節が一致する。」", "options": ["選択肢1", "区域", "気候・自然環境", "降水季節性"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Pは北半球夏に短い雨季、Qは通年多雨、Rは南半球夏に雨季をもつ。緯度帯と季節が一致する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1117", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年間多雨のQをサヘル、短い雨季のPをコンゴ盆地としており、水条件が逆。」", "options": ["選択肢2", "C（中国沿海部）", "A年", "河川水面と排水口の高低"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 年間多雨のQをサヘル、短い雨季のPをコンゴ盆地としており、水条件が逆。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1118", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 通年多雨のQと、南半球夏に雨が集中するRの違いを取り違えている。」", "options": ["選択肢3", "作物X", "2択から決められない", "放牧地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 通年多雨のQと、南半球夏に雨が集中するRの違いを取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1119", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南北半球の雨季を取り違えている。7月は北半球夏、1月は南半球夏である。」", "options": ["選択肢4", "出荷先", "地図", "選択肢3"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 南北半球の雨季を取り違えている。7月は北半球夏、1月は南半球夏である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1120", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 作物の地域対応と、生産性の分母の両方を取り違えている。人と土地を分けて計算する。」", "options": ["選択肢1", "Q 東側", "データ", "地理総合，地理探究"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 作物の地域対応と、生産性の分母の両方を取り違えている。人と土地を分けて計算する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1121", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地域対応は合うが、1 ha当たりはPが5、Qが2 tで、Qの土地生産性はPより低い。」", "options": ["選択肢2", "指標", "堆積物", "乾燥帯（B）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 地域対応は合うが、1 ha当たりはPが5、Qが2 tで、Qの土地生産性はPより低い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1122", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 湿潤な中西部のトウモロコシ・大豆と、その西の小麦地域に対応する。1人当たりはPが100、Qが200 t。」", "options": ["選択肢3", "時刻", "1日目", "私大（一般選抜）"], "ans": 0, "exp": "正解は「選択肢3」です。正解 湿潤な中西部のトウモロコシ・大豆と、その西の小麦地域に対応する。1人当たりはPが100、Qが200 t。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1123", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 計算は合うが、主要作物と乾湿の対応が逆。小麦はトウモロコシより乾燥した地域でも生産される。」", "options": ["選択肢4", "放牧地", "時刻帯", "その他"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 計算は合うが、主要作物と乾湿の対応が逆。小麦はトウモロコシより乾燥した地域でも生産される。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1124", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 正しい。中西部の温暖な生育期と降水はトウモロコシ・大豆の栽培を支える。」", "options": ["選択肢1", "中心部", "乾季（11〜3月）", "工業立地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 正しい。中西部の温暖な生育期と降水はトウモロコシ・大豆の栽培を支える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1 130", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 北緯37度・西経122度付近は湾南部に当たり、夏乾燥の気候と情報産業の集積が一致する。」", "options": ["選択肢3", "乾燥帯（B）", "地区", "地下水"], "ans": 0, "exp": "正解は「選択肢3」です。正解 北緯37度・西経122度付近は湾南部に当たり、夏乾燥の気候と情報産業の集積が一致する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1131", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 ヒューストンは南部メキシコ湾岸にあり、夏は高温多湿。海岸の違いと降水季節性を確認する。」", "options": ["選択肢4", "寒帯（E）", "作物", "2日目"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 ヒューストンは南部メキシコ湾岸にあり、夏は高温多湿。海岸の違いと降水季節性を確認する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1132", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 西部のエネルギー資源と東部の水力、鉱石採掘と製錬をともに混同している。原料を採掘しない国でも製錬が立地しうる。」", "options": ["選択肢1", "国公立二次（論述）", "作物X", "季節"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 西部のエネルギー資源と東部の水力、鉱石採掘と製錬をともに混同している。原料を採掘しない国でも製錬が立地しうる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1133", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 電源は合うが、カナダには国内のボーキサイト鉱山がなく、原料を輸入する。鉄鉱石などの鉱山があることと混同しない。」", "options": ["選択肢2", "気候", "P 西側", "期間"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 電源は合うが、カナダには国内のボーキサイト鉱山がなく、原料を輸入する。鉄鉱石などの鉱山があることと混同しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1134", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 原料輸入は合うが、西部の油砂を東部ケベック州の製錬電源の中心とする点が合わない。水力の地域的優位が重要。」", "options": ["選択肢3", "河川がつくる地形", "最大流量", "拠点"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 原料輸入は合うが、西部の油砂を東部ケベック州の製錬電源の中心とする点が合わない。水力の地域的優位が重要。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1135", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 アルミ製錬は電力を多く使う。ケベック州の豊富な水力と輸送網は、原料を輸入して製錬する立地を支える。」", "options": ["選択肢4", "ホイットルセイの農業地域区分", "放牧地", "現在"], "ans": 0, "exp": "正解は「選択肢4」です。正解 アルミ製錬は電力を多く使う。ケベック州の豊富な水力と輸送網は、原料を輸入して製錬する立地を支える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1136", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 立地の説明は合うが、輸入代替型は従来輸入していた製品を国内市場向けに国産化する工業化。輸出先が米国という事例と分ける。」", "options": ["選択肢1", "林業・水産業", "選択肢2", "65歳以上"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 立地の説明は合うが、輸入代替型は従来輸入していた製品を国内市場向けに国産化する工業化。輸出先が米国という事例と分ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1137", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 外国市場向けに製品を生産するのは輸出指向型。国境地域は米国工場への陸上輸送の短さと労働費の差を利用できる。」", "options": ["選択肢2", "工業立地", "侵食", "バス"], "ans": 0, "exp": "正解は「選択肢2」です。正解 外国市場向けに製品を生産するのは輸出指向型。国境地域は米国工場への陸上輸送の短さと労働費の差を利用できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1138", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 工業化の型と立地要因を取り違えている。販売市場が国外か国内か、貨物が鉱石か部品かを別々に判断する。」", "options": ["選択肢3", "人口", "地理総合，歴史総合，公共", "作物X"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 工業化の型と立地要因を取り違えている。販売市場が国外か国内か、貨物が鉱石か部品かを別々に判断する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1139", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 工業化の型は合うが、輸入原料を大量に使う臨海製鉄業の立地条件を、トラックで部品を頻繁に納入する事例と混同している。」", "options": ["選択肢4", "民族・宗教・言語", "熱帯（A）", "流通"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 工業化の型は合うが、輸入原料を大量に使う臨海製鉄業の立地条件を、トラックで部品を頻繁に納入する事例と混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1140", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 アマゾンの低地・森林とセラードの高原・サバナを取り違えている。」", "options": ["選択肢1", "時差", "試験", "Q：日本海側"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 アマゾンの低地・森林とセラードの高原・サバナを取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1141", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 ブラジルを一括せず、自然地域と経済活動の広がりを合わせて判断する必要がある。」", "options": ["選択肢2", "地球的課題", "気候", "選択肢3"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 ブラジルを一括せず、自然地域と経済活動の広がりを合わせて判断する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1142", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 サンパウロを含む南東部の都市工業集積と、中西部の農業開発を取り違えている。」", "options": ["選択肢3", "情報の限界", "その他", "科目名"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 サンパウロを含む南東部の都市工業集積と、中西部の農業開発を取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1143", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 多雨の大河川低地、季節的乾燥のある内陸高原、大都市・工業集積の南東部を区別できる。」", "options": ["選択肢4", "気候・自然環境", "エネルギー資源", "熱帯（A）"], "ans": 0, "exp": "正解は「選択肢4」です。正解 多雨の大河川低地、季節的乾燥のある内陸高原、大都市・工業集積の南東部を区別できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1144", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 中高度Qは合うが、低地と高地の対応が逆。熱帯という緯度だけで高地にも低地作物が適すると考えない。」", "options": ["選択肢1", "世界の諸地域・日本", "人口", "国公立二次（論述）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 中高度Qは合うが、低地と高地の対応が逆。熱帯という緯度だ り違えている。資源輸出国は価格変動の影響も受ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1155", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 土地所有の用語と分母の双方が合わない。小経営は経営数では90％だが面積では10％となる。」", "options": ["選択肢1", "雨季（6〜9月）", "期間", "輸送"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 土地所有の用語と分母の双方が合わない。小経営は経営数では90％だが面積では10％となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1156", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 大土地所有のラティフンディアは、零細土地所有のミニフンディアと対比される。大経営の面積割合は900÷1000＝90％。」", "options": ["選択肢2", "総労働時間", "原料炭", "10年前"], "ans": 0, "exp": "正解は「選択肢2」です。正解 大土地所有のラティフンディアは、零細土地所有のミニフンディアと対比される。大経営の面積割合は900÷1000＝90％。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1157", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 用語は合うが、10％は大経営の経営数の割合2÷20である。面積の割合と経営数の割合を区別する。」", "options": ["選択肢3", "期間", "輸送機関", "40〜64歳"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 用語は合うが、10％は大経営の経営数の割合2÷20である。面積の割合と経営数の割合を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1158", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 面積割合は合うが、ミニフンディアは零細土地所有を指す。ラテンアメリカの土地集中を示す二つの用語を逆にしている。」", "options": ["選択肢4", "地域", "前期", "店舗"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 面積割合は合うが、ミニフンディアは零細土地所有を指す。ラテンアメリカの土地集中を示す二つの用語を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1159", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 西部ピルバラ地域の鉄鉱石と東部の石炭が代表的。鉱山と輸出港を鉄道などで結ぶ。」", "options": ["選択肢1", "輸送", "40〜64歳", "主要河川"], "ans": 0, /chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1165", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 風上・風下の結果は合うが、中緯度の南島を南東貿易風の卓越地域とする点が誤り。」", "options": ["選択肢3", "海外就労者から家族への送金", "放牧地", "共通テスト"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 風上・風下の結果は合うが、中緯度の南島を南東貿易風の卓越地域とする点が誤り。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1166", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 南島は中緯度の偏西風帯にあり、西側で地形性降雨が多く、東側は雨陰になりやすい。」", "options": ["選択肢4", "店舗", "選択肢1", "河川がつくる地形"], "ans": 0, "exp": "正解は「選択肢4」です。正解 南島は中緯度の偏西風帯にあり、西側で地形性降雨が多く、東側は雨陰になりやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1167", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 島の成因と地下水の密度関係をともに取り違えている。淡水レンズを過剰に取水すると塩水化の問題が生じうる。」", "options": ["選択肢1", "作物", "侵食", "エネルギー資源"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 島の成因と地下水の密度関係をともに取り違えている。淡水レンズを過剰に取水すると塩水化の問題が生じうる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1168", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pはサンゴ由来の低い島々が礁湖を囲む環礁。浸透した淡水は海水より密度が小さく、海水の上に淡水レンズを形成する。」", "options": ["選択肢2", "時期", "地理総合，歴史総合，公共", "村落"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pはサンゴ由来の低い島々が礁湖を囲む環礁。浸透した淡水は海水より密度が小さく、海水の上に淡水レンズを形成する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1169", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 淡水と海水の関係は合うが、火山岩からなる高い山地はQの特徴。標高だけでなく地質・礁湖の形も見る。」", "options": ["選択肢3", "降水季節性", "熱帯（A）", "地球的課題"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 淡水と海水の関係は合うが、火山岩からなる高い山地はQの特徴。標高だけでなく地質・礁湖の形も見る。", ogiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1175", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 名称は合うが、説明は二毛作の特徴。冷涼で生育期間が限られる十勝の年をまたぐ作物交替を読み取る。」", "options": ["選択肢1", "周辺部", "図法", "さらに下"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 名称は合うが、説明は二毛作の特徴。冷涼で生育期間が限られる十勝の年をまたぐ作物交替を読み取る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1176", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 目的は合うが、二毛作は同じ耕地で1年に異なる作物を二度栽培・収穫する方式。年ごとの交替とは異なる。」", "options": ["選択肢2", "選択肢4", "調査対象", "産地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 目的は合うが、二毛作は同じ耕地で1年に異なる作物を二度栽培・収穫する方式。年ごとの交替とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1177", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 年ごとに異なる作物を順番に栽培する輪作は、同じ作物の連作による病害や養分の偏りを抑える方法となる。」", "options": ["選択肢3", "侵食", "気候・自然環境", "原料炭"], "ans": 0, "exp": "正解は「選択肢3」です。正解 年ごとに異なる作物を順番に栽培する輪作は、同じ作物の連作による病害や養分の偏りを抑える方法となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1178", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 間作は主作物の間などで別の作物を栽培する方式。同じ年に順に収穫する二毛作とも、設問の年ごとの輪作とも異なる。」", "options": ["選択肢4", "科目名", "A年", "時点"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 間作は主作物の間などで別の作物を栽培する方式。同じ年に順に収穫する二毛作とも、設問の年ごとの輪作とも異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1179", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 抑制という名称は合うが、Qの特徴は冬の温暖さではなく夏の冷涼さである。」", "options": ["選択肢1", "系統地理", "2択から決められない", "25〜39歳"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 抑制という名称は合うが、Qの特徴は冬の温暖さではなく夏の冷涼さである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1180", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 高冷地は夏も比較的涼しく、収穫を遅らせる抑制栽培で低地との出荷期をずらせる。」", "options": ["選択肢2", "気候帯", "地図", "住宅地"], "ans": 0, "exp": "正解は「選択肢2」です。正解 高冷地は夏も比較的涼しく、収穫を遅らせる抑制栽培で低地との出荷期をずらせる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1181", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 促成栽培の説明をQに当てはめている。高冷地の夏秋出荷と暖地の冬春出荷を区別する。」", "options": ["選択肢3", "温帯（C）", "データ", "時期"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 促成栽培の説明をQに当てはめている。高冷地の夏秋出荷と暖地の冬春出荷を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1182", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 気候と出荷期は合うが、通常より早く出荷する促成栽培とは異なる。」", "options": ["選択肢4", "試験", "堆積物", "P 西側"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 気候と出荷期は合うが、通常より早く出荷する促成栽培とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1183", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 自然の温暖さと施設によって出荷を早めるのは促成栽培。遠隔の大都市市場へ送る生産は輸送園芸に当たる。」", "options": ["選択肢1", "私大（一般選抜）", "1日目", "時刻"], "ans": 0, "exp": "正解は「選択肢1」です。正解 自然の温暖さと施設によって出荷を早めるのは促成栽培。遠隔の大都市市場へ送る生産は輸送園芸に当たる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1184", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 遠隔市場へ送る点は合うが、出荷を早める促成と、遅らせる抑制を逆にしている。」", "options": ["選択肢2", "プレート境界", "時刻帯", "周辺部"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 遠隔市場へ送る点は合うが、出荷を早める促成と、遅らせる抑制を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "
