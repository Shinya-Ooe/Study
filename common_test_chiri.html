適切なものはどれか。\n「正解 IはK・Tの両方に覆われるのでK降下前に離水。IIはKを欠くがTに覆われるのでK降下後、T降下前に離水したと判断できる。」", "options": ["選択肢2", "旧版地図", "作物", "地形"], "ans": 0, "exp": "正解は「選択肢2」です。正解 IはK・Tの両方に覆われるのでK降下前に離水。IIはKを欠くがTに覆われるのでK降下後、T降下前に離水したと判断できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-331", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 段丘を覆う火山灰は離水後に地表へたまったもので、上にある灰より離水は古い。I・IIの新旧も逆にしている。」", "options": ["選択肢3", "12〜2月／6〜8月の各月降水量", "作物X", "ホイットルセイの農業地域区分"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 段丘を覆う火山灰は離水後に地表へたまったもので、上にある灰より離水は古い。I・IIの新旧も逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-332", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 IにはKが載っているためK以前に離水している。IIにもTが載るためT以後ではなくT以前に離水している。」", "options": ["選択肢4", "3日目", "P 西側", "工業の変化"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 IにはKが載っているためK以前に離水している。IIにもTが載るためT以後ではなくT以前に離水している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-333", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 湾曲外側Pの河岸が侵食され、内側Qには砂礫が堆積する。この作用が続くと、湾曲は外側Pへ広がりやすい。」", "options": ["選択肢1", "時刻帯", "最大流量", "図法"], "ans": 0, "exp": "正解は「選択肢1」です。正解 湾曲外側Pの河岸が侵食され、内側Qには砂礫が堆積する。この作用が続くと、湾曲は外側Pへ広がりやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-334", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 侵食と堆積の位置は正しいが、堆積するQ側へ水路が広がるのではない。岸が削られるP側への移動を考える。」", "options": ["選択肢2", "季節", "放牧地", "情報の限界"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 侵食と堆積の位置は正しいが、堆積するQ側へ水路が広がるのではない。岸が削られるP側への移動を考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-335", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 一般的な蛇行では外側Pで流れが強く岸が削られ、内側Qには砂礫がたまる。侵食・堆積の側を逆にしている。」", "options": ["選択肢3", "農場", "選択肢1", "防災・環境・地域調査"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 一般的な蛇行では外側Pで流れが強く岸が削られ、内側Qには砂礫がたまる。侵食・堆積の側を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-336", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 湾曲がP側へ拡大する向きは合うが、原因に挙げた侵食・堆積が逆である。河岸後退は土砂がたまる側ではなく削られる側で生じる。」", "options": ["選択肢4", "林齢構成", "侵食", "時間が足りない"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 湾曲がP側へ拡大する向きは合うが、原因に挙げた侵食・堆積が逆である。河岸後退は土砂がたまる側ではなく削られる側で生じる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-337", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは谷口から広がる礫質の堆積地であり、河道に沿う帯状の自然堤防とは異なる。Bも低地の外側の細粒低湿地で、扇状地ではない。」", "options": ["選択肢1", "時間帯", "地理総合，歴史総合，公共", "地点"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Aは谷口から広がる礫質の堆積地であり、河道に沿う帯状の自然堤防とは異なる。Bも低地の外側の細粒低湿地で、扇状地ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-338", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの粗粒で傾斜のある特徴は後背湿地と合わない。Bには河川より高く離水した平坦面という段丘の証拠もない。」", "options": ["選択肢2", "原料炭", "熱帯（A）", "堆積物"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Aの粗粒で傾斜のある特徴は後背湿地と合わない。Bには河川より高く離水した平坦面という段丘の証拠もない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-339", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは河口ではなく山地出口で礫主体なので三角州ではない。Bは川沿いの微高地ではなく、その外側の低湿地である。」", "options": ["選択肢3", "用地", "試験", "3日目"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Aは河口ではなく山地出口で礫主体なので三角州ではない。Bは川沿いの微高地ではなく、その外側の低湿地である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-340", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは谷口の勾配が比較的大きく礫の多い扇状地。Bは川沿いの微高地より低く、泥が多く排水しにくい後背湿地に当たる。」", "options": ["選択肢4", "100,000人", "気候", "雨季（6〜9月）"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Aは谷口の勾配が比較的大きく礫の多い扇状地。Bは川沿いの微高地より低く、泥が多く排水しにくい後背湿地に当たる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-341", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは河川の谷の沈水によるリアス海岸でスペイン北西岸が代表例。Bは氷河で深く削られた谷の沈水によるフィヨルドでノルウェー西岸に多い。」", "options": ["選択肢1", "現在", "その他", "方式"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Aは河川の谷の沈水によるリアス海岸でスペイン北西岸が代表例。Bは氷河で深く削られた谷の沈水によるフィヨルドでノルウェー西岸に多い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-342", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの分岐するV字谷は河川の作用、Bの深いU字谷と懸谷は氷河の作用を示す。地形名と記録の対応が逆である。」", "options": ["選択肢2", "年齢層", "エネルギー資源", "用地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Aの分岐するV字谷は河川の作用、Bの深いU字谷と懸谷は氷河の作用を示す。地形名と記録の対応が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-343", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 A・Bの地形名が逆で、地域との組合せも形成過程に合わない。断面と支谷の高さをもとに河川・氷河の作用を分ける。」", "options": ["選択肢3", "40〜64歳", "人口", "前期"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 A・Bの地形名が逆で、地域との組合せも形成過程に合わない。断面と支谷の高さをもとに河川・氷河の作用を分ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-344", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地形名は正しいが、典型的な地域の対応が逆。ノルウェー西岸は氷河に削られた深い湾、スペイン北西岸はリアスの名の由来でもある海岸が見られる。」", "options": ["選択肢4", "海外へ出国した20〜39歳人口", "図法", "出国前の20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 地形名は正しいが、典型的な地域の対応が逆。ノルウェー西岸は氷河に削られた深い湾、スペイン北西岸はリアスの名の由来でもある海岸が見られる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-345", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地形名は正しいが、突堤が上流側の砂を捕捉すると下流側の供給は減る。突堤の上流側と下流側を取り違えている。」", "options": ["選択肢1", "住宅地", "調査対象", "区域"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 地形名は正しいが、突堤が上流側の砂を捕捉すると下流側の供給は減る。突堤の上流側と下流側を取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-346", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Xは片側で陸につながり海へ延びる砂嘴。上流側で沿岸漂砂を遮ると下流へ届く砂が減り、波による持ち去りが勝って侵食されやすくなる。」", "options": ["選択肢2", "区域", "気候・自然環境", "降水季節性"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Xは片側で陸につながり海へ延びる砂嘴。上流側で沿岸漂砂を遮ると下流へ届く砂が減り、波による持ち去りが勝って侵食されやすくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-347", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 供給減による侵食の説明は正しいが、Xは島と陸を結んでいない。陸繋砂州は島との接続が地形判定の要点となる。」", "options": ["選択肢3", "C（中国沿海部）", "A年", "河川水面と排水口の高低"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 供給減による侵食の説明は正しいが、Xは島と陸を結んでいない。陸繋砂州は島との接続が地形判定の要点となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-348", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xは陸繋砂州ではなく砂嘴であり、上流側で遮られた砂が下流へ増えて届くわけでもない。形と物質移動の両方が逆になっている。」", "options": ["選択肢4", "作物X", "2択から決められない", "放牧地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Xは陸繋砂州ではなく砂嘴であり、上流側で遮られた砂が下流へ増えて届くわけでもない。形と物質移動の両方が逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-349", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 当時の海面自体が6m高かったため、地盤の隆起量は50−6＝44m。44000mm÷125000年＝0.352mm/年となる。」", "options": ["選択肢1", "出荷先", "地図", "選択肢4"], "ans": 0, "exp": "正解は「選択肢1」です。正解 当時の海面自体が6m高かったため、地盤の隆起量は50−6＝44m。44000mm÷125000年＝0.352mm/年となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-350", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 50＋6＝56mとした計算に近い。高海面期にできた汀線なので、現在の高さから当時の海面の6mを引いて地盤の変化を求める。」", "options": ["選択肢2", "Q 東側", "データ", "地理総合，地理探究"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 50＋6＝56mとした計算に近い。高海面期にできた汀線なので、現在の高さから当時の海面の6mを引いて地盤の変化を求める。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-351", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 50mをそのまま12万5千年で割った値に近いが、当時の海面が現在より6m高かったことを補正していない。」", "options": ["選択肢3", "指標", "堆積物", "乾燥帯（B）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 50mをそのまま12万5千年で割った値に近いが、当時の海面が現在より6m高かったことを補正していない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-352", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 隆起量44mの考え方でも、mからmmと年の桁をそろえないと10倍の誤差が生じる。44mは44000mmである。」", "options": ["選択肢4", "時刻", "1日目", "私大（一般選抜）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 隆起量44mの考え方でも、mからmmと年の桁をそろえないと10倍の誤差が生じる。44mは44000mmである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-353", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 化石を含む石灰岩が二酸化炭素を含む水で溶け、ドリーネや洞窟が発達したカルスト地形と考えられる。地下へ排水され、地表での水の確保に制約が生じることがある。」", "options": ["選択肢1", "放牧地", "時刻帯", "その他"], "ans": 0, "exp": "正解は「選択肢1」です。正解 化石を含む石灰岩が二酸化炭素を含む水で溶け、ドリーネや洞窟が発達したカルスト地形と考えられる。地下へ排水され、地表での水の確保に制約が生じることがある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-354", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 対象は海から離れた内陸台地であり、現在の波や潮汐を地形形成・水位変化の原因とする根拠はない。岩石の溶食を検討すべき条件である。」", "options": ["選択肢2", "中心部", "乾季（11〜3月）", "工業立地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 対象は海から離れた内陸台地であり、現在の波や潮汐を地形形成・水位変化の原因とする根拠はない。岩石の溶食を検討すべき条件である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-355", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 花崗岩は深成岩で、記録の貝殻化石を含む岩石とは異なる。風化による地形だけでは洞窟と地下流水の組合せを説明できない。」", "options": ["選択肢3", "選択肢2", "期間", "生活文化"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 花崗岩は深成岩で、記録の貝殻化石を含む岩石とは異なる。風化による地形だけでは洞窟と地下流水の組合せを説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-356", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 玄武岩の冷却で柱状節理などはできるが、化石を含む岩石と溶食性のくぼみ・地下流水の組合せには合わない。地表水の少なさとも矛盾する。」", "options": ["選択肢4", "徒歩分析", "原料炭", "調査方法"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 玄武岩の冷却で柱状節理などはできるが、化石を含む岩石と溶食性のくぼみ・地下流水の組合せには合わない。地表水の少なさとも矛盾する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-357", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aに河川作用は見られるが、側方侵食と支流流量の増大から高い位置に支谷が残ることは説明できない。主谷と支谷の下刻差に注目する。」", "options": ["選択肢1", "細かい火山灰", "輸送機関", "世界の諸地域・日本"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Aに河川作用は見られるが、側方侵食と支流流量の増大から高い位置に支谷が残ることは説明できない。主谷と支谷の下刻差に注目する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-358", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 支谷が主谷より高い条件なのに、主谷が堆積で高くなるとする説明は逆である。Bでは地表を削る氷河作用を考える。」", "options": ["選択肢2", "地理総合，歴史総合，公共", "前期", "2択から決められない"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 支谷が主谷より高い条件なのに、主谷が堆積で高くなるとする説明は逆である。Bでは地表を削る氷河作用を考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-359", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 BはU字状の氷河谷。主谷の厚い氷河がより深く削るため、合流する小さな支谷の底が高く残り、退氷後に懸谷となることがある。」", "options": ["選択肢3", "地理総合", "40〜64歳", "Pからの水平距離"], "ans": 0, "exp": "正解は「選択肢3」です。正解 BはU字状の氷河谷。主谷の厚い氷河がより深く削るため、合流する小さな支谷の底が高く残り、退氷後に懸谷となることがある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-360", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 AはV字状の河川谷である。海面上昇や本流の堆積で主谷底が上がる過程は、支谷が高く残る氷河の懸谷の説明とは異なる。」", "options": ["選択肢4", "乾燥帯（B）", "地区", "地下水"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 AはV字状の河川谷である。海面上昇や本流の堆積で主谷底が上がる過程は、支谷が高く残る氷河の懸谷の説明とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-361", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 氷河の直接堆積物Aは粒径が混じり淘汰が悪い。水流で運ばれたBには粒径ごとの層が発達しており、両者の対応が逆である。」", "options": ["選択肢1", "寒帯（E）", "作物", "2日目"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 氷河の直接堆積物Aは粒径が混じり淘汰が悪い。水流で運ばれたBには粒径ごとの層が発達しており、両者の対応が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-362", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは正しいが、Bには流水で動き得る砂礫と河道沿いの層が見られる。風成の砂丘などの粒子の選別とは堆積場所・粒径が異なる。」", "options": ["選択肢2", "国公立二次（論述）", "作物X", "季節"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Aは正しいが、Bには流水で動き得る砂礫と河道沿いの層が見られる。風成の砂丘などの粒子の選別とは堆積場所・粒径が異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-363", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは氷河が運んだ岩屑を残すモレーンなどの直接堆積物で、粒径が混在する。Bは融氷水によって粒子が選別されながら堆積したものと考えられる。」", "options": ["選択肢3", "気候", "P 西側", "期間"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Aは氷河が運んだ岩屑を残すモレーンなどの直接堆積物で、粒径が混在する。Bは融氷水によって粒子が選別されながら堆積したものと考えられる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-364", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 風では巨礫まで一緒に運搬しにくい。Aの粘土から巨礫までの混在を風成堆積物とするのは不適切で、Bの層理も直接の氷河堆積とは合わない。」", "options": ["選択肢4", "河川がつくる地形", "最大流量", "拠点"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 風では巨礫まで一緒に運搬しにくい。Aの粘土から巨礫までの混在を風成堆積物とするのは不適切で、Bの層理も直接の氷河堆積とは合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-365", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 中央の地殻が新しい点は正しい。堆積速度に大きな差がない条件では、古い地殻ほど堆積する時間が長く、遠い側で厚くなる。」", "options": ["選択肢1", "ホイットルセイの農業地域区分", "放牧地", "現在"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 中央の地殻が新しい点は正しい。堆積速度に大きな差がない条件では、古い地殻ほど堆積する時間が長く、遠い側で厚くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-366", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 海嶺で生まれた地殻が左右へ移動するので、中央ほど新しい。遠いほど古く、堆積を受ける時間が長いため、堆積物は厚くなる傾向がある。」", "options": ["選択肢2", "林業・水産業", "選択肢1", "65歳以上"], "ans": 0, "exp": "正解は「選択肢2」です。正解 海嶺で生まれた地殻が左右へ移動するので、中央ほど新しい。遠いほど古く、堆積を受ける時間が長いため、堆積物は厚くなる傾向がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-367", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 図は海嶺で新しい地殻が供給される発散境界である。中央が古いのではなく、中央ほど新しく堆積する時間も短い。」", "options": ["選択肢3", "工業立地", "侵食", "バス"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 図は海嶺で新しい地殻が供給される発散境界である。中央が古いのではなく、中央ほど新しく堆積する時間も短い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-368", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 遠方で堆積物が厚くなる点は正しいが、地殻の年代は中央ほど新しい。海嶺を地殻が集まる消滅境界と混同している。」", "options": ["選択肢4", "人口", "地理総合，歴史総合，公共", "作物X"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 遠方で堆積物が厚くなる点は正しいが、地殻の年代は中央ほど新しい。海嶺を地殻が集まる消滅境界と混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-369", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 海洋プレートは海溝から陸側の地下へ傾いて沈むため、その内部の震源は陸側ほど深くなる。アンデスの太平洋側も海洋プレートの沈み込みに伴う境界である。」", "options": ["選択肢1", "民族・宗教・言語", "熱帯（A）", "流通"], "ans": 0, "exp": "正解は「選択肢1」です。正解 海洋プレートは海溝から陸側の地下へ傾いて沈むため、その内部の震源は陸側ほど深くなる。アンデスの太平洋側も海洋プレートの沈み込みに伴う境界である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-370", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 アンデスの地域対応は正しいが、陸側へ進むほど沈んだプレートの位置は深くなる。海溝からの向きと深さの関係が逆である。」", "options": ["選択肢2", "時差", "試験", "Q：日本海側"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 アンデスの地域対応は正しいが、陸側へ進むほど沈んだプレートの位置は深くなる。海溝からの向きと深さの関係が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-371", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 陸側へ深くなる分布は合うが、大西洋中央海嶺はプレートが離れる発散境界である。沈み込む面に沿う深い地震分布とは異なる。」", "options": ["選択肢3", "地球的課題", "気候", "選択肢2"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 陸側へ深くなる分布は合うが、大西洋中央海嶺はプレートが離れる発散境界である。沈み込む面に沿う深い地震分布とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-372", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 震源の深くなる向きが逆で、地域も発散境界を挙げている。断面のプレート運動と世界の地体構造を照合する。」", "options": ["選択肢4", "情報の限界", "その他", "科目名"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 震源の深くなる向きが逆で、地域も発散境界を挙げている。断面のプレート運動と世界の地体構造を照合する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-373", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 アンデスは海洋プレートの沈み込みを伴うためAの大陸同士という条件に合わない。ヒマラヤもBの引張り・地溝とは異なる。」", "options": ["選択肢1", "気候・自然環境", "エネルギー資源", "熱帯（A）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 アンデスは海洋プレートの沈み込みを伴うためAの大陸同士という条件に合わない。ヒマラヤもBの引張り・地溝とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-374", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 東アフリカはAの圧縮ではなく引張り、アンデスはBの大陸分裂ではなく収束境界である。プレート運動の向きが逆になる。」", "options": ["選択肢2", "世界の諸地域・日本", "人口", "国公立二次（論述）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 東アフリカはAの圧縮ではなく引張り、アンデスはBの大陸分裂ではなく収束境界である。プレート運動の向きが逆になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-375", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは正しいが、Bの正断層と地溝は引張りを示す。アンデスの海洋プレート沈み込みによる圧縮と火山帯とは区別する。」", "options": ["選択肢3", "B年", "図法", "海岸の地形"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Aは正しいが、Bの正断層と地溝は引張りを示す。アンデスの海洋プレート沈み込みによる圧縮と火山帯とは区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-376", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは大陸同士の衝突で地殻が厚くなるヒマラヤに対応する。Bは大陸地殻が引き伸ばされる東アフリカ大地溝帯の成因と合う。」", "options": ["選択肢4", "図表になると迷う", "調査対象", "鉱産資源"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Aは大陸同士の衝突で地殻が厚くなるヒマラヤに対応する。Bは大陸地殻が引き伸ばされる東アフリカ大地溝帯の成因と合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-377", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 両側は境界に沿って水平にすれ違い、この相対運動自体では地殻を新たに作ったり消滅させたりしない。地震は主として浅い断層に沿う。」", "options": ["選択肢1", "答えを見れば分かる", "気候・自然環境", "民族・宗教・言語"], "ans": 0, "exp": "正解は「選択肢1」です。正解 両側は境界に沿って水平にすれ違い、この相対運動自体では地殻を新たに作ったり消滅させたりしない。地震は主として浅い断層に沿う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-378", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 横ずれ境界で浅い地震が起こる点は正しいが、図ではプレートが境界に向かって沈み込む運動はない。」", "options": ["選択肢2", "地図", "A年", "調査対象"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 横ずれ境界で浅い地震が起こる点は正しいが、図ではプレートが境界に向かって沈み込む運動はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-379", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地殻の生成は主として発散境界で起こる。図は境界に平行な横ずれで、深い沈み込み地震帯の形成も示さない。」", "options": ["選択肢3", "地点", "2択から決められない", "人口・都市・生活文化"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 地殻の生成は主として発散境界で起こる。図は境界に平行な横ずれで、深い沈み込み地震帯の形成も示さない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-380", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地殻の生成・消滅を伴わない点は合うが、陸側へ傾いて深くなる震源分布は沈み込み帯の特徴である。」", "options": ["選択肢4", "位置", "地図", "図表になると迷う"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 地殻の生成・消滅を伴わない点は合うが、陸側へ傾いて深くなる震源分布は沈み込み帯の特徴である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-381", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 供給源上の新しい火山から古い火山が西へ並ぶためプレートは西へ移動する。200km/200万年＝0.1m/年＝10cm/年となる。」", "options": ["選択肢1", "地下水", "データ", "領域"], "ans": 0, "exp": "正解は「選択肢1」です。正解 供給源上の新しい火山から古い火山が西へ並ぶためプレートは西へ移動する。200km/200万年＝0.1m/年＝10cm/年となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-382", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 速度10cm/年は正しいが、プレートは供給源から離れる古い火山の側へ動く。新しい火山の側を移動先とした向きが逆である。」", "options": ["選択肢2", "現在の地図", "堆積物", "礫・砂・泥の割合"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 速度10cm/年は正しいが、プレートは供給源から離れる古い火山の側へ動く。新しい火山の側を移動先とした向きが逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-383", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 古い火山が西にあるため移動方向は合うが、200kmは2000万cm。200万年で割ると10cm/年であり、1cm/年ではない。」", "options": ["選択肢4", "雲底", "時刻帯", "地表からの深さ（m）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 古い火山が西にあるため移動方向は合うが、200kmは2000万cm。200万年で割ると10cm/年であり、1cm/年ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-384", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「モレーン・砂嘴／堆積：カール・海食台」", "options": ["侵食", "さらに下", "乾季（11〜3月）", "林齢構成"], "ans": 0, "exp": "正解は「侵食」です。モレーン・砂嘴／堆積：カール・海食台", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-385", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「カール・海食台／堆積：モレーン・砂嘴」", "options": ["侵食", "雨季（6〜9月）", "期間", "輸送"], "ans": 0, "exp": "正解は「侵食」です。カール・海食台／堆積：モレーン・砂嘴", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-386", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「モレーン・海食台／堆積：カール・砂嘴」", "options": ["侵食", "総労働時間", "原料炭", "10年前"], "ans": 0, "exp": "正解は「侵食」です。モレーン・海食台／堆積：カール・砂嘴", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-387", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「カール・砂嘴／堆積：モレーン・海食台」", "options": ["侵食", "期間", "輸送機関", "40〜64歳"], "ans": 0, "exp": "正解は「侵食」です。カール・砂嘴／堆積：モレーン・海食台", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-388", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 モレーンと砂嘴はいずれも堆積、カールと海食台はいずれも侵食によるため、全ての対応が逆になっている。」", "options": ["選択肢1", "地域", "前期", "店舗"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 モレーンと砂嘴はいずれも堆積、カールと海食台はいずれも侵食によるため、全ての対応が逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-389", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 カールは氷河が削る椀状のくぼみ、海食台は波が削る平坦面。モレーンは氷河が残す岩屑、砂嘴は沿岸漂砂が積もる細長い地形である。」", "options": ["選択肢2", "輸送", "40〜64歳", "主要河川"], "ans": 0, "exp": "正解は「選択肢2」です。正解 カールは氷河が削る椀状のくぼみ、海食台は波が削る平坦面。モレーンは氷河が残す岩屑、砂嘴は沿岸漂砂が積もる細長い地形である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-390", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海食台と砂嘴は正しいが、氷河の侵食地形カールと堆積地形モレーンが逆である。同じ作用主体でも侵食・堆積を区別する。」", "options": ["選択肢3", "貨物", "地区", "Q 東側"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 海食台と砂嘴は正しいが、氷河の侵食地形カールと堆積地形モレーンが逆である。同じ作用主体でも侵食・堆積を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-391", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 氷河地形の区分は正しいが、海食台は波の侵食、砂嘴は砂の堆積による。沿岸地形の分類が逆になっている。」", "options": ["選択肢4", "時点", "作物", "P：太平洋側"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 氷河地形の区分は正しいが、海食台は波の侵食、砂嘴は砂の堆積による。沿岸地形の分類が逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-392", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 自然堤防は河道沿いの微高地である。Xは旧流路そのものと一致し周囲より低いため、微高地を主とする解釈は資料に合わない。」", "options": ["選択肢1", "前期", "作物X", "選択肢2"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 自然堤防は河道沿いの微高地である。Xは旧流路そのものと一致し周囲より低いため、微高地を主とする解釈は資料に合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-393", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 旧地図の流路が現在の低い帯状地と重なるため、旧河道と解釈できる。蛇行形の連続性や埋積した河川堆積物を追加確認すれば根拠を強められる。」", "options": ["選択肢2", "18〜24歳", "P 西側", "細かい火山灰"], "ans": 0, "exp": "正解は「選択肢2」です。正解 旧地図の流路が現在の低い帯状地と重なるため、旧河道と解釈できる。蛇行形の連続性や埋積した河川堆積物を追加確認すれば根拠を強められる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-394", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 河岸段丘は離水して現在の氾濫原より高く残る平坦面であり、旧流路に沿う低い帯というXの形と合わない。」", "options": ["選択肢3", "65歳以上", "最大流量", "気候帯"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 河岸段丘は離水して現在の氾濫原より高く残る平坦面であり、旧流路に沿う低い帯というXの形と合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-395", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xは内陸平野の旧流路と一致している。現在の海岸の漂砂と関連させるには別の証拠が必要で、提示資料は河川由来を支持する。」", "options": ["選択肢4", "海外就労者から家族への送金", "放牧地", "共通テスト"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Xは内陸平野の旧流路と一致している。現在の海岸の漂砂と関連させるには別の証拠が必要で、提示資料は河川由来を支持する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-396", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 粒径と地形の位置も、自然の水条件に対応する土地利用も逆。A・Bを同じ河川の上下流として物質の選別と排水条件を結び付ける。」", "options": ["選択肢1", "店舗", "選択肢2", "河川がつくる地形"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 粒径と地形の位置も、自然の水条件に対応する土地利用も逆。A・Bを同じ河川の上下流として物質の選別と排水条件を結び付ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-397", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 土地利用の組合せは典型例と合うが、P・Qの対応が逆。粗い砂礫で浸透しやすいPを谷口Aへ、泥質のQを河口Bへ対応させる。」", "options": ["選択肢2", "作物", "侵食", "エネルギー資源"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 土地利用の組合せは典型例と合うが、P・Qの対応が逆。粗い砂礫で浸透しやすいPを谷口Aへ、泥質のQを河口Bへ対応させる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-398", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 谷口の扇状地Aには粗い砂礫と地下への浸透を持つP、河口低地Bには細かな泥と浅い地下水を持つQが対応する。排水性の差は果樹園と水田の立地条件と整合する。」", "options": ["選択肢3", "時期", "地理総合，歴史総合，公共", "村落"], "ans": 0, "exp": "正解は「選択肢3」です。正解 谷口の扇状地Aには粗い砂礫と地下への浸透を持つP、河口低地Bには細かな泥と浅い地下水を持つQが対応する。排水性の差は果樹園と水田の立地条件と整合する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-399", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 P・Qの対応は正しいが、用水・排水を大規模に改良しない条件では、一般にAは水田用水、Bは果樹園の排水で制約を受けやすい。」", "options": ["選択肢4", "降水季節性", "熱帯（A）", "地球的課題"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 P・Qの対応は正しいが、用水・排水を大規模に改良しない条件では、一般にAは水田用水、Bは果樹園の排水で制約を受けやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-400", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 大陸東岸の夏季多雨は合うが、南半球の夏は12〜2月なので気温曲線と合わない。」", "options": ["選択肢1", "区分", "試験", "産業・資源・流通"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 大陸東岸の夏季多雨は合うが、南半球の夏は12〜2月なので気温曲線と合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-401", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南半球なら最暖期が逆になり、さらにこの緯度の西岸は夏の低気圧より亜熱帯高圧帯の影響を受けやすい。」", "options": ["選択肢2", "流通", "気候", "用語があいまい"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 南半球なら最暖期が逆になり、さらにこの緯度の西岸は夏の低気圧より亜熱帯高圧帯の影響を受けやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-402", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 半球は合うが、この緯度の大陸西岸では夏に亜熱帯高圧帯の影響が強くなり、冬に比べ乾燥しやすい。」", "options": ["選択肢3", "最大流量", "その他", "地図"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 半球は合うが、この緯度の大陸西岸では夏に亜熱帯高圧帯の影響が強くなり、冬に比べ乾燥しやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-403", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 7〜8月が高温なので北半球である。夏にも雨が多く、温帯の大陸東岸で海洋から湿った空気が入る条件と整合する。」", "options": ["選択肢4", "P：太平洋側", "エネルギー資源", "地表勾配"], "ans": 0, "exp": "正解は「選択肢4」です。正解 7〜8月が高温なので北半球である。夏にも雨が多く、温帯の大陸東岸で海洋から湿った空気が入る条件と整合する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-404", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 6〜8月は気温が低く少雨なので南半球の冬の乾季である。全月高温で雨季と乾季が分かれる条件はサバナの分布と整合する。」", "options": ["選択肢1", "観光地", "人口", "12〜2月／6〜8月の各月降水量"], "ans": 0, "exp": "正解は「選択肢1」です。正解 6〜8月は気温が低く少雨なので南半球の冬の乾季である。全月高温で雨季と乾季が分かれる条件はサバナの分布と整合する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-405", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 サバナは合うが、6〜8月は南半球の冬である。日本と同じ月を夏と扱うと季節を逆にする。」", "options": ["選択肢2", "周辺部", "図法", "さらに下"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 サバナは合うが、6〜8月は南半球の冬である。日本と同じ月を夏と扱うと季節を逆にする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-406", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 乾季の季節は合うが、タイガは冬の寒さが厳しい冷帯の代表的な植生であり、この高温の年変化とは合わない。」", "options": ["選択肢3", "選択肢4", "調査対象", "産地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 乾季の季節は合うが、タイガは冬の寒さが厳しい冷帯の代表的な植生であり、この高温の年変化とは合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-407", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 硬葉樹林は温帯の夏季乾燥への適応を示す。図は高温の時期に雨が多いので地中海性の配分ではない。」", "options": ["選択肢4", "侵食", "気候・自然環境", "原料炭"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 硬葉樹林は温帯の夏季乾燥への適応を示す。図は高温の時期に雨が多いので地中海性の配分ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-408", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Afの判定はよいが低温による分解抑制は寒冷地の話である。熱帯雨林の豊かな植生から厚い腐植を推定してはいけない。」", "options": ["選択肢1", "科目名", "A年", "時点"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Afの判定はよいが低温による分解抑制は寒冷地の話である。熱帯雨林の豊かな植生から厚い腐植を推定してはいけない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-409", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 全月高温で、最少雨月も60mmを大きく上回るためAfである。高温多湿下では分解・溶脱が進み、栄養分の多くが植生に保持される場合がある。」", "options": ["選択肢2", "系統地理", "2択から決められない", "25〜39歳"], "ans": 0, "exp": "正解は「選択肢2」です。正解 全月高温で、最少雨月も60mmを大きく上回るためAfである。高温多湿下では分解・溶脱が進み、栄養分の多くが植生に保持される場合がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-410", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 最寒月も26℃あり温帯ではない。また温帯の冬でも土壌形成過程が一律に停止するわけではない。」", "options": ["選択肢3", "気候帯", "地図", "住宅地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 最寒月も26℃あり温帯ではない。また温帯の冬でも土壌形成過程が一律に停止するわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-411", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 乾季が明瞭ではないのでAwとは読めない。厚い黒色腐植層は中緯度草原のチェルノーゼムなどとの混同である。」", "options": ["選択肢4", "温帯（C）", "データ", "時期"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 乾季が明瞭ではないのでAwとは読めない。厚い黒色腐植層は中緯度草原のチェルノーゼムなどとの混同である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-412", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは24−（−12）＝36℃、Qは18−6＝12℃である。同緯度・同標高の条件では、内陸の大陸性がPの大きな年較差を説明する。」", "options": ["選択肢1", "試験", "堆積物", "P 西側"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Pは24−（−12）＝36℃、Qは18−6＝12℃である。同緯度・同標高の条件では、内陸の大陸性がPの大きな年較差を説明する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-413", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 12℃はQの年較差である。Pは冬の負の気温を含むので、24から−12を引く必要がある。」", "options": ["選択肢2", "私大（一般選抜）", "1日目", "時刻"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 12℃はQの年較差である。Pは冬の負の気温を含むので、24から−12を引く必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-414", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 36℃は正しいが、海洋の熱的な影響は一般に冬を暖かく夏を涼しくし、年較差を小さくする方向に働く。」", "options": ["選択肢3", "プレート境界", "時刻帯", "周辺部"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 36℃は正しいが、海洋の熱的な影響は一般に冬を暖かく夏を涼しくし、年較差を小さくする方向に働く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-415", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 24℃はPの最暖月平均気温であり年較差ではない。海洋の影響が強い条件も、大きな年較差の説明にならない。」", "options": ["選択肢4", "海岸の地形", "乾季（11〜3月）", "低い平均気温"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 24℃はPの最暖月平均気温であり年較差ではない。海洋の影響が強い条件も、大きな年較差の説明にならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-416", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年量は正しいが、Qでは高温期に降水が集中していない。年量が同じでもPとQの水分条件は異なる。」", "options": ["選択肢1", "主要作物の栽培条件と主産地", "期間", "地理総合"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 年量は正しいが、Qでは高温期に降水が集中していない。年量が同じでもPとQの水分条件は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-417", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pの12か月を合計すると1,200mmでQと等しい。Qは夏の最少雨月が5mm、冬の最多雨月が250mmで、夏季乾燥の地中海性気候に合う。」", "options": ["選択肢2", "エネルギー資源", "原料炭", "試験"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pの12か月を合計すると1,200mmでQと等しい。Qは夏の最少雨月が5mm、冬の最多雨月が250mmで、夏季乾燥の地中海性気候に合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-418", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの年量は1,200mmである。Qの水分不足は、多雨の冬より高温・少雨となる夏に生じやすい。」", "options": ["選択肢3", "工業の変化", "輸送機関", "大地形"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pの年量は1,200mmである。Qの水分不足は、多雨の冬より高温・少雨となる夏に生じやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-419", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年量の集計が違い、温暖湿潤気候という判定も合わない。Qの強い夏季乾燥を見落としている。」", "options": ["選択肢4", "都市", "前期", "林業・水産業"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 年量の集計が違い、温暖湿潤気候という判定も合わない。Qの強い夏季乾燥を見落としている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-420", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 割合の計算が違い、夏の多雨を冬型に近い大陸側の乾いた空気で説明している点も合わない。」", "options": ["選択肢1", "生活文化", "40〜64歳", "都市"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 割合の計算が違い、夏の多雨を冬型に近い大陸側の乾いた空気で説明している点も合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-421", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 割合は正しいが、大陸からの乾いた季節風や下降気流は、東アジア低地の夏季多雨を説明しない。」", "options": ["選択肢2", "地形図", "地区", "GIS"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 割合は正しいが、大陸からの乾いた季節風や下降気流は、東アジア低地の夏季多雨を説明しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-422", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 しくみは合うが、600÷1,200は50％である。夏以外の降水を除いた分母にすると過大になる。」", "options": ["選択肢3", "調査対象", "作物", "気候・自然環境"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 しくみは合うが、600÷1,200は50％である。夏以外の降水を除いた分母にすると過大になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-423", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 6〜8月は600mm、年量は1,200mmなので50％である。東アジアの暖候期には湿った空気の流入や前線の活動が多雨に関係する。」", "options": ["選択肢4", "利益相反の有無", "作物X", "今の状態"], "ans": 0, "exp": "正解は「選択肢4」です。正解 6〜8月は600mm、年量は1,200mmなので50％である。東アジアの暖候期には湿った空気の流入や前線の活動が多雨に関係する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-424", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 夏は合うが、北緯35度前後の冬季多雨を赤道付近の熱帯収束帯で説明するのは位置が合わない。」", "options": ["選択肢1", "産業・資源・流通", "P 西側", "斜面"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 夏は合うが、北緯35度前後の冬季多雨を赤道付近の熱帯収束帯で説明するのは位置が合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-425", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 夏冬の支配を取り違えている。低気圧が多く通る季節は図の多雨期である冬に対応する。」", "options": ["選択肢2", "防災・環境・地域調査", "最大流量", "位置"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 夏冬の支配を取り違えている。低気圧が多く通る季節は図の多雨期である冬に対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-426", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 熱帯収束帯の上昇気流が主因なら夏季多雨を予想する。Pの夏の少雨とは逆である。」", "options": ["選択肢3", "今の状態", "放牧地", "標高データ"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 熱帯収束帯の上昇気流が主因なら夏季多雨を予想する。Pの夏の少雨とは逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-427", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 夏の高温・少雨と冬の多雨を示す。夏に亜熱帯高圧帯が極側へ張り出し、冬に偏西風帯の低気圧の影響を受ける説明が合う。」", "options": ["選択肢4", "2択から決められない", "選択肢1", "時刻帯"], "ans": 0, "exp": "正解は「選択肢4」です。正解 夏の高温・少雨と冬の多雨を示す。夏に亜熱帯高圧帯が極側へ張り出し、冬に偏西風帯の低気圧の影響を受ける説明が合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-428", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 植生と夏季乾燥は合うがカリフォルニアは北半球であり、気温・降水の月ごとの季節が逆になる。」", "options": ["選択肢1", "メッシュ", "侵食", "総労働時間"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 植生と夏季乾燥は合うがカリフォルニアは北半球であり、気温・降水の月ごとの季節が逆になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-429", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 同じ南半球でも夏雨地域なら1〜2月の降水が多くなる。雨季の時期がPと逆である。」", "options": ["選択肢2", "領域", "地理総合，歴史総合，公共", "鉄鉱石"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 同じ南半球でも夏雨地域なら1〜2月の降水が多くなる。雨季の時期がPと逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-430", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 1〜2月に高温・少雨、6〜8月に低温・多雨なので南半球の地中海性気候である。南アフリカ南西端の冬雨地域と硬葉樹の組合せが合う。」", "options": ["選択肢3", "候補", "熱帯（A）", "100,000人"], "ans": 0, "exp": "正解は「選択肢3」です。正解 1〜2月に高温・少雨、6〜8月に低温・多雨なので南半球の地中海性気候である。南アフリカ南西端の冬雨地域と硬葉樹の組合せが合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-431", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 赤道付近の低地は全月高温で、Pの最寒月11℃や夏季乾燥型とは合わない。」", "options": ["選択肢4", "地表勾配", "試験", "18〜24歳"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 赤道付近の低地は全月高温で、Pの最寒月11℃や夏季乾燥型とは合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-432", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 ステップは砂漠より降水が多い側の乾燥帯である。また熱帯収束帯の上昇気流は一般に雨をもたらす。」", "options": ["選択肢1", "堆積物", "気候", "地区"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 ステップは砂漠より降水が多い側の乾燥帯である。また熱帯収束帯の上昇気流は一般に雨をもたらす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-433", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 年降水量は20mmときわめて少なく砂漠気候に合う。緯度25〜30度付近では大規模な下降気流が雲の発達を抑える。」", "options": ["選択肢2", "標高データ", "その他", "C（中国沿海部）"], "ans": 0, "exp": "正解は「選択肢2」です。正解 年降水量は20mmときわめて少なく砂漠気候に合う。緯度25〜30度付近では大規模な下降気流が雲の発達を抑える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-434", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 砂漠という判定は合うが、前線性上昇気流は雲や降水を生むため、広域の少雨の主因として逆になる。」", "options": ["選択肢3", "2日目", "エネルギー資源", "区分"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 砂漠という判定は合うが、前線性上昇気流は雲や降水を生むため、広域の少雨の主因として逆になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-435", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 サバナ気候なら雨季にまとまった降水がみられる。Pは高温期にも雨季がなく、年中著しい少雨である。」", "options": ["選択肢4", "山頂", "人口", "総流出量"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 サバナ気候なら雨季にまとまった降水がみられる。Pは高温期にも雨季がなく、年中著しい少雨である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-436", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海から遠いという原因は合うが、乾燥帯の基準を満たすためBWを優先する。最寒月が低いという一点だけでDfに分類してはならない。」", "options": ["選択肢1", "地表からの深さ（m）", "図法", "中心部"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 海から遠いという原因は合うが、乾燥帯の基準を満たすためBWを優先する。最寒月が低いという一点だけでDfに分類してはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-437", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 BWの判定は合うが、冬の蒸発散が少ないことから夏の降水量は決まらない。年間の少雨には、水蒸気の供給や大気の循環を考える。」", "options": ["選択肢2", "乾季（11〜3月）", "調査対象", "侵食"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 BWの判定は合うが、冬の蒸発散が少ないことから夏の降水量は決まらない。年間の少雨には、水蒸気の供給や大気の循環を考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-438", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 乾燥帯を優先する分類手順と、少雨の因果の両方が異なる。冬季の低温と少雨が併存しても、低温が夏の少雨の直接の原因とは限らない。」", "options": ["選択肢3", "産地", "気候・自然環境", "地誌"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 乾燥帯を優先する分類手順と、少雨の因果の両方が異なる。冬季の低温と少雨が併存しても、低温が夏の少雨の直接の原因とは限らない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-439", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 年降水量は125mmでR/2の156mm未満なのでBWとなる。内陸では海からの水蒸気が届きにくく、冬の低温を伴う砂漠気候が成立しうる。」", "options": ["選択肢4", "方式", "A年", "寒帯（E）"], "ans": 0, "exp": "正解は「選択肢4」です。正解 年降水量は125mmでR/2の156mm未満なのでBWとなる。内陸では海からの水蒸気が届きにくく、冬の低温を伴う砂漠気候が成立しうる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-440", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 BSの判定は合うが、より乾燥する方向に連続した森林へ移るという説明は水分制約と逆である。」", "options": ["選択肢1", "鉄鉱石", "2択から決められない", "プレート境界"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 BSの判定は合うが、より乾燥する方向に連続した森林へ移るという説明は水分制約と逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-441", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年量300mmはBWの条件を満たさない。さらに乾燥する方向への針葉樹林への移行も合わない。」", "options": ["選択肢2", "拠点", "地図", "食料問題"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 年量300mmはBWの条件を満たさない。さらに乾燥する方向への針葉樹林への移行も合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-442", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 乾燥する方向の植生変化は合うが、BWは220mm未満である。年量を乾燥限界Rとだけ比べると区分を誤る。」", "options": ["選択肢3", "輸送機関", "データ", "人口"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 乾燥する方向の植生変化は合うが、BWは220mm未満である。年量を乾燥限界Rとだけ比べると区分を誤る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-443", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 年量は300mmで220≦300＜440となるのでBSである。水分制約が強まるほど草の連続した被覆は維持しにくくなる。」", "options": ["選択肢4", "10年前", "堆積物", "地形図"], "ans": 0, "exp": "正解は「選択肢4」です。正解 年量は300mmで220≦300＜440となるのでBSである。水分制約が強まるほど草の連続した被覆は維持しにくくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-444", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 分類は合うが、下降気流の強まりは雲の発達を抑えるため、雨季の多雨を説明しない。」", "options": ["選択肢1", "後期", "1日目", "地図・GIS・地形"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 分類は合うが、下降気流の強まりは雲の発達を抑えるため、雨季の多雨を説明しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-445", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 雨の多い時期の説明は合うが、2月は20mmでAfの全月60mm以上を満たさない。年量の多さだけでAfにはならない。」", "options": ["選択肢2", "25〜39歳", "時刻帯", "B年"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 雨の多い時期の説明は合うが、2月は20mmでAfの全月60mm以上を満たさない。年量の多さだけでAfにはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-446", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 最少雨月20mmはAmの下限4mm以上なのでAwではない。雨季も寒候期ではなく6〜9月を中心とする。」", "options": ["選択肢3", "出国前の20〜39歳人口", "乾季（11〜3月）", "メッシュ"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 最少雨月20mmはAmの下限4mm以上なのでAwではない。雨季も寒候期ではなく6〜9月を中心とする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-447", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 年量は2,400mmでAmの下限は4mm、最少雨月は20mmである。Afの全月60mm以上は満たさず、雨季に湿った季節風が入る説明が合う。」", "options": ["選択肢4", "地区", "期間", "データ"], "ans": 0, "exp": "正解は「選択肢4」です。正解 年量は2,400mmでAmの下限は4mm、最少雨月は20mmである。Afの全月60mm以上は満たさず、雨季に湿った季節風が入る説明が合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-448", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北緯10〜15度の乾季を偏西風帯の温帯低気圧で説明するのは緯度帯と合わない。通過増加も少雨の理由にはならない。」", "options": ["選択肢1", "バス", "原料炭", "現在の地図"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 北緯10〜15度の乾季を偏西風帯の温帯低気圧で説明するのは緯度帯と合わない。通過増加も少雨の理由にはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-449", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 冬の移動方向が逆であり、湿った空気の収束が強まれば一般に降水が増えるので少雨も説明できない。」", "options": ["選択肢2", "A（日本）", "輸送機関", "山頂"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 冬の移動方向が逆であり、湿った空気の収束が強まれば一般に降水が増えるので少雨も説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-450", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 12〜2月は南半球の夏である。季節の取り違えに加え、海洋からの湿った流入はPの乾季を説明しにくい。」", "options": ["選択肢3", "主要河川", "前期", "農場"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 12〜2月は南半球の夏である。季節の取り違えに加え、海洋からの湿った流入はPの乾季を説明しにくい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-451", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 北半球の冬には熱帯収束帯が南側へ移るため、この低緯度域は雨を生む上昇域から外れやすい。図の乾季と合う。」", "options": ["選択肢4", "産業", "40〜64歳", "地域"], "ans": 0, "exp": "正解は「選択肢4」です。正解 北半球の冬には熱帯収束帯が南側へ移るため、この低緯度域は雨を生む上昇域から外れやすい。図の乾季と合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-452", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 偏西風は西から東へ吹くので、通常、大陸東岸では海洋より大陸側の空気を運ぶ。東西の位置関係を逆にしている。」", "options": ["選択肢1", "P 西側", "地区", "輸送機関"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 偏西風は西から東へ吹くので、通常、大陸東岸では海洋より大陸側の空気を運ぶ。東西の位置関係を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-453", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 冬5℃、夏18℃で年較差13℃と小さく、年中降水がある。中緯度の西岸は偏西風により海洋の影響を受けやすい。」", "options": ["選択肢2", "河川水面と排水口の高低", "作物", "年齢層"], "ans": 0, "exp": "正解は「選択肢2」です。正解 冬5℃、夏18℃で年較差13℃と小さく、年中降水がある。中緯度の西岸は偏西風により海洋の影響を受けやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-454", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 西岸という位置は合うが、冬の冷たい大陸性空気の長期卓越は、温和な冬と小さな年較差の説明として合わない。」", "options": ["選択肢3", "総流出量", "作物X", "海外就労者から家族への送金"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 西岸という位置は合うが、冬の冷たい大陸性空気の長期卓越は、温和な冬と小さな年較差の説明として合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-455", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 大陸内部の強い冬季冷却は大きな年較差をもたらしやすい。Pの冬の温和さを説明しにくい。」", "options": ["選択肢4", "Q：日本海側", "P 西側", "A（日本）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 大陸内部の強い冬季冷却は大きな年較差をもたらしやすい。Pの冬の温和さを説明しにくい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-456", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 ETは最暖月も10℃未満の気候である。冬の厳しさだけで寒帯と判定すると、夏に森林が生育できる点を見落とす。」", "options": ["選択肢1", "計画", "最大流量", "出荷先"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 ETは最暖月も10℃未満の気候である。冬の厳しさだけで寒帯と判定すると、夏に森林が生育できる点を見落とす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-457", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 最寒月−15℃でD、最暖月22℃でEではない。明瞭な乾季がないのでDfで、夏の温暖さは森林成立を支える。」", "options": ["選択肢2", "選択肢1", "放牧地", "最大流量"], "ans": 0, "exp": "正解は「選択肢2」です。正解 最寒月−15℃でD、最暖月22℃でEではない。明瞭な乾季がないのでDfで、夏の温暖さは森林成立を支える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-458", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 温帯と冷帯の境界はここでは最寒月で判定する。またCfbの夏は22℃未満なので、この記号とも合わない。」", "options": ["選択肢3", "P–Q", "選択肢1", "計画"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 温帯と冷帯の境界はここでは最寒月で判定する。またCfbの夏は22℃未満なので、この記号とも合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-459", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 区分は正しいが、冷帯の樹木は厳しい冬に適応している。冬に氷点下になるだけで森林が成立しなくなるわけではない。」", "options": ["選択肢4", "低い平均気温", "侵食", "徒歩分析"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 区分は正しいが、冷帯の樹木は厳しい冬に適応している。冬に氷点下になるだけで森林が成立しなくなるわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-460", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 最暖月8℃は0℃以上10℃未満なのでETである。短い夏には低い植物が生育し、永久凍土がある地域でも表層が季節的に融けることがある。」", "options": ["選択肢1", "地理総合，地理探究", "地理総合，歴史総合，公共", "系統地理"], "ans": 0, "exp": "正解は「選択肢1」です。正解 最暖月8℃は0℃以上10℃未満なのでETである。短い夏には低い植物が生育し、永久凍土がある地域でも表層が季節的に融けることがある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-461", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 最暖月8℃なのでDfではない。耐寒性の針葉樹林が広がるタイガと、夏の温度が森林限界を下回るツンドラを区別する。」", "options": ["選択肢2", "地誌", "熱帯（A）", "冷帯（D）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 最暖月8℃なのでDfではない。耐寒性の針葉樹林が広がるタイガと、夏の温度が森林限界を下回るツンドラを区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-462", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 植生・地表の説明は図の条件に合うが、最暖月が10℃未満なのでDfではなくETとなる。冬の低温だけでDfと判定しない。」", "options": ["選択肢3", "熱帯（A）", "試験", "気候"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 植生・地表の説明は図の条件に合うが、最暖月が10℃未満なのでDfではなくETとなる。冬の低温だけでDfと判定しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-463", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 気候記号ETは合うが、夏の低温と短い生育期間が高木林の成立を制約する。冬への耐寒性だけで森林の成立は決まらない。」", "options": ["選択肢4", "冷帯（D）", "気候", "主要作物の栽培条件と主産地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 気候記号ETは合うが、夏の低温と短い生育期間が高木林の成立を制約する。冬への耐寒性だけで森林の成立は決まらない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-464", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 半球は正しいが、ETには最暖月が0℃以上の条件が必要である。Pの夏も月平均では氷点下である。」", "options": ["選択肢1", "共通テスト", "その他", "主な工業"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 半球は正しいが、ETには最暖月が0℃以上の条件が必要である。Pの夏も月平均では氷点下である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-465", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 最暖月は1月の−2℃、最寒月は7月の−30℃である。高温期が12〜2月側なので南半球、最暖月も0℃未満なのでEFとなる。」", "options": ["選択肢2", "地形", "エネルギー資源", "時差"], "ans": 0, "exp": "正解は「選択肢2」です。正解 最暖月は1月の−2℃、最寒月は7月の−30℃である。高温期が12〜2月側なので南半球、最暖月も0℃未満なのでEFとなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-466", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 EFは正しいが、高温期が12〜2月側にある点を見落としている。北半球の夏は6〜8月側である。」", "options": ["選択肢3", "大地形", "人口", "利益相反の有無"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 EFは正しいが、高温期が12〜2月側にある点を見落としている。北半球の夏は6〜8月側である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-467", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高温期から判断する半球も、最暖月から判断する寒帯内の区分も逆になっている。」", "options": ["選択肢4", "その他", "図法", "A年"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 高温期から判断する半球も、最暖月から判断する寒帯内の区分も逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-468", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「高緯度／小さい年較差：寒流」", "options": ["低い平均気温", "食料問題", "調査対象", "答えを見れば分かる"], "ans": 0, "exp": "正解は「低い平均気温」です。高緯度／小さい年較差：寒流", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-469", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「標高／小さい年較差：低緯度」", "options": ["低い平均気温", "鉱産資源", "気候・自然環境", "候補"], "ans": 0, "exp": "正解は「低い平均気温」です。標高／小さい年較差：低緯度", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-470", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「低緯度／小さい年較差：標高」", "options": ["低い平均気温", "主な工業", "A年", "旧版地図"], "ans": 0, "exp": "正解は「低い平均気温」です。低緯度／小さい年較差：標高", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-471", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「寒流／小さい年較差：高緯度」", "options": ["低い平均気温", "村落", "2択から決められない", "雲底"], "ans": 0, "exp": "正解は「低い平均気温」です。寒流／小さい年較差：高緯度", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-472", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北緯2度は高緯度ではない。寒流はこの内陸高地の小さな年較差の主因でもない。」", "options": ["選択肢1", "図法", "地図", "乾季（11〜3月）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 北緯2度は高緯度ではない。寒流はこの内陸高地の小さな年較差の主因でもない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-473", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 低緯度でも標高が高いと平均気温は低くなる。一方、赤道付近では日射の季節差が小さいため年較差も小さい。」", "options": ["選択肢2", "GIS", "データ", "時間帯"], "ans": 0, "exp": "正解は「選択肢2」です。正解 低緯度でも標高が高いと平均気温は低くなる。一方、赤道付近では日射の季節差が小さいため年較差も小さい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-474", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 要因が逆である。低緯度は低温の理由ではなく日射の年変化が小さい理由で、標高は主に気温の水準を下げる。」", "options": ["選択肢3", "調査方法", "堆積物", "貨物"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 要因が逆である。低緯度は低温の理由ではなく日射の年変化が小さい理由で、標高は主に気温の水準を下げる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-475", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 内陸高地の低温を寒流で説明するのは適切でない。また高緯度ほど日射の季節差が大きくなる。」", "options": ["選択肢4", "地図・GIS・地形", "1日目", "後期"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 内陸高地の低温を寒流で説明するのは適切でない。また高緯度ほど日射の季節差が大きくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-476", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 偏西風帯は中緯度の風系で、季節移動を東西への往復とみる点も合わない。」", "options": ["選択肢1", "人口・都市・生活文化", "時刻帯", "海外へ出国した20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 偏西風帯は中緯度の風系で、季節移動を東西への往復とみる点も合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-477", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 赤道付近では、熱帯収束帯が北上する時期と南下する時期に上昇気流の影響を受け、二つの雨季が生じる場合がある。」", "options": ["選択肢2", "A年", "乾季（11〜3月）", "作物"], "ans": 0, "exp": "正解は「選択肢2」です。正解 赤道付近では、熱帯収束帯が北上する時期と南下する時期に上昇気流の影響を受け、二つの雨季が生じる場合がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-478", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 下降気流の強まりは雲の発達を抑える方向に働く。雨の山には収束・上昇などのしくみを考える。」", "options": ["選択肢3", "用語があいまい", "期間", "産業"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 下降気流の強まりは雲の発達を抑える方向に働く。雨の山には収束・上昇などのしくみを考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-479", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南半球の冬は6〜8月側であり、春秋に二度の雨の山が現れることをこの説明では結び付けられない。」", "options": ["選択肢4", "時間が足りない", "原料炭", "指標"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 南半球の冬は6〜8月側であり、春秋に二度の雨の山が現れることをこの説明では結び付けられない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-480", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南東からの湿った風は暖候期の太平洋側多雨などを考える場合に適する。日本海側の冬の特徴とは季節と風向が合わない。」", "options": ["選択肢1", "斜面", "輸送機関", "観光地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 南東からの湿った風は暖候期の太平洋側多雨などを考える場合に適する。日本海側の冬の特徴とは季節と風向が合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-481", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 冬の北西季節風は日本海を渡る際に熱と水蒸気を受け取り、日本海側で雲を発達させ、山地に沿う上昇も降水に関係する。」", "options": ["選択肢2", "Pからの水平距離", "前期", "P–Q"], "ans": 0, "exp": "正解は「選択肢2」です。正解 冬の北西季節風は日本海を渡る際に熱と水蒸気を受け取り、日本海側で雲を発達させ、山地に沿う上昇も降水に関係する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-482", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 風向は合うが、冷たく乾いた大陸内部が主な水蒸気源ではない。山地で強制上昇するのはまず風上側である。」", "options": ["選択肢3", "データ", "40〜64歳", "地理総合，歴史総合，公共"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 風向は合うが、冷たく乾いた大陸内部が主な水蒸気源ではない。山地で強制上昇するのはまず風上側である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-483", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 風向と水蒸気源の位置関係が合わず、下降気流も冬の多雨を説明する主な働きではない。」", "options": ["選択肢4", "礫・砂・泥の割合", "地区", "温帯（C）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 風向と水蒸気源の位置関係が合わず、下降気流も冬の多雨を説明する主な働きではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-484", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 XとYはともに海洋性だが最暖月が逆である。西ヨーロッパは北半球、ニュージーランドは南半球に位置する。」", "options": ["選択肢1", "旧版地図", "作物", "地形"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 XとYはともに海洋性だが最暖月が逆である。西ヨーロッパは北半球、ニュージーランドは南半球に位置する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-485", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xの小さな年較差は中央アジア内陸に合いにくい。Zの厳冬と少雨は西ヨーロッパ大西洋沿岸の海洋性とは異なる。」", "options": ["選択肢2", "12〜2月／6〜8月の各月降水量", "作物X", "ホイットルセイの農業地域区分"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Xの小さな年較差は中央アジア内陸に合いにくい。Zの厳冬と少雨は西ヨーロッパ大西洋沿岸の海洋性とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-486", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Xは北半球で小年較差・年中湿潤、Yは南半球で小年較差・年中湿潤、Zは北半球で大年較差・少雨となり、各地域の位置と整合する。」", "options": ["選択肢3", "3日目", "P 西側", "工業の変化"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Xは北半球で小年較差・年中湿潤、Yは南半球で小年較差・年中湿潤、Zは北半球で大年較差・少雨となり、各地域の位置と整合する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-487", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Yは最暖月が1月なので南半球であり中央アジアには合わない。Zの大きな年較差と少雨もニュージーランドの海洋性とは合わない。」", "options": ["選択肢4", "時刻帯", "最大流量", "図法"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Yは最暖月が1月なので南半球であり中央アジアには合わない。Zの大きな年較差と少雨もニュージーランドの海洋性とは合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-488", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地表での収束・上昇は正しいが、A・Bの緯度と表の中心位置の対応が逆である。Aに二つ、Bに夏のピークが対応する。」", "options": ["選択肢1", "季節", "放牧地", "情報の限界"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 地表での収束・上昇は正しいが、A・Bの緯度と表の中心位置の対応が逆である。Aに二つ、Bに夏のピークが対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-489", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 季節の対応は正しいが、下降・地表発散は高気圧側の動きであり、熱帯収束帯の上昇に伴う多雨の説明とは逆である。」", "options": ["選択肢2", "農場", "選択肢1", "防災・環境・地域調査"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 季節の対応は正しいが、下降・地表発散は高気圧側の動きであり、熱帯収束帯の上昇に伴う多雨の説明とは逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-490", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aの北緯5度には4月・10月、Bの北緯15度には7月に中心が近づく。熱帯収束帯では地表付近の風が収束して上昇し、雲と雨が生じやすい。」", "options": ["選択肢3", "林齢構成", "侵食", "時間が足りない"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Aの北緯5度には4月・10月、Bの北緯15度には7月に中心が近づく。熱帯収束帯では地表付近の風が収束して上昇し、雲と雨が生じやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-491", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 中心位置と二地点の緯度の対応も、収束帯の空気の動きも逆である。気圧帯の位置と鉛直方向の運動を分けて照合する。」", "options": ["選択肢4", "時間帯", "地理総合，歴史総合，公共", "地点"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 中心位置と二地点の緯度の対応も、収束帯の空気の動きも逆である。気圧帯の位置と鉛直方向の運動を分けて照合する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-492", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 北半球の貿易風は北東風である。海からの湿った風が山地の東側で上昇するので、東側が多雨になりやすい。」", "options": ["選択肢1", "原料炭", "熱帯（A）", "堆積物"], "ans": 0, "exp": "正解は「選択肢1」です。正解 北半球の貿易風は北東風である。海からの湿った風が山地の東側で上昇するので、東側が多雨になりやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-493", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 風向は合うが、北東風に対してまず上昇する風上は東側となる。西側は雨陰に入りやすい。」", "options": ["選択肢2", "用地", "試験", "3日目"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 風向は合うが、北東風に対してまず上昇する風上は東側となる。西側は雨陰に入りやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-494", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南西からの風は中緯度の偏西風や特定地域の夏季季節風などにみられる。北半球の貿易風とは異なる。」", "options": ["選択肢3", "100,000人", "気候", "雨季（6〜9月）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 南西からの風は中緯度の偏西風や特定地域の夏季季節風などにみられる。北半球の貿易風とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-495", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 東側が風上となる点は合うが、南東貿易風は南半球の代表的な風向である。」", "options": ["選択肢4", "現在", "その他", "方式"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 東側が風上となる点は合うが、南東貿易風は南半球の代表的な風向である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-496", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海洋の影響という点は合うが、低緯度の貿易風は東寄りであり、この緯度帯の東進と対応しない。」", "options": ["選択肢1", "年齢層", "エネルギー資源", "用地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 海洋の影響という点は合うが、低緯度の貿易風は東寄りであり、この緯度帯の東進と対応しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-497", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 中心の経度が東へ変わり、北緯45度は偏西風帯に当たる。大陸西岸では西方の海洋から空気が流入するため海洋性の影響を受ける。」", "options": ["選択肢2", "40〜64歳", "人口", "前期"], "ans": 0, "exp": "正解は「選択肢2」です。正解 中心の経度が東へ変わり、北緯45度は偏西風帯に当たる。大陸西岸では西方の海洋から空気が流入するため海洋性の影響を受ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-498", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 風の名称は合うが、大陸西岸では西側に海がある。偏西風が運ぶ空気の出発側を逆にしている。」", "options": ["選択肢3", "海外へ出国した20〜39歳人口", "図法", "出国前の20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 風の名称は合うが、大陸西岸では西側に海がある。偏西風が運ぶ空気の出発側を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-499", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 極偏東風はより高緯度の東寄りの風である。北緯45度付近で東進する低気圧の説明には合わない。」", "options": ["選択肢4", "住宅地", "調査対象", "区域"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 極偏東風はより高緯度の東寄りの風である。北緯45度付近で東進する低気圧の説明には合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-500", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 インドの夏季には南西季節風が海から水蒸気を運ぶ。西ガーツ山脈の西側が風上となり、地形性降雨が多くなる。」", "options": ["選択肢1", "区域", "気候・自然環境", "降水季節性"], "ans": 0, "exp": "正解は「選択肢1」です。正解 インドの夏季には南西季節風が海から水蒸気を運ぶ。西ガーツ山脈の西側が風上となり、地形性降雨が多くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-501", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南西という風向は合うが、西岸へ入る空気はアラビア海を通る。多雨を起こす山地の働きも下降ではなく上昇である。」", "options": ["選択肢2", "C（中国沿海部）", "A年", "河川水面と排水口の高低"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 南西という風向は合うが、西岸へ入る空気はアラビア海を通る。多雨を起こす山地の働きも下降ではなく上昇である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-502", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北東季節風は主として冬季の風である。ベンガル湾からなら半島東側が先に湿った空気を受け、提示した西岸の夏雨とは合わない。」", "options": ["選択肢3", "作物X", "2択から決められない", "放牧地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 北東季節風は主として冬季の風である。ベンガル湾からなら半島東側が先に湿った空気を受け、提示した西岸の夏雨とは合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-503", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北東風が西岸へ向かうときの上流側は半島側であり、アラビア海から入るという位置関係にならない。」", "options": ["選択肢4", "出荷先", "地図", "選択肢3"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 北東風が西岸へ向かうときの上流側は半島側であり、アラビア海から入るという位置関係にならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-504", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 午後の海風は正しいが、明け方は陸面が冷え、局地風は陸から海への南風に変わる。」", "options": ["選択肢1", "Q 東側", "データ", "地理総合，地理探究"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 午後の海風は正しいが、明け方は陸面が冷え、局地風は陸から海への南風に変わる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-505", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 明け方の陸風は正しいが、午後は温まる陸に向かって海から北風が入りやすい。」", "options": ["選択肢2", "指標", "堆積物", "乾燥帯（B）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 明け方の陸風は正しいが、午後は温まる陸に向かって海から北風が入りやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-506", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海陸の加熱・冷却による風向を逆にしている。風向名は向かう方角ではなく来る方角で表す。」", "options": ["選択肢3", "時刻", "1日目", "私大（一般選抜）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 海陸の加熱・冷却による風向を逆にしている。風向名は向かう方角ではなく来る方角で表す。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-507", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 午後は陸が海より温まり海から陸へ吹くので北風、明け方は陸が海より冷えて陸から海へ吹くので南風となる。」", "options": ["選択肢4", "放牧地", "時刻帯", "その他"], "ans": 0, "exp": "正解は「選択肢4」です。正解 午後は陸が海より温まり海から陸へ吹くので北風、明け方は陸が海より冷えて陸から海へ吹くので南風となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-508", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南東貿易風はより低緯度の風系である。この説明なら東側多雨を予想するが表は西側多雨となっている。」", "options": ["選択肢1", "中心部", "乾季（11〜3月）", "工業立地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 南東貿易風はより低緯度の風系である。この説明なら東側多雨を予想するが表は西側多雨となっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-509", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 偏西風の方向は西から東なので、西斜面が先に上昇する風上となる。東西の斜面を取り違えている。」", "options": ["選択肢2", "選択肢3", "期間", "生活文化"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 偏西風の方向は西から東なので、西斜面が先に上昇する風上となる。東西の斜面を取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-510", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北東貿易風は北半球低緯度の風系であり、南緯45度の条件と合わない。」", "options": ["選択肢3", "徒歩分析", "原料炭", "調査方法"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 北東貿易風は北半球低緯度の風系であり、南緯45度の条件と合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-511", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 南緯45度付近は偏西風帯である。海からの湿った西風が山地の西側で雨を降らせ、東側へ越えると乾燥しやすい。」", "options": ["選択肢4", "細かい火山灰", "輸送機関", "世界の諸地域・日本"], "ans": 0, "exp": "正解は「選択肢4」です。正解 南緯45度付近は偏西風帯である。海からの湿った西風が山地の西側で雨を降らせ、東側へ越えると乾燥しやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-512", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pから山頂まで全区間を飽和として計算すると30℃になる。標高1,200mまでは未飽和である点を区別する必要がある。」", "options": ["選択肢1", "地理総合，歴史総合，公共", "前期", "2択から決められない"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Pから山頂まで全区間を飽和として計算すると30℃になる。標高1,200mまでは未飽和である点を区別する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-513", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pから雲底まで10℃、雲底から山頂まで5℃下がり山頂は5℃となる。Qまで20℃上がって25℃となり、水蒸気の減少と昇温で相対湿度は低くなる。」", "options": ["選択肢2", "地理総合", "40〜64歳", "Pからの水平距離"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pから雲底まで10℃、雲底から山頂まで5℃下がり山頂は5℃となる。Qまで20℃上がって25℃となり、水蒸気の減少と昇温で相対湿度は低くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-514", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 20℃は凝結・降水による効果を考えず上昇下降を打ち消した値である。相対湿度も高くなるのではなく低くなる。」", "options": ["選択肢3", "乾燥帯（B）", "地区", "地下水"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 20℃は凝結・降水による効果を考えず上昇下降を打ち消した値である。相対湿度も高くなるのではなく低くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-515", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 気温は合うが、風上で水分を失った空気が下降して昇温すると相対湿度は低下する。」", "options": ["選択肢4", "寒帯（E）", "作物", "2日目"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 気温は合うが、風上で水分を失った空気が下降して昇温すると相対湿度は低下する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-516", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海陸風は主に一日の温度差に伴う局地風である。大陸規模の冬の平均気温差の主因とは異なる。」", "options": ["選択肢1", "国公立二次（論述）", "作物X", "季節"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 海陸風は主に一日の温度差に伴う局地風である。大陸規模の冬の平均気温差の主因とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-517", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 偏西風の下流に当たるPには暖流の影響を受けた大西洋上の空気が入る。大陸東岸Qは同じ西寄りの風でも大陸内部の寒気を受けやすい。」", "options": ["選択肢2", "気候", "P 西側", "期間"], "ans": 0, "exp": "正解は「選択肢2」です。正解 偏西風の下流に当たるPには暖流の影響を受けた大西洋上の空気が入る。大陸東岸Qは同じ西寄りの風でも大陸内部の寒気を受けやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-518", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 P付近の暖流とQ側の条件を逆にしている。風が海から来るか陸から来るかも冬の気温差に重要である。」", "options": ["選択肢3", "河川がつくる地形", "最大流量", "拠点"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 P付近の暖流とQ側の条件を逆にしている。風が海から来るか陸から来るかも冬の気温差に重要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-519", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北緯50度は貿易風帯ではない。また北半球の二地点を南東・北東貿易風に分ける根拠もない。」", "options": ["選択肢4", "ホイットルセイの農業地域区分", "放牧地", "現在"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 北緯50度は貿易風帯ではない。また北半球の二地点を南東・北東貿易風に分ける根拠もない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-520", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 相対湿度の変化は合うが、主な霧の形成は冷たい海面による空気の冷却である。暖かい水面から蒸発して生じる蒸気霧と混同している。」", "options": ["選択肢1", "林業・水産業", "選択肢2", "65歳以上"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 相対湿度の変化は合うが、主な霧の形成は冷たい海面による空気の冷却である。暖かい水面から蒸発して生じる蒸気霧と混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-521", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 冷たい海面上の移流霧を蒸発増加で説明する点と、同じ水蒸気量での昇温時の相対湿度を逆にする点が誤りである。」", "options": ["選択肢2", "工業立地", "侵食", "バス"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 冷たい海面上の移流霧を蒸発増加で説明する点と、同じ水蒸気量での昇温時の相対湿度を逆にする点が誤りである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-522", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 霧の形成は合うが、水蒸気量が変わらなければ暖かい空気ほど飽和に対する割合が小さくなる。」", "options": ["選択肢3", "人口", "地理総合，歴史総合，公共", "作物X"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 霧の形成は合うが、水蒸気量が変わらなければ暖かい空気ほど飽和に対する割合が小さくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-523", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 海面12℃は露点16℃より低く、移流してきた空気が冷やされると飽和・凝結に達する。水蒸気量が同じなら昇温で相対湿度は下がる。」", "options": ["選択肢4", "民族・宗教・言語", "熱帯（A）", "流通"], "ans":
