<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>共通テスト対策 地理</title>
  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --sub: #334155;
      --pri: #0f766e; --pri-bg: #ccfbf1; --bdr: #cbd5e1;
      --ok: #15803d; --ok-bg: #dcfce7; --ng: #b91c1c; --ng-bg: #fee2e2;
      --warn: #b45309; --warn-bg: #fef3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071112; --card: #102022; --text: #f0fdfa; --sub: #cbd5e1;
        --pri: #2dd4bf; --pri-bg: rgba(45, 212, 191, 0.16); --bdr: #264246;
        --ok: #4ade80; --ok-bg: rgba(74, 222, 128, 0.16); --ng: #f87171; --ng-bg: rgba(248, 113, 113, 0.16);
        --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    #app {
      display: flex; flex-direction: column; width: 100%; height: 100vh; height: 100dvh;
      max-width: 720px; margin: 0 auto;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      gap: 6px;
    }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 38px; gap: 6px; flex-shrink: 0; }
    .hbtn { font-size: 13px; font-weight: 800; color: var(--pri); background: var(--card); border: 2px solid var(--bdr); padding: 5px 9px; border-radius: 9px; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .htitle { font-size: 16px; font-weight: 900; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
    .view { display: none; flex-direction: column; width: 100%; height: 100%; min-height: 0; gap: 6px; }
    .view.active { display: flex; }
    .home-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; min-height: 0; gap: 6px; }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0; }
    .stat-box { background: var(--pri-bg); color: var(--pri); border-radius: 10px; padding: 5px 4px; text-align: center; font-weight: 800; }
    .stat-box b { display: block; font-size: 19px; line-height: 1.15; }
    .stat-box span { font-size: 11px; }
    .field { flex-shrink: 0; }
    .field label { display: block; font-size: 12px; font-weight: 800; color: var(--sub); margin-bottom: 2px; }
    select { width: 100%; height: 40px; padding: 4px 10px; font-size: 15px; font-weight: 700; border-radius: 10px; border: 2px solid var(--bdr); background: var(--card); color: var(--text); }
    .btn { width: 100%; flex: 1; min-height: 42px; max-height: 52px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; text-decoration: none; gap: 6px; }
    .btn-pri { background: var(--pri); color: #ffffff; }
    @media (prefers-color-scheme: dark) { .btn-pri { color: #071112; } }
    .btn-sec { background: var(--card); color: var(--text); border-color: var(--bdr); font-size: 15px; }
    .btn-rev { background: var(--ng-bg); color: var(--ng); border-color: var(--ng); }
    .btn-link { background: var(--pri-bg); color: var(--pri); border-color: var(--pri); font-size: 14px; max-height: 42px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; min-height: 40px; max-height: 48px; }
    .pbar { height: 7px; background: var(--bdr); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
    .pfill { height: 100%; width: 0%; background: var(--pri); transition: width 0.25s ease; }
    .meta-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-shrink: 0; }
    .badge { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: var(--pri-bg); color: var(--pri); }
    .badge.s { background: var(--warn-bg); color: var(--warn); }
    .q-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 14px; padding: 9px 11px; flex: 0 1 auto; max-height: 38%; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
    .q-text { font-size: 18px; font-weight: 800; line-height: 1.38; }
    .q-hl { color: var(--pri); font-weight: 900; background: var(--pri-bg); padding: 1px 4px; border-radius: 4px; border-bottom: 2px solid var(--pri); }
    .q-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--sub); }
    .tts-btn { font-size: 12px; font-weight: 800; color: var(--pri); background: var(--pri-bg); border: none; border-radius: 8px; padding: 4px 9px; cursor: pointer; }

    /* サムネイル（タップして拡大） */
    .thumb-bar {
      display: none; align-items: center; gap: 8px;
      background: var(--bg); border: 1.5px solid var(--pri); border-radius: 10px;
      padding: 4px 8px; cursor: pointer;
    }
    .thumb-bar.active { display: flex; }
    .thumb-preview {
      width: 68px; height: 42px; border-radius: 6px; overflow: hidden;
      background: var(--card); border: 1px solid var(--bdr);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .thumb-preview img, .thumb-preview svg { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-label { font-size: 12px; font-weight: 800; color: var(--pri); line-height: 1.25; }

    .opts { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
    .opt-btn { flex: 1; min-height: 0; width: 100%; background: var(--card); border: 2px solid var(--bdr); border-radius: 12px; padding: 6px 12px; font-size: 17px; font-weight: 800; line-height: 1.25; color: var(--text); text-align: left; cursor: pointer; display: flex; align-items: center; overflow: hidden; }
    .opt-btn.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
    .opt-btn.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }
    .exp-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border: 2px solid var(--pri); border-radius: 16px; padding: 12px; display: none; flex-direction: column; gap: 7px; max-height: 72%; overflow-y: auto; z-index: 30; box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.28); }
    .exp-sheet.active { display: flex; }
    .exp-head { font-size: 20px; font-weight: 900; }
    .exp-ans { font-size: 17px; font-weight: 900; background: var(--ok-bg); color: var(--ok); padding: 6px 10px; border-radius: 10px; }
    .exp-body { font-size: 15px; font-weight: 700; line-height: 1.45; color: var(--sub); }
    .exp-sheet .btn, .exp-sheet .row2 { flex: 0 0 auto; max-height: none; }
    .listen-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 16px; padding: 14px; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; text-align: center; gap: 10px; }
    .listen-badge { font-size: 14px; font-weight: 900; color: var(--pri); background: var(--pri-bg); padding: 5px 12px; border-radius: 999px; align-self: center; }
    .listen-main { font-size: 19px; font-weight: 800; line-height: 1.45; overflow-y: auto; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .listen-card .btn { flex: 0 0 auto; max-height: 48px; }

    /* モーダル＆図表拡大ライトボックス */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72);
      display: none; align-items: center; justify-content: center;
      padding: 12px max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      z-index: 60;
    }
    .modal.active { display: flex; }
    .mbox {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 14px; width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px; text-align: center;
    }
    .mbox .btn { flex: 0 0 auto; max-height: none; }
    .mtitle { font-size: 18px; font-weight: 900; }
    .mscore { font-size: 32px; font-weight: 900; color: var(--pri); }
    .mtext { font-size: 15px; font-weight: 700; line-height: 1.5; color: var(--sub); text-align: left; }
    .zoom-body {
      background: var(--bg); border: 1.5px solid var(--bdr); border-radius: 12px;
      padding: 10px; width: 100%; overflow: auto;
    }
    .zoom-body img { width: 100%; height: auto; border-radius: 8px; display: block; }
    .zoom-body svg { width: 100%; height: auto; display: block; }
    .thumb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .thumb-tile {
      background: var(--bg); border: 1.5px solid var(--bdr); border-radius: 10px;
      padding: 6px; cursor: pointer; text-align: center;
    }
    .thumb-tile span { display: block; font-size: 12px; font-weight: 800; color: var(--pri); margin-top: 4px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <a class="hbtn" href="index.html">‹ 一覧</a>
    <div class="htitle">共通テスト対策 地理</div>
    <button class="hbtn" onclick="openSummary()">🗺️ 図解</button>
    <button class="hbtn" onclick="openStats()">成績</button>
  </header>

  <main>
    <div id="v-home" class="view active">
      <div class="home-card">
        <div class="stat-row">
          <div class="stat-box"><span>収録問題</span><b id="s-tot">0</b></div>
          <div class="stat-box"><span>学習済み</span><b id="s-lrn">0</b></div>
          <div class="stat-box"><span>要復習</span><b id="s-rev">0</b></div>
        </div>
        <div class="field">
          <label for="f-cat">学習グループ（分野別）</label>
          <select id="f-cat">
            <option value="ALL">全分野（バランス出題）</option>
            <option value="TOPO">① 地形（大地形・小地形・プレート）</option>
            <option value="CLIM">② 気候（ケッペン・大気大循環・雨温図）</option>
            <option value="AGRI">③ 農業・食料（地域区分・主要作物）</option>
            <option value="IND">④ 資源・エネルギー・工業立地</option>
            <option value="POP">⑤ 人口・都市・民族宗教・地誌</option>
            <option value="SOGO">⑥ 地理総合（地図・GIS・防災・覚え方）</option>
          </select>
        </div>
        <div class="field">
          <label for="f-pri">重要度</label>
          <select id="f-pri">
            <option value="ALL">すべて</option>
            <option value="S">★ 最重要（最優先・波及効果大）</option>
            <option value="A">● 重要（定番・応用）</option>
          </select>
        </div>
        <button class="btn btn-pri" onclick="startQuiz('NORMAL')">🚀 10問テストを始める</button>
        <button class="btn btn-rev" id="b-rev" style="display:none;" onclick="startQuiz('REVIEW')">
          ⚠️ 間違えた問題を復習（<span id="rev-n">0</span>問）
        </button>
        <button class="btn btn-link" onclick="openSummary()">🗺️ 図解ギャラリー＆覚えることまとめ</button>
        <button class="btn btn-sec" onclick="startListen()">🎧 きくだけモード（誤答優先）</button>
        <div class="row2">
          <button class="btn btn-sec" onclick="exportProg()">進捗エクスポート</button>
          <button class="btn btn-sec" onclick="importProg()">進捗インポート</button>
        </div>
      </div>
    </div>

    <div id="v-quiz" class="view">
      <div class="pbar"><div class="pfill" id="p-fill"></div></div>
      <div class="meta-bar">
        <span class="badge" id="q-cat">分野</span>
        <span class="badge s" id="q-pri">★ 最重要</span>
        <span id="q-num" style="font-size:15px;font-weight:900;">1 / 10</span>
      </div>
      <div class="q-card">
        <div class="q-text" id="q-txt"></div>
        <!-- 図表サムネイル（タップで拡大） -->
        <div class="thumb-bar" id="q-thumb" onclick="openCurrentFigure()">
          <div class="thumb-preview" id="q-thumb-preview"></div>
          <div class="thumb-label" id="q-thumb-label">🔍 図表サムネイル（タップで拡大）</div>
        </div>
        <div class="q-foot">
          <span id="q-id">ID</span>
          <button class="tts-btn" onclick="speak(curList[idx].q)">🔊 問題を聞く</button>
        </div>
      </div>
      <div class="opts" id="opts"></div>

      <div class="exp-sheet" id="sheet">
        <div class="exp-head" id="sh-head"></div>
        <div class="exp-ans" id="sh-ans"></div>
        <div class="exp-body" id="sh-exp"></div>
        <div class="thumb-bar" id="sh-thumb" onclick="openCurrentFigure()">
          <div class="thumb-preview" id="sh-thumb-preview"></div>
          <div class="thumb-label">🔍 関連図表をタップして大きく見る</div>
        </div>
        <div class="row2">
          <a id="sh-ref" class="btn btn-link" href="#" target="_blank" rel="noopener noreferrer">📖 解説記事 ↗</a>
          <button class="btn btn-sec" onclick="openSummary()">🗺️ 図解一覧</button>
        </div>
        <div class="row2">
          <button class="btn btn-sec" onclick="speak(curList[idx].options[curList[idx].ans] + '。' + curList[idx].exp)">🔊 解説を聞く</button>
          <button class="btn btn-pri" onclick="nextQ()">次の問題へ ›</button>
        </div>
      </div>
    </div>

    <div id="v-listen" class="view">
      <div class="listen-card">
        <div class="listen-badge" id="l-badge">きくだけモード</div>
        <div class="listen-main" id="l-main">音声を準備しています...</div>
        <button class="btn btn-sec" onclick="stopListen()">停止して戻る</button>
      </div>
    </div>
  </main>
</div>

<!-- 10問終了モーダル -->
<div class="modal" id="m-res">
  <div class="mbox">
    <div class="mtitle">10問セッション終了</div>
    <div class="mscore" id="r-sc">0 / 10</div>
    <div class="mtext" id="r-msg" style="text-align:center;"></div>
    <button class="btn btn-pri" onclick="closeRes('NEXT')">次の10問へ進む</button>
    <button class="btn btn-rev" id="r-rev" onclick="closeRes('REV')">間違えた問題を復習する</button>
    <button class="btn btn-sec" onclick="closeRes('HOME')">メニューに戻る</button>
  </div>
</div>

<!-- 30問アドバイスモーダル -->
<div class="modal" id="m-adv">
  <div class="mbox">
    <div class="mtitle">💡 30問達成！優先順位と覚え方</div>
    <div class="mtext" id="adv-txt"></div>
    <button class="btn btn-pri" onclick="document.getElementById('m-adv').classList.remove('active')">学習を続ける</button>
  </div>
</div>

<!-- 成績モーダル -->
<div class="modal" id="m-st">
  <div class="mbox">
    <div class="mtitle">学習成績・進捗状況</div>
    <div class="mtext" id="st-body"></div>
    <button class="btn btn-sec" onclick="document.getElementById('m-st').classList.remove('active')">閉じる</button>
    <button class="btn btn-sec" style="color:var(--ng);border-color:var(--ng);font-size:14px;" onclick="resetProg()">進捗データをリセット</button>
  </div>
</div>

<!-- 図解ギャラリー・まとめモーダル -->
<div class="modal" id="m-sum">
  <div class="mbox">
    <div class="mtitle">🗺️ 図解サムネイル一覧（タップで拡大）</div>
    <div class="thumb-grid" id="sum-grid"></div>
    <a class="btn btn-link" href="https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/" target="_blank" rel="noopener noreferrer">📖 元塾講師「覚えることまとめ」記事 ↗</a>
    <div class="row2">
      <a class="btn btn-sec" href="https://maps.gsi.go.jp/" target="_blank" rel="noopener noreferrer">🗺️ 地理院地図 ↗</a>
      <a class="btn btn-sec" href="https://disaportal.gsi.go.jp/" target="_blank" rel="noopener noreferrer">⚠️ ハザードマップ ↗</a>
    </div>
    <button class="btn btn-pri" onclick="document.getElementById('m-sum').classList.remove('active')">閉じる</button>
  </div>
</div>

<!-- 図表拡大ライトボックスモーダル -->
<div class="modal" id="m-zoom" onclick="if(event.target===this) closeZoom()">
  <div class="mbox">
    <div class="mtitle" id="zoom-title">図表拡大</div>
    <div class="zoom-body" id="zoom-body"></div>
    <div class="mtext" id="zoom-cap" style="font-size:13px;"></div>
    <button class="btn btn-pri" onclick="closeZoom()">閉じる</button>
  </div>
</div>

<script>

ー栽培の適地となります。", "refUrl": "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/", "refLabel": "農業・作物まとめを見る"}, {"id": "GEO-A03", "cat": "AGRI", "catName": "③ 農業・食料", "priority": "S", "figId": "", "q": "西ヨーロッパの西岸海洋性気候地域などで広く営まれ、飼料作物・穀物の栽培と家畜（豚・牛など）の飼育を組み合わせる農業は［ 空欄 ］である。", "options": ["混合農業", "遊牧", "アジア式稲作", "企業的牧畜"], "ans": 0, "exp": "混合農業は作物の輪作と家畜の糞尿による地力維持を組み合わせた持続的な農業形態です。", "refUrl": "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/", "refLabel": "ホイットルセイ農業区分を見る"}, {"id": "GEO-A04", "cat": "AGRI", "catName": "③ 農業・食料", "priority": "A", "figId": "", "q": "食料の輸送距離に輸送重量を掛け合わせて算出し、食料輸送に伴う環境負荷を考える指標を［ 空欄 ］という。", "options": ["フードマイレージ", "エンゲル係数", "人口転換指数", "ジニ係数"], "ans": 0, "exp": "食料問題では穀物の輸出国・輸入国、食料自給率、フードマイレージ、高収量品種導入による「緑の革命」を押さえます。", "refUrl": "https://www.maff.go.jp/", "refLabel": "農林水産省 食料・農業統計"}, {"id": "GEO-A05", "cat": "AGRI", "catName": "③ 農業・食料", "priority": "A", "figId": "", "q": "水産業において好漁場が形成されやすい自然条件として、水深200m未満の［ Ｘ ］が広がる海域や、暖流と寒流がぶつかる［ Ｙ ］がある。", "options": ["［Ｘ］大陸棚 ［Ｙ］潮目", "［Ｘ］海溝  ［Ｙ］海嶺", "［Ｘ］扇状地 ［Ｙ］三角州", "［Ｘ］地溝帯 ［Ｙ］ワジ"], "ans": 0, "exp": "大陸棚は日光が届きプランクトンが豊富で、潮目（三陸沖やニューファンドランド島沖など）も魚類が集まる世界有数の好漁場です。", "refUrl": "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/", "refLabel": "水産業・林業まとめを見る"}, {"id": "GEO-A06", "cat": "AGRI", "catName": "③ 農業・食料", "priority": "A", "figId": "", "q": "旧植民地などの熱帯・亜熱帯地域で、先進国の資本と現地の安価な労働力を用いて天然ゴム・カカオ・茶などを単一栽培する農業は［ 空欄 ］である。", "options": ["プランテーション農業", "酪農", "園芸農業", "企業的穀物農業"], "ans": 0, "exp": "プランテーション農業は輸出向け商品作物の大規模単一栽培（モノカルチャー）が特徴で、国際価格変動の影響を受けやすい課題があります。", "refUrl": "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/", "refLabel": "農業区分まとめを見る"}, {"id": "GEO-I01", "cat": "IND", "catName": "④ 資源・工業", "priority": "S", "figId": "weber", "q": "ウェーバーの工業立地論を整理する基本の考え方は、その製品をつくる際に［ 空欄 ］が最小になる場所を選ぶことである。", "options": ["いちばん高いコスト（輸送費・労働費など）", "工場の標高", "年間の降水量", "最寄り駅からの徒歩分数のみ"], "ans": 0, "exp": "原料が重く製品で軽くなるなら「原料指向」、製品の輸送が大変なら「市場指向」、人手が多く必要なら「労働力指向」とコスト軸で整理できます。", "refUrl": "http nohitorigoto.com/daigaku-juken-chiri-oboerukoto/", "refLabel": "統計の覚え方を見る"}, {"id": "GEO-P01", "cat": "POP", "catName": "⑤ 人口・都市・地誌", "priority": "S", "figId": "pyramid", "q": "経済発展や医療水準の向上に伴い、多産多死から多産少死を経て少産少死へと移り変わる人口動態の変化を［ 空欄 ］という。", "options": ["人口転換", "産業の空洞化", "ドーナツ化", "スプロール現象"], "ans": 0, "exp": "人口転換の段階は人口ピラミッドの形（富士山型→釣鐘型→つぼ型）や、先進国・発展途上国の特徴と直結します。", "refUrl": "https://www.stat.go.jp/", "refLabel": "総務省統計局 人口統計を見る"}, {"id": "GEO-P02", "cat": "POP", "catName": "⑤ 人口・都市・地誌", "priority": "S", "figId": "", "q": "地誌（東アジア・ヨーロッパ・アメリカ・アフリカなど）を効率よく覚えるための組み立て方として最も適切なものはどれか。", "options": ["系統地理（地形・気候・農業・工業・人口）の知識を土台にして、各地域の特色を因果関係で組み合わせる", "系統地理を学ばずに、世界中の都市名だけを五十音順に暗記する", "気候や地形を無視して、すべての地域を同じ産業構造とみなす", "一問一答の用語だけを見て地図帳は一切開かない"], "ans": 0, "exp": "系統地理が土台、地誌はその応用です。地形・気候を理由で理解していれば、各地域の農業・資源・文化が自然につながります。", "refUrl": "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/", "refLabel": "地誌の組み立て方を見る"}, {"id": "GEO-P03", "cat": "POP", "catName": "⑤ 人口・都市・地誌", "priority": "A", "figId": "", "q": "都心部の地価高騰や業務機能の集中により居住機能が郊外へ移り、都心部の夜間人口が減少する現象を［ 空欄 ］現象という。", "options": ["ドーナツ化", "フェーン", "エルニーニョ", "緑の革命"], "ans": 0, "exp": "都市問題ではドーナツ化現象、郊外への無秩序な市街地拡大（スプロール現象）、近年の都心回帰などを整理します。", "refUrl": "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/", "refLabel": "人口・都市のまとめを見る"}, {"id": "GEO-P04", "cat": "POP", "catName": "⑤ 人口・都市・地誌", "priority": "A", "figId": "", "q": "西アジア・北アフリカを中心に広く信仰され、豚肉やアルコールの禁忌（ハラール）など生活文化や食習慣とも深く結びつく宗教は［ 空欄 ］である。", "options": ["イスラム教", "ヒンドゥー教", "仏教", "神道"], "ans": 0, "exp": "宗教の分布は食文化（豚肉禁忌・牛肉禁忌など）、建築景観、祝日、地域紛争や国際協力の理解にも関わります。", "refUrl": "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/", "refLabel": "民族・宗教まとめを見る"}, {"id": "GEO-P05", "cat": "POP", "catName": "⑤ 人口・都市・地誌", "priority": "A", "figId": "", "q": "モンスーンアジアの地域で高い人口密度を支えてきた、夏の季節風による高温多雨を活かした農業は［ 空欄 ］である。", "options": ["アジア式稲作（水田稲作）", "地中海式農業", "企業的牧畜", "遊牧"], "ans": 0, "exp": "米は単位面積あたりの収量（人口扶養力）が非常に高く、モンスーンアジアの稠密な人口分布の基盤となっています。", "refUrl": "https://jukukounohi Pより西にあるので、南中はPより後になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-191", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pの南中高度は50°、Qは70°。PはQより東に10°離れており、同じ世界時で追うと約40分早く南中する。」", "options": ["選択肢2", "住宅地", "調査対象", "区域"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pの南中高度は50°、Qは70°。PはQより東に10°離れており、同じ世界時で追うと約40分早く南中する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-192", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 PはQより高緯度なので、春分の南中高度は低い。東にあるPが先に南中する点は正しい。」", "options": ["選択肢3", "区域", "気候・自然環境", "降水季節性"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 PはQより高緯度なので、春分の南中高度は低い。東にあるPが先に南中する点は正しい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-193", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高緯度ほど南中高度が低いことと、東ほど先に南中することの両方が逆になっている。」", "options": ["選択肢4", "C（中国沿海部）", "A年", "河川水面と排水口の高低"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 高緯度ほど南中高度が低いことと、東ほど先に南中することの両方が逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-194", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 緯度の南北も反転する必要があり、対蹠点間の距離は大円の4分の1ではなく半周になる。」", "options": ["選択肢1", "作物X", "2択から決められない", "放牧地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 緯度の南北も反転する必要があり、対蹠点間の距離は大円の4分の1ではなく半周になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-195", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 対蹠点では緯度の南北を反転し、経度を180°ずらす。両地点は大円の半周だけ離れるので20000kmとなる。」", "options": ["選択肢2", "出荷先", "地図", "選択肢4"], "ans": 0, "exp": "正解は「選択肢2」です。正解 対蹠点では緯度の南北を反転し、経度を180°ずらす。両地点は大円の半周だけ離れるので20000kmとなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-196", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 東経40°の反対側は西経140°。東西の符号だけを変えた西経40°は対蹠点ではない。」", "options": ["選択肢3", "Q 東側", "データ", "地理総合，地理探究"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 東経40°の反対側は西経140°。東西の符号だけを変えた西経40°は対蹠点ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-197", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 南北を反転すると南緯25°であり、90°から25°を引く操作はしない。最短距離20000kmは正しい。」", "options": ["選択肢4", "指標", "堆積物", "乾燥帯（B）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 南北を反転すると南緯25°であり、90°から25°を引く操作はしない。最短距離20000kmは正しい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-198", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 角度の広がりが等しくても地表面積は等しくない。経度1°に対応する東西距離は高緯度ほど短くなる。」", "options": ["選択肢1", "時刻", "1日目", "私大（一般選抜）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 角度の広がりが等しくても地表面積は等しくない。経度1°に対応する東西距離は高緯度ほど短くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-199", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aの面積は約111×111、Bは約111×55.5でAの半分。同じ10万人ならBの人口密度はAの約2倍になる。」", "options": ["選択肢2", "放牧地", "時刻帯", "その他"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Aの面積は約111×111、Bは約111×55.5でAの半分。同じ10万人ならBの人口密度はAの約2倍になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-200", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 密度の倍率は正しい。球体では南北の緯度1°分はほぼ一定で、縮むのは同じ経度差に対応する東西方向の距離である。」", "options": ["選択肢3", "中心部", "乾季（11〜3月）", "工業立地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 密度の倍率は正しい。球体では南北の緯度1°分はほぼ一定で、縮むのは同じ経度差に対応する東西方向の距離である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-201", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 経線間隔が狭まる説明は正しいが、同じ人口がより小さい面積に住むので、人口密度は小さくならず大きくなる。」", "options": ["選択肢4", "選択肢2", "期間", "生活文化"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 経線間隔が狭まる説明は正しいが、同じ人口がより小さい面積に住むので、人口密度は小さくならず大きくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-202", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 15°の経度差は1時間。Aは基準子午線の西にあるため13時、Bは東にあるため11時に南中する。」", "options": ["選択肢1", "徒歩分析", "原料炭", "調査方法"], "ans": 0, "exp": "正解は「選択肢1」です。正解 15°の経度差は1時間。Aは基準子午線の西にあるため13時、Bは東にあるため11時に南中する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-203", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの13時は正しいが、Bは基準子午線より東へ15°なので、標準時11時に南中する。」", "options": ["選択肢2", "細かい火山灰", "輸送機関", "世界の諸地域・日本"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Aの13時は正しいが、Bは基準子午線より東へ15°なので、標準時11時に南中する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-204", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 西にあるAの南中は基準子午線より遅く、東にあるBは早い。東西と時刻の対応が逆になっている。」", "options": ["選択肢3", "地理総合，歴史総合，公共", "前期", "2択から決められない"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 西にあるAの南中は基準子午線より遅く、東にあるBは早い。東西と時刻の対応が逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-205", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 同じ標準時を採用しても各地点の地方時は異なる。時計の12時と太陽の南中が一致するのは基準子午線上である。」", "options": ["選択肢4", "地理総合", "40〜64歳", "Pからの水平距離"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 同じ標準時を採用しても各地点の地方時は異なる。時計の12時と太陽の南中が一致するのは基準子午線上である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-206", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 東向きに日付変更線を越える場合は日付を戻す。この選択肢は進行方向と日付調整の関係を逆にしている。」", "options": ["選択肢1", "乾燥帯（B）", "地区", "地下水"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 東向きに日付変更線を越える場合は日付を戻す。この選択肢は進行方向と日付調整の関係を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-207", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 AはUTCより12時間進み、Bは12時間遅れる。Aの出発時刻に20分を加えて24時間戻すと、4月30日0時30分になる。」", "options": ["選択肢2", "寒帯（E）", "作物", "2日目"], "ans": 0, "exp": "正解は「選択肢2」です。正解 AはUTCより12時間進み、Bは12時間遅れる。Aの出発時刻に20分を加えて24時間戻すと、4月30日0時30分になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-208", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 所要時間だけを加えた値であり、日付変更線を挟む両島の24時間の標準時差を反映していない。」", "options": ["選択肢3", "国公立二次（論述）", "作物X", "季節"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 所要時間だけを加えた値であり、日付変更線を挟む両島の24時間の標準時差を反映していない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-209", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの出発時刻から20分だけ戻すとこの日時になるが、移動時間は足す必要がある。さらにAとBの標準時差24時間も反映し、到着はBで4月30日0時30分となる。」", "options": ["選択肢4", "気候", "P 西側", "期間"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aの出発時刻から20分だけ戻すとこの日時になるが、移動時間は足す必要がある。さらにAとBの標準時差24時間も反映し、到着はBで4月30日0時30分となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-210", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 経過時間は計16時間。東京の時計なら15日14時で、UTC＋9からUTC−5へ14時間戻すと15日0時になる。」", "options": ["選択肢1", "河川がつくる地形", "最大流量", "拠点"], "ans": 0, "exp": "正解は「選択肢1」です。正解 経過時間は計16時間。東京の時計なら15日14時で、UTC＋9からUTC−5へ14時間戻すと15日0時になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-211", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 LからNへの時差を二重に加えた計算に相当する。出発地から目的地への時差を一度適用すればよい。」", "options": ["選択肢2", "ホイットルセイの農業地域区分", "放牧地", "現在"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 LからNへの時差を二重に加えた計算に相当する。出発地から目的地への時差を一度適用すればよい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-212", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 これは到着時の東京の日時である。目的地Nの標準時は東京より14時間遅れている。」", "options": ["選択肢3", "林業・水産業", "選択肢1", "65歳以上"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 これは到着時の東京の日時である。目的地Nの標準時は東京より14時間遅れている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-213", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 UTC−8のLの時計のまま全行程を計算すると14日21時になる。NはLより3時間進んでいるので、さらに3時間を加える。」", "options": ["選択肢4", "工業立地", "侵食", "バス"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 UTC−8のLの時計のまま全行程を計算すると14日21時になる。NはLより3時間進んでいるので、さらに3時間を加える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-214", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 水平距離の比較は正しいが、標高差の大きさだけでは勾配は比較できない。Qは高低差が大きくても長い斜面なのでPより緩い。」", "options": ["選択肢1", "人口", "地理総合，歴史総合，公共", "作物X"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 水平距離の比較は正しいが、標高差の大きさだけでは勾配は比較できない。Qは高低差が大きくても長い斜面なのでPより緩い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-215", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの方が急である点は正しい。図上長だけでは実距離を比べられず、縮尺換算後はPの方が短い。」", "options": ["選択肢2", "民族・宗教・言語", "熱帯（A）", "流通"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pの方が急である点は正しい。図上長だけでは実距離を比べられず、縮尺換算後はPの方が短い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-216", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは4.0cm×25000＝1000m、Qは3.0cm×50000＝1500m。勾配はPが60/1000＝6％、Qが75/1500＝5％になる。」", "options": ["選択肢3", "時差", "試験", "Q：日本海側"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Pは4.0cm×25000＝1000m、Qは3.0cm×50000＝1500m。勾配はPが60/1000＝6％、Qが75/1500＝5％になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-217", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地図上で短いQを実距離でも短いとし、標高差の大きいQを急とする二重の取り違えである。」", "options": ["選択肢4", "地球的課題", "気候", "選択肢2"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 地図上で短いQを実距離でも短いとし、標高差の大きいQを急とする二重の取り違えである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-218", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Bの実面積がAの4倍である点だけを用いた値。集落数もBがAの2倍なので、密度比は4倍にならない。」", "options": ["選択肢1", "情報の限界", "その他", "科目名"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Bの実面積がAの4倍である点だけを用いた値。集落数もBがAの2倍なので、密度比は4倍にならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-219", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 両区の地図上面積が同じでも、Bは縮尺の分母が2倍なので実面積は4倍になる。」", "options": ["選択肢2", "気候・自然環境", "エネルギー資源", "熱帯（A）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 両区の地図上面積が同じでも、Bは縮尺の分母が2倍なので実面積は4倍になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-220", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは1km²に12集落、Bは4km²に24集落なので、Aの密度は高い。集落数だけの比12/24は密度比ではない。」", "options": ["選択肢3", "世界の諸地域・日本", "人口", "国公立二次（論述）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Aは1km²に12集落、Bは4km²に24集落なので、Aの密度は高い。集落数だけの比12/24は密度比ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-221", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは1cmが250mで16cm²＝1km²、Bは1cmが500mで16cm²＝4km²。密度は12対6で2倍となる。」", "options": ["選択肢4", "B年", "図法", "海岸の地形"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Aは1cmが250mで16cm²＝1km²、Bは1cmが500mで16cm²＝4km²。密度は12対6で2倍となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-222", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 図を大きくした場合、縮尺の分母は小さくなる。また拡大だけでは、元画像にない道路情報は追加されない。」", "options": ["選択肢1", "図表になると迷う", "調査対象", "鉱産資源"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 図を大きくした場合、縮尺の分母は小さくなる。また拡大だけでは、元画像にない道路情報は追加されない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-223", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 拡大後の縮尺は正しいが、1：12500で新たに測量した地図と同じ精度になるわけではない。元の画素と地物表現が拡大される。」", "options": ["選択肢2", "答えを見れば分かる", "気候・自然環境", "民族・宗教・言語"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 拡大後の縮尺は正しいが、1：12500で新たに測量した地図と同じ精度になるわけではない。元の画素と地物表現が拡大される。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-224", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 同じ実距離の図上長が2倍になるため縮尺は1：12500。ただし元画像に含まれない細部や測量精度は、単純拡大では得られない。」", "options": ["選択肢3", "地図", "A年", "調査対象"], "ans": 0, "exp": "正解は「選択肢3」です。正解 同じ実距離の図上長が2倍になるため縮尺は1：12500。ただし元画像に含まれない細部や測量精度は、単純拡大では得られない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-225", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 情報量が増えない点は正しいが、図上の1cmが表す実距離は半分になり、縮尺は1：12500となる。」", "options": ["選択肢4", "地点", "2択から決められない", "人口・都市・生活文化"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 情報量が増えない点は正しいが、図上の1cmが表す実距離は半分になり、縮尺は1：12500となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-226", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北緯35°の春分には南側の空で南中するため、影は北へ伸びる。画面左は南に対応し、影の向きが逆である。」", "options": ["選択肢1", "位置", "地図", "図表になると迷う"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 北緯35°の春分には南側の空で南中するため、影は北へ伸びる。画面左は南に対応し、影の向きが逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-227", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 春分の太陽は南側の空で南中し、柱の影は北へ伸びる。北は画面右なので、影はPからQへ向かう方向と一致する。」", "options": ["選択肢2", "地下水", "データ", "領域"], "ans": 0, "exp": "正解は「選択肢2」です。正解 春分の太陽は南側の空で南中し、柱の影は北へ伸びる。北は画面右なので、影はPからQへ向かう方向と一致する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-228", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 画面上はこの図では西である。北が上の通常の地図と混同して、影を画面上へ向けてはならない。」", "options": ["選択肢3", "現在の地図", "堆積物", "礫・砂・泥の割合"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 画面上はこの図では西である。北が上の通常の地図と混同して、影を画面上へ向けてはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-229", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xは適切だが、メルカトル図法上の2点間の直線長を、そのまま最短距離へ換算することはできない。」", "options": ["選択肢1", "雲底", "時刻帯", "地表からの深さ（m）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Xは適切だが、メルカトル図法上の2点間の直線長を、そのまま最短距離へ換算することはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-230", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Xは面積比を保つ正積図法、Yは中心からの距離と方位を保つ正距方位図法が目的に合う。」", "options": ["選択肢2", "さらに下", "乾季（11〜3月）", "林齢構成"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Xは面積比を保つ正積図法、Yは中心からの距離と方位を保つ正距方位図法が目的に合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-231", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Yは適切だが、メルカトル図法では高緯度の面積が拡大するため、Xの面積比較にそのまま利用できない。」", "options": ["選択肢3", "雨季（6〜9月）", "期間", "輸送"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Yは適切だが、メルカトル図法では高緯度の面積が拡大するため、Xの面積比較にそのまま利用できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-232", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xでは面積のひずみ、Yでは距離・方位のひずみが目的に合わない。保存する性質を用途ごとに選ぶ必要がある。」", "options": ["選択肢4", "総労働時間", "原料炭", "10年前"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Xでは面積のひずみ、Yでは距離・方位のひずみが目的に合わない。保存する性質を用途ごとに選ぶ必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-233", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 中心OからPは1000km、Qは2000kmなので2倍。OからQへ引く放射線の方位も保たれるため、出発方位は東である。」", "options": ["選択肢1", "期間", "輸送機関", "40〜64歳"], "ans": 0, "exp": "正解は「選択肢1」です。正解 中心OからPは1000km、Qは2000kmなので2倍。OからQへ引く放射線の方位も保たれるため、出発方位は東である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-234", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 半径と面積の倍率を取り違え、さらに中心以外の2点間にも距離の性質を広げてしまっている。」", "options": ["選択肢2", "地域", "前期", "店舗"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 半径と面積の倍率を取り違え、さらに中心以外の2点間にも距離の性質を広げてしまっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-235", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 中心Oからの距離比は2倍でよいが、中心を通らないP–Q間に同じ距離の保証はない。正距は任意の2地点間が等しく正しいという意味ではない。」", "options": ["選択肢3", "輸送", "40〜64歳", "主要河川"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 中心Oからの距離比は2倍でよいが、中心を通らないP–Q間に同じ距離の保証はない。正距は任意の2地点間が等しく正しいという意味ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-236", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 中心からの距離は半径に比例し、円の面積には比例しない。半径2倍を面積4倍と取り違えている。」", "options": ["選択肢4", "貨物", "地区", "Q 東側"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 中心からの距離は半径に比例し、円の面積には比例しない。半径2倍を面積4倍と取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-237", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 実面積は図上面積を拡大率で割る。Pは200、Qは100の共通単位となり、実面積比は2：1である。」", "options": ["選択肢1", "時点", "作物", "P：太平洋側"], "ans": 0, "exp": "正解は「選択肢1」です。正解 実面積は図上面積を拡大率で割る。Pは200、Qは100の共通単位となり、実面積比は2：1である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-238", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは200/1＝200、Qは400/4＝100になる。同じ図法に描かれていても緯度によって拡大率が異なる。」", "options": ["選択肢2", "前期", "作物X", "選択肢1"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pは200/1＝200、Qは400/4＝100になる。同じ図法に描かれていても緯度によって拡大率が異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-239", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 面積拡大率の比4：1だけを比較した値で、元の図上面積がQで2倍あることを使っていない。」", "options": ["選択肢3", "18〜24歳", "P 西側", "細かい火山灰"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 面積拡大率の比4：1だけを比較した値で、元の図上面積がQで2倍あることを使っていない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-240", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 図上面積200：400をそのまま用いた比であり、高緯度側で面積が過大に表されることを補正していない。」", "options": ["選択肢4", "65歳以上", "最大流量", "気候帯"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 図上面積200：400をそのまま用いた比であり、高緯度側で面積が過大に表されることを補正していない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-241", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 勾配比は正しいが、北側の等高線の方が高いので下る向きは南である。等高線の数値と方位を照合する必要がある。」", "options": ["選択肢1", "海外就労者から家族への送金", "放牧地", "共通テスト"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 勾配比は正しいが、北側の等高線の方が高いので下る向きは南である。等高線の数値と方位を照合する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-242", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高低の向きも勾配比も逆。標高値の増える向きと等高線間隔を別々に読むと修正できる。」", "options": ["選択肢2", "店舗", "選択肢1", "河川がつくる地形"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 高低の向きも勾配比も逆。標高値の増える向きと等高線間隔を別々に読むと修正できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-243", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 下る方位は正しいが、等高線間隔が狭いAの方が急になる。水平距離が半分なので勾配は半分ではなく2倍である。」", "options": ["選択肢3", "作物", "侵食", "エネルギー資源"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 下る方位は正しいが、等高線間隔が狭いAの方が急になる。水平距離が半分なので勾配は半分ではなく2倍である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-244", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 両斜面とも北側が130m、南側が100mなので南へ下る。Aは30mの高度差をBの半分の水平距離で上るため、勾配は2倍になる。」", "options": ["選択肢4", "時期", "地理総合，歴史総合，公共", "村落"], "ans": 0, "exp": "正解は「選択肢4」です。正解 両斜面とも北側が130m、南側が100mなので南へ下る。Aは30mの高度差をBの半分の水平距離で上るため、勾配は2倍になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-245", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 下流は南向きなので右岸は西側でよいが、等高線が高い方へ入り込む中央は尾根ではなく谷である。」", "options": ["選択肢1", "降水季節性", "熱帯（A）", "地球的課題"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 下流は南向きなので右岸は西側でよいが、等高線が高い方へ入り込む中央は尾根ではなく谷である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-246", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 中央では等高線が高い北側へ入り込むので谷になる。水は140m側から100m側の南へ流れ、下流を向いた右岸は西側となる。」", "options": ["選択肢2", "区分", "試験", "産業・資源・流通"], "ans": 0, "exp": "正解は「選択肢2」です。正解 中央では等高線が高い北側へ入り込むので谷になる。水は140m側から100m側の南へ流れ、下流を向いた右岸は西側となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-247", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 谷の判読は正しいが、南を向いたとき右手は西になる。地図を正面から見た右と、川の右岸を混同している。」", "options": ["選択肢3", "流通", "気候", "用語があいまい"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 谷の判読は正しいが、南を向いたとき右手は西になる。地図を正面から見た右と、川の右岸を混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-248", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 等高線の屈曲を尾根と読み、さらに地図上の右を右岸とした判断である。地形判読と下流向きの確認が必要。」", "options": ["選択肢4", "最大流量", "その他", "地図"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 等高線の屈曲を尾根と読み、さらに地図上の右を右岸とした判断である。地形判読と下流向きの確認が必要。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-249", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 谷と判定するなら、水は両側から谷底へ集まる。図は等高線が低い側へ張り出しており、そもそも中央は尾根になる。」", "options": ["選択肢1", "P：太平洋側", "エネルギー資源", "地表勾配"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 谷と判定するなら、水は両側から谷底へ集まる。図は等高線が低い側へ張り出しており、そもそも中央は尾根になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-250", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 谷では水が集まるが、図では等高線の突き出す向きが低い南側なので尾根である。高低を反対に読んでいる。」", "options": ["選択肢2", "観光地", "人口", "12〜2月／6〜8月の各月降水量"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 谷では水が集まるが、図では等高線の突き出す向きが低い南側なので尾根である。高低を反対に読んでいる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-251", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 中央は等高線が低い側へ張り出す尾根で、同じ東西方向の周囲より高い。雨水は尾根から両側の低い斜面へ分かれて流れる。」", "options": ["選択肢3", "周辺部", "図法", "さらに下"], "ans": 0, "exp": "正解は「選択肢3」です。正解 中央は等高線が低い側へ張り出す尾根で、同じ東西方向の周囲より高い。雨水は尾根から両側の低い斜面へ分かれて流れる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-252", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 尾根の判読は正しいが、尾根は周囲より高い筋になる。雨水は両側斜面へ分かれ、中央へ集まる谷とは異なる。」", "options": ["選択肢4", "選択肢3", "調査対象", "産地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 尾根の判読は正しいが、尾根は周囲より高い筋になる。雨水は両側斜面へ分かれ、中央へ集まる谷とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-253", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 山頂が160mを超えるなら160m等高線も描かれる。図にない等高線を想定した範囲になっている。」", "options": ["選択肢1", "侵食", "気候・自然環境", "原料炭"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 山頂が160mを超えるなら160m等高線も描かれる。図にない等高線を想定した範囲になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-254", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 最も内側の140m等高線より山頂は高いので、100m地点との比高は40mを超える。内側の等高線を一つ読み落としている。」", "options": ["選択肢2", "科目名", "A年", "時点"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 最も内側の140m等高線より山頂は高いので、100m地点との比高は40mを超える。内側の等高線を一つ読み落としている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-255", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 山頂は140mより高く160m未満。100m地点との差を取ると、40mより大きく60m未満になる。」", "options": ["選択肢3", "系統地理", "2択から決められない", "25〜39歳"], "ans": 0, "exp": "正解は「選択肢3」です。正解 山頂は140mより高く160m未満。100m地点との差を取ると、40mより大きく60m未満になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-256", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 比高は二地点の標高差で、標高そのものではない。山頂の標高範囲からRの100mを差し引く必要がある。」", "options": ["選択肢4", "気候帯", "地図", "住宅地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 比高は二地点の標高差で、標高そのものではない。山頂の標高範囲からRの100mを差し引く必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-257", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 両端の標高差そのものは遮蔽の条件ではない。P–Qを結ぶ直線と途中の地表を同じ距離位置で比べる必要がある。」", "options": ["選択肢1", "温帯（C）", "データ", "時期"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 両端の標高差そのものは遮蔽の条件ではない。P–Qを結ぶ直線と途中の地表を同じ距離位置で比べる必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-258", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 2km地点では視線150mに対し地表140mで下にあるが、1km地点で遮られる。一地点だけの判定では足りない。」", "options": ["選択肢2", "試験", "堆積物", "P 西側"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 2km地点では視線150mに対し地表140mで下にあるが、1km地点で遮られる。一地点だけの判定では足りない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-259", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qより低いだけでは見通しは保証されない。P–Qを結ぶ視線は途中で200m未満となり、それより地表が高い場所で遮られる。」", "options": ["選択肢3", "私大（一般選抜）", "1日目", "時刻"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Qより低いだけでは見通しは保証されない。P–Qを結ぶ視線は途中で200m未満となり、それより地表が高い場所で遮られる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-260", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 P–Qは4kmで100m上がるので、1km地点の視線は125m。その地表130mは視線を5m上回り、見通しを遮る。」", "options": ["選択肢4", "プレート境界", "時刻帯", "周辺部"], "ans": 0, "exp": "正解は「選択肢4」です。正解 P–Qは4kmで100m上がるので、1km地点の視線は125m。その地表130mは視線を5m上回り、見通しを遮る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-261", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「6％、Q–R：0.6％／下流側で運搬中の粒子が粗くなる。」", "options": ["P–Q", "海岸の地形", "乾季（11〜3月）", "低い平均気温"], "ans": 0, "exp": "正解は「P–Q」です。6％、Q–R：0.6％／下流側で運搬中の粒子が粗くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-262", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「0.6％、Q–R：6％／下流側で礫の割合が増える。」", "options": ["P–Q", "主要作物の栽培条件と主産地", "期間", "地理総合"], "ans": 0, "exp": "正解は「P–Q」です。0.6％、Q–R：6％／下流側で礫の割合が増える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-263", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「6％、Q–R：0.6％／下流側で運搬中の粒子が細かくなる。」", "options": ["P–Q", "エネルギー資源", "原料炭", "試験"], "ans": 0, "exp": "正解は「P–Q」です。6％、Q–R：0.6％／下流側で運搬中の粒子が細かくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-264", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「0.6％、Q–R：6％／下流側で運搬中の粒子が細かくなる。」", "options": ["P–Q", "工業の変化", "輸送機関", "大地形"], "ans": 0, "exp": "正解は「P–Q」です。0.6％、Q–R：6％／下流側で運搬中の粒子が細かくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-265", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 勾配の計算は正しいが、一般には下流ほど細粒化する。支流から新たに粗い礫が入るような個別の例外は、この資料では示していない。」", "options": ["選択肢1", "都市", "前期", "林業・水産業"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 勾配の計算は正しいが、一般には下流ほど細粒化する。支流から新たに粗い礫が入るような個別の例外は、この資料では示していない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-266", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 P–Qは120/2000＝6％、Q–Rは30/5000＝0.6％であり数値が逆。一般的な下流方向の粒径変化も逆である。」", "options": ["選択肢2", "生活文化", "40〜64歳", "都市"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 P–Qは120/2000＝6％、Q–Rは30/5000＝0.6％であり数値が逆。一般的な下流方向の粒径変化も逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-267", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 P–Qは6％、Q–Rは0.6％。下流へ運ばれる間の摩耗や選択的な運搬・堆積によって、河床材料は一般に細かくなる傾向がある。」", "options": ["選択肢3", "地形図", "地区", "GIS"], "ans": 0, "exp": "正解は「選択肢3」です。正解 P–Qは6％、Q–Rは0.6％。下流へ運ばれる間の摩耗や選択的な運搬・堆積によって、河床材料は一般に細かくなる傾向がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-268", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 下流で細粒化する傾向は正しいが、勾配の数値が逆。kmをmへ換算して標高差を水平距離で割る。」", "options": ["選択肢4", "調査対象", "作物", "気候・自然環境"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 下流で細粒化する傾向は正しいが、勾配の数値が逆。kmをmへ換算して標高差を水平距離で割る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-269", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 PはAの流域内なので取水でAが減り、放水でBが増える。導水路は人為的に水を移す施設で、地表の高低から定まる自然の分水界を変更しない。」", "options": ["選択肢1", "利益相反の有無", "作物X", "今の状態"], "ans": 0, "exp": "正解は「選択肢1」です。正解 PはAの流域内なので取水でAが減り、放水でBが増える。導水路は人為的に水を移す施設で、地表の高低から定まる自然の分水界を変更しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-270", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 流量の増減は正しいが、導水路の経路が新たな自然の分水界になるわけではない。地形による流域と人為的な水移動を区別する。」", "options": ["選択肢2", "産業・資源・流通", "P 西側", "斜面"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 流量の増減は正しいが、導水路の経路が新たな自然の分水界になるわけではない。地形による流域と人為的な水移動を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-271", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pから取水するためAの下流流量は減る。川の本流は集水する流路で、両側の流域を分ける尾根とは役割が異なる。」", "options": ["選択肢3", "防災・環境・地域調査", "最大流量", "位置"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pから取水するためAの下流流量は減る。川の本流は集水する流路で、両側の流域を分ける尾根とは役割が異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-272", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの自然流下先はAである。取水元Aの流量は減り、放水先Bの流量は増えるので増減が逆になる。」", "options": ["選択肢4", "今の状態", "放牧地", "標高データ"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pの自然流下先はAである。取水元Aの流量は減り、放水先Bの流量は増えるので増減が逆になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-273", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは直線距離では近いが徒歩経路が1100mあり、条件を超える。標高が高いか低いかだけで自然堤防や段丘面を区別することもできない。」", "options": ["選択肢1", "2択から決められない", "選択肢2", "時刻帯"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Aは直線距離では近いが徒歩経路が1100mあり、条件を超える。標高が高いか低いかだけで自然堤防や段丘面を区別することもできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-274", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Dは平坦面の条件を満たさない。駅からの直線円は道路の迂回を反映せず、条件指定された徒歩距離と異なる。」", "options": ["選択肢2", "メッシュ", "侵食", "総労働時間"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Dは平坦面の条件を満たさない。駅からの直線円は道路の迂回を反映せず、条件指定された徒歩距離と異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-275", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Cは徒歩700mで段丘面にある。道路網に基づく徒歩経路と、地形分類ポリゴンを組み合わせて二つの条件を判定する。」", "options": ["選択肢3", "領域", "地理総合，歴史総合，公共", "鉄鉱石"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Cは徒歩700mで段丘面にある。道路網に基づく徒歩経路と、地形分類ポリゴンを組み合わせて二つの条件を判定する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-276", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは徒歩条件を外れ、Dは段丘面ではなく段丘崖にある。土地利用の面積集計では、必要な微地形の区分を得られない。」", "options": ["選択肢4", "候補", "熱帯（A）", "100,000人"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aは徒歩条件を外れ、Dは段丘面ではなく段丘崖にある。土地利用の面積集計では、必要な微地形の区分を得られない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-277", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Dは条件を満たすが、Aは徒歩450mなので徒歩圏にも入る。直線の円内だけを見てAも選ばないようにする。」", "options": ["選択肢1", "地表勾配", "試験", "18〜24歳"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Dは条件を満たすが、Aは徒歩450mなので徒歩圏にも入る。直線の円内だけを見てAも選ばないようにする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-278", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは直線圏・徒歩圏の両方に入り、Bは直線圏の外にある。求めている「直線圏には入るが徒歩圏には入らない」地点とはどちらも違う。」", "options": ["選択肢2", "堆積物", "気候", "地区"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Aは直線圏・徒歩圏の両方に入り、Bは直線圏の外にある。求めている「直線圏には入るが徒歩圏には入らない」地点とはどちらも違う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-279", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Cは円周上にあるため直線500m以内に入り、徒歩650mなので条件を満たす。しかしBは直線でも500m圏外である。」", "options": ["選択肢3", "標高データ", "その他", "C（中国沿海部）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Cは円周上にあるため直線500m以内に入り、徒歩650mなので条件を満たす。しかしBは直線でも500m圏外である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-280", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Cは円周上、Dは円内にある一方、徒歩距離は650m・700mで500mを超える。直線によるバッファーと道路網に沿う到達圏は一致しない。」", "options": ["選択肢4", "2日目", "エネルギー資源", "区分"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Cは円周上、Dは円内にある一方、徒歩距離は650m・700mで500mを超える。直線によるバッファーと道路網に沿う到達圏は一致しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-281", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 平常時はS→B→Tの9分。B–T閉鎖後はS→A→Tの11分が最短で、増加率は(11−9)/9×100≒22％となる。」", "options": ["選択肢1", "山頂", "人口", "総流出量"], "ans": 0, "exp": "正解は「選択肢1」です。正解 平常時はS→B→Tの9分。B–T閉鎖後はS→A→Tの11分が最短で、増加率は(11−9)/9×100≒22％となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-282", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 S→B→A→Tは16分であり、S→A→Tの11分より長い。また平常時の最短9分に対する増加率とも一致しない。」", "options": ["選択肢2", "地表からの深さ（m）", "図法", "中心部"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 S→B→A→Tは16分であり、S→A→Tの11分より長い。また平常時の最短9分に対する増加率とも一致しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-283", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 16分への増加率は約78％だが、その経路は工事中の最短ではない。Sから直接Aへ向かう経路を比較に入れる必要がある。」", "options": ["選択肢3", "乾季（11〜3月）", "調査対象", "侵食"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 16分への増加率は約78％だが、その経路は工事中の最短ではない。Sから直接Aへ向かう経路を比較に入れる必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-284", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 S→A→B→Tは平常時10分だが、工事区間B–Tを使うため、工事中の経路としては利用できない。」", "options": ["選択肢4", "産地", "気候・自然環境", "地誌"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 S→A→B→Tは平常時10分だが、工事区間B–Tを使うため、工事中の経路としては利用できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-285", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 森林を少しでも含む組を森林にする方法は、指定された多数決と異なる。この方法なら中段左も森林になり、面積を過大評価する。」", "options": ["選択肢1", "方式", "A年", "寒帯（E）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 森林を少しでも含む組を森林にする方法は、指定された多数決と異なる。この方法なら中段左も森林になり、面積を過大評価する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-286", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 各行を左2セル・右2セルに分けると、森林となるのは上段左と下段左の2組。各組2haで計4ha。中段左の森林は同数時の畑優先で表現から消える。」", "options": ["選択肢2", "鉄鉱石", "2択から決められない", "プレート境界"], "ans": 0, "exp": "正解は「選択肢2」です。正解 各行を左2セル・右2セルに分けると、森林となるのは上段左と下段左の2組。各組2haで計4ha。中段左の森林は同数時の畑優先で表現から消える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-287", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 元図の森林は5haだが、多数決で集約する方法では分類別面積を保存しない。各組の中の比率まで保つ別のデータ形式が必要である。」", "options": ["選択肢3", "拠点", "地図", "食料問題"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 元図の森林は5haだが、多数決で集約する方法では分類別面積を保存しない。各組の中の比率まで保つ別のデータ形式が必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-288", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 集約後のセルは大きくなるが、同じ地表範囲を表す。セル数の減少を無視して面積の倍率だけを掛けてはならない。」", "options": ["選択肢4", "輸送機関", "データ", "人口"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 集約後のセルは大きくなるが、同じ地表範囲を表す。セル数の減少を無視して面積の倍率だけを掛けてはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-289", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「線、売場面積：面／徒歩移動を扱う施設は線で表す。」", "options": ["徒歩分析", "10年前", "堆積物", "地形図"], "ans": 0, "exp": "正解は「徒歩分析」です。線、売場面積：面／徒歩移動を扱う施設は線で表す。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-290", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「点、売場面積：線／建物の外周線の長さを面積とする。」", "options": ["徒歩分析", "後期", "1日目", "地図・GIS・地形"], "ans": 0, "exp": "正解は「徒歩分析」です。点、売場面積：線／建物の外周線の長さを面積とする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-291", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「面、売場面積：点／広い範囲の分析ほど地物を面で描く。」", "options": ["徒歩分析", "25〜39歳", "時刻帯", "B年"], "ans": 0, "exp": "正解は「徒歩分析」です。面、売場面積：点／広い範囲の分析ほど地物を面で描く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-292", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「点、売場面積：面／同じ店舗でも目的に応じて形を変える。」", "options": ["徒歩分析", "出国前の20〜39歳人口", "乾季（11〜3月）", "メッシュ"], "ans": 0, "exp": "正解は「徒歩分析」です。点、売場面積：面／同じ店舗でも目的に応じて形を変える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-293", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 徒歩で移動する経路は線に適するが、目的地となる店舗入口は点で表せる。移動の手段と施設の形状表現を混同している。」", "options": ["選択肢1", "地区", "期間", "データ"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 徒歩で移動する経路は線に適するが、目的地となる店舗入口は点で表せる。移動の手段と施設の形状表現を混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-294", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 売場の外周長と面積は異なる量で、線の長さだけでは面積を決められない。閉じた売場範囲の面データが必要である。」", "options": ["選択肢2", "バス", "原料炭", "現在の地図"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 売場の外周長と面積は異なる量で、線の長さだけでは面積を決められない。閉じた売場範囲の面データが必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-295", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 面は敷地の広がりを示せるが、売場を点にすると面積を保持できない。対象範囲が広いから面にするという規則もない。」", "options": ["選択肢3", "A（日本）", "輸送機関", "山頂"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 面は敷地の広がりを示せるが、売場を点にすると面積を保持できない。対象範囲が広いから面にするという規則もない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-296", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 徒歩アクセスでは店舗入口の位置を点として道路網につなげると扱いやすい。売場面積の測定には売場の範囲を面として表す必要がある。」", "options": ["選択肢4", "主要河川", "前期", "農場"], "ans": 0, "exp": "正解は「選択肢4」です。正解 徒歩アクセスでは店舗入口の位置を点として道路網につなげると扱いやすい。売場面積の測定には売場の範囲を面として表す必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-297", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 旧農地から新宅地へは20ha。新宅地は農地からの20haと残った宅地15haで35haとなり、旧宅地20haとの差は15haである。」", "options": ["選択肢1", "産業", "40〜64歳", "地域"], "ans": 0, "exp": "正解は「選択肢1」です。正解 旧農地から新宅地へは20ha。新宅地は農地からの20haと残った宅地15haで35haとなり、旧宅地20haとの差は15haである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-298", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 15haは宅地の純増面積で、農地から宅地への転換面積ではない。土地利用の遷移と各分類の差分を逆に扱っている。」", "options": ["選択肢2", "P 西側", "地区", "輸送機関"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 15haは宅地の純増面積で、農地から宅地への転換面積ではない。土地利用の遷移と各分類の差分を逆に扱っている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-299", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 宅地の純増15haは正しいが、旧農地から宅地になった区画は20haある。他の用途へ変わった旧宅地も含めて考える。」", "options": ["選択肢3", "河川水面と排水口の高低", "作物", "年齢層"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 宅地の純増15haは正しいが、旧農地から宅地になった区画は20haある。他の用途へ変わった旧宅地も含めて考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-300", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 旧農地から宅地へ20ha移ったが、旧宅地5haが道路へ変わっている。宅地への転入だけでは区域の純増を表せない。」", "options": ["選択肢4", "総流出量", "作物X", "海外就労者から家族への送金"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 旧農地から宅地へ20ha移ったが、旧宅地5haが道路へ変わっている。宅地への転入だけでは区域の純増を表せない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-301", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 店舗数は東80、西40で東が多いが、面積密度は東4店/km²、西8店/km²となり、西の方が高い。」", "options": ["選択肢1", "Q：日本海側", "P 西側", "A（日本）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 店舗数は東80、西40で東が多いが、面積密度は東4店/km²、西8店/km²となり、西の方が高い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-302", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人口1万人当たりは東80/2＝40店、西40/1＝40店で同じ。地区面積が小さいことから人口当たりの店舗数は決まらない。」", "options": ["選択肢2", "計画", "最大流量", "出荷先"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 人口1万人当たりは東80/2＝40店、西40/1＝40店で同じ。地区面積が小さいことから人口当たりの店舗数は決まらない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-303", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人口1万人当たりは両方40店で等しいが、面積を分母とする密度とは別の指標である。人口密度が異なれば一致しない。」", "options": ["選択肢3", "選択肢1", "放牧地", "最大流量"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 人口1万人当たりは両方40店で等しいが、面積を分母とする密度とは別の指標である。人口密度が異なれば一致しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-304", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 西の面積密度は40/5＝8店/km²で東の2倍。ただし地区内の住宅と店舗の分布や道路網が不明なので、個々の住民の徒歩アクセスまでは分からない。」", "options": ["選択肢4", "P–Q", "選択肢1", "計画"], "ans": 0, "exp": "正解は「選択肢4」です。正解 西の面積密度は40/5＝8店/km²で東の2倍。ただし地区内の住宅と店舗の分布や道路網が不明なので、個々の住民の徒歩アクセスまでは分からない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-305", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 一つの値だけのセルには元の標高の幅や位置関係は残らない。集約により失われる情報がある。」", "options": ["選択肢1", "低い平均気温", "侵食", "徒歩分析"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 一つの値だけのセルには元の標高の幅や位置関係は残らない。集約により失われる情報がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-306", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 平均は最高値180mを保存せず、最大値は平均120mを保存しない。どの統計量を残す処理かを区別する必要がある。」", "options": ["選択肢2", "地理総合，地理探究", "地理総合，歴史総合，公共", "系統地理"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 平均は最高値180mを保存せず、最大値は平均120mを保存しない。どの統計量を残す処理かを区別する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-307", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 平均化は極端な値をならし、最大値は高所を粗いセル全体へ拡大するので、両方の特徴が逆になっている。」", "options": ["選択肢3", "地誌", "熱帯（A）", "冷帯（D）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 平均化は極端な値をならし、最大値は高所を粗いセル全体へ拡大するので、両方の特徴が逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-308", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 平均化では180mの局所的高所が120mになり弱まる。最大値の180mを全20m四方に割り当てると、もとは4分の1だけだった高所を広く表す。」", "options": ["選択肢4", "熱帯（A）", "試験", "気候"], "ans": 0, "exp": "正解は「選択肢4」です。正解 平均化では180mの局所的高所が120mになり弱まる。最大値の180mを全20m四方に割り当てると、もとは4分の1だけだった高所を広く表す。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-309", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 両データは日本測地系と世界測地系で位置の基準が異なる。まず適切な座標変換を行い、その上で残る測量誤差や経年変化を検討する。」", "options": ["選択肢1", "冷帯（D）", "気候", "主要作物の栽培条件と主産地"], "ans": 0, "exp": "正解は「選択肢1」です。正解 両データは日本測地系と世界測地系で位置の基準が異なる。まず適切な座標変換を行い、その上で残る測量誤差や経年変化を検討する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-310", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 属性項目の統一は内容を対応させる処理だが、座標値の基準は変わらない。日本測地系と世界測地系の位置を比較するには座標変換が必要になる。」", "options": ["選択肢2", "共通テスト", "その他", "主な工業"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 属性項目の統一は内容を対応させる処理だが、座標値の基準は変わらない。日本測地系と世界測地系の位置を比較するには座標変換が必要になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-311", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 解像度をそろえる処理と測地系の変換は異なる。セルを同じ大きさにしても、座標の基準が違うままでは一様なずれが残る。」", "options": ["選択肢3", "地形", "エネルギー資源", "時差"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 解像度をそろえる処理と測地系の変換は異なる。セルを同じ大きさにしても、座標の基準が違うままでは一様なずれが残る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-312", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 一様なずれと異なる測地系の記録があるため、局所変形より基準の変換を先に行う。手動調整は地物間の位置関係をゆがめるおそれがある。」", "options": ["選択肢4", "大地形", "人口", "利益相反の有無"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 一様なずれと異なる測地系の記録があるため、局所変形より基準の変換を先に行う。手動調整は地物間の位置関係をゆがめるおそれがある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-313", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Xは正しいが、Aの農地面積4km²よりBの6km²の方が大きい。割合と総量は別に比較する。」", "options": ["選択肢1", "その他", "図法", "A年"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Xは正しいが、Aの農地面積4km²よりBの6km²の方が大きい。割合と総量は別に比較する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-314", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Bは農地面積6km²で最多だが、農地率は6/20＝30％。Dは農地率50％で最多なので、指標の対応が逆になっている。」", "options": ["選択肢2", "食料問題", "調査対象", "答えを見れば分かる"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Bは農地面積6km²で最多だが、農地率は6/20＝30％。Dは農地率50％で最多なので、指標の対応が逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-315", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 農地率はA40％、B30％、C20％、D50％でDが最大。一方、農地面積そのものはBの6km²が最大である。」", "options": ["選択肢3", "鉱産資源", "気候・自然環境", "候補"], "ans": 0, "exp": "正解は「選択肢3」です。正解 農地率はA40％、B30％、C20％、D50％でDが最大。一方、農地面積そのものはBの6km²が最大である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-316", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの農地率40％はDの50％より低い。面積を示す円がBで最大になる点は正しい。」", "options": ["選択肢4", "主な工業", "A年", "旧版地図"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aの農地率40％はDの50％より低い。面積を示す円がBで最大になる点は正しい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-317", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 扇端に湧水があることは地下水面が地表と交わることを示す。地下水面が最も深いとする説明は観察と逆である。」", "options": ["選択肢1", "村落", "2択から決められない", "雲底"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 扇端に湧水があることは地下水面が地表と交わることを示す。地下水面が最も深いとする説明は観察と逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-318", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 図と記録は砂礫を主体とする扇状地を示す。粘土主体の後背湿地や三角州の特徴を、扇状地全体に当てはめている。」", "options": ["選択肢2", "図法", "地図", "乾季（11〜3月）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 図と記録は砂礫を主体とする扇状地を示す。粘土主体の後背湿地や三角州の特徴を、扇状地全体に当てはめている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-319", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 扇央の砂礫層は透水性が高く、この資料でも河川水の地下浸透が示される。自然条件だけなら水田用水の確保が難しい場合がある。」", "options": ["選択肢3", "GIS", "データ", "時間帯"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 扇央の砂礫層は透水性が高く、この資料でも河川水の地下浸透が示される。自然条件だけなら水田用水の確保が難しい場合がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-320", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 砂礫層に水が浸透しやすい扇央では、表面の水利用に制約が生じることがある。排水のよい土地を利用した畑や果樹園と結び付く。」", "options": ["選択肢4", "調査方法", "堆積物", "貨物"], "ans": 0, "exp": "正解は「選択肢4」です。正解 砂礫層に水が浸透しやすい扇央では、表面の水利用に制約が生じることがある。排水のよい土地を利用した畑や果樹園と結び付く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-321", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 貯水池では特に粗い粒子が沈みやすく、下流へ通過しやすくなるという説明は逆である。供給が持ち去りを上回る場合も後退を説明しにくい。」", "options": ["選択肢1", "地図・GIS・地形", "1日目", "後期"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 貯水池では特に粗い粒子が沈みやすく、下流へ通過しやすくなるという説明は逆である。供給が持ち去りを上回る場合も後退を説明しにくい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-322", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 貯水池は砂礫などを捕捉し、細粒の一部が通過することはあるが、それを細粒の流出増加と取り違えている。総量が減る主要な説明には捕捉を用いる。」", "options": ["選択肢2", "人口・都市・生活文化", "時刻帯", "海外へ出国した20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 貯水池は砂礫などを捕捉し、細粒の一部が通過することはあるが、それを細粒の流出増加と取り違えている。総量が減る主要な説明には捕捉を用いる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-323", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 捕捉により下流への供給は減る方向になる。さらに供給が持ち去りを上回る状態は堆積・前進に結び付きやすく、後退の説明と逆である。」", "options": ["選択肢3", "A年", "乾季（11〜3月）", "作物"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 捕捉により下流への供給は減る方向になる。さらに供給が持ち去りを上回る状態は堆積・前進に結び付きやすく、後退の説明と逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-324", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 貯水池内で水の流れが遅くなると土砂が沈みやすい。河口への供給が減り、波などによる持ち去りを補えなくなると海岸線は後退し得る。」", "options": ["選択肢4", "用語があいまい", "期間", "産業"], "ans": 0, "exp": "正解は「選択肢4」です。正解 貯水池内で水の流れが遅くなると土砂が沈みやすい。河口への供給が減り、波などによる持ち去りを補えなくなると海岸線は後退し得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-325", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは自然堤防で砂質の比較的水はけのよい微高地となり、集落や畑に利用されやすい。Bは後背湿地で細かな泥が堆積し、水田利用と結び付く。」", "options": ["選択肢1", "時間が足りない", "原料炭", "指標"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Aは自然堤防で砂質の比較的水はけのよい微高地となり、集落や畑に利用されやすい。Bは後背湿地で細かな泥が堆積し、水田利用と結び付く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-326", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 図は河川の氾濫堆積による横断面で、火山灰の台地や谷口の扇状地を示していない。地形の形成過程から土壌・利用を考える。」", "options": ["選択肢2", "斜面", "輸送機関", "観光地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 図は河川の氾濫堆積による横断面で、火山灰の台地や谷口の扇状地を示していない。地形の形成過程から土壌・利用を考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-327", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは川の近くに比較的粗い粒子が先にたまる微高地で、Bは細かな泥がたまりやすい低地である。粒径と土地利用の組合せが逆になっている。」", "options": ["選択肢3", "Pからの水平距離", "前期", "P–Q"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Aは川の近くに比較的粗い粒子が先にたまる微高地で、Bは細かな泥がたまりやすい低地である。粒径と土地利用の組合せが逆になっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-328", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの位置は山地の谷口ではなく氾濫原の川沿いであり、扇状地の礫主体の特徴とは異なる。Bにも海の作用の証拠は示されていない。」", "options": ["選択肢4", "データ", "40〜64歳", "地理総合，歴史総合，公共"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aの位置は山地の谷口ではなく氾濫原の川沿いであり、扇状地の礫主体の特徴とは異なる。Bにも海の作用の証拠は示されていない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-329", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Iの判断は正しいが、IIを覆うTがあるため、IIの離水はT降下より前である。火山灰が載る条件を確認する。」", "options": ["選択肢1", "礫・砂・泥の割合", "地区", "温帯（C）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Iの判断は正しいが、IIを覆うTがあるため、IIの離水はT降下より前である。火山灰が載る条件を確認する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-330", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も
