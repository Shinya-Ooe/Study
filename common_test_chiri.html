q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 開発・開業の時期は商業形成の歴史には役立つが、CとDでは駅距離が違う。現在の橋や歩道による到達経路の差も直接示さない。」", "options": ["選択肢2", "産業", "40〜64歳", "地域"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 開発・開業の時期は商業形成の歴史には役立つが、CとDでは駅距離が違う。現在の橋や歩道による到達経路の差も直接示さない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1376", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 A・Bは直線距離が同じだが店舗数が違う。河川を渡る橋や歩道の接続を見ることで、実際の歩行距離という仮説を検討できる。」", "options": ["選択肢3", "P 西側", "地区", "輸送機関"], "ans": 0, "exp": "正解は「選択肢3」です。正解 A・Bは直線距離が同じだが店舗数が違う。河川を渡る橋や歩道の接続を見ることで、実際の歩行距離という仮説を検討できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1377", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 住宅地価と中心地からの距離は商業立地に関係し得るが、AとDでは駅距離も異なる。同距離の歩行経路差という仮説の直接検証にはA・Bと道路網が適する。」", "options": ["選択肢4", "河川水面と排水口の高低", "作物", "年齢層"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 住宅地価と中心地からの距離は商業立地に関係し得るが、AとDでは駅距離も異なる。同距離の歩行経路差という仮説の直接検証にはA・Bと道路網が適する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1378", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 1,800は施設入場の延べ合計で、両施設の500人を二度含む。地域としての実人数では一度だけ数える。」", "options": ["選択肢1", "総流出量", "作物X", "海外就労者から家族への送金"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 1,800は施設入場の延べ合計で、両施設の500人を二度含む。地域としての実人数では一度だけ数える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1379", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 1,000＋800−500＝1,300人である。複数地点を巡る行動があるため、施設利用の延べ人数と地域来訪の実人数は違う。」", "options": ["選択肢2", "Q：日本海側", "P 西側", "A（日本）"], "ans": 0, "exp": "正解は「選択肢2」です。正解 1,000＋800−500＝1,300人である。複数地点を巡る行動があるため、施設利用の延べ人数と地域来訪の実人数は違う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1380", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 共通の500人を二度引くと、その人たちを一人も数えないことになる。和集合は重複分を一度だけ引く。」", "options": ["選択肢3", "計画", "最大流量", "出荷先"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 共通の500人を二度引くと、その人たちを一人も数えないことになる。和集合は重複分を一度だけ引く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1381", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 合計1,800人には共通の500人が二度含まれ、一回分の500人を引く。訪問施設数で重複人数を半分にすると、250人分の二重計上が残る。」", "options": ["選択肢4", "選択肢1", "放牧地", "最大流量"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 合計1,800人には共通の500人が二度含まれ、一回分の500人を引く。訪問施設数で重複人数を半分にすると、250人分の二重計上が残る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1382", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 指数の分子・分母が逆で、家具・家電を最寄品とする分類も違う。徒歩圏だけを調べると、幹線道路を使う市外からの来店を捉えられない。」", "options": ["選択肢1", "P–Q", "選択肢2", "計画"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 指数の分子・分母が逆で、家具・家電を最寄品とする分類も違う。徒歩圏だけを調べると、幹線道路を使う市外からの来店を捉えられない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1383", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 品目と調査範囲は合うが、県と市の販売額の比が逆である。指定された指数は市60万円÷県50万円＝1.2となる。」", "options": ["選択肢2", "低い平均気温", "侵食", "徒歩分析"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 品目と調査範囲は合うが、県と市の販売額の比が逆である。指定された指数は市60万円÷県50万円＝1.2となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1384", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 市の1人当たり販売額は120億円÷2万人＝60万円で、指数は60÷50＝1.2。家具・家電は比較して購入する買回品で、幹線道路沿いの店では広い範囲からの来店を調べるこ     svg: `<svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg">

      <text x="269" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">市場指向型</text>
      <text x="269" y="52" text-anchor="middle" font-size="11" fill="#334155">ビール・新聞・食品</text>
      <rect x="8" y="74" width="166" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="91" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">労働力指向型</text>

      <rect x="186" y="74" width="166" height="56" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
      <text x="269" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b21a8">交通(臨空)・集積型</text>
      <text x="269" y="116" text-anchor="middle" font-size="11" fill="#334155">半導体・IC・先端技術</text>

  },
  pyramid: {
    title: "人口ピラミッドの3類型（人口転換）",
    cap: "富士山型(多産多死・途上国) → 釣鐘型(静止) → つぼ型(少子高齢化・先進国)。",
    svg: `<svg viewBox="0 0 360 130" xmlns="http://www.w3.org/2000/svg">
      <polygon points="60,20 20,100 100,100" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
      <text x="60" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">富士山型(多産)</text>
      <path d="M150,100 L150,55 Q180,15 210,55 L210,100 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
      <text x="180" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">釣鐘型(安定)</text>
      <path d="M282,100 L268,55 Q300,18 332,55 L318,100 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
      <text x="300" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">つぼ型(少子高齢)</text>

  }
};

const ADVICES = [
  "【優先順位のコツ】最優先は「地形」と「気候」です。大地形と資源、気候と農業・植生を理由でつなげると、丸暗記の量が劇的に減ります。",
  "【図解とセットで定着】サムネイルをタップして図表を確認しながら、「用語・分布（どこ）・理由（なぜ）」の3点セットで記憶しましょう。",
  "【統計の覚え方】統計は細かい数字ではなく「上位国と、なぜその国が上位なのかの理由」を最新のデータ基準で押さえるのが得点安定の近道です。"
];

const APP_ID = "common_test_chiri.html";
const STORAGE_KEY = "ct_chiri_complete_v2";
let prog = loadProg();
let curList = [];
let idx = 0;
let score = 0;
let wrongList = [];
let isReviewSession = false;
let listening = false;
let listenTimer = null;

function loadProg() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return { items: p.items || {}, solved: p.solved || 0 };
    }
  } catch (e) {}
  return { items: {}, solved: 0 };
}
function saveProg() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prog)); } catch (e) {} }
function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "v-home") refreshHome();
}
function refreshHome() {
  document.getElementById("s-tot").textContent = BANK.length;
  let lrn = 0, rev = 0;
  BANK.forEach(q => {
    const p = prog.items[q.id];
    if (p && p.n > 0) { lrn++; if (p.ng || (p.ok / p.n) < 0.7) rev++; }
  });
  document.getElementById("s-lrn").textContent = lrn;
  document.getElementById("s-rev").textContent = rev;
  document.getElementById("rev-n").textContent = rev;
  document.getElementById("b-rev").style.display = rev > 0 ? "flex" : "none";
}
function forgettingScore(q, now) {
  const p = prog.items[q.id];
  if (!p || !p.n) return 0;
  const elapsedDays = Math.max(0, (now - (p.t || 0)) / 86400000);
  return (p.ng ? 500 : 0) + (1 - (p.ok / p.n)) * 250 + Math.min(elapsedDays * 40, 200) + Math.random() * 20;
}
function startQuiz(mode) {
  const cat = document.getElementById("f-cat").value;
  const pri = document.getElementById("f-pri").value;
  let pool = BANK.filter(q => (cat === "ALL" || q.cat === cat) && (pri === "ALL" || q.priority === pri));
  isReviewSession = (mode === "REVIEW");

  if (isReviewSession) {
    pool = pool.filter(q => { const p = prog.items[q.id]; return p && (p.ng || (p.ok / p.n) < 0.7); });
    if (!pool.length) { alert("復習が必要な問題はありません！"); return; }
    const now = Date.now();
    curList = [...pool].sort((a, b) => forgettingScore(b, now) - forgettingScore(a, now)).slice(0, 10);
  } else {
    if (!pool.length) { alert("該当する問題がありません。条件を変更してください。"); return; }
    const now = Date.now();
    const unseen = pool.filter(q => !prog.items[q.id] || prog.items[q.id].n === 0).sort(() => Math.random() - 0.5);
    const seen = pool.filter(q => prog.items[q.id] && prog.items[q.id].n > 0).sort((a, b) => forgettingScore(b, now) - forgettingScore(a, now));
    const targetRev = seen.length > 0 ? Math.min(2, seen.length) : 0;
    let combined = [...unseen.slice(0, 10 - targetRev), ...seen.slice(0, targetRev)];
    if (combined.length < Math.min(10, pool.length)) {
      const used = new Set(combined.map(q => q.id));
      for (const q of seen) {
        if (!used.has(q.id)) { combined.push(q); used.add(q.id); }
        if (combined.length >= Math.min(10, pool.length)) break;
      }
    }
    curList = combined.sort(() => Math.random() - 0.5);
  }
  idx = 0; score = 0; wrongList = [];
  showView("v-quiz");
  renderQ();
}
function highlightQuestionText(text) {
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return escaped
    .replace(/(［\s*[^］]+\s*］)/g, '<span class="q-hl">$1</span>')
    .replace(/「([^」]+)」/g, '<span class="q-hl">「$1」</span>');
}
function renderThumb(q, barId, prevId) {
  const bar = document.getElementById(barId);
  const prev = document.getElementById(prevId);
  if (q.figId && FIGURES[q.figId]) {
    prev.innerHTML = FIGURES[q.figId].svg;
    bar.classList.add("active");
    return true;
  }
  if (q.imgUrl) {
    prev.innerHTML = `<img src="${q.imgUrl}" alt="図表" onerror="this.closest('.thumb-bar').classList.remove('active')">`;
    bar.classList.add("active");
    return true;
  }
  bar.classList.remove("active");
  prev.innerHTML = "";
  return false;
}
function openCurrentFigure() {
  const q = curList[idx];
  if (!q) return;
  if (q.figId && FIGURES[q.figId]) {
    openFigureById(q.figId);
  } else if (q.imgUrl) {
    document.getElementById("zoom-title").textContent = "参考図表（拡大）";
    document.getElementById("zoom-body").innerHTML = `<img src="${q.imgUrl}" alt="拡大図表">`;
    document.getElementById("zoom-cap").textContent = q.exp || "";
    document.getElementById("m-zoom").classList.add("active");
  }
}
function openFigureById(figId) {
  const f = FIGURES[figId];
  if (!f) return;
  document.getElementById("zoom-title").textContent = f.title;
  document.getElementById("zoom-body").innerHTML = f.svg;
  document.getElementById("zoom-cap").textContent = f.cap;
  document.getElementById("m-zoom").classList.add("active");
}
function closeZoom() {
  document.getElementById("m-zoom").classList.remove("active");
}
function renderQ() {
  document.getElementById("sheet").classList.remove("active");
  const q = curList[idx];
  document.getElementById("p-fill").style.width = `${(idx / curList.length) * 100}%`;
  document.getElementById("q-cat").textContent = q.catName;
  const priEl = document.getElementById("q-pri");
  priEl.textContent = q.priority === "S" ? "★ 最重要" : "● 重要";
  priEl.className = q.priority === "S" ? "badge s" : "badge";
  document.getElementById("q-num").textContent = `${idx + 1} / ${curList.length}`;
  document.getElementById("q-id").textContent = `問題ID: ${q.id}`;
  document.getElementById("q-txt").innerHTML = highlightQuestionText(q.q);
  renderThumb(q, "q-thumb", "q-thumb-preview");

  const optsEl = document.getElementById("opts");
  optsEl.innerHTML = "";
  const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
  const labels = ["ア", "イ", "ウ", "エ"];
  order.forEach((optIdx, pos) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.dataset.optIdx = String(optIdx);
    btn.textContent = `${labels[pos]}. ${q.options[optIdx]}`;
    btn.onclick = () => checkAnswer(optIdx, btn);
    optsEl.appendChild(btn);
  });
}
function checkAnswer(selectedIdx, btn) {
  document.querySelectorAll(".opt-btn").forEach(b => b.disabled = true);
  const q = curList[idx];
  const isOk = selectedIdx === q.ans;
  const p = prog.items[q.id] || { n: 0, ok: 0, ng: false, t: 0 };
  p.n += 1; p.t = Date.now();
  if (isOk) { score += 1; p.ok += 1; p.ng = false; btn.classList.add("ok"); }
  else {
    p.ng = true; wrongList.push(q); btn.classList.add("ng");
    document.querySelectorAll(".opt-btn").forEach(b => { if (Number(b.dataset.optIdx) === q.ans) b.classList.add("ok"); });
  }
  prog.items[q.id] = p;
  prog.solved = (prog.solved || 0) + 1;
  saveProg();

  const head = document.getElementById("sh-head");
  head.textContent = isOk ? "⭕ 正解！" : "❌ 不正解";
  head.style.color = isOk ? "var(--ok)" : "var(--ng)";
  document.getElementById("sh-ans").textContent = `正解：${q.options[q.ans]}`;
  document.getElementById("sh-exp").textContent = q.exp;
  renderThumb(q, "sh-thumb", "sh-thumb-preview");

  const refEl = document.getElementById("sh-ref");
  refEl.href = q.refUrl || "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/";
  refEl.textContent = `📖 ${q.refLabel || "解説記事を見る"} ↗`;

  document.getElementById("sheet").classList.add("active");
  speak(isOk ? `正解です。${q.options[q.ans]}` : `不正解です。正解は、${q.options[q.ans]}`);

  if (prog.solved > 0 && prog.solved % 30 === 0) {
    setTimeout(() => {
      document.getElementById("adv-txt").textContent = ADVICES[(Math.floor(prog.solved / 30) - 1) % ADVICES.length];
      document.getElementById("m-adv").classList.add("active");
    }, 550);
  }
}
function nextQ() {
  idx += 1;
  if (idx < curList.length) renderQ();
  else {
    document.getElementById("p-fill").style.width = "100%";
    document.getElementById("r-sc").textContent = `${score} / ${curList.length} 問正解`;
    const allClear = wrongList.length === 0;
    document.getElementById("r-msg").textContent = allClear
      ? "全問正解達成！次の10問へ進めます。"
      : (isReviewSession ? "復習モードでは間違えた問題を全問正解すると次へ進めます。" : "間違えた問題を復習して、確実に定着させましょう。");
    document.getElementById("r-rev").style.display = allClear ? "none" : "flex";
    document.getElementById("m-res").classList.add("active");
  }
}
function closeRes(action) {
  document.getElementById("m-res").classList.remove("active");
  if (action === "REV") { curList = [...wrongList]; idx = 0; score = 0; wrongList = []; isReviewSession = true; showView("v-quiz"); renderQ(); }
  else if (action === "NEXT") {
    if (isReviewSession && wrongList.length > 0) {
      alert("復習モードでは間違えた問題をすべて正解すると通常モードの次へ進めます。");
      document.getElementById("m-res").classList.add("active");
      return;
    }
    startQuiz("NORMAL");
  } else showView("v-home");
}
function openSummary() {
  const grid = document.getElementById("sum-grid");
  grid.innerHTML = "";
  Object.keys(FIGURES).forEach(k => {
    const f = FIGURES[k];
    const div = document.createElement("div");
    div.className = "thumb-tile";
    div.innerHTML = `<div style="height:64px;display:flex;align-items:center;justify-content:center;overflow:hidden;">${f.svg}</div><span>🔍 ${f.title}</span>`;
    div.onclick = () => openFigureById(k);
    grid.appendChild(div);
  });
  document.getElementById("m-sum").classList.add("active");
}
function openStats() {
  const cats = [
    ["TOPO", "① 地形"], ["CLIM", "② 気候"], ["AGRI", "③ 農業・食料"],
    ["IND", "④ 資源・工業"], ["POP", "⑤ 人口・都市・地誌"], ["SOGO", "⑥ 地理総合・覚え方"]
  ];
  let lines = [`累計解答数：<b>${prog.solved || 0}</b> 回<br><br>`];
  cats.forEach(([code, name]) => {
    const sub = BANK.filter(q => q.cat === code);
    const done = sub.filter(q => prog.items[q.id] && prog.items[q.id].n > 0).length;
    lines.push(`${name}：${done} / ${sub.length} 問学習済<br>`);
  });
  document.getElementById("st-body").innerHTML = lines.join("");
  document.getElementById("m-st").classList.add("active");
}
function resetProg() {
  if (confirm("これまでの学習進捗をすべて削除しますか？")) {
    prog = { items: {}, solved: 0 }; saveProg(); refreshHome();
    document.getElementById("m-st").classList.remove("active");
  }
}
function exportProg() {
  const now = new Date();
  const stamp = now.getFullYear().toString() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") + "_" +
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0");
  const defaultName = `しんや_${APP_ID}_${stamp}`;
  const customName = prompt("進捗データの保存名を入力してください：", defaultName);
  if (!customName) return;
  const payload = JSON.stringify({ appId: APP_ID, exportName: customName.trim(), exportedAt: now.toISOString(), prog: prog });
  navigator.clipboard?.writeText(payload)
    .then(() => alert(`「${customName.trim()}」の進捗コードをコピーしました。`))
    .catch(() => prompt("以下の進捗コードをコピーしてください：", payload));
}
function importProg() {
  const txt = prompt("エクスポートした進捗コードを貼り付けてください：");
  if (!txt) return;
  try {
    const parsed = JSON.parse(txt.trim());
    if (!parsed || parsed.appId !== APP_ID) {
      alert(`この問題集（${APP_ID}）からエクスポートされたデータではないため取り込めません。`);
      return;
    }
    if (parsed.prog && typeof parsed.prog.items === "object") {
      prog = { items: parsed.prog.items, solved: parsed.prog.solved || 0 }; saveProg(); refreshHome();
      alert(`「${parsed.exportName || "進捗データ"}」を読み込みました。`);
    }
  } catch (e) { alert("読み込みに失敗しました。"); }
}
function speak(text, onDone) {
  if (!("speechSynthesis" in window)) { if (onDone) onDone(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text.replace(/［[^］]+］/g, "くうらん"));
  utter.lang = "ja-JP"; utter.rate = 1.05;
  if (onDone) utter.onend = onDone;
  window.speechSynthesis.speak(utter);
}
function startListen() {
  listening = true; showView("v-listen");
  const wrongPool = BANK.filter(q => prog.items[q.id] && prog.items[q.id].ng);
  const pool = wrongPool.length > 0 ? wrongPool : [...BANK];
  let i = 0;
  const step = () => {
    if (!listening) return;
    const q = pool[i % pool.length];
    document.getElementById("l-badge").textContent = `問題（${q.catName}）`;
    document.getElementById("l-main").textContent = q.q;
    speak(`問題。${q.q}`, () => {
      if (!listening) return;
      listenTimer = setTimeout(() => {
        if (!listening) return;
        const ans = q.options[q.ans];
        document.getElementById("l-badge").textContent = "解答と解説";
        document.getElementById("l-main").textContent = `【正解】${ans}\n\n${q.exp}`;
        speak(`正解は、${ans}。${q.exp}`, () => {
          if (!listening) return;
          i += 1; listenTimer = setTimeout(step, 2000);
        });
      }, 1500);
    });
  };
  step();
}
function stopListen() {
  listening = false;
  if (listenTimer) clearTimeout(listenTimer);
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  showView("v-home");
}
refreshHome();
</script>
