する地理の用語・事項として最も適切なものはどれか。\n「二つの人工林地区について、今後10年間の木材供給を考える。年末蓄積の増減と、供給継続の評価の組合せとして適切なものを選べ。立木材積の増減は成長と伐採だけで決まる。」", "options": ["森林の蓄積と年齢構成", "低緯度の風と島の斜面", "縮尺・目的と点線面データ", "鉱産資源と工業（ウェーバーの工業立地論）"], "ans": 0, "exp": "二つの人工林地区について、今後10年間の木材供給を考える。年末蓄積の増減と、供給継続の評価の組合せとして適切なものを選べ。立木材積の増減は成長と伐採だけで決まる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-142", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ペルー沖を想定した観測値を示す。平常期から変化期への移行を、エルニーニョ現象と沿岸の生産力の関係から説明したものを選べ。」", "options": ["東部太平洋沿岸の変化", "海陸風と日変化", "階級区分図と比例記号図", "統計は単位・年次・分母"], "ans": 0, "exp": "ペルー沖を想定した観測値を示す。平常期から変化期への移行を、エルニーニョ現象と沿岸の生産力の関係から説明したものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-143", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ湾内のP・Qで養殖が行われている。Qで有機物の堆積が増えやすい理由として、資料と養殖方式の違いに合うものを選べ。」", "options": ["養殖方式と湾の環境", "ヨーロッパ西岸の冬の温和さ", "蛇行河川の侵食と流路変化", "合計特殊出生率が下がっても人口が増える理由"], "ans": 0, "exp": "同じ湾内のP・Qで養殖が行われている。Qで有機物の堆積が増えやすい理由として、資料と養殖方式の違いに合うものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-144", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ魚種について、1隻1日当たり漁獲量を比べる。後期には魚群探知機の性能が向上した。表に合い、資源評価として妥当な説明を選べ。」", "options": ["漁獲統計と資源評価", "低緯度高地と中緯度沿岸", "岩石の性質と地表・地下の排水", "地理総合・地理探究の出題範囲と過去問を確認する"], "ans": 0, "exp": "同じ魚種について、1隻1日当たり漁獲量を比べる。後期には魚群探知機の性能が向上した。表に合い、資源評価として妥当な説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-145", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「東アジアの養殖業者が、魚粉の供給地域P・Qの海洋環境を調べた。両地域の漁場の背景と、東部太平洋でエルニーニョに伴う変化が進んだ場合の説明として適切なものを選べ。」", "options": ["魚粉の供給地域と海洋環境", "盆地の明け方の鉛直気温", "山脈・地溝とプレート境界", "日付変更線と標準時"], "ans": 0, "exp": "東アジアの養殖業者が、魚粉の供給地域P・Qの海洋環境を調べた。両地域の漁場の背景と、東部太平洋でエルニーニョに伴う変化が進んだ場合の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-146", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「P・Qの一次エネルギー供給を比較する。表以外のエネルギーは利用せず、輸出・在庫変動はない。自給率の比較とエネルギー構成の説明がともに適切なものを選べ。」", "options": ["エネルギー源の構成と自給", "同じ降水量でも異なる乾燥の程度", "河川沿いの堆積物と土地利用", "正距方位図法と大圏航路"], "ans": 0, "exp": "P・Qの一次エネルギー供給を比較する。表以外のエネルギーは利用せず、輸出・在庫変動はない。自給率の比較とエネルギー構成の説明がともに適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-147", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある島国では発電の大部分を水力・地熱が占める一方、船舶や航空機には輸入石油を使っている。表の読み取りとして適切なものを選べ。」", "options": ["電源構成とエネルギー全体", "葉の特徴と季節的乾燥", "年降水量が同じ二つの季節配分", "河床縦断と勾配の変化"], "ans": 0, "exp": "ある島国では発電の大部分を水力・地熱が占める一方、船舶や航空機には輸入石油を使っている。表の読み取りとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-148", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ペルシア湾からX、アラビア海・インド洋、Y、南シナ海、日本の順に航路がつながる。」", "options": ["原油輸送の海峡", "森林の土壌断面と物質移動", "大陸内部の気温と水分条件", "土地利用の遷移と都市化"], "ans": 0, "exp": "ペルシア湾からX、アラビア海・インド洋、Y、南シナ海、日本の順に航路がつながる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-149", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「資料のP・Qは天然ガス輸送の方式を表す。方式の対応と立地条件の説明として適切なものを選べ。」", "options": ["天然ガスの輸送体系", "月別の土壌水分を追う", "冷帯と寒帯を分ける夏の気温", "氾濫原の微地形と堆積物"], "ans": 0, "exp": "資料のP・Qは天然ガス輸送の方式を表す。方式の対応と立地条件の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-150", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北海道北部の風況がよい地域を想定して風力発電を増やす。資料の時間帯に、他地域へ送れる電力の上限を増やさず設備だけを追加した場合の説明として適切なものを選べ。蓄電・他電源との調整は考えない。」", "options": ["風力資源と消費地の位置", "地域の雨の成因を比べる", "日本の冬の降水の地域差", "岩石の性質と地表・地下の排水"], "ans": 0, "exp": "北海道北部の風況がよい地域を想定して風力発電を増やす。資料の時間帯に、他地域へ送れる電力の上限を増やさず設備だけを追加した場合の説明として適切なものを選べ。蓄電・他電源との調整は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-151", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「太陽光以外で賄う電力を「需要−太陽光発電」とする。表の昼から夕方への変化量と、それに対応する方法の組合せとして適切なものを選べ。」", "options": ["太陽光発電と夕方の需給", "穀物農場の生産性", "南アジアの降水の東西差", "火山列の年代とプレート移動速度"], "ans": 0, "exp": "太陽光以外で賄う電力を「需要−太陽光発電」とする。表の昼から夕方への変化量と、それに対応する方法の組合せとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-152", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「貯水池を持たない二地点P・Qで水力発電を比べる。出力は流量×有効落差に比例し、効率は同じ、雨季・乾季は同じ長さである。年間発電量の比較と地理的な解釈を選べ。」", "options": ["水力発電と季節流量", "農地面積と延べ作付面積", "海上の霧と露点", "年較差と大陸性"], "ans": 0, "exp": "貯水池を持たない二地点P・Qで水力発電を比べる。出力は流量×有効落差に比例し、効率は同じ、雨季・乾季は同じ長さである。年間発電量の比較と地理的な解釈を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-153", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「アイスランドと日本は、プレート境界の型は異なるが地熱の利用が見られる。両国の地下熱源と立地上の共通点を説明したものを選べ。」", "options": ["地下資源とプレート境界", "施設園芸の費用と立地", "盆地の明け方の鉛直気温", "乾燥限界と植生の変化"], "ans": 0, "exp": "アイスランドと日本は、プレート境界の型は異なるが地熱の利用が見られる。両国の地下熱源と立地上の共通点を説明したものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-154", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「南米の銅鉱山と東アジアの臨海製錬所を例に、工程を分担する理由を考える。資料の立地に合う説明を選べ。」", "options": ["鉱石処理と輸送の分業", "熱帯林地域の土地利用", "高緯度の森林の境界", "低緯度高地の気候を分解する"], "ans": 0, "exp": "南米の銅鉱山と東アジアの臨海製錬所を例に、工程を分担する理由を考える。資料の立地に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-155", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「原料産地Rと市場Mは100km離れる。X工場は原料2tから製品1t、Y工場は原料0.2tに現地で得る水を加えて製品1tを作る。原料・製品の運賃は同じトンキロ当たり料金、水は両地点で同費用で得られる。輸送費だけで有利な立地を選べ。」", "options": ["原料と製品の重量変化", "食料自給率の二つの指標", "気候が同じでも違う土壌", "南アジアの降水の東西差"], "ans": 0, "exp": "原料産地Rと市場Mは100km離れる。X工場は原料2tから製品1t、Y工場は原料0.2tに現地で得る水を加えて製品1tを作る。原料・製品の運賃は同じトンキロ当たり料金、水は両地点で同費用で得られる。輸送費だけで有利な立地を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-156", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表の地域P・Qのような分業が成り立つアルミニウム産業について、Qにおける地金製造の立地を説明したものを選べ。P・Qは工程を考えるための地域モデルである。」", "options": ["原料産地と金属生産地", "養殖方式と湾の環境", "地域の雨の成因を比べる", "低緯度高地と中緯度沿岸"], "ans": 0, "exp": "表の地域P・Qのような分業が成り立つアルミニウム産業について、Qにおける地金製造の立地を説明したものを選べ。P・Qは工程を考えるための地域モデルである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-157", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「日本の高炉製鉄所の臨海立地を考える。資料の前期から後期への変化に対応する説明を選べ。」", "options": ["製鉄所の立地条件の変化", "エネルギー源の構成と自給", "地中海沿岸の作物と水利用", "地域の自然植生"], "ans": 0, "exp": "日本の高炉製鉄所の臨海立地を考える。資料の前期から後期への変化に対応する説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-158", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A・B・Cに新設する工場を、半導体前工程、衣服の縫製、セメントの焼成から一つずつ選ぶ。各産業の特徴と資料の適合度が高い組合せはどれか。」", "options": ["つの工場用地", "天然ガスの輸送体系", "商品作物への依存と交易", "高緯度の地温と水の動き"], "ans": 0, "exp": "A・B・Cに新設する工場を、半導体前工程、衣服の縫製、セメントの焼成から一つずつ選ぶ。各産業の特徴と資料の適合度が高い組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-159", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同一品質の商品を同じ市場に納入する。表以外の費用が等しいとき、最も費用が低い拠点とその説明を選べ。1人が1時間に作る数量は、全労働投入を含めた平均である。」", "options": ["海外生産の費用比較", "水力発電と季節流量", "食料自給率の二つの指標", "穀物農場の生産性"], "ans": 0, "exp": "同一品質の商品を同じ市場に納入する。表以外の費用が等しいとき、最も費用が低い拠点とその説明を選べ。1人が1時間に作る数量は、全労働投入を含めた平均である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-160", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「自動車産業の集積地域について、立地の利点を説明するものを選べ。資料では同じ部品の大量生産と、異なる企業間の分業を区別する。」", "options": ["企業の集積と分業", "原料と製品の重量変化", "魚粉の供給地域と海洋環境", "商品作物への依存と交易"], "ans": 0, "exp": "自動車産業の集積地域について、立地の利点を説明するものを選べ。資料では同じ部品の大量生産と、異なる企業間の分業を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-161", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「部品供給を2社へ分散したが、両社とも港Pから出荷している。目標を「港Pの長期閉鎖でも、少なくとも一方からの部品供給を続けること」としたとき、直接この目標を満たす再編案を選べ。他の港・工場は平常通り稼働する。」", "options": ["供給網の分散と輸送拠点", "つの工場用地", "風力資源と消費地の位置", "東部太平洋沿岸の変化"], "ans": 0, "exp": "部品供給を2社へ分散したが、両社とも港Pから出荷している。目標を「港Pの長期閉鎖でも、少なくとも一方からの部品供給を続けること」としたとき、直接この目標を満たす再編案を選べ。他の港・工場は平常通り稼働する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-162", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「工場跡地Pと内陸用地Qに物流施設を設ける。各用地の施設と交通条件を生かす主な機能として、適切な組合せを選べ。必要な土地利用手続は済んでいる。」", "options": ["都市圏の工場跡地", "供給網の分散と輸送拠点", "原料と製品の重量変化", "天然ガスの輸送体系"], "ans": 0, "exp": "工場跡地Pと内陸用地Qに物流施設を設ける。各用地の施設と交通条件を生かす主な機能として、適切な組合せを選べ。必要な土地利用手続は済んでいる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-163", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある陶磁器産地では原料の一部を輸入するようになった後も、生産が続いている。地域の資料から説明できる継続要因を選べ。」", "options": ["陶磁器産地の継続", "集荷と配送の拠点配置", "企業の集積と分業", "原料産地と金属生産地"], "ans": 0, "exp": "ある陶磁器産地では原料の一部を輸入するようになった後も、生産が続いている。地域の資料から説明できる継続要因を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-164", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「データセンターの仕事Xは大量の画像を夜間にまとめて処理し、翌日納品する。仕事Yは大都市の利用者へ即時に応答する。電力・通信の信頼性は同じとすると、表の立地を使い分ける説明として適切なものを選べ。」", "options": ["情報処理施設の立地", "輸送量の指標と距離", "貨物輸送の規格化", "陶磁器産地の継続"], "ans": 0, "exp": "データセンターの仕事Xは大量の画像を夜間にまとめて処理し、翌日納品する。仕事Yは大都市の利用者へ即時に応答する。電力・通信の信頼性は同じとすると、表の立地を使い分ける説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-165", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「コンテナ輸送の発達が港湾と内陸を結ぶ物流に与えた変化として、適切なものを選べ。」", "options": ["貨物輸送の規格化", "生産移転と排出統計", "地域人口の増減要因", "人口密度の分母"], "ans": 0, "exp": "コンテナ輸送の発達が港湾と内陸を結ぶ物流に与えた変化として、適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-166", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ大陸間航路で貨物P・Q・Rを運ぶ。重量・価値・納期の違いを考え、主に選ばれやすい輸送手段の組合せを選べ。料金は重量当たりで航空が海運より高いとする。」", "options": ["貨物の価値と輸送手段", "出生率・死亡率と人口構造", "つの出生指標", "年齢集団の追跡"], "ans": 0, "exp": "同じ大陸間航路で貨物P・Q・Rを運ぶ。重量・価値・納期の違いを考え、主に選ばれやすい輸送手段の組合せを選べ。料金は重量当たりで航空が海運より高いとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-167", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある国の貨物輸送について、表のトンとトンキロから平均輸送距離を求め、輸送機関の特徴に合う説明を選べ。」", "options": ["輸送量の指標と距離", "年齢構成と扶養負担", "年齢・男女別の人口", "国際移動と地域経済"], "ans": 0, "exp": "ある国の貨物輸送について、表のトンとトンキロから平均輸送距離を求め、輸送機関の特徴に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-168", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「日本の春に、南半球のチリ産の生鮮ブドウを販売する例を考える。通常の露地栽培の季節と、生鮮品の遠隔地輸送を結び付けた説明として適切なものを選べ。長期貯蔵による季節調整は除く。」", "options": ["果実輸入と季節差", "つの時期の人口動態", "移住を生む条件", "都市を数える範囲"], "ans": 0, "exp": "日本の春に、南半球のチリ産の生鮮ブドウを販売する例を考える。通常の露地栽培の季節と、生鮮品の遠隔地輸送を結び付けた説明として適切なものを選べ。長期貯蔵による季節調整は除く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-169", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「銅に依存するP国と、銅以外の輸出も大きいQ国を比較する。銅の数量は両国とも10％減り、単価は20％上昇した。その他の輸出額は不変だった。適切な説明を選べ。」", "options": ["輸出額の変化と産業構造", "年齢・男女別の人口", "都市と農村の人口変化", "生活拠点の再配置"], "ans": 0, "exp": "銅に依存するP国と、銅以外の輸出も大きいQ国を比較する。銅の数量は両国とも10％減り、単価は20％上昇した。その他の輸出額は不変だった。適切な説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-170", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「資料の電子機器生産について、産業構造と貿易の読み取りとして適切なものを選べ。」", "options": ["工程分業と地域間の結び付き", "都市圏内部の住所移動", "地区機能を指標から読む", "集落形態と生産の場"], "ans": 0, "exp": "資料の電子機器生産について、産業構造と貿易の読み取りとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-171", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A国が素材40をB国へ輸出し、B国は加工して部品70をC国へ輸出した。C国は完成品100をA国へ輸出した。各工程で他の中間投入はない。3国の国内付加価値の合計と、国境を越えた輸出額の合計を選べ。」", "options": ["加工貿易と付加価値", "国際移動と地域経済", "生活拠点の再配置", "文化が広がる経路"], "ans": 0, "exp": "A国が素材40をB国へ輸出し、B国は加工して部品70をC国へ輸出した。C国は完成品100をA国へ輸出した。各工程で他の中間投入はない。3国の国内付加価値の合計と、国境を越えた輸出額の合計を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-172", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「シンガポールのような中継機能を持つ港Pを想定した。外国港から来て別の外国港へ積み替える貨物が増えたとき、表に合う説明を選べ。」", "options": ["中継港と地域経済", "都市人口の伸び方", "地代と土地利用", "中国東部の農業地域比較"], "ans": 0, "exp": "シンガポールのような中継機能を持つ港Pを想定した。外国港から来て別の外国港へ積み替える貨物が増えたとき、表に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-173", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「P国の消費する商品をP・Qの二国で生産する。後期にP国の工場の一部をQ国へ移した。表の排出量は全てP国向け商品の生産に伴い、輸送時排出は含まない。適切な読み取りを選べ。」", "options": ["生産移転と排出統計", "市街地の連続性", "言語圏と国境", "海峡と中継貿易"], "ans": 0, "exp": "P国の消費する商品をP・Qの二国で生産する。後期にP国の工場の一部をQ国へ移した。表の排出量は全てP国向け商品の生産に伴い、輸送時排出は含まない。適切な読み取りを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-174", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「完成品工場X・Yは異なる国にある。XとYの共通部品の供給網を示した資料について、「鉱山Mの停止が両工場へ及ぼす影響」を最も小さくできる案を選べ。新規の鉱山・工場は必要量を生産でき、品質・納期も満たすとする。」", "options": ["原料調達を含む供給網", "地区機能を指標から読む", "住居の形と環境", "乾燥地域の地下水の更新速度"], "ans": 0, "exp": "完成品工場X・Yは異なる国にある。XとYの共通部品の供給網を示した資料について、「鉱山Mの停止が両工場へ及ぼす影響」を最も小さくできる案を選べ。新規の鉱山・工場は必要量を生産でき、品質・納期も満たすとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-175", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「大都市郊外のA市について、表の1年間の人口変化を説明する文として正しいものを選べ。境界変更はなく、出生・死亡・転出入以外の増減はない。」", "options": ["地域人口の増減要因", "都市の規模分布", "中国の河川と都市の位置", "西ヨーロッパの園芸農業"], "ans": 0, "exp": "大都市郊外のA市について、表の1年間の人口変化を説明する文として正しいものを選べ。境界変更はなく、出生・死亡・転出入以外の増減はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-176", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「人口移動の影響が小さい4地域を比べる。自然増加率が年1.5％で、人口転換に伴って生産年齢人口に対する年少人口の比重が低下している地域はどれか。出生率・死亡率の分母はその年の年央人口である。」", "options": ["出生率・死亡率と人口構造", "距離と時間の隔たり", "河口低地の季節的な水利用", "アフリカの降水と植生"], "ans": 0, "exp": "人口移動の影響が小さい4地域を比べる。自然増加率が年1.5％で、人口転換に伴って生産年齢人口に対する年少人口の比重が低下している地域はどれか。出生率・死亡率の分母はその年の年央人口である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-177", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「日本の架空の2市について、総面積と可住地面積（総面積から林野・主要湖沼を除いた面積）で人口密度を比べる。資料に基づく説明として正しいものはどれか。」", "options": ["人口密度の分母", "交通手段と都市の成長", "南アジアの都市と産業", "アンデスの高度と土地利用"], "ans": 0, "exp": "日本の架空の2市について、総面積と可住地面積（総面積から林野・主要湖沼を除いた面積）で人口密度を比べる。資料に基づく説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-178", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「大都市のA区と山間部のB町の10年間の変化である。65歳以上人口の実数と、高齢化率の組合せから正しく説明したものはどれか。」", "options": ["高齢人口の変化を比べる", "集落形態と生産の場", "乾燥地域の地下水の更新速度", "オセアニアの輸出と自然環境"], "ans": 0, "exp": "大都市のA区と山間部のB町の10年間の変化である。65歳以上人口の実数と、高齢化率の組合せから正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-179", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「出生率低下後の人口ボーナスが生じやすい年齢構成にあり、従属人口指数が最も低い地域はどれか。就業率の違いは考えない。」", "options": ["年齢構成と扶養負担", "言語圏と国境", "欧州の河川と海港", "低地の土地利用と浸水"], "ans": 0, "exp": "出生率低下後の人口ボーナスが生じやすい年齢構成にあり、従属人口指数が最も低い地域はどれか。就業率の違いは考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-180", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A国とB国の期間合計特殊出生率はともに1.6だが、人口1,000人当たりの年間出生数はA国の方が多い。この違いが生じうる理由を、指標の定義に照らして選べ。」", "options": ["つの出生指標", "主食となる作物と環境", "乾燥国の人口と耕地", "土地被覆と貯留施設"], "ans": 0, "exp": "A国とB国の期間合計特殊出生率はともに1.6だが、人口1,000人当たりの年間出生数はA国の方が多い。この違いが生じうる理由を、指標の定義に照らして選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-181", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「2地域で年齢別死亡率は等しく、0〜64歳が年2‰、65歳以上が年40‰である。表の年齢構成を用いて、粗死亡率とその解釈の正しい組合せを選べ。」", "options": ["死亡率の地域比較", "地域格差を集計で読む", "北米の農業地域と生産性", "施設の指定と地形条件"], "ans": 0, "exp": "2地域で年齢別死亡率は等しく、0〜64歳が年2‰、65歳以上が年40‰である。表の年齢構成を用いて、粗死亡率とその解釈の正しい組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-182", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「人口移動のない地域の長期変化を、人口転換の一般的な過程として並べる。表の四つの時期の順序と、自然増加率が最大となる時期の組合せはどれか。」", "options": ["つの時期の人口動態", "住宅地の世代と移動", "ブラジルの地域差", "電源構成と総排出量"], "ans": 0, "exp": "人口移動のない地域の長期変化を、人口転換の一般的な過程として並べる。表の四つの時期の順序と、自然増加率が最大となる時期の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-183", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A国では移民が少なく、合計特殊出生率が低下した後も出生数が死亡数を上回っている。表の資料と人口構造の知識から、当面の人口増加を説明する文はどれか。」", "options": ["出生率低下後の人口", "東アジアの工程間分業", "豪州の鉱産資源と港湾", "湾に流れ込む負荷"], "ans": 0, "exp": "A国では移民が少なく、合計特殊出生率が低下した後も出生数が死亡数を上回っている。表の資料と人口構造の知識から、当面の人口増加を説明する文はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-184", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「山間部のX町では、ある時点の10〜19歳人口が2,000人、その10年後の20〜29歳人口が1,250人だった。この集団の10年間の死亡は50人である。境界変更はない。純移動と、変化に対応する人口ピラミッドの特徴の組合せはどれか。」", "options": ["年齢集団の追跡", "河口低地の季節的な水利用", "標高と野菜の出荷時期", "観光客の集中する時間"], "ans": 0, "exp": "山間部のX町では、ある時点の10〜19歳人口が2,000人、その10年後の20〜29歳人口が1,250人だった。この集団の10年間の死亡は50人である。境界変更はない。純移動と、変化に対応する人口ピラミッドの特徴の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-185", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「男性は0〜14歳8千、15〜29歳20千、30〜44歳24千、45〜59歳12千、60歳以上7千人。女性は同じ順に8千、9千、10千、10千、8千人。」", "options": ["年齢・男女別の人口", "海峡と中継貿易", "低地の土地利用と浸水", "集計区域と人口密度"], "ans": 0, "exp": "男性は0〜14歳8千、15〜29歳20千、30〜44歳24千、45〜59歳12千、60歳以上7千人。女性は同じ順に8千、9千、10千、10千、8千人。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-186", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「山村Aの10年間の人口変化である。この間、65歳未満の人口では転出が転入を大きく上回った。表とこの条件から説明できることはどれか。」", "options": ["山村の年齢構成", "デルタ国家の輸出工業", "低地市街地の排水", "交通施策の効果を確かめる"], "ans": 0, "exp": "山村Aの10年間の人口変化である。この間、65歳未満の人口では転出が転入を大きく上回った。表とこの条件から説明できることはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-187", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A・B両市の年初人口と1年間の移動である。自然増減はなく、転入超過数の年齢内訳も表のとおりである。転入超過率と年齢構成への影響を正しく説明したものはどれか。」", "options": ["移動率と年齢構成", "国境を越える流域の利用", "火山周辺の二つの移動", "鉱産資源と工業（ウェーバーの工業立地論）"], "ans": 0, "exp": "A・B両市の年初人口と1年間の移動である。自然増減はなく、転入超過数の年齢内訳も表のとおりである。転入超過率と年齢構成への影響を正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-188", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「都心地区Cと郊外地区Sの間の住所移動を比べる。両地区の範囲は固定し、Cは行政上の中心市全体ではなく、業務集積を含む中心部に限定する。表以外の移動はない。各期間に卓越する現象の組合せを選べ。」", "options": ["都市圏内部の住所移動", "中央アジアの流域と湖", "交通網と共通する途絶地点", "統計は単位・年次・分母"], "ans": 0, "exp": "都心地区Cと郊外地区Sの間の住所移動を比べる。両地区の範囲は固定し、Cは行政上の中心市全体ではなく、業務集積を含む中心部に限定する。表以外の移動はない。各期間に卓越する現象の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-189", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「地方県からの転出を年齢層別に比べる。人数が多い層ではなく転出率が最も高い層を特定し、その層で生じやすい移動理由と組み合わせよ。」", "options": ["年齢別にみる転出", "欧州の河川と海港", "貿易と排出量の集計", "合計特殊出生率が下がっても人口が増える理由"], "ans": 0, "exp": "地方県からの転出を年齢層別に比べる。人数が多い層ではなく転出率が最も高い層を特定し、その層で生じやすい移動理由と組み合わせよ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-190", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「農村Rで農地の細分化により一戸当たりの農業所得が低下した。同時に都市Sで工場求人が増え、R出身者による住居・就職の紹介網が形成された。RからSへの移住を、押し出す要因・引き付ける要因・移動を助ける要因に対応させたものはどれか。」", "options": ["移住を生む条件", "北大西洋の島国のエネルギー", "回収容器と地域の条件", "地理総合・地理探究の出題範囲と過去問を確認する"], "ans": 0, "exp": "農村Rで農地の細分化により一戸当たりの農業所得が低下した。同時に都市Sで工場求人が増え、R出身者による住居・就職の紹介網が形成された。RからSへの移住を、押し出す要因・引き付ける要因・移動を助ける要因に対応させたものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-191", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「南アジアの農村Rから湾岸諸国への労働移動を考える。出国前後の20〜39歳人口の性比と、家族への送金の性質を正しく組み合わせたものはどれか。表以外の人口増減や加齢は考えない。」", "options": ["国際移動と地域経済", "西アフリカの換金作物", "乾燥地域の植生変化", "日付変更線と標準時"], "ans": 0, "exp": "南アジアの農村Rから湾岸諸国への労働移動を考える。出国前後の20〜39歳人口の性比と、家族への送金の性質を正しく組み合わせたものはどれか。表以外の人口増減や加齢は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-192", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「紛争によってA国の都市Xから住居を追われた人々が、経路PではA国内の都市Yへ、経路Qでは国境を越えてB国へ移った。Qの人々はB国で庇護を申請し、まだ審査結果を受けていない。統計上の区分として適切な組合せはどれか。」", "options": ["避難経路と国境", "アフリカの降水と植生", "観光客の集中する時間", "正距方位図法と大圏航路"], "ans": 0, "exp": "紛争によってA国の都市Xから住居を追われた人々が、経路PではA国内の都市Yへ、経路Qでは国境を越えてB国へ移った。Qの人々はB国で庇護を申請し、まだ審査結果を受けていない。統計上の区分として適切な組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-193", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「フランス側の住宅地Rからルクセンブルク側の都市Cへ通勤する架空の就業者を考える。住居はRにあり、毎日帰宅する。統計上、居住地と従業地を別々に集計するときの説明として正しいものはどれか。」", "options": ["国境を越える通勤", "米国の都市の位置・気候・産業", "地区構成と標本調査", "河床縦断と勾配の変化"], "ans": 0, "exp": "フランス側の住宅地Rからルクセンブルク側の都市Cへ通勤する架空の就業者を考える。住居はRにあり、毎日帰宅する。統計上、居住地と従業地を別々に集計するときの説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-194", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「都市地域の区分を固定して10年間を比べた。現在の都市人口率が高い国と、都市人口の増加率が高い国の組合せはどれか。」", "options": ["都市人口の伸び方", "ブラジルの地域差", "道路沿いの商業と商圏", "土地利用の遷移と都市化"], "ans": 0, "exp": "都市地域の区分を固定して10年間を比べた。現在の都市人口率が高い国と、都市人口の増加率が高い国の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-195", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「都市・農村の区分を固定したA国の人口である。都市人口率の変化と農村人口の変化を正しく説明したものはどれか。」", "options": ["都市と農村の人口変化", "南米の資源輸出と価格", "あわせて使いたい無料プリント", "氾濫原の微地形と堆積物"], "ans": 0, "exp": "都市・農村の区分を固定したA国の人口である。都市人口率の変化と農村人口の変化を正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-196", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある国で都市人口が1年間に100万人から130万人へ増えた。このうち20万人は居住地を変えず、集落の区分変更により都市人口へ移された。都市の自然増加は4万人で、残りは農村から都市への転入超過である。移住と都市人口増加の関係として正しいものはどれか。」", "options": ["都市区域の変更", "ニュージーランドの降水と牧畜", "農林水産業（ホイットルシー農業区分）", "岩石の性質と地表・地下の排水"], "ans": 0, "exp": "ある国で都市人口が1年間に100万人から130万人へ増えた。このうち20万人は居住地を変えず、集落の区分変更により都市人口へ移された。都市の自然増加は4万人で、残りは農村から都市への転入超過である。移住と都市人口増加の関係として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-197", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「各区面積0.25平方キロメートル。上段はP1100人・Q1300人・R900人、下段はS1400人・T1200人・U1500人の2行3列。隣接は辺の共有とする。」", "options": ["市街地の連続性", "北海道の畑作地域", "分野・学習段階を選ぶ", "火山列の年代とプレート移動速度"], "ans": 0, "exp": "各区面積0.25平方キロメートル。上段はP1100人・Q1300人・R900人、下段はS1400人・T1200人・U1500人の2行3列。隣接は辺の共有とする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-198", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ都市について、行政市域A、連続市街地B、通勤圏Cの常住人口を集計した。三つの区域はA⊂B⊂Cで、調査時点は同じである。都市の範囲と集計人口について正しく説明したものはどれか。」", "options": ["都市を数える範囲", "南九州の地形と畜産", "選んだ根拠を、今度は80字で説明してみる", "年較差と大陸性"], "ans": 0, "exp": "同じ都市について、行政市域A、連続市街地B、通勤圏Cの常住人口を集計した。三つの区域はA⊂B⊂Cで、調査時点は同じである。都市の範囲と集計人口について正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-199", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ都市圏にあるA・B両市の昼間人口を、夜間人口−流出通勤通学者＋流入通勤通学者で求める。昼夜間人口比率と都市の役割の組合せとして正しいものはどれか。」", "options": ["昼夜の人口と都市機能", "低地の土地利用と浸水", "合計特殊出生率が下がっても人口が増える理由", "乾燥限界と植生の変化"], "ans": 0, "exp": "同じ都市圏にあるA・B両市の昼間人口を、夜間人口−流出通勤通学者＋流入通勤通学者で求める。昼夜間人口比率と都市の役割の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-200", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ大都市圏の地区P・Q・Rを、中心業務地区、郊外住宅地、外縁の工業地区に一つずつ対応させる。表から判断した組合せはどれか。」", "options": ["地区機能を指標から読む", "湾内外の津波記録", "理由と具体例を口で伝える", "低緯度高地の気候を分解する"], "ans": 0, "exp": "同じ大都市圏の地区P・Q・Rを、中心業務地区、郊外住宅地、外縁の工業地区に一つずつ対応させる。表から判断した組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-201", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ都市の4地区で土地利用を調べた。地代負担力と接近性の関係を踏まえ、中心業務地区に対応するものを選べ。」", "options": ["都市内の土地利用", "都市化と流出の時間変化", "緯経度・南中高度・地方時", "南アジアの降水の東西差"], "ans": 0, "exp": "同じ都市の4地区で土地利用を調べた。地代負担力と接近性の関係を踏まえ、中心業務地区に対応するものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-202", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同心円状の三区域。第1期は中心C−12％、内側郊外I＋8％、外側郊外O＋16％。第2期はC＋10％、I−2％、O−5％。両期の区域は固定。」", "options": ["都市圏の人口配置の変化", "斜面・谷の災害", "乗り継ぎと時差", "低緯度高地と中緯度沿岸"], "ans": 0, "exp": "同心円状の三区域。第1期は中心C−12％、内側郊外I＋8％、外側郊外O＋16％。第2期はC＋10％、I−2％、O−5％。両期の区域は固定。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-203", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A800万人、B160万人、C120万人、D100万人。交通路はA−B、B−C、B−Dを結ぶ。位置は模式的で実距離を表さない。」", "options": ["都市の規模分布", "異なる浸水想定の重ね合わせ", "用途に応じた投影法", "地域の自然植生"], "ans": 0, "exp": "A800万人、B160万人、C120万人、D100万人。交通路はA−B、B−C、B−Dを結ぶ。位置は模式的で実距離を表さない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-204", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Pは6つの住宅地が中央の道路の周辺にまとまる。Qは6つの住宅地が農地等を挟んで分散し、中央道路から枝道で結ばれる。黒が住宅地、緑が農地等。」", "options": ["市街地の広がりと交通", "交通網と共通する途絶地点", "等高線と雨水の流れ", "高緯度の地温と水の動き"], "ans": 0, "exp": "Pは6つの住宅地が中央の道路の周辺にまとまる。Qは6つの住宅地が農地等を挟んで分散し、中央道路から枝道で結ばれる。黒が住宅地、緑が農地等。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-205", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「人口減少都市の再編案を比べる。コンパクト・プラス・ネットワークの考え方に合い、表の目標「日常生活拠点の維持」と「公共交通への接近性向上」の両方に対応する案はどれか。」", "options": ["生活拠点の再配置", "都市気温の比較地点", "GISと地形条件の重ね合わせ", "穀物農場の生産性"], "ans": 0, "exp": "人口減少都市の再編案を比べる。コンパクト・プラス・ネットワークの考え方に合い、表の目標「日常生活拠点の維持」と「公共交通への接近性向上」の両方に対応する案はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-206", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中心都市Cへの通勤について、A・B住宅地からの時間距離を比べる。駅までの徒歩と平均待ち時間を含め、平均待ち時間は運行間隔の半分とする。資料と鉄道の時間短縮効果を正しく説明したものはどれか。」", "options": ["距離と時間の隔たり", "電源構成と総排出量", "土地利用の遷移と都市化", "商品作物への依存と交易"], "ans": 0, "exp": "中心都市Cへの通勤について、A・B住宅地からの時間距離を比べる。駅までの徒歩と平均待ち時間を含め、平均待ち時間は運行間隔の半分とする。資料と鉄道の時間短縮効果を正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-207", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「医療施設の配置を検討する。A・B地区の人口は同じだが、表の到達圏に差がある。非運転者のアクセシビリティを測る指標と、自動車利用者との到達可能性の差が大きい地区の組合せはどれか。」", "options": ["医療施設の分布と到達圏", "熱帯の斜面耕地", "谷口の堆積地と水利用", "東部太平洋沿岸の変化"], "ans": 0, "exp": "医療施設の配置を検討する。A・B地区の人口は同じだが、表の到達圏に差がある。非運転者のアクセシビリティを測る指標と、自動車利用者との到達可能性の差が大きい地区の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-208", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表は居住地を行、勤務先を列にしたOD表である。Cは中心市、S・Tは周辺市で、就業者は全員この3市内で居住・勤務する。SとTの都市機能を比較した説明として正しいものはどれか。」", "options": ["通勤の地域間結合", "乾燥地域の灌漑と取水", "粒径資料からみる堆積環境", "天然ガスの輸送体系"], "ans": 0, "exp": "表は居住地を行、勤務先を列にしたOD表である。Cは中心市、S・Tは周辺市で、就業者は全員この3市内で居住・勤務する。SとTの都市機能を比較した説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-209", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある都市では通勤者数と自動車分担率が表のように変化した。同期間に鉄道沿線への居住誘導が進んだ。資料から確実にいえる交通量の変化と、追加確認が必要な事項の組合せはどれか。」", "options": ["交通手段と都市の成長", "乾燥地域の植生変化", "谷の断面と支谷の高さ", "原料産地と金属生産地"], "ans": 0, "exp": "ある都市では通勤者数と自動車分担率が表のように変化した。同期間に鉄道沿線への居住誘導が進んだ。資料から確実にいえる交通量の変化と、追加確認が必要な事項の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-210", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「都心から0・2・4・6kmで、業務の支払地代は120・80・40・0、住宅は85・65・45・25、農業は45・39・33・27。折れ線は各用途を結ぶ。」", "options": ["地代と土地利用", "国際河川の季節配分", "横ずれ境界と地震・地殻の生成", "陶磁器産地の継続"], "ans": 0, "exp": "都心から0・2・4・6kmで、業務の支払地代は120・80・40・0、住宅は85・65・45・25、農業は45・39・33・27。折れ線は各用途を結ぶ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-211", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ平野内の店舗X・Yを比べる。YはXより専門設備や展示面積が大きく、年間固定費も高い。資料と中心地理論の一般的な関係を踏まえ、YでXより大きくなると考えられる「需要の閾値」と「財の到達範囲」の組合せを選べ。所得・人口密度・交通条件は同じとする。」", "options": ["購買行動と中心地の階層", "観光消費と地域内の循環", "雨温図から大陸東西の違いを読む", "輸出額の変化と産業構造"], "ans": 0, "exp": "同じ平野内の店舗X・Yを比べる。YはXより専門設備や展示面積が大きく、年間固定費も高い。資料と中心地理論の一般的な関係を踏まえ、YでXより大きくなると考えられる「需要の閾値」と「財の到達範囲」の組合せを選べ。所得・人口密度・交通条件は同じとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-212", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Pは東西方向の一本道の北側に5戸が一列に並ぶ。Qは耕地の中の離れた位置に5戸が点在し、それぞれ屋敷林を表す薄緑の円に囲まれる。」", "options": ["集落形態と生産の場", "上流施設と海岸の変化", "夏季降水割合と東アジアの季節風", "出生率・死亡率と人口構造"], "ans": 0, "exp": "Pは東西方向の一本道の北側に5戸が一列に並ぶ。Qは耕地の中の離れた位置に5戸が点在し、それぞれ屋敷林を表す薄緑の円に囲まれる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-213", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「山間地域で若年層の転出が続き、表のように人口と商業・交通が変化した。地域の縮小が生活サービスへ及ぼす作用を説明したものとして最も整合するのはどれか。」", "options": ["山間地域のサービス変化", "集計区域と人口密度", "乾燥限界と植生の変化", "出生率低下後の人口"], "ans": 0, "exp": "山間地域で若年層の転出が続き、表のように人口と商業・交通が変化した。地域の縮小が生活サービスへ及ぼす作用を説明したものとして最も整合するのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-214", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A地域は都市部と農村部からなる。人口構成だけが表のように変わり、都市部・農村部それぞれの1人当たり所得は変化しなかった。A地域全体の平均所得の変化と解釈を選べ。全住民について同じ定義で所得を集計する。」", "options": ["地域平均と都市化", "道路沿いの商業と商圏", "高緯度低地の夏の自然環境", "移住を生む条件"], "ans": 0, "exp": "A地域は都市部と農村部からなる。人口構成だけが表のように変わり、都市部・農村部それぞれの1人当たり所得は変化しなかった。A地域全体の平均所得の変化と解釈を選べ。全住民について同じ定義で所得を集計する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-215", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「スイス西部のジュネーブ周辺、北部のチューリヒ周辺、南部のティチーノ州の主な言語圏を、周辺国との位置関係も踏まえて対応させる。正しい組合せはどれか。」", "options": ["言語圏と国境", "地区別の回答と人口構成", "つの気候資料と世界の位置", "市街地の連続性"], "ans": 0, "exp": "スイス西部のジュネーブ周辺、北部のチューリヒ周辺、南部のティチーノ州の主な言語圏を、周辺国との位置関係も踏まえて対応させる。正しい組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-216", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「インドの多言語社会を参考にした架空調査である。Lは家庭・地域で使う言語、Mは複数州にまたがる共通語として使われる言語とする。各地区で同じ就業者に家庭と職場の両方を尋ね、各場面で「使う」と答えた割合は複数回答である。表から支持される説明はどれか。」", "options": ["言語の使用場面と地域差", "大地形（プレートテクトニクス・変動帯）", "海陸風と日変化", "市街地の広がりと交通"], "ans": 0, "exp": "インドの多言語社会を参考にした架空調査である。Lは家庭・地域で使う言語、Mは複数州にまたがる共通語として使われる言語とする。各地区で同じ就業者に家庭と職場の両方を尋ね、各場面で「使う」と答えた割合は複数回答である。表から支持される説明はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-217", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「次の二地域の宗教分布と歴史的つながりに対応する国の組合せはどれか。国全体の傾向を示し、国内の全住民に同じ信仰を当てはめるものではない。」", "options": ["東南アジアの文化分布", "ケッペンの気候区分と植生・土壌", "同緯度の東西比較", "購買行動と中心地の階層"], "ans": 0, "exp": "次の二地域の宗教分布と歴史的つながりに対応する国の組合せはどれか。国全体の傾向を示し、国内の全住民に同じ信仰を当てはめるものではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-218", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のP・Qはいずれもヨーロッパ人到来前のアメリカ大陸で栽培され、後に他大陸へ広がった根・塊茎作物である。伝統的な栽培地域の自然条件と現在の利用を手掛かりに、作物を対応させよ。」", "options": ["主食となる作物と環境", "商業・サービス業・交通通信・グローバル貿易", "気候区分に使う資料の期間", "文化が広がる経路"], "ans": 0, "exp": "表のP・Qはいずれもヨーロッパ人到来前のアメリカ大陸で栽培され、後に他大陸へ広がった根・塊茎作物である。伝統的な栽培地域の自然条件と現在の利用を手掛かりに、作物を対応させよ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-219", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「大都市Aが1期、大都市Bが2期、小都市a・bが3期に採用。Aとaは近くAとBは遠い。A−B間に広域情報交換があり、A−a・B−bも結ばれる。移住はない。」", "options": ["文化が広がる経路", "分野・学習段階を選ぶ", "葉の特徴と季節的乾燥", "中国東部の農業地域比較"], "ans": 0, "exp": "大都市Aが1期、大都市Bが2期、小都市a・bが3期に採用。Aとaは近くAとBは遠い。A−B間に広域情報交換があり、A−a・B−bも結ばれる。移住はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-220", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Pは熱帯低地の河川・湿地周辺にある高床で開口の大きい木造住居、Qは夏の昼夜の気温差が大きい乾燥した内陸盆地にある厚い土壁の住居である。これらの構造が環境に対応する仕組みとして正しい組合せを選べ。」", "options": ["住居の形と環境", "統計は単位・年次・分母", "高緯度の地温と水の動き", "海峡と中継貿易"], "ans": 0, "exp": "Pは熱帯低地の河川・湿地周辺にある高床で開口の大きい木造住居、Qは夏の昼夜の気温差が大きい乾燥した内陸盆地にある厚い土壁の住居である。これらの構造が環境に対応する仕組みとして正しい組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-221", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A市・B市の失業率を、同じ定義で都市中心部と郊外に分けて集計した。各区域の労働力人口と失業率は表のとおりである。市全体の失業率と解釈として正しいものはどれか。」", "options": ["地域格差を集計で読む", "氾濫原の微地形と土地利用", "モンスーン地域の作付け", "乾燥地域の地下水の更新速度"], "ans": 0, "exp": "A市・B市の失業率を、同じ定義で都市中心部と郊外に分けて集計した。各区域の労働力人口と失業率は表のとおりである。市全体の失業率と解釈として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-222", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「アルプスのある谷で、牧畜に従事する家族の一部が、夏に家畜と高地の草地へ移り、冬は谷底の集落へ戻る。耕地と永住用住宅は谷底にあり、毎年ほぼ同じ場所を利用する。この形態と自然条件の説明の組合せはどれか。」", "options": ["季節の移動と生活文化", "鉱石の産地と製錬工場の立地", "農地面積と延べ作付面積", "西ヨーロッパの園芸農業"], "ans": 0, "exp": "アルプスのある谷で、牧畜に従事する家族の一部が、夏に家畜と高地の草地へ移り、冬は谷底の集落へ戻る。耕地と永住用住宅は谷底にあり、毎年ほぼ同じ場所を利用する。この形態と自然条件の説明の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-223", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「A町の将来人口を推計した。基準人口、年齢別出生率、年齢別死亡率は両案で同じだが、案Yでは20〜39歳の男女の転入超過が案Xより多いと仮定した。転入した女性にも同じ年齢別出生率を適用する。表の差を説明するものはどれか。」", "options": ["人口推計の二つの経路", "流域の都市化と洪水の変化", "耕種と畜産の結び付き", "アフリカの降水と植生"], "ans": 0, "exp": "A町の将来人口を推計した。基準人口、年齢別出生率、年齢別死亡率は両案で同じだが、案Yでは20〜39歳の男女の転入超過が案Xより多いと仮定した。転入した女性にも同じ年齢別出生率を適用する。表の差を説明するものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-224", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ大都市圏の住宅地A・Bについて、10年前の55〜64歳に当たる出生世代の純移動を調べる。表の死亡数は、この出生世代について期間中に各地区内で記録された人数である。境界変更・集計漏れはない。住宅地形成の情報も踏まえて、正しい説明を選べ。」", "options": ["住宅地の世代と移動", "理由と具体例を口で伝える", "森林の蓄積と年齢構成", "アンデスの高度と土地利用"], "ans": 0, "exp": "同じ大都市圏の住宅地A・Bについて、10年前の55〜64歳に当たる出生世代の純移動を調べる。表の死亡数は、この出生世代について期間中に各地区内で記録された人数である。境界変更・集計漏れはない。住宅地形成の情報も踏まえて、正しい説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-225", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「西から重慶P、武漢Q、上海Rが1本の河川で結ばれる。経度は約東経107度、114度、121度。」", "options": ["中国の河川と都市の位置", "共通テスト地理の対策でよくある質問", "エネルギー源の構成と自給", "オセアニアの輸出と自然環境"], "ans": 0, "exp": "西から重慶P、武漢Q、上海Rが1本の河川で結ばれる。経度は約東経107度、114度、121度。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-226", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中国東部の平野部にあるP・Qのモデル資料を示す。自然条件と伝統的な主要穀物の組合せとして適切なのはどれか。」", "options": ["中国東部の農業地域比較", "対蹠点と最短距離", "太陽光発電と夕方の需給", "低地の土地利用と浸水"], "ans": 0, "exp": "中国東部の平野部にあるP・Qのモデル資料を示す。自然条件と伝統的な主要穀物の組合せとして適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-227", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある電子機器の生産ネットワークを表に示す。貿易統計と立地の読み方として正しいものはどれか。」", "options": ["東アジアの工程間分業", "日付変更線と標準時", "原料産地と金属生産地", "土地被覆と貯留施設"], "ans": 0, "exp": "ある電子機器の生産ネットワークを表に示す。貿易統計と立地の読み方として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-228", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中国の沿海部Pと内陸部Qを想定した資料から、工場の一部がPからQへ移る条件を考えた。資料と地域的背景に合う説明はどれか。」", "options": ["中国の沿海部と内陸部", "地図面積と集落密度", "供給網の分散と輸送拠点", "施設の指定と地形条件"], "ans": 0, "exp": "中国の沿海部Pと内陸部Qを想定した資料から、工場の一部がPからQへ移る条件を考えた。資料と地域的背景に合う説明はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-229", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「モンゴルの乾燥した草原で、家族と家畜群が季節ごとに水場や牧草の状態を見て滞在地を変える事例を考える。この生業に該当するものはどれか。」", "options": ["内陸アジアの牧畜", "用途に応じた投影法", "貨物輸送の規格化", "電源構成と総排出量"], "ans": 0, "exp": "モンゴルの乾燥した草原で、家族と家畜群が季節ごとに水場や牧草の状態を見て滞在地を変える事例を考える。この生業に該当するものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-230", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「メコンデルタ沿岸部の資料に基づき、米作への塩分の影響が大きくなりやすい時期と背景を選べ。」", "options": ["河口低地の季節的な水利用", "等高線・縮尺・斜面方位", "工程分業と地域間の結び付き", "湾に流れ込む負荷"], "ans": 0, "exp": "メコンデルタ沿岸部の資料に基づき、米作への塩分の影響が大きくなりやすい時期と背景を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-231", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「スマトラ島の東側、ボルネオ島の南側に細長い島Xがある。下側がインド洋側。」", "options": ["島嶼部の地形と農業", "等高線の標高範囲と比高", "地域人口の増減要因", "観光客の集中する時間"], "ans": 0, "exp": "スマトラ島の東側、ボルネオ島の南側に細長い島Xがある。下側がインド洋側。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-232", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のP・Q・Rはタイ、マレーシア、ベトナムのいずれかである。地域の位置と生産の特徴を合わせた対応として正しいものはどれか。」", "options": ["東南アジアの農産物と地域", "分水界を越える導水", "つの出生指標", "集計区域と人口密度"], "ans": 0, "exp": "表のP・Q・Rはタイ、マレーシア、ベトナムのいずれかである。地域の位置と生産の特徴を合わせた対応として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-233", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「シンガポールでは、国内で原油を大量に採掘していなくても石油精製・石油製品の輸出が発達している。その立地を説明する組合せはどれか。」", "options": ["海峡と中継貿易", "交通ネットワークの結節点", "年齢・男女別の人口", "交通施策の効果を確かめる"], "ans": 0, "exp": "シンガポールでは、国内で原油を大量に採掘していなくても石油精製・石油製品の輸出が発達している。その立地を説明する組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-234", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表はマレーシアを想定した財輸出の学習用モデル値である。同国の代表的な農産原料の組合せと、新時点の一次産品輸出額を正しく組み合わせたものはどれか。」", "options": ["東南アジアの一次産品と工業", "土地利用の遷移と都市化", "移住を生む条件", "鉱産資源と工業（ウェーバーの工業立地論）"], "ans": 0, "exp": "表はマレーシアを想定した財輸出の学習用モデル値である。同国の代表的な農産原料の組合せと、新時点の一次産品輸出額を正しく組み合わせたものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-235", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のP・Qはインドのベンガルールとコルカタのいずれかである。都市と産業立地の説明の組合せとして正しいものはどれか。」", "options": ["南アジアの都市と産業", "座標参照系と位置のずれ", "都市と農村の人口変化", "統計は単位・年次・分母"], "ans": 0, "exp": "表のP・Qはインドのベンガルールとコルカタのいずれかである。都市と産業立地の説明の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-236", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ガンジス川・ブラマプトラ川の下流に位置する国の輸出工場を調べたところ、衣類の輸出が多く、綿花の多くを輸入していた。国名と工業の性格の組合せとして正しいものはどれか。」", "options": ["デルタ国家の輸出工業", "河口の堆積地と海岸線の変化", "地区機能を指標から読む", "合計特殊出生率が下がっても人口が増える理由"], "ans": 0, "exp": "ガンジス川・ブラマプトラ川の下流に位置する国の輸出工場を調べたところ、衣類の輸出が多く、綿花の多くを輸入していた。国名と工業の性格の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-237", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北インドの平野で、雨季に稲、冬から春の比較的乾燥した時期に小麦を栽培するモデルを示す。この二毛作を支える条件として適切なのはどれか。」", "options": ["南アジアの作物と季節", "蛇行河川の侵食と流路変化", "生活拠点の再配置", "地理総合・地理探究の出題範囲と過去問を確認する"], "ans": 0, "exp": "北インドの平野で、雨季に稲、冬から春の比較的乾燥した時期に小麦を栽培するモデルを示す。この二毛作を支える条件として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-238", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ネパールの工場（北緯28度・東経85度付近）が、港P・Qから原料を輸入する。P・Qはコルカタと天津のいずれかである。位置資料と費用を合わせ、最も安い経路の港名と1t当たり費用を選べ。両経路とも利用可能で、表以外の費用は考えない。」", "options": ["ヒマラヤ周辺の輸送条件", "砂の移動と海岸堆積地形", "地代と土地利用", "日付変更線と標準時"], "ans": 0, "exp": "ネパールの工場（北緯28度・東経85度付近）が、港P・Qから原料を輸入する。P・Qはコルカタと天津のいずれかである。位置資料と費用を合わせ、最も安い経路の港名と1t当たり費用を選べ。両経路とも利用可能で、表以外の費用は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-239", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ガンジス川の支流が流れるネパールの山地で、雨季の水を貯め乾季に放流する貯水池を考える。下流の平野・デルタに対する影響として適切な組合せはどれか。流域の降水量は同じで、貯水池に土砂がたまり、排砂は行わないとする。」", "options": ["国境を越える流域の利用", "谷の断面と支谷の高さ", "言語圏と国境", "正距方位図法と大圏航路"], "ans": 0, "exp": "ガンジス川の支流が流れるネパールの山地で、雨季の水を貯め乾季に放流する貯水池を考える。下流の平野・デルタに対する影響として適切な組合せはどれか。流域の降水量は同じで、貯水池に土砂がたまり、排砂は行わないとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-240", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「サウジアラビア内陸で、灌漑農業の水源となる「化石地下水」の利用を調べている。この水を現在の降水で補給される浅い地下水と区別する説明として正しいものはどれか。」", "options": ["乾燥地域の地下水の更新速度", "沈み込みと震源の分布", "住居の形と環境", "河床縦断と勾配の変化"], "ans": 0, "exp": "サウジアラビア内陸で、灌漑農業の水源となる「化石地下水」の利用を調べている。この水を現在の降水で補給される浅い地下水と区別する説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-241", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「海域Pの北東側にイラン、南西側にアラビア半島。Pは南東の狭い出口Xでインド洋側に続く。」", "options": ["西アジアの海上輸送路", "火山列の年代とプレート移動速度", "中国の河川と都市の位置", "土地利用の遷移と都市化"], "ans": 0, "exp": "海域Pの北東側にイラン、南西側にアラビア半島。Pは南東の狭い出口Xでインド洋側に続く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-242", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中央アジアの湖Pでは、流入河川からの灌漑取水が拡大した時期に水面が大きく縮小した。湖名と、蒸発が続いて湖水量が減る際の塩分濃度の変化の組合せを選べ。湖に溶ける塩類の総量は同じとして考える。」", "options": ["中央アジアの流域と湖", "河川沿いの堆積物と土地利用", "河口低地の季節的な水利用", "氾濫原の微地形と堆積物"], "ans": 0, "exp": "中央アジアの湖Pでは、流入河川からの灌漑取水が拡大した時期に水面が大きく縮小した。湖名と、蒸発が続いて湖水量が減る際の塩分濃度の変化の組合せを選べ。湖に溶ける塩類の総量は同じとして考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-243", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中央アジアの国Pはカスピ海に面し、中国と陸上国境を接する。原油の産出があり、中国西部へパイプラインで送る事例が見られる。Pはどの国か。」", "options": ["中央アジアの交通と資源", "高温多雨な低地の自然環境", "南アジアの都市と産業", "岩石の性質と地表・地下の排水"], "ans": 0, "exp": "中央アジアの国Pはカスピ海に面し、中国と陸上国境を接する。原油の産出があり、中国西部へパイプラインで送る事例が見られる。Pはどの国か。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-244", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のP・Qはトルコの地中海沿岸とアラビア半島の内陸部を想定したモデルである。地域と農業の特徴の対応として適切なのはどれか。」", "options": ["西アジアの気候と農業の差", "夏季降水割合と東アジアの季節風", "乾燥地域の地下水の更新速度", "火山列の年代とプレート移動速度"], "ans": 0, "exp": "表のP・Qはトルコの地中海沿岸とアラビア半島の内陸部を想定したモデルである。地域と農業の特徴の対応として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-245", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北海沿岸の港Pから、河川Rが南東側のドイツ内陸工業地域に続く。」", "options": ["欧州の河川と海港", "少雨地域の位置と大気循環", "欧州の国際分業と国境", "年較差と大陸性"], "ans": 0, "exp": "北海沿岸の港Pから、河川Rが南東側のドイツ内陸工業地域に続く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-246", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ドイツとその東側に位置するチェコ・ポーランドの工場間で、自動車部品を繰り返し運ぶ事例を考える。資料の変化が生産網に与える影響として適切なのはどれか。」", "options": ["欧州の国際分業と国境", "モンスーン気候と熱帯雨林気候の区別", "西アフリカの換金作物", "乾燥限界と植生の変化"], "ans": 0, "exp": "ドイツとその東側に位置するチェコ・ポーランドの工場間で、自動車部品を繰り返し運ぶ事例を考える。資料の変化が生産網に与える影響として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-247", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「オランダの施設園芸は、高緯度で冬の日射が少ないという条件の下でも輸出競争力を持つ。説明として適切なのはどれか。」", "options": ["西ヨーロッパの園芸農業", "冷帯と寒帯を分ける夏の気温", "北米の農業と水利用", "低緯度高地の気候を分解する"], "ans": 0, "exp": "オランダの施設園芸は、高緯度で冬の日射が少ないという条件の下でも輸出競争力を持つ。説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-248", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「アイスランドでは地熱・水力を利用し、アルミニウム製錬も行われる。この地域の自然・資源・工業を結ぶ説明として正しいものはどれか。」", "options": ["北大西洋の島国のエネルギー", "低緯度高地の気候を分解する", "アンデスの高度と土地利用", "南アジアの降水の東西差"], "ans": 0, "exp": "アイスランドでは地熱・水力を利用し、アルミニウム製錬も行われる。この地域の自然・資源・工業を結ぶ説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-249", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のP・Qはノルウェーとスウェーデンのいずれかである。国の対応と背景として適切なのはどれか。」", "options": ["北欧の資源と地形", "つの気候資料と世界の位置", "ニュージーランドの降水と牧畜", "低緯度高地と中緯度沿岸"], "ans": 0, "exp": "表のP・Qはノルウェーとスウェーデンのいずれかである。国の対応と背景として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-250", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「エジプトを考えるためのモデル資料である。国土全体の人口密度と、人口が集中する区域Aの人口密度の組合せとして正しいものはどれか。」", "options": ["乾燥国の人口と耕地", "低気圧の移動と中緯度の風", "太平洋側の園芸と市場", "地域の自然植生"], "ans": 0, "exp": "エジプトを考えるためのモデル資料である。国土全体の人口密度と、人口が集中する区域Aの人口密度の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-251", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ガーナ南部の高温湿潤な地域で、主要な輸出用樹木作物Xの種子を加工するモデルである。Xと、加工後の原料費控除額の組合せとして適切なのはどれか。原料以外の費用は未計上とする。」", "options": ["西アフリカの換金作物", "山脈両側の降水量", "観測地点による揺れの違い", "高緯度の地温と水の動き"], "ans": 0, "exp": "ガーナ南部の高温湿潤な地域で、主要な輸出用樹木作物Xの種子を加工するモデルである。Xと、加工後の原料費控除額の組合せとして適切なのはどれか。原料以外の費用は未計上とする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-252", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ケニアの赤道に近い標高約1800mの高地では、切り花を生産し、低温管理してヨーロッパへ航空輸送する事例が見られる。栽培を支える気温条件の説明として適切なのはどれか。」", "options": ["赤道周辺の高地農業", "海上の霧と露点", "都市化と流出の時間変化", "穀物農場の生産性"], "ans": 0, "exp": "ケニアの赤道に近い標高約1800mの高地では、切り花を生産し、低温管理してヨーロッパへ航空輸送する事例が見られる。栽培を支える気温条件の説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-253", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北にQ、南にP。両地点は道路でつながり途中に国境がある。Pの南はギニア湾。」", "options": ["西アフリカの内陸国と港", "都市の夜の気温と土地被覆", "積雪期と噴火後の降雨", "商品作物への依存と交易"], "ans": 0, "exp": "北にQ、南にP。両地点は道路でつながり途中に国境がある。Pの南はギニア湾。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-254", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のP・Q・Rはサヘル、コンゴ盆地、南部アフリカのサバナ地域を想定したモデルである。対応として正しいものはどれか。」", "options": ["アフリカの降水と植生", "気候区分に使う資料の期間", "台風と湾の向き", "東部太平洋沿岸の変化"], "ans": 0, "exp": "表のP・Q・Rはサヘル、コンゴ盆地、南部アフリカのサバナ地域を想定したモデルである。対応として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-255", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「米国の中央部で、東側の湿潤な地域Pと、より西側の乾燥した地域Qのモデル農場を比較する。資料と農業地域の特徴に合う説明はどれか。」", "options": ["北米の農業地域と生産性", "地域の自然植生", "電源構成と総排出量", "天然ガスの輸送体系"], "ans": 0, "exp": "米国の中央部で、東側の湿潤な地域Pと、より西側の乾燥した地域Qのモデル農場を比較する。資料と農業地域の特徴に合う説明はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-256", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「米国の3地域P・Q・Rを表に示す。自然環境と農業の結び付きとして誤っているものはどれか。」", "options": ["北米の農業と水利用", "湿潤地域の土壌断面", "観光地のごみ指標", "原料産地と金属生産地"], "ans": 0, "exp": "米国の3地域P・Q・Rを表に示す。自然環境と農業の結び付きとして誤っているものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-257", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表の特徴をもつ米国の都市圏Xはどれか。位置・気候と産業集積を合わせて判断せよ。」", "options": ["米国の都市の位置・気候・産業", "気候が同じでも違う土壌", "生息地の連結と道路", "陶磁器産地の継続"], "ans": 0, "exp": "表の特徴をもつ米国の都市圏Xはどれか。位置・気候と産業集積を合わせて判断せよ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-258", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「カナダ東部のケベック州にアルミニウム製錬所が集積する理由を考える。地域の電源と原料調達の組合せとして適切なのはどれか。」", "options": ["カナダの資源と製錬", "つの半球の日射の季節", "観光消費と地域内の循環", "輸出額の変化と産業構造"], "ans": 0, "exp": "カナダ東部のケベック州にアルミニウム製錬所が集積する理由を考える。地域の電源と原料調達の組合せとして適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-259", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のような米国市場向けの工場がメキシコの米国国境地域に立地する事例を考える。工業化の型と、立地に関する説明の組合せとして適切なのはどれか。」", "options": ["北米の国境を越える製造業", "モンスーン地域の作付け", "建物の階と土地利用", "出生率・死亡率と人口構造"], "ans": 0, "exp": "表のような米国市場向けの工場がメキシコの米国国境地域に立地する事例を考える。工業化の型と、立地に関する説明の組合せとして適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-260", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のP・Q・Rはブラジルのアマゾン低地、中西部のセラード、南東部のいずれかである。対応として正しいものはどれか。」", "options": ["ブラジルの地域差", "作付け暦の読み取り", "集計地図で見える範囲", "出生率低下後の人口"], "ans": 0, "exp": "表のP・Q・Rはブラジルのアマゾン低地、中西部のセラード、南東部のいずれかである。対応として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-261", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「斜面の下部Pは標高約300m、中部Qは約1500m、上部Rは約3800m。熱帯アンデスの東斜面を想定する。」", "options": ["アンデスの高度と土地利用", "つの酪農地域", "大地形（プレートテクトニクス・変動帯）", "移住を生む条件"], "ans": 0, "exp": "斜面の下部Pは標高約300m、中部Qは約1500m、上部Rは約3800m。熱帯アンデスの東斜面を想定する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-262", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「南米の農牧業地域について、対応が正しいものはどれか。」", "options": ["南米の自然地域と農業", "商品作物への依存と交易", "鉱産資源と工業（ウェーバーの工業立地論）", "市街地の連続性"], "ans": 0, "exp": "南米の農牧業地域について、対応が正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-263", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「チリを想定した銅輸出のモデルである。数量・金額の変化と地域の自然条件の説明として正しいものはどれか。」", "options": ["南米の資源輸出と価格", "乾燥地のかんがいと土壌", "共通テスト地理の資料は、読む順番を決める", "市街地の広がりと交通"], "ans": 0, "exp": "チリを想定した銅輸出のモデルである。数量・金額の変化と地域の自然条件の説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-264", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ラテンアメリカの土地所有構造を考えるモデル村の資料である。少数の大経営に対応する用語と、その大経営が所有する農地面積の割合を組み合わせたものはどれか。」", "options": ["農地所有の偏り", "森林の蓄積と年齢構成", "氾濫原の微地形と土地利用", "購買行動と中心地の階層"], "ans": 0, "exp": "ラテンアメリカの土地所有構造を考えるモデル村の資料である。少数の大経営に対応する用語と、その大経営が所有する農地面積の割合を組み合わせたものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-265", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「西側Pはピルバラ地域でインド洋側、東側Qは太平洋側。国土輪郭を描かず東西関係のみ示す。」", "options": ["豪州の鉱産資源と港湾", "漁獲統計と資源評価", "緯度が近い地域の降水差", "主食となる作物と環境"], "ans": 0, "exp": "西側Pはピルバラ地域でインド洋側、東側Qは太平洋側。国土輪郭を描かず東西関係のみ示す。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-266", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ニュージーランド南島の同緯度帯にある、サザンアルプスの西側Pと東側Qを比較する。表を説明する自然条件として適切なのはどれか。」", "options": ["ニュージーランドの降水と牧畜", "電源構成とエネルギー全体", "地理のテーマから、大学別の準備を探す", "中国の河川と都市の位置"], "ans": 0, "exp": "ニュージーランド南島の同緯度帯にある、サザンアルプスの西側Pと東側Qを比較する。表を説明する自然条件として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-267", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「太平洋の島P・Qの資料を示す。Pの成り立ちと、Pの地下の淡水・海水の位置関係を組み合わせたものはどれか。雨水が浸透して淡水がたまる場所を考える。」", "options": ["太平洋の島の成り立ちと生活", "風力資源と消費地の位置", "対蹠点と最短距離", "東南アジアの農産物と地域"], "ans": 0, "exp": "太平洋の島P・Qの資料を示す。Pの成り立ちと、Pの地下の淡水・海水の位置関係を組み合わせたものはどれか。雨水が浸透して淡水がたまる場所を考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-268", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「オーストラリアとニュージーランドの輸出構造を理解するため、表のP・Qを作った。国の対応と地域的背景として適切なのはどれか。」", "options": ["オセアニアの輸出と自然環境", "地下資源とプレート境界", "縮尺と斜面の比較", "国境を越える流域の利用"], "ans": 0, "exp": "オーストラリアとニュージーランドの輸出構造を理解するため、表のP・Qを作った。国の対応と地域的背景として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-269", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「十勝地方のある畑で、毎年の主な作物を小麦、てんさい、豆類、ばれいしょの順に替える。この栽培方式の名称と、作物を替える目的の組合せとして適切なのはどれか。」", "options": ["北海道の畑作地域", "原料産地と金属生産地", "正距方位図法と大圏航路", "欧州の国際分業と国境"], "ans": 0, "exp": "十勝地方のある畑で、毎年の主な作物を小麦、てんさい、豆類、ばれいしょの順に替える。この栽培方式の名称と、作物を替える目的の組合せとして適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-270", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表はレタス産地P・Qの気温と出荷時期のモデルである。Qの栽培方法と立地の説明として適切なのはどれか。」", "options": ["標高と野菜の出荷時期", "海外生産の費用比較", "等高線の標高範囲と比高", "西アフリカの内陸国と港"], "ans": 0, "exp": "表はレタス産地P・Qの気温と出荷時期のモデルである。Qの栽培方法と立地の説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-271", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「高知県沿岸部で、施設野菜を一般的な露地栽培より早い冬から春に出荷し、主に京阪神・首都圏の市場へ送る事例を考える。栽培時期の調節と、市場との関係を表す用語の組合せとして正しいものはどれか。」", "options": ["太平洋側の園芸と市場", "都市圏の工場跡地", "直線の到達圏と道路の到達圏", "ブラジルの地域差"], "ans": 0, "exp": "高知県沿岸部で、施設野菜を一般的な露地栽培より早い冬から春に出荷し、主に京阪神・首都圏の市場へ送る事例を考える。栽培時期の調節と、市場との関係を表す用語の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-272", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「内陸の台地に養豚・養鶏農家、海側の港に飼料工場があり、飼料を内陸へ輸送する。台地は海側より高い。」", "options": ["南九州の地形と畜産", "集荷と配送の拠点配置", "空間結合と集計単位の限界", "太平洋の島の成り立ちと生活"], "ans": 0, "exp": "内陸の台地に養豚・養鶏農家、海側の港に飼料工場があり、飼料を内陸へ輸送する。台地は海側より高い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-273", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表のP・Q・Rは北海道の十勝、長野県の高冷地、高知県の沿岸部を想定したモデルである。対応として正しいものはどれか。」", "options": ["日本の地域と農業構成", "輸送量の指標と距離", "河口の堆積地と海岸線の変化", "低地の土地利用と浸水"], "ans": 0, "exp": "表のP・Q・Rは北海道の十勝、長野県の高冷地、高知県の沿岸部を想定したモデルである。対応として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-274", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「高知県沿岸の冬春の施設野菜と、ケニアの赤道高地の切り花を比較する。2地域の自然条件と、市場までの距離からみた農業立地の説明として適切なのはどれか。」", "options": ["異なる地域に共通する農業立地", "工程分業と地域間の結び付き", "沈水海岸の形成過程と地域", "土地被覆と貯留施設"], "ans": 0, "exp": "高知県沿岸の冬春の施設野菜と、ケニアの赤道高地の切り花を比較する。2地域の自然条件と、市場までの距離からみた農業立地の説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-275", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ河川沿いのA・B地区を調べた。堤防決壊後の水が流入したという条件で、資料と地形の性質を合わせた説明を選べ。」", "options": ["低地の土地利用と浸水", "生産移転と排出統計", "氷河周辺の堆積物の識別", "施設の指定と地形条件"], "ans": 0, "exp": "同じ河川沿いのA・B地区を調べた。堤防決壊後の水が流入したという条件で、資料と地形の性質を合わせた説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-276", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「M6.8の同一地震について、距離・地盤・震度を比較した。AとBの違いを説明する仮説として、資料と地震の知識に合うものを選べ。」", "options": ["観測地点による揺れの違い", "出生率・死亡率と人口構造", "火山列の年代とプレート移動速度", "電源構成と総排出量"], "ans": 0, "exp": "M6.8の同一地震について、距離・地盤・震度を比較した。AとBの違いを説明する仮説として、資料と地震の知識に合うものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-277", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同程度の強い揺れを受ける4地点のうち、砂質地盤の液状化を重点的に調べる条件が最もそろう地点はどれか。地盤改良はいずれも行われていない。」", "options": ["造成地の履歴と地盤", "年齢構成と扶養負担", "南アメリカ低緯度の雨季と植生", "湾に流れ込む負荷"], "ans": 0, "exp": "同程度の強い揺れを受ける4地点のうち、砂質地盤の液状化を重点的に調べる条件が最もそろう地点はどれか。地盤改良はいずれも行われていない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-278", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ津波について、外海に開く海岸Aと、奥へ狭まり浅くなる湾の湾奥Bを比べた。表は平常潮位からの水位上昇で、両地点とも2回目の記録が最大だった。Bの増幅と、津波が浅い海へ進むときの伝播速度の組合せとして適切な説明を選べ。」", "options": ["湾内外の津波記録", "つの時期の人口動態", "大陸西岸の降水と季節変化", "観光客の集中する時間"], "ans": 0, "exp": "同じ津波について、外海に開く海岸Aと、奥へ狭まり浅くなる湾の湾奥Bを比べた。表は平常潮位からの水位上昇で、両地点とも2回目の記録が最大だった。Bの増幅と、津波が浅い海へ進むときの伝播速度の組合せとして適切な説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-279", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Aの地面より水面が1m高い。Aから低いBへ地表が下がり、さらに高いCの段丘面へ上がる横断面。AとBの水面は同じ高さ。」", "options": ["低地の断面と水面", "年齢・男女別の人口", "モンスーン気候と熱帯雨林気候の区別", "集計区域と人口密度"], "ans": 0, "exp": "Aの地面より水面が1m高い。Aから低いBへ地表が下がり、さらに高いCの段丘面へ上がる横断面。AとBの水面は同じ高さ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-280", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「架空の河口低地で同量の雨が降った2事例を比較した。堤防の決壊・越水、海水の越波はいずれもなかった。事例IIで市街地の浸水が増えた説明として、地形と資料に合うものはどれか。」", "options": ["低地市街地の排水", "都市圏内部の住所移動", "寒冷地域の気温と半球", "交通施策の効果を確かめる"], "ans": 0, "exp": "架空の河口低地で同量の雨が降った2事例を比較した。堤防の決壊・越水、海水の越波はいずれもなかった。事例IIで市街地の浸水が増えた説明として、地形と資料に合うものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-281", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同一流域について、森林・農地が多かった時期と市街地拡大後を、同量・同じ時間分布の雨で比較した。表の変化を説明するものを選べ。」", "options": ["都市化と流出の時間変化", "国際移動と地域経済", "収束帯の移動と二地点の降水ピーク", "鉱産資源と工業（ウェーバーの工業立地論）"], "ans": 0, "exp": "同一流域について、森林・農地が多かった時期と市街地拡大後を、同量・同じ時間分布の雨で比較した。表の変化を説明するものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-282", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「40haの地区に100mmの雨が降る。流出率は森林時0.3、市街地化後0.7とする。市街地化による総流出量の増加分を一時的に受け入れる容量と、その治水上のねらいの組合せを選べ。1ha＝10,000m²である。」", "options": ["土地被覆と貯留施設", "都市人口の伸び方", "山脈両側の降水量", "統計は単位・年次・分母"], "ans": 0, "exp": "40haの地区に100mmの雨が降る。流出率は森林時0.3、市街地化後0.7とする。市街地化による総流出量の増加分を一時的に受け入れる容量と、その治水上のねらいの組合せを選べ。1ha＝10,000m²である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-283", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「上流Pと支流Qが合流点Rで合わさり下流へ流れる。Q側に貯留施設がある。線は河川。縮尺なし。」", "options": ["支流の合流と流量ピーク", "市街地の連続性", "低緯度高地と中緯度沿岸", "合計特殊出生率が下がっても人口が増える理由"], "ans": 0, "exp": "上流Pと支流Qが合流点Rで合わさり下流へ流れる。Q側に貯留施設がある。線は河川。縮尺なし。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-284", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「山地の調査でPでは「急な崖の直下に崩れた岩塊」、Qでは「谷の出口の扇状の堆積地に、水と混ざって運ばれた巨礫」、Rでは「緩い斜面に連続する亀裂と、まとまって移動した地面」が記録された。対応する現象を選べ。」", "options": ["斜面・谷の災害", "地区機能を指標から読む", "東西岸の降水配分を比較する", "地理総合・地理探究の出題範囲と過去問を確認する"], "ans": 0, "exp": "山地の調査でPでは「急な崖の直下に崩れた岩塊」、Qでは「谷の出口の扇状の堆積地に、水と混ざって運ばれた巨礫」、Rでは「緩い斜面に連続する亀裂と、まとまって移動した地面」が記録された。対応する現象を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-285", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。中央の火山の東側にP、南西側にQがある。上空の矢印は西から東へ向かう。火山から南西へ下る谷が描かれる。縮尺なし。」", "options": ["火山周辺の二つの移動", "都市の規模分布", "湿潤地域の土壌断面", "日付変更線と標準時"], "ans": 0, "exp": "北が上。中央の火山の東側にP、南西側にQがある。上空の矢印は西から東へ向かう。火山から南西へ下る谷が描かれる。縮尺なし。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-286", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「火山地域の二つの記録を示す。Pは積雪期の噴火直後に、火口付近から水と土砂が混ざって谷を流下した。Qは無積雪期に厚い火山灰が降り積もり、その後の大雨で谷に大量の土砂が流れた。両者を説明する組合せを選べ。」", "options": ["積雪期と噴火後の降雨", "距離と時間の隔たり", "月別の土壌水分を追う", "正距方位図法と大圏航路"], "ans": 0, "exp": "火山地域の二つの記録を示す。Pは積雪期の噴火直後に、火口付近から水と土砂が混ざって谷を流下した。Qは無積雪期に厚い火山灰が降り積もり、その後の大雨で谷に大量の土砂が流れた。両者を説明する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-287", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある地点Xは河川洪水図では着色がなく、内水浸水図では着色がある。Xは川沿いの微高地の背後にある住宅地である。二つの地図が両立する理由として適切なものを選べ。」", "options": ["異なる浸水想定の重ね合わせ", "交通手段と都市の成長", "斜面と低地の農地利用", "河床縦断と勾配の変化"], "ans": 0, "exp": "ある地点Xは河川洪水図では着色がなく、内水浸水図では着色がある。Xは川沿いの微高地の背後にある住宅地である。二つの地図が両立する理由として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-288", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「古い津波碑には「当時の浜から約300m内陸まで浸水」とある。同じ方向の旧版地図と現在図を重ねると、埋立てにより海岸線は約600m沖へ移っていた。碑の位置と内容は移されていない。読み取りとして適切なものを選べ。」", "options": ["沿岸の土地履歴と災害記録", "集落形態と生産の場", "つの酪農地域", "土地利用の遷移と都市化"], "ans": 0, "exp": "古い津波碑には「当時の浜から約300m内陸まで浸水」とある。同じ方向の旧版地図と現在図を重ねると、埋立てにより海岸線は約600m沖へ移っていた。碑の位置と内容は移されていない。読み取りとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-289", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「表は架空市の施設の指定状況である。「被災後に滞在する施設」と「災害から緊急に退避する場所」の違いも踏まえて、適切な説明を選べ。実際の避難先を選ぶ問題ではない。」", "options": ["施設の指定と地形条件", "言語圏と国境", "熱帯林地域の土地利用", "氾濫原の微地形と堆積物"], "ans": 0, "exp": "表は架空市の施設の指定状況である。「被災後に滞在する施設」と「災害から緊急に退避する場所」の違いも踏まえて、適切な説明を選べ。実際の避難先を選ぶ問題ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-290", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Xから橋Pと橋Qに分岐し、再び合流して区間Sを通りYに至る。別の代替路RはXからSを通らずYに至る。全道路は双方向。縮尺なし。」", "options": ["交通網と共通する途絶地点", "主食となる作物と環境", "東部太平洋沿岸の変化", "岩石の性質と地表・地下の排水"], "ans": 0, "exp": "Xから橋Pと橋Qに分岐し、再び合流して区間Sを通りYに至る。別の代替路RはXからSを通らずYに至る。全道路は双方向。縮尺なし。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-291", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上で南へ開く遠浅の湾を想定する。台風が湾の西側を北上したとき、湾奥の海面を押し上げやすい風と理由の組合せを選べ。低気圧による吸い上げ効果も加わるが、ここでは風の作用を問う。」", "options": ["台風と湾の向き", "地域格差を集計で読む", "電源構成とエネルギー全体", "火山列の年代とプレート移動速度"], "ans": 0, "exp": "北が上で南へ開く遠浅の湾を想定する。台風が湾の西側を北上したとき、湾奥の海面を押し上げやすい風と理由の組合せを選べ。低気圧による吸い上げ効果も加わるが、ここでは風の作用を問う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-292", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ標高で海からの距離もほぼ等しい中心市街地Aと郊外緑地Bを、晴天・弱風日に比べた。資料と都市の熱環境に合う説明を選べ。」", "options": ["時刻による都市の気温差", "住宅地の世代と移動", "水力発電と季節流量", "年較差と大陸性"], "ans": 0, "exp": "同じ標高で海からの距離もほぼ等しい中心市街地Aと郊外緑地Bを、晴天・弱風日に比べた。資料と都市の熱環境に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-293", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「海岸から内陸へ向けて地形が高くなる都市で、舗装の多い場所と緑地の土地被覆による気温差を調べたい。観測機器・高さ・日射を避ける条件をそろえることに加え、最も比較条件をそろえた計画はどれか。」", "options": ["都市気温の比較地点", "東アジアの工程間分業", "製鉄所の立地条件の変化", "乾燥限界と植生の変化"], "ans": 0, "exp": "海岸から内陸へ向けて地形が高くなる都市で、舗装の多い場所と緑地の土地被覆による気温差を調べたい。観測機器・高さ・日射を避ける条件をそろえることに加え、最も比較条件をそろえた計画はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-294", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「水稲栽培地域がP・Qの対策を行う。主な目的に基づく「緩和」「適応」の分類を選べ。」", "options": ["農業地域の気候対策", "河口低地の季節的な水利用", "都市圏の工場跡地", "低緯度高地の気候を分解する"], "ans": 0, "exp": "水稲栽培地域がP・Qの対策を行う。主な目的に基づく「緩和」「適応」の分類を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-295", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「消費に対応する排出量を「域内排出＋輸入品の生産時排出−輸出品の生産時排出」で求める教材モデルを用いる。表から得られる結果と、輸入・輸出を考慮する理由の組合せを選べ。」", "options": ["貿易と排出量の集計", "海峡と中継貿易", "貨物の価値と輸送手段", "南アジアの降水の東西差"], "ans": 0, "exp": "消費に対応する排出量を「域内排出＋輸入品の生産時排出−輸出品の生産時排出」で求める教材モデルを用いる。表から得られる結果と、輸入・輸出を考慮する理由の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-296", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「ある地域の発電量は基準年の100から比較年の140へ増え、火力の割合は50%から35%になった。火力の発電1単位当たりCO₂排出は一定、その他の電源の発電時排出は0とする。比較年の発電時総排出量と説明の組合せを選べ。」", "options": ["電源構成と総排出量", "デルタ国家の輸出工業", "加工貿易と付加価値", "低緯度高地と中緯度沿岸"], "ans": 0, "exp": "ある地域の発電量は基準年の100から比較年の140へ増え、火力の割合は50%から35%になった。火力の発電1単位当たりCO₂排出は一定、その他の電源の発電時排出は0とする。比較年の発電時総排出量と説明の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-297", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ品質・重量の野菜1kgを同じ市場に届ける二経路を比較する。地域Aは市場近くで暖房栽培、Bは暖かい海外で露地栽培し船で運ぶ。Aの生産段階の排出を70%減らせた場合の評価を選べ。その他の条件は変わらない。」", "options": ["食料の生産地と輸送", "国境を越える流域の利用", "出生率・死亡率と人口構造", "地域の自然植生"], "ans": 0, "exp": "同じ品質・重量の野菜1kgを同じ市場に届ける二経路を比較する。地域Aは市場近くで暖房栽培、Bは暖かい海外で露地栽培し船で運ぶ。Aの生産段階の排出を70%減らせた場合の評価を選べ。その他の条件は変わらない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-298", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ設備容量の太陽光発電を日本の太平洋側Pと日本海側Qで比べた。両地点は同緯度・同標高で、設備故障はない。表の冬の違いを説明し、Qで冬の供給を補う候補を示すものを選べ。」", "options": ["季節と発電資源", "中央アジアの流域と湖", "死亡率の地域比較", "高緯度の地温と水の動き"], "ans": 0, "exp": "同じ設備容量の太陽光発電を日本の太平洋側Pと日本海側Qで比べた。両地点は同緯度・同標高で、設備故障はない。表の冬の違いを説明し、Qで冬の供給を補う候補を示すものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-299", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「雨季のある熱帯の丘陵で森林が畑へ転換され、雨季に川の濁りが増えた。裸地の畝は斜面の上下方向に長く続いている。表土流出を抑えつつ既存農地を使う改善として、地形と降雨の作用に合うものはどれか。」", "options": ["熱帯の斜面耕地", "欧州の河川と海港", "山村の年齢構成", "穀物農場の生産性"], "ans": 0, "exp": "雨季のある熱帯の丘陵で森林が畑へ転換され、雨季に川の濁りが増えた。裸地の畝は斜面の上下方向に長く続いている。表土流出を抑えつつ既存農地を使う改善として、地形と降雨の作用に合うものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-300", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「Pは空き瓶を洗浄して同じ容器として再使用、Qは空き瓶を砕いて原料に戻し別の瓶に製造する。P・Qの分類と、Pの環境負荷を比べる際に必要な地域条件の組合せを選べ。」", "options": ["回収容器と地域の条件", "北大西洋の島国のエネルギー", "国際移動と地域経済", "商品作物への依存と交易"], "ans": 0, "exp": "Pは空き瓶を洗浄して同じ容器として再使用、Qは空き瓶を砕いて原料に戻し別の瓶に製造する。P・Qの分類と、Pの環境負荷を比べる際に必要な地域条件の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-301", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「人口1万人で1年365日の観光地に、年間73万人日の観光客滞在があった。住民と観光客が出すごみの合計は2,190tである。人口は一定、1人日とは1人が1日滞在する量である。住民・観光客の合計滞在人日で割った値と、その意義を選べ。」", "options": ["観光地のごみ指標", "西アフリカの換金作物", "都市区域の変更", "東部太平洋沿岸の変化"], "ans": 0, "exp": "人口1万人で1年365日の観光地に、年間73万人日の観光客滞在があった。住民と観光客が出すごみの合計は2,190tである。人口は一定、1人日とは1人が1日滞在する量である。住民・観光客の合計滞在人日で割った値と、その意義を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-302", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「乾燥地域で農業取水60のうち作物に有効に使われる水は18、その他の用途の取水は40である。作物への有効水量18を保ち、有効利用率を30%から45%へ高めると、総取水は何%減るか。あわせて乾燥地の灌漑で留意する土壌問題を選べ。」", "options": ["乾燥地域の灌漑と取水", "アフリカの降水と植生", "都市内の土地利用", "天然ガスの輸送体系"], "ans": 0, "exp": "乾燥地域で農業取水60のうち作物に有効に使われる水は18、その他の用途の取水は40である。作物への有効水量18を保ち、有効利用率を30%から45%へ高めると、総取水は何%減るか。あわせて乾燥地の灌漑で留意する土壌問題を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-303", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「河川AとBが閉鎖性の湾に流れ込む。経路を表す線の長さは流量や距離に対応しない。」", "options": ["湾に流れ込む負荷", "米国の都市の位置・気候・産業", "距離と時間の隔たり", "原料産地と金属生産地"], "ans": 0, "exp": "河川AとBが閉鎖性の湾に流れ込む。経路を表す線の長さは流量や距離に対応しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-304", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「冷涼で常時水を含む湿地には、分解されにくい植物遺体が厚く積もっている。排水路を掘って地下水面を下げた後、地表面の沈下とCO₂放出の増加が観測された。この変化を説明するものを選べ。」", "options": ["湿地と炭素の動き", "ブラジルの地域差", "購買行動と中心地の階層", "陶磁器産地の継続"], "ans": 0, "exp": "冷涼で常時水を含む湿地には、分解されにくい植物遺体が厚く積もっている。排水路を掘って地下水面を下げた後、地表面の沈下とCO₂放出の増加が観測された。この変化を説明するものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-305", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「半乾燥地域の二つの放牧地を同じ期間に調べた。両地点は降水量と季節分布・土質・風の条件が近い。表から検討すべき土地劣化の仕組みを選べ。」", "options": ["乾燥地域の植生変化", "南米の資源輸出と価格", "言語の使用場面と地域差", "輸出額の変化と産業構造"], "ans": 0, "exp": "半乾燥地域の二つの放牧地を同じ期間に調べた。両地点は降水量と季節分布・土質・風の条件が近い。表から検討すべき土地劣化の仕組みを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-306", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「森林AとBを細い樹林帯が結ぶが、中央の舗装道路で切れている。切断部がX、森林Aの外側がY、森林B内部がZ。縮尺なし。」", "options": ["生息地の連結と道路", "ニュージーランドの降水と牧畜", "地域格差を集計で読む", "出生率・死亡率と人口構造"], "ans": 0, "exp": "森林AとBを細い樹林帯が結ぶが、中央の舗装道路で切れている。切断部がX、森林Aの外側がY、森林B内部がZ。縮尺なし。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-307", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「日本海側の同じ海岸を調べると、河口付近では強い雨の直後にごみが増え、河口から離れた場所では冬季に増える傾向があった。二つの過程を区別して確かめる調査として適切なものを選べ。」", "options": ["沿岸の漂着物と季節", "北海道の畑作地域", "中国東部の農業地域比較", "出生率低下後の人口"], "ans": 0, "exp": "日本海側の同じ海岸を調べると、河口付近では強い雨の直後にごみが増え、河口から離れた場所では冬季に増える傾向があった。二つの過程を区別して確かめる調査として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-308", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「中央アジアの水利用を参考に、上流国Uの高山から乾燥した下流国Dへ流れる河川を考える。Uは暖房用電力の不足を冬の水力発電で補う案を持ち、Dでは露地の綿花栽培が行われる。自然流量の季節性と、両国で調整すべき利用の組合せを選べ。」", "options": ["国際河川の季節配分", "南九州の地形と畜産", "島嶼部の地形と農業", "移住を生む条件"], "ans": 0, "exp": "中央アジアの水利用を参考に、上流国Uの高山から乾燥した下流国Dへ流れる河川を考える。Uは暖房用電力の不足を冬の水力発電で補う案を持ち、Dでは露地の綿花栽培が行われる。自然流量の季節性と、両国で調整すべき利用の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-309", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北半球の地中海沿岸の観光地Pと、北半球の内陸山地のスキー観光地Qを比較する。Pの7月の降水特性を生む大気循環と、水需給に関する説明の組合せを選べ。表は学習用モデル値である。」", "options": ["観光の季節性と水需要", "低地の土地利用と浸水", "デルタ国家の輸出工業", "市街地の連続性"], "ans": 0, "exp": "北半球の地中海沿岸の観光地Pと、北半球の内陸山地のスキー観光地Qを比較する。Pの7月の降水特性を生む大気循環と、水需給に関する説明の組合せを選べ。表は学習用モデル値である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-310", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「駅から歴史地区へのバスが、10時に到着する観光列車の到着後に混雑する。駅からのバス予約を別の時間帯へ移す案を検討する。各時間帯の輸送力は変えず、利用者は予約時刻まで駅で待てるものとする。表の範囲で10時台の超過需要を全て別の時間帯へ移すことはできるか。」", "options": ["観光客の集中する時間", "湾内外の津波記録", "西アジアの海上輸送路", "市街地の広がりと交通"], "ans": 0, "exp": "駅から歴史地区へのバスが、10時に到着する観光列車の到着後に混雑する。駅からのバス予約を別の時間帯へ移す案を検討する。各時間帯の輸送力は変えず、利用者は予約時刻まで駅で待てるものとする。表の範囲で10時台の超過需要を全て別の時間帯へ移すことはできるか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-311", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「二つの観光計画のうち、地域内に直接残る額が大きいものを選び、その理由も答えよ。地域内に残る額は「客数×1人当たり消費額×(1−域外への支払率)」とする。同じ期間のモデルで、波及効果は含めない。」", "options": ["観光消費と地域内の循環", "都市化と流出の時間変化", "欧州の国際分業と国境", "購買行動と中心地の階層"], "ans": 0, "exp": "二つの観光計画のうち、地域内に直接残る額が大きいものを選び、その理由も答えよ。地域内に残る額は「客数×1人当たり消費額×(1−域外への支払率)」とする。同じ期間のモデルで、波及効果は含めない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-312", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「病院を同じ拠点Hへ集約する案を検討している。表は自家用車を使わない高齢者についての資料である。施設までの近さと交通網を踏まえた判断を選べ。」", "options": ["生活施設への到達しやすさ", "斜面・谷の災害", "西アフリカの換金作物", "主食となる作物と環境"], "ans": 0, "exp": "病院を同じ拠点Hへ集約する案を検討している。表は自家用車を使わない高齢者についての資料である。施設までの近さと交通網を踏まえた判断を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-313", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ床面積の施設を整備する四案を比べる。既存交通を利用し、農地転用と新たな洪水リスクへの曝露を抑えるという方針に最も合う案を、土地の成り立ちも踏まえて選べ。いずれも土砂災害の想定区域外である。」", "options": ["市街地更新と災害条件", "異なる浸水想定の重ね合わせ", "北米の農業と水利用", "中国の河川と都市の位置"], "ans": 0, "exp": "同じ床面積の施設を整備する四案を比べる。既存交通を利用し、農地転用と新たな洪水リスクへの曝露を抑えるという方針に最も合う案を、土地の成り立ちも踏まえて選べ。いずれも土砂災害の想定区域外である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-314", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「大河川上流のダム完成後、下流の洪水ピークと河口へ届く土砂量が減り、河口の三角州海岸で後退が観測された。海面上昇や沿岸構造物の条件は同じとする。資料に合う因果関係を選べ。」", "options": ["上流施設と海岸の変化", "交通網と共通する途絶地点", "アンデスの高度と土地利用", "東南アジアの農産物と地域"], "ans": 0, "exp": "大河川上流のダム完成後、下流の洪水ピークと河口へ届く土砂量が減り、河口の三角州海岸で後退が観測された。海面上昇や沿岸構造物の条件は同じとする。資料に合う因果関係を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-315", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「山間集落と中心市街地を含む市で、非運転者の買い物交通を調べる。駅前だけの調査では中心市街地の回答が多かった。市全体の需要を推定し、地区差も把握する計画を選べ。」", "options": ["地区構成と標本調査", "都市気温の比較地点", "ニュージーランドの降水と牧畜", "国境を越える流域の利用"], "ans": 0, "exp": "山間集落と中心市街地を含む市で、非運転者の買い物交通を調べる。駅前だけの調査では中心市街地の回答が多かった。市全体の需要を推定し、地区差も把握する計画を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-316", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「駅前の店舗減少を調べる。旧調査は「1階の路面店数」、新資料は「建物の全階を合わせた店舗数」である。駅前では1階店舗が住宅へ変わる一方、上層階に飲食店が入る例もあった。路面商業の変化を検証できる方法を選べ。」", "options": ["建物の階と土地利用", "電源構成と総排出量", "太平洋側の園芸と市場", "欧州の国際分業と国境"], "ans": 0, "exp": "駅前の店舗減少を調べる。旧調査は「1階の路面店数」、新資料は「建物の全階を合わせた店舗数」である。駅前では1階店舗が住宅へ変わる一方、上層階に飲食店が入る例もあった。路面商業の変化を検証できる方法を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-317", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ市の人口を、市全体で塗り分けた地図と、中心部・周辺部に分けた地図で表した。人口も境界も同じ年のものである。表を踏まえ、地図の印象が変わる理由を選べ。」", "options": ["集計区域と人口密度", "熱帯の斜面耕地", "観測地点による揺れの違い", "西アフリカの内陸国と港"], "ans": 0, "exp": "同じ市の人口を、市全体で塗り分けた地図と、中心部・周辺部に分けた地図で表した。人口も境界も同じ年のものである。表を踏まえ、地図の印象が変わる理由を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-318", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「同じ都市の4地区を比較した。店舗数の違いについて、「駅からの距離が同じでも歩いて行ける経路が違う」という仮説を直接検討する組合せと追加資料を選べ。」", "options": ["駅距離と商業の分布", "乾燥地域の灌漑と取水", "都市化と流出の時間変化", "ブラジルの地域差"], "ans": 0, "exp": "同じ都市の4地区を比較した。店舗数の違いについて、「駅からの距離が同じでも歩いて行ける経路が違う」という仮説を直接検討する組合せと追加資料を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-319", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「市内の観光施設P・Qを同じ日に調査した。Pの入場者は1,000人、Qは800人で、そのうち500人は両施設を訪れていた。各施設内での重複入場はない。この二施設を訪れた実人数と、観光調査上の注意を選べ。」", "options": ["周遊観光と延べ人数", "乾燥地域の植生変化", "積雪期と噴火後の降雨", "太平洋の島の成り立ちと生活"], "ans": 0, "exp": "市内の観光施設P・Qを同じ日に調査した。Pの入場者は1,000人、Qは800人で、そのうち500人は両施設を訪れていた。各施設内での重複入場はない。この二施設を訪れた実人数と、観光調査上の注意を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-320", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「北が上。旧道上に西からPとQがある。南側に東西のバイパスがあり、南北道路との交差点にR、その東にSがある。縮尺なし。」", "options": ["道路沿いの商業と商圏", "国際河川の季節配分", "台風と湾の向き", "異なる地域に共通する農業立地"], "ans": 0, "exp": "北が上。旧道上に西からPとQがある。南側に東西のバイパスがあり、南北道路との交差点にR、その東にSがある。縮尺なし。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-321", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "次の説明に該当する地理の用語・事項として最も適切なものはどれか。\n「高齢者が買い物に使う道路を調査し、個人を識別できないよう人数を地区単位で集計して公開する。川の両岸を一つの地区にまとめた地図で「徒歩圏の店がある地区」と判定された。地図の読み方として適切なものを選べ。」", "options": ["集計地図で見える範囲", "観光消費と地域内の循環", "電源構成と総排出量", "都市化と流出の時間変化"], "ans": 0, "exp": "高齢者が買い物に使う道路を調査し、個人を識別できないよう人数を地区単位で集計して公開する。川の両岸を一つの地区にまとめた地図
