参照元の解説ページを見る"}, {"id": "GEO-WEB-1185", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 出荷を早めることと遠隔市場への供給の双方が合わない。促成/抑制と近郊/輸送を別の軸で判断する。」", "options": ["選択肢3", "海岸の地形", "乾季（11〜3月）", "低い平均気温"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 出荷を早めることと遠隔市場への供給の双方が合わない。促成/抑制と近郊/輸送を別の軸で判断する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1186", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 促成は合うが、示された主な市場は産地に近い都市ではない。都市周辺に立地する近郊農業とは分ける。」", "options": ["選択肢4", "主要作物の栽培条件と主産地", "期間", "地理総合"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 促成は合うが、示された主な市場は産地に近い都市ではない。都市周辺に立地する近郊農業とは分ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1187", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 成因は合うが、シラスの水が浸透しやすい性質と逆。台地の利用では用水路や貯水などの整備が必要となることがある。」", "options": ["選択肢1", "エネルギー資源", "原料炭", "試験"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 成因は合うが、シラスの水が浸透しやすい性質と逆。台地の利用では用水路や貯水などの整備が必要となることがある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1188", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 透水性と用水の関係は合うが、河川の砂礫による段丘と、火砕流堆積物によるシラス台地の成因を混同している。」", "options": ["選択肢2", "工業の変化", "輸送機関", "大地形"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 透水性と用水の関係は合うが、河川の砂礫による段丘と、火砕流堆積物によるシラス台地の成因を混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1189", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 台地の成因と水の性質の双方が合わない。平らで高い地形でも、河成段丘か火山性台地かで地質が異なる。」", "options": ["選択肢3", "都市", "前期", "林業・水産業"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 台地の成因と水の性質の双方が合わない。平らで高い地形でも、河成段丘か火山性台地かで地質が異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1190", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 シラス台地は主に火砕流などの火山噴出物からなる。透水性が高く水が浸透しやすいため用水確保が課題となる場所がある。図の畜産は港湾からの飼料供給とも結び付く。」", "options": ["選択肢4", "生活文化", "40〜64歳", "都市"], "ans": 0, "exp": "正解は「選択肢4」です。正解 シラス台地は主に火砕流などの火山噴出物からなる。透水性が高く水が浸透しやすいため用水確保が課題となる場所がある。図の畜産は港湾からの飼料供給とも結び付く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1191", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 冬春の施設野菜と夏秋の高冷地野菜の産地が逆。気温条件を作期に結び付ける。」", "options": ["選択肢1", "地形図", "地区", "GIS"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 冬春の施設野菜と夏秋の高冷地野菜の産地が逆。気温条件を作期に結び付ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1192", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 十勝の畑作と長野高冷地の夏秋野菜を取り違えている。作物と出荷期の両方を見る。」", "options": ["選択肢2", "調査対象", "作物", "気候・自然環境"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 十勝の畑作と長野高冷地の夏秋野菜を取り違えている。作物と出荷期の両方を見る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1193", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 畑作4品目と大規模経営は十勝、夏秋野菜は高冷地、冬春の施設野菜は高知沿岸の特徴に合う。」", "options": ["選択肢3", "利益相反の有無", "作物X", "今の状態"], "ans": 0, "exp": "正解は「選択肢3」です。正解 畑作4品目と大規模経営は十勝、夏秋野菜は高冷地、冬春の施設野菜は高知沿岸の特徴に合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1194", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高知の施設園芸と十勝の大規模畑作を逆にしている。温暖さと経営規模は別の立地条件。」", "options": ["選択肢4", "産業・資源・流通", "P 西側", "斜面"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 高知の施設園芸と十勝の大規模畑作を逆にしている。温暖さと経営規模は別の立地条件。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1195", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 高知の暖地の促成栽培と、低緯度でも比較的冷涼なケニア高地では利用する自然条件が異なる。ともに鮮度管理と輸送技術で遠い大市場に供給する。」", "options": ["選択肢1", "防災・環境・地域調査", "最大流量", "位置"], "ans": 0, "exp": "正解は「選択肢1」です。正解 高知の暖地の促成栽培と、低緯度でも比較的冷涼なケニア高地では利用する自然条件が異なる。ともに鮮度管理と輸送技術で遠い大市場に供給する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1196", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 自然条件は合うが、主要な消費市場の近くに立地する近郊農業とは異なる。施設園芸・切り花栽培という品目だけで近郊農業と決めない。」", "options": ["選択肢2", "今の状態", "放牧地", "標高データ"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 自然条件は合うが、主要な消費市場の近くに立地する近郊農業とは異なる。施設園芸・切り花栽培という品目だけで近郊農業と決めない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1197", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 気温条件と市場までの距離の双方が合わない。品目が生鮮でも、輸送技術があれば遠隔地での産地形成が可能となる。」", "options": ["選択肢3", "2択から決められない", "選択肢1", "時刻帯"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 気温条件と市場までの距離の双方が合わない。品目が生鮮でも、輸送技術があれば遠隔地での産地形成が可能となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1198", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 遠隔市場との関係は合うが、高知を高冷地の抑制栽培、ケニアを中緯度内陸の気候と混同している。低緯度高地の平均気温と年較差を分ける。」", "options": ["選択肢4", "メッシュ", "侵食", "総労働時間"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 遠隔市場との関係は合うが、高知を高冷地の抑制栽培、ケニアを中緯度内陸の気候と混同している。低緯度高地の平均気温と年較差を分ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1199", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地形名が逆である。自然堤防は川沿いの微高地で、後背湿地より相対的に水はけがよい。」", "options": ["選択肢1", "領域", "地理総合，歴史総合，公共", "鉄鉱石"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 地形名が逆である。自然堤防は川沿いの微高地で、後背湿地より相対的に水はけがよい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1200", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地形名は合うが、長く水が残る理由は低さと排水のしにくさである。侵食の強さを示す資料はない。」", "options": ["選択肢2", "候補", "熱帯（A）", "100,000人"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 地形名は合うが、長く水が残る理由は低さと排水のしにくさである。侵食の強さを示す資料はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1201", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 川沿いの微高地に集落、背後の低地に水田という配置は自然堤防と後背湿地に対応する。後背湿地は細粒の堆積物が多く排水しにくい。」", "options": ["選択肢3", "地表勾配", "試験", "18〜24歳"], "ans": 0, "exp": "正解は「選択肢3」です。正解 川沿いの微高地に集落、背後の低地に水田という配置は自然堤防と後背湿地に対応する。後背湿地は細粒の堆積物が多く排水しにくい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1202", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 扇状地は山地の出口に形成される。この配置と細かな土は自然堤防・後背湿地の組合せに合う。」", "options": ["選択肢4", "堆積物", "気候", "地区"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 扇状地は山地の出口に形成される。この配置と細かな土は自然堤防・後背湿地の組合せに合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1203", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 軟らかい地盤による増幅と減衰を取り違えている。揺れを弱めるという説明では、Bで震度が大きい資料を説明できない。」", "options": ["選択肢1", "標高データ", "その他", "C（中国沿海部）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 軟らかい地盤による増幅と減衰を取り違えている。揺れを弱めるという説明では、Bで震度が大きい資料を説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1204", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 震度は地点の揺れで、距離以外に地盤の影響も受ける。Bの方が遠いのに震度が大きいので軟弱な地盤の増幅が検討対象になる。」", "options": ["選択肢2", "2日目", "エネルギー資源", "区分"], "ans": 0, "exp": "正解は「選択肢2」です。正解 震度は地点の揺れで、距離以外に地盤の影響も受ける。Bの方が遠いのに震度が大きいので軟弱な地盤の増幅が検討対象になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1205", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Mは地震自体の規模であり、観測地点ごとに地盤に応じて別のMになるわけではない。」", "options": ["選択肢3", "山頂", "人口", "総流出量"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Mは地震自体の規模であり、観測地点ごとに地盤に応じて別のMになるわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1206", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 表では硬い岩盤のAの震度が小さい。ここで軟弱な沖積層の増幅と硬い岩盤の性質を逆にしている。」", "options": ["選択肢4", "地表からの深さ（m）", "図法", "中心部"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 表では硬い岩盤のAの震度が小さい。ここで軟弱な沖積層の増幅と硬い岩盤の性質を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1207", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 砂礫を含むが、締まりと深い地下水位はBより典型的な液状化条件から遠い。砂という語だけでは決められない。」", "options": ["選択肢1", "乾季（11〜3月）", "調査対象", "侵食"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 砂礫を含むが、締まりと深い地下水位はBより典型的な液状化条件から遠い。砂という語だけでは決められない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1208", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地下水位は高いが、粘土を緩い砂質地盤と同一視できない。液状化と軟弱地盤の沈下も区別する。」", "options": ["選択肢2", "産地", "気候・自然環境", "地誌"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 地下水位は高いが、粘土を緩い砂質地盤と同一視できない。液状化と軟弱地盤の沈下も区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1209", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 切土地の岩盤は緩い砂の埋立地と異なる。平らな地表でも地下の成り立ちは同じではない。」", "options": ["選択肢3", "方式", "A年", "寒帯（E）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 切土地の岩盤は緩い砂の埋立地と異なる。平らな地表でも地下の成り立ちは同じではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1210", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 緩い砂質地盤、高い地下水位、強い揺れが液状化の主要条件となる。旧河道の埋立地という履歴も手掛かりになる。」", "options": ["選択肢4", "鉄鉱石", "2択から決められない", "プレート境界"], "ans": 0, "exp": "正解は「選択肢4」です。正解 緩い砂質地盤、高い地下水位、強い揺れが液状化の主要条件となる。旧河道の埋立地という履歴も手掛かりになる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1211", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 津波は湾の奥で幅が狭まるなどの地形で高くなり得る。伝播速度は水深が浅いほど遅くなり、波高と速さは別に考える。」", "options": ["選択肢1", "拠点", "地図", "食料問題"], "ans": 0, "exp": "正解は「選択肢1」です。正解 津波は湾の奥で幅が狭まるなどの地形で高くなり得る。伝播速度は水深が浅いほど遅くなり、波高と速さは別に考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1212", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 吸い上げは台風などの高潮を説明する機構である。地震などで生じる津波の湾内増幅と混同している。」", "options": ["選択肢2", "輸送機関", "データ", "人口"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 吸い上げは台風などの高潮を説明する機構である。地震などで生じる津波の湾内増幅と混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1213", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 湾の地形の効果は合うが、速度の変化が逆である。深い外洋で速く、浅い沿岸へ進むにつれて遅くなる。」", "options": ["選択肢3", "10年前", "堆積物", "地形図"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 湾の地形の効果は合うが、速度の変化が逆である。深い外洋で速く、浅い沿岸へ進むにつれて遅くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1214", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 吹き寄せは風による高潮の機構であり、この津波の増幅を説明していない。浅い海での伝播速度の変化も逆である。」", "options": ["選択肢4", "後期", "1日目", "地図・GIS・地形"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 吹き寄せは風による高潮の機構であり、この津波の増幅を説明していない。浅い海での伝播速度の変化も逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1215", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 同じ水面でも地盤の高さが違えば浸水深は違う。Aより2m低いBでは、Aの1mより2m深い3mとなる。」", "options": ["選択肢1", "25〜39歳", "時刻帯", "B年"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 同じ水面でも地盤の高さが違えば浸水深は違う。Aより2m低いBでは、Aの1mより2m深い3mとなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1216", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aの標高5mに浸水深1mを加えると水面は標高6m。Bでは6−3＝3mとなる。川沿いの微高地の背後にある旧水田は後背湿地に対応し、細粒の土は浸透しにくい。」", "options": ["選択肢2", "出国前の20〜39歳人口", "乾季（11〜3月）", "メッシュ"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Aの標高5mに浸水深1mを加えると水面は標高6m。Bでは6−3＝3mとなる。川沿いの微高地の背後にある旧水田は後背湿地に対応し、細粒の土は浸透しにくい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1217", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 深さをAと同じにしている。自然堤防は川沿いの微高地Aに対応し、背後の低地Bとは区別する。」", "options": ["選択肢3", "地区", "期間", "データ"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 深さをAと同じにしている。自然堤防は川沿いの微高地Aに対応し、背後の低地Bとは区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1218", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 深さは合うが、川沿いの微高地の背後という位置は後背湿地に対応する。扇状地は山地の出口に発達し、粗い礫は一般に水を通しやすい。」", "options": ["選択肢4", "バス", "原料炭", "現在の地図"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 深さは合うが、川沿いの微高地の背後という位置は後背湿地に対応する。扇状地は山地の出口に発達し、粗い礫は一般に水を通しやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1219", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 決壊・越水はなかったという条件に反する。河川水が流入する外水氾濫と、雨水が排出できない内水氾濫を区別する。」", "options": ["選択肢1", "A（日本）", "輸送機関", "山頂"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 決壊・越水はなかったという条件に反する。河川水が流入する外水氾濫と、雨水が排出できない内水氾濫を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1220", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 河川水位の上昇が地下水面を下げるとはいえない。地下水面が低いこと自体を浸透低下の理由にするのも逆で、提示された比較では排水口と河川の水位差に着目する。」", "options": ["選択肢2", "主要河川", "前期", "農場"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 河川水位の上昇が地下水面を下げるとはいえない。地下水面が低いこと自体を浸透低下の理由にするのも逆で、提示された比較では排水口と河川の水位差に着目する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1221", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 河口低地では河川水位が高いと重力で排水しにくい。ポンプ能力も限られれば、域内に降った雨による内水氾濫が生じる。」", "options": ["選択肢3", "産業", "40〜64歳", "地域"], "ans": 0, "exp": "正解は「選択肢3」です。正解 河口低地では河川水位が高いと重力で排水しにくい。ポンプ能力も限られれば、域内に降った雨による内水氾濫が生じる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1222", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 河口低地は勾配が小さく、河川水位が上がれば自然排水の水位差は小さくなる。説明の方向が逆である。」", "options": ["選択肢4", "P 西側", "地区", "輸送機関"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 河口低地は勾配が小さく、河川水位が上がれば自然排水の水位差は小さくなる。説明の方向が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1223", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 速やかに排水する水路の機能と一時的に水をためる貯留の機能は違う。貯留量の増加は一般にピークを遅らせ緩める方向に働く。」", "options": ["選択肢1", "河川水面と排水口の高低", "作物", "年齢層"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 速やかに排水する水路の機能と一時的に水をためる貯留の機能は違う。貯留量の増加は一般にピークを遅らせ緩める方向に働く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1224", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 市街地の舗装は浸透を妨げ、排水路は水を河川へ速く集める。表面流の増加と移動時間の短縮が、早く高いピークを説明する。」", "options": ["選択肢2", "総流出量", "作物X", "海外就労者から家族への送金"], "ans": 0, "exp": "正解は「選択肢2」です。正解 市街地の舗装は浸透を妨げ、排水路は水を河川へ速く集める。表面流の増加と移動時間の短縮が、早く高いピークを説明する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1225", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 森林減少では樹木による蒸発散は減る側に働く。流出が増える方向は合うが、水を大気へ戻す過程の変化が逆である。」", "options": ["選択肢3", "Q：日本海側", "P 西側", "A（日本）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 森林減少では樹木による蒸発散は減る側に働く。流出が増える方向は合うが、水を大気へ戻す過程の変化が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1226", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 不浸透面が増えると地下へ浸透する割合は低下する側に働く。地下水流出の増加で都市化後の速い流出を説明するのは適切でない。」", "options": ["選択肢4", "計画", "最大流量", "出荷先"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 不浸透面が増えると地下へ浸透する割合は低下する側に働く。地下水流出の増加で都市化後の速い流出を説明するのは適切でない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1227", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 降雨量は400,000×0.1＝40,000m³。流出率の差0.4を掛けると増加分は16,000m³で、貯留は流出の時間分散をねらう。」", "options": ["選択肢1", "選択肢2", "放牧地", "最大流量"], "ans": 0, "exp": "正解は「選択肢1」です。正解 降雨量は400,000×0.1＝40,000m³。流出率の差0.4を掛けると増加分は16,000m³で、貯留は流出の時間分散をねらう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1228", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 100mmは0.1mである。単位換算か面積換算で一桁小さくなっている。増加率0.4を掛ける前の降雨総量を確認する。」", "options": ["選択肢2", "P–Q", "選択肢1", "計画"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 100mmは0.1mである。単位換算か面積換算で一桁小さくなっている。増加率0.4を掛ける前の降雨総量を確認する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1229", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 28,000m³は市街地化後の総流出量であり増加分ではない。また貯留と河道の流下能力向上を取り違えている。」", "options": ["選択肢3", "低い平均気温", "侵食", "徒歩分析"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 28,000m³は市街地化後の総流出量であり増加分ではない。また貯留と河道の流下能力向上を取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1230", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 容量は正しいが、貯留のねらいを河道拡幅などと混同している。一時貯留は速やかな下流到達をねらうものではない。」", "options": ["選択肢4", "地理総合，地理探究", "地理総合，歴史総合，公共", "系統地理"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 容量は正しいが、貯留のねらいを河道拡幅などと混同している。一時貯留は速やかな下流到達をねらうものではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1231", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 遅延前は13時が80＋60＝140。Qを1時間遅らせると13時は80＋20＝100、14時は40＋60＝100で最大が低下する。」", "options": ["選択肢1", "地誌", "熱帯（A）", "冷帯（D）"], "ans": 0, "exp": "正解は「選択肢1」です。正解 遅延前は13時が80＋60＝140。Qを1時間遅らせると13時は80＋20＝100、14時は40＋60＝100で最大が低下する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1232", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 総水量が同じでも到達時間の分布が変わればピークは変わる。治水では量と時間の両方が重要である。」", "options": ["選択肢2", "熱帯（A）", "試験", "気候"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 総水量が同じでも到達時間の分布が変わればピークは変わる。治水では量と時間の両方が重要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1233", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 合流する水量は同時刻ごとに足す。最大値同士を引いて合流点の流量を計算することはできない。」", "options": ["選択肢3", "冷帯（D）", "気候", "主要作物の栽培条件と主産地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 合流する水量は同時刻ごとに足す。最大値同士を引いて合流点の流量を計算することはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1234", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 遅らせるとPのピーク80とQのピーク60は別時刻になる。180m³/秒となる時刻は表から得られない。」", "options": ["選択肢4", "共通テスト", "その他", "主な工業"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 遅らせるとPのピーク80とQのピーク60は別時刻になる。180m³/秒となる時刻は表から得られない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1235", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 急崖の崩壊、谷沿いを水と土砂が流下、斜面の土塊がすべり面に沿って移動という三つの特徴に対応する。」", "options": ["選択肢1", "地形", "エネルギー資源", "時差"], "ans": 0, "exp": "正解は「選択肢1」です。正解 急崖の崩壊、谷沿いを水と土砂が流下、斜面の土塊がすべり面に沿って移動という三つの特徴に対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1236", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは水と巨礫が谷沿いに運ばれた土石流である。Rのまとまった地面の移動を流水の作用と混同している。」", "options": ["選択肢2", "大地形", "人口", "利益相反の有無"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Qは水と巨礫が谷沿いに運ばれた土石流である。Rのまとまった地面の移動を流水の作用と混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1237", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pでは谷沿いの流れが示されず急崖の崩壊が示される。Qを崖直下の崩落だけで説明することはできない。」", "options": ["選択肢3", "その他", "図法", "A年"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pでは谷沿いの流れが示されず急崖の崩壊が示される。Qを崖直下の崩落だけで説明することはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1238", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地すべりは比較的緩い斜面でも土塊がまとまって移動する。PとRの特徴を逆にしている。」", "options": ["選択肢4", "食料問題", "調査対象", "答えを見れば分かる"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 地すべりは比較的緩い斜面でも土塊がまとまって移動する。PとRの特徴を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1239", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「P側／谷沿いの泥流：Q側」", "options": ["細かい火山灰", "鉱産資源", "気候・自然環境", "候補"], "ans": 0, "exp": "正解は「細かい火山灰」です。P側／谷沿いの泥流：Q側", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1240", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「P側／谷沿いの泥流：火口の北側」", "options": ["細かい火山灰", "主な工業", "A年", "旧版地図"], "ans": 0, "exp": "正解は「細かい火山灰」です。P側／谷沿いの泥流：火口の北側", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1241", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「Q側／谷沿いの泥流：P側」", "options": ["細かい火山灰", "村落", "2択から決められない", "雲底"], "ans": 0, "exp": "正解は「細かい火山灰」です。Q側／谷沿いの泥流：P側", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1242", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「火口の西側／谷沿いの泥流：Q側」", "options": ["細かい火山灰", "図法", "地図", "乾季（11〜3月）"], "ans": 0, "exp": "正解は「細かい火山灰」です。火口の西側／谷沿いの泥流：Q側", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1243", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 西風は西から東へ吹くので、細かい灰は東側Pへ運ばれる。泥流は重力によって南西へ下る谷沿いのQへ向かう。」", "options": ["選択肢1", "GIS", "データ", "時間帯"], "ans": 0, "exp": "正解は「選択肢1」です。正解 西風は西から東へ吹くので、細かい灰は東側Pへ運ばれる。泥流は重力によって南西へ下る谷沿いのQへ向かう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1244", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 灰の方向はよいが、泥流が向かう方向は図の谷に対応させる。上空の風から泥流の行先は決められない。」", "options": ["選択肢2", "調査方法", "堆積物", "貨物"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 灰の方向はよいが、泥流が向かう方向は図の谷に対応させる。上空の風から泥流の行先は決められない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1245", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 上空の風と谷の下り方向を逆に割り当てている。空中の灰と地表の泥流は移動を支配する条件が違う。」", "options": ["選択肢3", "地図・GIS・地形", "1日目", "後期"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 上空の風と谷の下り方向を逆に割り当てている。空中の灰と地表の泥流は移動を支配する条件が違う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1246", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 西風は西へ向かう風ではない。風向は吹いてくる方角で呼ぶため、火山灰の風下は東側になる。」", "options": ["選択肢4", "人口・都市・生活文化", "時刻帯", "海外へ出国した20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 西風は西へ向かう風ではない。風向は吹いてくる方角で呼ぶため、火山灰の風下は東側になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1247", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 火砕流は高温の火山灰・岩塊と火山ガスが一体となって流下する現象で、水と土砂の混合物である泥流とは異なる。Qの説明は合う。」", "options": ["選択肢1", "A年", "乾季（11〜3月）", "作物"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 火砕流は高温の火山灰・岩塊と火山ガスが一体となって流下する現象で、水と土砂の混合物である泥流とは異なる。Qの説明は合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1248", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは噴火時の熱による融雪が水を供給する火山泥流と考えられる。Qは降雨が火山灰などの堆積物を再移動させた現象で、噴火が続かなくても生じ得る。」", "options": ["選択肢2", "用語があいまい", "期間", "産業"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pは噴火時の熱による融雪が水を供給する火山泥流と考えられる。Qは降雨が火山灰などの堆積物を再移動させた現象で、噴火が続かなくても生じ得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1249", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの積雪期の噴火と水・土砂の流下を、砂質地盤の噴砂と取り違えている。Qも雨で再移動した土砂であって、高温ガスを伴う火砕流ではない。」", "options": ["選択肢3", "時間が足りない", "原料炭", "指標"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pの積雪期の噴火と水・土砂の流下を、砂質地盤の噴砂と取り違えている。Qも雨で再移動した土砂であって、高温ガスを伴う火砕流ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1250", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは合うが、Qは降雨後に堆積物が動いている。溶融した岩石が火口などから流れ出る溶岩流と区別する。」", "options": ["選択肢4", "斜面", "輸送機関", "観光地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pは合うが、Qは降雨後に堆積物が動いている。溶融した岩石が火口などから流れ出る溶岩流と区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1251", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 河川洪水は決壊箇所から離れた場所にも及び得る。内水は本流決壊による外水ではなく、域内の排水過程を扱う。」", "options": ["選択肢1", "Pからの水平距離", "前期", "P–Q"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 河川洪水は決壊箇所から離れた場所にも及び得る。内水は本流決壊による外水ではなく、域内の排水過程を扱う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1252", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 河川からあふれる外水と、地域内の雨水の排出不足による内水は異なる。背後の低地は内水がたまりやすい場合がある。」", "options": ["選択肢2", "データ", "40〜64歳", "地理総合，歴史総合，公共"], "ans": 0, "exp": "正解は「選択肢2」です。正解 河川からあふれる外水と、地域内の雨水の排出不足による内水は異なる。背後の低地は内水がたまりやすい場合がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1253", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 河川洪水の浸水想定は年平均雨量で描くものではない。各想定降雨の条件と河川・排水施設のモデルを確認する必要がある。」", "options": ["選択肢3", "礫・砂・泥の割合", "地区", "温帯（C）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 河川洪水の浸水想定は年平均雨量で描くものではない。各想定降雨の条件と河川・排水施設のモデルを確認する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1254", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 内水と外水を地形的な位置だけで入れ替えている。内水は域内雨水の排出不良、河川洪水は河川からの氾濫を扱う。」", "options": ["選択肢4", "旧版地図", "作物", "地形"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 内水と外水を地形的な位置だけで入れ替えている。内水は域内雨水の排出不良、河川洪水は河川からの氾濫を扱う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1255", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 埋立てによる移動方向を逆にしている。旧浸水到達点は現在の海岸よりさらに内陸側に位置し、海側へ移るわけではない。」", "options": ["選択肢1", "12〜2月／6〜8月の各月降水量", "作物X", "ホイットルセイの農業地域区分"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 埋立てによる移動方向を逆にしている。旧浸水到達点は現在の海岸よりさらに内陸側に位置し、海側へ移るわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1256", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 旧海岸を基準にした300mを、新海岸を基準にした距離として使っている。海岸線が前進した600mを加える必要がある。」", "options": ["選択肢2", "3日目", "P 西側", "工業の変化"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 旧海岸を基準にした300mを、新海岸を基準にした距離として使っている。海岸線が前進した600mを加える必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1257", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 距離は正しいが、陸地が海側へ広がる変化は海岸線の前進である。侵食などで陸側へ移る後退と区別する。」", "options": ["選択肢3", "時刻帯", "最大流量", "図法"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 距離は正しいが、陸地が海側へ広がる変化は海岸線の前進である。侵食などで陸側へ移る後退と区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1258", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 海岸線が沖へ600m前進したので、旧海岸より内陸300mの到達点までの距離は600＋300＝900mとなる。これは昔の記録の位置復元で、現在の津波の到達範囲の予測とは別である。」", "options": ["選択肢4", "季節", "放牧地", "情報の限界"], "ans": 0, "exp": "正解は「選択肢4」です。正解 海岸線が沖へ600m前進したので、旧海岸より内陸300mの到達点までの距離は600＋300＝900mとなる。これは昔の記録の位置復元で、現在の津波の到達範囲の予測とは別である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1259", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 指定避難所と指定緊急避難場所は役割が違う。Aは避難所でも洪水の緊急避難場所ではなく、立地条件を災害別に読む必要がある。」", "options": ["選択肢1", "農場", "選択肢2", "防災・環境・地域調査"], "ans": 0, "exp": "正解は「選択肢1」です。正解 指定避難所と指定緊急避難場所は役割が違う。Aは避難所でも洪水の緊急避難場所ではなく、立地条件を災害別に読む必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1260", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 避難所指定は洪水からの緊急退避の適否をそのまま保証しない。逆に緊急避難場所指定から長期滞在設備も判断できない。」", "options": ["選択肢2", "林齢構成", "侵食", "時間が足りない"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 避難所指定は洪水からの緊急退避の適否をそのまま保証しない。逆に緊急避難場所指定から長期滞在設備も判断できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1261", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Bは段丘上でも急斜面に隣接している。洪水への適否と土砂災害への適否は別で、表の土砂災害欄も不指定である。」", "options": ["選択肢3", "時間帯", "地理総合，歴史総合，公共", "地点"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Bは段丘上でも急斜面に隣接している。洪水への適否と土砂災害への適否は別で、表の土砂災害欄も不指定である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1262", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 指定は災害種別ごとであり、Aには地震の指定がある。Bの段丘面という位置だけで隣接斜面の危険を除くこともできない。」", "options": ["選択肢4", "原料炭", "熱帯（A）", "堆積物"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 指定は災害種別ごとであり、Aには地震の指定がある。Bの段丘面という位置だけで隣接斜面の危険を除くこともできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1263", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 橋の本数だけで経路の独立性は判断できない。共通の道路区間が途絶すれば二つの橋を使った経路も使えない。」", "options": ["選択肢1", "用地", "試験", "3日目"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 橋の本数だけで経路の独立性は判断できない。共通の道路区間が途絶すれば二つの橋を使った経路も使えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1264", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 二つの橋の先に共通区間Sがあるため、そこが切れれば両方の既存経路が失われる。RはSを迂回して接続を確保する。」", "options": ["選択肢2", "100,000人", "気候", "雨季（6〜9月）"], "ans": 0, "exp": "正解は「選択肢2」です。正解 二つの橋の先に共通区間Sがあるため、そこが切れれば両方の既存経路が失われる。RはSを迂回して接続を確保する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1265", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 図の道路は双方向であり、途絶は往復どちらの接続にも影響する。進行方向で結論が変わる条件はない。」", "options": ["選択肢3", "現在", "その他", "方式"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 図の道路は双方向であり、途絶は往復どちらの接続にも影響する。進行方向で結論が変わる条件はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1266", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qの経路もSを通るので同時に途絶する。図の分岐と合流を追い、橋ごとに独立だと決めつけない。」", "options": ["選択肢4", "年齢層", "エネルギー資源", "用地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Qの経路もSを通るので同時に途絶する。図の分岐と合流を追い、橋ごとに独立だと決めつけない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1267", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 北風はこの湾では沖へ向かう方向である。吹き寄せによる湾奥の海面上昇を説明する方向が逆である。」", "options": ["選択肢1", "40〜64歳", "人口", "前期"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 北風はこの湾では沖へ向かう方向である。吹き寄せによる湾奥の海面上昇を説明する方向が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1268", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 湾の開きと風向を合わせると北風は湾口へ向かう。遠浅で吹き寄せが強まりやすいことを風向を無視して使っている。」", "options": ["選択肢2", "海外へ出国した20〜39歳人口", "図法", "出国前の20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 湾の開きと風向を合わせると北風は湾口へ向かう。遠浅で吹き寄せが強まりやすいことを風向を無視して使っている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1269", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 風向は合うが海水の移動方向が逆である。南からの風は湾口から湾奥へ吹く。」", "options": ["選択肢3", "住宅地", "調査対象", "区域"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 風向は合うが海水の移動方向が逆である。南からの風は湾口から湾奥へ吹く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1270", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 南に開く湾で南から吹く風は、海水を北側の湾奥へ押す。台風の東側で南寄りの強い風となる配置と対応する。」", "options": ["選択肢4", "区域", "気候・自然環境", "降水季節性"], "ans": 0, "exp": "正解は「選択肢4」です。正解 南に開く湾で南から吹く風は、海水を北側の湾奥へ押す。台風の東側で南寄りの強い風となる配置と対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1271", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 最大差は22時であり、両地点の標高もそろえている。高度差による低温を主因とする条件ではない。」", "options": ["選択肢1", "C（中国沿海部）", "A年", "河川水面と排水口の高低"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 最大差は22時であり、両地点の標高もそろえている。高度差による低温を主因とする条件ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1272", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 時刻は合うが、蓄えた熱を夜も保持・放出することが市街地の高温に関係する。熱を失いやすいという説明が逆である。」", "options": ["選択肢2", "作物X", "2択から決められない", "放牧地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 時刻は合うが、蓄えた熱を夜も保持・放出することが市街地の高温に関係する。熱を失いやすいという説明が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1273", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 最大差は14時ではない。緑地の蒸発散による冷却は日射がある日中に重要で、提示した因果も逆である。」", "options": ["選択肢3", "出荷先", "地図", "選択肢4"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 最大差は14時ではない。緑地の蒸発散による冷却は日射がある日中に重要で、提示した因果も逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1274", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 差は6時2℃、14時1℃、22時4℃。人工被覆が日中の熱を保持し、建物の密集も夜間の冷却を妨げる。」", "options": ["選択肢4", "Q 東側", "データ", "地理総合，地理探究"], "ans": 0, "exp": "正解は「選択肢4」です。正解 差は6時2℃、14時1℃、22時4℃。人工被覆が日中の熱を保持し、建物の密集も夜間の冷却を妨げる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1275", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 標高差による気温低下が混ざるため、観測差を舗装・緑地の差だけに帰すことはできない。」", "options": ["選択肢1", "指標", "堆積物", "乾燥帯（B）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 標高差による気温低下が混ざるため、観測差を舗装・緑地の差だけに帰すことはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1276", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 場所が近くても観測時刻が異なると日変化を含む。市街地と緑地で同時刻に測ることが重要である。」", "options": ["選択肢2", "時刻", "1日目", "私大（一般選抜）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 場所が近くても観測時刻が異なると日変化を含む。市街地と緑地で同時刻に測ることが重要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1277", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 標高はそろうが海からの距離が異なり、海風の影響も違い得る。土地被覆の比較に別の要因が強く混ざる。」", "options": ["選択肢3", "放牧地", "時刻帯", "その他"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 標高はそろうが海からの距離が異なり、海風の影響も違い得る。土地被覆の比較に別の要因が強く混ざる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1278", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 標高による気温差、海の影響、時刻の違いをできるだけそろえることで、土地被覆の差を検討しやすくなる。」", "options": ["選択肢4", "中心部", "乾季（11〜3月）", "工業立地"], "ans": 0, "exp": "正解は「選択肢4」です。正解 標高による気温差、海の影響、時刻の違いをできるだけそろえることで、土地被覆の差を検討しやすくなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1279", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 原因となる排出の削減と、影響への対応を逆にしている。対策の主目的を一つずつ読む。」", "options": ["選択肢1", "選択肢3", "期間", "生活文化"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 原因となる排出の削減と、影響への対応を逆にしている。対策の主目的を一つずつ読む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1280", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは燃料使用を減らして温室効果ガスの排出を抑える緩和、Qは高温による品質低下への対応である適応に当たる。」", "options": ["選択肢2", "徒歩分析", "原料炭", "調査方法"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pは燃料使用を減らして温室効果ガスの排出を抑える緩和、Qは高温による品質低下への対応である適応に当たる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1281", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高温耐性品種の導入は高温影響を小さくする主目的であり、排出削減そのものを主目的とする対策ではない。」", "options": ["選択肢3", "細かい火山灰", "輸送機関", "世界の諸地域・日本"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 高温耐性品種の導入は高温影響を小さくする主目的であり、排出削減そのものを主目的とする対策ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1282", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 乾燥機の燃料削減はここでは排出削減が主目的である。影響への備えと原因物質の抑制を区別する。」", "options": ["選択肢4", "地理総合，歴史総合，公共", "前期", "2択から決められない"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 乾燥機の燃料削減はここでは排出削減が主目的である。影響への備えと原因物質の抑制を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1283", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは(100＋30−10)÷10＝12、Bは(40＋5−25)÷2＝10。域内生産に伴う排出と、その製品を使う地域に対応する排出は異なる。」", "options": ["選択肢1", "地理総合", "40〜64歳", "Pからの水平距離"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Aは(100＋30−10)÷10＝12、Bは(40＋5−25)÷2＝10。域内生産に伴う排出と、その製品を使う地域に対応する排出は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1284", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 120と20は総量で、単位は百万tである。1人当たりのtへ直すには人口の百万人で割る。」", "options": ["選択肢2", "乾燥帯（B）", "地区", "地下水"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 120と20は総量で、単位は百万tである。1人当たりのtへ直すには人口の百万人で割る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1285", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 輸入と輸出の符号が逆である。消費する輸入品を加え、域外で消費される輸出品を差し引く。」", "options": ["選択肢3", "寒帯（E）", "作物", "2日目"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 輸入と輸出の符号が逆である。消費する輸入品を加え、域外で消費される輸出品を差し引く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1286", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 これは域内排出だけを人口で割った値である。輸入品の生産時排出は域外で生じるので、域内排出に含まれない。」", "options": ["選択肢4", "国公立二次（論述）", "作物X", "季節"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 これは域内排出だけを人口で割った値である。輸入品の生産時排出は域外で生じるので、域内排出に含まれない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1287", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 増減率は引き算では結び付けられない。比較年の火力発電量は総量と構成比を掛けて求める。」", "options": ["選択肢1", "気候", "P 西側", "期間"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 増減率は引き算では結び付けられない。比較年の火力発電量は総量と構成比を掛けて求める。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1288", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 30%は火力の構成比の相対的な減少率である。総発電量が増えているので、そのまま総排出量には使えない。」", "options": ["選択肢2", "河川がつくる地形", "最大流量", "拠点"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 30%は火力の構成比の相対的な減少率である。総発電量が増えているので、そのまま総排出量には使えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1289", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 15ポイントは構成比の差であって排出削減率ではない。割合の差と総量の変化を分けて考える。」", "options": ["選択肢3", "ホイットルセイの農業地域区分", "放牧地", "現在"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 15ポイントは構成比の差であって排出削減率ではない。割合の差と総量の変化を分けて考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1290", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 火力発電量は100×0.5＝50から140×0.35＝49へ変わる。排出係数一定なら総排出量も1÷50＝2%減となる。」", "options": ["選択肢4", "林業・水産業", "選択肢1", "65歳以上"], "ans": 0, "exp": "正解は「選択肢4」です。正解 火力発電量は100×0.5＝50から140×0.35＝49へ変わる。排出係数一定なら総排出量も1÷50＝2%減となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1291", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 70%削減は元の30%が残ることを意味する。70%が残ると読み違えると1.80×0.70＋0.03＝1.29となる。」", "options": ["選択肢1", "工業立地", "侵食", "バス"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 70%削減は元の30%が残ることを意味する。70%が残ると読み違えると1.80×0.70＋0.03＝1.29となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1292", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは1.80×0.30＋0.03＝0.57、Bは0.60＋0.20＝0.80。距離だけではなく栽培方法と輸送方法の両方が比較に必要となる。」", "options": ["選択肢2", "人口", "地理総合，歴史総合，公共", "作物X"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Aは1.80×0.30＋0.03＝0.57、Bは0.60＋0.20＝0.80。距離だけではなく栽培方法と輸送方法の両方が比較に必要となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1293", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 設問で改善するのはAの生産段階であり輸送段階ではない。合計1.83へ0.30を掛けると削減対象を広げてしまう。」", "options": ["選択肢3", "民族・宗教・言語", "熱帯（A）", "流通"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 設問で改善するのはAの生産段階であり輸送段階ではない。合計1.83へ0.30を掛けると削減対象を広げてしまう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1294", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 大小関係は正しいが、Aの輸送距離と輸送排出は改善前後で変えていない。順位が逆転した主因は暖房栽培の生産段階の省エネである。」", "options": ["選択肢4", "時差", "試験", "Q：日本海側"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 大小関係は正しいが、Aの輸送距離と輸送排出は改善前後で変えていない。順位が逆転した主因は暖房栽培の生産段階の省エネである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1295", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 日本海側は冬の季節風の風上側で雪雲の影響を受けやすい。太平洋側の風下での乾燥・晴天と地域を逆にしている。」", "options": ["選択肢1", "地球的課題", "気候", "選択肢3"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 日本海側は冬の季節風の風上側で雪雲の影響を受けやすい。太平洋側の風下での乾燥・晴天と地域を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1296", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 同緯度なら太陽高度の季節変化はほぼ共通。日本海側の冬の曇天・降雪と、強い季節風という地域条件を合わせて判断する。」", "options": ["選択肢2", "情報の限界", "その他", "科目名"], "ans": 0, "exp": "正解は「選択肢2」です。正解 同緯度なら太陽高度の季節変化はほぼ共通。日本海側の冬の曇天・降雪と、強い季節風という地域条件を合わせて判断する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1297", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 日射の説明はよいが、積雪の水が融雪して流出する時期と真冬を取り違えている。貯水池を持たない流れ込み式の供給を積雪量から直ちに最大と見込めない。」", "options": ["選択肢3", "気候・自然環境", "エネルギー資源", "熱帯（A）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 日射の説明はよいが、積雪の水が融雪して流出する時期と真冬を取り違えている。貯水池を持たない流れ込み式の供給を積雪量から直ちに最大と見込めない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1298", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 揚水発電は水をくみ上げる電力を使ってエネルギーを蓄える。需給の時間調整には役立つが、揚水に必要な電力を無視して独立のエネルギー供給源とは評価できない。」", "options": ["選択肢4", "世界の諸地域・日本", "人口", "国公立二次（論述）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 揚水発電は水をくみ上げる電力を使ってエネルギーを蓄える。需給の時間調整には役立つが、揚水に必要な電力を無視して独立のエネルギー供給源とは評価できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1299", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 等高線方向の植生帯は斜面を流れる水の勢いを弱め、地表被覆は雨滴が土を直接たたく作用を抑える。既存耕地の表土保全につながる。」", "options": ["選択肢1", "B年", "図法", "海岸の地形"], "ans": 0, "exp": "正解は「選択肢1」です。正解 等高線方向の植生帯は斜面を流れる水の勢いを弱め、地表被覆は雨滴が土を直接たたく作用を抑える。既存耕地の表土保全につながる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1300", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 植生帯の方向はよいが、その間の裸地では雨滴の衝撃や表面流で土が流出しやすい。雨季にも地表被覆を保つ案の方が、発生源の表土を保護できる。」", "options": ["選択肢2", "図表になると迷う", "調査対象", "鉱産資源"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 植生帯の方向はよいが、その間の裸地では雨滴の衝撃や表面流で土が流出しやすい。雨季にも地表被覆を保つ案の方が、発生源の表土を保護できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1301", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 斜面方向に水を集中させると侵食を強め得る。速く排水することと表土を保全することを混同している。」", "options": ["選択肢3", "答えを見れば分かる", "気候・自然環境", "民族・宗教・言語"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 斜面方向に水を集中させると侵食を強め得る。速く排水することと表土を保全することを混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1302", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 下流の川幅の変更は上流畑の表土流出そのものを抑えない。発生源の斜面で水の流れと被覆を変える必要がある。」", "options": ["選択肢4", "地図", "A年", "調査対象"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 下流の川幅の変更は上流畑の表土流出そのものを抑えない。発生源の斜面で水の流れと被覆を変える必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1303", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは使用済みの瓶を原料に戻して再製造するリサイクルである。ごみの発生抑制というリデュースと工程を区別する。」", "options": ["選択肢1", "地点", "2択から決められない", "人口・都市・生活文化"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Qは使用済みの瓶を原料に戻して再製造するリサイクルである。ごみの発生抑制というリデュースと工程を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1304", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは使った製品をそのまま再使用するリユースである。資源投入を減らす効果はあり得るが、示された工程の分類をリデュースとしない。」", "options": ["選択肢2", "位置", "地図", "図表になると迷う"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pは使った製品をそのまま再使用するリユースである。資源投入を減らす効果はあり得るが、示された工程の分類をリデュースとしない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1305", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 再使用と再資源化の名称が逆である。洗浄して同じ瓶を使う過程と、溶かし直す過程を分ける。」", "options": ["選択肢3", "地下水", "データ", "領域"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 再使用と再資源化の名称が逆である。洗浄して同じ瓶を使う過程と、溶かし直す過程を分ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1306", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 形を保った再使用はリユース、原料として再資源化するのはリサイクルである。回収や洗浄の輸送条件も負荷に関係する。」", "options": ["選択肢4", "現在の地図", "堆積物", "礫・砂・泥の割合"], "ans": 0, "exp": "正解は「選択肢4」です。正解 形を保った再使用はリユース、原料として再資源化するのはリサイクルである。回収や洗浄の輸送条件も負荷に関係する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1307", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 600gは2,190tを住民の365万人日だけで割った値である。設問では観光客の滞在も分母へ加える。」", "options": ["選択肢2", "雲底", "時刻帯", "地表からの深さ（m）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 600gは2,190tを住民の365万人日だけで割った値である。設問では観光客の滞在も分母へ加える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1308", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 住民365万人日と観光客73万人日で438万人日。2,190,000,000g÷4,380,000＝500gとなり、活動量に近い分母へ変わる。」", "options": ["選択肢3", "さらに下", "乾季（11〜3月）", "林齢構成"], "ans": 0, "exp": "正解は「選択肢3」です。正解 住民365万人日と観光客73万人日で438万人日。2,190,000,000g÷4,380,000＝500gとなり、活動量に近い分母へ変わる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1309", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 観光客の73万人日は延べ滞在量であり、1万人という人口へそのまま足すと単位が異なる。分母は住民と観光客の人日でそろえる。」", "options": ["選択肢4", "雨季（6〜9月）", "期間", "輸送"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 観光客の73万人日は延べ滞在量であり、1万人という人口へそのまま足すと単位が異なる。分母は住民と観光客の人日でそろえる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1310", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 排水に関する説明は合うが、15ポイントは有効利用率の差である。作物へ必要な水量18を改善後の率で割って取水量を求める。」", "options": ["選択肢1", "総労働時間", "原料炭", "10年前"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 排水に関する説明は合うが、15ポイントは有効利用率の差である。作物へ必要な水量18を改善後の率で割って取水量を求める。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1311", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 削減率は正しいが、表面からの蒸発は地下から上向きの水移動と塩類の表層への集積につながり得る。下方へ洗い流す過程と逆である。」", "options": ["選択肢2", "期間", "輸送機関", "40〜64歳"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 削減率は正しいが、表面からの蒸発は地下から上向きの水移動と塩類の表層への集積につながり得る。下方へ洗い流す過程と逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1312", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 農業取水は18÷0.45＝40で、総取水は100から80へ20%減。灌漑で入る塩などを溶かして排出する経路が塩類集積対策の検討対象になる。」", "options": ["選択肢3", "地域", "前期", "店舗"], "ans": 0, "exp": "正解は「選択肢3」です。正解 農業取水は18÷0.45＝40で、総取水は100から80へ20%減。灌漑で入る塩などを溶かして排出する経路が塩類集積対策の検討対象になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1313", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 削減率は農業取水だけでも30%ではなく約33.3%、総取水なら20%である。蒸発促進と下方への塩の溶脱も逆にしている。」", "options": ["選択肢4", "輸送", "40〜64歳", "主要河川"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 削減率は農業取水だけでも30%ではなく約33.3%、総取水なら20%である。蒸発促進と下方への塩の溶脱も逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1314", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 混合後の濃度は流量で重み付けする必要があり、(2×10＋4×3)÷13＝約2.46mg/Lとなる。単純平均3mg/LではAの大きな流量を反映しない。」", "options": ["選択肢1", "貨物", "地区", "Q 東側"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 混合後の濃度は流量で重み付けする必要があり、(2×10＋4×3)÷13＝約2.46mg/Lとなる。単純平均3mg/LではAの大きな流量を反映しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1315", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 濃度はBが高いが流量はAが大きい。負荷の大小には両者の積が必要で、濃度だけでは比較できない。」", "options": ["選択肢2", "時点", "作物", "P：太平洋側"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 濃度はBが高いが流量はAが大きい。負荷の大小には両者の積が必要で、濃度だけでは比較できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1316", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 負荷は濃度×流量に比例し、Aは2×10＝20、Bは4×3＝12でAが大きい。有機物の分解は酸素を消費する。」", "options": ["選択肢3", "前期", "作物X", "選択肢1"], "ans": 0, "exp": "正解は「選択肢3」です。正解 負荷は濃度×流量に比例し、Aは2×10＝20、Bは4×3＝12でAが大きい。有機物の分解は酸素を消費する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1317", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 負荷の比較は正しいが、分解で酸素を消費する過程を逆にしている。底層の酸素不足につながり得る。」", "options": ["選択肢4", "18〜24歳", "P 西側", "細かい火山灰"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 負荷の比較は正しいが、分解で酸素を消費する過程を逆にしている。底層の酸素不足につながり得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1318", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地下水面が下がれば空気に触れる部分が増える。酸素が減ることを分解促進の理由にしている点が逆である。」", "options": ["選択肢1", "65歳以上", "最大流量", "気候帯"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 地下水面が下がれば空気に触れる部分が増える。酸素が減ることを分解促進の理由にしている点が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1319", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 排水で空気に触れる部分では有機物の分解が進みやすくなる。新たな堆積が減ることだけでは、既に泥炭中にある炭素の放出増加を説明できない。」", "options": ["選択肢2", "海外就労者から家族への送金", "放牧地", "共通テスト"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 排水で空気に触れる部分では有機物の分解が進みやすくなる。新たな堆積が減ることだけでは、既に泥炭中にある炭素の放出増加を説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1320", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 排水による圧密は沈下に関係する場合があるが、物理的に体積が小さくなることと、有機物が分解されCO₂になることは別の過程である。」", "options": ["選択肢3", "店舗", "選択肢1", "河川がつくる地形"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 排水による圧密は沈下に関係する場合があるが、物理的に体積が小さくなることと、有機物が分解されCO₂になることは別の過程である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1321", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 水で満たされ酸素が少なかった泥炭が排水で空気に触れると分解が進み、炭素放出と体積の減少に関係する。」", "options": ["選択肢4", "作物", "侵食", "エネルギー資源"], "ans": 0, "exp": "正解は「選択肢4」です。正解 水で満たされ酸素が少なかった泥炭が排水で空気に触れると分解が進み、炭素放出と体積の減少に関係する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1322", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 植生が減ると地表を風から保護する作用は弱まる。地表付近の風を弱めることを飛散量の増加の理由にするのは向きが逆である。」", "options": ["選択肢1", "時期", "地理総合，歴史総合，公共", "村落"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 植生が減ると地表を風から保護する作用は弱まる。地表付近の風を弱めることを飛散量の増加の理由にするのは向きが逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1323", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 踏圧は土を締め固めて隙間や浸透を減らす側に働く。浸透の増加を表面流出の増加の理由にする説明も逆である。」", "options": ["選択肢2", "降水季節性", "熱帯（A）", "地球的課題"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 踏圧は土を締め固めて隙間や浸透を減らす側に働く。浸透の増加を表面流出の増加の理由にする説明も逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1324", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 過度の採食は地表に戻る植物体を減らし得る。植生の減少から有機物の増加を前提にすることはできず、有機物は一般に土粒子を団粒として結び付ける働きにも関わる。」", "options": ["選択肢3", "区分", "試験", "産業・資源・流通"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 過度の採食は地表に戻る植物体を減らし得る。植生の減少から有機物の増加を前提にすることはできず、有機物は一般に土粒子を団粒として結び付ける働きにも関わる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1325", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 自然条件が近い二地点で、家畜密度が高いAの植生減少と土砂飛散が大きい。過放牧に伴う地表保護の低下という仮説を、採食量・回復速度などの追加調査で検討できる。」", "options": ["選択肢4", "流通", "気候", "用語があいまい"], "ans": 0, "exp": "正解は「選択肢4」です。正解 自然条件が近い二地点で、家畜密度が高いAの植生減少と土砂飛散が大きい。過放牧に伴う地表保護の低下という仮説を、採食量・回復速度などの追加調査で検討できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1326", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 B内部の生息環境の改善と、離れたAへの移動経路の連結は別の課題である。Xの横断しにくさが残る。」", "options": ["選択肢1", "最大流量", "その他", "地図"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 B内部の生息環境の改善と、離れたAへの移動経路の連結は別の課題である。Xの横断しにくさが残る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1327", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 道路沿いの生息環境は増やせるが、A側からB側へ道路を横断する障壁は残る。道路に沿う連続性と、道路を越える連続性を区別する。」", "options": ["選択肢2", "P：太平洋側", "エネルギー資源", "地表勾配"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 道路沿いの生息環境は増やせるが、A側からB側へ道路を横断する障壁は残る。道路に沿う連続性と、道路を越える連続性を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1328", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 A・Bを結ぶ樹林帯の切断部Xをつなぐことが、対象種の移動経路の連続性を直接改善する。」", "options": ["選択肢3", "観光地", "人口", "12〜2月／6〜8月の各月降水量"], "ans": 0, "exp": "正解は「選択肢3」です。正解 A・Bを結ぶ樹林帯の切断部Xをつなぐことが、対象種の移動経路の連続性を直接改善する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1329", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 面積を増やす効果は考えられるが、AとBを隔てるXの分断を解消しないため設問の目的への直接性は低い。」", "options": ["選択肢4", "周辺部", "図法", "さらに下"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 面積を増やす効果は考えられるが、AとBを隔てるXの分断を解消しないため設問の目的への直接性は低い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1330", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 降雨後は流域から河川を通る流出、冬季は季節風や海流による輸送を検討できる。複数の経路が同じ海岸へ到達し得る。」", "options": ["選択肢1", "選択肢4", "調査対象", "産地"], "ans": 0, "exp": "正解は「選択肢1」です。正解 降雨後は流域から河川を通る流出、冬季は季節風や海流による輸送を検討できる。複数の経路が同じ海岸へ到達し得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1331", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 各地点の継続観測にはなるが、地点と調査時期が同時に違うため、量差が位置・季節・降雨のどれに対応するか分けにくい。」", "options": ["選択肢2", "侵食", "気候・自然環境", "原料炭"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 各地点の継続観測にはなるが、地点と調査時期が同時に違うため、量差が位置・季節・降雨のどれに対応するか分けにくい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1332", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 海底地形だけでは降雨に伴う陸からの流出を捉えられない。表示言語は製造・流通の手掛かりでも廃棄場所を確定しない。」", "options": ["選択肢3", "科目名", "A年", "時点"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 海底地形だけでは降雨に伴う陸からの流出を捉えられない。表示言語は製造・流通の手掛かりでも廃棄場所を確定しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1333", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 上流の降雨量は河川流出の検討に役立つ。一方、海から浜へ運ばれる過程には海から陸へ吹く風との関係も必要で、沖向きの風の日だけを選ぶと条件が偏る。」", "options": ["選択肢4", "系統地理", "2択から決められない", "25〜39歳"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 上流の降雨量は河川流出の検討に役立つ。一方、海から浜へ運ばれる過程には海から陸へ吹く風との関係も必要で、沖向きの風の日だけを選ぶと条件が偏る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1334", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 中央アジアの高山からの流れを熱帯モンスーン河川と取り違えている。降水表も夏の豪雨を示さず、露地の綿花を寒い冬の灌漑作物とする点も逆である。」", "options": ["選択肢1", "気候帯", "地図", "住宅地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 中央アジアの高山からの流れを熱帯モンスーン河川と取り違えている。降水表も夏の豪雨を示さず、露地の綿花を寒い冬の灌漑作物とする点も逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1335", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 流量の季節性は合うが、Dに季節を越す貯水施設がない条件では冬に流れ去った水を夏へ持ち越せない。水力発電の放流時期と下流の灌漑需要期を合わせる必要がある。」", "options": ["選択肢2", "温帯（C）", "データ", "時期"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 流量の季節性は合うが、Dに季節を越す貯水施設がない条件では冬に流れ去った水を夏へ持ち越せない。水力発電の放流時期と下流の灌漑需要期を合わせる必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1336", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 源流域では冬の低温で雪氷が蓄えられ、暖候期に融解が進む。露地の綿花は暖かい栽培期に水を必要とするため、冬の電力供給との交換で水を春夏へ回す調整が考えられる。」", "options": ["選択肢3", "試験", "堆積物", "P 西側"], "ans": 0, "exp": "正解は「選択肢3」です。正解 源流域では冬の低温で雪氷が蓄えられ、暖候期に融解が進む。露地の綿花は暖かい栽培期に水を必要とするため、冬の電力供給との交換で水を春夏へ回す調整が考えられる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1337", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 表の冬の平均気温は−12℃で、季節的な融雪による増水を冬に置くのは逆である。雪氷が融ける暖候期に自然流量が増えやすい。」", "options": ["選択肢4", "私大（一般選抜）", "1日目", "時刻"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 表の冬の平均気温は−12℃で、季節的な融雪による増水を冬に置くのは逆である。雪氷が融ける暖候期に自然流量が増えやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1338", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 シベリア高気圧はユーラシア大陸が冷える冬の現象である。地中海沿岸の7月の少雨を冬の東アジアの循環で説明している。」", "options": ["選択肢1", "プレート境界", "時刻帯", "周辺部"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 シベリア高気圧はユーラシア大陸が冷える冬の現象である。地中海沿岸の7月の少雨を冬の東アジアの循環で説明している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1339", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 赤道低圧帯では地表付近の空気が収束し、上昇に伴う降水が生じやすい。地中海沿岸の夏季乾燥を説明する帯ではない。」", "options": ["選択肢2", "海岸の地形", "乾季（11〜3月）", "低い平均気温"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 赤道低圧帯では地表付近の空気が収束し、上昇に伴う降水が生じやすい。地中海沿岸の夏季乾燥を説明する帯ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1340", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地中海沿岸で偏西風に伴う低気圧の通過が重要になるのは主に冬で、上昇気流は雲や降水を生む側に働く。夏の少雨の説明としては合わない。」", "options": ["選択肢3", "主要作物の栽培条件と主産地", "期間", "地理総合"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 地中海沿岸で偏西風に伴う低気圧の通過が重要になるのは主に冬で、上昇気流は雲や降水を生む側に働く。夏の少雨の説明としては合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1341", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 地中海性気候の夏は亜熱帯高圧帯の影響が強まり、下降気流のもとで乾燥しやすい。Pではその時期に宿泊客が多く、自然の水供給と観光需要が逆方向に動く。」", "options": ["選択肢4", "エネルギー資源", "原料炭", "試験"], "ans": 0, "exp": "正解は「選択肢4」です。正解 地中海性気候の夏は亜熱帯高圧帯の影響が強まり、下降気流のもとで乾燥しやすい。Pではその時期に宿泊客が多く、自然の水供給と観光需要が逆方向に動く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1342", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 11時台は既に40人が利用するため、80人を足すと120人となり輸送力100人を超える。空席分と総座席数を区別する。」", "options": ["選択肢1", "工業の変化", "輸送機関", "大地形"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 11時台は既に40人が利用するため、80人を足すと120人となり輸送力100人を超える。空席分と総座席数を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1343", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 10時に到着する客を到着前の9時台へ移せない。過去の空席は後の時間帯へ繰り越せないため、利用可能な時刻との対応が必要である。」", "options": ["選択肢2", "都市", "前期", "林業・水産業"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 10時に到着する客を到着前の9時台へ移せない。過去の空席は後の時間帯へ繰り越せないため、利用可能な時刻との対応が必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1344", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 10時台の超過は180−100＝80人だが、11時台の余裕は100−40＝60人。到着前の9時台へ移すことはできないので、表の時間帯の予約変更だけでは20人を吸収できない。」", "options": ["選択肢3", "生活文化", "40〜64歳", "都市"], "ans": 0, "exp": "正解は「選択肢3」です。正解 10時台の超過は180−100＝80人だが、11時台の余裕は100−40＝60人。到着前の9時台へ移すことはできないので、表の時間帯の予約変更だけでは20人を吸収できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1345", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 総需要240人は総輸送力300人より少ないが、9時台の未利用座席は10時以後に使えない。日総量だけでは集中する時間の混雑を評価できない。」", "options": ["選択肢4", "地形図", "地区", "GIS"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 総需要240人は総輸送力300人より少ないが、9時台の未利用座席は10時以後に使えない。日総量だけでは集中する時間の混雑を評価できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1346", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 600万円はAから域外へ支払われる額である。地域内に残る割合は1−0.6＝0.4となる。」", "options": ["選択肢1", "調査対象", "作物", "気候・自然環境"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 600万円はAから域外へ支払われる額である。地域内に残る割合は1−0.6＝0.4となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1347", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは1,000×10,000×0.4＝400万円、Bは500×20,000×0.7＝700万円。Bは地元での仕入れや賃金等へ残る割合が大きい。」", "options": ["選択肢2", "利益相反の有無", "作物X", "今の状態"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Aは1,000×10,000×0.4＝400万円、Bは500×20,000×0.7＝700万円。Bは地元での仕入れや賃金等へ残る割合が大きい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1348", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの1,000万円は消費総額であり、域外へ60%支払う分を引いていない。総売上と地域内に残る額は異なる。」", "options": ["選択肢3", "産業・資源・流通", "P 西側", "斜面"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Aの1,000万円は消費総額であり、域外へ60%支払う分を引いていない。総売上と地域内に残る額は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1349", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 300万円はBの域外支払いである。Bでは70%が地域内に残るので700万円となる。」", "options": ["選択肢4", "防災・環境・地域調査", "最大流量", "位置"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 300万円はBの域外支払いである。Bでは70%が地域内に残るので700万円となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1350", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 直線距離だけで交通を設定すると地形による迂回や非運転者の条件を見落とす。到達時間と便数を含めて判断する。」", "options": ["選択肢1", "今の状態", "放牧地", "標高データ"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 直線距離だけで交通を設定すると地形による迂回や非運転者の条件を見落とす。到達時間と便数を含めて判断する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1351", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 行政境界を越えること自体で到達のしやすさは決まらない。Bは直通バスがあり、この表ではAより所要時間が短い。」", "options": ["選択肢2", "2択から決められない", "選択肢1", "時刻帯"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 行政境界を越えること自体で到達のしやすさは決まらない。Bは直通バスがあり、この表ではAより所要時間が短い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1352", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 直線2kmでも道路距離は12kmで、表の所要時間も長い。施設集約だけで既存の地形・交通条件は解消しない。」", "options": ["選択肢3", "メッシュ", "侵食", "総労働時間"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 直線2kmでも道路距離は12kmで、表の所要時間も長い。施設集約だけで既存の地形・交通条件は解消しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1353", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは尾根を迂回しバスも少ないため、直線距離の近さが到達時間の短さを意味しない。拠点の集約には地域間交通との連携が必要になる。」", "options": ["選択肢4", "領域", "地理総合，歴史総合，公共", "鉄鉱石"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Aは尾根を迂回しバスも少ないため、直線距離の近さが到達時間の短さを意味しない。拠点の集約には地域間交通との連携が必要になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1354", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 既に改変された跡地の再利用で農地転用を避け、既存交通を使える。河川低地より高い段丘面という条件も洪水曝露を抑える方向に合う。」", "options": ["選択肢1", "候補", "熱帯（A）", "100,000人"], "ans": 0, "exp": "正解は「選択肢1」です。正解 既に改変された跡地の再利用で農地転用を避け、既存交通を使える。河川低地より高い段丘面という条件も洪水曝露を抑える方向に合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1355", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 干拓地は低平な土地で、農地の転用と自動車依存を伴う。平らさだけを安全や利便性と同一視できない。」", "options": ["選択肢2", "地表勾配", "試験", "18〜24歳"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 干拓地は低平な土地で、農地の転用と自動車依存を伴う。平らさだけを安全や利便性と同一視できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1356", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 後背湿地は低く排水しにくい地形で、農地転用と新規道路整備も必要になる。提示方針との適合がBより低い。」", "options": ["選択肢3", "堆積物", "気候", "地区"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 後背湿地は低く排水しにくい地形で、農地転用と新規道路整備も必要になる。提示方針との適合がBより低い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1357", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 既存交通は使えるが、旧河道という土地履歴は洪水などの条件を慎重に見る必要がある。段丘面と同等とはいえない。」", "options": ["選択肢4", "標高データ", "その他", "C（中国沿海部）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 既存交通は使えるが、旧河道という土地履歴は洪水などの条件を慎重に見る必要がある。段丘面と同等とはいえない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1358", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 水の貯留は合うが、観測では河口へ届く土砂が減っている。また堆積が優勢なら海岸は一般に海側へ前進する。」", "options": ["選択肢1", "2日目", "エネルギー資源", "区分"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 水の貯留は合うが、観測では河口へ届く土砂が減っている。また堆積が優勢なら海岸は一般に海側へ前進する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1359", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 ダムで水と土砂が貯留・捕捉されると洪水ピークを下げる一方、河口への土砂補給は減る。波による搬出に補給が追い付かないと海岸が後退し得る。」", "options": ["選択肢2", "山頂", "人口", "総流出量"], "ans": 0, "exp": "正解は「選択肢2」です。正解 ダムで水と土砂が貯留・捕捉されると洪水ピークを下げる一方、河口への土砂補給は減る。波による搬出に補給が追い付かないと海岸が後退し得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1360", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 三角州は河川が運ぶ土砂の堆積によってできる地形である。侵食地形と取り違えると上流からの供給減少の意味を捉えられない。」", "options": ["選択肢3", "地表からの深さ（m）", "図法", "中心部"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 三角州は河川が運ぶ土砂の堆積によってできる地形である。侵食地形と取り違えると上流からの供給減少の意味を捉えられない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1361", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 洪水ピークは水の流量であり侵食量の増加から低下を説明できない。河口の土砂量も増加ではなく減少している。」", "options": ["選択肢4", "乾季（11〜3月）", "調査対象", "侵食"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 洪水ピークは水の流量であり侵食量の増加から低下を説明できない。河口の土砂量も増加ではなく減少している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1362", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 山間地区の詳しい把握には役立つが、中心市街地を含む市全体の構成にはならない。地区人口の違いが必要になる。」", "options": ["選択肢1", "産地", "気候・自然環境", "地誌"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 山間地区の詳しい把握には役立つが、中心市街地を含む市全体の構成にはならない。地区人口の違いが必要になる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1363", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 調査地点に来ない住民も抽出対象にでき、地区の偏りを調整しながら市全体と地域差の両方を把握しやすい。」", "options": ["選択肢2", "方式", "A年", "寒帯（E）"], "ans": 0, "exp": "正解は「選択肢2」です。正解 調査地点に来ない住民も抽出対象にでき、地区の偏りを調整しながら市全体と地域差の両方を把握しやすい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1364", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 回答数を増やしても駅前に来ない人が含まれないという偏りは残る。標本数と対象の代表性を区別する。」", "options": ["選択肢3", "鉄鉱石", "2択から決められない", "プレート境界"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 回答数を増やしても駅前に来ない人が含まれないという偏りは残る。標本数と対象の代表性を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1365", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 バス利用者の空間分布は把握できるが、利用できない住民や別の交通を使う住民は含まれない。利用者の地区構成と市民の地区構成は一致するとは限らない。」", "options": ["選択肢4", "拠点", "地図", "食料問題"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 バス利用者の空間分布は把握できるが、利用できない住民や別の交通を使う住民は含まれない。利用者の地区構成と市民の地区構成は一致するとは限らない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1366", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 比較する空間範囲と用途の定義をそろえる。階ごとの用途変化を別に記録すれば、路面の衰退と建物全体の動きを区別できる。」", "options": ["選択肢1", "輸送機関", "データ", "人口"], "ans": 0, "exp": "正解は「選択肢1」です。正解 比較する空間範囲と用途の定義をそろえる。階ごとの用途変化を別に記録すれば、路面の衰退と建物全体の動きを区別できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1367", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 同じ建物でも複数店舗が入ったり用途が変わったりする。棟数の変化を店舗数へそのまま換算できない。」", "options": ["選択肢2", "10年前", "堆積物", "地形図"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 同じ建物でも複数店舗が入ったり用途が変わったりする。棟数の変化を店舗数へそのまま換算できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1368", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 1階だけと全階では対象が異なる。全階の店舗が増えても1階の路面店舗は減っている場合がある。」", "options": ["選択肢3", "後期", "1日目", "地図・GIS・地形"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 1階だけと全階では対象が異なる。全階の店舗が増えても1階の路面店舗は減っている場合がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1369", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 階ごとの店舗数が等しい根拠がなく、上層階への店舗移動という事実も示されている。平均化で路面店数は復元できない。」", "options": ["選択肢4", "25〜39歳", "時刻帯", "B年"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 階ごとの店舗数が等しい根拠がなく、上層階への店舗移動という事実も示されている。平均化で路面店数は復元できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1370", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 階級区分をそろえても集計区域の大きさは違う。全市を一色で示す図では中心部6,000と周辺部500の位置の違いは表せない。」", "options": ["選択肢1", "出国前の20〜39歳人口", "乾季（11〜3月）", "メッシュ"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 階級区分をそろえても集計区域の大きさは違う。全市を一色で示す図では中心部6,000と周辺部500の位置の違いは表せない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1371", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 全市平均は内部の人口配置を表さない。地区面積だけでは中心部へ何人集中しているか分からず、各地区の人口の情報が必要である。」", "options": ["選択肢2", "地区", "期間", "データ"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 全市平均は内部の人口配置を表さない。地区面積だけでは中心部へ何人集中しているか分からず、各地区の人口の情報が必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1372", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 地区密度の単純平均は(6,000＋500)÷2＝3,250で、全市1,600と異なる。密度を統合するには面積による重み、または人口合計÷面積合計を用いる。」", "options": ["選択肢3", "バス", "原料炭", "現在の地図"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 地区密度の単純平均は(6,000＋500)÷2＝3,250で、全市1,600と異なる。密度を統合するには面積による重み、または人口合計÷面積合計を用いる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1373", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 全市は16,000÷10＝1,600人/km²だが、中心部6,000、周辺部500で大きく異なる。広い単位の平均は内部差を隠し得る。」", "options": ["選択肢4", "A（日本）", "輸送機関", "山頂"], "ans": 0, "exp": "正解は「選択肢4」です。正解 全市は16,000÷10＝1,600人/km²だが、中心部6,000、周辺部500で大きく異なる。広い単位の平均は内部差を隠し得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1374", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 店舗の床面積や業種は商業機能を調べる資料だが、BとCは駅距離が異なる。等しい駅距離で経路差を見るという比較条件に合わない。」", "options": ["選択肢1", "主要河川", "前期", "農場"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 店舗の床面積や業種は商業機能を調べる資料だが、BとCは駅距離が異なる。等しい駅距離で経路差を見るという比較条件に合わない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-1375", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "
