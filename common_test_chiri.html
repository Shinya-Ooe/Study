}, {"id": "GEO-WEB-266", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「オーストラリアとニュージーランドの輸出構造を理解するため、表のP・Qを作った。国の対応と地域的背景として適切なのはどれか。」", "options": ["オセアニアの輸出と自然環境", "漁獲統計と資源評価", "読み取りと意見を分ける", "季節の移動と生活文化"], "ans": 0, "exp": "オーストラリアとニュージーランドの輸出構造を理解するため、表のP・Qを作った。国の対応と地域的背景として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-267", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「十勝地方のある畑で、毎年の主な作物を小麦、てんさい、豆類、ばれいしょの順に替える。この栽培方式の名称と、作物を替える目的の組合せとして適切なのはどれか。」", "options": ["北海道の畑作地域", "電源構成とエネルギー全体", "公共・政治経済、日本史とつなげて学ぶ", "内陸アジアの牧畜"], "ans": 0, "exp": "十勝地方のある畑で、毎年の主な作物を小麦、てんさい、豆類、ばれいしょの順に替える。この栽培方式の名称と、作物を替える目的の組合せとして適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-268", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表はレタス産地P・Qの気温と出荷時期のモデルである。Qの栽培方法と立地の説明として適切なのはどれか。」", "options": ["標高と野菜の出荷時期", "風力資源と消費地の位置", "標準時と太陽の南中", "デルタ国家の輸出工業"], "ans": 0, "exp": "表はレタス産地P・Qの気温と出荷時期のモデルである。Qの栽培方法と立地の説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-269", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「高知県沿岸部で、施設野菜を一般的な露地栽培より早い冬から春に出荷し、主に京阪神・首都圏の市場へ送る事例を考える。栽培時期の調節と、市場との関係を表す用語の組合せとして正しいものはどれか。」", "options": ["太平洋側の園芸と市場", "地下資源とプレート境界", "画像の拡大と地図の情報量", "中央アジアの交通と資源"], "ans": 0, "exp": "高知県沿岸部で、施設野菜を一般的な露地栽培より早い冬から春に出荷し、主に京阪神・首都圏の市場へ送る事例を考える。栽培時期の調節と、市場との関係を表す用語の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-270", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図は南九州のシラス台地の畜産農家と、港の飼料工場を結ぶ関係を示す。シラス台地の成り立ちと地表の水の得やすさの説明として適切なのはどれか。」", "options": ["南九州の地形と畜産", "原料産地と金属生産地", "等高線・縮尺・斜面方位", "乾燥国の人口と耕地"], "ans": 0, "exp": "図は南九州のシラス台地の畜産農家と、港の飼料工場を結ぶ関係を示す。シラス台地の成り立ちと地表の水の得やすさの説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-271", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のP・Q・Rは北海道の十勝、長野県の高冷地、高知県の沿岸部を想定したモデルである。対応として正しいものはどれか。」", "options": ["日本の地域と農業構成", "海外生産の費用比較", "河床縦断と勾配の変化", "米国の都市の位置・気候・産業"], "ans": 0, "exp": "表のP・Q・Rは北海道の十勝、長野県の高冷地、高知県の沿岸部を想定したモデルである。対応として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-272", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「高知県沿岸の冬春の施設野菜と、ケニアの赤道高地の切り花を比較する。2地域の自然条件と、市場までの距離からみた農業立地の説明として適切なのはどれか。」", "options": ["異なる地域に共通する農業立地", "都市圏の工場跡地", "ラスターの集約と土地利用", "農地所有の偏り"], "ans": 0, "exp": "高知県沿岸の冬春の施設野菜と、ケニアの赤道高地の切り花を比較する。2地域の自然条件と、市場までの距離からみた農業立地の説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-273", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ河川沿いのA・B地区を調べた。堤防決壊後の水が流入したという条件で、資料と地形の性質を合わせた説明を選べ。」", "options": ["低地の土地利用と浸水", "集荷と配送の拠点配置", "座標参照系と位置のずれ", "太平洋側の園芸と市場"], "ans": 0, "exp": "同じ河川沿いのA・B地区を調べた。堤防決壊後の水が流入したという条件で、資料と地形の性質を合わせた説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-274", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「M6.8の同一地震について、距離・地盤・震度を比較した。AとBの違いを説明する仮説として、資料と地震の知識に合うものを選べ。」", "options": ["観測地点による揺れの違い", "輸送量の指標と距離", "段丘面と火山灰による年代比較", "低地の断面と水面"], "ans": 0, "exp": "M6.8の同一地震について、距離・地盤・震度を比較した。AとBの違いを説明する仮説として、資料と地震の知識に合うものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-275", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同程度の強い揺れを受ける4地点のうち、砂質地盤の液状化を重点的に調べる条件が最もそろう地点はどれか。地盤改良はいずれも行われていない。」", "options": ["造成地の履歴と地盤", "工程分業と地域間の結び付き", "海成段丘と地盤の隆起", "積雪期と噴火後の降雨"], "ans": 0, "exp": "同程度の強い揺れを受ける4地点のうち、砂質地盤の液状化を重点的に調べる条件が最もそろう地点はどれか。地盤改良はいずれも行われていない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-276", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ津波について、外海に開く海岸Aと、奥へ狭まり浅くなる湾の湾奥Bを比べた。表は平常潮位からの水位上昇で、両地点とも2回目の記録が最大だった。Bの増幅と、津波が浅い海へ進むときの伝播速度の組合せとして適切な説明を選べ。」", "options": ["湾内外の津波記録", "生産移転と排出統計", "沈み込みと震源の分布", "都市気温の比較地点"], "ans": 0, "exp": "同じ津波について、外海に開く海岸Aと、奥へ狭まり浅くなる湾の湾奥Bを比べた。表は平常潮位からの水位上昇で、両地点とも2回目の記録が最大だった。Bの増幅と、津波が浅い海へ進むときの伝播速度の組合せとして適切な説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-277", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のA・Bは同じ河川沿いの氾濫原にあり、同じ水面でつながって浸水している。Aは川のすぐ沿いの微高地、Bはその背後の低地である。Bの浸水深と、土地の成り立ちから考えられる排水の性質を組み合わせた説明を選べ。」", "options": ["低地の断面と水面", "出生率・死亡率と人口構造", "旧版地図と微地形の照合", "回収容器と地域の条件"], "ans": 0, "exp": "図のA・Bは同じ河川沿いの氾濫原にあり、同じ水面でつながって浸水している。Aは川のすぐ沿いの微高地、Bはその背後の低地である。Bの浸水深と、土地の成り立ちから考えられる排水の性質を組み合わせた説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-278", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「架空の河口低地で同量の雨が降った2事例を比較した。堤防の決壊・越水、海水の越波はいずれもなかった。事例IIで市街地の浸水が増えた説明として、地形と資料に合うものはどれか。」", "options": ["低地市街地の排水", "年齢構成と扶養負担", "年較差と大陸性", "沿岸の漂着物と季節"], "ans": 0, "exp": "架空の河口低地で同量の雨が降った2事例を比較した。堤防の決壊・越水、海水の越波はいずれもなかった。事例IIで市街地の浸水が増えた説明として、地形と資料に合うものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-279", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同一流域について、森林・農地が多かった時期と市街地拡大後を、同量・同じ時間分布の雨で比較した。表の変化を説明するものを選べ。」", "options": ["都市化と流出の時間変化", "四つの時期の人口動態", "少雨地域の位置と大気循環", "上流施設と海岸の変化"], "ans": 0, "exp": "同一流域について、森林・農地が多かった時期と市街地拡大後を、同量・同じ時間分布の雨で比較した。表の変化を説明するものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-280", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「40haの地区に100mmの雨が降る。流出率は森林時0.3、市街地化後0.7とする。市街地化による総流出量の増加分を一時的に受け入れる容量と、その治水上のねらいの組合せを選べ。1ha＝10,000m²である。」", "options": ["土地被覆と貯留施設", "年齢・男女別の人口", "海に近い中緯度の年変化", "集計地図で見える範囲"], "ans": 0, "exp": "40haの地区に100mmの雨が降る。流出率は森林時0.3、市街地化後0.7とする。市街地化による総流出量の増加分を一時的に受け入れる容量と、その治水上のねらいの組合せを選べ。1ha＝10,000m²である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-281", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P・Qの水は合流点Rへ流れる。表はRへの到達時刻ごとの流量である。Qの貯留施設によりQ由来の流量を全体として1時間遅らせた場合、Rの最大合計流量はどう変わるか。途中の流入・損失はないモデルとする。」", "options": ["支流の合流と流量ピーク", "都市圏内部の住所移動", "赤道付近で雨季が二度現れる理由", "人口・都市・生活文化"], "ans": 0, "exp": "P・Qの水は合流点Rへ流れる。表はRへの到達時刻ごとの流量である。Qの貯留施設によりQ由来の流量を全体として1時間遅らせた場合、Rの最大合計流量はどう変わるか。途中の流入・損失はないモデルとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-282", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「山地の調査でPでは「急な崖の直下に崩れた岩塊」、Qでは「谷の出口の扇状の堆積地に、水と混ざって運ばれた巨礫」、Rでは「緩い斜面に連続する亀裂と、まとまって移動した地面」が記録された。対応する現象を選べ。」", "options": ["斜面・谷の災害", "国際移動と地域経済", "低気圧の移動と中緯度の風", "地図は凡例・方位・縮尺"], "ans": 0, "exp": "山地の調査でPでは「急な崖の直下に崩れた岩塊」、Qでは「谷の出口の扇状の堆積地に、水と混ざって運ばれた巨礫」、Rでは「緩い斜面に連続する亀裂と、まとまって移動した地面」が記録された。対応する現象を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-283", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の火山では、上空に達した細かい火山灰と、山腹の谷を流れる泥流を別々に検討する。上空は西風、山腹の主な谷は南西へ下る。各現象が広がる方向の組合せとして適切なものを選べ。」", "options": ["火山周辺の二つの移動", "都市人口の伸び方", "ヨーロッパ西岸の冬の温和さ", "鉱石の産地と製錬工場の立地"], "ans": 0, "exp": "図の火山では、上空に達した細かい火山灰と、山腹の谷を流れる泥流を別々に検討する。上空は西風、山腹の主な谷は南西へ下る。各現象が広がる方向の組合せとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-284", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「火山地域の二つの記録を示す。Pは積雪期の噴火直後に、火口付近から水と土砂が混ざって谷を流下した。Qは無積雪期に厚い火山灰が降り積もり、その後の大雨で谷に大量の土砂が流れた。両者を説明する組合せを選べ。」", "options": ["積雪期と噴火後の降雨", "市街地の連続性", "標高補正で二地点を比べる", "理由と具体例を口で伝える"], "ans": 0, "exp": "火山地域の二つの記録を示す。Pは積雪期の噴火直後に、火口付近から水と土砂が混ざって谷を流下した。Qは無積雪期に厚い火山灰が降り積もり、その後の大雨で谷に大量の土砂が流れた。両者を説明する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-285", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある地点Xは河川洪水図では着色がなく、内水浸水図では着色がある。Xは川沿いの微高地の背後にある住宅地である。二つの地図が両立する理由として適切なものを選べ。」", "options": ["異なる浸水想定の重ね合わせ", "地区機能を指標から読む", "三地域の自然植生", "対蹠点と最短距離"], "ans": 0, "exp": "ある地点Xは河川洪水図では着色がなく、内水浸水図では着色がある。Xは川沿いの微高地の背後にある住宅地である。二つの地図が両立する理由として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-286", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「古い津波碑には「当時の浜から約300m内陸まで浸水」とある。同じ方向の旧版地図と現在図を重ねると、埋立てにより海岸線は約600m沖へ移っていた。碑の位置と内容は移されていない。読み取りとして適切なものを選べ。」", "options": ["沿岸の土地履歴と災害記録", "都市の規模分布", "森林の土壌断面と物質移動", "画像の拡大と地図の情報量"], "ans": 0, "exp": "古い津波碑には「当時の浜から約300m内陸まで浸水」とある。同じ方向の旧版地図と現在図を重ねると、埋立てにより海岸線は約600m沖へ移っていた。碑の位置と内容は移されていない。読み取りとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-287", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表は架空市の施設の指定状況である。「被災後に滞在する施設」と「災害から緊急に退避する場所」の違いも踏まえて、適切な説明を選べ。実際の避難先を選ぶ問題ではない。」", "options": ["施設の指定と地形条件", "距離と時間の隔たり", "太平洋赤道域の東西差", "等高線と雨水の流れ"], "ans": 0, "exp": "表は架空市の施設の指定状況である。「被災後に滞在する施設」と「災害から緊急に退避する場所」の違いも踏まえて、適切な説明を選べ。実際の避難先を選ぶ問題ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-288", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図ではXからYへ橋Pまたは橋Qを使って向かえるが、両経路は谷の道路区間Sを共通に通る。Sだけが土砂で通れない場合の接続と、代替路Rの役割の組合せを選べ。」", "options": ["交通網と共通する途絶地点", "交通手段と都市の成長", "作付け暦の読み取り", "交通ネットワークの結節点"], "ans": 0, "exp": "図ではXからYへ橋Pまたは橋Qを使って向かえるが、両経路は谷の道路区間Sを共通に通る。Sだけが土砂で通れない場合の接続と、代替路Rの役割の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-289", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北が上で南へ開く遠浅の湾を想定する。台風が湾の西側を北上したとき、湾奥の海面を押し上げやすい風と理由の組合せを選べ。低気圧による吸い上げ効果も加わるが、ここでは風の作用を問う。」", "options": ["台風と湾の向き", "集落形態と生産の場", "施設園芸の費用と立地", "階級区分図と比例記号図"], "ans": 0, "exp": "北が上で南へ開く遠浅の湾を想定する。台風が湾の西側を北上したとき、湾奥の海面を押し上げやすい風と理由の組合せを選べ。低気圧による吸い上げ効果も加わるが、ここでは風の作用を問う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-290", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ標高で海からの距離もほぼ等しい中心市街地Aと郊外緑地Bを、晴天・弱風日に比べた。資料と都市の熱環境に合う説明を選べ。」", "options": ["時刻による都市の気温差", "言語圏と国境", "圃場と流域の水収支", "沈水海岸の形成過程と地域"], "ans": 0, "exp": "同じ標高で海からの距離もほぼ等しい中心市街地Aと郊外緑地Bを、晴天・弱風日に比べた。資料と都市の熱環境に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-291", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「海岸から内陸へ向けて地形が高くなる都市で、舗装の多い場所と緑地の土地被覆による気温差を調べたい。観測機器・高さ・日射を避ける条件をそろえることに加え、最も比較条件をそろえた計画はどれか。」", "options": ["都市気温の比較地点", "主食となる作物と環境", "漁獲統計と資源評価", "沈み込みと震源の分布"], "ans": 0, "exp": "海岸から内陸へ向けて地形が高くなる都市で、舗装の多い場所と緑地の土地被覆による気温差を調べたい。観測機器・高さ・日射を避ける条件をそろえることに加え、最も比較条件をそろえた計画はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-292", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「水稲栽培地域がP・Qの対策を行う。主な目的に基づく「緩和」「適応」の分類を選べ。」", "options": ["農業地域の気候対策", "地域格差を集計で読む", "天然ガスの輸送体系", "雨温図から大陸東西の違いを読む"], "ans": 0, "exp": "水稲栽培地域がP・Qの対策を行う。主な目的に基づく「緩和」「適応」の分類を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-293", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「消費に対応する排出量を「域内排出＋輸入品の生産時排出−輸出品の生産時排出」で求める教材モデルを用いる。表から得られる結果と、輸入・輸出を考慮する理由の組合せを選べ。」", "options": ["貿易と排出量の集計", "住宅地の世代と移動", "鉱石処理と輸送の分業", "気候の季節性と世界の分布"], "ans": 0, "exp": "消費に対応する排出量を「域内排出＋輸入品の生産時排出−輸出品の生産時排出」で求める教材モデルを用いる。表から得られる結果と、輸入・輸出を考慮する理由の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-294", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある地域の発電量は基準年の100から比較年の140へ増え、火力の割合は50%から35%になった。火力の発電1単位当たりCO₂排出は一定、その他の電源の発電時排出は0とする。比較年の発電時総排出量と説明の組合せを選べ。」", "options": ["電源構成と総排出量", "東アジアの工程間分業", "海外生産の費用比較", "冷帯と寒帯を分ける夏の気温"], "ans": 0, "exp": "ある地域の発電量は基準年の100から比較年の140へ増え、火力の割合は50%から35%になった。火力の発電1単位当たりCO₂排出は一定、その他の電源の発電時排出は0とする。比較年の発電時総排出量と説明の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-295", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ品質・重量の野菜1kgを同じ市場に届ける二経路を比較する。地域Aは市場近くで暖房栽培、Bは暖かい海外で露地栽培し船で運ぶ。Aの生産段階の排出を70%減らせた場合の評価を選べ。その他の条件は変わらない。」", "options": ["食料の生産地と輸送", "河口低地の季節的な水利用", "情報処理施設の立地", "収束帯の移動と二地点の降水ピーク"], "ans": 0, "exp": "同じ品質・重量の野菜1kgを同じ市場に届ける二経路を比較する。地域Aは市場近くで暖房栽培、Bは暖かい海外で露地栽培し船で運ぶ。Aの生産段階の排出を70%減らせた場合の評価を選べ。その他の条件は変わらない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-296", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ設備容量の太陽光発電を日本の太平洋側Pと日本海側Qで比べた。両地点は同緯度・同標高で、設備故障はない。表の冬の違いを説明し、Qで冬の供給を補う候補を示すものを選べ。」", "options": ["季節と発電資源", "海峡と中継貿易", "果実輸入と季節差", "ヨーロッパ西岸の冬の温和さ"], "ans": 0, "exp": "同じ設備容量の太陽光発電を日本の太平洋側Pと日本海側Qで比べた。両地点は同緯度・同標高で、設備故障はない。表の冬の違いを説明し、Qで冬の供給を補う候補を示すものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-297", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「雨季のある熱帯の丘陵で森林が畑へ転換され、雨季に川の濁りが増えた。裸地の畝は斜面の上下方向に長く続いている。表土流出を抑えつつ既存農地を使う改善として、地形と降雨の作用に合うものはどれか。」", "options": ["熱帯の斜面耕地", "デルタ国家の輸出工業", "生産移転と排出統計", "気候区分に使う資料の期間"], "ans": 0, "exp": "雨季のある熱帯の丘陵で森林が畑へ転換され、雨季に川の濁りが増えた。裸地の畝は斜面の上下方向に長く続いている。表土流出を抑えつつ既存農地を使う改善として、地形と降雨の作用に合うものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-298", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「Pは空き瓶を洗浄して同じ容器として再使用、Qは空き瓶を砕いて原料に戻し別の瓶に製造する。P・Qの分類と、Pの環境負荷を比べる際に必要な地域条件の組合せを選べ。」", "options": ["回収容器と地域の条件", "国境を越える流域の利用", "高齢人口の変化を比べる", "草原の表層と土壌形成"], "ans": 0, "exp": "Pは空き瓶を洗浄して同じ容器として再使用、Qは空き瓶を砕いて原料に戻し別の瓶に製造する。P・Qの分類と、Pの環境負荷を比べる際に必要な地域条件の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-299", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「人口1万人で1年365日の観光地に、年間73万人日の観光客滞在があった。住民と観光客が出すごみの合計は2,190tである。人口は一定、1人日とは1人が1日滞在する量である。住民・観光客の合計滞在人日で割った値と、その意義を選べ。」", "options": ["観光地のごみ指標", "中央アジアの流域と湖", "出生率低下後の人口", "三地域の雨の成因を比べる"], "ans": 0, "exp": "人口1万人で1年365日の観光地に、年間73万人日の観光客滞在があった。住民と観光客が出すごみの合計は2,190tである。人口は一定、1人日とは1人が1日滞在する量である。住民・観光客の合計滞在人日で割った値と、その意義を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-300", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「乾燥地域で農業取水60のうち作物に有効に使われる水は18、その他の用途の取水は40である。作物への有効水量18を保ち、有効利用率を30%から45%へ高めると、総取水は何%減るか。あわせて乾燥地の灌漑で留意する土壌問題を選べ。」", "options": ["乾燥地域の灌漑と取水", "欧州の河川と海港", "都市圏内部の住所移動", "二つの酪農地域"], "ans": 0, "exp": "乾燥地域で農業取水60のうち作物に有効に使われる水は18、その他の用途の取水は40である。作物への有効水量18を保ち、有効利用率を30%から45%へ高めると、総取水は何%減るか。あわせて乾燥地の灌漑で留意する土壌問題を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-301", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の河川A・Bが閉鎖性の湾へ流れ込む。表の濃度と流量は同時に測ったモデル値で、湾までの途中で窒素の出入りはない。窒素負荷の比較と、過剰な栄養塩がもたらし得る現象を選べ。」", "options": ["湾に流れ込む負荷", "北大西洋の島国のエネルギー", "国境を越える通勤", "圃場と流域の水収支"], "ans": 0, "exp": "図の河川A・Bが閉鎖性の湾へ流れ込む。表の濃度と流量は同時に測ったモデル値で、湾までの途中で窒素の出入りはない。窒素負荷の比較と、過剰な栄養塩がもたらし得る現象を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-302", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「冷涼で常時水を含む湿地には、分解されにくい植物遺体が厚く積もっている。排水路を掘って地下水面を下げた後、地表面の沈下とCO₂放出の増加が観測された。この変化を説明するものを選べ。」", "options": ["湿地と炭素の動き", "西アフリカの換金作物", "都市を数える範囲", "エネルギー源の構成と自給"], "ans": 0, "exp": "冷涼で常時水を含む湿地には、分解されにくい植物遺体が厚く積もっている。排水路を掘って地下水面を下げた後、地表面の沈下とCO₂放出の増加が観測された。この変化を説明するものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-303", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「半乾燥地域の二つの放牧地を同じ期間に調べた。両地点は降水量と季節分布・土質・風の条件が近い。表から検討すべき土地劣化の仕組みを選べ。」", "options": ["乾燥地域の植生変化", "アフリカの降水と植生", "都市の規模分布", "地下資源とプレート境界"], "ans": 0, "exp": "半乾燥地域の二つの放牧地を同じ期間に調べた。両地点は降水量と季節分布・土質・風の条件が近い。表から検討すべき土地劣化の仕組みを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-304", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の対象種は樹林内を移動しやすく、幅の広い舗装道路を横断しにくい。森林A・Bの連結を改善する案として、図の空間関係に合うものを選べ。」", "options": ["生息地の連結と道路", "米国の都市の位置・気候・産業", "通勤の地域間結合", "企業の集積と分業"], "ans": 0, "exp": "図の対象種は樹林内を移動しやすく、幅の広い舗装道路を横断しにくい。森林A・Bの連結を改善する案として、図の空間関係に合うものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-305", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「日本海側の同じ海岸を調べると、河口付近では強い雨の直後にごみが増え、河口から離れた場所では冬季に増える傾向があった。二つの過程を区別して確かめる調査として適切なものを選べ。」", "options": ["沿岸の漂着物と季節", "ブラジルの地域差", "山間地域のサービス変化", "貨物の価値と輸送手段"], "ans": 0, "exp": "日本海側の同じ海岸を調べると、河口付近では強い雨の直後にごみが増え、河口から離れた場所では冬季に増える傾向があった。二つの過程を区別して確かめる調査として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-306", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「中央アジアの水利用を参考に、上流国Uの高山から乾燥した下流国Dへ流れる河川を考える。Uは暖房用電力の不足を冬の水力発電で補う案を持ち、Dでは露地の綿花栽培が行われる。自然流量の季節性と、両国で調整すべき利用の組合せを選べ。」", "options": ["国際河川の季節配分", "南米の資源輸出と価格", "主食となる作物と環境", "生産移転と排出統計"], "ans": 0, "exp": "中央アジアの水利用を参考に、上流国Uの高山から乾燥した下流国Dへ流れる河川を考える。Uは暖房用電力の不足を冬の水力発電で補う案を持ち、Dでは露地の綿花栽培が行われる。自然流量の季節性と、両国で調整すべき利用の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-307", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北半球の地中海沿岸の観光地Pと、北半球の内陸山地のスキー観光地Qを比較する。Pの7月の降水特性を生む大気循環と、水需給に関する説明の組合せを選べ。表は学習用モデル値である。」", "options": ["観光の季節性と水需要", "ニュージーランドの降水と牧畜", "人口推計の二つの経路", "二つの出生指標"], "ans": 0, "exp": "北半球の地中海沿岸の観光地Pと、北半球の内陸山地のスキー観光地Qを比較する。Pの7月の降水特性を生む大気循環と、水需給に関する説明の組合せを選べ。表は学習用モデル値である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-308", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「駅から歴史地区へのバスが、10時に到着する観光列車の到着後に混雑する。駅からのバス予約を別の時間帯へ移す案を検討する。各時間帯の輸送力は変えず、利用者は予約時刻まで駅で待てるものとする。表の範囲で10時台の超過需要を全て別の時間帯へ移すことはできるか。」", "options": ["観光客の集中する時間", "北海道の畑作地域", "中国の沿海部と内陸部", "移動率と年齢構成"], "ans": 0, "exp": "駅から歴史地区へのバスが、10時に到着する観光列車の到着後に混雑する。駅からのバス予約を別の時間帯へ移す案を検討する。各時間帯の輸送力は変えず、利用者は予約時刻まで駅で待てるものとする。表の範囲で10時台の超過需要を全て別の時間帯へ移すことはできるか。", "refUrl": "https://logiq const STORAGE_KEY = "ct_chiri_pa_v3";
let prog = loadProg();
let curList = [], idx = 0, score = 0, wrongList = [], listening = false, listenTimer = null;

function loadProg() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); return { items: p.items || {}, solved: p.solved || 0 }; }
  } catch (e) {}
  return { items: {}, solved: 0 };
}
function saveProg() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prog)); } catch (e) {} }
function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "v-home") refreshHome();
}
function refreshHome() {
  document.getElementById("s-tot").textContent = BANK.length;
  let lrn = 0, rev = 0;
  BANK.forEach(q => {
    const p = prog.items[q.id];
    if (p && p.n > 0) { lrn++; if (p.ng || (p.ok / p.n) < 0.7) rev++; }
  });
  document.getElementById("s-lrn").textContent = lrn;
  document.getElementById("s-rev").textContent = rev;
  document.getElementById("rev-n").textContent = rev;
  document.getElementById("b-rev").style.display = rev > 0 ? "flex" : "none";
}
function priorityScore(q, now) {
  const p = prog.items[q.id];
  if (!p || !p.n) return 1000 + Math.random() * 30;
  let s = 100 + (p.ng ? 500 : 0) + Math.min(Math.max(0, (now - (p.t || 0)) / 3600000) * 6, 220) + (1 - (p.ok / p.n)) * 180;
  return s + Math.random() * 25;
}
function startQuiz(mode) {
  const cat = document.getElementById("f-cat").value;
  const pri = document.getElementById("f-pri").value;
  let pool = BANK.filter(q => (cat === "ALL" || q.cat === cat) && (pri === "ALL" || q.priority === pri));
  if (mode === "REVIEW") pool = pool.filter(q => { const p = prog.items[q.id]; return p && (p.ng || (p.ok / p.n) < 0.7); });
  if (!pool.length) { alert("該当する問題がありません。条件を変更してください。"); return; }
  const now = Date.now();
  curList = [...pool].sort((a, b) => priorityScore(b, now) - priorityScore(a, now)).slice(0, 10).sort(() => Math.random() - 0.5);
  idx = 0; score = 0; wrongList = [];
  showView("v-quiz");
  renderQ();
}
function highlightQuestionText(text) {
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return escaped.replace(/「([^」]+)」/g, '<span class="q-hl">「$1」</span>');
}
function renderQ() {
  document.getElementById("sheet").classList.remove("active");
  const q = curList[idx];
  document.getElementById("p-fill").style.width = `${(idx / curList.length) * 100}%`;
  document.getElementById("q-cat").textContent = q.catName;
  const priEl = document.getElementById("q-pri");
  priEl.textContent = q.priority === "S" ? "★ 最重要" : "● 重要";
  priEl.className = q.priority === "S" ? "badge s" : "badge";
  document.getElementById("q-num").textContent = `${idx + 1} / ${curList.length}`;
  document.getElementById("q-id").textContent = `問題ID: ${q.id}`;
  document.getElementById("q-txt").innerHTML = highlightQuestionText(q.q);
  const optsEl = document.getElementById("opts");
  optsEl.innerHTML = "";
  const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
  const labels = ["ア", "イ", "ウ", "エ"];
  order.forEach((optIdx, pos) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = `${labels[pos]}. ${q.options[optIdx]}`;
    btn.onclick = () => checkAnswer(optIdx, btn);
    optsEl.appendChild(btn);
  });
}
function checkAnswer(selectedIdx, btn) {

  const p = prog.items[q.id] || { n: 0, ok: 0, ng: false, t: 0 };
  p.n += 1; p.t = Date.now();
  if (isOk) { score += 1; p.ok += 1; p.ng = false; btn.classList.add("ok"); }
  else {
    p.ng = true; wrongList.push(q); btn.classList.add("ng");
    document.querySelectorAll(".opt-btn").forEach(b => { if (b.textContent.endsWith(q.options[q.ans])) b.classList.add("ok"); });
  }
  prog.items[q.id] = p;
  prog.solved = (prog.solved || 0) + 1;
  saveProg();
  const head = document.getElementById("sh-head");
  head.textContent = isOk ? "⭕ 正解！" : "❌ 不正解";
  head.style.color = isOk ? "var(--ok)" : "var(--ng)";
  document.getElementById("sh-ans").textContent = `正解：${q.options[q.ans]}`;
  document.getElementById("sh-exp").textContent = q.exp;
  const refEl = document.getElementById("sh-ref");
  if (q.refUrl) {
    refEl.href = q.refUrl;
    refEl.textContent = `🗺️ ${q.refLabel || "解説・資料ページを見る"} ↗`;
    refEl.style.display = "flex";
  } else {
    refEl.style.display = "none";
  }
  document.getElementById("sheet").classList.add("active");
  speak(isOk ? `正解です。${q.options[q.ans]}` : `不正解です。正解は、${q.options[q.ans]}`);
  if (prog.solved > 0 && prog.solved % 30 === 0) {
    setTimeout(() => {
      document.getElementById("adv-txt").textContent = ADVICES[(Math.floor(prog.solved / 30) - 1) % ADVICES.length];
      document.getElementById("m-adv").classList.add("active");
    }, 550);
  }
}
function nextQ() {
  idx += 1;
  if (idx < curList.length) renderQ();
  else {
    document.getElementById("p-fill").style.width = "100%";
    document.getElementById("r-sc").textContent = `${score} / ${curList.length} 問正解`;
    document.getElementById("r-msg").textContent = score === curList.length ? "全問正解です！次の10問へ進みましょう。" : "間違えた問題を復習して、確実に定着させましょう。";
    document.getElementById("r-rev").style.display = wrongList.length > 0 ? "flex" : "none";
    document.getElementById("m-res").classList.add("active");
  }
}
function closeRes(action) {
  document.getElementById("m-res").classList.remove("active");
  if (action === "REV") { curList = [...wrongList]; idx = 0; score = 0; wrongList = []; showView("v-quiz"); renderQ(); }
  else if (action === "NEXT") startQuiz("NORMAL");
  else showView("v-home");
}
function openStats() {
  const cats = [
    ["CHISHI", "地誌（日本・世界）"], ["STATS_GRAPH", "統計・グラフ読解"],
    ["TOPO_CLIM", "地形・気候"], ["RES_IND", "資源・産業・貿易"],
    ["POP_URB", "人口・都市・文化"], ["MAP_GIS", "地図・GIS・防災"]
  ];
  let lines = [`累計解答数：<b>${prog.solved || 0}</b> 回<br><br>`];
  cats.forEach(([code, name]) => {
    const sub = BANK.filter(q => q.cat === code);
    const done = sub.filter(q => prog.items[q.id] && prog.items[q.id].n > 0).length;
    lines.push(`${name}：${done} / ${sub.length} 問学習済<br>`);
  });
  document.getElementById("st-body").innerHTML = lines.join("");
  document.getElementById("m-st").classList.add("active");
}
function resetProg() {
  if (confirm("これまでの学習進捗をすべて削除しますか？")) {
    prog = { items: {}, solved: 0 }; saveProg(); refreshHome();
    document.getElementById("m-st").classList.remove("active");
  }
}
function exportProg() {
  const txt = JSON.stringify(prog);
  navigator.clipboard?.writeText(txt)
    .then(() => alert("進捗データをクリップボードにコピーしました。"))
    .catch(() => prompt("以下の進捗コードをコピーしてください：", txt));
}
function importProg() {
  const txt = prompt("エクスポートした進捗コードを貼り付けてください：");
  if (!txt) return;
  try {
    const parsed = JSON.parse(txt.trim());
    if (parsed && typeof parsed.items === "object") {
      prog = { items: parsed.items, solved: parsed.solved || 0 }; saveProg(); refreshHome();
      alert("進捗データを読み込みました。");
    }
  } catch (e) { alert("読み込みに失敗しました。"); }
}
function speak(text, onDone) {
  if (!("speechSynthesis" in window)) { if (onDone) onDone(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ja-JP"; utter.rate = 1.05;
  if (onDone) utter.onend = onDone;
  window.speechSynthesis.speak(utter);
}
function startListen() {
  listening = true; showView("v-listen");
  const wrongPool = BANK.filter(q => prog.items[q.id] && prog.items[q.id].ng);
  const pool = wrongPool.length > 0 ? wrongPool : [...BANK];
  let i = 0;
  const step = () => {
    if (!listening) return;
    const q = pool[i % pool.length];
    document.getElementById("l-badge").textContent = `問題（${q.catName}）`;
    document.getElementById("l-main").textContent = q.q;
    speak(`問題。${q.q}`, () => {
      if (!listening) return;
      listenTimer = setTimeout(() => {
        if (!listening) return;
        const ans = q.options[q.ans];
        document.getElementById("l-badge").textContent = "解答と解説";
        document.getElementById("l-main").textContent = `【正解】${ans}

${q.exp}`;
        speak(`正解は、${ans}。${q.exp}`, () => {
          if (!listening) return;
          i += 1; listenTimer = setTimeout(step, 2000);
        });
      }, 1500);
    });
  };
  step();
}
function stopListen() {
  listening = false;
  if (listenTimer) clearTimeout(listenTimer);
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  showView("v-home");
}
refreshHome();
</script>
