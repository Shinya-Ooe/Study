": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 選鉱の減量効果が大きいほど、長距離輸送の前に鉱山側で選鉱する効果が大きい。輸入港へ移すと、取り除く不要物まで海上輸送することになる。」", "options": ["選択肢1", "選択肢4", "調査対象", "産地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 選鉱の減量効果が大きいほど、長距離輸送の前に鉱山側で選鉱する効果が大きい。輸入港へ移すと、取り除く不要物まで海上輸送することになる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-715", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 含有割合が高くなるのは不要物を除くためであり、精鉱の重量が元の鉱石より増えることを意味しない。品位と総重量を区別する。」", "options": ["選択肢2", "侵食", "気候・自然環境", "原料炭"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 含有割合が高くなるのは不要物を除くためであり、精鉱の重量が元の鉱石より増えることを意味しない。品位と総重量を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-716", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 選鉱は有用鉱物を分離・濃縮する工程で、純銅を得る製錬・精製とは異なる。原料から製品へ進む工程の順序を逆にしている。」", "options": ["選択肢3", "科目名", "A年", "時点"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 選鉱は有用鉱物を分離・濃縮する工程で、純銅を得る製錬・精製とは異なる。原料から製品へ進む工程の順序を逆にしている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-717", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 鉱山近くで不要物を除けば、同じ量の銅を送るのに運ぶ総重量を減らせる。製錬の立地では港湾・エネルギー・設備や技術などの別の条件も関わる。」", "options": ["選択肢4", "系統地理", "2択から決められない", "25〜39歳"], "ans": 0, "exp": "正解は「選択肢4」です。正解 鉱山近くで不要物を除けば、同じ量の銅を送るのに運ぶ総重量を減らせる。製錬の立地では港湾・エネルギー・設備や技術などの別の条件も関わる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-718", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 市場に立地しても原料の輸送費は発生する。Xでは原料の方が製品より重いため、R立地が有利である。」", "options": ["選択肢1", "気候帯", "地図", "住宅地"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 市場に立地しても原料の輸送費は発生する。Xでは原料の方が製品より重いため、R立地が有利である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-719", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Yは現地の水で重量が増えるため、軽い原料をMへ運ぶ方が費用を抑えられる。原料指向を全工業へ一般化できない。」", "options": ["選択肢2", "温帯（C）", "データ", "時期"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Yは現地の水で重量が増えるため、軽い原料をMへ運ぶ方が費用を抑えられる。原料指向を全工業へ一般化できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-720", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 XをMに置くと原料200トンキロ、Rなら製品100トンキロ。原料の方が重い場合はRが有利となる。」", "options": ["選択肢3", "試験", "堆積物", "P 西側"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 XをMに置くと原料200トンキロ、Rなら製品100トンキロ。原料の方が重い場合はRが有利となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-721", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 XはRで100、Mで200トンキロ。YはRで製品100、Mで原料20トンキロ。重量変化の方向が立地を分ける。」", "options": ["選択肢4", "私大（一般選抜）", "1日目", "時刻"], "ans": 0, "exp": "正解は「選択肢4」です。正解 XはRで100、Mで200トンキロ。YはRで製品100、Mで原料20トンキロ。重量変化の方向が立地を分ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-722", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 水を加えて重量が増える飲料などの市場指向を、アルミニウムの電解製錬に当てはめている。Qの立地はこの原理では説明できない。」", "options": ["選択肢1", "プレート境界", "時刻帯", "周辺部"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 水を加えて重量が増える飲料などの市場指向を、アルミニウムの電解製錬に当てはめている。Qの立地はこの原理では説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-723", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 鉱石から有用鉱物を分離・濃縮する選鉱と、アルミナから金属を得る電解製錬は別工程である。Qは鉱石採掘地ではない。」", "options": ["選択肢2", "海岸の地形", "乾季（11〜3月）", "低い平均気温"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 鉱石から有用鉱物を分離・濃縮する選鉱と、アルミナから金属を得る電解製錬は別工程である。Qは鉱石採掘地ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-724", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 鉄鉱石をコークスで還元する高炉製鉄と混同している。アルミナから一次アルミニウムを得る工程は電解による製錬である。」", "options": ["選択肢3", "主要作物の栽培条件と主産地", "期間", "地理総合"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 鉄鉱石をコークスで還元する高炉製鉄と混同している。アルミナから一次アルミニウムを得る工程は電解による製錬である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-725", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 原料鉱床と電力資源の分布は一致しない。Qではアルミナの輸入費用を負担しても、大量に使う電力の条件が製錬立地を支え得る。」", "options": ["選択肢4", "エネルギー資源", "原料炭", "試験"], "ans": 0, "exp": "正解は「選択肢4」です。正解 原料鉱床と電力資源の分布は一致しない。Qではアルミナの輸入費用を負担しても、大量に使う電力の条件が製錬立地を支え得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-726", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 表では国内炭から輸入炭へ比重が移っている。国内炭田への近接より、輸入港との接続が重視される方向である。」", "options": ["選択肢1", "工業の変化", "輸送機関", "大地形"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 表では国内炭から輸入炭へ比重が移っている。国内炭田への近接より、輸入港との接続が重視される方向である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-727", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 海外から大量の鉄鉱石・原料炭を運ぶと、深い港湾と広い用地を持つ臨海部が有利になる。港と工場を結ぶ輸送の短縮が重要。」", "options": ["選択肢2", "都市", "前期", "林業・水産業"], "ans": 0, "exp": "正解は「選択肢2」です。正解 海外から大量の鉄鉱石・原料炭を運ぶと、深い港湾と広い用地を持つ臨海部が有利になる。港と工場を結ぶ輸送の短縮が重要。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-728", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高炉製鉄は大量の原料・製品を扱う。表の変化は輸入原料と船舶の大型化であり、製品軽量化を示していない。」", "options": ["選択肢3", "生活文化", "40〜64歳", "都市"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 高炉製鉄は大量の原料・製品を扱う。表の変化は輸入原料と船舶の大型化であり、製品軽量化を示していない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-729", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 鉄スクラップを主原料とする電炉と、高炉による鉄鉱石の還元を混同している。表もスクラップへの全面転換は示さない。」", "options": ["選択肢4", "地形図", "地区", "GIS"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 鉄スクラップを主原料とする電炉と、高炉による鉄鉱石の還元を混同している。表もスクラップへの全面転換は示さない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-730", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは半導体でよいが、Bには石灰石の条件がなく、Cの石灰石鉱山との近さがセメント焼成に有利となる。」", "options": ["選択肢1", "調査対象", "作物", "気候・自然環境"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Aは半導体でよいが、Bには石灰石の条件がなく、Cの石灰石鉱山との近さがセメント焼成に有利となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-731", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Cの原料条件を半導体の立地と取り違えている。半導体の原料が岩石由来でも、一般的な石灰石鉱山への近さが決め手にはならない。」", "options": ["選択肢2", "利益相反の有無", "作物X", "今の状態"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Cの原料条件を半導体の立地と取り違えている。半導体の原料が岩石由来でも、一般的な石灰石鉱山への近さが決め手にはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-732", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 半導体前工程は安定電力・用水・技術者、縫製は労働力、セメント焼成は重い原料である石灰石への近さを重視する。」", "options": ["選択肢3", "産業・資源・流通", "P 西側", "斜面"], "ans": 0, "exp": "正解は「選択肢3」です。正解 半導体前工程は安定電力・用水・技術者、縫製は労働力、セメント焼成は重い原料である石灰石への近さを重視する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-733", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの安定電力・用水・技術者集積は半導体前工程に適する。Bは豊富な労働力を生かす縫製向けであり、対応が逆。」", "options": ["選択肢4", "防災・環境・地域調査", "最大流量", "位置"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aの安定電力・用水・技術者集積は半導体前工程に適する。Bは豊富な労働力を生かす縫製向けであり、対応が逆。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-734", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Cの労働費は40÷8＝5で最低だが、輸送費10を加えると15。低い労働費だけでは最適立地にならない。」", "options": ["選択肢1", "今の状態", "放牧地", "標高データ"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Cの労働費は40÷8＝5で最低だが、輸送費10を加えると15。低い労働費だけでは最適立地にならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-735", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 A14とB11で等しくない。市場が同じでも距離・交通網・輸送条件によって費用は異なる。」", "options": ["選択肢2", "2択から決められない", "選択肢1", "時刻帯"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 A14とB11で等しくない。市場が同じでも距離・交通網・輸送条件によって費用は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-736", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Bは30÷5＋5＝11。Aは14、Cは15なのでBが最低であり、賃金水準だけでなく生産性と輸送条件を見る必要がある。」", "options": ["選択肢3", "メッシュ", "侵食", "総労働時間"], "ans": 0, "exp": "正解は「選択肢3」です。正解 Bは30÷5＋5＝11。Aは14、Cは15なのでBが最低であり、賃金水準だけでなく生産性と輸送条件を見る必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-737", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの労働費は20÷2＝10、輸送費を足すと14。時間賃金が低くても1個作るのに必要な時間が長ければ単位費用は高くなる。」", "options": ["選択肢4", "領域", "地理総合，歴史総合，公共", "鉄鉱石"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Aの労働費は20÷2＝10、輸送費を足すと14。時間賃金が低くても1個作るのに必要な時間が長ければ単位費用は高くなる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-738", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 一企業の規模の経済と、複数企業の集積による外部経済を混同している。地域に工場が増えても各社の生産規模が大きくなるとは限らない。」", "options": ["選択肢1", "候補", "熱帯（A）", "100,000人"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 一企業の規模の経済と、複数企業の集積による外部経済を混同している。地域に工場が増えても各社の生産規模が大きくなるとは限らない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-739", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 生産拠点の集積と販売市場の範囲は別である。集積地域で作った完成車を国内外の広い市場へ出荷できる。」", "options": ["選択肢2", "地表勾配", "試験", "18〜24歳"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 生産拠点の集積と販売市場の範囲は別である。集積地域で作った完成車を国内外の広い市場へ出荷できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-740", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 完成車と部品の集積には納入・調整のしやすさが関わる。鉄鉱石などの鉱山との近接がそのまま示されるわけではない。」", "options": ["選択肢3", "堆積物", "気候", "地区"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 完成車と部品の集積には納入・調整のしやすさが関わる。鉄鉱石などの鉱山との近接がそのまま示されるわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-741", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 近接は輸送時間・調整の負担を減らし、関連企業の専門性を使った分業を支える。産業集積の利点として説明できる。」", "options": ["選択肢4", "標高データ", "その他", "C（中国沿海部）"], "ans": 0, "exp": "正解は「選択肢4」です。正解 近接は輸送時間・調整の負担を減らし、関連企業の専門性を使った分業を支える。産業集積の利点として説明できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-742", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 船会社が異なっても港Pから出港できないという制約は共通する。運送事業者の分散と経路の分散は異なる。」", "options": ["選択肢1", "2日目", "エネルギー資源", "区分"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 船会社が異なっても港Pから出港できないという制約は共通する。運送事業者の分散と経路の分散は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-743", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 供給会社の都市を分散しても、港Pが共通なら港閉鎖時には同じ影響を受ける。供給元と輸送拠点の両方を見る必要がある。」", "options": ["選択肢2", "山頂", "人口", "総流出量"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 供給会社の都市を分散しても、港Pが共通なら港閉鎖時には同じ影響を受ける。供給元と輸送拠点の両方を見る必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-744", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 道路や荷役の改善は平常時の効率化になるが、港P自体の長期閉鎖を回避することにはならない。」", "options": ["選択肢3", "地表からの深さ（m）", "図法", "中心部"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 道路や荷役の改善は平常時の効率化になるが、港P自体の長期閉鎖を回避することにはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-745", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 港Pを通らない港Q経由の経路を持つ会社を選べば、Pの閉鎖時にも一方からの供給経路を残せる。」", "options": ["選択肢4", "乾季（11〜3月）", "調査対象", "侵食"], "ans": 0, "exp": "正解は「選択肢4」です。正解 港Pを通らない港Q経由の経路を持つ会社を選べば、Pの閉鎖時にも一方からの供給経路を残せる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-746", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの用途は適切だが、幹線船と小型船を結ぶ中継には港湾が必要である。Qの高速道路の交点は陸上配送の分岐に生かす。」", "options": ["選択肢1", "産地", "気候・自然環境", "地誌"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Pの用途は適切だが、幹線船と小型船を結ぶ中継には港湾が必要である。Qの高速道路の交点は陸上配送の分岐に生かす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-747", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pを内陸配送だけに使うと岸壁との直結を生かせない。Qでは仕分けによって各配送先に必要な貨物を組み直すことが、結節点の機能となる。」", "options": ["選択肢2", "方式", "A年", "寒帯（E）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Pを内陸配送だけに使うと岸壁との直結を生かせない。Qでは仕分けによって各配送先に必要な貨物を組み直すことが、結節点の機能となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-748", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 船舶の大量輸送には岸壁と広い保管用地が役立つ。配送先ごとの小口貨物は、仕分け設備と複数方向へ通じる道路を利用して送れる。」", "options": ["選択肢3", "鉄鉱石", "2択から決められない", "プレート境界"], "ans": 0, "exp": "正解は「選択肢3」です。正解 船舶の大量輸送には岸壁と広い保管用地が役立つ。配送先ごとの小口貨物は、仕分け設備と複数方向へ通じる道路を利用して送れる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-749", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの岸壁を生かす主機能としては港湾貨物の荷役・保管が適する。Qには船の接岸設備がないため、ばら積み船から直接荷役できない。」", "options": ["選択肢4", "拠点", "地図", "食料問題"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pの岸壁を生かす主機能としては港湾貨物の荷役・保管が適する。Qには船の接岸設備がないため、ばら積み船から直接荷役できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-750", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 分業では工程間で寸法・品質・納期を調整する必要がある。近接した専門企業の連携がその対応を助ける。」", "options": ["選択肢1", "輸送機関", "データ", "人口"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 分業では工程間で寸法・品質・納期を調整する必要がある。近接した専門企業の連携がその対応を助ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-751", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 原料指向の意味が弱まっても、技能・分業・信頼関係などの集積は残り得る。立地の継続を過去からの蓄積で説明できる。」", "options": ["選択肢2", "10年前", "堆積物", "地形図"], "ans": 0, "exp": "正解は「選択肢2」です。正解 原料指向の意味が弱まっても、技能・分業・信頼関係などの集積は残り得る。立地の継続を過去からの蓄積で説明できる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-752", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 原料の供給国と製品の販売市場は別に決まる。原料輸入が増えても、その相手国へ製品販売が集中するとは読み取れない。」", "options": ["選択肢3", "後期", "1日目", "地図・GIS・地形"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 原料の供給国と製品の販売市場は別に決まる。原料輸入が増えても、その相手国へ製品販売が集中するとは読み取れない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-753", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 輸入原料への依存が増えることは、地元鉱床への近さの重要性が高まることではない。残る利点は技能や工程分業などの蓄積である。」", "options": ["選択肢4", "25〜39歳", "時刻帯", "B年"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 輸入原料への依存が増えることは、地元鉱床への近さの重要性が高まることではない。残る利点は技能や工程分業などの蓄積である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-754", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 表に通信費はなく、通信時間が短いことから費用による相殺は判断できない。冷却費と通信時間は単位の違う条件である。」", "options": ["選択肢1", "出国前の20〜39歳人口", "乾季（11〜3月）", "メッシュ"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 表に通信費はなく、通信時間が短いことから費用による相殺は判断できない。冷却費と通信時間は単位の違う条件である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-755", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 翌日納品のXより、即時応答のYで短い通信時間が重要になる。用途と重視する条件の組合せが逆である。」", "options": ["選択肢2", "地区", "期間", "データ"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 翌日納品のXより、即時応答のYで短い通信時間が重要になる。用途と重視する条件の組合せが逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-756", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの冷却費は低いが、即時応答を要するYには長い通信時間が不利になる。用途による重視条件の違いを無視している。」", "options": ["選択肢3", "バス", "原料炭", "現在の地図"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Pの冷却費は低いが、即時応答を要するYには長い通信時間が不利になる。用途による重視条件の違いを無視している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-757", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 翌日納品のXは短い通信遅延より冷却費を重視しやすい。Yは大都市の利用者への通信時間が短いQの利点を生かせる。」", "options": ["選択肢4", "A（日本）", "輸送機関", "山頂"], "ans": 0, "exp": "正解は「選択肢4」です。正解 翌日納品のXは短い通信遅延より冷却費を重視しやすい。Yは大都市の利用者への通信時間が短いQの利点を生かせる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-758", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 A立地は商品の3×60＝180トンキロ。港で受け入れる原料の輸送はゼロでも、商品は市場まで運ぶ。」", "options": ["選択肢1", "主要河川", "前期", "農場"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 A立地は商品の3×60＝180トンキロ。港で受け入れる原料の輸送はゼロでも、商品は市場まで運ぶ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-759", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Bなら原料2×60＝120で、商品は同地点に納入できる。市場で増量すれば重い商品を長距離輸送せずに済む。」", "options": ["選択肢2", "産業", "40〜64歳", "地域"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Bなら原料2×60＝120で、商品は同地点に納入できる。市場で増量すれば重い商品を長距離輸送せずに済む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-760", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Mは2×30＋3×30＝150だが、Bの120より大きい。幾何学的な中点が輸送重量を考慮した最適点とは限らない。」", "options": ["選択肢3", "P 西側", "地区", "輸送機関"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Mは2×30＋3×30＝150だが、Bの120より大きい。幾何学的な中点が輸送重量を考慮した最適点とは限らない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-761", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Bでは商品を作る前の原料2tを運ぶので120となる。工程の前後で重量が違うことを反映する必要がある。」", "options": ["選択肢4", "河川水面と排水口の高低", "作物", "年齢層"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Bでは商品を作る前の原料2tを運ぶので120となる。工程の前後で重量が違うことを反映する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-762", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 規格化したのは容器や荷役の単位であり、輸送機関ごとの運賃や距離当たり費用が同じになるわけではない。」", "options": ["選択肢1", "総流出量", "作物X", "海外就労者から家族への送金"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 規格化したのは容器や荷役の単位であり、輸送機関ごとの運賃や距離当たり費用が同じになるわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-763", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 鉄鉱石はばら積み船、原油はタンカーなど専用の大量輸送が重要である。コンテナ化で全貨物が統一されたわけではない。」", "options": ["選択肢2", "Q：日本海側", "P 西側", "A（日本）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 鉄鉱石はばら積み船、原油はタンカーなど専用の大量輸送が重要である。コンテナ化で全貨物が統一されたわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-764", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 容器が規格化されても水深・岸壁・荷役設備は港ごとに違う。大型船への対応や内陸交通網が港の機能を分ける。」", "options": ["選択肢3", "計画", "最大流量", "出荷先"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 容器が規格化されても水深・岸壁・荷役設備は港ごとに違う。大型船への対応や内陸交通網が港の機能を分ける。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-765", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 規格化された容器を荷役単位にすることで、中身を一つずつ積み直す作業を減らせる。複数の輸送機関をつなぐ基盤となる。」", "options": ["選択肢4", "選択肢1", "放牧地", "最大流量"], "ans": 0, "exp": "正解は「選択肢4」です。正解 規格化された容器を荷役単位にすることで、中身を一つずつ積み直す作業を減らせる。複数の輸送機関をつなぐ基盤となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-766", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 PとQの対応が逆である。高価値・小重量・短納期の貨物ほど高運賃でも航空を利用する合理性が高まる。」", "options": ["選択肢1", "P–Q", "選択肢2", "計画"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 PとQの対応が逆である。高価値・小重量・短納期の貨物ほど高運賃でも航空を利用する合理性が高まる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-767", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは大量・低単価なので海運、Qは小重量・高価値・短納期なので航空、Rは納期に余裕がありコンテナ海運と対応する。」", "options": ["選択肢2", "低い平均気温", "侵食", "徒歩分析"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pは大量・低単価なので海運、Qは小重量・高価値・短納期なので航空、Rは納期に余裕がありコンテナ海運と対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-768", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは航空が適するが、低い単価で大量に運ぶPの鉄鉱石を航空中心とするのは輸送費の負担が大きい。」", "options": ["選択肢3", "地理総合，地理探究", "地理総合，歴史総合，公共", "系統地理"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Qは航空が適するが、低い単価で大量に運ぶPの鉄鉱石を航空中心とするのは輸送費の負担が大きい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-769", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pの海運は適するが、Qは短納期なので航空の利点が大きい。Rは納期に余裕があり、航空を主に選ぶ根拠は弱い。」", "options": ["選択肢4", "地誌", "熱帯（A）", "冷帯（D）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pの海運は適するが、Qは短納期なので航空の利点が大きい。Rは納期に余裕があり、航空を主に選ぶ根拠は弱い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-770", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 平均距離の計算が逆である。輸送トンキロを輸送トンで割り、重量単位をそろえて求める。」", "options": ["選択肢1", "熱帯（A）", "試験", "気候"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 平均距離の計算が逆である。輸送トンキロを輸送トンで割り、重量単位をそろえて求める。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-771", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 平均距離はトンキロ÷トンで求められる。どちらも100kmとする根拠は表にない。」", "options": ["選択肢2", "冷帯（D）", "気候", "主要作物の栽培条件と主産地"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 平均距離はトンキロ÷トンで求められる。どちらも100kmとする根拠は表にない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-772", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 自動車は5,000/100＝50km、内航海運は10,000/20＝500km。海運は少ないトン数でも長距離を運び、大きなトンキロを担う。」", "options": ["選択肢3", "共通テスト", "その他", "主な工業"], "ans": 0, "exp": "正解は「選択肢3」です。正解 自動車は5,000/100＝50km、内航海運は10,000/20＝500km。海運は少ないトン数でも長距離を運び、大きなトンキロを担う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-773", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 距離の計算は正しいが、内航海運の輸送トンキロ10,000は自動車5,000より大きい。トン数の大小とは一致しない。」", "options": ["選択肢4", "地形", "エネルギー資源", "時差"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 距離の計算は正しいが、内航海運の輸送トンキロ10,000は自動車5,000より大きい。トン数の大小とは一致しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-774", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 低温輸送の説明は正しいが、チリの春と日本の春は同時期ではない。半球の違いによる季節の逆転を確認する。」", "options": ["選択肢1", "大地形", "人口", "利益相反の有無"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 低温輸送の説明は正しいが、チリの春と日本の春は同時期ではない。半球の違いによる季節の逆転を確認する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-775", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 季節の対応は合うが、低温輸送が働くのは収穫後の品質保持である。日本で収穫を早める施設栽培などの生産段階と混同している。」", "options": ["選択肢2", "その他", "図法", "A年"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 季節の対応は合うが、低温輸送が働くのは収穫後の品質保持である。日本で収穫を早める施設栽培などの生産段階と混同している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-776", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 日本とチリでは季節が逆転し、収穫時期を補完できる。適切な低温管理によって呼吸や劣化を抑え、遠隔地への生鮮輸送を可能にする。」", "options": ["選択肢3", "食料問題", "調査対象", "答えを見れば分かる"], "ans": 0, "exp": "正解は「選択肢3」です。正解 日本とチリでは季節が逆転し、収穫時期を補完できる。適切な低温管理によって呼吸や劣化を抑え、遠隔地への生鮮輸送を可能にする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-777", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 日本の春は南半球の秋に当たる。また一般に冷蔵は果実の呼吸や劣化を抑えるためで、成熟を進めることを主目的としない。」", "options": ["選択肢4", "鉱産資源", "気候・自然環境", "候補"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 日本の春は南半球の秋に当たる。また一般に冷蔵は果実の呼吸や劣化を抑えるためで、成熟を進めることを主目的としない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-778", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 銅輸出額は0.9×1.2＝1.08倍。銅の構成比80％のPでは全体が6.4％、20％のQでは1.6％増える。」", "options": ["選択肢1", "主な工業", "A年", "旧版地図"], "ans": 0, "exp": "正解は「選択肢1」です。正解 銅輸出額は0.9×1.2＝1.08倍。銅の構成比80％のPでは全体が6.4％、20％のQでは1.6％増える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-779", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 数量の−10％と価格の＋20％を単純に足している。また銅以外の輸出は不変なので全体に一律適用はできない。」", "options": ["選択肢2", "村落", "2択から決められない", "雲底"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 数量の−10％と価格の＋20％を単純に足している。また銅以外の輸出は不変なので全体に一律適用はできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-780", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 数量は減るが単価が上昇する。輸出金額は数量×単価なので、数量の減少率だけでは変化を求められない。」", "options": ["選択肢3", "図法", "地図", "乾季（11〜3月）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 数量は減るが単価が上昇する。輸出金額は数量×単価なので、数量の減少率だけでは変化を求められない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-781", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 数量減少を無視している。価格変動による輸出全体への影響は銅の構成比が高いPの方が大きい。」", "options": ["選択肢4", "GIS", "データ", "時間帯"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 数量減少を無視している。価格変動による輸出全体への影響は銅の構成比が高いPの方が大きい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-782", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aの部品、Bの組立、Cの設計・販売が結び付いている。最終輸出国だけで原料・技術・価値の出所を判断するのは不十分。」", "options": ["選択肢1", "調査方法", "堆積物", "貨物"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Aの部品、Bの組立、Cの設計・販売が結び付いている。最終輸出国だけで原料・技術・価値の出所を判断するのは不十分。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-783", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 同じ製造業内でも部品と完成品は異なる工程で、中間財の取引が起こる。産業名だけで分業の形は決まらない。」", "options": ["選択肢2", "地図・GIS・地形", "1日目", "後期"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 同じ製造業内でも部品と完成品は異なる工程で、中間財の取引が起こる。産業名だけで分業の形は決まらない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-784", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 B国の完成品には輸入部品などの価値が含まれる。輸出総額とB国が付け加えた価値を区別する必要がある。」", "options": ["選択肢3", "人口・都市・生活文化", "時刻帯", "海外へ出国した20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 B国の完成品には輸入部品などの価値が含まれる。輸出総額とB国が付け加えた価値を区別する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-785", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 設計と部品供給は異なる役割である。Cの設計があってもAからの部品供給が止まればBの組立に影響し得る。」", "options": ["選択肢4", "A年", "乾季（11〜3月）", "作物"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 設計と部品供給は異なる役割である。Cの設計があってもAからの部品供給が止まればBの組立に影響し得る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-786", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 国境を越えるたびに増えた価値は加工で付け加えた部分である。すでに含まれる素材価値まで新規の価値と数えない。」", "options": ["選択肢1", "用語があいまい", "期間", "産業"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 国境を越えるたびに増えた価値は加工で付け加えた部分である。すでに含まれる素材価値まで新規の価値と数えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-787", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 通常の輸出統計では各国境での取引額を記録する。最終完成品になっても以前の中間財輸出が統計から消えるわけではない。」", "options": ["選択肢2", "時間が足りない", "原料炭", "指標"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 通常の輸出統計では各国境での取引額を記録する。最終完成品になっても以前の中間財輸出が統計から消えるわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-788", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 60はBとCの付加価値だけを足した値である。最初のAの素材40も国内で生まれた価値に含む。」", "options": ["選択肢3", "斜面", "輸送機関", "観光地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 60はBとCの付加価値だけを足した値である。最初のAの素材40も国内で生まれた価値に含む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-789", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 A40、Bは70−40＝30、Cは100−70＝30で合計100。輸出額は40＋70＋100＝210となり、部品に含まれる既存の価値が繰り返し計上される。」", "options": ["選択肢4", "Pからの水平距離", "前期", "P–Q"], "ans": 0, "exp": "正解は「選択肢4」です。正解 A40、Bは70−40＝30、Cは100−70＝30で合計100。輸出額は40＋70＋100＝210となり、部品に含まれる既存の価値が繰り返し計上される。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-790", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 取扱総量は50から100に増えるが、増加50は全て中継分。立地する産業と航路の結節機能を区別して読む。」", "options": ["選択肢1", "データ", "40〜64歳", "地理総合，歴史総合，公共"], "ans": 0, "exp": "正解は「選択肢1」です。正解 取扱総量は50から100に増えるが、増加50は全て中継分。立地する産業と航路の結節機能を区別して読む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-791", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 国内発着貨物は20で不変、中継が30から80へ増えている。港を通る貨物を国内工場の生産品とみなしてはならない。」", "options": ["選択肢2", "礫・砂・泥の割合", "地区", "温帯（C）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 国内発着貨物は20で不変、中継が30から80へ増えている。港を通る貨物を国内工場の生産品とみなしてはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-792", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 この表の取扱量は中継も含む定義である。目的次第で分けて分析するが、定義を変えて中継をなかったことにはできない。」", "options": ["選択肢3", "旧版地図", "作物", "地形"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 この表の取扱量は中継も含む定義である。目的次第で分けて分析するが、定義を変えて中継をなかったことにはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-793", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 中継でも積替え・保管・船の接岸などが必要になる。国内消費されない貨物も港湾サービスの需要を生む。」", "options": ["選択肢4", "12〜2月／6〜8月の各月降水量", "作物X", "ホイットルセイの農業地域区分"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 中継でも積替え・保管・船の接岸などが必要になる。国内消費されない貨物も港湾サービスの需要を生む。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-794", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 生産地に基づく集計と消費地に基づく集計を区別できる。両者を分けることこそ、移転に伴う変化の理解に必要である。」", "options": ["選択肢1", "3日目", "P 西側", "工業の変化"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 生産地に基づく集計と消費地に基づく集計を区別できる。両者を分けることこそ、移転に伴う変化の理解に必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-795", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 P国内は100から40で60％減るが、二国合計は150から180へ増える。国内排出削減と消費に伴う排出削減は同じではない。」", "options": ["選択肢2", "時刻帯", "最大流量", "図法"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 P国内は100から40で60％減るが、二国合計は150から180へ増える。国内排出削減と消費に伴う排出削減は同じではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-796", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 国内は(100−40)/100＝60％減。消費に対応する合計は150から180で20％増える。国際分業を含めると評価が変わる例である。」", "options": ["選択肢3", "季節", "放牧地", "情報の限界"], "ans": 0, "exp": "正解は「選択肢3」です。正解 国内は(100−40)/100＝60％減。消費に対応する合計は150から180で20％増える。国際分業を含めると評価が変わる例である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-797", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qで作った分もPへ供給される条件である。生産地の排出増を、その国の住民の消費増と読み替えることはできない。」", "options": ["選択肢4", "農場", "選択肢1", "防災・環境・地域調査"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Qで作った分もPへ供給される条件である。生産地の排出増を、その国の住民の消費増と読み替えることはできない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-798", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 精製能力を増やしても鉱山Mに依存する点は同じである。加工拠点の分散だけで採掘源の停止を回避できない。」", "options": ["選択肢1", "林齢構成", "侵食", "時間が足りない"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 精製能力を増やしても鉱山Mに依存する点は同じである。加工拠点の分散だけで採掘源の停止を回避できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-799", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 完成品工場の数が増えても部品Zへの依存は共通する。上流の供給源を変えなければ同じ障害が広がる。」", "options": ["選択肢2", "時間帯", "地理総合，歴史総合，公共", "地点"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 完成品工場の数が増えても部品Zへの依存は共通する。上流の供給源を変えなければ同じ障害が広がる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-800", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 完成品を運ぶ船会社を変えても、上流の鉱山Mが止まれば部品原料は不足する。下流輸送と上流供給を区別する。」", "options": ["選択肢3", "原料炭", "熱帯（A）", "堆積物"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 完成品を運ぶ船会社を変えても、上流の鉱山Mが止まれば部品原料は不足する。下流輸送と上流供給を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-801", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 鉱山から部品までMを通らない供給経路を持つことで、M停止の影響が全完成品工場へ伝わることを抑えられる。」", "options": ["選択肢4", "用地", "試験", "3日目"], "ans": 0, "exp": "正解は「選択肢4」です。正解 鉱山から部品までMを通らない供給経路を持つことで、M停止の影響が全完成品工場へ伝わることを抑えられる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-802", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 自然増減は600−1,000＝−400人、社会増減は3,200−2,000＝1,200人で、純増800人は年初人口の0.8％である。」", "options": ["選択肢1", "100,000人", "気候", "雨季（6〜9月）"], "ans": 0, "exp": "正解は「選択肢1」です。正解 自然増減は600−1,000＝−400人、社会増減は3,200−2,000＝1,200人で、純増800人は年初人口の0.8％である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-803", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 出生数は死亡数より少なく、転入数は転出数より多い。自然増減と社会増減の向きが逆である。」", "options": ["選択肢2", "現在", "その他", "方式"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 出生数は死亡数より少なく、転入数は転出数より多い。自然増減と社会増減の向きが逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-804", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 資料では自然減・社会増であり、総人口は増える。出生と死亡、転入と転出を区別して計算する必要がある。」", "options": ["選択肢3", "年齢層", "エネルギー資源", "用地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 資料では自然減・社会増であり、総人口は増える。出生と死亡、転入と転出を区別して計算する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-805", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 1,200人の転入超過から400人の自然減を引くため、純増は800人となる。2.0％は転出人数を人口で割った値である。」", "options": ["選択肢4", "40〜64歳", "人口", "前期"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 1,200人の転入超過から400人の自然減を引くため、純増は800人となる。2.0％は転出人数を人口で割った値である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-806", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Cは年少人口指数が低下しているが、自然増加率は11−6＝5‰＝0.5％である。」", "options": ["選択肢1", "海外へ出国した20〜39歳人口", "図法", "出国前の20〜39歳人口"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Cは年少人口指数が低下しているが、自然増加率は11−6＝5‰＝0.5％である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-807", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Dの自然増加率は18−12＝6‰＝0.6％であり、1.5％にはならない。」", "options": ["選択肢2", "住宅地", "調査対象", "区域"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Dの自然増加率は18−12＝6‰＝0.6％であり、1.5％にはならない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-808", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aも自然増加率は1.5％だが、出生率も年少人口指数も上昇している。出生率低下が進む人口転換の局面とは対応しない。」", "options": ["選択肢3", "区域", "気候・自然環境", "降水季節性"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Aも自然増加率は1.5％だが、出生率も年少人口指数も上昇している。出生率低下が進む人口転換の局面とは対応しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-809", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Bは23−8＝15‰＝1.5％である。出生率の低下とともに年少人口指数が65から48へ低下し、生産年齢人口に対する年少人口の比重も小さくなっている。」", "options": ["選択肢4", "C（中国沿海部）", "A年", "河川水面と排水口の高低"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Bは23−8＝15‰＝1.5％である。出生率の低下とともに年少人口指数が65から48へ低下し、生産年齢人口に対する年少人口の比重も小さくなっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-810", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 総面積当たりはA200、B400人/km²だが、可住地当たりはA2,000、B800人/km²である。山地を広く含む行政区の単純比較には注意が必要である。」", "options": ["選択肢1", "作物X", "2択から決められない", "放牧地"], "ans": 0, "exp": "正解は「選択肢1」です。正解 総面積当たりはA200、B400人/km²だが、可住地当たりはA2,000、B800人/km²である。山地を広く含む行政区の単純比較には注意が必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-811", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの総面積当たり密度はBより低い。また平均密度から市内に均等に人口が分布するとはいえない。」", "options": ["選択肢2", "出荷先", "地図", "選択肢4"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Aの総面積当たり密度はBより低い。また平均密度から市内に均等に人口が分布するとはいえない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-812", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 総面積当たりと可住地当たりの順位を逆にしている。人口をそれぞれの面積で割って比較する。」", "options": ["選択肢3", "Q 東側", "データ", "地理総合，地理探究"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 総面積当たりと可住地当たりの順位を逆にしている。人口をそれぞれの面積で割って比較する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-813", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 総面積での順位を可住地にも当てはめている。Aは可住地が総面積の1割なので、分母を変える影響が大きい。」", "options": ["選択肢4", "指標", "堆積物", "乾燥帯（B）"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 総面積での順位を可住地にも当てはめている。Aは可住地が総面積の1割なので、分母を変える影響が大きい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-814", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aは高齢人口が増えている。Bは総人口が高齢人口より速く減少するため、高齢化率は上がる。」", "options": ["選択肢1", "時刻", "1日目", "私大（一般選抜）"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Aは高齢人口が増えている。Bは総人口が高齢人口より速く減少するため、高齢化率は上がる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-815", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Bは分母の総人口が30％減り、高齢人口も12.5％減っている。率の上昇だけでは高齢人口の増加を意味しない。」", "options": ["選択肢2", "放牧地", "時刻帯", "その他"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Bは分母の総人口が30％減り、高齢人口も12.5％減っている。率の上昇だけでは高齢人口の増加を意味しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-816", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの高齢化率は25→30％であり、総人口は40万人で変わらない。Bの人数の計算は正しいがAの説明が誤る。」", "options": ["選択肢3", "中心部", "乾季（11〜3月）", "工業立地"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Aの高齢化率は25→30％であり、総人口は40万人で変わらない。Bの人数の計算は正しいがAの説明が誤る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-817", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aの高齢人口は10万→12万人で2万人増、Bは8,000→7,000人で減少する。Bの率は40→50％に上昇している。」", "options": ["選択肢4", "選択肢2", "期間", "生活文化"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Aの高齢人口は10万→12万人で2万人増、Bは8,000→7,000人で減少する。Bの率は40→50％に上昇している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-818", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Bは（22＋8）÷70×100≒42.9で最小である。年少人口が減り高齢人口はまだ少ないため、生産年齢人口の割合が高い。」", "options": ["選択肢1", "徒歩分析", "原料炭", "調査方法"], "ans": 0, "exp": "正解は「選択肢1」です。正解 Bは（22＋8）÷70×100≒42.9で最小である。年少人口が減り高齢人口はまだ少ないため、生産年齢人口の割合が高い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-819", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの指数は45÷55×100≒81.8で、年少人口の割合が高い。生産年齢人口に対する従属人口の比重はBより大きい。」", "options": ["選択肢2", "細かい火山灰", "輸送機関", "世界の諸地域・日本"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Aの指数は45÷55×100≒81.8で、年少人口の割合が高い。生産年齢人口に対する従属人口の比重はBより大きい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-820", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Dは35÷65×100≒53.8であり、Bより高い。生産年齢人口割合が最大の地域を探す必要がある。」", "options": ["選択肢3", "地理総合，歴史総合，公共", "前期", "2択から決められない"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Dは35÷65×100≒53.8であり、Bより高い。生産年齢人口割合が最大の地域を探す必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-821", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Cは高齢人口が多く、指数は50÷50×100＝100となる。年少人口が少ないことだけで人口ボーナスとは判断できない。」", "options": ["選択肢4", "地理総合", "40〜64歳", "Pからの水平距離"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Cは高齢人口が多く、指数は50÷50×100＝100となる。年少人口が少ないことだけで人口ボーナスとは判断できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-822", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 寿命は死亡と生存に関係する指標で、長寿化が粗出生率を直接高める関係はない。年齢構成を確認する必要がある。」", "options": ["選択肢1", "乾燥帯（B）", "地区", "地下水"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 寿命は死亡と生存に関係する指標で、長寿化が粗出生率を直接高める関係はない。年齢構成を確認する必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-823", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 期間合計特殊出生率は女性の年齢別出生率を合計する指標である。人口全体に占める出産年齢女性の割合が違えば、粗出生率は異なりうる。」", "options": ["選択肢2", "寒帯（E）", "作物", "2日目"], "ans": 0, "exp": "正解は「選択肢2」です。正解 期間合計特殊出生率は女性の年齢別出生率を合計する指標である。人口全体に占める出産年齢女性の割合が違えば、粗出生率は異なりうる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-824", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 同じ合計特殊出生率でも、年齢別の女性人口や各年齢別出生率の組合せは異なりうる。」", "options": ["選択肢3", "国公立二次（論述）", "作物X", "季節"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 同じ合計特殊出生率でも、年齢別の女性人口や各年齢別出生率の組合せは異なりうる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-825", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人口1,000人当たりに換算済みなので、人口規模の大きさだけで率の大小は決まらない。」", "options": ["選択肢4", "気候", "P 西側", "期間"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 人口1,000人当たりに換算済みなので、人口規模の大きさだけで率の大小は決まらない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-826", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 年齢別死亡率が同じでも、その年齢層の重みが違えば全人口の粗死亡率は異なる。」", "options": ["選択肢1", "河川がつくる地形", "最大流量", "拠点"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 年齢別死亡率が同じでも、その年齢層の重みが違えば全人口の粗死亡率は異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-827", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高齢人口が多いだけでも粗死亡率は上がる。設問では年齢別死亡率を等しく設定しており、医療水準の差は読み取れない。」", "options": ["選択肢2", "ホイットルセイの農業地域区分", "放牧地", "現在"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 高齢人口が多いだけでも粗死亡率は上がる。設問では年齢別死亡率を等しく設定しており、医療水準の差は読み取れない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-828", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高齢人口割合はAの方が高いため、加重平均となる粗死亡率もAの方が高い。」", "options": ["選択肢3", "林業・水産業", "選択肢1", "65歳以上"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 高齢人口割合はAの方が高いため、加重平均となる粗死亡率もAの方が高い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-829", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは0.7×2＋0.3×40＝13.4‰、Bは0.9×2＋0.1×40＝5.8‰となる。年齢別死亡率が同じなので、差は年齢構成から生じる。」", "options": ["選択肢4", "工業立地", "侵食", "バス"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Aは0.7×2＋0.3×40＝13.4‰、Bは0.9×2＋0.1×40＝5.8‰となる。年齢別死亡率が同じなので、差は年齢構成から生じる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-830", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 一般的な人口転換は多産多死から少産少死へ進む。Pの自然増加率は4‰で、Rの26‰より低い。」", "options": ["選択肢1", "人口", "地理総合，歴史総合，公共", "作物X"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 一般的な人口転換は多産多死から少産少死へ進む。Pの自然増加率は4‰で、Rの26‰より低い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-831", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Sは出生率がすでに低下した段階で、出生率の高いRより後に位置付けるのが一般的な人口転換である。」", "options": ["選択肢2", "民族・宗教・言語", "熱帯（A）", "流通"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Sは出生率がすでに低下した段階で、出生率の高いRより後に位置付けるのが一般的な人口転換である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-832", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Qは出生・死亡とも低い段階で、出生率が比較的高いSより後である。差もSの14‰よりRの26‰が大きい。」", "options": ["選択肢3", "時差", "試験", "Q：日本海側"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Qは出生・死亡とも低い段階で、出生率が比較的高いSより後である。差もSの14‰よりRの26‰が大きい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-833", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 出生・死亡とも高いPから、死亡率が先行低下したR、出生率も下がるS、低出生・低死亡のQへ進む。差はRの26‰が最大である。」", "options": ["選択肢4", "地球的課題", "気候", "選択肢2"], "ans": 0, "exp": "正解は「選択肢4」です。正解 出生・死亡とも高いPから、死亡率が先行低下したR、出生率も下がるS、低出生・低死亡のQへ進む。差はRの26‰が最大である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-834", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 今の年少人口が高齢人口になるには長期間かかる。出生減少が翌年の高齢人口を減らすわけではない。」", "options": ["選択肢1", "情報の限界", "その他", "科目名"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 今の年少人口が高齢人口になるには長期間かかる。出生減少が翌年の高齢人口を減らすわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-835", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人口置換水準は長期的な世代交代に関する目安であり、短期の人口増減は既存の年齢構成にも左右される。」", "options": ["選択肢2", "気候・自然環境", "エネルギー資源", "熱帯（A）"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 人口置換水準は長期的な世代交代に関する目安であり、短期の人口増減は既存の年齢構成にも左右される。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-836", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 出生率低下と死亡率低下は独立した人口動態で、同じ幅で変わる関係はない。資料の若年層の厚さを考える必要がある。」", "options": ["選択肢3", "世界の諸地域・日本", "人口", "国公立二次（論述）"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 出生率低下と死亡率低下は独立した人口動態で、同じ幅で変わる関係はない。資料の若年層の厚さを考える必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-837", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 大きな若年世代が出産年齢に入れば、女性一人当たりの出生が減っても出生数は多くなりうる。年齢構成が過去の出生傾向を引き継ぐ現象である。」", "options": ["選択肢4", "B年", "図法", "海岸の地形"], "ans": 0, "exp": "正解は「選択肢4」です。正解 大きな若年世代が出産年齢に入れば、女性一人当たりの出生が減っても出生数は多くなりうる。年齢構成が過去の出生傾向を引き継ぐ現象である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-838", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 移動がなければ1,950人になるはずだが、実際は1,250人なので純移動は−700人である。進学・就職期の転出は若年成人層のくびれにつながる。」", "options": ["選択肢1", "図表になると迷う", "調査対象", "鉱産資源"], "ans": 0, "exp": "正解は「選択肢1」です。正解 移動がなければ1,950人になるはずだが、実際は1,250人なので純移動は−700人である。進学・就職期の転出は若年成人層のくびれにつながる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-839", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人口差750人には死亡50人が含まれる。移動分はそこから死亡を分けた700人である。」", "options": ["選択肢2", "答えを見れば分かる", "気候・自然環境", "民族・宗教・言語"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 人口差750人には死亡50人が含まれる。移動分はそこから死亡を分けた700人である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-840", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 実際の人口は無移動の場合より少ないため、転入超過ではなく転出超過である。追跡対象も年少層ではなく20歳代となる。」", "options": ["選択肢3", "地図", "A年", "調査対象"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 実際の人口は無移動の場合より少ないため、転入超過ではなく転出超過である。追跡対象も年少層ではなく20歳代となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-841", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 このコーホートの自然減少は死亡50人だけである。10年後の同じ世代を追うので、高齢層のくびれではない。」", "options": ["選択肢4", "地点", "2択から決められない", "人口・都市・生活文化"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 このコーホートの自然減少は死亡50人だけである。10年後の同じ世代を追うので、高齢層のくびれではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-842", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 出生増ならまず0〜14歳が男女とも広くなる。図の突出は成人男性に限られている。」", "options": ["選択肢1", "位置", "地図", "図表になると迷う"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 出生増ならまず0〜14歳が男女とも広くなる。図の突出は成人男性に限られている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-843", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 若年男性の転出なら男性側が狭くなる。寿命の差だけでは30〜44歳男性の突出を説明できない。」", "options": ["選択肢2", "地下水", "データ", "領域"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 若年男性の転出なら男性側が狭くなる。寿命の差だけでは30〜44歳男性の突出を説明できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-844", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 15〜59歳で男性が女性を大きく上回り、特に30〜44歳男性が多い。年少・高齢層では差が小さく、働く年齢の男性の選択的流入に合う。」", "options": ["選択肢3", "現在の地図", "堆積物", "礫・砂・泥の割合"], "ans": 0, "exp": "正解は「選択肢3」です。正解 15〜59歳で男性が女性を大きく上回り、特に30〜44歳男性が多い。年少・高齢層では差が小さく、働く年齢の男性の選択的流入に合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-845", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 高齢人口3,000人は一定だが、総人口は1万人から7,500人に減った。65歳未満の転出超過も分母の縮小を通じて高齢化率を押し上げる。」", "options": ["選択肢1", "雲底", "時刻帯", "地表からの深さ（m）"], "ans": 0, "exp": "正解は「選択肢1」です。正解 高齢人口3,000人は一定だが、総人口は1万人から7,500人に減った。65歳未満の転出超過も分母の縮小を通じて高齢化率を押し上げる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-846", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高齢人口が一定でも65歳未満が減れば年齢構成は変わり、高齢化率は上がる。」", "options": ["選択肢2", "さらに下", "乾季（11〜3月）", "林齢構成"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 高齢人口が一定でも65歳未満が減れば年齢構成は変わり、高齢化率は上がる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-847", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高齢人口の実数は表では一定である。高齢化率上昇の原因を高齢者の人数増加に限定できない。」", "options": ["選択肢3", "雨季（6〜9月）", "期間", "輸送"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 高齢人口の実数は表では一定である。高齢化率上昇の原因を高齢者の人数増加に限定できない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-848", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 現在の率は3,000÷7,500＝40％である。高齢人口の増加も表にはない。」", "options": ["選択肢4", "総労働時間", "原料炭", "10年前"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 現在の率は3,000÷7,500＝40％である。高齢人口の増加も表にはない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-849", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Bの転入超過率は1％でAと同じである。Bの高齢者中心の移動という説明だけは資料に合う。」", "options": ["選択肢1", "期間", "輸送機関", "40〜64歳"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Bの転入超過率は1％でAと同じである。Bの高齢者中心の移動という説明だけは資料に合う。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-850", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの純流入人数は多いが、人口規模もBの2倍なので率は等しい。人数と率の区別が必要である。」", "options": ["選択肢2", "地域", "前期", "店舗"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 Aの純流入人数は多いが、人口規模もBの2倍なので率は等しい。人数と率の区別が必要である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-851", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Aの純流入の8割は20〜39歳であり、Bでは8割が65歳以上である。高齢化を進める方向の効果はBの方が強い。」", "options": ["選択肢3", "輸送", "40〜64歳", "主要河川"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 Aの純流入の8割は20〜39歳であり、Bでは8割が65歳以上である。高齢化を進める方向の効果はBの方が強い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-852", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Aは1,000÷10万、Bは500÷5万でともに1％である。年初年齢構成が同じなら、若年成人中心のAの流入は高齢者中心のBより若返りに働く。」", "options": ["選択肢4", "貨物", "地区", "Q 東側"], "ans": 0, "exp": "正解は「選択肢4」です。正解 Aは1,000÷10万、Bは500÷5万でともに1％である。年初年齢構成が同じなら、若年成人中心のAの流入は高齢者中心のBより若返りに働く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-853", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 前期は都心地区から郊外市へ出る人の方が多い。都心地区との往来があるだけでは都心回帰とはいえない。」", "options": ["選択肢1", "時点", "作物", "P：太平洋側"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 前期は都心地区から郊外市へ出る人の方が多い。都心地区との往来があるだけでは都心回帰とはいえない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-854", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 後期は都心地区Cへの流入が流出より多い。移動の総数が増えたことと郊外化の継続は別である。」", "options": ["選択肢2", "前期", "作物X", "選択肢1"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 後期は都心地区Cへの流入が流出より多い。移動の総数が増えたことと郊外化の継続は別である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-855", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 前期はC→SがS→Cを1,000人上回り、後期は逆にS→Cが500人上回る。居住人口の移動方向が中心から郊外、郊外から中心へ変わっている。」", "options": ["選択肢3", "18〜24歳", "P 西側", "細かい火山灰"], "ans": 0, "exp": "正解は「選択肢3」です。正解 前期はC→SがS→Cを1,000人上回り、後期は逆にS→Cが500人上回る。居住人口の移動方向が中心から郊外、郊外から中心へ変わっている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-856", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 人口の純移動方向を逆に読んでいる。表の出発地と到着地を区別して差を取る必要がある。」", "options": ["選択肢4", "65歳以上", "最大流量", "気候帯"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 人口の純移動方向を逆に読んでいる。表の出発地と到着地を区別して差を取る必要がある。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-857", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 40〜64歳には転勤などの移動がありうるが、表の転出率は3％である。理由としてありうることと、最大率の層であることは別である。」", "options": ["選択肢1", "海外就労者から家族への送金", "放牧地", "共通テスト"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 40〜64歳には転勤などの移動がありうるが、表の転出率は3％である。理由としてありうることと、最大率の層であることは別である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-858", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 25〜39歳の転出人数は多いが率は2,400÷30,000＝8％であり、18〜24歳より低い。」", "options": ["選択肢2", "店舗", "選択肢1", "河川がつくる地形"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 25〜39歳の転出人数は多いが率は2,400÷30,000＝8％であり、18〜24歳より低い。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-859", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 転出率は18〜24歳が1,600÷8,000＝20％で最大である。高等教育への進学や初めての就職が集中する年齢と対応する。」", "options": ["選択肢3", "作物", "侵食", "エネルギー資源"], "ans": 0, "exp": "正解は「選択肢3」です。正解 転出率は18〜24歳が1,600÷8,000＝20％で最大である。高等教育への進学や初めての就職が集中する年齢と対応する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-860", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 高齢層にも退職後移住や同居に伴う移動はあるが、表の転出率は1％で最小である。年齢に合う理由だけで選ばず率を比較する。」", "options": ["選択肢4", "時期", "地理総合，歴史総合，公共", "村落"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 高齢層にも退職後移住や同居に伴う移動はあるが、表の転出率は1％で最小である。年齢に合う理由だけで選ばず率を比較する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-861", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 農地の細分化は出身地の経済条件であり、移動に必要な情報・住居を提供する働きではない。」", "options": ["選択肢1", "降水季節性", "熱帯（A）", "地球的課題"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 農地の細分化は出身地の経済条件であり、移動に必要な情報・住居を提供する働きではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-862", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 出身地の生計悪化がプッシュ、移住先の雇用機会がプルに当たる。既存の移住者とのつながりは情報や住居の探索費用を下げる。」", "options": ["選択肢2", "区分", "試験", "産業・資源・流通"], "ans": 0, "exp": "正解は「選択肢2」です。正解 出身地の生計悪化がプッシュ、移住先の雇用機会がプルに当たる。既存の移住者とのつながりは情報や住居の探索費用を下げる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-863", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 紹介網は出身地の生活を悪化させる要因ではない。農業所得低下も移動手続きを助ける働きではなく、出身地を離れる動機となる。」", "options": ["選択肢3", "流通", "気候", "用語があいまい"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 紹介網は出身地の生活を悪化させる要因ではない。農業所得低下も移動手続きを助ける働きではなく、出身地を離れる動機となる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-864", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 出身地と移住先の条件を逆にしている。プッシュは出身地から離れる動機、プルは移住先を選ぶ誘因である。」", "options": ["選択肢4", "最大流量", "その他", "地図"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 出身地と移住先の条件を逆にしている。プッシュは出身地から離れる動機、プルは移住先を選ぶ誘因である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-865", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 性比の方向は合う。海外就労者がRの家族へ送るお金と、R域内で作られた財・サービスの付加価値は区別する。」", "options": ["選択肢1", "P：太平洋側", "エネルギー資源", "地表勾配"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 性比の方向は合う。海外就労者がRの家族へ送るお金と、R域内で作られた財・サービスの付加価値は区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-866", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 性比は女性100人に対する男性数なので、100から430÷570×100≒75.4へ低下する。送金は家計の購買力を支えるが、その受取額自体はR域内での新たな生産ではない。」", "options": ["選択肢2", "観光地", "人口", "12〜2月／6〜8月の各月降水量"], "ans": 0, "exp": "正解は「選択肢2」です。正解 性比は女性100人に対する男性数なので、100から430÷570×100≒75.4へ低下する。送金は家計の購買力を支えるが、その受取額自体はR域内での新たな生産ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-867", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 男性170人・女性30人が出るため性比は低下する。また海外からの私的送金を、受取地域の生産額そのものへ計上する説明も誤る。」", "options": ["選択肢3", "周辺部", "図法", "さらに下"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 男性170人・女性30人が出るため性比は低下する。また海外からの私的送金を、受取地域の生産額そのものへ計上する説明も誤る。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-868", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 送金の説明は合う。男性の流出が多いので男性数を女性数で割る性比は低下する。女性の相対的な割合が増えることを性比上昇と取り違えている。」", "options": ["選択肢4", "選択肢3", "調査対象", "産地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 送金の説明は合う。男性の流出が多いので男性数を女性数で割る性比は低下する。女性の相対的な割合が増えることを性比上昇と取り違えている。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-869", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは国際国境を越えていない。Qは越えているので、A国内にとどまる国内避難民という区分ではない。」", "options": ["選択肢1", "侵食", "気候・自然環境", "原料炭"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 Pは国際国境を越えていない。Qは越えているので、A国内にとどまる国内避難民という区分ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-870", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 Pは自国の国境内で強制移動したので国内避難民に当たる。Qは国外で保護を申請し未決定という条件なので庇護申請者として区分する。」", "options": ["選択肢2", "科目名", "A年", "時点"], "ans": 0, "exp": "正解は「選択肢2」です。正解 Pは自国の国境内で強制移動したので国内避難民に当たる。Qは国外で保護を申請し未決定という条件なので庇護申請者として区分する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-871", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 国境を越えた事実と申請だけで、審査が完了し難民認定されたとはいえない。Qは条件上、審査中の庇護申請者である。」", "options": ["選択肢3", "系統地理", "2択から決められない", "25〜39歳"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 国境を越えた事実と申請だけで、審査が完了し難民認定されたとはいえない。Qは条件上、審査中の庇護申請者である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-872", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 Pは国外で庇護を申請した事例ではない。Qの移動理由も季節的な就労ではなく紛争からの避難である。」", "options": ["選択肢4", "気候帯", "地図", "住宅地"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 Pは国外で庇護を申請した事例ではない。Qの移動理由も季節的な就労ではなく紛争からの避難である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-873", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 昼夜間人口の対応は合うが、勤務先が国外というだけでは国際的な住所移動にならない。Rへ毎日帰宅する条件を確認する。」", "options": ["選択肢1", "温帯（C）", "データ", "時期"], "ans": 0, "exp": "正解は「選択肢1」です。不正解 昼夜間人口の対応は合うが、勤務先が国外というだけでは国際的な住所移動にならない。Rへ毎日帰宅する条件を確認する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-874", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 常住地はRのままであり、従業地集計ではCの昼間人口に関係する。日帰りの国境通過は住所を移す移住とは異なる。」", "options": ["選択肢2", "試験", "堆積物", "P 西側"], "ans": 0, "exp": "正解は「選択肢2」です。正解 常住地はRのままであり、従業地集計ではCの昼間人口に関係する。日帰りの国境通過は住所を移す移住とは異なる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-875", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 住所移動には数えない点は合う。夜間人口は住居のあるR、昼間の従業地はCなので、二つの人口の対応が逆である。」", "options": ["選択肢3", "私大（一般選抜）", "1日目", "時刻"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 住所移動には数えない点は合う。夜間人口は住居のあるR、昼間の従業地はCなので、二つの人口の対応が逆である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-876", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 昼夜間人口の対応が逆であり、通勤を移住とする点も誤る。常住地と従業地、往復移動と定住移動を分ける。」", "options": ["選択肢4", "プレート境界", "時刻帯", "周辺部"], "ans": tions": ["選択肢1", "都市", "前期", "林業・水産業"], "ans": 0, "exp": "正解は「選択肢1」です。正解 都市人口率は30％から約42.9％へ上昇する。農村人口も70→80百万人と増えており、都市化と農村人口減少は同義ではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-882", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 都市化が進んでも国全体の人口が増えていれば農村人口も増える場合がある。表では10百万人増加している。」", "options": ["選択肢2", "生活文化", "40〜64歳", "都市"], "ans": 0, "exp": "正解は「選択肢2」です。不正解 都市化が進んでも国全体の人口が増えていれば農村人口も増える場合がある。表では10百万人増加している。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-883", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 都市人口は2倍だが農村人口は約1.14倍である。同じ割合で増えたわけではない。」", "options": ["選択肢3", "地形図", "地区", "GIS"], "ans": 0, "exp": "正解は「選択肢3」です。不正解 都市人口は2倍だが農村人口は約1.14倍である。同じ割合で増えたわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-884", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 都市人口の増加率は100％で農村の約14.3％より高いため、都市人口率は上昇する。」", "options": ["選択肢4", "調査対象", "作物", "気候・自然環境"], "ans": 0, "exp": "正解は「選択肢4」です。不正解 都市人口の増加率は100％で農村の約14.3％より高いため、都市人口率は上昇する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-885", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「正解 30万人の増加から区分変更20万人と自然増4万人を除くと6万人である。都市人口増加は人口移動だけで生じるわけではない。」", "options": ["選択肢1", "利益相反の有無", "作物X", "今の状態"], "ans": 0, "exp": "正解は「選択肢1」です。正解 30万人の増加から区分変更20万人と自然増4万人を除くと6万人である。都市人口増加は人口移動だけで生じるわけではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを見る"}, {"id": "GEO-WEB-886", "cat": "CLIM", "catName": "統計・気候(Web)", "priority": "A", "figId": "", "imgUrl": "", "q": "次の特徴・説明に該当する用語・区分として最も適切なものはどれか。\n「不正解 30万人から自然増4万人だけを除いてお
