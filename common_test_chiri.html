<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>共通テスト対策 地理</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --sub: #334155;
      --pri: #0f766e;
      --pri-bg: #ccfbf1;
      --bdr: #cbd5e1;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --ng: #b91c1c;
      --ng-bg: #fee2e2;
      --warn: #b45309;
      --warn-bg: #fef3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071112;
        --card: #102022;
        --text: #f0fdfa;
        --sub: #cbd5e1;
        --pri: #2dd4bf;
        --pri-bg: rgba(45, 212, 191, 0.16);
        --bdr: #264246;
        --ok: #4ade80;
        --ok-bg: rgba(74, 222, 128, 0.16);
        --ng: #f87171;
        --ng-bg: rgba(248, 113, 113, 0.16);
        --warn: #fbbf24;
        --warn-bg: rgba(251, 191, 36, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    #app {
      display: flex; flex-direction: column; width: 100%;
      height: 100vh; height: 100dvh; max-width: 720px; margin: 0 auto;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      gap: 6px;
    }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 38px; gap: 6px; flex-shrink: 0; }
    .hbtn {
      font-size: 13px; font-weight: 800; color: var(--pri); background: var(--card);
      border: 2px solid var(--bdr); padding: 5px 9px; border-radius: 9px;
      text-decoration: none; cursor: pointer; white-space: nowrap;
    }
    .htitle { font-size: 16px; font-weight: 900; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
    .view { display: none; flex-direction: column; width: 100%; height: 100%; min-height: 0; gap: 6px; }
    .view.active { display: flex; }

    /* ローディング・エラー画面 */
    .status-card {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 20px; flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 12px;
    }
    .status-msg { font-size: 15px; font-weight: 800; line-height: 1.55; color: var(--sub); }

    /* ホーム画面 */
    .home-card {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 10px 12px; display: flex; flex-direction: column;
      justify-content: space-between; flex: 1; min-height: 0; gap: 6px;
    }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0; }
    .stat-box { background: var(--pri-bg); color: var(--pri); border-radius: 10px; padding: 5px 4px; text-align: center; font-weight: 800; }
    .stat-box b { display: block; font-size: 19px; line-height: 1.15; }
    .stat-box span { font-size: 11px; }
    .field { flex-shrink: 0; }
    .field label { display: block; font-size: 12px; font-weight: 800; color: var(--sub); margin-bottom: 2px; }
    select {
      width: 100%; height: 40px; padding: 4px 10px; font-size: 15px; font-weight: 700;
      border-radius: 10px; border: 2px solid var(--bdr); background: var(--card); color: var(--text);
    }
    .btn {
      width: 100%; flex: 1; min-height: 42px; max-height: 52px; border-radius: 12px;
      font-size: 16px; font-weight: 900; cursor: pointer; border: 2px solid transparent;
      display: flex; align-items: center; justify-content: center; text-decoration: none; gap: 6px;
    }
    .btn-pri { background: var(--pri); color: #ffffff; }
    @media (prefers-color-scheme: dark) { .btn-pri { color: #071112; } }
    .btn-sec { background: var(--card); color: var(--text); border-color: var(--bdr); font-size: 15px; }
    .btn-rev { background: var(--ng-bg); color: var(--ng); border-color: var(--ng); }
    .btn-link { background: var(--pri-bg); color: var(--pri); border-color: var(--pri); font-size: 14px; max-height: 42px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; min-height: 40px; max-height: 48px; }

    /* 出題画面 */
    .pbar { height: 7px; background: var(--bdr); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
    .pfill { height: 100%; width: 0%; background: var(--pri); transition: width 0.25s ease; }
    .meta-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-shrink: 0; }
    .badge { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: var(--pri-bg); color: var(--pri); }
    .badge.s { background: var(--warn-bg); color: var(--warn); }

    .q-card {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 14px;
      padding: 8px 11px; flex: 0 1 auto; max-height: 50%; overflow-y: auto;
      display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    }
    .q-text { font-size: 17px; font-weight: 800; line-height: 1.38; }
    .q-hl { color: var(--pri); font-weight: 900; background: var(--pri-bg); padding: 1px 4px; border-radius: 4px; border-bottom: 2px solid var(--pri); }
    .q-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--sub); }
    .tts-btn { font-size: 12px; font-weight: 800; color: var(--pri); background: var(--pri-bg); border: none; border-radius: 8px; padding: 4px 9px; cursor: pointer; }

    /* 読める大きさの図表サムネイル（タップで拡大） */
    .thumb-card {
      display: none; position: relative; width: 100%;
      background: #ffffff; border: 2px solid var(--pri); border-radius: 10px;
      overflow: hidden; cursor: pointer; flex-shrink: 0;
    }
    .thumb-card.active { display: block; }
    .thumb-media {
      width: 100%; height: 118px;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff; padding: 3px;
    }
    .thumb-media img, .thumb-media svg {
      max-width: 100%; max-height: 100%; width: auto; height: auto;
      object-fit: contain; display: block;
    }
    .thumb-badge {
      position: absolute; right: 6px; bottom: 6px;
      background: rgba(15, 23, 42, 0.78); color: #ffffff;
      font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px;
      pointer-events: none;
    }
    .thumb-cap-mini {
      background: var(--pri-bg); color: var(--pri);
      font-size: 11px; font-weight: 800; padding: 3px 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .opts { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
    .opt-btn {
      flex: 1; min-height: 0; width: 100%; background: var(--card);
      border: 2px solid var(--bdr); border-radius: 12px; padding: 6px 12px;
      font-size: 16px; font-weight: 800; line-height: 1.25; color: var(--text);
      text-align: left; cursor: pointer; display: flex; align-items: center; overflow: hidden;
    }
    .opt-btn.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
    .opt-btn.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }

    /* 解説ボトムシート */
    .exp-sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: var(--card); border: 2px solid var(--pri); border-radius: 16px;
      padding: 12px; display: none; flex-direction: column; gap: 7px;
      max-height: 76%; overflow-y: auto; z-index: 30;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.28);
    }
    .exp-sheet.active { display: flex; }
    .exp-head { font-size: 20px; font-weight: 900; }
    .exp-ans { font-size: 17px; font-weight: 900; background: var(--ok-bg); color: var(--ok); padding: 6px 10px; border-radius: 10px; }
    .exp-body { font-size: 15px; font-weight: 700; line-height: 1.45; color: var(--sub); }
    .exp-sheet .btn, .exp-sheet .row2 { flex: 0 0 auto; max-height: none; }

    /* きくだけモード */
    .listen-card {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 14px; flex: 1; min-height: 0; display: flex; flex-direction: column;
      justify-content: space-between; text-align: center; gap: 10px;
    }
    .listen-badge { font-size: 14px; font-weight: 900; color: var(--pri); background: var(--pri-bg); padding: 5px 12px; border-radius: 999px; align-self: center; }
    .listen-main { font-size: 19px; font-weight: 800; line-height: 1.45; overflow-y: auto; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .listen-card .btn { flex: 0 0 auto; max-height: 48px; }

    /* モーダル＆拡大ライトボックス */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78);
      display: none; align-items: center; justify-content: center;
      padding: 10px max(10px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      z-index: 60;
    }
    .modal.active { display: flex; }
    .mbox {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 14px; width: 100%; max-width: 640px; max-height: 94dvh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 9px; text-align: center;
    }
    .mbox .btn, .mbox .row2 { flex: 0 0 auto; max-height: none; }
    .mtitle { font-size: 17px; font-weight: 900; }
    .mscore { font-size: 32px; font-weight: 900; color: var(--pri); }
    .mtext { font-size: 14px; font-weight: 700; line-height: 1.45; color: var(--sub); text-align: left; }

    .zoom-body {
      background: #ffffff; border: 1.5px solid var(--bdr); border-radius: 12px;
      padding: 6px; width: 100%; max-height: 62dvh; overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .zoom-body img, .zoom-body svg {
      width: 100%; height: auto; display: block; transition: width 0.2s ease;
    }
    .zoom-body.zoomed img, .zoom-body.zoomed svg {
      width: 210%; max-width: none;
    }

    .thumb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .thumb-tile { background: var(--bg); border: 1.5px solid var(--bdr); border-radius: 10px; padding: 6px; cursor: pointer; text-align: center; }
    .thumb-tile .tile-img { height: 74px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 2px; }
    .thumb-tile img, .thumb-tile svg { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .thumb-tile span { display: block; font-size: 11px; font-weight: 800; color: var(--pri); margin-top: 4px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <a class="hbtn" href="index.html">‹ 一覧</a>
    <div class="htitle">共通テスト対策 地理</div>
    <button class="hbtn" onclick="openSummary()">🗺️ 図解</button>
    <button class="hbtn" onclick="openStats()">成績</button>
  </header>

  <main>
    <!-- データ読込中／エラー表示 -->
    <div id="v-loading" class="view active">
      <div class="status-card">
        <div style="font-size:28px;" id="load-icon">⏳</div>
        <div class="status-msg" id="load-msg">問題データ（chiri_data.json）を読み込んでいます...</div>
        <button class="btn btn-pri" id="btn-retry" style="display:none;max-width:240px;" onclick="loadDatabase()">再読み込み</button>
      </div>
    </div>

    <!-- ホーム -->
    <div id="v-home" class="view">
      <div class="home-card">
        <div class="stat-row">
          <div class="stat-box"><span>収録問題</span><b id="s-tot">0</b></div>
          <div class="stat-box"><span>学習済み</span><b id="s-lrn">0</b></div>
          <div class="stat-box"><span>要復習</span><b id="s-rev">0</b></div>
        </div>
        <div class="field">
          <label for="f-cat">学習グループ（分野別）</label>
          <select id="f-cat">
            <option value="ALL">全分野（バランス出題）</option>
            <option value="TOPO">① 地形（大地形・小地形・プレート）</option>
            <option value="CLIM">② 気候（ケッペン・大気大循環・雨温図）</option>
            <option value="AGRI">③ 農業・食料（地域区分・主要作物）</option>
            <option value="IND">④ 資源・エネルギー・工業立地</option>
            <option value="POP">⑤ 人口・都市・民族宗教・地誌</option>
            <option value="SOGO">⑥ 地理総合（地図・GIS・防災・覚え方）</option>
          </select>
        </div>
        <div class="field">
          <label for="f-pri">重要度</label>
          <select id="f-pri">
            <option value="ALL">すべて</option>
            <option value="S">★ 最重要（最優先・波及効果大）</option>
            <option value="A">● 重要（定番・応用）</option>
          </select>
        </div>
        <button class="btn btn-pri" onclick="startQuiz('NORMAL')">🚀 10問テストを始める</button>
        <button class="btn btn-rev" id="b-rev" style="display:none;" onclick="startQuiz('REVIEW')">
          ⚠️ 間違えた問題を復習（<span id="rev-n">0</span>問）
        </button>
        <button class="btn btn-link" onclick="openSummary()">🗺️ 図解ギャラリー＆覚えることまとめ</button>
        <button class="btn btn-sec" onclick="startListen()">🎧 きくだけモード（誤答優先）</button>
        <div class="row2">
          <button class="btn btn-sec" onclick="exportProg()">進捗エクスポート</button>
          <button class="btn btn-sec" onclick="importProg()">進捗インポート</button>
        </div>
      </div>
    </div>

    <!-- 出題画面 -->
    <div id="v-quiz" class="view">
      <div class="pbar"><div class="pfill" id="p-fill"></div></div>
      <div class="meta-bar">
        <span class="badge" id="q-cat">分野</span>
        <span class="badge s" id="q-pri">★ 最重要</span>
        <span id="q-num" style="font-size:15px;font-weight:900;">1 / 10</span>
      </div>
      <div class="q-card">
        <div class="q-text" id="q-txt"></div>
        <div class="thumb-card" id="q-thumb" onclick="openCurrentFigure()">
          <div class="thumb-media" id="q-thumb-media"></div>
          <div class="thumb-badge">🔍 タップで拡大</div>
          <div class="thumb-cap-mini" id="q-thumb-cap"></div>
        </div>
        <div class="q-foot">
          <span id="q-id">ID</span>
          <button class="tts-btn" onclick="speak(curList[idx].q)">🔊 問題を聞く</button>
        </div>
      </div>
      <div class="opts" id="opts"></div>

      <div class="exp-sheet" id="sheet">
        <div class="exp-head" id="sh-head"></div>
        <div class="exp-ans" id="sh-ans"></div>
        <div class="exp-body" id="sh-exp"></div>
        <div class="thumb-card" id="sh-thumb" onclick="openCurrentFigure()">
          <div class="thumb-media" id="sh-thumb-media" style="height:92px;"></div>
          <div class="thumb-badge">🔍 タップで拡大</div>
          <div class="thumb-cap-mini" id="sh-thumb-cap"></div>
        </div>
        <div class="row2">
          <a id="sh-ref" class="btn btn-link" href="#" target="_blank" rel="noopener noreferrer">📖 解説記事 ↗</a>
          <button class="btn btn-sec" onclick="openSummary()">🗺️ 図解一覧</button>
        </div>
        <div class="row2">
          <button class="btn btn-sec" onclick="speak(curList[idx].options[curList[idx].ans] + '。' + curList[idx].exp)">🔊 解説を聞く</button>
          <button class="btn btn-pri" onclick="nextQ()">次の問題へ ›</button>
        </div>
      </div>
    </div>

    <!-- きくだけモード -->
    <div id="v-listen" class="view">
      <div class="listen-card">
        <div class="listen-badge" id="l-badge">きくだけモード</div>
        <div class="listen-main" id="l-main">音声を準備しています...</div>
        <button class="btn btn-sec" onclick="stopListen()">停止して戻る</button>
      </div>
    </div>
  </main>
</div>

<!-- モーダル類 -->
<div class="modal" id="m-res">
  <div class="mbox">
    <div class="mtitle">10問セッション終了</div>
    <div class="mscore" id="r-sc">0 / 10</div>
    <div class="mtext" id="r-msg" style="text-align:center;"></div>
    <button class="btn btn-pri" onclick="closeRes('NEXT')">次の10問へ進む</button>
    <button class="btn btn-rev" id="r-rev" onclick="closeRes('REV')">間違えた問題を復習する</button>
    <button class="btn btn-sec" onclick="closeRes('HOME')">メニューに戻る</button>
  </div>
</div>

<div class="modal" id="m-adv">
  <div class="mbox">
    <div class="mtitle">💡 30問達成！優先順位と覚え方</div>
    <div class="mtext" id="adv-txt"></div>
    <button class="btn btn-pri" onclick="document.getElementById('m-adv').classList.remove('active')">学習を続ける</button>
  </div>
</div>

<div class="modal" id="m-st">
  <div class="mbox">
    <div class="mtitle">学習成績・進捗状況</div>
    <div class="mtext" id="st-body"></div>
    <button class="btn btn-sec" onclick="document.getElementById('m-st').classList.remove('active')">閉じる</button>
    <button class="btn btn-sec" style="color:var(--ng);border-color:var(--ng);font-size:14px;" onclick="resetProg()">進捗データをリセット</button>
  </div>
</div>

<div class="modal" id="m-sum">
  <div class="mbox">
    <div class="mtitle">🗺️ 図解サムネイル一覧（タップで拡大）</div>
    <div class="thumb-grid" id="sum-grid"></div>
    <a class="btn btn-link" href="https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/" target="_blank" rel="noopener noreferrer">📖 元塾講師「覚えることまとめ」記事 ↗</a>
    <div class="row2">
      <a class="btn btn-sec" href="https://maps.gsi.go.jp/" target="_blank" rel="noopener noreferrer">🗺️ 地理院地図 ↗</a>
      <a class="btn btn-sec" href="https://disaportal.gsi.go.jp/" target="_blank" rel="noopener noreferrer">⚠️ ハザードマップ ↗</a>
    </div>
    <button class="btn btn-pri" onclick="document.getElementById('m-sum').classList.remove('active')">閉じる</button>
  </div>
</div>

<!-- 拡大ライトボックス（2倍ズーム切替＆元画像リンク付き） -->
<div class="modal" id="m-zoom" onclick="if(event.target===this) closeZoom()">
  <div class="mbox">
    <div class="mtitle" id="zoom-title">図表拡大</div>
    <div class="zoom-body" id="zoom-body"></div>
    <div class="mtext" id="zoom-cap" style="font-size:13px;"></div>
    <div class="row2">
      <button class="btn btn-sec" id="btn-zoom-toggle" onclick="toggleZoomScale()">🔍 2倍に拡大</button>
      <a class="btn btn-link" id="zoom-orig-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">元画像を別タブ ↗</a>
    </div>
    <button class="btn btn-pri" onclick="closeZoom()">閉じる</button>
  </div>
</div>

<script>
const DATA_URL = "./chiri_data.json";
const APP_ID = "common_test_chiri.html";
const STORAGE_KEY = "ct_chiri_split_v1";

let BANK = [];
let prog = loadProg();
let curList = [];
let idx = 0;
let score = 0;
let wrongList = [];
let isReviewSession = false;
let listening = false;
let listenTimer = null;

// Wikimedia Commons 実画像直リンク＋内蔵SVG図解（ギャラリー＆フォールバック兼用）
const FIGURES = {
  plate: {
    title: "世界のプレート境界（日本語図）",

function fallbackStableId(qText, ansText) {
  const str = `${String(qText || "").trim()}||${String(ansText || "").trim()}`;
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return "GEO-F-" + (h >>> 0).toString(16).padStart(8, "0");
}

// 8秒タイムアウト＋原因表示付きJSON読み込み（Safariキャッシュ対策）
async function loadDatabase() {
  const icon = document.getElementById("load-icon");
  const msg = document.getElementById("load-msg");
  const retry = document.getElementById("btn-retry");
  icon.textContent = "⏳";
  msg.textContent = "問題データ（chiri_data.json）を読み込んでいます...";
  retry.style.display = "none";

  const targetUrl = new URL(DATA_URL, location.href).href;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);

  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, {
      cache: "no-store",
      signal: controller.signal
    });
    clearTimeout(timer);

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (jsonErr) {
      throw new Error(`JSON形式エラー: ${jsonErr.message}`);
    }

    if (!Array.isArray(data) || data.length === 0) throw new Error("問題データが空です");

    const seenIds = new Set();
    BANK = data.filter(item => item && item.q && Array.isArray(item.options) && item.options.length >= 2).map(item => {
      const ansText = item.options[item.ans] || "";
      let qid = (item.id && String(item.id).trim()) ? String(item.id).trim() : fallbackStableId(item.q, ansText);
      if (seenIds.has(qid)) qid = fallbackStableId(item.q + seenIds.size, ansText);
      seenIds.add(qid);
      return { ...item, id: qid };
    });

    if (BANK.length === 0) throw new Error("有効な問題データがありません");
    showView("v-home");
  } catch (err) {
    clearTimeout(timer);
    icon.textContent = "⚠️";
    const reason = err.name === "AbortError" ? "読み込みが8秒でタイムアウトしました" : err.message;
    msg.innerHTML =
      `読み込みに失敗しました。<br>` +
      `<b>原因：</b>${reason}<br>` +
      `<b>現在の環境：</b>${location.protocol}<br>` +
      `<b>参照先：</b><span style="word-break:break-all;font-size:12px;">${targetUrl}</span>`;
    retry.style.display = "flex";
  }
}

function forgettingScore(q, now) {
  const p = prog.items[q.id];
  if (!p || !p.n) return 0;
  const elapsedDays = Math.max(0, (now - (p.t || 0)) / 86400000);
  return (p.ng ? 500 : 0) + (1 - (p.ok / p.n)) * 250 + Math.min(elapsedDays * 40, 200) + Math.random() * 20;
}

function startQuiz(mode) {
  const cat = document.getElementById("f-cat").value;
  const pri = document.getElementById("f-pri").value;
  let pool = BANK.filter(q => (cat === "ALL" || q.cat === cat) && (pri === "ALL" || q.priority === pri));
  isReviewSession = (mode === "REVIEW");

  if (isReviewSession) {
    pool = pool.filter(q => { const p = prog.items[q.id]; return p && (p.ng || (p.ok / p.n) < 0.7); });
    if (!pool.length) { alert("復習が必要な問題はありません！"); return; }
    const now = Date.now();
    curList = [...pool].sort((a, b) => forgettingScore(b, now) - forgettingScore(a, now)).slice(0, 10);
  } else {
    if (!pool.length) { alert("該当する問題がありません。条件を変更してください。"); return; }
    const now = Date.now();
    const unseen = pool.filter(q => !prog.items[q.id] || prog.items[q.id].n === 0).sort(() => Math.random() - 0.5);
    const seen = pool.filter(q => prog.items[q.id] && prog.items[q.id].n > 0).sort((a, b) => forgettingScore(b, now) - forgettingScore(a, now));
    const targetRev = seen.length > 0 ? Math.min(2, seen.length) : 0;
    let combined = [...unseen.slice(0, 10 - targetRev), ...seen.slice(0, targetRev)];
    if (combined.length < Math.min(10, pool.length)) {
      const used = new Set(combined.map(q => q.id));
      for (const q of seen) {
        if (!used.has(q.id)) { combined.push(q); used.add(q.id); }
        if (combined.length >= Math.min(10, pool.length)) break;
      }
    }
    curList = combined.sort(() => Math.random() - 0.5);
  }
  idx = 0; score = 0; wrongList = [];
  showView("v-quiz");
  renderQ();
}

function highlightQuestionText(text) {
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return escaped
    .replace(/(［\s*[^］]+\s*］)/g, '<span class="q-hl">$1</span>')
    .replace(/「([^」]+)」/g, '<span class="q-hl">「$1」</span>');
}

function resolveFigure(q) {
  if (!q) return null;
  const fig = (q.figId && FIGURES[q.figId]) ? FIGURES[q.figId] : null;
  const url = (q.imgUrl && q.imgUrl.trim()) ? q.imgUrl.trim() : (fig && fig.url ? fig.url : "");
  const svg = fig && fig.svg ? fig.svg : "";
  const title = (q.imgCaption && q.imgCaption.trim()) ? q.imgCaption.trim() : (fig ? fig.title : "参考図表");
  const cap = fig ? fig.cap : (q.imgCaption || q.exp || "");
  if (!url && !svg) return null;
  return { url, svg, title, cap };
}

function renderThumbCard(q, cardId, mediaId, capId) {
  const card = document.getElementById(cardId);
  const media = document.getElementById(mediaId);
  const capEl = document.getElementById(capId);
  const info = resolveFigure(q);
  if (!info) {
    card.classList.remove("active");
    media.innerHTML = "";
    return;
  }
  capEl.textContent = info.title;
  if (info.url) {
    const img = document.createElement("img");
    img.src = info.url;
    img.alt = info.title;
    img.loading = "eager";
    img.onerror = () => {
      if (info.svg) media.innerHTML = info.svg;
      else card.classList.remove("active");
    };
    media.innerHTML = "";
    media.appendChild(img);
  } else {
    media.innerHTML = info.svg;
  }
  card.classList.add("active");
}

function openZoomModal(info) {
  if (!info) return;
  const body = document.getElementById("zoom-body");
  body.classList.remove("zoomed");
  document.getElementById("btn-zoom-toggle").textContent = "🔍 2倍に拡大";
  document.getElementById("zoom-title").textContent = info.title;
  document.getElementById("zoom-cap").textContent = info.cap;

  const origLink = document.getElementById("zoom-orig-link");
  if (info.url) {
    const img = document.createElement("img");
    img.src = info.url;
    img.alt = info.title;
    img.onerror = () => { if (info.svg) body.innerHTML = info.svg; };
    body.innerHTML = "";
    body.appendChild(img);
    origLink.href = info.url;
    origLink.style.display = "flex";
  } else {
    body.innerHTML = info.svg;
    origLink.style.display = "none";
  }
  document.getElementById("m-zoom").classList.add("active");
}

  });
}

function checkAnswer(selectedIdx, btn) {
  document.querySelectorAll(".opt-btn").forEach(b => b.disabled = true);
  const q = curList[idx];
  const isOk = selectedIdx === q.ans;
  const p = prog.items[q.id] || { n: 0, ok: 0, ng: false, t: 0 };
  p.n += 1; p.t = Date.now();
  if (isOk) { score += 1; p.ok += 1; p.ng = false; btn.classList.add("ok"); }
  else {
    p.ng = true; wrongList.push(q); btn.classList.add("ng");
    document.querySelectorAll(".opt-btn").forEach(b => { if (Number(b.dataset.optIdx) === q.ans) b.classList.add("ok"); });
  }
  prog.items[q.id] = p;
  prog.solved = (prog.solved || 0) + 1;
  saveProg();

  const head = document.getElementById("sh-head");
  head.textContent = isOk ? "⭕ 正解！" : "❌ 不正解";
  head.style.color = isOk ? "var(--ok)" : "var(--ng)";
  document.getElementById("sh-ans").textContent = `正解：${q.options[q.ans]}`;
  document.getElementById("sh-exp").textContent = q.exp;
  renderThumbCard(q, "sh-thumb", "sh-thumb-media", "sh-thumb-cap");

  const refEl = document.getElementById("sh-ref");
  refEl.href = q.refUrl || "https://jukukounohitorigoto.com/daigaku-juken-chiri-oboerukoto/";
  refEl.textContent = `📖 ${q.refLabel || "解説記事を見る"} ↗`;

  document.getElementById("sheet").classList.add("active");
  speak(isOk ? `正解です。${q.options[q.ans]}` : `不正解です。正解は、${q.options[q.ans]}`);

  if (prog.solved > 0 && prog.solved % 30 === 0) {
    setTimeout(() => {
      document.getElementById("adv-txt").textContent = ADVICES[(Math.floor(prog.solved / 30) - 1) % ADVICES.length];
      document.getElementById("m-adv").classList.add("active");
    }, 550);
  }
}

function nextQ() {
  idx += 1;
  if (idx < curList.length) renderQ();
  else {
    document.getElementById("p-fill").style.width = "100%";
    document.getElementById("r-sc").textContent = `${score} / ${curList.length} 問正解`;
    const allClear = wrongList.length === 0;
    document.getElementById("r-msg").textContent = allClear
      ? "全問正解達成！次の10問へ進めます。"
      : (isReviewSession ? "復習モードでは間違えた問題を全問正解すると次へ進めます。" : "間違えた問題を復習して、確実に定着させましょう。");
    document.getElementById("r-rev").style.display = allClear ? "none" : "flex";
    document.getElementById("m-res").classList.add("active");
  }
}

function closeRes(action) {
  document.getElementById("m-res").classList.remove("active");
  if (action === "REV") { curList = [...wrongList]; idx = 0; score = 0; wrongList = []; isReviewSession = true; showView("v-quiz"); renderQ(); }
  else if (action === "NEXT") {
    if (isReviewSession && wrongList.length > 0) {
      alert("復習モードでは間違えた問題をすべて正解すると通常モードの次へ進めます。");
      document.getElementById("m-res").classList.add("active");
      return;
    }
    startQuiz("NORMAL");
  } else showView("v-home");
}

function openSummary() {
  const grid = document.getElementById("sum-grid");
  grid.innerHTML = "";
  Object.keys(FIGURES).forEach(k => {
    const f = FIGURES[k];
    const div = document.createElement("div");
    div.className = "thumb-tile";
    const mediaHtml = f.url ? `<img src="${f.url}" alt="${f.title}" loading="lazy">` : f.svg;
    div.innerHTML = `<div class="tile-img">${mediaHtml}</div><span>🔍 ${f.title}</span>`;
    div.onclick = () => openFigureById(k);
    grid.appendChild(div);
  });
  document.getElementById("m-sum").classList.add("active");
}

function openStats() {
  const cats = [
    ["TOPO", "① 地形"], ["CLIM", "② 気候"], ["AGRI", "③ 農業・食料"],
    ["IND", "④ 資源・工業"], ["POP", "⑤ 人口・都市・地誌"], ["SOGO", "⑥ 地理総合・覚え方"]
  ];
  let lines = [`累計解答数：<b>${prog.solved || 0}</b> 回<br><br>`];
  cats.forEach(([code, name]) => {
    const sub = BANK.filter(q => q.cat === code);
    const done = sub.filter(q => prog.items[q.id] && prog.items[q.id].n > 0).length;
    lines.push(`${name}：${done} / ${sub.length} 問学習済<br>`);
  });
  document.getElementById("st-body").innerHTML = lines.join("");
  document.getElementById("m-st").classList.add("active");
}

function resetProg() {
  if (confirm("これまでの学習進捗をすべて削除しますか？")) {
    prog = { items: {}, solved: 0 }; saveProg(); refreshHome();
    document.getElementById("m-st").classList.remove("active");
  }
}

function exportProg() {
  const now = new Date();
  const stamp =
    now.getFullYear().toString() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") + "_" +
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0");
  const defaultName = `しんや_${APP_ID}_${stamp}`;
  const customName = prompt("進捗データの保存名を入力してください：", defaultName);
  if (!customName) return;

  const cleanName = customName.trim();
  const payload = JSON.stringify({
    schemaVersion: 1,
    appId: APP_ID,
    exportName: cleanName,
    exportedAt: now.toISOString(),
    prog: prog
  });

  try {
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${cleanName}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {}

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(payload)
      .then(() => alert(`「${cleanName}」をファイル保存＆クリップボードにコピーしました。`))
      .catch(() => alert(`「${cleanName}.json」を保存しました。`));
  } else {
    prompt("以下の進捗コードをコピーしてください：", payload);
  }
}

function applyImportedPayload(rawText) {
  let parsed;
  try { parsed = JSON.parse(rawText.trim()); } catch (e) {
    alert("JSON形式の読み込みに失敗しました。");
    return;
  }
  if (!parsed || parsed.appId !== APP_ID) {
    alert(`この問題集（${APP_ID}）からエクスポートされたデータではないため取り込めません。`);
    return;
  }
  if (!parsed.prog || typeof parsed.prog.items !== "object") {
    alert("進捗データの形式が正しくありません。");
    return;
  }
  const incoming = parsed.prog;
  const shouldMerge = confirm(
    `「${parsed.exportName || "進捗データ"}」を読み込みます。\n\n` +
    "・OK：現在の進捗と統合（新しい解答日時を優先してマージ）\n" +
    "・キャンセル：このデータで完全に上書き"
  );
  if (shouldMerge) {
    const mergedItems = { ...prog.items };
    let addedCount = 0, updatedCount = 0;
    Object.entries(incoming.items).forEach(([qid, inItem]) => {
      const curItem = mergedItems[qid];
      if (!curItem) { mergedItems[qid] = inItem; addedCount++; }
      else if ((inItem.t || 0) > (curItem.t || 0)) { mergedItems[qid] = inItem; updatedCount++; }
    });
    prog = { items: mergedItems, solved: Math.max(prog.solved || 0, incoming.solved || 0) };
    saveProg(); refreshHome();
    alert(`統合完了（新規反映：${addedCount}件 / 最新更新：${updatedCount}件）`);
  } else {
    prog = { items: incoming.items, solved: incoming.solved || 0 };
    saveProg(); refreshHome();
    alert(`「${parsed.exportName || "進捗データ"}」で進捗を上書きしました。`);
  }
}

function importProg() {
  const useFile = confirm(
    "進捗データの読み込み方法を選んでください。\n\n" +
    "・OK：保存したJSONファイルを選択\n" +
    "・キャンセル：コピーした進捗コードを貼り付け"
  );
  if (useFile) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json,text/plain";
    input.onchange = (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => applyImportedPayload(String(reader.result || ""));
      reader.readAsText(file, "utf-8");
    };
    input.click();
  } else {
    const txt = prompt("エクスポートした進捗コードを貼り付けてください：");
    if (txt) applyImportedPayload(txt);
  }
}

function speak(text, onDone) {
  if (!("speechSynthesis" in window)) { if (onDone) onDone(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text.replace(/［[^］]+］/g, "くうらん"));
  utter.lang = "ja-JP"; utter.rate = 1.05;
  if (onDone) utter.onend = onDone;
  window.speechSynthesis.speak(utter);
}

function startListen() {
  listening = true; showView("v-listen");
  const wrongPool = BANK.filter(q => prog.items[q.id] && prog.items[q.id].ng);
  const pool = wrongPool.length > 0 ? wrongPool : [...BANK];
  let i = 0;
  const step = () => {
    if (!listening) return;
    const q = pool[i % pool.length];
    document.getElementById("l-badge").textContent = `問題（${q.catName}）`;
    document.getElementById("l-main").textContent = q.q;
    speak(`問題。${q.q}`, () => {
      if (!listening) return;
      listenTimer = setTimeout(() => {
        if (!listening) return;
        const ans = q.options[q.ans];
        document.getElementById("l-badge").textContent = "解答と解説";
        document.getElementById("l-main").textContent = `【正解】${ans}\n\n${q.exp}`;
        speak(`正解は、${ans}。${q.exp}`, () => {
          if (!listening) return;
          i += 1; listenTimer = setTimeout(step, 2000);
        });
      }, 1500);
    });
  };
  step();
}

function stopListen() {
  listening = false;
  if (listenTimer) clearTimeout(listenTimer);
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  showView("v-home");
}

loadDatabase();
</script>
