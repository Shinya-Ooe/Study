<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>共通テスト対策 地理</title>
  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --sub: #334155;
      --pri: #0f766e; --pri-bg: #ccfbf1; --bdr: #cbd5e1;
      --ok: #15803d; --ok-bg: #dcfce7; --ng: #b91c1c; --ng-bg: #fee2e2;
      --warn: #b45309; --warn-bg: #fef3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071112; --card: #102022; --text: #f0fdfa; --sub: #cbd5e1;
        --pri: #2dd4bf; --pri-bg: rgba(45, 212, 191, 0.16); --bdr: #264246;
        --ok: #4ade80; --ok-bg: rgba(74, 222, 128, 0.16); --ng: #f87171; --ng-bg: rgba(248, 113, 113, 0.16);
        --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100vh; max-width: 720px; margin: 0 auto; padding: 10px 12px; gap: 8px; }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 8px; flex-shrink: 0; }
    .hbtn { font-size: 14px; font-weight: 800; color: var(--pri); background: var(--card); border: 2px solid var(--bdr); padding: 6px 11px; border-radius: 10px; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .htitle { font-size: 18px; font-weight: 900; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
    .view { display: none; flex-direction: column; width: 100%; height: 100%; gap: 8px; }
    .view.active { display: flex; }
    .home-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; min-height: 0; gap: 9px; }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { background: var(--pri-bg); color: var(--pri); border-radius: 12px; padding: 8px 6px; text-align: center; font-weight: 800; }
    .stat-box b { display: block; font-size: 21px; margin-top: 2px; }
    .stat-box span { font-size: 13px; }
    .field label { display: block; font-size: 14px; font-weight: 800; color: var(--sub); margin-bottom: 4px; }
    select { width: 100%; min-height: 46px; padding: 8px 12px; font-size: 16px; font-weight: 700; border-radius: 12px; border: 2px solid var(--bdr); background: var(--card); color: var(--text); }
    .btn { width: 100%; min-height: 52px; border-radius: 14px; font-size: 18px; font-weight: 900; cursor: pointer; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; text-decoration: none; gap: 6px; }
    .btn-pri { background: var(--pri); color: #ffffff; }
    @media (prefers-color-scheme: dark) { .btn-pri { color: #071112; } }
    .btn-sec { background: var(--card); color: var(--text); border-color: var(--bdr); font-size: 16px; min-height: 46px; }
    .btn-rev { background: var(--ng-bg); color: var(--ng); border-color: var(--ng); }
    .btn-link { background: var(--pri-bg); color: var(--pri); border-color: var(--pri); font-size: 15px; min-height: 42px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pbar { height: 8px; background: var(--bdr); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
    .pfill { height: 100%; width: 0%; background: var(--pri); transition: width 0.25s ease; }
    .meta-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-shrink: 0; }
    .badge { font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: var(--pri-bg); color: var(--pri); }
    .badge.s { background: var(--warn-bg); color: var(--warn); }
    .q-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 16px; padding: 14px; flex: 0 1 auto; max-height: 36%; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .q-text { font-size: 19px; font-weight: 800; line-height: 1.45; }
    .q-hl { color: var(--pri); text-decoration: underline; text-underline-offset: 3px; }
    .q-foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--sub); }
    .tts-btn { font-size: 14px; font-weight: 800; color: var(--pri); background: var(--pri-bg); border: none; border-radius: 8px; padding: 5px 11px; cursor: pointer; }
    .opts { display: flex; flex-direction: column; gap: 7px; flex: 1; min-height: 0; }
    .opt-btn { flex: 1; min-height: 52px; width: 100%; background: var(--card); border: 2px solid var(--bdr); border-radius: 14px; padding: 9px 14px; font-size: 17px; font-weight: 800; line-height: 1.3; color: var(--text); text-align: left; cursor: pointer; display: flex; align-items: center; }
    .opt-btn.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
    .opt-btn.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }
    .exp-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border: 2px solid var(--pri); border-radius: 18px; padding: 15px; display: none; flex-direction: column; gap: 8px; max-height: 70%; overflow-y: auto; z-index: 30; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.28); }
    .exp-sheet.active { display: flex; }
    .exp-head { font-size: 21px; font-weight: 900; }
    .exp-ans { font-size: 18px; font-weight: 900; background: var(--ok-bg); color: var(--ok); padding: 8px 12px; border-radius: 10px; }
    .exp-body { font-size: 16px; font-weight: 700; line-height: 1.5; color: var(--sub); }
    .listen-card { background: var(--card); border: 2px solid var(--bdr); border-radius: 16px; padding: 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; text-align: center; gap: 12px; }
    .listen-badge { font-size: 15px; font-weight: 900; color: var(--pri); background: var(--pri-bg); padding: 6px 14px; border-radius: 999px; align-self: center; }
    .listen-main { font-size: 20px; font-weight: 800; line-height: 1.5; overflow-y: auto; flex: 1; display: flex; align-items: center; justify-content: center; }
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
    .modal.active { display: flex; }
    .mbox { background: var(--card); border: 2px solid var(--bdr); border-radius: 18px; padding: 18px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
    .mtitle { font-size: 20px; font-weight: 900; }
    .mscore { font-size: 34px; font-weight: 900; color: var(--pri); }
    .mtext { font-size: 16px; font-weight: 700; line-height: 1.55; color: var(--sub); text-align: left; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <a class="hbtn" href="index.html">‹ 問題集一覧</a>
    <div class="htitle">共通テスト対策 地理</div>
    <button class="hbtn" onclick="openStats()">成績</button>
  </header>
  <main>
    <div id="v-home" class="view active">
      <div class="home-card">
        <div class="stat-row">
          <div class="stat-box"><span>収録問題</span><b id="s-tot">0</b></div>
          <div class="stat-box"><span>学習済み</span><b id="s-lrn">0</b></div>
          <div class="stat-box"><span>要復習</span><b id="s-rev">0</b></div>
        </div>
        <div class="field">
          <label for="f-cat">学習グループ（分野別）</label>
          <select id="f-cat">
            <option value="ALL">全分野（バランス出題）</option>
            <option value="CHISHI">地誌（日本・世界）</option>
            <option value="STATS_GRAPH">統計・グラフ読解</option>
            <option value="TOPO_CLIM">自然環境（地形・気候）</option>
            <option value="RES_IND">資源・エネルギー・産業・貿易</option>
            <option value="POP_URB">人口・都市・村落・生活文化</option>
            <option value="MAP_GIS">地図・GIS・防災・地域調査</option>
          </select>
        </div>
        <div class="field">
          <label for="f-pri">重要度</label>
          <select id="f-pri">
            <option value="ALL">すべて</option>
            <option value="S">★ 最重要（超頻出）</option>
            <option value="A">● 重要（定番・応用）</option>
          </select>
        </div>
        <button class="btn btn-pri" onclick="startQuiz('NORMAL')">10問テストを始める</button>
        <button class="btn btn-rev" id="b-rev" style="display:none;" onclick="startQuiz('REVIEW')">間違えた問題を復習（<span id="rev-n">0</span>問）</button>
        <button class="btn btn-sec" onclick="startListen()">🎧 きくだけモード（誤答優先）</button>
        <div class="row2">
          <button class="btn btn-sec" onclick="exportProg()">進捗エクスポート</button>
          <button class="btn btn-sec" onclick="importProg()">進捗インポート</button>
        </div>
      </div>
    </div>
    <div id="v-quiz" class="view">
      <div class="pbar"><div class="pfill" id="p-fill"></div></div>
      <div class="meta-bar">
        <span class="badge" id="q-cat">分野</span>
        <span class="badge s" id="q-pri">★ 最重要</span>
        <span id="q-num" style="font-size:16px;font-weight:900;">1 / 10</span>
      </div>
      <div class="q-card">
        <div class="q-text" id="q-txt"></div>
        <div class="q-foot">
          <span id="q-id">ID</span>
          <button class="tts-btn" onclick="speak(curList[idx].q)">🔊 問題を聞く</button>
        </div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="exp-sheet" id="sheet">
        <div class="exp-head" id="sh-head"></div>
        <div class="exp-ans" id="sh-ans"></div>
        <div class="exp-body" id="sh-exp"></div>
        <a id="sh-ref" class="btn btn-link" href="#" target="_blank" rel="noopener noreferrer">🗺️ 解説・資料ページを見る ↗</a>
        <div class="row2">
          <button class="btn btn-sec" onclick="speak(curList[idx].options[curList[idx].ans] + '。' + curList[idx].exp)">🔊 解説を聞く</button>
          <button class="btn btn-pri" onclick="nextQ()">次の問題へ ›</button>
        </div>
      </div>
    </div>
    <div id="v-listen" class="view">
      <div class="listen-card">
        <div class="listen-badge" id="l-badge">きくだけモード</div>
        <div class="listen-main" id="l-main">音声を準備しています...</div>
        <button class="btn btn-sec" onclick="stopListen()">停止してホームへ戻る</button>
      </div>
    </div>
  </main>
</div>
<div class="modal" id="m-res">
  <div class="mbox">
    <div class="mtitle">10問セッション終了</div>
    <div class="mscore" id="r-sc">0 / 10</div>
    <div class="mtext" id="r-msg" style="text-align:center;"></div>
    <button class="btn btn-pri" onclick="closeRes('NEXT')">次の10問へ進む</button>
    <button class="btn btn-rev" id="r-rev" onclick="closeRes('REV')">間違えた問題を復習する</button>
    <button class="btn btn-sec" onclick="closeRes('HOME')">メニューに戻る</button>
  </div>
</div>
<div class="modal" id="m-adv">
  <div class="mbox">
    <div class="mtitle">💡 30問達成！地理攻略のコツ</div>
    <div class="mtext" id="adv-txt"></div>
    <button class="btn btn-pri" onclick="document.getElementById('m-adv').classList.remove('active')">学習を続ける</button>
  </div>
</div>
<div class="modal" id="m-st">
  <div class="mbox">
    <div class="mtitle">学習成績・進捗状況</div>
    <div class="mtext" id="st-body"></div>
    <button class="btn btn-sec" onclick="document.getElementById('m-st').classList.remove('active')">閉じる</button>
    <button class="btn btn-sec" style="color:var(--ng);border-color:var(--ng);font-size:14px;min-height:42px;" onclick="resetProg()">進捗データをリセット</button>
  </div>
</div>
<script>
const BANK = [{"id": "GEO-CS-01", "cat": "CHISHI", "catName": "地誌（日本・世界）", "priority": "S", "q": "「モンスーンアジア」の地域に見られる特徴として、最も適切なものはどれか。", "options": ["夏の季節風で雨季となり、稲作が広く営まれる", "年間を通じて無降水で、大規模な企業的牧畜が中心である", "冬に偏西風が卓越する地中海性気候のみが分布する", "氷河地形が広がり、森林限界が海抜0m付近にある"], "ans": 0, "exp": "モンスーンアジアは夏の南西〜南東季節風により降水量が多く、高温多雨の気候を活かした水田稲作と高い人口扶養力が特徴です。", "refUrl": "https://ichigo-drill.jp/chiritankyu-print", "refLabel": "地理探究 地誌の学習資料を見る"}, {"id": "GEO-SG-01", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "S", "q": "「雨温図」や「ハイサーグラフ」を読み解く際、共通テストで特に注意すべき視点はどれか。", "options": ["月ごとの気温と降水量の季節変化（乾季・雨季の有無や寒暖の差）を合わせて見る", "年平均気温の数値だけを見て、降水量の季節変化は無視する", "北半球と南半球で夏と冬の季節が逆転することを無視する", "単位（℃やmm）を確認せずにグラフの高さだけで比較する"], "ans": 0, "exp": "共通テストでは気温の年較差・冬期の寒さだけでなく、降水量の季節配分（夏雨か冬雨か、乾季があるか）を組み合わせて気候区分を判別します。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "ロジカ 統計・雨温図の読み方"}, {"id": "GEO-TC-01", "cat": "TOPO_CLIM", "catName": "地形・気候", "priority": "S", "q": "プレートの沈み込み帯や大陸同士の衝突帯など、地殻変動が活発な地域に形成されやすい山脈はどれか。", "options": ["新期造山帯の山脈", "古期造山帯の山脈", "安定陸塊の卓状地", "楯状地の準平原"], "ans": 0, "exp": "アルプス・ヒマラヤ造山帯や環太平洋造山帯などの「新期造山帯」は地殻変動が活発で、標高が高く険しい山脈や火山・地震が多く見られます。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地形・地理情報"}, {"id": "GEO-RI-01", "cat": "RES_IND", "catName": "資源・産業・貿易", "priority": "S", "q": "世界の発電構成において、近年の再生可能エネルギー普及や電源構成の変化で注目される、温室効果ガスを排出しない発電方式はどれか。", "options": ["太陽光・風力・水力などの再生可能エネルギー発電", "石炭火力発電", "石油火力発電", "天然ガス火力発電"], "ans": 0, "exp": "脱炭素化に向けて太陽光・風力・水力・地熱などの再生可能エネルギー導入が進む一方、天候による出力変動や系統連系などの課題もあります。", "refUrl": "https://www.enecho.meti.go.jp/", "refLabel": "資源エネルギー庁 エネルギー情報"}, {"id": "GEO-PU-01", "cat": "POP_URB", "catName": "人口・都市・文化", "priority": "S", "q": "多死多産から、死亡率の低下に続いて出生率も低下し、少子高齢化・人口減少へと進む人口動態の変化を何と呼ぶか。", "options": ["人口転換", "フェーン現象", "等高線補間", "プレートテクトニクス"], "ans": 0, "exp": "経済発展や医療・衛生水準の向上に伴い、出生率と死亡率のバランスが変化していく過程を人口転換と呼びます。", "refUrl": "https://www.stat.go.jp/", "refLabel": "総務省統計局 人口・国勢調査"}, {"id": "GEO-MG-01", "cat": "MAP_GIS", "catName": "地図・GIS・防災", "priority": "S", "q": "位置情報を持つ空間データをコンピュータ上で重ね合わせ、分析・可視化するシステムを何と呼ぶか。", "options": ["GIS（地理情報システム）", "OCR（光学文字認識）", "DNS（ドメインネームシステム）", "BIOS"], "ans": 0, "exp": "GISは標高・ハザードマップ・人口・施設位置などの地理空間データを統合し、防災計画や店舗・施設配置、地域分析などに活用されます。", "refUrl": "https://www.gsi.go.jp/", "refLabel": "国土地理院 地理院地図・GIS"}, {"id": "GEO-WEB-01", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「「地名は覚えたのに、地図や統計で迷う」「雨温図のどこから読めばよいか分からない」。そんなときは、分野を選んで10問から始めましょう。正解した問題も、選ばなかった3つの選択肢を説明できるか確認すると復習が深まります。」", "options": ["共通テスト地理の無料問題300問", "共通テスト地理の資料は、読む順番を決める", "地図は凡例・方位・縮尺", "統計は単位・年次・分母"], "ans": 0, "exp": "「地名は覚えたのに、地図や統計で迷う」「雨温図のどこから読めばよいか分からない」。そんなときは、分野を選んで10問から始めましょう。正解した問題も、選ばなかった3つの選択肢を説明できるか確認すると復習が深まります。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-02", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「基礎確認は概念・技能、標準演習は知識と資料の対応、複合演習は複数の条件や資料を結び付ける問題です。段階は編集上の目安です。」", "options": ["分野・学習段階を選ぶ", "雨温図は気温から降水へ", "氾濫原の微地形と土地利用", "合計特殊出生率が下がっても人口が増える理由"], "ans": 0, "exp": "基礎確認は概念・技能、標準演習は知識と資料の対応、複合演習は複数の条件や資料を結び付ける問題です。段階は編集上の目安です。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-03", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「見慣れない図表でも、地域名を当てようと急ぐ必要はありません。まず資料の条件をそろえ、その資料から確かに言えることを探します。地形・気候・産業の知識は、読み取った特徴の理由を考えるときに使いましょう。」", "options": ["共通テスト地理の資料は、読む順番を決める", "氾濫原の微地形と土地利用", "流域の都市化と洪水の変化", "資料は読める。でも、答案や面接でうまく説明できない。"], "ans": 0, "exp": "見慣れない図表でも、地域名を当てようと急ぐ必要はありません。まず資料の条件をそろえ、その資料から確かに言えることを探します。地形・気候・産業の知識は、読み取った特徴の理由を考えるときに使いましょう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-04", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「色や記号が何を表すかを先に確認。等高線なら標高と間隔、分布図なら「量」か「割合」かを確かめます。隣り合う地域や上流・下流との位置関係も根拠になります。」", "options": ["地図は凡例・方位・縮尺", "合計特殊出生率が下がっても人口が増える理由", "資料は読める。でも、答案や面接でうまく説明できない。", "緯経線メッシュと人口密度"], "ans": 0, "exp": "色や記号が何を表すかを先に確認。等高線なら標高と間隔、分布図なら「量」か「割合」かを確かめます。隣り合う地域や上流・下流との位置関係も根拠になります。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-05", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「人数と構成比、総額と1人当たりを区別。割合が上がっても実数が増えたとは限りません。別の年や違う範囲の数値を、そのまま比べないことが大切です。」", "options": ["統計は単位・年次・分母", "資料を選ぶ力を、二次試験・小論文・面接で伝える力へ", "緯経度・南中高度・地方時", "回転した地図と太陽の方位"], "ans": 0, "exp": "人数と構成比、総額と1人当たりを区別。割合が上がっても実数が増えたとは限りません。別の年や違う範囲の数値を、そのまま比べないことが大切です。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-06", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「最暖月・最寒月、気温の年較差、降水量の季節差を順に読みます。7月が夏とは限りません。雨が少ない時期が現地の夏か冬かを、気温の曲線と合わせて確かめます。」", "options": ["雨温図は気温から降水へ", "理由と具体例を口で伝える", "乗り継ぎと時差", "等高線の標高範囲と比高"], "ans": 0, "exp": "最暖月・最寒月、気温の年較差、降水量の季節差を順に読みます。7月が夏とは限りません。雨が少ない時期が現地の夏か冬かを、気温の曲線と合わせて確かめます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-07", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「地名や用語は出発点です。「どこにあるか」「なぜその分布になるか」「資料のどこで確かめられるか」を一組にして覚えます。2027年度の公式問題作成方針も、知識による推論と資料による検証、系統地理と地誌の関連を重視しています。 大学入試センターの問題作成方針へ」", "options": ["共通テスト地理は「位置・しくみ・資料」をつなげて復習する", "地理総合・地理探究の出題範囲と過去問を確認する", "用途に応じた投影法", "ラスターの集約と土地利用"], "ans": 0, "exp": "地名や用語は出発点です。「どこにあるか」「なぜその分布になるか」「資料のどこで確かめられるか」を一組にして覚えます。2027年度の公式問題作成方針も、知識による推論と資料による検証、系統地理と地誌の関連を重視しています。 大学入試センターの問題作成方針へ", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-08", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「短く書くと、読み取れたことと、説明しきれていないことが見えてきます。以下は四択300問とは別の6題です。資料に基づく説明から始め、面接の追加質問では自分の考えも言葉にしてみましょう。」", "options": ["選んだ根拠を、今度は80字で説明してみる", "緯経度・南中高度・地方時", "等高線と雨水の流れ", "谷口の堆積地と水利用"], "ans": 0, "exp": "短く書くと、読み取れたことと、説明しきれていないことが見えてきます。以下は四択300問とは別の6題です。資料に基づく説明から始め、面接の追加質問では自分の考えも言葉にしてみましょう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-09", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「A・Bに当たる地形名を挙げ、堆積物や排水性と土地利用の関係を80字以内で説明してください。」", "options": ["氾濫原の微地形と土地利用", "標準時と太陽の南中", "GISと地形条件の重ね合わせ", "砂の移動と海岸堆積地形"], "ans": 0, "exp": "A・Bに当たる地形名を挙げ、堆積物や排水性と土地利用の関係を80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-10", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「夏と冬の降水の違いが生じる理由を、気圧帯・風帯の季節移動に触れて80字以内で説明してください。」", "options": ["降水の季節差を風帯から説明する", "縮尺と斜面の比較", "土地利用の遷移と都市化", "山脈・地溝とプレート境界"], "ans": 0, "exp": "夏と冬の降水の違いが生じる理由を、気圧帯・風帯の季節移動に触れて80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-11", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ボーキサイトの産地とアルミニウム製錬の立地が一致しない理由を、80字以内で説明してください。」", "options": ["鉱石の産地と製錬工場の立地", "回転した地図と太陽の方位", "谷口の堆積地と水利用", "南アメリカ低緯度の雨季と植生"], "ans": 0, "exp": "ボーキサイトの産地とアルミニウム製錬の立地が一致しない理由を、80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-12", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「出生率の低下後も当面は人口が増えることがある理由を、年齢構成に触れて80字以内で説明してください。」", "options": ["合計特殊出生率が下がっても人口が増える理由", "メルカトル図法の面積補正", "粒径資料からみる堆積環境", "少雨地域の位置と大気循環"], "ans": 0, "exp": "出生率の低下後も当面は人口が増えることがある理由を、年齢構成に触れて80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-13", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「Aが乾燥する理由を、海流と地形の両方に触れて80字以内で説明してください。」", "options": ["緯度が近い地域の降水差", "等高線と雨水の流れ", "谷の断面と支谷の高さ", "高緯度低地の夏の自然環境"], "ans": 0, "exp": "Aが乾燥する理由を、海流と地形の両方に触れて80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-14", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「都市化によって河川の流量ピークが早まり、大きくなりやすい理由を、80字以内で説明してください。」", "options": ["流域の都市化と洪水の変化", "河床縦断と勾配の変化", "横ずれ境界と地震・地殻の生成", "低緯度の風と島の斜面"], "ans": 0, "exp": "都市化によって河川の流量ピークが早まり、大きくなりやすい理由を、80字以内で説明してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-15", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「四択では根拠を選べても、記述や面接では根拠を自分で示す必要があります。まず志望校・学部・入試方式の募集要項で、教科の個別試験、小論文、面接、提出書類の有無を確認しましょう。」", "options": ["資料を選ぶ力を、二次試験・小論文・面接で伝える力へ", "直線の到達圏と道路の到達圏", "雨温図から大陸東西の違いを読む", "海上の霧と露点"], "ans": 0, "exp": "四択では根拠を選べても、記述や面接では根拠を自分で示す必要があります。まず志望校・学部・入試方式の募集要項で、教科の個別試験、小論文、面接、提出書類の有無を確認しましょう。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-16", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「指定語句、字数、設問が求める理由・比較・変化を確認。解答に必要な要素をそろえる練習へ進みます。」", "options": ["条件に沿って短く説明する", "縮尺・目的と点線面データ", "夏季降水割合と東アジアの季節風", "東西岸の降水配分を比較する"], "ans": 0, "exp": "指定語句、字数、設問が求める理由・比較・変化を確認。解答に必要な要素をそろえる練習へ進みます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-17", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「数字から言えることと、対策として提案することを分け、効果・負担・限界まで考えます。」", "options": ["読み取りと意見を分ける", "標高データの解像度と集約方法", "乾燥限界と植生の変化", "森林の土壌断面と物質移動"], "ans": 0, "exp": "数字から言えることと、対策として提案することを分け、効果・負担・限界まで考えます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-18", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「人口・観光・環境などへの関心を、自分の経験や大学で学びたい内容と結びつけます。」", "options": ["理由と具体例を口で伝える", "谷口の堆積地と水利用", "高緯度低地の夏の自然環境", "モンスーン地域の作付け"], "ans": 0, "exp": "人口・観光・環境などへの関心を、自分の経験や大学で学びたい内容と結びつけます。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-19", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「志望大学・学部・入試方式、試験日、今の答案や準備状況から、必要な練習を整理します。小論文の構成、理由の説明、面接の追加質問まで、志望校に合わせた指導をご相談ください。」", "options": ["資料は読める。でも、答案や面接でうまく説明できない。", "段丘面と火山灰による年代比較", "三つの気候資料と世界の位置", "野菜産地の出荷時期"], "ans": 0, "exp": "志望大学・学部・入試方式、試験日、今の答案や準備状況から、必要な練習を整理します。小論文の構成、理由の説明、面接の追加質問まで、志望校に合わせた指導をご相談ください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-20", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「総合型・学校推薦型も検討する人は、出願資格と選考内容を方式別に確認してください。以下は地理と関わる関心テーマからの案内です。各方式で地理の試験が課されるという意味ではありません。」", "options": ["地理のテーマから、大学別の準備を探す", "沈水海岸の形成過程と地域", "海陸風と日変化", "食料自給率の二つの指標"], "ans": 0, "exp": "総合型・学校推薦型も検討する人は、出願資格と選考内容を方式別に確認してください。以下は地理と関わる関心テーマからの案内です。各方式で地理の試験が課されるという意味ではありません。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-21", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「このページは「地理総合、地理探究」の学習を想定した単元別教材です。「地理総合／歴史総合／公共」の地理総合部分とは試験の組み合わせや範囲が異なります。出願時の科目選択と、志望校が認める科目を公式資料で確認してください。」", "options": ["地理総合・地理探究の出題範囲と過去問を確認する", "岩石の性質と地表・地下の排水", "同緯度の東西比較", "電源構成とエネルギー全体"], "ans": 0, "exp": "このページは「地理総合、地理探究」の学習を想定した単元別教材です。「地理総合／歴史総合／公共」の地理総合部分とは試験の組み合わせや範囲が異なります。出願時の科目選択と、志望校が認める科目を公式資料で確認してください。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-22", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「人口・環境・貿易は公共・政治経済とも、地域の成り立ちは歴史とも関わります。地理の演習で気になったテーマを、別の教科から確かめることもできます。」", "options": ["公共・政治経済、日本史とつなげて学ぶ", "海底 の解説ページを開く"}, {"id": "GEO-WEB-27", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「東経135°の地方時を標準時として用いる地域を考える。東経120°の地点Aと東経150°の地点Bで太陽が南中する標準時の組合せはどれか。均時差と夏時間は無視する。」", "options": ["標準時と太陽の南中", "気候の季節性と世界の分布", "耕種と畜産の結び付き", "都市圏内部の住所移動"], "ans": 0, "exp": "東経135°の地方時を標準時として用いる地域を考える。東経120°の地点Aと東経150°の地点Bで太陽が南中する標準時の組合せはどれか。均時差と夏時間は無視する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-28", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「太平洋上のA島からB島へ東向きに20分かけて移動する。A島を5月1日0時10分に出発したとき、B島の到着日時はどれか。採用標準時は表の通りで、夏時間はない。」", "options": ["日付変更線と標準時", "乾燥限界と植生の変化", "森林の蓄積と年齢構成", "都市と農村の人口変化"], "ans": 0, "exp": "太平洋上のA島からB島へ東向きに20分かけて移動する。A島を5月1日0時10分に出発したとき、B島の到着日時はどれか。採用標準時は表の通りで、夏時間はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-29", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「東京を10月14日22時に出発し、10時間後に都市Lへ到着する。Lで2時間待ち、4時間の飛行で都市Nに着く。Nの到着日時はどれか。表の標準時を使い、夏時間は考えない。」", "options": ["乗り継ぎと時差", "海に近い中緯度の年変化", "エネルギー源の構成と自給", "都市圏の人口配置の変化"], "ans": 0, "exp": "東京を10月14日22時に出発し、10時間後に都市Lへ到着する。Lで2時間待ち、4時間の飛行で都市Nに着く。Nの到着日時はどれか。表の標準時を使い、夏時間は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-30", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「異なる縮尺の地図で二つの直線的な斜面P・Qを測った。表から、水平距離が短い方と、平均勾配が大きい方の組合せはどれか。」", "options": ["縮尺と斜面の比較", "寒冷地域の気温と半球", "太陽光発電と夕方の需給", "交通手段と都市の成長"], "ans": 0, "exp": "異なる縮尺の地図で二つの直線的な斜面P・Qを測った。表から、水平距離が短い方と、平均勾配が大きい方の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-31", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「地図A・Bに示された各調査区内の集落数を比較する。投影のひずみは無視し、集落密度を実面積1km²当たりの集落数とする。Aの集落密度はBの何倍 ": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-36", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「メルカトル図法上で小領域P・Qの面積を測った。表の局所的な面積拡大率を使って補正すると、実面積のP：Qはどれか。各領域内では拡大率一定とみなす。」", "options": ["メルカトル図法の面積補正", "盆地の明け方の鉛直気温", "二つの出生指標", "西アフリカの換金作物"], "ans": 0, "exp": "メルカトル図法上で小領域P・Qの面積を測った。表の局所的な面積拡大率を使って補正すると、実面積のP：Qはどれか。各領域内では拡大率一定とみなす。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-37", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のA・Bで、100mの等高線から130mの等高線へ最短で進む斜面を比べる。斜面が低くなる方位と、平均勾配A：Bの組合せはどれか。」", "options": ["等高線・縮尺・斜面方位", "同じ降水量でも異なる乾燥の程度", "年齢・男女別の人口", "カナダの資源と製錬"], "ans": 0, "exp": "図のA・Bで、100mの等高線から130mの等高線へ最短で進む斜面を比べる。斜面が低くなる方位と、平均勾配A：Bの組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-38", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の中央の補助線を流路とする小河川を考える。中央の地形と、川の右岸に当たる側の組合せはどれか。右岸・左岸は下流を向いて区別する。」", "options": ["等高線と河川の左右", "葉の特徴と季節的乾燥", "移住を生む条件", "豪州の鉱産資源と港湾"], "ans": 0, "exp": "図の中央の補助線を流路とする小河川を考える。中央の地形と、川の右岸に当たる側の組合せはどれか。右岸・左岸は下流を向いて区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-39", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の中央の補助線を境にした雨水の流れを調べる。微細な凹凸を無視したとき、中央の地形と、両側斜面での地表水の動きの組合せはどれか。」", "options": ["等高線と雨水の流れ", "森林の土壌断面と物質移動", "都市と農村の人口変化", "南九州の地形と畜産"], "ans": 0, "exp": "図の中央の補助線を境にした雨水の流れを調べる。微細な凹凸を無視したとき、中央の地形と、両側斜面での地表水の動きの組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-40", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の山頂Sと、外側の100m等高線上にある地点Rとの比高として、あり得る範囲はどれか。20m間隔の等高線は全て描かれ、Sの標高は等高線の標高と一致しない。」", "options": ["等高線の標高範囲と比高", "月別の土壌水分を追う", "地区機能を指標から読む", "低地の断面と水面"], "ans": 0, "exp": "図の山頂Sと、外側の100m等高線上にある地点Rとの比高として、あり得る範囲はどれか。20m間隔の等高線は全て描かれ、Sの標高は等高線の標高と一致しない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-41", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P（標高100m）からQ（標高200m）を見通せるか調べる。表と図の折れ線を地表断面とし、建物・植生・地球の丸み・目の高さを無視する。判定とその根拠として正しいものはどれか。」", "options": ["断面図の視通と鉛直倍率", "三地域の雨の成因を比べる", "生活拠点の再配置", "積雪期と噴火後の降雨"], "ans": 0, "exp": "P（標高100m）からQ（標高200m）を見通せるか調べる。表と図の折れ線を地表断面とし、建物・植生・地球の丸み・目の高さを無視する。判定とその根拠として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-42", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「河川の縦断測量で表の値を得た。上流側P–Qと下流側Q–Rについて、平均河床勾配の組合せと、それに対応する典型的な変化として適切なものはどれか。」", "options": ["河床縦断と勾配の変化", "穀物農場の生産性", "地代と土地利用", "都市気温の比較地点"], "ans": 0, "exp": "河川の縦断測量で表の値を得た。上流側P–Qと下流側Q–Rについて、平均河床勾配の組合せと、それに対応する典型的な変化として適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-43", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のP付近の支流から取水し、尾根を貫く導水路を通じて河川Bの流域へ毎秒2m³を送り続ける。他の条件は同じで、取水・放水地点より下流の流量を比較する。導水前後の変化と自然の分水界について正しいものはどれか。」", "options": ["分水界を越える導水", "農地面積と延べ作付面積", "言語圏と国境", "回収容器と地域の条件"], "ans": 0, "exp": "図のP付近の支流から取水し、尾根を貫く導水路を通じて河川Bの流域へ毎秒2m³を送り続ける。他の条件は同じで、取水・放水地点より下流の流量を比較する。導水前後の変化と自然の分水界について正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-44", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「地域資料館の候補地を、駅への徒歩経路が800m以内で、平坦な自然堤防または段丘面にある土地から選ぶ。切土・盛土は行わない。表で対象となる候補と、判定に必要な処理の組合せはどれか。」", "options": ["GISと地形条件の重ね合わせ", "施設園芸の費用と立地", "住居の形と環境", "沿岸の漂着物と季節"], "ans": 0, "exp": "地域資料館の候補地を、駅への徒歩経路が800m以内で、平坦な自然堤防または段丘面にある土地から選ぶ。切土・盛土は行わない。表で対象となる候補と、判定に必要な処理の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-45", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の直線距離500m以内の圏域には入るが、表の徒歩道路距離500m以内の圏域には入らない地点の組合せはどれか。円周上の地点も直線500m以内に含め、徒歩距離は橋や踏切による迂回を含む表の値を用いる。」", "options": ["直線の到達圏と道路の到達圏", "熱帯林地域の土地利用", "中国の河川と都市の位置", "上流施設と海岸の変化"], "ans": 0, "exp": "図の直線距離500m以内の圏域には入るが、表の徒歩道路距離500m以内の圏域には入らない地点の組合せはどれか。円周上の地点も直線500m以内に含め、徒歩距離は橋や踏切による迂回を含む表の値を用いる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-46", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の道路網で、平常時とB–T間だけが工事で通れなくなった場合を比べる。SからTへの最短所要時間が増える割合と、そのときの最短経路の組合せはどれか。全区間は双方向で、図の数値は分である。」", "options": ["交通ネットワークの結節点", "食料自給率の二つの指標", "河口低地の季節的な水利用", "集計地図で見える範囲"], "ans": 0, "exp": "図の道路網で、平常時とB–T間だけが工事で通れなくなった場合を比べる。SからTへの最短所要時間が増える割合と、そのときの最短経路の組合せはどれか。全区間は双方向で、図の数値は分である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-47", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の12セルを、横に隣接する2セルずつの6組へ集約する。各組は多数を占める土地利用で代表し、1対1の場合は「宅地、畑、森林」の順で優先する。集約後の森林面積と、この処理の特徴はどれか。」", "options": ["ラスターの集約と土地利用", "養殖方式と湾の環境", "南アジアの都市と産業", "人口・都市・生活文化"], "ans": 0, "exp": "図の12セルを、横に隣接する2セルずつの6組へ集約する。各組は多数を占める土地利用で代表し、1対1の場合は「宅地、畑、森林」の順で優先する。集約後の森林面積と、この処理の特徴はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-48", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「市全体で店舗への徒歩アクセスを分析するGISと、商業施設内の売場面積を測るGISを作る。店舗の表し方として適切な組合せはどれか。」", "options": ["縮尺・目的と点線面データ", "エネルギー源の構成と自給", "乾燥地域の地下水の更新速度", "地図は凡例・方位・縮尺"], "ans": 0, "exp": "市全体で店舗への徒歩アクセスを分析するGISと、商業施設内の売場面積を測るGISを作る。店舗の表し方として適切な組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-49", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ100haの区域で、旧時点から新時点への土地利用の移り変わりを表にした。旧農地が宅地になった面積と、区域全体の宅地の純増面積の組合せはどれか。」", "options": ["土地利用の遷移と都市化", "天然ガスの輸送体系", "欧州の河川と海港", "鉱石の産地と製錬工場の立地"], "ans": 0, "exp": "同じ100haの区域で、旧時点から新時点への土地利用の移り変わりを表にした。旧農地が宅地になった面積と、区域全体の宅地の純増面積の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-50", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「店舗の点データを行政区の面データと空間結合した結果が表である。地区の商業施設の集中度について、表から適切に判断した説明はどれか。」", "options": ["空間結合と集計単位の限界", "水力発電と季節流量", "乾燥国の人口と耕地", "理由と具体例を口で伝える"], "ans": 0, "exp": "店舗の点データを行政区の面データと空間結合した結果が表である。地区の商業施設の集中度について、表から適切に判断した説明はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-51", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の4セルを平均で1セルに集約する方法と、4セルの最大値を1セルに格納する方法を比べる。平均値と最大値の地形表現上の特徴として適切な組合せはどれか。」", "options": ["標高データの解像度と集約方法", "原料と製品の重量変化", "北米の農業地域と生産性", "対蹠点と最短距離"], "ans": 0, "exp": "図の4セルを平均で1セルに集約する方法と、4セルの最大値を1セルに格納する方法を比べる。平均値と最大値の地形表現上の特徴として適切な組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-52", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「異なる機関の道路データと建物データを重ねたところ、複数の交差点と建物でほぼ一様な位置のずれが見られた。表のメタデータを踏まえ、最初の処理として最も適切なものはどれか。」", "options": ["座標参照系と位置のずれ", "三つの工場用地", "ブラジルの地域差", "画像の拡大と地図の情報量"], "ans": 0, "exp": "異なる機関の道路データと建物データを重ねたところ、複数の交差点と建物でほぼ一様な位置のずれが見られた。表のメタデータを踏まえ、最初の処理として最も適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-53", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ資料から、農地率を濃淡で示す階級区分図Xと、農地面積を円の面積で示す比例記号図Yを作る。Xが最も濃い地区と、Yの円が最も大きい地区の組合せはどれか。」", "options": ["階級区分図と比例記号図", "供給網の分散と輸送拠点", "豪州の鉱産資源と港湾", "等高線と雨水の流れ"], "ans": 0, "exp": "同じ資料から、農地率を濃淡で示す階級区分図Xと、農地面積を円の面積で示す比例記号図Yを作る。Xが最も濃い地区と、Yの円が最も大きい地区の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-54", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のXで、谷口に近い扇頂、中央の扇央、外縁の扇端を調べる。厚い砂礫層が続き、扇央では河川の表流水が減り、扇端に湧水がある。この条件下で考えられる土地利用の説明として適切なものはどれか。」", "options": ["谷口の堆積地と水利用", "情報処理施設の立地", "標高と野菜の出荷時期", "交通ネットワークの結節点"], "ans": 0, "exp": "図のXで、谷口に近い扇頂、中央の扇央、外縁の扇端を調べる。厚い砂礫層が続き、扇央では河川の表流水が減り、扇端に湧水がある。この条件下で考えられる土地利用の説明として適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-55", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のXを持つ河口で、上流に大きな貯水池ができた後、海岸線が後退した。海面の高さや波の条件は変わっていないとする。変化を説明する因果関係として適切なものはどれか。」", "options": ["河口の堆積地と海岸線の変化", "貨物の価値と輸送手段", "低地の土地利用と浸水", "階級区分図と比例記号図"], "ans": 0, "exp": "図のXを持つ河口で、上流に大きな貯水池ができた後、海岸線が後退した。海面の高さや波の条件は変わっていないとする。変化を説明する因果関係として適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-56", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のA・Bについて、洪水時に運ばれた土砂の堆積と、従来の土地利用を比較する。大規模な盛土や排水改良を行う前の典型的な組合せはどれか。」", "options": ["氾濫原の微地形と堆積物", "輸出額の変化と産業構造", "低地市街地の排水", "砂の移動と海岸堆積地形"], "ans": 0, "exp": "図のA・Bについて、洪水時に運ばれた土砂の堆積と、従来の土地利用を比較する。大規模な盛土や排水改良を行う前の典型的な組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-57", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のI・IIは同じ河川の下刻で生じた段丘面である。表の火山灰のうちKはTより古いと分かっている。火山灰の再堆積・侵食除去はなかったとすると、IとIIの離水時期の組合せはどれか。」", "options": ["段丘面と火山灰による年代比較", "中継港と地域経済", "火山周辺の二つの移動", "山脈・地溝とプレート境界"], "ans": 0, "exp": "図のI・IIは同じ河川の下刻で生じた段丘面である。表の火山灰のうちKはTより古いと分かっている。火山灰の再堆積・侵食除去はなかったとすると、Iと された。当時の世界的な海面は現在より約6m高かったとする。堆積後の侵食による高さの変化を無視すると、この間の平均的な隆起速度に最も近い値はどれか。」", "options": ["海成段丘と地盤の隆起", "移動率と年齢構成", "観光客の集中する時間", "海上の霧と露点"], "ans": 0, "exp": "図の旧汀線は現在の海面から50m上にあり、約12万5千年前に形成された。当時の世界的な海面は現在より約6m高かったとする。堆積後の侵食による高さの変化を無視すると、この間の平均的な隆起速度に最も近い値はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-63", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「内陸の台地で、円形のくぼみが多く、地表を流れる川が少ない一方、地下洞窟には流水がある。露出する岩石には貝殻などの化石が含まれる。この地形の形成と土地利用上の特徴を説明するものはどれか。」", "options": ["岩石の性質と地表・地下の排水", "移住を生む条件", "地区構成と標本調査", "東西岸の降水配分を比較する"], "ans": 0, "exp": "内陸の台地で、円形のくぼみが多く、地表を流れる川が少ない一方、地下洞窟には流水がある。露出する岩石には貝殻などの化石が含まれる。この地形の形成と土地利用上の特徴を説明するものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-64", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のA・Bのうち、主谷へ合流する支谷の底が高い位置に残り、合流部に滝が形成されやすい谷を選ぶ。そのような高さの差が生じる理由との組合せはどれか。」", "options": ["谷の断面と支谷の高さ", "国境を越える通勤", "道路沿いの商業と商圏", "森林の土壌断面と物質移動"], "ans": 0, "exp": "図のA・Bのうち、主谷へ合流する支谷の底が高い位置に残り、合流部に滝が形成されやすい谷を選ぶ。そのような高さの差が生じる理由との組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-65", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「かつて氷河のあった谷でA・Bの堆積物を調べた。形成過程の組合せとして適切なものはどれか。」", "options": ["氷河周辺の堆積物の識別", "都市区域の変更", "単元別プリント｜一問一答・無料学習プリント", "モンスーン地域の作付け"], "ans": 0, "exp": "かつて氷河のあった谷でA・Bの堆積物を調べた。形成過程の組合せとして適切なものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-66", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の中央を境として左右へ同じ速さで海底が広がったとする。中央からの距離と海洋地殻の年代の対応、さらに海底堆積物の厚さの一般的な傾向として適切なものはどれか。大きな堆積速度の地域差はないものとする。」", "options": ["海底拡大と海洋地殻の年代", "昼夜の人口と都市機能", "地理B（旧課程の過去問）｜一問一答・無料学習プリント", "野菜産地の出荷時期"], "ans": 0, "exp": "図の中央を境として左右へ同じ速さで海底が広がったとする。中央からの距離と海洋地殻の年代の対応、さらに海底堆積物の厚さの一般的な傾向として適切なものはどれか。大きな堆積速度の地域差はないものとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-67", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の海溝から陸側へ離れた地点で震源の深さを調べる。図に対応する沈み込んだプレート内の地震を表す分布と、同じ種類の境界がある地域の組合せはどれか。」", "options": ["沈み込みと震源の分布", "都市圏の人口配置の変化", "地図は凡例・方位・縮尺", "食料自給率の二つの指標"], "ans": 0, "exp": "図の海溝から陸側へ離れた地点で震源の深さを調べる。図に対応する沈み込んだプレート内の地震を表す分布と、同じ種類の境界がある地域の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-68", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「A・Bの観察記録を、形成が続く地域の代表例と結び付ける。最も適切な組合せはどれか。」", "options": ["山脈・地溝とプレート境界", "生活拠点の再配置", "氾濫原の微地形と土地利用", "電源構成とエネルギー全体"], "ans": 0, "exp": "A・Bの観察記録を、形成が続く地域の代表例と結び付ける。最も適切な組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-69", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のような境界に伴う地殻の生成・消滅と地震の特徴の組合せとして適切なものはどれか。図は境界での相対運動だけを示す。」", "options": ["横ずれ境界と地震・地殻の生成", "通勤の地域間結合", "流域の都市化と洪水の変化", "鉱石処理と輸送の分業"], "ans": 0, "exp": "図のような境界に伴う地殻の生成・消滅と地震の特徴の組合せとして適切なものはどれか。図は境界での相対運動だけを示す。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-70", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図と表の火山列が、位置の固定したマグマ供給源の上をプレートが一定方向へ移動してできたとする。プレートの移動方向と平均速度の組合せはどれか。年代は火山形成後の経過時間である。」", "options": ["火山列の年代とプレート移動速度", "購買行動と中心地の階層", "資料は読める。でも、答案や面接でうまく説明できない。", "供給網の分散と輸送拠点"], "ans": 0, "exp": "図と表の火山列が、位置の固定したマグマ供給源の上をプレートが一定方向へ移動してできたとする。プレートの移動方向と平均速度の組合せはどれか。年代は火山形成後の経過時間である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-71", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にあ ラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「雨温図の地点Pは低地で、古い地表に自然林が広がる。気候と、森林を長期間伐採した際に注意すべき土壌の性質の組合せを選べ。」", "options": ["高温多雨な低地の自然環境", "内陸アジアの牧畜", "土地利用の遷移と都市化", "都市圏の人口配置の変化"], "ans": 0, "exp": "雨温図の地点Pは低地で、古い地表に自然林が広がる。気候と、森林を長期間伐採した際に注意すべき土壌の性質の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-77", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図は地点P、表は地点Qの資料である。P・Qは北緯45度前後で標高差は小さい。Pの年較差と、Qより年較差が大きい主な背景の組合せを選べ。」", "options": ["年較差と大陸性", "東南アジアの農産物と地域", "谷口の堆積地と水利用", "交通手段と都市の成長"], "ans": 0, "exp": "図は地点P、表は地点Qの資料である。P・Qは北緯45度前後で標高差は小さい。Pの年較差と、Qより年較差が大きい主な背景の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-78", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のPと、表のQは北半球の温帯低地で、乾燥帯には属さない。Pの年降水量と、Qに適した気候の説明の組合せを選べ。」", "options": ["年降水量が同じ二つの季節配分", "南アジアの都市と産業", "粒径資料からみる堆積環境", "言語の使用場面と地域差"], "ans": 0, "exp": "図のPと、表のQは北半球の温帯低地で、乾燥帯には属さない。Pの年降水量と、Qに適した気候の説明の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-79", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図は東アジアの温帯低地を想定したPである。6〜8月の降水が年量に占める割合と、この季節に多雨となる背景の組合せを選べ。」", "options": ["夏季降水割合と東アジアの季節風", "ヒマラヤ周辺の輸送条件", "谷の断面と支谷の高さ", "人口推計の二つの経路"], "ans": 0, "exp": "図は東アジアの温帯低地を想定したPである。6〜8月の降水が年量に占める割合と、この季節に多雨となる背景の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-80", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北緯35度前後の大陸西岸にあるPの雨温図である。降水の季節変化を説明する組合せを選べ。」", "options": ["大陸西岸の降水と季節変化", "西アジアの海上輸送路", "横ずれ境界と地震・地殻の生成", "河口低地の季節的な水利用"], "ans": 0, "exp": "北緯35度前後の大陸西岸にあるPの雨温図である。降水の季節変化を説明する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-81", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「Pの年変化をもつ気候がみられる地域と、その自然植生の組合せを選べ。図は実測値ではなく、特定都市を同定するものではない。」", "options": ["気候の季節性と世界の分布", "西アジアの気候と農業の差", "雨温図から大陸東西の違いを読む", "南アジアの作物と季節"], "ans": 0, "exp": "Pの年変化をもつ気候がみられる地域と、その自然植生の組合せを選べ。図は実測値ではなく、特定都市を同定するものではない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-82", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「Pは北緯25〜30度、低地にある。雨温図に合う気候と、その緯度帯で広い乾燥地域が形成される主な大気の動きの組合せを選べ。」", "options": ["少雨地域の位置と大気循環", "西ヨーロッパの園芸農業", "夏季降水割合と東アジアの季節風", "西アジアの気候と農業の差"], "ans": 0, "exp": "Pは北緯25〜30度、低地にある。雨温図に合う気候と、その緯度帯で広い乾燥地域が形成される主な大気の動きの組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-83", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「Pはアジア大陸内部の低地にある。気候区分と年間を通じた少雨の背景の組合せを選べ。この地点の乾燥限界Rは概数で312mmとし、年降水量がR/2未満ならBW、R/2以上R未満ならBSとする。乾燥帯に該当するかを、気温によるC・Dの区分より先に判定する。」", "options": ["大陸内部の気温と水分条件", "乾燥国の人口と耕地", "モンスーン気候と熱帯雨林気候の区別", "西アフリカの換金作物"], "ans": 0, "exp": "Pはアジア大陸内部の低地にある。気候区分と年間を通じた少雨の背景の組合せを選べ。この地点の乾燥限界Rは概数で312mmとし、年降水量がR/2未満ならBW、R/2以上R未満ならBSとする。乾燥帯に該当するかを、気温によるC・Dの区分より先に判定する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-84", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「Pの乾燥限界Rは440mmである。年降水量をP年としたとき、P年＜R/2ならBW、R/2≦P年＜RならBSとする。気候区分と、同じ緯度帯のさらに乾燥した場所へ向かったときの植生変化を選べ。」", "options": ["乾燥限界と植生の変化", "西アフリカの内陸国と港", "寒冷地域の気温と半球", "カナダの資源と製錬"], "ans": 0, "exp": "Pの乾燥限界Rは440mmである。年降水量をP年としたとき、P年＜R/2ならBW、R/2≦P年＜RならBSとする。気候区分と、同じ緯度帯のさらに乾燥した場所へ向かったときの植生変化を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-85", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「
