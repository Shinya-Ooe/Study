デルである。対応として正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-95", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北緯5度のAと北緯15度のBで、熱帯収束帯の中心に近い時期ほど雨が多いモデルを考える。表の位置の間を収束帯が滑らかに南北移動し、他の降水要因は一定とする。降水のピークが現れる時期と、収束帯での空気の動きの組合せはどれか。」", "options": ["収束帯の移動と二地点の降水ピーク", "積雪期と噴火後の降雨", "電源構成とエネルギー全体", "地図は凡例・方位・縮尺"], "ans": 0, "exp": "北緯5度のAと北緯15度のBで、熱帯収束帯の中心に近い時期ほど雨が多いモデルを考える。表の位置の間を収束帯が滑らかに南北移動し、他の降水要因は一定とする。降水のピークが現れる時期と、収束帯での空気の動きの組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-96", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北緯20度の海洋に、南北に長い山地をもつ島がある。年間を通じて貿易風が卓越するとしたとき、風向と降水量が多くなりやすい斜面の組合せを選べ。」", "options": ["低緯度の風と島の斜面", "施設の指定と地形条件", "水力発電と季節流量", "鉱石の産地と製錬工場の立地"], "ans": 0, "exp": "北緯20度の海洋に、南北に長い山地をもつ島がある。年間を通じて貿易風が卓越するとしたとき、風向と降水量が多くなりやすい斜面の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-97", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表の低気圧の移動に関係する大規模な風と、その風が大陸西岸の気候に与える影響の組合せを選べ。」", "options": ["低気圧の移動と中緯度の風", "時刻による都市の気温差", "製鉄所の立地条件の変化", "理由と具体例を口で伝える"], "ans": 0, "exp": "表の低気圧の移動に関係する大規模な風と、その風が大陸西岸の気候に与える影響の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-98", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「インド半島西岸で6〜9月に降水が増え、同緯度でも西ガーツ山脈の西側が東側より多雨となる。この特徴に合う説明を選べ。」", "options": ["南アジアの降水の東西差", "貿易と排出量の集計", "都市圏の工場跡地", "対蹠点と最短距離"], "ans": 0, "exp": "インド半島西岸で6〜9月に降水が増え、同緯度でも西ガーツ山脈の西側が東側より多雨となる。この特徴に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-99", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北側が海、南側が陸の海岸で、晴天・弱い一般風の日に表の温度を観測した。午後と明け方の地表付近の局地風の組合せを選べ。」", "options": ["海陸風と日変化", "季節と発電資源", "貨物の価値と輸送手段", "画像の拡大と地図の情報量"], "ans": 0, "exp": "北側が海、南側が陸の海岸で、晴天・弱い一般風の日に表の温度を観測した。午後と明け方の地表付近の局地風の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-100", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「南アメリカ南部の南緯45度付近を、西の太平洋側から東の内陸側へ調べた。表の降水差に合う説明を選べ。」", "options": ["山脈両側の降水量", "観光地のごみ指標", "加工貿易と付加価値", "等高線と雨水の流れ"], "ans": 0, "exp": "南アメリカ南部の南緯45度付近を、西の太平洋側から東の内陸側へ調べた。表の降水差に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-101", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表の空気塊がPから山頂を越えてQへ移動する。Qの気温と、Pに比べた相対湿度の変化の組合せを選べ。」", "options": ["山を越える空気の温度と湿度", "湿地と炭素の動き", "出生率・死亡率と人口構造", "交通ネットワークの結節点"], "ans": 0, "exp": "表の空気塊がPから山頂を越えてQへ移動する。Qの気温と、Pに比べた相対湿度の変化の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-102", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ北緯50度前後の低地で、Pはヨーロッパの大西洋沿岸、Qは北アメリカ大陸東岸を想定する。表の冬季の差を説明する組合せを選べ。」", "options": ["ヨーロッパ西岸の冬の温和さ", "沿岸の漂着物と季節", "死亡率の地域比較", "階級区分図と比例記号図"], "ans": 0, "exp": "同じ北緯50度前後の低地で、Pはヨーロッパの大西洋沿岸、Qは北アメリカ大陸東岸を想定する。表の冬季の差を説明する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-103", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北太平洋北部で、南からの湿った空気が寒流域へ移動した。表の条件で霧ができる過程と、同じ水蒸気量のまま暖流域へ進んだ場合の相対湿度の変化を選べ。」", "options": ["海上の霧と露点", "観光客の集中する時間", "山村の年齢構成", "沈水海岸の形成過程と地域"], "ans": 0, "exp": "北太平洋北部で、南からの湿った空気が寒流域へ移動した。表の条件で霧ができる過程と、同じ水蒸気量のまま暖流域へ進んだ場合の相対湿度の変化を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-104", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P・Qは北緯50度前後の同程度の標高にある。海洋からの距離と卓越風を踏まえると、表に合う組合せはどれか。」", "options": ["同緯度の東西比較", "市街地更新と災害条件", "国際移動と地域経済", "沈み込みと震源の分布"], "ans": 0, "exp": "P・Qは北緯50度前後の同程度の標高にある。海洋からの距離と卓越風を踏まえると、表に合う組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-105", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のX・Yは、東アフリカの赤道付近の高地と、西ヨーロッパの海岸低地のいずれかを想定する。地域と気温変化の説明が正しいものを選べ。」", "options": ["低緯度高地と中緯度沿岸", "建物の階と土地利用", "都市区域の変更", "雨温図から大陸東西の違いを読む"], "ans": 0, "exp": "表のX・Yは、東アフリカの赤道付近の高地と、西ヨーロッパの海岸低地のいずれかを想定する。地域と気温変化の説明が正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-106", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同緯度・同標高の都市中心部と郊外で、風が弱く晴れた日に表の結果を得た。夜の差を説明する土地被覆と熱の働きを選べ。」", "options": ["都市の夜の気温と土地被覆", "周遊観光と延べ人数", "都市内の土地利用", "気候の季節性と世界の分布"], "ans": 0, "exp": "同緯度・同標高の都市中心部と郊外で、風が弱く晴れた日に表の結果を得た。夜の差を説明する土地被覆と熱の働きを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-107", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同緯度のPとQの平均気温を、標高0mに換算して比較する。100m高くなると0.6℃低下するモデルを使うとき、換算後の差と判断として正しいものを選べ。」", "options": ["標高補正で二地点を比べる", "空中写真の季節と農地", "距離と時間の隔たり", "冷帯と寒帯を分ける夏の気温"], "ans": 0, "exp": "同緯度のPとQの平均気温を、標高0mに換算して比較する。100m高くなると0.6℃低下するモデルを使うとき、換算後の差と判断として正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-108", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「盆地で晴天・弱風の明け方に表を得た。地表付近の露点は3℃である。起こりやすい現象とその過程の組合せを選べ。」", "options": ["盆地の明け方の鉛直気温", "単元別プリント｜一問一答・無料学習プリント", "購買行動と中心地の階層", "収束帯の移動と二地点の降水ピーク"], "ans": 0, "exp": "盆地で晴天・弱風の明け方に表を得た。地表付近の露点は3℃である。起こりやすい現象とその過程の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-109", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある北半球の温帯地域で、1年だけ7月降水量が5mmとなった。その地域を地中海性気候へ分類し直すか検討するとき、最も必要な追加資料を選べ。」", "options": ["気候区分に使う資料の期間", "人口・都市・生活文化", "言語の使用場面と地域差", "ヨーロッパ西岸の冬の温和さ"], "ans": 0, "exp": "ある北半球の温帯地域で、1年だけ7月降水量が5mmとなった。その地域を地中海性気候へ分類し直すか検討するとき、最も必要な追加資料を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-110", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P・Qは北緯35度前後の低地で、年平均気温と年降水量は等しい。表の季節配分から、大陸の東西と夏の水分条件について正しいものを選べ。」", "options": ["東西岸の降水配分を比較する", "過去問類似プリント", "地域格差を集計で読む", "気候区分に使う資料の期間"], "ans": 0, "exp": "P・Qは北緯35度前後の低地で、年平均気温と年降水量は等しい。表の季節配分から、大陸の東西と夏の水分条件について正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-111", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「年降水量Pが乾燥限界R未満ならB、R/2未満ならBW、R/2以上R未満ならBSとする。表の判定と背景の組合せを選べ。」", "options": ["同じ降水量でも異なる乾燥の程度", "共通テスト地理の資料は、読む順番を決める", "中国東部の農業地域比較", "森林の土壌断面と物質移動"], "ans": 0, "exp": "年降水量Pが乾燥限界R未満ならB、R/2未満ならBW、R/2以上R未満ならBSとする。表の判定と背景の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-112", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「土地利用の影響を受ける前の植生を考える。表のP・Q・Rに対応する植生の組合せを選べ。」", "options": ["三地域の自然植生", "雨温図は気温から降水へ", "島嶼部の地形と農業", "モンスーン地域の作付け"], "ans": 0, "exp": "土地利用の影響を受ける前の植生を考える。表のP・Q・Rに対応する植生の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-113", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「シベリアを南から北へ進むと、針葉樹林の広い地域から、低い草本やコケ類の多い地域へ移る。この変化と最も直接に関係する気候指標を選べ。」", "options": ["高緯度の森林の境界", "氾濫原の微地形と土地利用", "デルタ国家の輸出工業", "野菜産地の出荷時期"], "ans": 0, "exp": "シベリアを南から北へ進むと、針葉樹林の広い地域から、低い草本やコケ類の多い地域へ移る。この変化と最も直接に関係する気候指標を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-114", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「温帯のAでは夏に少雨、Bでは冬に低温となり、Aの樹木は硬い葉を保ち、Bの広葉樹の多くは冬に葉を落とす。適応と地域例の組合せを選べ。」", "options": ["葉の特徴と季節的乾燥", "合計特殊出生率が下がっても人口が増える理由", "西アジアの海上輸送路", "食料自給率の二つの指標"], "ans": 0, "exp": "温帯のAでは夏に少雨、Bでは冬に低温となり、Aの樹木は硬い葉を保ち、Bの広葉樹の多くは冬に葉を落とす。適応と地域例の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-115", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「南アメリカの湿潤熱帯で、古く安定した地表の土壌を調べた。赤色で深い風化層があり、溶けて移動しやすい成分は少ない。この特徴の形成過程を選べ。」", "options": ["湿潤地域の土壌断面", "資料を選ぶ力を、二次試験・小論文・面接で伝える力へ", "欧州の国際分業と国境", "電源構成とエネルギー全体"], "ans": 0, "exp": "南アメリカの湿潤熱帯で、古く安定した地表の土壌を調べた。赤色で深い風化層があり、溶けて移動しやすい成分は少ない。この特徴の形成過程を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-116", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ユーラシア中緯度の草原で、厚く黒い表層と豊富な腐植をもつ土壌を観察した。名称と、湿潤熱帯の赤色土壌との違いを説明する組合せを選べ。」", "options": ["草原の表層と土壌形成", "理由と具体例を口で伝える", "西アフリカの換金作物", "鉱石処理と輸送の分業"], "ans": 0, "exp": "ユーラシア中緯度の草原で、厚く黒い表層と豊富な腐植をもつ土壌を観察した。名称と、湿潤熱帯の赤色土壌との違いを説明する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-117", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北ヨーロッパの冷涼な森林で表の断面を観察した。土壌名と、上層から下層への物質移動の組合せを選べ。」", "options": ["森林の土壌断面と物質移動", "地理総合・地理探究の出題範囲と過去問を確認する", "北米の農業と水利用", "供給網の分散と輸送拠点"], "ans": 0, "exp": "北ヨーロッパの冷涼な森林で表の断面を観察した。土壌名と、上層から下層への物質移動の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-118", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ気候・植生の地域でPには黒い火山灰土、Qには地下水位の高い低地の灰色の土がみられた。Pの黒色とQの灰色を、それぞれ説明する主な過程を選べ。」", "options": ["気候が同じでも違う土壌", "緯経度・南中高度・地方時", "アンデスの高度と土地利用", "輸送量の指標と距離"], "ans": 0, "exp": "同じ気候・植生の地域でPには黒い火山灰土、Qには地下水位の高い低地の灰色の土がみられた。Pの黒色とQの灰色を、それぞれ説明する主な過程を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-119", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表は高緯度の平坦な土地の地温である。深さ0.2mでは毎夏融解・毎冬凍結し、1.5m以下は3年間0℃以下だった。夏に地表付近が湿地化しやすい理由を選べ。」", "options": ["高緯度の地温と水の動き", "標準時と太陽の南中", "ニュージーランドの降水と牧畜", "原料調達を含む供給網"], "ans": 0, "exp": "表は高緯度の平坦な土地の地温である。深さ0.2mでは毎夏融解・毎冬凍結し、1.5m以下は3年間0℃以下だった。夏に地表付近が湿地化しやすい理由を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-120", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北半球の地中海沿岸を想定した資料である。5月初めの土壌水分貯留は100mm。各月にP−Eを加え、0mmを下回る分は不足量とする。このモデルで初めて不足が生じる月と、その背景を選べ。」", "options": ["月別の土壌水分を追う", "縮尺と斜面の比較", "太平洋側の園芸と市場", "死亡率の地域比較"], "ans": 0, "exp": "北半球の地中海沿岸を想定した資料である。5月初めの土壌水分貯留は100mm。各月にP−Eを加え、0mmを下回る分は不足量とする。このモデルで初めて不足が生じる月と、その背景を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-121", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「緯度の絶対値と標高が等しい北緯35度のPと南緯35度のQを比べる。6月の昼の長さと南中高度の組合せとして正しいものを選べ。」", "options": ["二つの半球の日射の季節", "回転した地図と太陽の方位", "観測地点による揺れの違い", "都市圏内部の住所移動"], "ans": 0, "exp": "緯度の絶対値と標高が等しい北緯35度のPと南緯35度のQを比べる。6月の昼の長さと南中高度の組合せとして正しいものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-122", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「太平洋赤道域で、表の状態が数か月以上続いている。平常時からの変化として整合する組合せを選べ。」", "options": ["太平洋赤道域の東西差", "メルカトル図法の面積補正", "都市化と流出の時間変化", "都市と農村の人口変化"], "ans": 0, "exp": "太平洋赤道域で、表の状態が数か月以上続いている。平常時からの変化として整合する組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-123", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P・Q・Rの多雨を説明する主なしくみを対応させたものを選べ。」", "options": ["三地域の雨の成因を比べる", "等高線と雨水の流れ", "積雪期と噴火後の降雨", "都市圏の人口配置の変化"], "ans": 0, "exp": "P・Q・Rの多雨を説明する主なしくみを対応させたものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-124", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「インド北部の平野を想定した資料で、雨季と乾季に組み合わせる穀物と、その作付けを支える条件として適切なものを選べ。」", "options": ["モンスーン地域の作付け", "河床縦断と勾配の変化", "台風と湾の向き", "交通手段と都市の成長"], "ans": 0, "exp": "インド北部の平野を想定した資料で、雨季と乾季に組み合わせる穀物と、その作付けを支える条件として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-125", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「斜面の棚田Pと沖積低地の水田Qを比較した。地形と水利用の関係について、適切な説明を選べ。」", "options": ["斜面と低地の農地利用", "直線の到達圏と道路の到達圏", "電源構成と総排出量", "言語の使用場面と地域差"], "ans": 0, "exp": "斜面の棚田Pと沖積低地の水田Qを比較した。地形と水利用の関係について、適切な説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-126", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ穀物を作る農場P・Qについて、土地生産性と労働生産性の比較、および経営の説明がともに適切なものを選べ。労働時間は農場全体の年間合計である。」", "options": ["穀物農場の生産性", "縮尺・目的と点線面データ", "観光地のごみ指標", "人口推計の二つの経路"], "ans": 0, "exp": "同じ穀物を作る農場P・Qについて、土地生産性と労働生産性の比較、および経営の説明がともに適切なものを選べ。労働時間は農場全体の年間合計である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-127", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「資料のX・Yの呼び方と、それを可能にする条件の組合せを選べ。」", "options": ["作付け暦の読み取り", "標高データの解像度と集約方法", "生息地の連結と道路", "河口低地の季節的な水利用"], "ans": 0, "exp": "資料のX・Yの呼び方と、それを可能にする条件の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-128", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「地中海沿岸の産地で、冬小麦と夏季出荷の野菜を栽培する。降水の季節性と作物の違いを踏まえた説明を選べ。」", "options": ["地中海沿岸の作物と水利用", "谷口の堆積地と水利用", "観光消費と地域内の循環", "南アジアの作物と季節"], "ans": 0, "exp": "地中海沿岸の産地で、冬小麦と夏季出荷の野菜を栽培する。降水の季節性と作物の違いを踏まえた説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-129", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある地区で圃場整備とかんがい整備が行われた。表から読み取れる変化と、農業の変化の説明として適切なものを選べ。」", "options": ["農地面積と延べ作付面積", "段丘面と火山灰による年代比較", "建物の階と土地利用", "西アジアの気候と農業の差"], "ans": 0, "exp": "ある地区で圃場整備とかんがい整備が行われた。表から読み取れる変化と、農業の変化の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-130", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P・Qは、北海道東部の草地型酪農地域と大都市近郊の酪農地域の特徴を単純化したものである。対応と立地の説明として適切なものを選べ。」", "options": ["二つの酪農地域", "沈水海岸の形成過程と地域", "集計地図で見える範囲", "西アフリカの換金作物"], "ans": 0, "exp": "P・Qは、北海道東部の草地型酪農地域と大都市近郊の酪農地域の特徴を単純化したものである。対応と立地の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-131", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表は同じ野菜を作る三つの産地の例である。P・Q・Rの立地と出荷の説明として適切なものを選べ。」", "options": ["野菜産地の出荷時期", "岩石の性質と地表・地下の排水", "自然環境", "カナダの資源と製錬"], "ans": 0, "exp": "表は同じ野菜を作る三つの産地の例である。P・Q・Rの立地と出荷の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-132", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同一品質・同一収量のトマトを冬に出荷するP・Q産地を比較する。燃料単価だけが2倍になったとき、収益が高い産地とその理由の組合せを選べ。販売収入と表以外の費用は等しい。」", "options": ["施設園芸の費用と立地", "海底拡大と海洋地殻の年代", "過去問類似プリント", "豪州の鉱産資源と港湾"], "ans": 0, "exp": "同一品質・同一収量のトマトを冬に出荷するP・Q産地を比較する。燃料単価だけが2倍になったとき、収益が高い産地とその理由の組合せを選べ。販売収入と表以外の費用は等しい。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-133", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P国はコーヒーに輸出を依存し、食料を輸入する。コーヒーの輸出量は変わらず価格が20％下落、その他の輸出額は不変だった。同時に輸入穀物の単価が25％上昇した。輸出収入の全額で買える穀物量は以前の何％になるか。」", "options": ["商品作物への依存と交易", "横ずれ境界と地震・地殻の生成", "統計は単位・年次・分母", "南九州の地形と畜産"], "ans": 0, "exp": "P国はコーヒーに輸出を依存し、食料を輸入する。コーヒーの輸出量は変わらず価格が20％下落、その他の輸出額は不変だった。同時に輸入穀物の単価が25％上昇した。輸出収入の全額で買える穀物量は以前の何％になるか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-134", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「畑作と畜産を組み合わせた農場で、家畜頭数は変えず購入飼料を増やした。表に示す外部投入と農産物による搬出を比較した窒素収支について、適切な説明を選べ。表以外の投入・搬出条件は変わらないとする。」", "options": ["耕種と畜産の結び付き", "旧版地図と微地形の照合", "降水の季節差を風帯から説明する", "低地の断面と水面"], "ans": 0, "exp": "畑作と畜産を組み合わせた農場で、家畜頭数は変えず購入飼料を増やした。表に示す外部投入と農産物による搬出を比較した窒素収支について、適切な説明を選べ。表以外の投入・搬出条件は変わらないとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-135", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「熱帯林地域の移動耕作で、同じ区画の作付けは2年間のまま、休閑期間が12年から3年になった。この変化の説明として適切なものを選べ。」", "options": ["熱帯林地域の土地利用", "南アメリカ低緯度の雨季と植生", "資料を選ぶ力を、二次試験・小論文・面接で伝える力へ", "積雪期と噴火後の降雨"], "ans": 0, "exp": "熱帯林地域の移動耕作で、同じ区画の作付けは2年間のまま、休閑期間が12年から3年になった。この変化の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-136", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「中央アジアの乾燥地を想定した圃場で、かんがい開始後に地下水位が上昇し、地表付近の塩分濃度が増えた。表から考えられる主な過程と対策の組合せを選べ。」", "options": ["乾燥地のかんがいと土壌", "年降水量が同じ二つの季節配分", "地理のテーマから、大学別の準備を探す", "都市気温の比較地点"], "ans": 0, "exp": "中央アジアの乾燥地を想定した圃場で、かんがい開始後に地下水位が上昇し、地表付近の塩分濃度が増えた。表から考えられる主な過程と対策の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-137", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「かんがい方式の変更後、作物の収穫量は変わらなかった。取水のうち下流に戻る水は再利用でき、その他はこの流域外へ失われるとする。圃場の節水量と流域全体の水消費削減量の組合せを選べ。」", "options": ["圃場と流域の水収支", "気候の季節性と世界の分布", "対蹠点と最短距離", "回収容器と地域の条件"], "ans": 0, "exp": "かんがい方式の変更後、作物の収穫量は変わらなかった。取水のうち下流に戻る水は再利用でき、その他はこの流域外へ失われるとする。圃場の節水量と流域全体の水消費削減量の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-138", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「日本の食料自給率について、供給熱量ベースと生産額ベースの違いを踏まえた説明として適切なものを選べ。」", "options": ["食料自給率の二つの指標", "乾燥限界と植生の変化", "縮尺と斜面の比較", "沿岸の漂着物と季節"], "ans": 0, "exp": "日本の食料自給率について、供給熱量ベースと生産額ベースの違いを踏まえた説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-139", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「二つの人工林地区について、今後10年間の木材供給を考える。年末蓄積の増減と、供給継続の評価の組合せとして適切なものを選べ。立木材積の増減は成長と伐採だけで決まる。」", "options": ["森林の蓄積と年齢構成", "海に近い中緯度の年変化", "正距方位図法と大圏航路", "上流施設と海岸の変化"], "ans": 0, "exp": "二つの人工林地区について、今後10年間の木材供給を考える。年末蓄積の増減と、供給継続の評価の組合せとして適切なものを選べ。立木材積の増減は成長と伐採だけで決まる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-140", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ペルー沖を想定した観測値を示す。平常期から変化期への移行を、エルニーニョ現象と沿岸の生産力の関係から説明したものを選べ。」", "options": ["東部太平洋沿岸の変化", "寒冷地域の気温と半球", "等高線の標高範囲と比高", "集計地図で見える範囲"], "ans": 0, "exp": "ペルー沖を想定した観測値を示す。平常期から変化期への移行を、エルニーニョ現象と沿岸の生産力の関係から説明したものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-141", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ湾内のP・Qで養殖が行われている。Qで有機物の堆積が増えやすい理由として、資料と養殖方式の違いに合うものを選べ。」", "options": ["養殖方式と湾の環境", "日本の冬の降水の地域差", "直線の到達圏と道路の到達圏", "人口・都市・生活文化"], "ans": 0, "exp": "同じ湾内のP・Qで養殖が行われている。Qで有機物の堆積が増えやすい理由として、資料と養殖方式の違いに合うものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-142", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ魚種について、1隻1日当たり漁獲量を比べる。後期には魚群探知機の性能が向上した。表に合い、資源評価として妥当な説明を選べ。」", "options": ["漁獲統計と資源評価", "低緯度の風と島の斜面", "空間結合と集計単位の限界", "地図は凡例・方位・縮尺"], "ans": 0, "exp": "同じ魚種について、1隻1日当たり漁獲量を比べる。後期には魚群探知機の性能が向上した。表に合い、資源評価として妥当な説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-143", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「東アジアの養殖業者が、魚粉の供給地域P・Qの海洋環境を調べた。両地域の漁場の背景と、東部太平洋でエルニーニョに伴う変化が進んだ場合の説明として適切なものを選べ。」", "options": ["魚粉の供給地域と海洋環境", "海陸風と日変化", "河口の堆積地と海岸線の変化", "鉱石の産地と製錬工場の立地"], "ans": 0, "exp": "東アジアの養殖業者が、魚粉の供給地域P・Qの海洋環境を調べた。両地域の漁場の背景と、東部太平洋でエルニーニョに伴う変化が進んだ場合の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-144", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P・Qの一次エネルギー供給を比較する。表以外のエネルギーは利用せず、輸出・在庫変動はない。自給率の比較とエネルギー構成の説明がともに適切なものを選べ。」", "options": ["エネルギー源の構成と自給", "ヨーロッパ西岸の冬の温和さ", "沈水海岸の形成過程と地域", "理由と具体例を口で伝える"], "ans": 0, "exp": "P・Qの一次エネルギー供給を比較する。表以外のエネルギーは利用せず、輸出・在庫変動はない。自給率の比較とエネルギー構成の説明がともに適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-145", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある島国では発電の大部分を水力・地熱が占める一方、船舶や航空機には輸入石油を使っている。表の読み取りとして適切なものを選べ。」", "options": ["電源構成とエネルギー全体", "低緯度高地と中緯度沿岸", "氷河周辺の堆積物の識別", "対蹠点と最短距離"], "ans": 0, "exp": "ある島国では発電の大部分を水力・地熱が占める一方、船舶や航空機には輸入石油を使っている。表の読み取りとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-146", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図はペルシア湾から日本への航路の一例である。X・Yの名称と、供給地域の分散について適切な組合せを選べ。迂回航路は考えない。」", "options": ["原油輸送の海峡", "盆地の明け方の鉛直気温", "火山列の年代とプレート移動速度", "画像の拡大と地図の情報量"], "ans": 0, "exp": "図はペルシア湾から日本への航路の一例である。X・Yの名称と、供給地域の分散について適切な組合せを選べ。迂回航路は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-147", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「資料のP・Qは天然ガス輸送の方式を表す。方式の対応と立地条件の説明として適切なものを選べ。」", "options": ["天然ガスの輸送体系", "同じ降水量でも異なる乾燥の程度", "南アメリカ低緯度の雨季と植生", "等高線と雨水の流れ"], "ans": 0, "exp": "資料のP・Qは天然ガス輸送の方式を表す。方式の対応と立地条件の説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-148", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北海道北部の風況がよい地域を想定して風力発電を増やす。資料の時間帯に、他地域へ送れる電力の上限を増やさず設備だけを追加した場合の説明として適切なものを選べ。蓄電・他電源との調整は考えない。」", "options": ["風力資源と消費地の位置", "葉の特徴と季節的乾燥", "大陸西岸の降水と季節変化", "交通ネットワークの結節点"], "ans": 0, "exp": "北海道北部の風況がよい地域を想定して風力発電を増やす。資料の時間帯に、他地域へ送れる電力の上限を増やさず設備だけを追加した場合の説明として適切なものを選べ。蓄電・他電源との調整は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-149", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「太陽光以外で賄う電力を「需要−太陽光発電」とする。表の昼から夕方への変化量と、それに対応する方法の組合せとして適切なものを選べ。」", "options": ["太陽光発電と夕方の需給", "森林の土壌断面と物質移動", "モンスーン気候と熱帯雨林気候の区別", "階級区分図と比例記号図"], "ans": 0, "exp": "太陽光以外で賄う電力を「需要−太陽光発電」とする。表の昼から夕方への変化量と、それに対応する方法の組合せとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-150", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「貯水池を持たない二地点P・Qで水力発電を比べる。出力は流量×有効落差に比例し、効率は同じ、雨季・乾季は同じ長さである。年間発電量の比較と地理的な解釈を選べ。」", "options": ["水力発電と季節流量", "月別の土壌水分を追う", "寒冷地域の気温と半球", "沈水海岸の形成過程と地域"], "ans": 0, "exp": "貯水池を持たない二地点P・Qで水力発電を比べる。出力は流量×有効落差に比例し、効率は同じ、雨季・乾季は同じ長さである。年間発電量の比較と地理的な解釈を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-151", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「アイスランドと日本は、プレート境界の型は異なるが地熱の利用が見られる。両国の地下熱源と立地上の共通点を説明したものを選べ。」", "options": ["地下資源とプレート境界", "三地域の雨の成因を比べる", "収束帯の移動と二地点の降水ピーク", "沈み込みと震源の分布"], "ans": 0, "exp": "アイスランドと日本は、プレート境界の型は異なるが地熱の利用が見られる。両国の地下熱源と立地上の共通点を説明したものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-152", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「南米の銅鉱山と東アジアの臨海製錬所を例に、工程を分担する理由を考える。資料の立地に合う説明を選べ。」", "options": ["鉱石処理と輸送の分業", "穀物農場の生産性", "山脈両側の降水量", "雨温図から大陸東西の違いを読む"], "ans": 0, "exp": "南米の銅鉱山と東アジアの臨海製錬所を例に、工程を分担する理由を考える。資料の立地に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-153", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「原料産地Rと市場Mは100km離れる。X工場は原料2tから製品1t、Y工場は原料0.2tに現地で得る水を加えて製品1tを作る。原料・製品の運賃は同じトンキロ当たり料金、水は両地点で同費用で得られる。輸送費だけで有利な立地を選べ。」", "options": ["原料と製品の重量変化", "農地面積と延べ作付面積", "低緯度高地と中緯度沿岸", "気候の季節性と世界の分布"], "ans": 0, "exp": "原料産地Rと市場Mは100km離れる。X工場は原料2tから製品1t、Y工場は原料0.2tに現地で得る水を加えて製品1tを作る。原料・製品の運賃は同じトンキロ当たり料金、水は両地点で同費用で得られる。輸送費だけで有利な立地を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-154", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表の地域P・Qのような分業が成り立つアルミニウム産業について、Qにおける地金製造の立地を説明したものを選べ。P・Qは工程を考えるための地域モデルである。」", "options": ["原料産地と金属生産地", "施設園芸の費用と立地", "東西岸の降水配分を比較する", "冷帯と寒帯を分ける夏の気温"], "ans": 0, "exp": "表の地域P・Qのような分業が成り立つアルミニウム産業について、Qにおける地金製造の立地を説明したものを選べ。P・Qは工程を考えるための地域モデルである。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-155", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「日本の高炉製鉄所の臨海立地を考える。資料の前期から後期への変化に対応する説明を選べ。」", "options": ["製鉄所の立地条件の変化", "熱帯林地域の土地利用", "湿潤地域の土壌断面", "収束帯の移動と二地点の降水ピーク"], "ans": 0, "exp": "日本の高炉製鉄所の臨海立地を考える。資料の前期から後期への変化に対応する説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-156", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「A・B・Cに新設する工場を、半導体前工程、衣服の縫製、セメントの焼成から一つずつ選ぶ。各産業の特徴と資料の適合度が高い組合せはどれか。」", "options": ["三つの工場用地", "食料自給率の二つの指標", "月別の土壌水分を追う", "ヨーロッパ西岸の冬の温和さ"], "ans": 0, "exp": "A・B・Cに新設する工場を、半導体前工程、衣服の縫製、セメントの焼成から一つずつ選ぶ。各産業の特徴と資料の適合度が高い組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-157", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同一品質の商品を同じ市場に納入する。表以外の費用が等しいとき、最も費用が低い拠点とその説明を選べ。1人が1時間に作る数量は、全労働投入を含めた平均である。」", "options": ["海外生産の費用比較", "養殖方式と湾の環境", "斜面と低地の農地利用", "気候区分に使う資料の期間"], "ans": 0, "exp": "同一品質の商品を同じ市場に納入する。表以外の費用が等しいとき、最も費用が低い拠点とその説明を選べ。1人が1時間に作る数量は、全労働投入を含めた平均である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-158", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「自動車産業の集積地域について、立地の利点を説明するものを選べ。資料では同じ部品の大量生産と、異なる企業間の分業を区別する。」", "options": ["企業の集積と分業", "エネルギー源の構成と自給", "二つの酪農地域", "草原の表層と土壌形成"], "ans": 0, "exp": "自動車産業の集積地域について、立地の利点を説明するものを選べ。資料では同じ部品の大量生産と、異なる企業間の分業を区別する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-159", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「部品供給を2社へ分散したが、両社とも港Pから出荷している。目標を「港Pの長期閉鎖でも、少なくとも一方からの部品供給を続けること」としたとき、直接この目標を満たす再編案を選べ。他の港・工場は平常通り稼働する。」", "options": ["供給網の分散と輸送拠点", "天然ガスの輸送体系", "熱帯林地域の土地利用", "三地域の雨の成因を比べる"], "ans": 0, "exp": "部品供給を2社へ分散したが、両社とも港Pから出荷している。目標を「港Pの長期閉鎖でも、少なくとも一方からの部品供給を続けること」としたとき、直接この目標を満たす再編案を選べ。他の港・工場は平常通り稼働する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-160", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「工場跡地Pと内陸用地Qに物流施設を設ける。各用地の施設と交通条件を生かす主な機能として、適切な組合せを選べ。必要な土地利用手続は済んでいる。」", "options": ["都市圏の工場跡地", "水力発電と季節流量", "東部太平洋沿岸の変化", "二つの酪農地域"], "ans": 0, "exp": "工場跡地Pと内陸用地Qに物流施設を設ける。各用地の施設と交通条件を生かす主な機能として、適切な組合せを選べ。必要な土地利用手続は済んでいる。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-161", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある陶磁器産地では原料の一部を輸入するようになった後も、生産が続いている。地域の資料から説明できる継続要因を選べ。」", "options": ["陶磁器産地の継続", "原料と製品の重量変化", "電源構成とエネルギー全体", "圃場と流域の水収支"], "ans": 0, "exp": "ある陶磁器産地では原料の一部を輸入するようになった後も、生産が続いている。地域の資料から説明できる継続要因を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-162", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「データセンターの仕事Xは大量の画像を夜間にまとめて処理し、翌日納品する。仕事Yは大都市の利用者へ即時に応答する。電力・通信の信頼性は同じとすると、表の立地を使い分ける説明として適切なものを選べ。」", "options": ["情報処理施設の立地", "三つの工場用地", "水力発電と季節流量", "エネルギー源の構成と自給"], "ans": 0, "exp": "データセンターの仕事Xは大量の画像を夜間にまとめて処理し、翌日納品する。仕事Yは大都市の利用者へ即時に応答する。電力・通信の信頼性は同じとすると、表の立地を使い分ける説明として適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-163", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「港Aと市場Bは一本道で60km離れ、中間点Mは両端から30kmである。倉庫はA・M・Bのいずれかに置く。毎日、港Aから倉庫へ原料2tを運び、倉庫で現地調達の水を加えて商品3tにし、市場Bへ全量運ぶ。最小の輸送トンキロと立地を選べ。」", "options": ["集荷と配送の拠点配置", "供給網の分散と輸送拠点", "製鉄所の立地条件の変化", "地下資源とプレート境界"], "ans": 0, "exp": "港Aと市場Bは一本道で60km離れ、中間点Mは両端から30kmである。倉庫はA・M・Bのいずれかに置く。毎日、港Aから倉庫へ原料2tを運び、倉庫で現地調達の水を加えて商品3tにし、市場Bへ全量運ぶ。最小の輸送トンキロと立地を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-164", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「コンテナ輸送の発達が港湾と内陸を結ぶ物流に与えた変化として、適切なものを選べ。」", "options": ["貨物輸送の規格化", "情報処理施設の立地", "都市圏の工場跡地", "企業の集積と分業"], "ans": 0, "exp": "コンテナ輸送の発達が港湾と内陸を結ぶ物流に与えた変化として、適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-165", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある国の貨物輸送について、表のトンとトンキロから平均輸送距離を求め、輸送機関の特徴に合う説明を選べ。」", "options": ["輸送量の指標と距離", "工程分業と地域間の結び付き", "中継港と地域経済", "原料調達を含む供給網"], "ans": 0, "exp": "ある国の貨物輸送について、表のトンとトンキロから平均輸送距離を求め、輸送機関の特徴に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-166", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「日本の春に、南半球のチリ産の生鮮ブドウを販売する例を考える。通常の露地栽培の季節と、生鮮品の遠隔地輸送を結び付けた説明として適切なものを選べ。長期貯蔵による季節調整は除く。」", "options": ["果実輸入と季節差", "生産移転と排出統計", "人口密度の分母", "死亡率の地域比較"], "ans": 0, "exp": "日本の春に、南半球のチリ産の生鮮ブドウを販売する例を考える。通常の露地栽培の季節と、生鮮品の遠隔地輸送を結び付けた説明として適切なものを選べ。長期貯蔵による季節調整は除く。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-167", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「銅に依存するP国と、銅以外の輸出も大きいQ国を比較する。銅の数量は両国とも10％減り、単価は20％上昇した。その他の輸出額は不変だった。適切な説明を選べ。」", "options": ["輸出額の変化と産業構造", "出生率・死亡率と人口構造", "四つの時期の人口動態", "都市圏内部の住所移動"], "ans": 0, "exp": "銅に依存するP国と、銅以外の輸出も大きいQ国を比較する。銅の数量は両国とも10％減り、単価は20％上昇した。その他の輸出額は不変だった。適切な説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-168", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「資料の電子機器生産について、産業構造と貿易の読み取りとして適切なものを選べ。」", "options": ["工程分業と地域間の結び付き", "年齢構成と扶養負担", "移動率と年齢構成", "都市と農村の人口変化"], "ans": 0, "exp": "資料の電子機器生産について、産業構造と貿易の読み取りとして適切なものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-169", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「A国が素材40をB国へ輸出し、B国は加工して部品70をC国へ輸出した。C国は完成品100をA国へ輸出した。各工程で他の中間投入はない。3国の国内付加価値の合計と、国境を越えた輸出額の合計を選べ。」", "options": ["加工貿易と付加価値", "四つの時期の人口動態", "避難経路と国境", "都市圏の人口配置の変化"], "ans": 0, "exp": "A国が素材40をB国へ輸出し、B国は加工して部品70をC国へ輸出した。C国は完成品100をA国へ輸出した。各工程で他の中間投入はない。3国の国内付加価値の合計と、国境を越えた輸出額の合計を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-170", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「シンガポールのような中継機能を持つ港Pを想定した。外国港から来て別の外国港へ積み替える貨物が増えたとき、表に合う説明を選べ。」", "options": ["中継港と地域経済", "年齢・男女別の人口", "市街地の連続性", "交通手段と都市の成長"], "ans": 0, "exp": "シンガポールのような中継機能を持つ港Pを想定した。外国港から来て別の外国港へ積み替える貨物が増えたとき、表に合う説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-171", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「P国の消費する商品をP・Qの二国で生産する。後期にP国の工場の一部をQ国へ移した。表の排出量は全てP国向け商品の生産に伴い、輸送時排出は含まない。適切な読み取りを選べ。」", "options": ["生産移転と排出統計", "都市圏内部の住所移動", "都市圏の人口配置の変化", "言語の使用場面と地域差"], "ans": 0, "exp": "P国の消費する商品をP・Qの二国で生産する。後期にP国の工場の一部をQ国へ移した。表の排出量は全てP国向け商品の生産に伴い、輸送時排出は含まない。適切な読み取りを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-172", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「完成品工場X・Yは異なる国にある。XとYの共通部品の供給網を示した資料について、「鉱山Mの停止が両工場へ及ぼす影響」を最も小さくできる案を選べ。新規の鉱山・工場は必要量を生産でき、品質・納期も満たすとする。」", "options": ["原料調達を含む供給網", "国際移動と地域経済", "医療施設の分布と到達圏", "人口推計の二つの経路"], "ans": 0, "exp": "完成品工場X・Yは異なる国にある。XとYの共通部品の供給網を示した資料について、「鉱山Mの停止が両工場へ及ぼす影響」を最も小さくできる案を選べ。新規の鉱山・工場は必要量を生産でき、品質・納期も満たすとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-173", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「大都市郊外のA市について、表の1年間の人口変化を説明する文として正しいものを選べ。境界変更はなく、出生・死亡・転出入以外の増減はない。」", "options": ["地域人口の増減要因", "都市人口の伸び方", "集落形態と生産の場", "河口低地の季節的な水利用"], "ans": 0, "exp": "大都市郊外のA市について、表の1年間の人口変化を説明する文として正しいものを選べ。境界変更はなく、出生・死亡・転出入以外の増減はない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-174", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「人口移動の影響が小さい4地域を比べる。自然増加率が年1.5％で、人口転換に伴って生産年齢人口に対する年少人口の比重が低下している地域はどれか。出生率・死亡率の分母はその年の年央人口である。」", "options": ["出生率・死亡率と人口構造", "市街地の連続性", "東南アジアの文化分布", "南アジアの作物と季節"], "ans": 0, "exp": "人口移動の影響が小さい4地域を比べる。自然増加率が年1.5％で、人口転換に伴って生産年齢人口に対する年少人口の比重が低下している地域はどれか。出生率・死亡率の分母はその年の年央人口である。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-175", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「日本の架空の2市について、総面積と可住地面積（総面積から林野・主要湖沼を除いた面積）で人口密度を比べる。資料に基づく説明として正しいものはどれか。」", "options": ["人口密度の分母", "地区機能を指標から読む", "季節の移動と生活文化", "西アジアの気候と農業の差"], "ans": 0, "exp": "日本の架空の2市について、総面積と可住地面積（総面積から林野・主要湖沼を除いた面積）で人口密度を比べる。資料に基づく説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-176", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「大都市のA区と山間部のB町の10年間の変化である。65歳以上人口の実数と、高齢化率の組合せから正しく説明したものはどれか。」", "options": ["高齢人口の変化を比べる", "都市の規模分布", "東アジアの工程間分業", "西アフリカの換金作物"], "ans": 0, "exp": "大都市のA区と山間部のB町の10年間の変化である。65歳以上人口の実数と、高齢化率の組合せから正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-177", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「出生率低下後の人口ボーナスが生じやすい年齢構成にあり、従属人口指数が最も低い地域はどれか。就業率の違いは考えない。」", "options": ["年齢構成と扶養負担", "距離と時間の隔たり", "東南アジアの農産物と地域", "カナダの資源と製錬"], "ans": 0, "exp": "出生率低下後の人口ボーナスが生じやすい年齢構成にあり、従属人口指数が最も低い地域はどれか。就業率の違いは考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-178", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「A国とB国の期間合計特殊出生率はともに1.6だが、人口1,000人当たりの年間出生数はA国の方が多い。この違いが生じうる理由を、指標の定義に照らして選べ。」", "options": ["二つの出生指標", "交通手段と都市の成長", "南アジアの作物と季節", "豪州の鉱産資源と港湾"], "ans": 0, "exp": "A国とB国の期間合計特殊出生率はともに1.6だが、人口1,000人当たりの年間出生数はA国の方が多い。この違いが生じうる理由を、指標の定義に照らして選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-179", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「2地域で年齢別死亡率は等しく、0〜64歳が年2‰、65歳以上が年40‰である。表の年齢構成を用いて、粗死亡率とその解釈の正しい組合せを選べ。」", "options": ["死亡率の地域比較", "集落形態と生産の場", "中央アジアの流域と湖", "南九州の地形と畜産"], "ans": 0, "exp": "2地域で年齢別死亡率は等しく、0〜64歳が年2‰、65歳以上が年40‰である。表の年齢構成を用いて、粗死亡率とその解釈の正しい組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-180", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「人口移動のない地域の長期変化を、人口転換の一般的な過程として並べる。表の四つの時期の順序と、自然増加率が最大となる時期の組合せはどれか。」", "options": ["四つの時期の人口動態", "言語圏と国境", "西ヨーロッパの園芸農業", "低地の断面と水面"], "ans": 0, "exp": "人口移動のない地域の長期変化を、人口転換の一般的な過程として並べる。表の四つの時期の順序と、自然増加率が最大となる時期の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-181", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「A国では移民が少なく、合計特殊出生率が低下した後も出生数が死亡数を上回っている。表の資料と人口構造の知識から、当面の人口増加を説明する文はどれか。」", "options": ["出生率低下後の人口", "主食となる作物と環境", "赤道周辺の高地農業", "積雪期と噴火後の降雨"], "ans": 0, "exp": "A国では移民が少なく、合計特殊出生率が低下した後も出生数が死亡数を上回っている。表の資料と人口構造の知識から、当面の人口増加を説明する文はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-182", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「山間部のX町では、ある時点の10〜19歳人口が2,000人、その10年後の20〜29歳人口が1,250人だった。この集団の10年間の死亡は50人である。境界変更はない。純移動と、変化に対応する人口ピラミッドの特徴の組合せはどれか。」", "options": ["年齢集団の追跡", "地域格差を集計で読む", "米国の都市の位置・気候・産業", "都市気温の比較地点"], "ans": 0, "exp": "山間部のX町では、ある時点の10〜19歳人口が2,000人、その10年後の20〜29歳人口が1,250人だった。この集団の10年間の死亡は50人である。境界変更はない。純移動と、変化に対応する人口ピラミッドの特徴の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-183", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図はペルシア湾岸の産業都市を参考に作った架空都市の人口である。過去30年間に戦争や大規模災害による男女別死亡率の大きな差はなかったとする。都市の人口構造を説明する要因として最も整合するものはどれか。」", "options": ["年齢・男女別の人口", "住宅地の世代と移動", "南米の自然地域と農業", "回収容器と地域の条件"], "ans": 0, "exp": "図はペルシア湾岸の産業都市を参考に作った架空都市の人口である。過去30年間に戦争や大規模災害による男女別死亡率の大きな差はなかったとする。都市の人口構造を説明する要因として最も整合するものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-184", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「山村Aの10年間の人口変化である。この間、65歳未満の人口では転出が転入を大きく上回った。表とこの条件から説明できることはどれか。」", "options": ["山村の年齢構成", "東アジアの工程間分業", "太平洋の島の成り立ちと生活", "沿岸の漂着物と季節"], "ans": 0, "exp": "山村Aの10年間の人口変化である。この間、65歳未満の人口では転出が転入を大きく上回った。表とこの条件から説明できることはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-185", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「A・B両市の年初人口と1年間の移動である。自然増減はなく、転入超過数の年齢内訳も表のとおりである。転入超過率と年齢構成への影響を正しく説明したものはどれか。」", "options": ["移動率と年齢構成", "河口低地の季節的な水利用", "南九州の地形と畜産", "上流施設と海岸の変化"], "ans": 0, "exp": "A・B両市の年初人口と1年間の移動である。自然増減はなく、転入超過数の年齢内訳も表のとおりである。転入超過率と年齢構成への影響を正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-186", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「都心地区Cと郊外地区Sの間の住所移動を比べる。両地区の範囲は固定し、Cは行政上の中心市全体ではなく、業務集積を含む中心部に限定する。表以外の移動はない。各期間に卓越する現象の組合せを選べ。」", "options": ["都市圏内部の住所移動", "海峡と中継貿易", "造成地の履歴と地盤", "集計地図で見える範囲"], "ans": 0, "exp": "都心地区Cと郊外地区Sの間の住所移動を比べる。両地区の範囲は固定し、Cは行政上の中心市全体ではなく、業務集積を含む中心部に限定する。表以外の移動はない。各期間に卓越する現象の組合せを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-187", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「地方県からの転出を年齢層別に比べる。人数が多い層ではなく転出率が最も高い層を特定し、その層で生じやすい移動理由と組み合わせよ。」", "options": ["年齢別にみる転出", "デルタ国家の輸出工業", "土地被覆と貯留施設", "人口・都市・生活文化"], "ans": 0, "exp": "地方県からの転出を年齢層別に比べる。人数が多い層ではなく転出率が最も高い層を特定し、その層で生じやすい移動理由と組み合わせよ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-188", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「農村Rで農地の細分化により一戸当たりの農業所得が低下した。同時に都市Sで工場求人が増え、R出身者による住居・就職の紹介網が形成された。RからSへの移住を、押し出す要因・引き付ける要因・移動を助ける要因に対応させたものはどれか。」", "options": ["移住を生む条件", "国境を越える流域の利用", "異なる浸水想定の重ね合わせ", "地図は凡例・方位・縮尺"], "ans": 0, "exp": "農村Rで農地の細分化により一戸当たりの農業所得が低下した。同時に都市Sで工場求人が増え、R出身者による住居・就職の紹介網が形成された。RからSへの移住を、押し出す要因・引き付ける要因・移動を助ける要因に対応させたものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-189", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「南アジアの農村Rから湾岸諸国への労働移動を考える。出国前後の20〜39歳人口の性比と、家族への送金の性質を正しく組み合わせたものはどれか。表以外の人口増減や加齢は考えない。」", "options": ["国際移動と地域経済", "中央アジアの流域と湖", "時刻による都市の気温差", "鉱石の産地と製錬工場の立地"], "ans": 0, "exp": "南アジアの農村Rから湾岸諸国への労働移動を考える。出国前後の20〜39歳人口の性比と、家族への送金の性質を正しく組み合わせたものはどれか。表以外の人口増減や加齢は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-190", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「紛争によってA国の都市Xから住居を追われた人々が、経路PではA国内の都市Yへ、経路Qでは国境を越えてB国へ移った。Qの人々はB国で庇護を申請し、まだ審査結果を受けていない。統計上の区分として適切な組合せはどれか。」", "options": ["避難経路と国境", "欧州の河川と海港", "食料の生産地と輸送", "理由と具体例を口で伝える"], "ans": 0, "exp": "紛争によってA国の都市Xから住居を追われた人々が、経路PではA国内の都市Yへ、経路Qでは国境を越えてB国へ移った。Qの人々はB国で庇護を申請し、まだ審査結果を受けていない。統計上の区分として適切な組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-191", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「フランス側の住宅地Rからルクセンブルク側の都市Cへ通勤する架空の就業者を考える。住居はRにあり、毎日帰宅する。統計上、居住地と従業地を別々に集計するときの説明として正しいものはどれか。」", "options": ["国境を越える通勤", "北大西洋の島国のエネルギー", "乾燥地域の灌漑と取水", "対蹠点と最短距離"], "ans": 0, "exp": "フランス側の住宅地Rからルクセンブルク側の都市Cへ通勤する架空の就業者を考える。住居はRにあり、毎日帰宅する。統計上、居住地と従業地を別々に集計するときの説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-192", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「都市地域の区分を固定して10年間を比べた。現在の都市人口率が高い国と、都市人口の増加率が高い国の組合せはどれか。」", "options": ["都市人口の伸び方", "西アフリカの換金作物", "沿岸の漂着物と季節", "画像の拡大と地図の情報量"], "ans": 0, "exp": "都市地域の区分を固定して10年間を比べた。現在の都市人口率が高い国と、都市人口の増加率が高い国の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-193", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「都市・農村の区分を固定したA国の人口である。都市人口率の変化と農村人口の変化を正しく説明したものはどれか。」", "options": ["都市と農村の人口変化", "アフリカの降水と植生", "生活施設への到達しやすさ", "等高線と雨水の流れ"], "ans": 0, "exp": "都市・農村の区分を固定したA国の人口である。都市人口率の変化と農村人口の変化を正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-194", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある国で都市人口が1年間に100万人から130万人へ増えた。このうち20万人は居住地を変えず、集落の区分変更により都市人口へ移された。都市の自然増加は4万人で、残りは農村から都市への転入超過である。移住と都市人口増加の関係として正しいものはどれか。」", "options": ["都市区域の変更", "米国の都市の位置・気候・産業", "集計区域と人口密度", "交通ネットワークの結節点"], "ans": 0, "exp": "ある国で都市人口が1年間に100万人から130万人へ増えた。このうち20万人は居住地を変えず、集落の区分変更により都市人口へ移された。都市の自然増加は4万人で、残りは農村から都市への転入超過である。移住と都市人口増加の関係として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-195", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のA市でDIDの原則を適用する。人口密度4,000人/km²以上の単位区が辺を共有して連続し、合計人口5,000人以上なら一つのDIDとする。施設用地などの特例はない。該当する区域はどれか。」", "options": ["市街地の連続性", "ブラジルの地域差", "空中写真の季節と農地", "階級区分図と比例記号図"], "ans": 0, "exp": "図のA市でDIDの原則を適用する。人口密度4,000人/km²以上の単位区が辺を共有して連続し、合計人口5,000人以上なら一つのDIDとする。施設用地などの特例はない。該当する区域はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-196", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ都市について、行政市域A、連続市街地B、通勤圏Cの常住人口を集計した。三つの区域はA⊂B⊂Cで、調査時点は同じである。都市の範囲と集計人口について正しく説明したものはどれか。」", "options": ["都市を数える範囲", "南米の資源輸出と価格", "資源と産業", "沈水海岸の形成過程と地域"], "ans": 0, "exp": "同じ都市について、行政市域A、連続市街地B、通勤圏Cの常住人口を集計した。三つの区域はA⊂B⊂Cで、調査時点は同じである。都市の範囲と集計人口について正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-197", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ都市圏にあるA・B両市の昼間人口を、夜間人口−流出通勤通学者＋流入通勤通学者で求める。昼夜間人口比率と都市の役割の組合せとして正しいものはどれか。」", "options": ["昼夜の人口と都市機能", "ニュージーランドの降水と牧畜", "共通テスト地理の無料問題300問", "沈み込みと震源の分布"], "ans": 0, "exp": "同じ都市圏にあるA・B両市の昼間人口を、夜間人口−流出通勤通学者＋流入通勤通学者で求める。昼夜間人口比率と都市の役割の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-198", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ大都市圏の地区P・Q・Rを、中心業務地区、郊外住宅地、外縁の工業地区に一つずつ対応させる。表から判断した組合せはどれか。」", "options": ["地区機能を指標から読む", "北海道の畑作地域", "雨温図は気温から降水へ", "雨温図から大陸東西の違いを読む"], "ans": 0, "exp": "同じ大都市圏の地区P・Q・Rを、中心業務地区、郊外住宅地、外縁の工業地区に一つずつ対応させる。表から判断した組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-199", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ都市の4地区で土地利用を調べた。地代負担力と接近性の関係を踏まえ、中心業務地区に対応するものを選べ。」", "options": ["都市内の土地利用", "南九州の地形と畜産", "鉱石の産地と製錬工場の立地", "気候の季節性と世界の分布"], "ans": 0, "exp": "同じ都市の4地区で土地利用を調べた。地代負担力と接近性の関係を踏まえ、中心業務地区に対応するものを選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-200", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図は固定した三区域の人口増減率である。第2期には中心部で工場跡地の集合住宅への転換が進んだ。第1期と第2期の変化を説明する組合せはどれか。」", "options": ["都市圏の人口配置の変化", "低地の土地利用と浸水", "条件に沿って短く説明する", "冷帯と寒帯を分ける夏の気温"], "ans": 0, "exp": "図は固定した三区域の人口増減率である。第2期には中心部で工場跡地の集合住宅への転換が進んだ。第1期と第2期の変化を説明する組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-201", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の4都市が主要都市である架空国Xでは、Aに中央政府機関、主要金融機関、全国企業の本社が集中している。都市規模分布の型と、順位・規模法則（ランクサイズルール）の理想的な分布との比較として正しいものはどれか。」", "options": ["都市の規模分布", "湾内外の津波記録", "地理総合・地理探究の出題範囲と過去問を確認する", "収束帯の移動と二地点の降水ピーク"], "ans": 0, "exp": "図の4都市が主要都市である架空国Xでは、Aに中央政府機関、主要金融機関、全国企業の本社が集中している。都市規模分布の型と、順位・規模法則（ランクサイズルール）の理想的な分布との比較として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-202", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ人口のP・Q地区を比べる。Qの道路延長はPの1.8倍であり、地形・道路幅などの条件と道路1km当たりの年間維持費は等しい。新しい商業・業務の中心はなく、図の黒い区画は住宅地である。Qの都市形態と住民1人当たり道路維持費の組合せはどれか。」", "options": ["市街地の広がりと交通", "都市化と流出の時間変化", "緯経線メッシュと人口密度", "ヨーロッパ西岸の冬の温和さ"], "ans": 0, "exp": "同じ人口のP・Q地区を比べる。Qの道路延長はPの1.8倍であり、地形・道路幅などの条件と道路1km当たりの年間維持費は等しい。新しい商業・業務の中心はなく、図の黒い区画は住宅地である。Qの都市形態と住民1人当たり道路維持費の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-203", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「人口減少都市の再編案を比べる。コンパクト・プラス・ネットワークの考え方に合い、表の目標「日常生活拠点の維持」と「公共交通への接近性向上」の両方に対応する案はどれか。」", "options": ["生活拠点の再配置", "斜面・谷の災害", "地図面積と集落密度", "気候区分に使う資料の期間"], "ans": 0, "exp": "人口減少都市の再編案を比べる。コンパクト・プラス・ネットワークの考え方に合い、表の目標「日常生活拠点の維持」と「公共交通への接近性向上」の両方に対応する案はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-204", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「中心都市Cへの通勤について、A・B住宅地からの時間距離を比べる。駅までの徒歩と平均待ち時間を含め、平均待ち時間は運行間隔の半分とする。資料と鉄道の時間短縮効果を正しく説明したものはどれか。」", "options": ["距離と時間の隔たり", "異なる浸水想定の重ね合わせ", "メルカトル図法の面積補正", "草原の表層と土壌形成"], "ans": 0, "exp": "中心都市Cへの通勤について、A・B住宅地からの時間距離を比べる。駅までの徒歩と平均待ち時間を含め、平均待ち時間は運行間隔の半分とする。資料と鉄道の時間短縮効果を正しく説明したものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-205", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「医療施設の配置を検討する。A・B地区の人口は同じだが、表の到達圏に差がある。非運転者のアクセシビリティを測る指標と、自動車利用者との到達可能性の差が大きい地区の組合せはどれか。」", "options": ["医療施設の分布と到達圏", "交通網と共通する途絶地点", "断面図の視通と鉛直倍率", "三地域の雨の成因を比べる"], "ans": 0, "exp": "医療施設の配置を検討する。A・B地区の人口は同じだが、表の到達圏に差がある。非運転者のアクセシビリティを測る指標と、自動車利用者との到達可能性の差が大きい地区の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-206", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表は居住地を行、勤務先を列にしたOD表である。Cは中心市、S・Tは周辺市で、就業者は全員この3市内で居住・勤務する。SとTの都市機能を比較した説明として正しいものはどれか。」", "options": ["通勤の地域間結合", "都市気温の比較地点", "交通ネットワークの結節点", "二つの酪農地域"], "ans": 0, "exp": "表は居住地を行、勤務先を列にしたOD表である。Cは中心市、S・Tは周辺市で、就業者は全員この3市内で居住・勤務する。SとTの都市機能を比較した説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-207", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある都市では通勤者数と自動車分担率が表のように変化した。同期間に鉄道沿線への居住誘導が進んだ。資料から確実にいえる交通量の変化と、追加確認が必要な事項の組合せはどれか。」", "options": ["交通手段と都市の成長", "電源構成と総排出量", "標高データの解像度と集約方法", "圃場と流域の水収支"], "ans": 0, "exp": "ある都市では通勤者数と自動車分担率が表のように変化した。同期間に鉄道沿線への居住誘導が進んだ。資料から確実にいえる交通量の変化と、追加確認が必要な事項の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-208", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ広さの土地について、業務・住宅・農業の支払地代が都心からの距離で図表のように変わる。各用途が土地をめぐって競争し、用途規制などはないとする。付け値地代の考え方によれば、距離0km・4km・6kmで成立する用途の順序はどれか。」", "options": ["地代と土地利用", "熱帯の斜面耕地", "氾濫原の微地形と堆積物", "エネルギー源の構成と自給"], "ans": 0, "exp": "同じ広さの土地について、業務・住宅・農業の支払地代が都心からの距離で図表のように変わる。各用途が土地をめぐって競争し、用途規制などはないとする。付け値地代の考え方によれば、距離0km・4km・6kmで成立する用途の順序はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-209", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ平野内の店舗X・Yを比べる。YはXより専門設備や展示面積が大きく、年間固定費も高い。資料と中心地理論の一般的な関係を踏まえ、YでXより大きくなると考えられる「需要の閾値」と「財の到達範囲」の組合せを選べ。所得・人口密度・交通条件は同じとする。」", "options": ["購買行動と中心地の階層", "乾燥地域の灌漑と取水", "砂の移動と海岸堆積地形", "地下資源とプレート境界"], "ans": 0, "exp": "同じ平野内の店舗X・Yを比べる。YはXより専門設備や展示面積が大きく、年間固定費も高い。資料と中心地理論の一般的な関係を踏まえ、YでXより大きくなると考えられる「需要の閾値」と「財の到達範囲」の組合せを選べ。所得・人口密度・交通条件は同じとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-210", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のP・Qを、道路沿いに家が並ぶ形態と、砺波平野で知られる形態に対応させる。Qの家屋周辺には各戸の耕地がまとまる。集落形態とQの特徴の組合せはどれか。」", "options": ["集落形態と生産の場", "乾燥地域の植生変化", "海底拡大と海洋地殻の年代", "企業の集積と分業"], "ans": 0, "exp": "図のP・Qを、道路沿いに家が並ぶ形態と、砺波平野で知られる形態に対応させる。Qの家屋周辺には各戸の耕地がまとまる。集落形態とQの特徴の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-211", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「山間地域で若年層の転出が続き、表のように人口と商業・交通が変化した。地域の縮小が生活サービスへ及ぼす作用を説明したものとして最も整合するのはどれか。」", "options": ["山間地域のサービス変化", "国際河川の季節配分", "地形の形成作用の対応", "貨物の価値と輸送手段"], "ans": 0, "exp": "山間地域で若年層の転出が続き、表のように人口と商業・交通が変化 q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「アルプスのある谷で、牧畜に従事する家族の一部が、夏に家畜と高地の草地へ移り、冬は谷底の集落へ戻る。耕地と永住用住宅は谷底にあり、毎年ほぼ同じ場所を利用する。この形態と自然条件の説明の組合せはどれか。」", "options": ["季節の移動と生活文化", "地図は凡例・方位・縮尺", "草原の表層と土壌形成", "河口低地の季節的な水利用"], "ans": 0, "exp": "アルプスのある谷で、牧畜に従事する家族の一部が、夏に家畜と高地の草地へ移り、冬は谷底の集落へ戻る。耕地と永住用住宅は谷底にあり、毎年ほぼ同じ場所を利用する。この形態と自然条件の説明の組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-221", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「A町の将来人口を推計した。基準人口、年齢別出生率、年齢別死亡率は両案で同じだが、案Yでは20〜39歳の男女の転入超過が案Xより多いと仮定した。転入した女性にも同じ年齢別出生率を適用する。表の差を説明するものはどれか。」", "options": ["人口推計の二つの経路", "共通テスト地理は「位置・しくみ・資料」をつなげて復習する", "二つの半球の日射の季節", "南アジアの作物と季節"], "ans": 0, "exp": "A町の将来人口を推計した。基準人口、年齢別出生率、年齢別死亡率は両案で同じだが、案Yでは20〜39歳の男女の転入超過が案Xより多いと仮定した。転入した女性にも同じ年齢別出生率を適用する。表の差を説明するものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-222", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「同じ大都市圏の住宅地A・Bについて、10年前の55〜64歳に当たる出生世代の純移動を調べる。表の死亡数は、この出生世代について期間中に各地区内で記録された人数である。境界変更・集計漏れはない。住宅地形成の情報も踏まえて、正しい説明を選べ。」", "options": ["住宅地の世代と移動", "降水の季節差を風帯から説明する", "穀物農場の生産性", "西アジアの気候と農業の差"], "ans": 0, "exp": "同じ大都市圏の住宅地A・Bについて、10年前の55〜64歳に当たる出生世代の純移動を調べる。表の死亡数は、この出生世代について期間中に各地区内で記録された人数である。境界変更・集計漏れはない。住宅地形成の情報も踏まえて、正しい説明を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-223", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図は中国のある河川沿いに位置する3都市の東西関係を示す。河川名と、PからRへ大量の貨物を運ぶ際の地域的特徴の組合せとして正しいものはどれか。」", "options": ["中国の河川と都市の位置", "緯度が近い地域の降水差", "野菜産地の出荷時期", "西アフリカの換金作物"], "ans": 0, "exp": "図は中国のある河川沿いに位置する3都市の東西関係を示す。河川名と、PからRへ大量の貨物を運ぶ際の地域的特徴の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-224", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「中国東部の平野部にあるP・Qのモデル資料を示す。自然条件と伝統的な主要穀物の組合せとして適切なのはどれか。」", "options": ["中国東部の農業地域比較", "条件に沿って短く説明する", "乾燥地のかんがいと土壌", "カナダの資源と製錬"], "ans": 0, "exp": "中国東部の平野部にあるP・Qのモデル資料を示す。自然条件と伝統的な主要穀物の組合せとして適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-225", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ある電子機器の生産ネットワークを表に示す。貿易統計と立地の読み方として正しいものはどれか。」", "options": ["東アジアの工程間分業", "資料は読める。でも、答案や面接でうまく説明できない。", "養殖方式と湾の環境", "豪州の鉱産資源と港湾"], "ans": 0, "exp": "ある電子機器の生産ネットワークを表に示す。貿易統計と立地の読み方として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-226", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「中国の沿海部Pと内陸部Qを想定した資料から、工場の一部がPからQへ移る条件を考えた。資料と地域的背景に合う説明はどれか。」", "options": ["中国の沿海部と内陸部", "公共・政治経済、日本史とつなげて学ぶ", "原油輸送の海峡", "南九州の地形と畜産"], "ans": 0, "exp": "中国の沿海部Pと内陸部Qを想定した資料から、工場の一部がPからQへ移る条件を考えた。資料と地域的背景に合う説明はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-227", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「モンゴルの乾燥した草原で、家族と家畜群が季節ごとに水場や牧草の状態を見て滞在地を変える事例を考える。この生業に該当するものはどれか。」", "options": ["内陸アジアの牧畜", "対蹠点と最短距離", "地下資源とプレート境界", "低地の断面と水面"], "ans": 0, "exp": "モンゴルの乾燥した草原で、家族と家畜群が季節ごとに水場や牧草の状態を見て滞在地を変える事例を考える。この生業に該当するものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-228", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「メコンデルタ沿岸部の資料に基づき、米作への塩分の影響が大きくなりやすい時期と背景を選べ。」", "options": ["河口低地の季節的な水利用", "日付変更線と標準時", "三つの工場用地", "積雪期と噴火後の降雨"], "ans": 0, "exp": "メコンデルタ沿岸部の資料に基づき、米作への塩分の影響が大きくなりやすい時期と背景を選べ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-229", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の島Xでは、火山周辺の人口稠密な地域に灌漑水田や段々畑が見られる。Xと、その自然条件の組合せとして正しいものはどれか。」", "options": ["島嶼部の地形と農業", "地図面積と集落密度", "陶磁器産地の継続", "都市気温の比較地点"], "ans": 0, "exp": "図の島Xでは、火山周辺の人口稠密な地域に灌漑水田や段々畑が見られる。Xと、その自然条件の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-230", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のP・Q・Rはタイ、マレーシア、ベトナムのいずれかである。地域の位置と生産の特徴を合わせた対応として正しいものはどれか。」", "options": ["東南アジアの農産物と地域", "用途に応じた投影法", "輸送量の指標と距離", "回収容器と地域の条件"], "ans": 0, "exp": "表のP・Q・Rはタイ、マレーシア、ベトナムのいずれかである。地域の位置と生産の特徴を合わせた対応として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-231", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「シンガポールでは、国内で原油を大量に採掘していなくても石油精製・石油製品の輸出が発達している。その立地を説明する組合せはどれか。」", "options": ["海峡と中継貿易", "等高線・縮尺・斜面方位", "中継港と地域経済", "沿岸の漂着物と季節"], "ans": 0, "exp": "シンガポールでは、国内で原油を大量に採掘していなくても石油精製・石油製品の輸出が発達している。その立地を説明する組合せはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-232", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表はマレーシアを想定した財輸出の学習用モデル値である。同国の代表的な農産原料の組合せと、新時点の一次産品輸出額を正しく組み合わせたものはどれか。」", "options": ["東南アジアの一次産品と工業", "等高線の標高範囲と比高", "人口密度の分母", "上流施設と海岸の変化"], "ans": 0, "exp": "表はマレーシアを想定した財輸出の学習用モデル値である。同国の代表的な農産原料の組合せと、新時点の一次産品輸出額を正しく組み合わせたものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-233", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のP・Qはインドのベンガルールとコルカタのいずれかである。都市と産業立地の説明の組合せとして正しいものはどれか。」", "options": ["南アジアの都市と産業", "分水界を越える導水", "四つの時期の人口動態", "集計地図で見える範囲"], "ans": 0, "exp": "表のP・Qはインドのベンガルールとコルカタのいずれかである。都市と産業立地の説明の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-234", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ガンジス川・ブラマプトラ川の下流に位置する国の輸出工場を調べたところ、衣類の輸出が多く、綿花の多くを輸入していた。国名と工業の性格の組合せとして正しいものはどれか。」", "options": ["デルタ国家の輸出工業", "交通ネットワークの結節点", "移動率と年齢構成", "人口・都市・生活文化"], "ans": 0, "exp": "ガンジス川・ブラマプトラ川の下流に位置する国の輸出工場を調べたところ、衣類の輸出が多く、綿花の多くを輸入していた。国名と工業の性格の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-235", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「北インドの平野で、雨季に稲、冬から春の比較的乾燥した時期に小麦を栽培するモデルを示す。この二毛作を支える条件として適切なのはどれか。」", "options": ["南アジアの作物と季節", "土地利用の遷移と都市化", "避難経路と国境", "地図は凡例・方位・縮尺"], "ans": 0, "exp": "北インドの平野で、雨季に稲、冬から春の比較的乾燥した時期に小麦を栽培するモデルを示す。この二毛作を支える条件として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-236", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ネパールの工場（北緯28度・東経85度付近）が、港P・Qから原料を輸入する。P・Qはコルカタと天津のいずれかである。位置資料と費用を合わせ、最も安い経路の港名と1t当たり費用を選べ。両経路とも利用可能で、表以外の費用は考えない。」", "options": ["ヒマラヤ周辺の輸送条件", "座標参照系と位置のずれ", "市街地の連続性", "鉱石の産地と製錬工場の立地"], "ans": 0, "exp": "ネパールの工場（北緯28度・東経85度付近）が、港P・Qから原料を輸入する。P・Qはコルカタと天津のいずれかである。位置資料と費用を合わせ、最も安い経路の港名と1t当たり費用を選べ。両経路とも利用可能で、表以外の費用は考えない。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-237", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ガンジス川の支流が流れるネパールの山地で、雨季の水を貯め乾季に放流する貯水池を考える。下流の平野・デルタに対する影響として適切な組合せはどれか。流域の降水量は同じで、貯水池に土砂がたまり、排砂は行わないとする。」", "options": ["国境を越える流域の利用", "河口の堆積地と海岸線の変化", "都市圏の人口配置の変化", "理由と具体例を口で伝える"], "ans": 0, "exp": "ガンジス川の支流が流れるネパールの山地で、雨季の水を貯め乾季に放流する貯水池を考える。下流の平野・デルタに対する影響として適切な組合せはどれか。流域の降水量は同じで、貯水池に土砂がたまり、排砂は行わないとする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-238", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「サウジアラビア内陸で、灌漑農業の水源となる「化石地下水」の利用を調べている。この水を現在の降水で補給される浅い地下水と区別する説明として正しいものはどれか。」", "options": ["乾燥地域の地下水の更新速度", "蛇行河川の侵食と流路変化", "医療施設の分布と到達圏", "対蹠点と最短距離"], "ans": 0, "exp": "サウジアラビア内陸で、灌漑農業の水源となる「化石地下水」の利用を調べている。この水を現在の降水で補給される浅い地下水と区別する説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-239", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図の海域Pから、日本へ原油を運ぶ船がマラッカ海峡経由の航路を取る。Pの出口Xと、Xを出た後に通る海域の組合せとして正しいものはどれか。」", "options": ["西アジアの海上輸送路", "砂の移動と海岸堆積地形", "集落形態と生産の場", "画像の拡大と地図の情報量"], "ans": 0, "exp": "図の海域Pから、日本へ原油を運ぶ船がマラッカ海峡経由の航路を取る。Pの出口Xと、Xを出た後に通る海域の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-240", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「中央アジアの湖Pでは、流入河川からの灌漑取水が拡大した時期に水面が大きく縮小した。湖名と、蒸発が続いて湖水量が減る際の塩分濃度の変化の組合せを選べ。湖に溶ける塩類の総量は同じとして考える。」", "options": ["中央アジアの流域と湖", "谷の断面と支谷の高さ", "東南アジアの文化分布", "等高線と雨水の流れ"], "ans": 0, "exp": "中央アジアの湖Pでは、流入河川からの灌漑取水が拡大した時期に水面が大きく縮小した。湖名と、蒸発が続いて湖水量が減る際の塩分濃度の変化の組合せを選べ。湖に溶ける塩類の総量は同じとして考える。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-241", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「中央アジアの国Pはカスピ海に面し、中国と陸上国境を接する。原油の産出があり、中国西部へパイプラインで送る事例が見られる。Pはどの国か。」", "options": ["中央アジアの交通と資源", "沈み込みと震源の分布", "季節の移動と生活文化", "交通ネットワークの結節点"], "ans": 0, "exp": "中央アジアの国Pはカスピ海に面し、中国と陸上国境を接する。原油の産出があり、中国西部へパイプラインで送る事例が見られる。Pはどの国か。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-242", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のP・Qはトルコの地中海沿岸とアラビア半島の内陸部を想定したモデルである。地域と農業の特徴の対応として適切なのはどれか。」", "options": ["西アジアの気候と農業の差", "火山列の年代とプレート移動速度", "東アジアの工程間分業", "階級区分図と比例記号図"], "ans": 0, "exp": "表のP・Qはトルコの地中海沿岸とアラビア半島の内陸部を想定したモデルである。地域と農業の特徴の対応として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-243", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図のPは北海沿岸の大港湾であり、河川Rを通じてドイツ内陸の工業地域と結び付く。PとRの組合せとして正しいものはどれか。」", "options": ["欧州の河川と海港", "河川沿いの堆積物と土地利用", "東南アジアの農産物と地域", "沈水海岸の形成過程と地域"], "ans": 0, "exp": "図のPは北海沿岸の大港湾であり、河川Rを通じてドイツ内陸の工業地域と結び付く。PとRの組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-244", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ドイツとその東側に位置するチェコ・ポーランドの工場間で、自動車部品を繰り返し運ぶ事例を考える。資料の変化が生産網に与える影響として適切なのはどれか。」", "options": ["欧州の国際分業と国境", "高温多雨な低地の自然環境", "南アジアの作物と季節", "沈み込みと震源の分布"], "ans": 0, "exp": "ドイツとその東側に位置するチェコ・ポーランドの工場間で、自動車部品を繰り返し運ぶ事例を考える。資料の変化が生産網に与える影響として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-245", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「オランダの施設園芸は、高緯度で冬の日射が少ないという条件の下でも輸出競争力を持つ。説明として適切なのはどれか。」", "options": ["西ヨーロッパの園芸農業", "夏季降水割合と東アジアの季節風", "中央アジアの流域と湖", "雨温図から大陸東西の違いを読む"], "ans": 0, "exp": "オランダの施設園芸は、高緯度で冬の日射が少ないという条件の下でも輸出競争力を持つ。説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-246", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「アイスランドでは地熱・水力を利用し、アルミニウム製錬も行われる。この地域の自然・資源・工業を結ぶ説明として正しいものはどれか。」", "options": ["北大西洋の島国のエネルギー", "少雨地域の位置と大気循環", "西ヨーロッパの園芸農業", "気候の季節性と世界の分布"], "ans": 0, "exp": "アイスランドでは地熱・水力を利用し、アルミニウム製錬も行われる。この地域の自然・資源・工業を結ぶ説明として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-247", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のP・Qはノルウェーとスウェーデンのいずれかである。国の対応と背景として適切なのはどれか。」", "options": ["北欧の資源と地形", "モンスーン気候と熱帯雨林気候の区別", "西アフリカの内陸国と港", "冷帯と寒帯を分ける夏の気温"], "ans": 0, "exp": "表のP・Qはノルウェーとスウェーデンのいずれかである。国の対応と背景として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-248", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「エジプトを考えるためのモデル資料である。国土全体の人口密度と、人口が集中する区域Aの人口密度の組合せとして正しいものはどれか。」", "options": ["乾燥国の人口と耕地", "冷帯と寒帯を分ける夏の気温", "カナダの資源と製錬", "収束帯の移動と二地点の降水ピーク"], "ans": 0, "exp": "エジプトを考えるためのモデル資料である。国土全体の人口密度と、人口が集中する区域Aの人口密度の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-249", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ガーナ南部の高温湿潤な地域で、主要な輸出用樹木作物Xの種子を加工するモデルである。Xと、加工後の原料費控除額の組合せとして適切なのはどれか。原料以外の費用は未計上とする。」", "options": ["西アフリカの換金作物", "低緯度高地の気候を分解する", "南米の資源輸出と価格", "ヨーロッパ西岸の冬の温和さ"], "ans": 0, "exp": "ガーナ南部の高温湿潤な地域で、主要な輸出用樹木作物Xの種子を加工するモデルである。Xと、加工後の原料費控除額の組合せとして適切なのはどれか。原料以外の費用は未計上とする。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-250", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「ケニアの赤道に近い標高約1800mの高地では、切り花を生産し、低温管理してヨーロッパへ航空輸送する事例が見られる。栽培を支える気温条件の説明として適切なのはどれか。」", "options": ["赤道周辺の高地農業", "三つの気候資料と世界の位置", "オセアニアの輸出と自然環境", "気候区分に使う資料の期間"], "ans": 0, "exp": "ケニアの赤道に近い標高約1800mの高地では、切り花を生産し、低温管理してヨーロッパへ航空輸送する事例が見られる。栽培を支える気温条件の説明として適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-251", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図は西アフリカの沿岸から内陸へ向かう輸送網で、Pはガーナの港、Qはその北側にあるブルキナファソの都市である。Qの国土の位置と、Pが面する海域の組合せとして正しいものはどれか。」", "options": ["西アフリカの内陸国と港", "低気圧の移動と中緯度の風", "日本の地域と農業構成", "草原の表層と土壌形成"], "ans": 0, "exp": "図は西アフリカの沿岸から内陸へ向かう輸送網で、Pはガーナの港、Qはその北側にあるブルキナファソの都市である。Qの国土の位置と、Pが面する海域の組合せとして正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-252", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のP・Q・Rはサヘル、コンゴ盆地、南部アフリカのサバナ地域を想定したモデルである。対応として正しいものはどれか。」", "options": ["アフリカの降水と植生", "山脈両側の降水量", "湾内外の津波記録", "三地域の雨の成因を比べる"], "ans": 0, "exp": "表のP・Q・Rはサヘル、コンゴ盆地、南部アフリカのサバナ地域を想定したモデルである。対応として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-253", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「米国の中央部で、東側の湿潤な地域Pと、より西側の乾燥した地域Qのモデル農場を比較する。資料と農業地域の特徴に合う説明はどれか。」", "options": ["北米の農業地域と生産性", "海上の霧と露点", "支流の合流と流量ピーク", "二つの酪農地域"], "ans": 0, "exp": "米国の中央部で、東側の湿潤な地域Pと、より西側の乾燥した地域Qのモデル農場を比較する。資料と農業地域の特徴に合う説明はどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-254", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「米国の3地域P・Q・Rを表に示す。自然環境と農業の結び付きとして誤っているものはどれか。」", "options": ["北米の農業と水利用", "都市の夜の気温と土地被覆", "沿岸の土地履歴と災害記録", "圃場と流域の水収支"], "ans": 0, "exp": "米国の3地域P・Q・Rを表に示す。自然環境と農業の結び付きとして誤っているものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-255", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表の特徴をもつ米国の都市圏Xはどれか。位置・気候と産業集積を合わせて判断せよ。」", "options": ["米国の都市の位置・気候・産業", "気候区分に使う資料の期間", "都市気温の比較地点", "エネルギー源の構成と自給"], "ans": 0, "exp": "表の特徴をもつ米国の都市圏Xはどれか。位置・気候と産業集積を合わせて判断せよ。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-256", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「カナダ東部のケベック州にアルミニウム製錬所が集積する理由を考える。地域の電源と原料調達の組合せとして適切なのはどれか。」", "options": ["カナダの資源と製錬", "三地域の自然植生", "季節と発電資源", "地下資源とプレート境界"], "ans": 0, "exp": "カナダ東部のケベック州にアルミニウム製錬所が集積する理由を考える。地域の電源と原料調達の組合せとして適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-257", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のような米国市場向けの工場がメキシコの米国国境地域に立地する事例を考える。工業化の型と、立地に関する説明の組合せとして適切なのはどれか。」", "options": ["北米の国境を越える製造業", "湿潤地域の土壌断面", "湾に流れ込む負荷", "企業の集積と分業"], "ans": 0, "exp": "表のような米国市場向けの工場がメキシコの米国国境地域に立地する事例を考える。工業化の型と、立地に関する説明の組合せとして適切なのはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-258", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「表のP・Q・Rはブラジルのアマゾン低地、中西部のセラード、南東部のいずれかである。対応として正しいものはどれか。」", "options": ["ブラジルの地域差", "気候が同じでも違う土壌", "国際河川の季節配分", "貨物の価値と輸送手段"], "ans": 0, "exp": "表のP・Q・Rはブラジルのアマゾン低地、中西部のセラード、南東部のいずれかである。対応として正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-259", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「図は熱帯アンデスの東側斜面を高度帯で単純化したものである。P・Q・Rに適した土地利用の組合せはどれか。土地利用は傾斜・水条件でも異なることに留意する。」", "options": ["アンデスの高度と土地利用", "二つの半球の日射の季節", "市街地更新と災害条件", "生産移転と排出統計"], "ans": 0, "exp": "図は熱帯アンデスの東側斜面を高度帯で単純化したものである。P・Q・Rに適した土地利用の組合せはどれか。土地利用は傾斜・水条件でも異なることに留意する。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-260", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「南米の農牧業地域について、対応が正しいものはどれか。」", "options": ["南米の自然地域と農業", "モンスーン地域の作付け", "駅距離と商業の分布", "二つの出生指標"], "ans": 0, "exp": "南米の農牧業地域について、対応が正しいものはどれか。", "refUrl": "https://logiqa.jp/kyotsu/chiri/", "refLabel": "参照元の解説ページを開く"}, {"id": "GEO-WEB-261", "cat": "STATS_GRAPH", "catName": "統計・グラフ読解", "priority": "A", "q": "次の解説にある「〇〇」に当てはまる語句・要点として最も適切なものはどれか。\n「チリを
