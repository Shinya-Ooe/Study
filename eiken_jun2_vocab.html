<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>英検準2級対策 英単語</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --sub: #334155;
      --pri: #1d4ed8;
      --pri-bg: #dbeafe;
      --bdr: #cbd5e1;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --ng: #b91c1c;
      --ng-bg: #fee2e2;
      --warn: #b45309;
      --warn-bg: #fef3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --card: #111827;
        --text: #f8fafc;
        --sub: #cbd5e1;
        --pri: #60a5fa;
        --pri-bg: rgba(96, 165, 250, 0.16);
        --bdr: #273244;
        --ok: #4ade80;
        --ok-bg: rgba(74, 222, 128, 0.16);
        --ng: #f87171;
        --ng-bg: rgba(248, 113, 113, 0.16);
        --warn: #fbbf24;
        --warn-bg: rgba(251, 191, 36, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    #app {
      display: flex; flex-direction: column; width: 100%;
      height: 100vh; height: 100dvh; max-width: 720px; margin: 0 auto;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      gap: 6px;
    }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 38px; gap: 6px; flex-shrink: 0; }
    .hbtn {
      font-size: 13px; font-weight: 800; color: var(--pri); background: var(--card);
      border: 2px solid var(--bdr); padding: 5px 9px; border-radius: 9px;
      text-decoration: none; cursor: pointer; white-space: nowrap;
    }
    .htitle { font-size: 16px; font-weight: 900; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
    .view { display: none; flex-direction: column; width: 100%; height: 100%; min-height: 0; gap: 6px; }
    .view.active { display: flex; }

    /* ローディング・エラー */
    .status-card {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 20px; flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 12px;
    }
    .status-msg { font-size: 15px; font-weight: 800; line-height: 1.55; color: var(--sub); }

    /* ホーム */
    .home-card {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 10px 12px; display: flex; flex-direction: column;
      justify-content: space-between; flex: 1; min-height: 0; gap: 6px;
    }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0; }
    .stat-box { background: var(--pri-bg); color: var(--pri); border-radius: 10px; padding: 5px 4px; text-align: center; font-weight: 800; }
    .stat-box b { display: block; font-size: 19px; line-height: 1.15; }
    .stat-box span { font-size: 11px; }
    .field { flex-shrink: 0; }
    .field label { display: block; font-size: 12px; font-weight: 800; color: var(--sub); margin-bottom: 2px; }
    select {
      width: 100%; height: 40px; padding: 4px 10px; font-size: 15px; font-weight: 700;
      border-radius: 10px; border: 2px solid var(--bdr); background: var(--card); color: var(--text);
    }
    .btn {
      width: 100%; flex: 1; min-height: 42px; max-height: 52px; border-radius: 12px;
      font-size: 16px; font-weight: 900; cursor: pointer; border: 2px solid transparent;
      display: flex; align-items: center; justify-content: center; text-decoration: none; gap: 6px;
    }
    .btn-pri { background: var(--pri); color: #ffffff; }
    @media (prefers-color-scheme: dark) { .btn-pri { color: #090d16; } }
    .btn-sec { background: var(--card); color: var(--text); border-color: var(--bdr); font-size: 15px; }
    .btn-rev { background: var(--ng-bg); color: var(--ng); border-color: var(--ng); }
    .btn-link { background: var(--pri-bg); color: var(--pri); border-color: var(--pri); font-size: 14px; max-height: 42px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; min-height: 40px; max-height: 48px; }

    /* 出題画面 */
    .pbar { height: 7px; background: var(--bdr); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
    .pfill { height: 100%; width: 0%; background: var(--pri); transition: width 0.25s ease; }
    .meta-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-shrink: 0; }
    .badge { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: var(--pri-bg); color: var(--pri); }
    .badge.s { background: var(--warn-bg); color: var(--warn); }

    .q-card {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 14px;
      padding: 12px 12px 9px; flex: 0 1 auto; max-height: 40%; overflow-y: auto;
      display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
      text-align: center;
    }
    .q-word {
      font-size: clamp(26px, 7.5vw, 38px); font-weight: 900; line-height: 1.2;
      color: var(--text); word-break: break-word;
    }
    .q-word.is-sentence {
      font-size: 19px; text-align: left; line-height: 1.45; font-weight: 800;
    }
    .q-word.is-ja {
      font-size: clamp(20px, 5.5vw, 26px); line-height: 1.35;
    }
    .q-hl { color: var(--pri); background: var(--pri-bg); padding: 1px 5px; border-radius: 5px; border-bottom: 2px solid var(--pri); }
    .q-spell { font-size: 13px; color: var(--sub); letter-spacing: 0.14em; display: none; font-weight: 700; }
    .q-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--sub); }
    .tts-btn { font-size: 12px; font-weight: 800; color: var(--pri); background: var(--pri-bg); border: none; border-radius: 8px; padding: 5px 10px; cursor: pointer; }

    .opts { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
    .opt-btn {
      flex: 1; min-height: 0; width: 100%; background: var(--card);
      border: 2px solid var(--bdr); border-radius: 12px; padding: 6px 12px;
      font-size: 18px; font-weight: 800; line-height: 1.25; color: var(--text);
      text-align: left; cursor: pointer; display: flex; align-items: center; overflow: hidden;
    }
    .opt-btn.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
    .opt-btn.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }

    /* 解説ボトムシート */
    .exp-sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: var(--card); border: 2px solid var(--pri); border-radius: 16px;
      padding: 12px; display: none; flex-direction: column; gap: 7px;
      max-height: 74%; overflow-y: auto; z-index: 30;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.28);
    }
    .exp-sheet.active { display: flex; }
    .exp-head { font-size: 20px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; }
    .exp-ans { font-size: 18px; font-weight: 900; background: var(--ok-bg); color: var(--ok); padding: 7px 10px; border-radius: 10px; }
    .exp-box { background: var(--bg); border: 1.5px solid var(--bdr); border-radius: 10px; padding: 8px 10px; text-align: left; }
    .exp-en { font-size: 15px; font-weight: 800; line-height: 1.4; color: var(--text); }
    .exp-ja { font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--sub); margin-top: 3px; }
    .exp-sheet .btn, .exp-sheet .row2 { flex: 0 0 auto; max-height: none; }

    /* きくだけモード */
    .listen-card {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 16px; flex: 1; min-height: 0; display: flex; flex-direction: column;
      justify-content: space-between; text-align: center; gap: 12px;
    }
    .listen-badge { font-size: 14px; font-weight: 900; color: var(--pri); background: var(--pri-bg); padding: 5px 12px; border-radius: 999px; align-self: center; }
    .listen-main { font-size: 24px; font-weight: 900; line-height: 1.4; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .listen-sub { font-size: 16px; font-weight: 700; color: var(--sub); }
    .listen-card .btn { flex: 0 0 auto; max-height: 48px; }

    /* モーダル */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72);
      display: none; align-items: center; justify-content: center;
      padding: 12px max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      z-index: 60;
    }
    .modal.active { display: flex; }
    .mbox {
      background: var(--card); border: 2px solid var(--bdr); border-radius: 16px;
      padding: 14px; width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px; text-align: center;
    }
    .mbox .btn { flex: 0 0 auto; max-height: none; }
    .mtitle { font-size: 18px; font-weight: 900; }
    .mscore { font-size: 32px; font-weight: 900; color: var(--pri); }
    .mtext { font-size: 15px; font-weight: 700; line-height: 1.5; color: var(--sub); text-align: left; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <a class="hbtn" href="index.html">‹ 一覧</a>
    <div class="htitle">英検準2級対策 英単語</div>
    <button class="hbtn" onclick="openStats()">成績</button>
  </header>

  <main>
    <!-- データ読込中／エラー -->
    <div id="v-loading" class="view active">
      <div class="status-card">
        <div style="font-size:28px;" id="load-icon">⏳</div>
        <div class="status-msg" id="load-msg">単語データ（eiken_jun2_data.json）を読み込んでいます...</div>
        <button class="btn btn-pri" id="btn-retry" style="display:none;max-width:240px;" onclick="loadDatabase()">再読み込み</button>
      </div>
    </div>

    <!-- ホーム -->
    <div id="v-home" class="view">
      <div class="home-card">
        <div class="stat-row">
          <div class="stat-box"><span>収録問題</span><b id="s-tot">0</b></div>
          <div class="stat-box"><span>学習済み</span><b id="s-lrn">0</b></div>
          <div class="stat-box"><span>要復習</span><b id="s-rev">0</b></div>
        </div>

        <div class="field">
          <label for="f-cat">学習グループ</label>
          <select id="f-cat">
            <option value="ALL">全範囲（バランス出題）</option>
            <option value="DAIMON1">📝 大問1 穴埋め（短文空所補充）</option>
            <option value="RANK_S">★ 重要度S（超頻出 No.1〜518）</option>
            <option value="RANK_A">● 重要度A（頻出 No.519〜1000）</option>
            <option value="RANK_B">○ 重要度B（合格固め No.1001〜1480）</option>
            <option value="IDIOM">🔗 熟語・イディオムのみ</option>
          </select>
        </div>

        <div class="field">
          <label for="f-dir">出題形式（単語・熟語）</label>
          <select id="f-dir">
            <option value="EN2JA">英 → 日（英単語から意味を選ぶ）</option>
            <option value="JA2EN">日 → 英（日本語から英単語を選ぶ）</option>
          </select>
        </div>

        <button class="btn btn-pri" onclick="startQuiz('NORMAL')">🚀 10問テストを始める</button>
        <button class="btn btn-rev" id="b-rev" style="display:none;" onclick="startQuiz('REVIEW')">
          ⚠️ 間違えた問題を復習（<span id="rev-n">0</span>問）
        </button>
        <button class="btn btn-sec" onclick="startListen()">🎧 きくだけモード（誤答優先）</button>
        <div class="row2">
          <button class="btn btn-sec" onclick="exportProg()">進捗エクスポート</button>
          <button class="btn btn-sec" onclick="importProg()">進捗インポート</button>
        </div>
      </div>
    </div>

    <!-- 出題画面 -->
    <div id="v-quiz" class="view">
      <div class="pbar"><div class="pfill" id="p-fill"></div></div>
      <div class="meta-bar">
        <span class="badge" id="q-cat">グループ</span>
        <span class="badge s" id="q-pri">★ S</span>
        <span id="q-num" style="font-size:15px;font-weight:900;">1 / 10</span>
      </div>

      <div class="q-card">
        <div class="q-word" id="q-word">word</div>
        <div class="q-spell" id="q-spell"></div>
        <div class="q-foot">
          <span id="q-id">ID</span>
          <div style="display:flex;gap:6px;">
            <button class="tts-btn" id="btn-spell" onclick="toggleSpell()">🔤 つづり</button>
            <button class="tts-btn" onclick="speakCurrentPrompt()">🔊 発音を聞く</button>
          </div>
        </div>
      </div>

      <div class="opts" id="opts"></div>

      <div class="exp-sheet" id="sheet">
        <div class="exp-head">
          <span id="sh-head">⭕ 正解！</span>
          <button class="tts-btn" onclick="speakEn(curList[idx].word)">🔊 単語</button>
        </div>
        <div class="exp-ans" id="sh-ans"></div>
        <div class="exp-box">
          <div class="exp-en" id="sh-en"></div>
          <div class="exp-ja" id="sh-ja"></div>
        </div>
        <div class="row2">
          <button class="btn btn-sec" onclick="speakEn(curList[idx].ex || curList[idx].word)">🔊 例文を聞く</button>
          <button class="btn btn-pri" onclick="nextQ()">次の問題へ ›</button>
        </div>
      </div>
    </div>

    <!-- きくだけモード -->
    <div id="v-listen" class="view">
      <div class="listen-card">
        <div class="listen-badge" id="l-badge">きくだけモード（誤答優先）</div>
        <div class="listen-main">
          <div id="l-en">準備中...</div>
          <div class="listen-sub" id="l-ja"></div>
        </div>
        <button class="btn btn-sec" onclick="stopListen()">停止して戻る</button>
      </div>
    </div>
  </main>
</div>

<!-- 10問終了モーダル -->
<div class="modal" id="m-res">
  <div class="mbox">
    <div class="mtitle">10問セッション終了</div>
    <div class="mscore" id="r-sc">0 / 10</div>
    <div class="mtext" id="r-msg" style="text-align:center;"></div>
    <button class="btn btn-pri" onclick="closeRes('NEXT')">次の10問へ進む</button>
    <button class="btn btn-rev" id="r-rev" onclick="closeRes('REV')">間違えた問題を復習する</button>
    <button class="btn btn-sec" onclick="closeRes('HOME')">メニューに戻る</button>
  </div>
</div>

<!-- 30問アドバイスモーダル -->
<div class="modal" id="m-adv">
  <div class="mbox">
    <div class="mtitle">💡 30問達成！英検準2級攻略のコツ</div>
    <div class="mtext" id="adv-txt"></div>
    <button class="btn btn-pri" onclick="document.getElementById('m-adv').classList.remove('active')">学習を続ける</button>
  </div>
</div>

<!-- 成績モーダル -->
<div class="modal" id="m-st">
  <div class="mbox">
    <div class="mtitle">学習成績・進捗状況</div>
    <div class="mtext" id="st-body"></div>
    <button class="btn btn-sec" onclick="document.getElementById('m-st').classList.remove('active')">閉じる</button>
    <button class="btn btn-sec" style="color:var(--ng);border-color:var(--ng);font-size:14px;" onclick="resetProg()">進捗データをリセット</button>
  </div>
</div>

<script>
const DATA_URL = "./eiken_jun2_data.json";
const APP_ID = "eiken_jun2_vocab.html";
const STORAGE_KEY = "eiken_jun2_split_v1";

let BANK = [];
let prog = loadProg();
let curList = [];
let idx = 0;
let score = 0;
let wrongList = [];
let isReviewSession = false;
let currentDir = "EN2JA";
let listening = false;
let listenTimer = null;

const ADVICES = [
  "【大問1のコツ①】選択肢を見る前に空所に入る品詞や意味の方向（プラスかマイナスか）を予測すると、紛らわしい選択肢に引っかかりにくくなります。",
  "【大問1のコツ②】熟語・句動詞は単語をバラバラにせず、前置詞まで含めたかたまり（例：take part in, come up with）で音読して覚えましょう。",
  "【合格ラインの目安】英検準2級は大問1がリーディングの約半分を占めます。新しい単語を増やすより、間違えた単語を復習して正答率90%以上を目指しましょう。"
];

function fallbackStableId(kind, keyText) {
  const str = `${kind}||${String(keyText || "").trim().toLowerCase()}`;
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return "EJ2-F-" + (h >>> 0).toString(16).padStart(8, "0");
}

// 8秒タイムアウト＋Safariキャッシュ対策付き読み込み
async function loadDatabase() {
  const icon = document.getElementById("load-icon");
  const msg = document.getElementById("load-msg");
  const retry = document.getElementById("btn-retry");
  icon.textContent = "⏳";
  msg.textContent = "単語データ（eiken_jun2_data.json）を読み込んでいます...";
  retry.style.display = "none";

  const targetUrl = new URL(DATA_URL, location.href).href;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);

  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, {
      cache: "no-store",
      signal: controller.signal
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error(`JSON形式エラー: ${e.message}`); }
    if (!Array.isArray(data) || data.length === 0) throw new Error("データが空です");

    const seen = new Set();
    BANK = data.filter(x => x && (x.word || x.q)).map(x => {
      let qid = (x.id && String(x.id).trim()) ? String(x.id).trim() : fallbackStableId(x.type || "VOCAB", x.q || x.word);
      if (seen.has(qid)) qid = fallbackStableId("DUP", qid + seen.size);
      seen.add(qid);
      return { ...x, id: qid };
    });

    showView("v-home");
  } catch (err) {
    clearTimeout(timer);
    icon.textContent = "⚠️";
    const reason = err.name === "AbortError" ? "読み込みが8秒でタイムアウトしました" : err.message;
    msg.innerHTML =
      `読み込みに失敗しました。<br>` +
      `<b>原因：</b>${reason}<br>` +
      `<b>現在の環境：</b>${location.protocol}<br>` +
      `<b>参照先：</b><span style="word-break:break-all;font-size:12px;">${targetUrl}</span>`;
    retry.style.display = "flex";
  }
}

function loadProg() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return { items: p.items || {}, solved: p.solved || 0 };
    }
  } catch (e) {}
  return { items: {}, solved: 0 };
}
function saveProg() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prog)); } catch (e) {} }

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "v-home") refreshHome();
}

function refreshHome() {
  document.getElementById("s-tot").textContent = BANK.length;
  let lrn = 0, rev = 0;
  BANK.forEach(q => {
    const p = prog.items[q.id];
    if (p && p.n > 0) {
      lrn++;
      if (p.ng || (p.ok / p.n) < 0.7) rev++;
    }
  });
  document.getElementById("s-lrn").textContent = lrn;
  document.getElementById("s-rev").textContent = rev;
  document.getElementById("rev-n").textContent = rev;
  document.getElementById("b-rev").style.display = rev > 0 ? "flex" : "none";
}

function forgettingScore(q, now) {
  const p = prog.items[q.id];
  if (!p || !p.n) return 0;
  const elapsedDays = Math.max(0, (now - (p.t || 0)) / 86400000);
  return (p.ng ? 500 : 0) + (1 - (p.ok / p.n)) * 250 + Math.min(elapsedDays * 40, 200) + Math.random() * 20;
}

function startQuiz(mode) {
  const cat = document.getElementById("f-cat").value;
  currentDir = document.getElementById("f-dir").value;
  let pool = BANK.filter(q => {
    if (cat === "ALL") return true;
    if (cat === "DAIMON1") return q.type === "DAIMON1";
    if (cat === "IDIOM") return q.cat === "IDIOM";
    if (cat === "RANK_S") return q.type === "VOCAB" && q.priority === "S";
    if (cat === "RANK_A") return q.type === "VOCAB" && q.priority === "A";
    if (cat === "RANK_B") return q.type === "VOCAB" && q.priority === "B";
    return true;
  });

  isReviewSession = (mode === "REVIEW");
  if (isReviewSession) {
    pool = pool.filter(q => { const p = prog.items[q.id]; return p && (p.ng || (p.ok / p.n) < 0.7); });
    if (!pool.length) { alert("復習が必要な問題はありません！"); return; }
    const now = Date.now();
    curList = [...pool].sort((a, b) => forgettingScore(b, now) - forgettingScore(a, now)).slice(0, 10);
  } else {
    if (!pool.length) { alert("該当する問題がありません。グループを変更してください。"); return; }
    const now = Date.now();
    const unseen = pool.filter(q => !prog.items[q.id] || prog.items[q.id].n === 0).sort(() => Math.random() - 0.5);
    const seen = pool.filter(q => prog.items[q.id] && prog.items[q.id].n > 0).sort((a, b) => forgettingScore(b, now) - forgettingScore(a, now));
    // 未出題優先＋忘却曲線に基づき既出から10問中2問程度を出題
    const targetRev = seen.length > 0 ? Math.min(2, seen.length) : 0;
    let combined = [...unseen.slice(0, 10 - targetRev), ...seen.slice(0, targetRev)];
    if (combined.length < Math.min(10, pool.length)) {
      const used = new Set(combined.map(q => q.id));
      for (const q of seen) {
        if (!used.has(q.id)) { combined.push(q); used.add(q.id); }
        if (combined.length >= Math.min(10, pool.length)) break;
      }
    }
    curList = combined.sort(() => Math.random() - 0.5);
  }

  idx = 0; score = 0; wrongList = [];
  showView("v-quiz");
  renderQ();
}

function buildOptionsForItem(q) {
  if (q.type === "DAIMON1") {
    return { opts: q.options, ansIdx: q.ans };
  }
  if (currentDir === "JA2EN") {
    const dummies = (q.dummyEn && q.dummyEn.length >= 3) ? q.dummyEn.slice(0, 3) : ["improve", "available", "however"];
    return { opts: [q.word, ...dummies], ansIdx: 0 };
  }
  const dummies = (q.dummyJa && q.dummyJa.length >= 3) ? q.dummyJa.slice(0, 3) : ["を改善する", "利用できる", "しかしながら"];
  return { opts: [q.mean, ...dummies], ansIdx: 0 };
}

function toggleSpell() {
  const el = document.getElementById("q-spell");
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function renderQ() {
  document.getElementById("sheet").classList.remove("active");
  const q = curList[idx];
  document.getElementById("p-fill").style.width = `${(idx / curList.length) * 100}%`;
  document.getElementById("q-cat").textContent = `${q.catName}（${q.pos || ""}）`;
  const priEl = document.getElementById("q-pri");
  priEl.textContent = q.priority === "S" ? "★ S" : (q.priority === "A" ? "● A" : "○ B");
  priEl.className = q.priority === "S" ? "badge s" : "badge";
  document.getElementById("q-num").textContent = `${idx + 1} / ${curList.length}`;
  document.getElementById("q-id").textContent = `No.${q.no || "-"} / ${q.id}`;

  const wEl = document.getElementById("q-word");
  const spEl = document.getElementById("q-spell");
  const spBtn = document.getElementById("btn-spell");
  spEl.style.display = "none";

  if (q.type === "DAIMON1") {
    wEl.className = "q-word is-sentence";
    const esc = (q.q || "").replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
    wEl.innerHTML = esc.replace(/\(\s* +\s*\)|\(\s+\)/g, '<span class="q-hl">(  )</span>');
    spBtn.style.display = "none";
  } else if (currentDir === "JA2EN") {
    wEl.className = "q-word is-ja";
    wEl.textContent = q.mean;
    spEl.textContent = q.spelling ? `${q.word[0]} _ _ ... (${q.word.length}文字)` : "";
    spBtn.style.display = "inline-block";
  } else {
    wEl.className = "q-word";
    wEl.textContent = q.word;
    spEl.textContent = q.spelling || q.word.split("").join(" ");
    spBtn.style.display = "inline-block";
    speakEn(q.word);
  }

  const { opts, ansIdx } = buildOptionsForItem(q);
  q._curOpts = opts;
  q._curAns = ansIdx;

  const optsEl = document.getElementById("opts");
  optsEl.innerHTML = "";
  const order = opts.map((_, i) => i).sort(() => Math.random() - 0.5);
  const labels = ["1", "2", "3", "4"];
  order.forEach((optIdx, pos) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.dataset.optIdx = String(optIdx);
    btn.textContent = `${labels[pos]}. ${opts[optIdx]}`;
    btn.onclick = () => checkAnswer(optIdx, btn);
    optsEl.appendChild(btn);
  });
}

function checkAnswer(selectedIdx, btn) {
  document.querySelectorAll(".opt-btn").forEach(b => b.disabled = true);
  const q = curList[idx];
  const isOk = selectedIdx === q._curAns;
  const p = prog.items[q.id] || { n: 0, ok: 0, ng: false, t: 0 };
  p.n += 1; p.t = Date.now();
  if (isOk) { score += 1; p.ok += 1; p.ng = false; btn.classList.add("ok"); }
  else {
    p.ng = true; wrongList.push(q); btn.classList.add("ng");
    document.querySelectorAll(".opt-btn").forEach(b => { if (Number(b.dataset.optIdx) === q._curAns) b.classList.add("ok"); });
  }
  prog.items[q.id] = p;
  prog.solved = (prog.solved || 0) + 1;
  saveProg();

  const head = document.getElementById("sh-head");
  head.textContent = isOk ? "⭕ 正解！" : "❌ 不正解";
  head.style.color = isOk ? "var(--ok)" : "var(--ng)";
  document.getElementById("sh-ans").textContent = `${q.word} ＝ ${q.mean}`;
  document.getElementById("sh-en").textContent = q.ex || q.word;
  document.getElementById("sh-ja").textContent = q.exJa || (q.paraphrase ? `言い換え: ${q.paraphrase}` : "");
  document.getElementById("sheet").classList.add("active");

  speakEn(q.word);

  if (prog.solved > 0 && prog.solved % 30 === 0) {
    setTimeout(() => {
      document.getElementById("adv-txt").textContent = ADVICES[(Math.floor(prog.solved / 30) - 1) % ADVICES.length];
      document.getElementById("m-adv").classList.add("active");
    }, 550);
  }
}

function nextQ() {
  idx += 1;
  if (idx < curList.length) renderQ();
  else {
    document.getElementById("p-fill").style.width = "100%";
    document.getElementById("r-sc").textContent = `${score} / ${curList.length} 問正解`;
    const allClear = wrongList.length === 0;
    document.getElementById("r-msg").textContent = allClear
      ? "全問正解達成！次の10問へ進めます。"
      : (isReviewSession ? "復習モードでは間違えた問題を全問正解すると次へ進めます。" : "間違えた単語を復習して、確実に定着させましょう。");
    document.getElementById("r-rev").style.display = allClear ? "none" : "flex";
    document.getElementById("m-res").classList.add("active");
  }
}

function closeRes(action) {
  document.getElementById("m-res").classList.remove("active");
  if (action === "REV") { curList = [...wrongList]; idx = 0; score = 0; wrongList = []; isReviewSession = true; showView("v-quiz"); renderQ(); }
  else if (action === "NEXT") {
    if (isReviewSession && wrongList.length > 0) {
      alert("復習モードでは間違えた問題をすべて正解すると通常モードの次へ進めます。");
      document.getElementById("m-res").classList.add("active");
      return;
    }
    startQuiz("NORMAL");
  } else showView("v-home");
}

function openStats() {
  const groups = [
    ["大問1 穴埋め", q => q.type === "DAIMON1"],
    ["重要度S（超頻出）", q => q.type === "VOCAB" && q.priority === "S"],
    ["重要度A（頻出）", q => q.type === "VOCAB" && q.priority === "A"],
    ["重要度B（合格固め）", q => q.type === "VOCAB" && q.priority === "B"],
    ["熟語・イディオム", q => q.cat === "IDIOM"]
  ];
  let lines = [`累計解答数：<b>${prog.solved || 0}</b> 回<br><br>`];
  groups.forEach(([label, fn]) => {
    const sub = BANK.filter(fn);
    const done = sub.filter(q => prog.items[q.id] && prog.items[q.id].n > 0).length;
    lines.push(`${label}：${done} / ${sub.length} 問学習済<br>`);
  });
  document.getElementById("st-body").innerHTML = lines.join("");
  document.getElementById("m-st").classList.add("active");
}

function resetProg() {
  if (confirm("これまでの学習進捗をすべて削除しますか？")) {
    prog = { items: {}, solved: 0 }; saveProg(); refreshHome();
    document.getElementById("m-st").classList.remove("active");
  }
}

function exportProg() {
  const now = new Date();
  const stamp =
    now.getFullYear().toString() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") + "_" +
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0");
  const defaultName = `しんや_${APP_ID}_${stamp}`;
  const customName = prompt("進捗データの保存名を入力してください：", defaultName);
  if (!customName) return;

  const cleanName = customName.trim();
  const payload = JSON.stringify({
    schemaVersion: 1, appId: APP_ID, exportName: cleanName,
    exportedAt: now.toISOString(), prog: prog
  });

  try {
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${cleanName}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {}

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(payload)
      .then(() => alert(`「${cleanName}」をファイル保存＆クリップボードにコピーしました。`))
      .catch(() => alert(`「${cleanName}.json」を保存しました。`));
  } else {
    prompt("以下の進捗コードをコピーしてください：", payload);
  }
}

function applyImportedPayload(rawText) {
  let parsed;
  try { parsed = JSON.parse(rawText.trim()); } catch (e) {
    alert("JSON形式の読み込みに失敗しました。"); return;
  }
  if (!parsed || parsed.appId !== APP_ID) {
    alert(`この問題集（${APP_ID}）からエクスポートされたデータではないため取り込めません。`); return;
  }
  if (!parsed.prog || typeof parsed.prog.items !== "object") {
    alert("進捗データの形式が正しくありません。"); return;
  }
  const incoming = parsed.prog;
  const shouldMerge = confirm(
    `「${parsed.exportName || "進捗データ"}」を読み込みます。\n\n` +
    "・OK：現在の進捗と統合（新しい解答日時を優先してマージ）\n" +
    "・キャンセル：このデータで完全に上書き"
  );
  if (shouldMerge) {
    const mergedItems = { ...prog.items };
    let addedCount = 0, updatedCount = 0;
    Object.entries(incoming.items).forEach(([qid, inItem]) => {
      const curItem = mergedItems[qid];
      if (!curItem) { mergedItems[qid] = inItem; addedCount++; }
      else if ((inItem.t || 0) > (curItem.t || 0)) { mergedItems[qid] = inItem; updatedCount++; }
    });
    prog = { items: mergedItems, solved: Math.max(prog.solved || 0, incoming.solved || 0) };
    saveProg(); refreshHome();
    alert(`統合完了（新規反映：${addedCount}件 / 最新更新：${updatedCount}件）`);
  } else {
    prog = { items: incoming.items, solved: incoming.solved || 0 };
    saveProg(); refreshHome();
    alert(`「${parsed.exportName || "進捗データ"}」で進捗を上書きしました。`);
  }
}

function importProg() {
  const useFile = confirm(
    "進捗データの読み込み方法を選んでください。\n\n" +
    "・OK：保存したJSONファイルを選択\n" +
    "・キャンセル：コピーした進捗コードを貼り付け"
  );
  if (useFile) {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json,application/json,text/plain";
    input.onchange = (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => applyImportedPayload(String(reader.result || ""));
      reader.readAsText(file, "utf-8");
    };
    input.click();
  } else {
    const txt = prompt("エクスポートした進捗コードを貼り付けてください：");
    if (txt) applyImportedPayload(txt);
  }
}

function speakText(text, lang, onDone) {
  if (!("speechSynthesis" in window)) { if (onDone) onDone(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = lang === "en-US" ? 0.95 : 1.05;
  if (onDone) utter.onend = onDone;
  window.speechSynthesis.speak(utter);
}
function speakEn(text, onDone) { speakText(text, "en-US", onDone); }
function speakJa(text, onDone) { speakText(text, "ja-JP", onDone); }

function speakCurrentPrompt() {
  const q = curList[idx];
  if (!q) return;
  if (q.type === "DAIMON1") speakEn((q.q || "").replace(/\(\s* +\s*\)|\(\s+\)/g, " blank "));
  else if (currentDir === "JA2EN") speakJa(q.mean);
  else speakEn(q.word);
}

function startListen() {
  listening = true; showView("v-listen");
  const wrongPool = BANK.filter(q => prog.items[q.id] && prog.items[q.id].ng);
  const pool = wrongPool.length > 0 ? wrongPool : [...BANK];
  let i = 0;
  const step = () => {
    if (!listening) return;
    const q = pool[i % pool.length];
    document.getElementById("l-badge").textContent = `${q.catName}（${wrongPool.length > 0 ? "誤答優先" : "全収録"}）`;
    document.getElementById("l-en").textContent = q.word;
    document.getElementById("l-ja").textContent = "";
    speakEn(q.word, () => {
      if (!listening) return;
      listenTimer = setTimeout(() => {
        if (!listening) return;
        document.getElementById("l-ja").textContent = q.mean;
        speakJa(q.mean, () => {
          if (!listening) return;
          i += 1; listenTimer = setTimeout(step, 1600);
        });
      }, 900);
    });
  };
  step();
}

function stopListen() {
  listening = false;
  if (listenTimer) clearTimeout(listenTimer);
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  showView("v-home");
}

loadDatabase();
</script>
