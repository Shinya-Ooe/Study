<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>📇英検準2級 英単語マスター（全1480語）</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-sub: #f0f2f5;
    --ink: #18181b;
    --ink-muted: #52525b;
    --line: #d4d4d8;
    --focus: #18181b;
    --ok: #166534;
    --ok-bg: #f0fdf4;
    --ng: #991b1b;
    --ng-bg: #fef2f2;
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --surface-sub: #1f242d;
      --ink: #f4f4f5;
      --ink-muted: #a1a1aa;
      --line: #2e3440;
      --focus: #e4e4e7;
      --ok: #4ade80;
      --ok-bg: #14291d;
      --ng: #f87171;
      --ng-bg: #2e1719;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  .app {
    width: 100%;
    max-width: 780px;
    height: 100%;
    height: 100dvh;
    margin: 0 auto;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
  }

  .home-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px 2px;
    min-height: 0;
  }
  .home-head {
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .home-title {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .home-sub {
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin-top: 3px;
  }
  .home-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0;
    overflow-y: auto;
  }
  .menu-card-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    text-align: left;
    cursor: pointer;
  }
  .menu-card-btn.primary-card {
    background: var(--surface-sub);
    border-color: var(--focus);
  }
  .menu-card-btn:active {
    background: var(--surface-sub);
  }
  .menu-card-title {
    font-size: 0.98rem;
    font-weight: 700;
  }
  .menu-card-desc {
    font-size: 0.78rem;
    color: var(--ink-muted);
    margin-top: 2px;
  }
  .menu-arrow {
    font-size: 0.95rem;
    color: var(--ink-muted);
    margin-left: 10px;
  }
  .home-select-row {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface-sub);
  }
  .home-select-row select {
    flex: 1;
    max-width: none;
  }
  .home-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: var(--ink-muted);
    padding-top: 6px;
    border-top: 1px solid var(--line);
  }

  .study-screen {
    flex: 1;
    display: none;
    flex-direction: column;
    min-height: 0;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  select, .mini-btn {
    font-size: 0.78rem;
    padding: 5px 7px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface-sub);
    color: var(--ink);
    font-weight: 600;
    cursor: pointer;
  }
  .mini-btn.is-active {
    background: var(--focus);
    color: var(--surface);
    border-color: var(--focus);
  }

  .meta-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.76rem;
    color: var(--ink-muted);
    padding: 5px 2px 2px;
    flex-shrink: 0;
  }
  .progress-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--focus);
    transition: width 0.2s ease;
  }

  .prompt-box {
    padding: 10px 8px 11px;
    border-bottom: 1px solid var(--line);
    text-align: center;
    flex-shrink: 0;
  }
  .prompt-sub {
    font-size: 0.78rem;
    color: var(--ink-muted);
    margin-bottom: 4px;
    letter-spacing: 0.03em;
  }
  .prompt-main-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .prompt-word {
    font-size: clamp(2.1rem, 6vw, 3.1rem);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .prompt-word.is-reverse {
    font-size: clamp(1.35rem, 3.6vw, 1.9rem);
    line-height: 1.28;
    font-weight: 700;
  }
  .icon-btn {
    border: 1px solid var(--line);
    background: var(--surface-sub);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .icon-btn.is-active {
    background: var(--focus);
    color: var(--surface);
    border-color: var(--focus);
  }
  .spell-hint {
    margin-top: 6px;
    font-size: 0.90rem;
    color: var(--ink-muted);
    letter-spacing: 0.16em;
    display: none;
  }

  .stage {
    position: relative;
    flex: 1;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .choice-btn {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    text-align: left;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: clamp(1.08rem, 2.6vw, 1.42rem);
    font-weight: 600;
    line-height: 1.3;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .choice-btn:active {
    background: var(--surface-sub);
  }
  .choice-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 6px;
    border: 1px solid var(--line);
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--ink-muted);
    margin-right: 12px;
  }
  .choice-btn.is-correct {
    background: var(--ok-bg);
    border-color: var(--ok);
    color: var(--ok);
  }
  .choice-btn.is-correct .choice-num {
    background: var(--ok);
    border-color: var(--ok);
    color: var(--surface);
  }
  .choice-btn.is-wrong {
    background: var(--ng-bg);
    border-color: var(--ng);
    color: var(--ng);
  }
  .choice-btn.is-wrong .choice-num {
    background: var(--ng);
    border-color: var(--ng);
    color: var(--surface);
  }

  .answer-panel {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border: 1px solid var(--focus);
    border-radius: var(--radius);
    padding: 9px 12px;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    z-index: 20;
  }
  .answer-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 0.90rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .judge-ok { color: var(--ok); }
  .judge-ng { color: var(--ng); }

  .core-memory-box {
    background: var(--surface-sub);
    border-radius: 8px;
    padding: 7px 10px;
    margin: 4px 0;
    text-align: center;
    flex-shrink: 0;
  }
  .core-word-line {
    font-size: 1.0rem;
    font-weight: 700;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
  }
  .core-meaning-line {
    font-size: clamp(1.35rem, 3.6vw, 1.9rem);
    font-weight: 800;
    color: var(--ink);
    line-height: 1.24;
    margin-top: 1px;
  }

  .detail-stack {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    gap: 3px;
    overflow-y: auto;
    padding: 2px 0;
  }
  .detail-row {
    font-size: clamp(0.88rem, 1.95vw, 1.06rem);
    line-height: 1.28;
    padding: 3px 8px;
    border-left: 2px solid var(--line);
  }
  .detail-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--ink-muted);
    margin-right: 6px;
  }

  .practice-ex-box {
    background: var(--surface-sub);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: clamp(0.88rem, 2.0vw, 1.06rem);
    line-height: 1.3;
  }
  .practice-ex-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }
  .practice-ex-title {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--ink-muted);
  }
  .ex-speak-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
  }
  .context-en {
    font-weight: 600;
    color: var(--ink);
  }
  .context-ja {
    font-size: clamp(0.84rem, 1.85vw, 1.0rem);
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .next-btn {
    width: 100%;
    padding: 11px;
    border-radius: var(--radius);
    border: none;
    background: var(--focus);
    color: var(--surface);
    font-size: clamp(1.05rem, 2.5vw, 1.25rem);
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .next-btn:active { opacity: 0.85; }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .sheet-card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    text-align: left;
    max-height: 88dvh;
    overflow-y: auto;
  }
  .sheet-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 6px;
    text-align: center;
  }
  .sheet-score {
    font-size: 1.75rem;
    font-weight: 800;
    margin: 6px 0 10px;
    text-align: center;
  }
  .sheet-note {
    font-size: 0.88rem;
    color: var(--ink-muted);
    line-height: 1.45;
    margin-bottom: 12px;
    text-align: center;
  }
  .tip-topic {
    font-size: 1.02rem;
    font-weight: 800;
    padding-bottom: 6px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .tip-block {
    background: var(--surface-sub);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 0.88rem;
    line-height: 1.42;
  }
  .tip-tag {
    display: inline-block;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--ink-muted);
    margin-bottom: 2px;
  }
  .tip-author {
    text-align: right;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink-muted);
    margin: 4px 0 10px;
  }
  .score-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0 12px;
    font-size: 0.86rem;
  }
  .score-table th, .score-table td {
    border-bottom: 1px solid var(--line);
    padding: 7px 6px;
    text-align: left;
  }
  .score-table th {
    color: var(--ink-muted);
    font-weight: 700;
  }
  .sample-words {
    font-size: 0.80rem;
    color: var(--ink-muted);
    margin-top: 2px;
  }
  .sheet-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sheet-row {
    display: flex;
    gap: 8px;
  }
  .sheet-sub {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-sub);
    color: var(--ink);
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">
  <div class="home-screen" id="homeScreen">
    <div>
      <div class="home-head">
        <div class="home-title">📇英検準2級 英単語マスター</div>
        <div class="home-sub">英語漬け・英検準2級素材（全<span id="homeTotalCount">0</span>語）・習得 <span id="homeClearedCount">0</span>語 (<span id="homePctText">0%</span>)</div>
      </div>
    </div>

    <div class="home-list">
      <button type="button" class="menu-card-btn primary-card" onclick="enterFromMenu('resume')">
        <div>
          <div class="menu-card-title">前回のつづき</div>
          <div class="menu-card-desc" id="resumeDesc">保存された位置から演習を再開します</div>
        </div>
        <span class="menu-arrow">▶</span>
      </button>

      <div class="home-select-row">
        <select id="homeModeSelect"></select>
        <button type="button" class="mini-btn" onclick="enterFromMenu('selected')">開始</button>
      </div>

      <button type="button" class="menu-card-btn" onclick="enterFromMenu('review')">
        <div>
          <div class="menu-card-title">振り返り（復習・リマインド）</div>
          <div class="menu-card-desc">要復習 <span id="homeReviewCount">0</span> 語・忘却曲線リマインド対象</div>
        </div>
        <span class="menu-arrow">▶</span>
      </button>

      <button type="button" class="menu-card-btn" onclick="enterFromMenu('listen')">
        <div>
          <div class="menu-card-title">聞き流し</div>
          <div class="menu-card-desc">単語と例文を自動でつなげて耳からインプット</div>
        </div>
        <span class="menu-arrow">▶</span>
      </button>

      <button type="button" class="menu-card-btn" onclick="openTipPopup(true)">
        <div>
          <div class="menu-card-title">コツを見る</div>
          <div class="menu-card-desc">英検準2級の語彙・長文・リスニング対策のポイント</div>
        </div>
        <span class="menu-arrow">▶</span>
      </button>
    </div>

    <div class="home-footer">
      <span>速度履歴: <strong id="homeFast3Count">0</strong> 語が3秒以内</span>
      <button type="button" class="mini-btn" onclick="openScoreboard()">成績表</button>
      <button type="button" class="mini-btn" onclick="resetAllData()">初期化</button>
    </div>
  </div>

  <div class="study-screen" id="studyScreen">
    <div class="top-bar">
      <button type="button" class="mini-btn" onclick="backToMainMenu()">メインメニューに戻る</button>
      <div class="top-actions">
        <select id="modeSelect" onchange="onModeChange()"></select>
        <button type="button" class="mini-btn" onclick="openScoreboard()">成績表</button>
        <button type="button" class="mini-btn" onclick="startReviewMode()">復習 (<span id="reviewBadge">0</span>)</button>
      </div>
    </div>

    <div class="meta-strip">
      <span id="statusText">重要度順</span>
      <span>習得 <strong id="clearedCount">0</strong> / <strong id="totalCount">0</strong> (<span id="pctText">0%</span>)</span>
      <span id="qCounter">1 / 1</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="prompt-box">
      <div class="prompt-sub" id="promptSub">【熟語】重要度S・英単語から意味を選択</div>
      <div class="prompt-main-row">
        <div class="prompt-word" id="promptWord">---</div>
        <button type="button" class="icon-btn" id="btnAudio" onclick="speakWord()">単語音声</button>
        <button type="button" class="icon-btn" id="btnListen" onclick="toggleListenMode()">聞き流し</button>
        <button type="button" class="icon-btn" id="btnSpell" onclick="toggleSpelling()">つづり</button>
      </div>
      <div class="spell-hint" id="spellHint"></div>
    </div>

    <div class="stage">
      <div class="choices" id="choicesBox"></div>

      <div class="answer-panel" id="answerPanel">
        <div class="answer-head">
          <span id="judgeLabel">正解</span>
          <button type="button" class="ex-speak-btn" onclick="speakWord()">単語音声</button>
          <span id="timeLabel">0.0s</span>
        </div>

        <div class="core-memory-box">
          <div class="core-word-line" id="ansWordLine">word</div>
          <div class="core-meaning-line" id="ansMeaningLine">意味</div>
        </div>

        <div class="detail-stack">
          <div class="detail-row">
            <span class="detail-label">熟語・意味</span>
            <span id="ansIdiomText"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">言い換え</span>
            <span id="ansParaphraseText"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">つづり</span>
            <span id="ansSpellText"></span>
          </div>
          <div class="practice-ex-box">
            <div class="practice-ex-header">
              <span class="practice-ex-title">【英検準2級 実践例文＋和訳】</span>
              <button type="button" class="ex-speak-btn" onclick="speakExample()">例文音声</button>
            </div>
            <div class="context-en" id="ansExEn"></div>
            <div class="context-ja" id="ansExJa"></div>
          </div>
        </div>

        <button type="button" class="next-btn" id="btnNextQuestion" onclick="goNext()">次へ</button>
      </div>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="tipSheet">
  <div class="sheet-card">
    <div class="sheet-title">英検準2級 合格のコツ</div>
    <div class="tip-topic" id="tipTopic"></div>
    <div class="tip-block">
      <div class="tip-tag">ありがちな課題</div>
      <div id="tipProblem"></div>
    </div>
    <div class="tip-block">
      <div class="tip-tag">実践したい対策</div>
      <div id="tipAction"></div>
    </div>
    <div class="tip-author" id="tipAuthor"></div>
    <div class="sheet-actions">
      <button type="button" class="next-btn" onclick="closeTipAndProceed()">閉じる</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="batchSheet">
  <div class="sheet-card">
    <div class="sheet-title" id="sheetTitle">10問区切り</div>
    <div class="sheet-score" id="sheetScore">0 / 10</div>
    <div class="sheet-note" id="sheetNote"></div>
    <div class="sheet-actions">
      <button type="button" class="next-btn" onclick="continueBatch()">次の10問へ進む</button>
      <div class="sheet-row">
        <button type="button" class="sheet-sub" onclick="closeSheetAndReview()">復習リストへ</button>
        <button type="button" class="sheet-sub" onclick="reshuffleQueue()">並び替え</button>
      </div>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="scoreSheet">
  <div class="sheet-card">
    <div class="sheet-title">回答速度 成績表</div>
    <div class="sheet-note" id="scoreSummaryLine"></div>
    <table class="score-table">
      <thead>
        <tr>
          <th>速度帯</th>
          <th>語数</th>
          <th>主な単語</th>
        </tr>
      </thead>
      <tbody id="scoreTableBody"></tbody>
    </table>
    <div class="sheet-actions">
      <button type="button" class="next-btn" onclick="closeScoreboard()">閉じる</button>
    </div>
  </div>

function loadJson(key, fallback) {
  try {
    const raw = localStorage.getItem(STORE_KEY + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveJson(key, val) {
  try {
    localStorage.setItem(STORE_KEY + key, JSON.stringify(val));
  } catch (e) {}
}

function getCleared() { return loadJson("cleared", []); }
function addCleared(id) {
  const list = getCleared();
  if (!list.includes(id)) {
    list.push(id);
    saveJson("cleared", list);
  }
  refreshStats();
}

function getWrongList() { return loadJson("wrong", []); }
function addWrong(id) {
  const list = getWrongList();
  if (!list.includes(id)) {
    list.push(id);
    saveJson("wrong", list);
  }
  refreshStats();
}
function removeWrong(id) {
  const next = getWrongList().filter(x => x !== id);
  saveJson("wrong", next);
  refreshStats();
}

function getSpeedMap() { return loadJson("speed", {}); }
function classifySpeedTier(secNum) {
  if (secNum <= 3.0) return "t3";
  if (secNum <= 5.0) return "t5";
  if (secNum <= 10.0) return "t10";
  return "over";
}
function recordSpeedHistory(id, secNum) {
  const map = getSpeedMap();
  map[id] = {
    lastSec: Number(secNum.toFixed(1)),
    tier: classifySpeedTier(secNum),
    updatedAt: Date.now()
  };
  saveJson("speed", map);
}

function getRemindMap() { return loadJson("remind", {}); }
function scheduleNextRemind(id, wasCorrect) {
  const map = getRemindMap();
  const prev = map[id] || { reps: 0 };
  const nextReps = wasCorrect ? (prev.reps + 1) : 0;
  const intervalsDays = [1, 3, 7, 14, 30];
  const days = intervalsDays[Math.min(nextReps, intervalsDays.length - 1)];
  map[id] = {
    reps: nextReps,
    nextDueAt: Date.now() + days * DAY_MS,
    intervalDays: days
  };
  saveJson("remind", map);
}
function getDueRemindWords(pool) {
  const remindMap = getRemindMap();
  const now = Date.now();
  return pool.filter(w => {
    const info = remindMap[w.id];
    return info && info.nextDueAt && now >= info.nextDueAt;
  });
}

  updateListenButtonUI();
  if ("speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  saveState();
  refreshStats();
  document.getElementById("studyScreen").style.display = "none";
  document.getElementById("homeScreen").style.display = "flex";
}

function showStudyScreen() {
  document.getElementById("homeScreen").style.display = "none";
  document.getElementById("studyScreen").style.display = "flex";
}

function backToMainMenu() {
  showHomeScreen();
}

function enterFromMenu(action) {
  if (action === "resume") {
    if (queue.length === 0) buildQueue();
    showStudyScreen();
    renderQuestion();
    return;
  }
  if (action === "selected") {
    const chosen = document.getElementById("homeModeSelect").value;
    modeId = chosen;
    document.getElementById("modeSelect").value = chosen;
    isReview = false;
    buildQueue();
    showStudyScreen();
    renderQuestion();
    return;
  }
  if (action === "review") {
    isReview = true;
    buildQueue();
    showStudyScreen();
    renderQuestion();
    return;
  }
  if (action === "listen") {
    if (queue.length === 0) buildQueue();
    isListenMode = true;
    updateListenButtonUI();
    showStudyScreen();
    renderQuestion();
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function getPool() {
  const m = MODES.find(x => x.id === modeId);
  if (m && m.type === "rank") {
    return WORDS.filter(w => w.rank === m.rank);
  }
  if (m && m.type === "speed") {
    const smap = getSpeedMap();
    return WORDS.filter(w => smap[w.id] && smap[w.id].tier === m.tier);
  }
  return [...WORDS];
}

function buildQueue() {
  let list = [];
  if (isReview) {
    const wrongIds = getWrongList();
    const dueRemind = getDueRemindWords(WORDS).map(w => w.id);
    const targetIds = Array.from(new Set([...wrongIds, ...dueRemind]));
    list = WORDS.filter(w => targetIds.includes(w.id));
    if (list.length === 0) {
      isReview = false;
      list = getPool();
    }
    shuffle(list);
  } else {
    const pool = getPool();
    if (pool.length === 0) {
      list = [...WORDS];
      shuffle(list);
    } else {
      const m = MODES.find(x => x.id === modeId);
      const isPriorityOrder = (modeId === "priority");
      const isSpeedMode = (m && m.type === "speed");

      const cleared = getCleared();
      const dueRemind = getDueRemindWords(pool);
      const fresh = isSpeedMode ? [...pool] : pool.filter(w => !cleared.includes(w.id));

      if (!isPriorityOrder) {
        shuffle(fresh);
      }
      shuffle(dueRemind);

      let fIdx = 0;
      let rIdx = 0;
      while (fIdx < fresh.length || rIdx < dueRemind.length) {
        const chunk = [];
        let rAdded = 0;
        while (rAdded < 2 && rIdx < dueRemind.length) {
          const clone = Object.assign({}, dueRemind[rIdx++]);
          clone.isRemind = true;
          chunk.push(clone);
          rAdded++;
        }
        while (chunk.length < 10 && fIdx < fresh.length) {
          chunk.push(fresh[fIdx++]);
        }
        while (chunk.length < 10 && rIdx < dueRemind.length) {
          const clone = Object.assign({}, dueRemind[rIdx++]);
          clone.isRemind = true;
          chunk.push(clone);
        }
        if (!isPriorityOrder) {
          shuffle(chunk);
        }
        list.push(...chunk);
      }

      if (list.length === 0) {
        list = [...pool];
        if (!isPriorityOrder) shuffle(list);
      }
    }
  }

  queue = list;
  idx = 0;
  batchCorrect = 0;
  saveState();
}

function saveState() {
  saveJson("state", {
    modeId,
    idx,
    batchCorrect,
    answeredTotal,
    tipCursor,
    isReview,
    queueIds: queue.map(w => ({ id: w.id, isRemind: !!w.isRemind }))
  });
}

function restoreState() {
  const s = loadJson("state", null);
  if (!s || !Array.isArray(s.queueIds) || s.queueIds.length === 0) return false;
  modeId = s.modeId || "priority";
  idx = s.idx || 0;
  batchCorrect = s.batchCorrect || 0;
  answeredTotal = s.answeredTotal || 0;
  tipCursor = s.tipCursor || 0;
  isReview = !!s.isReview;

  const map = new Map(WORDS.map(w => [w.id, w]));
  queue = s.queueIds.map(item => {
    const base = map.get(item.id);
    if (!base) return null;
    const copy = Object.assign({}, base);
    if (item.isRemind) copy.isRemind = true;
    return copy;
  }).filter(Boolean);

  if (queue.length === 0) return false;
  if (idx >= queue.length) idx = 0;
  document.getElementById("modeSelect").value = modeId;
  document.getElementById("homeModeSelect").value = modeId;
  return true;
}

function init() {
  const sel = document.getElementById("modeSelect");
  const homeSel = document.getElementById("homeModeSelect");
  sel.innerHTML = "";
  homeSel.innerHTML = "";
  MODES.forEach(m => {
    const opt1 = document.createElement("option");
    opt1.value = m.id;
    opt1.textContent = m.label;
    sel.appendChild(opt1);

    const opt2 = document.createElement("option");
    opt2.value = m.id;
    opt2.textContent = m.label;
    homeSel.appendChild(opt2);
  });

  if (!restoreState()) {
    buildQueue();
  }
  refreshStats();
  showHomeScreen();
}

window.addEventListener("DOMContentLoaded", init);

function onModeChange() {
  modeId = document.getElementById("modeSelect").value;
  document.getElementById("homeModeSelect").value = modeId;
  const m = MODES.find(x => x.id === modeId);
  if (m && m.type === "speed") {
    const filtered = getPool();
    if (filtered.length === 0) {
      alert("この速度帯に該当する履歴がまだありません。通常演習で回答すると記録されます。");
      modeId = "priority";
      document.getElementById("modeSelect").value = "priority";
      document.getElementById("homeModeSelect").value = "priority";
    }
  }
  isReview = false;
  buildQueue();
  renderQuestion();
}

function startReviewMode() {
  if (getWrongList().length === 0 && getDueRemindWords(WORDS).length === 0) {
    alert("復習・リマインド対象の単語はありません。");
    return;
  }
  isReview = true;
  buildQueue();
  renderQuestion();
}

function reshuffleQueue() {
  document.getElementById("batchSheet").style.display = "none";
  isReview = false;
  buildQueue();
  renderQuestion();
}

function resetAllData() {
  if (!confirm("学習記録・速度履歴・リマインド予定をすべて初期化しますか？")) return;
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.startsWith(STORE_KEY)) {
      localStorage.removeItem(k);
    }
  }
  isReview = false;
  isListenMode = false;
  modeId = "priority";
  answeredTotal = 0;
  tipCursor = 0;
  document.getElementById("modeSelect").value = "priority";
  document.getElementById("homeModeSelect").value = "priority";
  buildQueue();
  refreshStats();
  showHomeScreen();
}

function isReverse() {
  return modeId === "reverse";
}

function toggleSpelling() {
  const el = document.getElementById("spellHint");
  const cur = queue[idx];
  if (!cur) return;
  if (el.style.display === "block") {
    el.style.display = "none";
  } else {
    el.textContent = cur.spelling || cur.word.split("").join(" ");
    el.style.display = "block";
  }
}

function getPreferredFemaleVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  const preferredNames = [
    "samantha", "siri", "ava", "allison", "victoria",
    "karen", "serena", "google us english", "natural", "jenny", "aria", "zira"
  ];
  const enVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));

  for (const name of preferredNames) {
    const hit = enVoices.find(v => v.name && v.name.toLowerCase().includes(name));
    if (hit) return hit;
  }
  return enVoices.find(v => v.lang === "en-US") || enVoices[0] || null;
}

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    getPreferredFemaleVoice();
  };
}

function speakText(txt, rate = 0.9, onEndCallback = null) {
  try {
    if (!txt || !("speechSynthesis" in window)) {
      if (onEndCallback) onEndCallback();
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = "en-US";
    u.rate = rate;
    u.pitch = 1.05;
    const fv = getPreferredFemaleVoice();
    if (fv) u.voice = fv;
    if (onEndCallback) {
      u.onend = onEndCallback;
      u.onerror = onEndCallback;
    }
    window.speechSynthesis.speak(u);
  } catch (e) {
    if (onEndCallback) onEndCallback();
  }
}

function speakWord() {
  const cur = queue[idx];
  if (!cur) return;
  speakText(cur.word, 0.9);
}

function speakExample() {
  const cur = queue[idx];
  if (!cur || !cur.ex) return;
  speakText(cur.ex, 0.94);
}

function updateListenButtonUI() {
  const btn = document.getElementById("btnListen");
  if (btn) {
    btn.classList.toggle("is-active", isListenMode);
    btn.textContent = isListenMode ? "聞き流し中" : "聞き流し";
  }
}

function runListenSequence() {
  const cur = queue[idx];
  if (!cur || !isListenMode) return;
  speakText(cur.word, 0.9, () => {
    if (!isListenMode) return;
    setTimeout(() => {
      if (isListenMode && cur.ex) {
        speakText(cur.ex, 0.94);
      }
    }, 350);
  });
}

function toggleListenMode() {
  isListenMode = !isListenMode;
  updateListenButtonUI();
  if (isListenMode) {
    runListenSequence();
  } else if ("speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

function openScoreboard() {
  const smap = getSpeedMap();
  const wordMap = new Map(WORDS.map(w => [w.id, w]));
  const buckets = {
    t3: { label: "3秒以内（瞬発）", ids: [], sum: 0 },
    t5: { label: "5秒以内（定着）", ids: [], sum: 0 },
    t10: { label: "10秒以内（思考）", ids: [], sum: 0 },
    over: { label: "10秒超（要反復）", ids: [], sum: 0 }
  };

  Object.entries(smap).forEach(([idStr, rec]) => {
    const id = Number(idStr);
    const t = rec.tier || classifySpeedTier(rec.lastSec || 99);
    if (buckets[t]) {
      buckets[t].ids.push(id);
      buckets[t].sum += Number(rec.lastSec || 0);
    }
  });

  const totalAnswered = Object.keys(smap).length;
  const allSecSum = Object.values(smap).reduce((acc, r) => acc + Number(r.lastSec || 0), 0);
  const avgAll = totalAnswered > 0 ? (allSecSum / totalAnswered).toFixed(1) : "-";
  const fast3Count = buckets.t3.ids.length;

  document.getElementById("scoreSummaryLine").textContent =
    `記録済み ${totalAnswered} 語 ／ 3秒以内 ${fast3Count} 語 ／ 平均 ${avgAll}s`;

  const tbody = document.getElementById("scoreTableBody");
  tbody.innerHTML = "";

  ["t3", "t5", "t10", "over"].forEach(key => {
    const b = buckets[key];
    const samples = b.ids.slice(-3).map(id => {
      const w = wordMap.get(id);
      return w ? w.word : "";
    }).filter(Boolean).join(", ");

    const avgStr = b.ids.length > 0 ? `（平均 ${(b.sum / b.ids.length).toFixed(1)}s）` : "";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><strong>${b.label}</strong></td>
      <td>${b.ids.length} 語 ${avgStr}</td>
      <td><div class="sample-words">${samples || "-"}</div></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("scoreSheet").style.display = "flex";
}

function closeScoreboard() {
  document.getElementById("scoreSheet").style.display = "none";
}

function openTipPopup(fromMenu = false) {
  tipOpenedFromMenu = fromMenu;
  const tip = STUDY_TIPS[tipCursor % STUDY_TIPS.length];
  tipCursor++;
  saveState();
  document.getElementById("tipTopic").textContent = tip.topic;
  document.getElementById("tipProblem").textContent = tip.problem;
  document.getElementById("tipAction").textContent = tip.action;
  document.getElementById("tipAuthor").textContent = tip.by;
  document.getElementById("tipSheet").style.display = "flex";
}

function closeTipAndProceed() {
  document.getElementById("tipSheet").style.display = "none";
  if (tipOpenedFromMenu) {
    tipOpenedFromMenu = false;
    return;
  }
  if (idx > 0 && idx % 10 === 0) {
    openBatchSheet();
  } else {
    renderQuestion();
  }
}

function renderQuestion() {
  if (!Array.isArray(queue) || queue.length === 0) {
    buildQueue();
  }
  if (idx >= queue.length) {
    idx = 0;
    if (modeId !== "priority") shuffle(queue);
  }
  const cur = queue[idx];
  isAnswered = false;
  saveState();

  const rev = isReverse();
  const m = MODES.find(x => x.id === modeId);
  document.getElementById("statusText").textContent = isReview ? "復習・リマインド" : (m ? m.label : "演習");
  document.getElementById("qCounter").textContent = `${idx + 1} / ${queue.length}`;
  document.getElementById("progressFill").style.width = `${((idx + 1) / queue.length) * 100}%`;

  const remindTag = cur.isRemind ? "・リマインド" : "";
  const grpTag = cur.groupLabel ? `・${cur.groupLabel}` : "";
  document.getElementById("promptSub").textContent = rev
    ? `【${cur.pos}】${grpTag}・意味から英単語を選択${remindTag}`
    : `【${cur.pos}】${grpTag}・英単語から意味を選択${remindTag}`;

  const wordEl = document.getElementById("promptWord");
  const audioBtn = document.getElementById("btnAudio");
  const spellBtn = document.getElementById("btnSpell");
  const spellHint = document.getElementById("spellHint");
  spellHint.style.display = "none";

  if (rev) {
    wordEl.className = "prompt-word is-reverse";
    wordEl.textContent = cur.mean;
    audioBtn.style.display = "none";
    spellBtn.style.display = "none";
  } else {
    wordEl.className = "prompt-word";
    wordEl.textContent = cur.word;
    audioBtn.style.display = "inline-block";
    spellBtn.style.display = "inline-block";
    if (isListenMode) {
      runListenSequence();
    } else {
      speakWord();
    }
  }

  let optionList = [];
  if (rev) {
    optionList = [cur.word, ...(cur.wordDummy || [])].slice(0, 4);
  } else {
    optionList = [cur.mean, ...(cur.dummy || [])].slice(0, 4);
  }
  while (optionList.length < 4) {
    const fallback = WORDS[(idx + optionList.length) % WORDS.length];
    const val = rev ? fallback.word : fallback.mean;
    if (!optionList.includes(val)) optionList.push(val);
  }
  shuffle(optionList);

  const box = document.getElementById("choicesBox");
  box.innerHTML = "";
  const nums = ["1", "2", "3", "4"];

  optionList.forEach((optText, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-btn";
    btn.dataset.choice = optText;
    btn.innerHTML = `<span class="choice-num">${nums[i]}</span><span>${optText}</span>`;
    btn.addEventListener("click", () => onChoose(optText, cur, btn));
    box.appendChild(btn);
  });

  document.getElementById("answerPanel").style.display = "none";
  qStart = Date.now();
}

function onChoose(picked, cur, btn) {
  if (isAnswered) return;
  isAnswered = true;

  const secNum = Math.max(0.1, (Date.now() - qStart) / 1000);
  const secStr = secNum.toFixed(1);

  document.querySelectorAll(".choice-btn").forEach(b => {
    b.disabled = true;
  });

  const rev = isReverse();
  const rightAnswer = rev ? cur.word : cur.mean;
  const ok = (picked === rightAnswer);

  if (ok) {
    btn.classList.add("is-correct");
    batchCorrect++;
  } else {
    btn.classList.add("is-wrong");
    document.querySelectorAll(".choice-btn").forEach(b => {
      if (b.dataset.choice === rightAnswer) {
        b.classList.add("is-correct");
      }
    });
  }

  answeredTotal++;

  try {
    recordSpeedHistory(cur.id, secNum);
    scheduleNextRemind(cur.id, ok);
    if (ok) {
      addCleared(cur.id);
      if (isReview) removeWrong(cur.id);
    } else {
      addWrong(cur.id);
    }
  } catch (e) {}

  const tierLabelMap = {
    t3: "3秒以内",
    t5: "5秒以内",
    t10: "10秒以内",
    over: "10秒超"
  };
  const tierTxt = tierLabelMap[classifySpeedTier(secNum)];

  const judgeEl = document.getElementById("judgeLabel");
  judgeEl.textContent = ok ? `正解（${tierTxt}）` : "不正解";
  judgeEl.className = ok ? "judge-ok" : "judge-ng";
  document.getElementById("timeLabel").textContent = `${secStr}s`;

  document.getElementById("ansWordLine").textContent = `${cur.word}  (${cur.pos})`;
  document.getElementById("ansMeaningLine").textContent = cur.mean;
  document.getElementById("ansIdiomText").textContent = cur.idioms || "";
  document.getElementById("ansParaphraseText").textContent = cur.paraphrase || "";
  document.getElementById("ansSpellText").textContent = cur.spelling || cur.word.split("").join(" ");
  document.getElementById("ansExEn").textContent = cur.ex || "";
  document.getElementById("ansExJa").textContent = cur.exJa || "";

  document.getElementById("answerPanel").style.display = "flex";

  if (rev) {
    speakWord();
  }
}

function goNext() {
  idx++;
  saveState();

  if (answeredTotal > 0 && answeredTotal % 30 === 0) {
    openTipPopup(false);
    return;
  }

  if (idx > 0 && idx % 10 === 0) {
    openBatchSheet();
  } else {
    renderQuestion();
  }
}

function openBatchSheet() {
  const blockNo = idx / 10;
  document.getElementById("sheetTitle").textContent = `第${blockNo}区切り（${idx - 9}〜${idx}問）`;
  document.getElementById("sheetScore").textContent = `${batchCorrect} / 10`;
  document.getElementById("sheetNote").textContent =
    batchCorrect >= 8
      ? "安定した定着度です。熟語と意味・例文を声に出しながら次の10問へ進みましょう。"
      : "間違えた単語は復習・リマインドに反映されています。熟語や例文を見直して次に進みましょう。";
  document.getElementById("batchSheet").style.display = "flex";
  batchCorrect = 0;
  saveState();
}

function continueBatch() {
  document.getElementById("batchSheet").style.display = "none";
  renderQuestion();
}

function closeSheetAndReview() {
  document.getElementById("batchSheet").style.display = "none";
  startReviewMode();
}
</script>
