<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共通テスト対策 情報</title>
<style>
  :root { --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --sub:#334155; --pri:#1d4ed8; --pri-bg:#dbeafe; --bdr:#cbd5e1; --ok:#15803d; --ok-bg:#dcfce7; --ng:#b91c1c; --ng-bg:#fee2e2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#090d16; --card:#111827; --text:#f8fafc; --sub:#cbd5e1; --pri:#60a5fa; --pri-bg:#1e3a8a; --bdr:#334155; --ok:#4ade80; --ok-bg:rgba(74,222,128,0.16); --ng:#f87171; --ng-bg:rgba(248,113,113,0.16); }
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
  #app { display:flex; flex-direction:column; width:100%; height:100vh; max-width:720px; margin:0 auto; padding:10px 12px; gap:8px; }
  header { display:flex; align-items:center; justify-content:space-between; min-height:46px; gap:8px; flex-shrink:0; }
  .hbtn { font-size:15px; font-weight:800; color:var(--pri); background:var(--card); border:2px solid var(--bdr); padding:7px 12px; border-radius:10px; text-decoration:none; cursor:pointer; }
  .htitle { font-size:18px; font-weight:900; text-align:center; flex:1; }
  main { flex:1; min-height:0; position:relative; display:flex; flex-direction:column; }
  .view { display:none; flex-direction:column; width:100%; height:100%; gap:8px; }
  .view.active { display:flex; }
  .card { background:var(--card); border:2px solid var(--bdr); border-radius:16px; padding:14px; display:flex; flex-direction:column; justify-content:space-between; flex:1; min-height:0; gap:10px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .sbox { background:var(--pri-bg); color:var(--pri); border-radius:12px; padding:8px; text-align:center; font-weight:800; }
  .sbox b { display:block; font-size:21px; }
  select { width:100%; min-height:46px; padding:8px 10px; font-size:16px; font-weight:700; border-radius:12px; border:2px solid var(--bdr); background:var(--card); color:var(--text); }
  .btn { width:100%; min-height:52px; border-radius:14px; font-size:17px; font-weight:900; cursor:pointer; border:2px solid transparent; display:flex; align-items:center; justify-content:center; text-decoration:none; }
  .btn-pri { background:var(--pri); color:#fff; }
  .btn-sec { background:var(--card); color:var(--text); border-color:var(--bdr); font-size:15px; min-height:46px; }
  .btn-rev { background:var(--ng-bg); color:var(--ng); border-color:var(--ng); }
  .btn-link { background:var(--pri-bg); color:var(--pri); border-color:var(--pri); font-size:15px; min-height:44px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .bar { height:8px; background:var(--bdr); border-radius:999px; overflow:hidden; }
  .fill { height:100%; width:0%; background:var(--pri); transition:width .25s; }
  .meta { display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:800; }
  .tag { background:var(--pri-bg); color:var(--pri); padding:4px 10px; border-radius:8px; }
  .qbox { background:var(--card); border:2px solid var(--bdr); border-radius:16px; padding:14px; font-size:20px; font-weight:800; line-height:1.45; max-height:36%; overflow-y:auto; }
  .opts { display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; }
  .opt { flex:1; min-height:52px; width:100%; background:var(--card); border:2px solid var(--bdr); border-radius:14px; padding:10px 14px; font-size:17px; font-weight:800; color:var(--text); text-align:left; cursor:pointer; }
  .opt.ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .opt.ng { background:var(--ng-bg); border-color:var(--ng); color:var(--ng); }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:var(--card); border:2px solid var(--pri); border-radius:18px; padding:16px; display:none; flex-direction:column; gap:8px; max-height:70%; overflow-y:auto; z-index:30; }
  .sheet.active { display:flex; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; align-items:center; justify-content:center; padding:16px; z-index:60; }
  .modal.active { display:flex; }
  .mbox { background:var(--card); border:2px solid var(--bdr); border-radius:18px; padding:18px; width:100%; max-width:460px; display:flex; flex-direction:column; gap:10px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="hbtn" href="index.html">‹ 一覧</a>
    <div class="htitle">共通テスト対策 情報</div>
    <button class="hbtn" onclick="openStats()">成績</button>
  </header>
  <main>
    <div id="v-home" class="view active">
      <div class="card">
        <div class="stats">
          <div class="sbox"><span>収録</span><b id="s-tot">0</b></div>
          <div class="sbox"><span>学習済</span><b id="s-lrn">0</b></div>
          <div class="sbox"><span>要復習</span><b id="s-rev">0</b></div>
        </div>
        <div>
          <label style="font-size:14px;font-weight:800;color:var(--sub);">領域（データ分析・セキュリティ重点）</label>
          <select id="f-cat">
            <option value="ALL">全領域</option>
            <option value="DATA">【重点】データ分析・統計</option>
            <option value="SECURITY">【重点】セキュリティ・NW</option>
            <option value="SOCIETY">情報社会・法規</option>
            <option value="DESIGN">情報デザイン・表現</option>
            <option value="PROG">プログラミング・計算</option>
          </select>
        </div>
        <div>
          <label style="font-size:14px;font-weight:800;color:var(--sub);">重要度</label>
          <select id="f-pri">
            <option value="ALL">すべて</option>
            <option value="S">★ 最重要</option>
            <option value="A">● 重要</option>
          </select>
        </div>
        <button class="btn btn-pri" onclick="startQuiz('NORMAL')">10問テスト開始</button>
        <button class="btn btn-rev" id="b-rev" style="display:none;" onclick="startQuiz('REVIEW')">間違えた問題を復習（<span id="rev-n">0</span>問）</button>
        <button class="btn btn-sec" onclick="startListen()">きくだけモード（誤答優先）</button>
        <div class="row2">
          <button class="btn btn-sec" onclick="exportProg()">進捗エクスポート</button>
          <button class="btn btn-sec" onclick="importProg()">進捗インポート</button>
        </div>
      </div>
    </div>
    <div id="v-quiz" class="view">
      <div class="bar"><div class="fill" id="p-fill"></div></div>
      <div class="meta">
        <span class="tag" id="q-cat"></span>
        <span id="q-num">1 / 10</span>
        <button class="hbtn" style="padding:4px 10px;" onclick="speak(curList[idx].q)">🔊 読上</button>
      </div>
      <div class="qbox" id="q-txt"></div>
      <div class="opts" id="opts"></div>
      <div class="sheet" id="sheet">
        <div id="sh-head" style="font-size:21px;font-weight:900;"></div>
        <div id="sh-ans" style="font-size:18px;font-weight:900;color:var(--ok);"></div>
        <div id="sh-exp" style="font-size:16px;font-weight:700;line-height:1.45;color:var(--sub);"></div>
        <a id="sh-ref" class="btn btn-link" href="#" target="_blank" rel="noopener noreferrer">📊 図解・解説ページを開く ↗</a>
        <div class="row2">
          <button class="btn btn-sec" onclick="speak(curList[idx].options[curList[idx].ans] + '。' + curList[idx].exp)">🔊 解説</button>
          <button class="btn btn-pri" onclick="nextQ()">次へ ›</button>
        </div>
      </div>
    </div>
    <div id="v-listen" class="view">
      <div class="card" style="text-align:center;">
        <div id="l-head" style="font-size:18px;font-weight:900;color:var(--pri);">きくだけモード</div>
        <div id="l-body" style="font-size:20px;font-weight:800;line-height:1.5;flex:1;display:flex;align-items:center;justify-content:center;"></div>
        <button class="btn btn-sec" onclick="stopListen()">停止して戻る</button>
      </div>
    </div>
  </main>
</div>
<div class="modal" id="m-res">
  <div class="mbox">
    <div style="font-size:20px;font-weight:900;">10問完了</div>
    <div id="r-sc" style="font-size:32px;font-weight:900;color:var(--pri);"></div>
    <button class="btn btn-pri" onclick="closeRes('NEXT')">次の10問へ</button>
    <button class="btn btn-rev" id="r-rev" onclick="closeRes('REV')">間違えた問題を復習</button>
    <button class="btn btn-sec" onclick="closeRes('HOME')">ホームへ</button>
  </div>
</div>
<div class="modal" id="m-adv">
  <div class="mbox">
    <div style="font-size:19px;font-weight:900;">💡 30問達成アドバイス</div>
    <div id="adv-txt" style="font-size:16px;font-weight:700;text-align:left;line-height:1.5;color:var(--sub);"></div>
    <button class="btn btn-pri" onclick="document.getElementById('m-adv').classList.remove('active')">続ける</button>
  </div>
</div>
<div class="modal" id="m-st">
  <div class="mbox">
    <div style="font-size:19px;font-weight:900;">成績サマリー</div>
    <div id="st-body" style="font-size:16px;font-weight:700;text-align:left;line-height:1.6;"></div>
    <button class="btn btn-sec" onclick="document.getElementById('m-st').classList.remove('active')">閉じる</button>
  </div>
</div>
<script>
const BANK = [{"id": "DATA-01", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "データ分析における「質的データ」の例として最も適切なものはどれか。", "options": ["血液型やアンケートの賛否", "試験の点数や気温", "商品の販売個数", "通学にかかる所要時間"], "ans": 0, "exp": "血液型や賛否などのカテゴリー・順位を表すデータは「質的データ」。得点・気温・個数・時間など数値を測定するデータは「量的データ」です。", "refUrl": "https://juken7.net/jouhou1/yougo/", "refLabel": "用語集（データ分析）を見る"}, {"id": "DATA-02", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "データに極端な「外れ値」が含まれるとき、全体の中心傾向を表す指標として平均値より適しているのはどれか。", "options": ["中央値（メジアン）", "分散", "標準偏差", "範囲（最大値－最小値）"], "ans": 0, "exp": "平均値は極端な外れ値に大きく引っ張られますが、データを大きさ順に並べた中央の値である「中央値」は外れ値の影響を受けにくい特徴があります。", "refUrl": "https://juken7.net/jouhou1/yougo/", "refLabel": "代表値・分布の解説を見る"}, {"id": "DATA-03", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "箱ひげ図において、箱の縦幅（長さ）が表す統計量はどれか。", "options": ["四分位範囲（IQR：第3四分位数 － 第1四分位数）", "最大値と最小値の差", "平均値と最頻値の差", "分散の平方根"], "ans": 0, "exp": "箱の下端が第1四分位数（Q1）、上端が第3四分位数（Q3）で、箱の長さはデータの中央50%の散らばりを示す「四分位範囲（IQR）」を表します。", "refUrl": "https://www.dnc.ac.jp/kyotsu/kakomondai/", "refLabel": "大学入試センター過去問ページ"}, {"id": "DATA-04", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "2つの変数間の相関係数 r について、正しい記述はどれか。", "options": ["r は -1 以上 1 以下の値をとり、0 に近いほど直線的な相関が弱い", "r は 0 以上 1 以下の値をとり、1 に近いほど因果関係が確定する", "r が正の値のとき、一方が増えるともう一方は必ず減少する", "相関係数が 0.8 なら、必ず一方が原因で他方が結果である"], "ans": 0, "exp": "相関係数 r は -1 以上 1 以下の範囲をとります。「相関関係があっても因果関係があるとは限らない」点は共通テストの頻出ポイントです。", "refUrl": "https://juken7.net/jouhou1/yougo/", "refLabel": "相関・データ活用の解説を見る"}, {"id": "DATA-05", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "直接の因果関係がない2つの事象に、共通の背景要因（潜伏変数・交絡因子）が働くことで生じる見かけ上の相関を何と呼ぶか。", "options": ["擬似相関", "過学習", "標準化", "最頻値"], "ans": 0, "exp": "気温上昇によってアイスクリームの売上と水難事故件数の両方が増えるような見かけ上の相関を「擬似相関」と呼びます。", "refUrl": "https://www.johoichi.com/%E4%B8%80%E5%95%8F%E4%B8%80%E7%AD%94/", "refLabel": "一問一答（データ活用）を見る"}, {"id": "DATA-06", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "各データの「平均値との差（偏差）」を2乗して平均した散らばりの指標はどれか。", "options": ["分散", "中央値", "四分位数", "相関係数"], "ans": 0, "exp": "偏差の2乗平均が「分散」です。分散の正の平方根をとると、元のデータと同じ単位の「標準偏差」になります。", "refUrl": "https://juken7.net/jouhou1/yougo/", "refLabel": "分散・標準偏差の解説を見る"}, {"id": "DATA-07", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "分散の正の平方根をとり、元のデータと単位をそろえてばらつきを表す指標はどれか。", "options": ["標準偏差", "四分位範囲", "最頻値", "共分散"], "ans": 0, "exp": "標準偏差は分散の正の平方根であり、元のデータと同じ単位で散らばりの大きさを評価できます。", "refUrl": "https://juken7.net/jouhou1/yougo/", "refLabel": "分散・標準偏差の解説を見る"}, {"id": "DATA-08", "cat": "DATA", "catName": "データ分析・統計", "priority": "A", "q": "散布図のデータ傾向を直線 y = ax + b で表し、一方の変数から他方の値を予測する分析手法はどれか。", "options": ["単回帰分析（回帰直線）", "クラスター分析", "データクレンジング", "ハッシュ化"], "ans": 0, "exp": "2つの数値変数の線形関係を直線（回帰直線）に当てはめて傾向を捉えたり予測したりする手法が単回帰分析です。", "refUrl": "https://www.johoichi.com/%E4%B8%80%E5%95%8F%E4%B8%80%E7%AD%94/", "refLabel": "一問一答（データ活用）を見る"}, {"id": "DATA-09", "cat": "DATA", "catName": "データ分析・統計", "priority": "A", "q": "Web画面や施策などでA案とB案をランダムに割り当てて比較し、改善効果を検証する手法はどれか。", "options": ["A/Bテスト", "パレート分析", "主成分分析", "正規化"], "ans": 0, "exp": "条件を1点だけ変えたA案・B案を並行して比較検証し、クリック率や申込率などの違いを確かめる手法がA/Bテストです。", "refUrl": "https://juken7.net/jouhou1/yougo/", "refLabel": "用語集を確認する"}, {"id": "DATA-10", "cat": "DATA", "catName": "データ分析・統計", "priority": "A", "q": "欠損値や表記ゆれ、異常値を含む生データを分析に適した状態に整える作業を何と呼ぶか。", "options": ["データクレンジング（前処理）", "暗号化", "デジタル署名", "標本化"], "ans": 0, "exp": "全角・半角の統一、欠損値や誤入力・外れ値の確認と修正など、分析の前に行うデータ整備がデータクレンジングです。", "refUrl": "https://juken7.net/jouhou1/yougo/", "refLabel": "用語集を確認する"}, {"id": "DATA-11", "cat": "DATA", "catName": "データ分析・統計", "priority": "A", "q": "2つの変数がそれぞれの平均値からどの程度一緒に変動するかを表す統計量はどれか。", "options": ["共分散", "中央値", "最頻値", "範囲"], "ans": 0, "exp": "2変数の「偏差の積の平均」が共分散です。共分散を各変数の標準偏差の積で割ると相関係数になります。", "refUrl": "https://juken7.net/jouhou1/yougo/", "refLabel": "用語集を確認する"}, {"id": "DATA-12", "cat": "DATA", "catName": "データ分析・統計", "priority": "A", "q": "データの分布をいくつかの階級（区間）に分け、各階級に含まれる度数（件数）を棒グラフで表したものはどれか。", "options": ["ヒストグラム", "箱ひげ図", "散布図", " function refreshHome() {
  document.getElementById('s-tot').textContent = BANK.length;

function prio(q, now) {
  const p = prog.items[q.id];
  if (!p || !p.n) return 1000 + Math.random() * 20;
  return 100 + (p.ng ? 500 : 0) + Math.min(((now - (p.t || 0)) / 3600000) * 5, 200) + (1 - p.ok / p.n) * 200 + Math.random() * 20;
}
function startQuiz(mode) {
  const cat = document.getElementById('f-cat').value;
  const pri = document.getElementById('f-pri').value;
  let pool = BANK.filter(q => (cat === 'ALL' || q.cat === cat) && (pri === 'ALL' || q.priority === pri));
  if (mode === 'REVIEW') {
    pool = pool.filter(q => { const p = prog.items[q.id]; return p && (p.ng || (p.ok / p.n < 0.7)); });
  }
  if (!pool.length) { alert("対象問題がありません。"); return; }
  const now = Date.now();

}
function openStats() {
  document.getElementById('st-body').innerHTML = `累計解答数：<b>${prog.solved || 0}</b> 回<br>収録問題数：<b>${BANK.length}</b> 問`;
  document.getElementById('m-st').classList.add('active');
}
function exportProg() {
  const txt = JSON.stringify(prog);
  navigator.clipboard?.writeText(txt).then(() => alert("進捗コードをコピーしました。")).catch(() => prompt("コピーしてください:", txt));
}
function importProg() {
  const txt = prompt("進捗コードを貼り付けてください:");
  if (!txt) return;
  try { const d = JSON.parse(txt); if (d.items) { prog = d; save(); refreshHome(); alert("復元しました。"); } }
  catch { alert("形式が不正です。"); }
}
function speak(txt, cb) {
  if (!('speechSynthesis' in window)) { if (cb) cb(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'ja-JP';
  if (cb) u.onend = cb;
  window.speechSynthesis.speak(u);
}
function startListen() {
  listening = true;
  showView('v-listen');
  let list = BANK.filter(q => prog.items[q.id]?.ng);
  if (!list.length) list = [...BANK];
  let i = 0;
  const step = () => {
    if (!listening) return;
    const q = list[i % list.length];
    document.getElementById('l-head').textContent = `問題（${q.catName}）`;
    document.getElementById('l-body').textContent = q.q;
    speak("問題。" + q.q, () => {
      if (!listening) return;
      timer = setTimeout(() => {
        if (!listening) return;
        const ans = q.options[q.ans];
        document.getElementById('l-head').textContent = "解答と解説";
        document.getElementById('l-body').textContent = `正解：${ans}

${q.exp}`;
        speak(`正解は、${ans}。${q.exp}`, () => {
          if (!listening) return;
          i++;
          timer = setTimeout(step, 1800);
        });
      }, 1200);
    });
  };
  step();
}
function stopListen() {
  listening = false;
  clearTimeout(timer);
  window.speechSynthesis?.cancel();
  showView('v-home');
}
refreshHome();
</script>
