<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共通テスト対策 情報</title>
<style>
  :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --sub:#475569; --pri:#2563eb; --pri-bg:#dbeafe; --bdr:#e2e8f0; --ok:#16a34a; --ng:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --sub:#94a3b8; --pri:#3b82f6; --pri-bg:#1e3a8a; --bdr:#334155; --ok:#22c55e; --ng:#ef4444; }
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; padding:8px 12px; }
  header { display:flex; align-items:center; justify-content:space-between; height:42px; border-bottom:1px solid var(--bdr); flex-shrink:0; }
  .hbtn { font-size:12px; font-weight:700; color:var(--pri); background:none; border:1px solid var(--bdr); padding:5px 9px; border-radius:8px; text-decoration:none; cursor:pointer; }
  .htitle { font-size:15px; font-weight:800; }
  main { flex:1; min-height:0; position:relative; margin-top:6px; }
  .view { display:none; flex-direction:column; height:100%; }
  .view.active { display:flex; }
  .card { background:var(--card); border:1px solid var(--bdr); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; flex:1; justify-content:center; }
  .stats { display:flex; justify-content:space-around; background:var(--pri-bg); color:var(--pri); padding:8px; border-radius:8px; font-size:12px; font-weight:700; }
  select { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--bdr); background:var(--card); color:var(--text); font-size:13px; }
  .btn { border:none; border-radius:10px; padding:11px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-pri { background:var(--pri); color:#fff; }
  .btn-sec { background:transparent; color:var(--text); border:1px solid var(--bdr); }
  .bar { height:6px; background:var(--bdr); border-radius:3px; overflow:hidden; margin-bottom:6px; }
  .bar-fill { height:100%; background:var(--pri); width:0%; transition:width .25s; }
  .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:6px; }
  .tag { background:var(--pri-bg); color:var(--pri); padding:2px 6px; border-radius:4px; font-weight:700; }
  .qbox { background:var(--card); border:1px solid var(--bdr); border-radius:12px; padding:12px; font-size:14px; font-weight:700; line-height:1.45; max-height:36%; overflow-y:auto; }
  .opts { display:flex; flex-direction:column; gap:7px; margin-top:8px; flex:1; }
  .opt { background:var(--card); border:1.5px solid var(--bdr); border-radius:10px; padding:8px 10px; font-size:13px; font-weight:600; color:var(--text); text-align:left; cursor:pointer; line-height:1.3; }
  .opt.ok { border-color:var(--ok); background:rgba(34,197,94,.15); color:var(--ok); }
  .opt.ng { border-color:var(--ng); background:rgba(239,68,68,.15); color:var(--ng); }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:var(--card); border-top:2px solid var(--bdr); border-radius:14px 14px 0 0; padding:12px; display:none; flex-direction:column; gap:6px; max-height:56%; overflow-y:auto; z-index:20; }
  .sheet.active { display:flex; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal.active { display:flex; }
  .mbox { background:var(--card); border:1px solid var(--bdr); border-radius:14px; padding:16px; width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="hbtn" href="index.html">‹ 一覧</a>
    <div class="htitle">共通テスト対策 情報</div>
    <button class="hbtn" onclick="openStats()">成績</button>
  </header>
  <main>
    <div id="v-home" class="view active">
      <div class="card">
        <div class="stats">
          <span>収録: <b id="s-tot">0</b>問</span>
          <span>済: <b id="s-lrn">0</b></span>
          <span>要復習: <b id="s-rev">0</b></span>
        </div>
        <div>
          <label style="font-size:11px;font-weight:700;color:var(--sub);">領域</label>
          <select id="f-cat">
            <option value="ALL">全領域</option>
            <option value="DATA">【重点】データ分析・統計</option>
            <option value="SECURITY">【重点】セキュリティ・ネットワーク</option>
            <option value="SOCIETY">情報社会・入試傾向</option>
            <option value="DESIGN">情報デザイン・表現</option>
            <option value="PROG">プログラミング・計算</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px;font-weight:700;color:var(--sub);">重要度</label>
          <select id="f-pri">
            <option value="ALL">すべて</option>
            <option value="S">最重要</option>
            <option value="A">重要</option>
          </select>
        </div>
        <button class="btn btn-pri" onclick="startQuiz('NORMAL')">10問スタート</button>
        <button class="btn btn-sec" id="b-rev" style="display:none;color:var(--ng);border-color:var(--ng);" onclick="startQuiz('REVIEW')">誤答を復習 (<span id="rev-n">0</span>)</button>
        <button class="btn btn-sec" onclick="startListen()">きくだけモード（音声）</button>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sec" style="flex:1;font-size:12px;" onclick="exportProg()">進捗エクスポート</button>
          <button class="btn btn-sec" style="flex:1;font-size:12px;" onclick="importProg()">進捗インポート</button>
        </div>
      </div>
    </div>
    <div id="v-quiz" class="view">
      <div class="bar"><div class="bar-fill" id="p-fill"></div></div>
      <div class="meta">
        <span class="tag" id="q-cat"></span>
        <span id="q-num" style="font-weight:700;">1 / 10</span>
        <button class="hbtn" style="padding:2px 7px;" onclick="speak(curList[idx].q)">🔊</button>
      </div>
      <div class="qbox" id="q-txt"></div>
      <div class="opts" id="opts"></div>
      <div class="sheet" id="sheet">
        <div id="sh-title" style="font-weight:800;font-size:15px;"></div>
        <div id="sh-exp" style="font-size:12px;color:var(--sub);line-height:1.4;"></div>
        <button class="btn btn-pri" onclick="nextQ()">次へ</button>
      </div>
    </div>
    <div id="v-listen" class="view">
      <div class="card" style="align-items:center;text-align:center;">
        <div id="l-head" style="font-weight:800;color:var(--pri);">きくだけモード</div>
        <div id="l-body" style="font-size:14px;line-height:1.5;"></div>
        <button class="btn btn-sec" style="width:140px;" onclick="stopListen()">停止して戻る</button>
      </div>
    </div>
  </main>
</div>
<div class="modal" id="m-res">
  <div class="mbox">
    <div style="font-weight:800;font-size:17px;">10問完了</div>
    <div id="r-sc" style="font-size:28px;font-weight:900;color:var(--pri);"></div>
    <button class="btn btn-pri" onclick="closeRes('NEXT')">次の10問へ</button>
    <button class="btn btn-sec" id="r-rev" onclick="closeRes('REV')">間違えた問題を復習</button>
    <button class="btn btn-sec" onclick="closeRes('HOME')">ホームへ</button>
  </div>
</div>
<div class="modal" id="m-adv">
  <div class="mbox">
    <div style="font-weight:800;font-size:16px;">💡 30問達成アドバイス</div>
    <div id="adv-txt" style="font-size:13px;text-align:left;line-height:1.5;color:var(--sub);"></div>
    <button class="btn btn-pri" onclick="document.getElementById('m-adv').classList.remove('active')">続ける</button>
  </div>
</div>
<div class="modal" id="m-st">
  <div class="mbox">
    <div style="font-weight:800;font-size:16px;">成績サマリー</div>
    <div id="st-body" style="font-size:13px;text-align:left;line-height:1.6;"></div>
    <button class="btn btn-sec" onclick="document.getElementById('m-st').classList.remove('active')">閉じる</button>
  </div>
</div>
<script>
const BANK = [{"id": "DATA-001", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "データ分析における「質的データ」の例として最も適切なものはどれか。", "options": ["血液型やアンケートの賛否", "試験の点数や気温", "商品の売上個数", "通学にかかる所要時間"], "ans": 0, "exp": "【尺度水準】血液型や賛否は分類・順序を表す質的データ。点数・気温・売上・時間は量的データです。"}, {"id": "DATA-002", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "極端な外れ値が含まれるデータで、平均値よりも全体の代表値として適している指標はどれか。", "options": ["中央値（メジアン）", "最頻値（モード）", "分散", "標準偏差"], "ans": 0, "exp": "【中央値】昇順で並べた中央の値であり、外れ値の影響を受けにくい指標です。"}, {"id": "DATA-003", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "箱ひげ図において、箱の「長さ（幅）」が表す統計量はどれか。", "options": ["四分位範囲（IQR：第3四分位数 － 第1四分位数）", "全データの最大値と最小値の差", "平均値と標準偏差の差", "中央値の2乗"], "ans": 0, "exp": "【箱ひげ図】箱の下端は第1四分位数（Q1）、上端は第3四分位数（Q3）で、箱の長さは中央50%の散らばり（IQR）を表します。"}, {"id": "DATA-004", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "2変数間の相関係数 r について正しい説明はどれか。", "options": ["rは -1 以上 1 以下の値をとり、0に近いほど直線的な相関がない", "rは 0 以上 1 以下の値をとり、1に近いほど因果関係がある", "rが正ならば一方が増えるともう一方は必ず減る", "相関係数が高ければ必ず因果関係がある"], "ans": 0, "exp": "【相関係数】-1 以上 1 以下の値をとります。「相関関係があっても因果関係があるとは限らない」点に注意します。"}, {"id": "DATA-005", "cat": "DATA", "catName": "データ分析・統計", "priority": "S", "q": "「アイスの売上」と「水難事故件数」に正の相関があるとき、気温上昇のような共通要因で生じる見かけ上の相関を何と呼ぶか。", "options": ["擬似相関（交絡因子・潜伏変数による）", "過学習", "第1種の過誤", "回帰残差"], "ans": 0, "exp": "【擬似相関】直接の因果関係がない2変数に、第3の要因（潜伏変数・交絡因子）が影響して生じる見かけ上の相関です。"}, {"id": "DATA-006", "cat": "DATA", "catName": "データ分析・統計", "priority": "A", "q": "各データの「平均との差（偏差）」の2乗の平均値を何と呼ぶか。", "options": ["分散", "標準偏差", "共分散", "変動係数"], "ans": 0, "exp": "【分散と標準偏差】偏差の2乗平均が分散、その正の平方根が標準偏差です。"}, {"id": "DATA-007", "cat": "DATA", "catName": "データ分析・統計", "priority": "A", "q": "散布図上の点群に直線 y = ax + b を当てはめ、一方の変数から他方を予測する手法はどれか。", "options": ["単回帰分析（回帰直線）", "主成分分析", "クラスター分析", "ヒストグラム作成"], "ans": 0, "exp": "【単回帰分析】2変数間の線形関係（回帰直線）をモデル化し、予測などに活用します。"}, {"id": "SEC-001", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "S", "q": "暗号化と復号に「共通の同一鍵」を使用する暗号方式はどれか。", "options": ["共通鍵暗号方式（AESなど）", "公開鍵暗号方式（RSAなど）", "ハッシュ関数", "パリティチェック"], "ans": 0, "exp": "【共通鍵暗号】処理が高速ですが、相手に安全に鍵を届ける「鍵配送問題」があります。"}, {"id": "SEC-002", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "S", "q": "公開鍵暗号方式を用いた「デジタル署名」において、送信者が署名を作成する際に用いる鍵はどれか。", "options": ["送信者の秘密鍵", "送信者の公開鍵", "受信者の秘密鍵", "受信者の公開鍵"], "ans": 0, "exp": "【デジタル署名】送信者の秘密鍵で署名し、受信者が送信者の公開鍵で検証することで、なりすましと改ざんを検知します。"}, {"id": "SEC-003", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "S", "q": "公開鍵暗号方式を用いて、受信者だけが読めるように暗号文を作る際に暗号化に使う鍵はどれか。", "options": ["受信者の公開鍵", "受信者の秘密鍵", "送信者の公開鍵", "認証局の秘密鍵"], "ans": 0, "exp": "【暗号化通信】受信者の公開鍵で暗号化すれば、対応する秘密鍵を持つ受信者本人のみが復号できます。"}, {"id": "SEC-004", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "S", "q": "ファイルを暗号化して使えなくし、解除と引き換えに身代金を要求するマルウェアはどれか。", "options": ["ランサムウェア", "スパイウェア", "アドウェア", "ルートキット"], "ans": 0, "exp": "【ランサムウェア】定期的なバックアップやOS・ソフトの更新、不審な添付ファイルを開かないことが重要です。"}, {"id": "SEC-005", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "S", "q": "実在の組織を装ったメールやメッセージから偽サイトへ誘導し、認証情報を盗み取る攻撃はどれか。", "options": ["フィッシング（Phishing）", "ブルートフォース攻撃", "SQLインジェクション", "DDoS攻撃"], "ans": 0, "exp": "【フィッシング】URLの確認や多要素認証・パスキーの導入が有効な対策となります。"}, {"id": "SEC-006", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "S", "q": "「パスワード（知識）」と「ワンタイムパスコード（所持）」を組み合わせた認証はどれか。", "options": ["二要素認証（多要素認証）", "シングルサインオン", "平文認証", "MACアドレス認証"], "ans": 0, "exp": "【二要素認証】異なる2つの認証要素を組み合わせることで認証強度を高めます。"}, {"id": "SEC-007", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "A", "q": "ドメイン名とIPアドレスを対応づけて解決するインターネット上の仕組みはどれか。", "options": ["DNS（Domain Name System）", "DHCP", "ARP", "SMTP"], "ans": 0, "exp": "【DNS】ドメイン名からIPアドレスを検索・解決します。"}, {"id": "SEC-008", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "A", "q": "Web通信をTLS/SSLで暗号化し、盗聴や改ざんを防ぐプロトコルはどれか。", "options": ["HTTPS", "HTTP", "FTP", "Telnet"], "ans": 0, "exp": "【HTTPS】HTTP通信を暗号化し、サーバ証明書によって通信相手の正当性も確認します。"}, {"id": "SOC-001", "cat": "SOCIETY", "catName": "情報社会・入試傾向", "priority": "S", "q": "日本の著作権法において、著作権が発生するタイミングとして正しいものはどれか。", "options": ["著作物を創作した時点で自動的に発生する（無方式主義）", "文化庁へ登録しないと発生しない", "出版・公開した時点で初めて発生する", "©表記を付けないと保護されない"], "ans": 0, "exp": "【無方式主義】創作と同時に権利が発生します。適法な引用には出所の明示が必要です。"}, {"id": "DES-001", "cat": "DESIGN", "catName": "情報デザイン・表現", "priority": "S", "q": "アナログ音声のデジタル化における「標本化・量子化・符号化」の正しい順序はどれか。", "options": ["標本化 → 量子化 → 符号化", "量子化 → 標本化 → 符号化", "符号化 → 量子化 → 標本化", "標本化 → 符号化 → 量子化"], "ans": 0, "exp": "【A/D変換】時間分割（標本化）→ 振幅の段階近似（量子化）→ 2進数化（符号化）の順です。"}, {"id": "DES-002", "cat": "DESIGN", "catName": "情報デザイン・表現", "priority": "S", "q": "標本化定理によれば、元のアナログ波形を再現するために必要なサンプリング周波数は、最大周波数の何倍以上か。", "options": ["2倍以上", "1/2倍以上", "3倍以上", "10倍以上"], "ans": 0, "exp": "【標本化定理】最大周波数の2倍以上のサンプリング周波数が必要です。"}, {"id": "PRG-001", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "共通テスト「情報Ⅰ」のプログラミング問題（第3問）の対策として最も重要な学習法はどれか。", "options": ["共通テスト用プログラム表記を1行ずつ追い、変数の値変化を表でトレースする", "特定の汎用言語の細かいライブラリ暗記だけを優先する", "問題文の条件を読まずにコードの形だけで推測する", "配列の添字やループ終了条件を確認せずに解答する"], "ans": 0, "exp": "【共テプログラミング対策】共通テスト独自のプログラム表記を1行ずつトレースし、変数の更新や条件分岐・配列の添字を正確に追うことが得点につながります。"}, {"id": "PRG-002", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "整列済み配列の中央要素と比較し、探索範囲を毎回半分に絞り込む探索アルゴリズムはどれか。", "options": ["二分探索（バイナリサーチ）", "線形探索", "バブルソート", "選択ソート"], "ans": 0, "exp": "【二分探索】整列済みデータに対して高速に探索できます。"}, {"id": "SRC-5-001", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「会員のみ表示 ：「 ⭐ 」は3～5冊に掲載、「 ⭐ 」は6～8冊に掲載、「 🌟 」は9冊以上に掲載されている用語です。」", "options": ["教科書別用語集", "高校「情報Ⅰ」用語集", "コンピュータの用語一覧", "TechTerms.com (英語) 「Computer」"], "ans": 0, "exp": "【参照：https://e-words.jp/p/e-h1-list.html】正解は「教科書別用語集」です。"}, {"id": "SRC-5-002", "cat": "SECURITY", "catName": "セキュリティ・NW", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「高等学校「情報Ⅰ」(情報1)の教科書に含まれる用語の一覧です。大学入試共通テスト「情報Ⅰ」に必要な重要語句を網羅しています。教科書別の用語一覧も公開しています。会員になると各用語の掲載教科書数も見ることができます。」", "options": ["高校「情報Ⅰ」用語集", "Techopedia (英語) 「Computer」", "コンピュータの構成", "NTT西日本 ICT用語集 「ハードウェア」"], "ans": 0, "exp": "【参照：https://e-words.jp/p/e-h1-list.html】正解は「高校「情報Ⅰ」用語集」です。"}, {"id": "SRC-5-003", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「高校「情報Ⅰ」用語集の「コンピュータとプログラミング」分野(159語)。 高等学校「情報Ⅰ」(情報1)の教科書に含まれる用語の一覧です。大学入試共通テスト「情報Ⅰ」に必要な重要語句を網羅しています。教科書別の用語一覧も公開しています。会員になると各用語の掲載教科書数も見ることができます。」", "options": ["高校「情報Ⅰ」用語集", "コンピュータの構成", "EdTechZine 用語集 「ハードウェア」", "ハードウェア 【hardware】"], "ans": 0, "exp": "【参照：https://e-words.jp/p/e-h1-list-03.html】正解は「高校「情報Ⅰ」用語集」です。"}, {"id": "SRC-5-005", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「TechTerms.com (英語)」", "options": ["TechTerms.com (英語) 「Computer」", "EdTechZine 用語集 「ハードウェア」", "入力・出力", "コンピュータの五大装置"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF.html】正解は「TechTerms.com (英語) 「Computer」」です。"}, {"id": "SRC-5-006", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「WhatIs.com (英語)」", "options": ["WhatIs.com (英語) 「computer」", "PC Magazine (英語) 「hardware」", "Techopedia (英語) 「Control Unit」", "プロセッサ内部の記憶装置"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF.html】正解は「WhatIs.com (英語) 「computer」」です。"}, {"id": "SRC-5-007", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「Techopedia (英語)」", "options": ["Techopedia (英語) 「Computer」", "概要", "ノイマン型コンピュータ", "プロセッサ内部の記憶装置"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF.html】正解は「Techopedia (英語) 「Computer」」です。"}, {"id": "SRC-5-008", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「PC Magazine (英語)」", "options": ["PC Magazine (英語) 「computer」", "入力・出力", "概要", "コンピュータの五大装置"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF.html】正解は「PC Magazine (英語) 「computer」」です。"}, {"id": "SRC-5-009", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「歴史的には手回しで歯車などを駆動する機械式の自動計算機なども存在したが、現代でコンピュータと呼ばれる機械は一般に、 マイクロプロセッサ （ CPU /MPU）や 半導体メモリ などの半導体集積回路（ IC チップ）を中心に構成され、記憶装置に記録された オペレーティングシステム （OS）や アプリケーションソフト といった コンピュータプログラム （ソフトウェア）を実行するものを指す。」", "options": ["概要", "Techopedia (英語) 「Control Unit」", "ストレージ （外部記憶装置）", "ケータイ用語の基礎知識 「メモリー」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF.html】正解は「概要」です。"}, {"id": "SRC-5-010", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「一般的なコンピュータは、プログラムの実行状況や各装置の状態を制御する「 制御装置 」、 データ の計算や加工を行う「 演算装置 」、データを記録する「記憶装置」、人間や他の機器など外界との情報のやり取りを行う「 入力装置 」および「 出力装置 」などで構成される。この五つの要素を「 コンピュータの五大装置 」（五大機能）と呼ぶこともある。」", "options": ["コンピュータの構成", "概要", "ストレージ （外部記憶装置）", "imidas 時事用語事典 「メモリー」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF.html】正解は「コンピュータの構成」です。"}, {"id": "SRC-5-012", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「コンピュータの五大装置」", "options": ["コンピュータの五大装置", "概要", "マザーボードの規格", "TechTerms.com (英語) 「Mainframe」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%8F%E3%83%BC%E3%83%89%E3%82%A6%E3%82%A7%E3%82%A2.html】正解は「コンピュータの五大装置」です。"}, {"id": "SRC-5-013", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「NTT西日本 ICT用語集」", "options": ["NTT西日本 ICT用語集 「ハードウェア」", "概要", "マザーボードの規格", "メインフレーム 【mainframe】 大型汎用機"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%8F%E3%83%BC%E3%83%89%E3%82%A6%E3%82%A7%E3%82%A2.html】正解は「NTT西日本 ICT用語集 「ハードウェア」」です。"}, {"id": "SRC-5-014", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「エリートネットワーク ビジネス用語集」", "options": ["エリートネットワーク ビジネス用語集 「ハードウェア」", "ストレージ", "ケータイ用語の基礎知識 「メモリー」", "NTT西日本 ICT用語集 「量子コンピューター」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%8F%E3%83%BC%E3%83%89%E3%82%A6%E3%82%A7%E3%82%A2.html】正解は「エリートネットワ する用語・概念として最も適切なものはどれか。\n「記憶装置はプログラムやデータを保存する装置で、当座の使用のため一時的に保存することができる主記憶装置（ メインメモリ ）やCPU内部の レジスタ および キャッシュメモリ 、永続的な保管のために用いる 補助記憶装置 （外部記憶装置/ストレージ）に分類される。」", "options": ["記憶", "ケータイ用語の基礎知識 「メモリー」", "imidas 時事用語事典 「ストレージ」", "@IT Linux基本コマンドTips 「cd」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF%E3%81%AE%E4%BA%94%E5%A4%A7%E8%A3%85%E7%BD%AE.html】正解は「記憶」です。"}, {"id": "SRC-5-025", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「コンピュータの五大装置とは、コンピュータのハードウェアを構成する主要な装置を5つに分類したもの。制御装置、演算装置、記憶装置、入力装置、出力装置の5つ。それぞれの機能(制御、演算、記憶、入力、出力)を指して「五大機能」と呼ぶこともある。制御装置はプログラムに記述された命令の解釈・実行と他の装置の制御を行い、演算装置は算…」", "options": ["コンピュータの五大装置", "PC Magazine (英語) 「main memory」", "TechEyesOnline 計測関連用語集 「HDD」", "Q2. 共通テストの情報ⅠはDNCLで出題されますか？"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF%E3%81%AE%E4%BA%94%E5%A4%A7%E8%A3%85%E7%BD%AE.html】正解は「コンピュータの五大装置」です。"}, {"id": "SRC-5-027", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「ドットインパクトプリンタ」", "options": ["ドットインパクトプリンタ", "概要", "接続方式", "共通テスト情報Ⅰの参考書は何を選べばいいか？"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E5%88%B6%E5%BE%A1%E8%A3%85%E7%BD%AE.html】正解は「ドットインパクトプリンタ」です。"}, {"id": "SRC-5-028", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「ノイマン型コンピュータ」", "options": ["ノイマン型コンピュータ", "エリートネットワーク ビジネス用語集 「メインフレーム」", "クラウドWatch データセンター用語集 「SSD」", "まとめ"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E5%88%B6%E5%BE%A1%E8%A3%85%E7%BD%AE.html】正解は「ノイマン型コンピュータ」です。"}, {"id": "SRC-5-030", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「コンピュータを構成する装置のうち、他の装置の制御を行うものを制御装置と呼ぶ。 演算装置 、記憶装置、 入力装置 、 出力装置 と合わせて コンピュータの五大装置 という。」", "options": ["概要", "コンピュータプログラム", "共通テスト情報Ⅰのプログラミングはどんな問題？", "コンピュータの五大装置"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E5%88%B6%E5%BE%A1%E8%A3%85%E7%BD%AE.html】正 はどれか。\n「装置の寸法や接続仕様をハードディスクに揃え、内部の記憶媒体を フラッシュメモリ に置き換えた製品は SSD （Solid State Drive）と呼ばれ、ハードディスクの代替として近年急速に浸透している。」", "options": ["SSDへの置き換え", "コンピュータの用語一覧", "概要", "クラウドWatch データセンター用語集 「SSD」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%8F%E3%83%BC%E3%83%89%E3%83%87%E3%82%A3%E3%82%B9%E3%82%AF.html】正解は「SSDへの置き換え」です。"}, {"id": "SRC-5-134", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「コンピュータ本体に内蔵されるハードディスクの場合、接続 インターフェース として初期には IDE / ATA （パソコン向け）や SCSI （サーバ・ ワークステーション 向け）が、2000年代以降は SATA （Serial ATA）が主に用いられている。独自の筐体を持ちケーブルでコンピュータと繋ぐ外付けの装置もあり、 USB や IEEE 1394 、 eSATA などの規格で接続される。」", "options": ["接続方式", "Techopedia (英語) 「Computer」", "メモリ 【memory】", "ITパスポート用語辞典 「フラッシュメモリ」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%8F%E3%83%BC%E3%83%89%E3%83%87%E3%82%A3%E3%82%B9%E3%82%AF.html】正解は「接続方式」です。"}, {"id": "SRC-5-135", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「ハードディスク（HDD）とは、コンピュータなどの代表的なストレージ(外部記憶装置)の一つで、薄くて硬い円盤(ディスク)の表面に塗布した磁性体の磁化状態を変化させてデータを記録するもの。一台あたりの容量が大きく容量あたりの単価が安いため、パソコンなどに内蔵されるストレージとして標準的な存在となっている。装置内にはガラスや…」", "options": ["ハードディスク 【HDD】 Hard Disk Drive", "コンピュータの構成", "メインメモリ 【main memory】 主記憶装置 / 一次記憶装置", "日経 xTECH Linuxコマンド集 「cd」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%8F%E3%83%BC%E3%83%89%E3%83%87%E3%82%A3%E3%82%B9%E3%82%AF.html】正解は「ハードディスク 【HDD】 Hard Disk Drive」です。"}, {"id": "SRC-5-139", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「日経 xTECH Linuxキーワード」", "options": ["日経 xTECH Linuxキーワード 「SSD」", "制御・演算", "コンピュータプログラム", "まとめ｜共通テスト情報Ⅰのプログラミング対策3つのポイント"], "ans": 0, "exp": "【参照：https://e-words.jp/w/SSD.html】正解は「日経 xTECH Linuxキーワード 「SSD」」です。"}, {"id": "SRC-5-140", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「日経 xTECH NE用語」", "options": ["日経 xTECH NE用語 「SSD」", "コンピュータの五大装置", "概要", "プログラミングのルート：擬似言語の「トレース」を極める"], "ans": 0, "exp": "【参照：https://e-words.jp/w/SSD.html】正解は「日経 xTECH NE用語 「SSD」」です。"}, {"id": "SRC-5-143", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「ハードディスクなどの 磁気ディスク装置 は磁気的に、 DVD などの 光学ディスク装置 は光学的に信号の読み書きを行うが、SSDは半導体素子に電気的にデータの記録、読み出しを行うため、極めて高速に読み書きすることができる。」", "options": ["概要", "クラウドWatch データセンター用語集 「メインフレーム」", "教科書別用語集", "ケータイ用語の基礎知識 「ハードディスク」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/SSD.html】正解は「概要」です。"}, {"id": "SRC-5-144", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「SSDの記憶媒体に用いられる NAND型フラッシュメモリ のうち、一つの 記憶素子 （ メモリセル ）に2値（1 ビット ）のデータを格納する方式を「 SLC 」（Single Level Cell）、3値以上からなる多ビットのデータを格納する方式を「 MLC 」（Multi-Level Cell）という。」", "options": ["SLC/MLC/TLC/QLC", "WhatIs.com (英語) 「ALU」", "エリートネットワーク ビジネス用語集 「ハードディスク」", "ハードウェア 【hardware】"], "ans": 0, "exp": "【参照：https://e-words.jp/w/SSD.html】正解は「SLC/MLC/TLC/QLC」です。"}, {"id": "SRC-5-145", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「フラッシュメモリの用語一覧」", "options": ["フラッシュメモリの用語一覧", "プロセッサ内部の記憶装置", "他媒体との比較", "ドットインパクトプリンタ"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%95%E3%83%A9%E3%83%83%E3%82%B7%E3%83%A5%E3%83%A1%E3%83%A2%E3%83%AA.html】正解は「フラッシュメモリの用語一覧」です。"}, {"id": "SRC-5-150", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「フラッシュメモリは 半導体メモリ のうち、電源を落としても記録されたデータが消えない 不揮発性メモリ （nonvolatile memory）に分類される。電気的に繰り返し自由に消去や再書き込みができる特徴は RAM と同じだが、技術的には ROM （の一種である EEPROM ）に由来するため「フラッシュROM」とも呼ばれる。」", "options": ["概要", "PC Magazine (英語) 「ENIAC」", "メインメモリ", "Q1. 共通テストの情報Ⅰのプログラミングは何点分ですか？"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%95%E3%83%A9%E3%83%83%E3%82%B7%E3%83%A5%E3%83%A1%E3%83%A2%E3%83%AA.html】正解は「概要」です。"}, {"id": "SRC-5-151", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「初期のフラッシュメモリは メモリセル （記憶素子）の電荷の有無に デジタル 信号の「0」と「1」を対応付ける1 ビット 記録の素子（ SLC ：Single Level Cell/シングルレベルセル）が用いられた。後に、 セル に投入した電荷量を段階的に識別することで1セルに複数ビットを保存できる素子（ MLC ：Multi-Level Cell/マルチレベルセル）が開発された。」", "options": ["SLCとMLC", "デスクトップパソコン", "主な仕様", "ケータイ用語の基礎知識 「メモリー」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%95%E3%83%A9%E3%83%83%E3%82%B7%E3%83%A5%E3%83%A1%E3%83%A2%E3%83%AA.html】正解は「SLCとMLC」です。"}, {"id": "SRC-5-152", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「フラッシュメモリは 磁気ディスク や光学ディスクなどに比べ、半導体素子に電気的にアクセスするためデータの読み書き速度が桁違いに速く、ドライブ装置に可動部がないため動作音もなく衝撃や振動にも強い。」", "options": ["特徴と用途", "PC Magazine (英語) 「motherboard」", "共通テスト情報Ⅰのプログラミングはどんな問題？", "ROM"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%95%E3%83%A9%E3%83%83%E3%82%B7%E3%83%A5%E3%83%A1%E3%83%A2%E3%83%AA.html】正解は「特徴と用途」です。"}, {"id": "SRC-5-153", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「フラッシュメモリとは、半導体素子を利用した記憶装置の一つで、何度も繰り返し書き込みができ、通電をやめても記憶内容が維持されるもの。近年、データを永続的に保存するストレージ(外部記憶装置)製品の記憶素子として急激に普及している。フラッシュメモリは半導体メモリのうち、電源を落としても記録されたデータが消えない不揮発性メモリ…」", "options": ["フラッシュメモリ 【flash memory】", "マザーボードの規格", "やりがちなNG勉強法は？", "クラウドWatch データセンター用語集 「メインフレーム」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/%E3%83%95%E3%83%A9%E3%83%83%E3%82%B7%E3%83%A5%E3%83%A1%E3%83%A2%E3%83%AA.html】正解は「フラッシュメモリ 【flash memory】」です。"}, {"id": "SRC-5-154", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「CDのファイルシステム」", "options": ["CDのファイルシステム", "半導体記憶装置としてのメモリ", "Q2. 共通テストの情報ⅠはDNCLで出題されますか？", "Visual Studio"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「CDのファイルシステム」です。"}, {"id": "SRC-5-155", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「日経 xTECH Linuxコマンド集」", "options": ["日経 xTECH Linuxコマンド集 「cd」", "NTT西日本 ICT用語集 「メモリー」", "まとめ｜共通テスト情報Ⅰのプログラミング対策3つのポイント", "HULFT 技術コラム 用語集 「量子コンピュータ」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「日経 xTECH Linuxコマンド集 「cd」」です。"}, {"id": "SRC-5-156", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「ミツエーリンクス Web「経営革新ツール」用語集」", "options": ["ミツエーリンクス Web「経営革新ツール」用語集 「CD」", "主記憶装置としてのメモリ", "共通テスト情報Ⅰで9割を狙う具体的な参考書ルートと勉強法", "ノイマン型コンピュータ"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「ミツエーリンクス Web「経営革新ツール」用語集 「CD」」です。"}, {"id": "SRC-5-157", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「CodeZine UNIXコマンド辞典」", "options": ["CodeZine UNIXコマンド辞典 「cd」", "ROM", "Q1. 情報Ⅰの勉強はいつから本格的に始めるべきですか？", "概要"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「CodeZine UNIXコマンド辞典 「cd」」です。"}, {"id": "SRC-5-159", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「@IT Linux基本コマンドTips」", "options": ["@IT Linux基本コマンドTips 「cd」", "メインメモリ 【main memory】 主記憶装置 / 一次記憶装置", "TechTerms.com (英語) 「Computer」", "NTT西日本 ICT用語集 「HDD」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「@IT Linux基本コマンドTips 「cd」」です。"}, {"id": "SRC-5-160", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「Linux入門 コマンドリファレンス」", "options": ["Linux入門 コマンドリファレンス 「cd」", "エリートネットワーク ビジネス用語集 「メインフレーム」", "コンピュータの構成", "他媒体との比較"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「Linux入門 コマンドリファレンス 「cd」」です。"}, {"id": "SRC-5-162", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「音楽ソフトを販売するための 記録媒体 として開発され、アナログレコードやカセットテープに代わって標準的な音楽販売 メディア として再生機器が広く普及した。後に利用者側の機器で データ を記録できる追記型（ CD-R ）や書き換え型（ CD-RW ）の仕様も策定され、 コンピュータ の補助的なデータ記憶メディア、ソフトウェア販売メディア、配布・交換用メディアとしても広まった。」", "options": ["概要", "エリートネットワーク ビジネス用語集 「フラッシュメモリ」", "PC Magazine (英語) 「peripheral」", "主記憶装置としてのメモリ"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「概要」です。"}, {"id": "SRC-5-163", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「直径8cmあるいは12cmの、中心に穴の空いたプラスチック製の薄いディスクで、ドライブ装置に挿入して高速で回転させる。近接させた 光ピックアップ から回転する記録面上の特定の位置にレーザー光を照射し、反射した光を センサー で検知して記録されたデータを読み取る。書き込み型の場合はレーザー光で記録面を加熱して光の反射率を変化させることによりデータを書き込む。」", "options": ["主な仕様", "日経 xTECH IT基本用語辞典 「量子コンピューター」", "コンピュータの五大装置", "フラッシュメモリ 【flash memory】"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「主な仕様」です。"}, {"id": "SRC-5-164", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「初期の仕様では、工場で内容を記録したディスクを生産して販売し、利用者側では内容を再生するのみだったが、コンピュータの記憶媒体として利用できるよう、利用者側で記録が可能な追加仕様が定められた。」", "options": ["記録型CD", "HULFT 技術コラム 用語集 「量子コンピュータ」", "概要", "Linux入門 コマンドリファレンス 「cd」"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「記録型CD」です。"}, {"id": "SRC-5-165", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「ディスクへデータ記録する標準形式もいくつか定められており、音声を記録する「 CD-DA 」（CD Digital Audio）と、コンピュータの ファイル を記録する「 CD-ROM 」（CD Read Only Memory ）が最も一般的に用いられる。」", "options": ["派生仕様", "歴史", "マイクロコントローラ", "共通テスト情報Ⅰのプログラミングはどんな問題？"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「派生仕様」です。"}, {"id": "SRC-5-166", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「CDの仕様や技術を踏襲しながら容量やアクセス速度を高速化した光ディスク規格がいくつかあり、主に動画の記録に用いられる「DVD」や、DVDをさらに大容量化した「Blu-ray Disc」（BD/ブルーレイディスク）などがある。」", "options": ["後継規格", "スーパーコンピュータ", "プロセッサ内部の記憶装置", "第3問で何点を目指す？"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「後継規格」です。"}, {"id": "SRC-5-167", "cat": "PROG", "catName": "プログラミング・計算", "priority": "S", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「CD（コンパクトディスク）とは、薄い樹脂製の円盤(ディスク)の表面に微細な加工を施し、高速で回転させてレーザー光を照射することで信号の読み書きを行う光ディスクの一つ。1980年にソニーと蘭フィリップス(Philips)社が開発した。音楽ソフトを販売するための記録媒体として開発され、アナログレコードやカセットテープに代わ…」", "options": ["CD 【Compact Disc】 コンパクトディスク", "PC Magazine (英語) 「ENIAC」", "シーケンシャルアクセス", "Q6. 共通テストの情報Ⅰの過去問はどこで見られますか？"], "ans": 0, "exp": "【参照：https://e-words.jp/w/CD.html】正解は「CD 【Compact Disc】 コンパクトディスク」です。"}, {"id": "SRC-5-168", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「共通テスト「情報Ⅰ」（60分・100点）のプログラミングは、令和7年度（2025年）・令和8年度（2026年）とも第3問の25点で出題されました。プログラムが出てくるのは両年度とも第3問だけで、身近な場面の問題をプログラムで解く流れを読み取る形式です。」", "options": ["共通テスト情報Ⅰのプログラミングはどんな問題？", "「世界初」を巡って", "記憶装置 【storage unit】 memory unit", "インプットのルート：基礎用語と全体像を把握する"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「共通テスト情報Ⅰのプログラミングはどんな問題？」です。"}, {"id": "SRC-5-169", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「共通テスト用プログラム表記は、大学入試センターが「情報Ⅰ」のために使う独自の表記で、命令の一部が日本語（「表示する」「〜の間繰り返す」など）で書かれます。「DNCL」は旧科目「情報関係基礎」で使われた表記の名称で、本記事が確認した情報Ⅰの公式資料（試作問題の概要、令和7・8年度の問題と自己評価、令和9・10年度の問題作成方針）では「DNCL」という名称は使われていません。」", "options": ["共通テスト用プログラム表記とは？DNCLとの違いは？", "周辺機器 【peripheral equipment】 ペリフェラル", "入出力インターフェース", "まとめ"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「共通テスト用プログラム表記とは？DNCLとの違いは？」です。"}, {"id": "SRC-5-170", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「情報Ⅰのプログラミングは、表記の文法→短いプログラムのトレース→穴埋め・改変→60分の通し演習の4ステップで進めます。用語の暗記より、「プログラムを1行ずつ追って変数の値を書き出す」練習に時間をかけます。」", "options": ["プログラミング対策の勉強の順番は？", "日経 xTECH Active キーワード 「ストレージ」", "Techopedia (英語) 「Motherboard」", "TechTerms.com (英語) 「Computer」"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「プログラミング対策の勉強の順番は？」です。"}, {"id": "SRC-5-171", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「情報Ⅰのプログラミング対策は、講義型の参考書1冊、プログラミング特化の問題集1冊、2027年用の予想問題集1冊の3冊を軸にします。次の書名・発売日・価格は、各出版社の公式ページの記載です。」", "options": ["おすすめ参考書ルートは？【段階別】", "@IT 5分で分かるシリーズ 「ストレージ」", "マザーボード 【motherboard】 MB", "コンピュータの五大装置"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「おすすめ参考書ルートは？【段階別】」です。"}, {"id": "SRC-5-172", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「共通テストの第3問で点を落とす原因は、文法の知識不足よりも「添字の始まり」「繰り返しの回数」「変数の更新のタイミング」の読み違いです。」", "options": ["つまずきやすいポイントと対策は？", "ストレージ 【storage】 外部記憶装置", "NTT西日本 ICT用語集 「メモリー」", "概要"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「つまずきやすいポイントと対策は？」です。"}, {"id": "SRC-5-173", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「情報Ⅰのプログラミングで避けたいのは、Pythonの入門書から始めることと、解説を読むだけで手を動かさないことです。」", "options": ["やりがちなNG勉強法は？", "ケータイ用語の基礎知識 「ハードディスク」", "RAM", "コンピュータの五大装置"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「やりがちなNG勉強法は？」です。"}, {"id": "SRC-5-174", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「11月中旬から本試験（1月17日）までの約9週間なら、次の配分が目安です。」", "options": ["具体例：残り2か月で第3問を仕上げる計画", "エリートネットワーク ビジネス用語集 「ハードディスク」", "PC Magazine (英語) 「main memory」", "コンピュータの五大装置"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「具体例：残り2か月で第3問を仕上げる計画」です。"}, {"id": "SRC-5-175", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「第3問（25点）は、条件の読み取りと空欄補充で確実に点を取り、プログラムの動作を問う問題で上乗せする、という目標の立て方が現実的です。令和8年度の正答率は、条件の理解が8割以上だった一方、動作を問う問題は約2割でした。」", "options": ["第3問で何点を目指す？", "概要", "エリートネットワーク ビジネス用語集 「メインフレーム」", "プロセッサ内部の記憶装置"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「第3問で何点を目指す？」です。"}, {"id": "SRC-5-176", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「令和7年度・令和8年度とも、プログラミングは第3問の25点でした（100点満点）。配点を事前に固定する公式の発表はないため、2027年も同じとは限りません。」", "options": ["よくある質問（FAQ）", "SSDへの置き換え", "Visual Studio", "プロセッサ内部の記憶装置"], "ans": 0, "exp": "【参照：https://www.ukaroute.com/blog/information-programming-textbooks-common-test-strategy】正解は「よくある質問（FAQ）」です。"}, {"id": "SRC-5-178", "cat": "PROG", "catName": "プログラミング・計算", "priority": "A", "q": "次の説明に該当する用語・概念として最も適切なものはどれか。\n「情報Ⅰの表記の名称は「共通テスト用プログラム表記」です。DNCLは旧科目「情報関係基礎」の表記の名称で、本記事が確認し   "【データ分析】相関があっても因果関係があるとは限りません。第3の要因（潜伏変数・擬似相関）と、外れ値に強い中央値・四分位範囲（IQR）を必ず確認しましょう。",

];
const KEY = "ct_joho1_sources_v1";
let prog = JSON.parse(localStorage.getItem(KEY) || '{"items":{},"solved":0}');
let curList = [], idx = 0, score = 0, wrongList = [], listening = false, timer = null;

function save() { localStorage.setItem(KEY, JSON.stringify(prog)); }
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'v-home') refreshHome();
}
function refreshHome() {
  document.getElementById('s-tot').textContent = BANK.length;
  let lrn = 0, rev = 0;
  BANK.forEach(q => {
    const p = prog.items[q.id];
    if (p && p.n > 0) { lrn++; if (p.ng || (p.ok / p.n < 0.7)) rev++; }
  });
  document.getElementById('s-lrn').textContent = lrn;
  document.getElementById('s-rev').textContent = rev;
  const br = document.getElementById('b-rev');
  document.getElementById('rev-n').textContent = rev;
  br.style.display = rev > 0 ? 'block' : 'none';
}
function startQuiz(mode) {
  const cat = document.getElementById('f-cat').value;
  const pri = document.getElementById('f-pri').value;
  let pool = BANK.filter(q => (cat === 'ALL' || q.cat === cat) && (pri === 'ALL' || q.priority === pri));
  if (mode === 'REVIEW') {
    pool = pool.filter(q => { const p = prog.items[q.id]; return p && (p.ng || (p.ok / p.n < 0.7)); });
  }
  if (!pool.length) { alert("対象問題がありません。"); return; }
  const now = Date.now();
  pool.sort((a, b) => prio(prog.items[b.id], now) - prio(prog.items[a.id], now));
  curList = pool.slice(0, 10).sort(() => Math.random() - 0.5);
  idx = 0; score = 0; wrongList = [];
  showView('v-quiz');
  renderQ();
}
function prio(p, now) {
  if (!p || !p.n) return 1000 + Math.random() * 20;
  let s = 100 + (p.ng ? 500 : 0) + Math.min(((now - (p.t || 0)) / 3600000) * 5, 200) + (1 - p.ok / p.n) * 200;
  return s + Math.random() * 20;
}
function renderQ() {
  document.getElementById('sheet').classList.remove('active');
  const q = curList[idx];
  document.getElementById('p-fill').style.width = `${(idx / curList.length) * 100}%`;
  document.getElementById('q-cat').textContent = `${q.catName} / ${q.priority === 'S' ? '最重要' : '重要'}`;
  document.getElementById('q-num').textContent = `${idx + 1} / ${curList.length}`;
  document.getElementById('q-txt').textContent = q.q;
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  [0,1,2,3].sort(() => Math.random() - 0.5).forEach(i => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = q.options[i];
    b.onclick = () => answer(i, b);
    opts.appendChild(b);
  });
}
function answer(i, btn) {
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const q = curList[idx];
  const ok = (i === q.ans);
  const p = prog.items[q.id] || { n: 0, ok: 0, ng: false, t: 0 };
  p.n++; p.t = Date.now();
  if (ok) { score++; p.ok++; p.ng = false; btn.classList.add('ok'); }
  else { p.ng = true; wrongList.push(q); btn.classList.add('ng');
    document.querySelectorAll('.opt').forEach(b => { if (b.textContent === q.options[q.ans]) b.classList.add('ok'); });
  }
  prog.items[q.id] = p;
  prog.solved = (prog.solved || 0) + 1;
  save();
  document.getElementById('sh-title').textContent = ok ? "⭕ 正解！" : "❌ 不正解";
  document.getElementById('sh-title').style.color = ok ? "var(--ok)" : "var(--ng)";
  document.getElementById('sh-exp').textContent = `正解：${q.options[q.ans]} ／ ${q.exp}`;
  document.getElementById('sheet').classList.add('active');
  speak(ok ? "正解です" : "不正解です");
  if (prog.solved % 30 === 0) {
    setTimeout(() => {
      document.getElementById('adv-txt').textContent = ADVICES[(Math.floor(prog.solved / 30) - 1) % ADVICES.length];
      document.getElementById('m-adv').classList.add('active');
    }, 500);
  }
}
function nextQ() {
  idx++;
  if (idx < curList.length) renderQ();
  else {
    document.getElementById('p-fill').style.width = '100%';
    document.getElementById('r-sc').textContent = `${score} / ${curList.length}`;
    document.getElementById('r-rev').style.display = wrongList.length ? 'block' : 'none';
    document.getElementById('m-res').classList.add('active');
  }
}
function closeRes(act) {
  document.getElementById('m-res').classList.remove('active');
  if (act === 'REV') { curList = [...wrongList]; idx = 0; score = 0; wrongList = []; showView('v-quiz'); renderQ(); }
  else if (act === 'NEXT') startQuiz('NORMAL');
  else showView('v-home');
}
function openStats() {
  document.getElementById('st-body').innerHTML = `累計解答数：<b>${prog.solved || 0}</b> 回<br>収録問題数：<b>${BANK.length}</b> 問`;
  document.getElementById('m-st').classList.add('active');
}
function exportProg() {
  const txt = JSON.stringify(prog);
  navigator.clipboard?.writeText(txt).then(() => alert("進捗コードをコピーしました。")).catch(() => prompt("コピーしてください:", txt));
}
function importProg() {
  const txt = prompt("進捗コードを貼り付けてください:");
  if (!txt) return;
  try { const d = JSON.parse(txt); if (d.items) { prog = d; save(); refreshHome(); alert("復元しました。"); } }

}
function speak(txt, cb) {
  if (!('speechSynthesis' in window)) { if (cb) cb(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'ja-JP';
  if (cb) u.onend = cb;
  window.speechSynthesis.speak(u);
}
function startListen() {
  listening = true;
  showView('v-listen');
  let list = BANK.filter(q => prog.items[q.id]?.ng);
  if (!list.length) list = [...BANK];
  let i = 0;
  const step = () => {
    if (!listening) return;
    const q = list[i % list.length];
    document.getElementById('l-head').textContent = `問題 (${q.catName})`;
    document.getElementById('l-body').textContent = q.q;
    speak("問題。" + q.q, () => {
      if (!listening) return;
      timer = setTimeout(() => {
        if (!listening) return;
        const ans = q.options[q.ans];
        document.getElementById('l-head').textContent = "解答と解説";
        document.getElementById('l-body').textContent = `正解：${ans}
${q.exp}`;
        speak(`正解は、${ans}。${q.exp}`, () => {
          if (!listening) return;
          i++;
          timer = setTimeout(step, 1800);
        });
      }, 1200);
    });
  };
  step();
}
function stopListen() {
  listening = false;
  clearTimeout(timer);
  window.speechSynthesis?.cancel();
  showView('v-home');
}
refreshHome();
</script>
