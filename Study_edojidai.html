<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>江戸時代 問題集</title>
<script>window.onerror=function(m,s,l,c){var d=document.createElement('pre');d.textContent='エラー: '+m+' (行'+l+':'+c+')';d.style.cssText='white-space:pre-wrap;color:#b83a2a;background:#fff;padding:8px;margin:8px';(document.body||document.documentElement).appendChild(d)};</script>
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#1d2733;--sub:#5d6b7a;--ai:#1f3f6b;--ok:#2f7d5b;--ng:#b83a2a;--line:#d3dce4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a24;--card:#1b2635;--ink:#e6ecf2;--sub:#97a6b6;--ai:#8fb4ea;--ok:#5fc59a;--ng:#ef7c6b;--line:#2d3b4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a24;--card:#1b2635;--ink:#e6ecf2;--sub:#97a6b6;--ai:#8fb4ea;--ok:#5fc59a;--ng:#ef7c6b;--line:#2d3b4d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:800 26px/1.3 "Shippori Mincho","Yu Mincho",serif;margin:8px 0 12px;color:var(--ai)}
h2{font:600 19px "Shippori Mincho","Yu Mincho",serif;margin:0 0 6px}
nav{display:flex;gap:6px;margin-bottom:16px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ai);color:var(--bg);border-color:var(--ai)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card ul{margin:4px 0 8px;padding-left:1.2em}
.btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ai)}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.btn.ok{border:2px solid var(--ok);background:rgba(47,125,91,.16);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.btn.ng{border:2px solid var(--ng);background:rgba(184,58,42,.16);background:color-mix(in srgb,var(--ng) 14%,var(--card))}
.go{background:var(--ai);color:var(--bg);text-align:center;border:0;font-weight:700}
.q{font-size:18px;font-weight:600;margin:4px 0 10px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ai);border-radius:3px}
.sub{color:var(--sub);font-size:14px}
.exp{border-left:4px solid var(--ai);padding:4px 12px;margin:10px 0;font-size:15px}
.miss{border-left:4px solid var(--ng);padding:2px 10px;margin:8px 0;font-size:15px}
.score{font:800 40px "Shippori Mincho",serif;color:var(--ai)}
</style>
</head>
<body>
<main>
<h1>江戸時代 問題集</h1>
<nav id="nav"></nav>
<div id="app"></div>
</main>
<script>
(function(){
"use strict";
const C=["幕府のしくみ","鎖国と外交","産業と三大改革","文化と学問","開国と幕末"];
const S=[
["1603年 徳川家康が江戸幕府を開く（関ヶ原の戦い 1600年）","大名は親藩・譜代・外様。武家諸法度(1615)、参勤交代(家光)","百姓は五人組で連帯責任。年貢を納めた"],
["キリスト教禁止：踏絵・寺請制度 → 島原・天草一揆(1637)","ポルトガル船来航禁止(1639)、オランダ商館を出島へ(1641)","4つの窓口：長崎(オランダ・清)、対馬(朝鮮)、薩摩(琉球)、松前(アイヌ)"],
["農業：備中ぐわ・千歯こき。交通：五街道、大阪は「天下の台所」","享保(吉宗) → 田沼意次 → 寛政(定信) → 天保(水野忠邦)","一揆・打ちこわし・大塩平八郎の乱(1837)が増える"],
["元禄文化(上方)：近松門左衛門・井原西鶴・松尾芭蕉","化政文化(江戸)：葛飾北斎・歌川広重","学問：蘭学(杉田玄白)・国学(本居宣長)。庶民は寺子屋で学ぶ"],
["1853 ペリー来航 → 1854 日米和親条約 → 1858 日米修好通商条約","安政の大獄(1858) → 桜田門外の変(1860)","薩長同盟(1866) → 大政奉還(1867) → 戊辰戦争(1868)"]];
const R=[
[0,"1603年に征夷大将軍となり、江戸幕府を開いた人物は？","徳川家康","豊臣秀吉","徳川秀忠","織田信長","1600年の関ヶ原の戦いに勝った家康が、江戸に幕府を開いた。"],
[0,"1615年、大名を取りしまるために出された法律は？","武家諸法度","御成敗式目","禁中並公家諸法度","分国法","大名の城の修理や結婚を制限した。禁中並公家諸法度は天皇・公家向けの法。"],
[0,"関ヶ原の戦いのあとに徳川氏に従った大名を何という？","外様大名","親藩","譜代大名","旗本","外様は江戸から遠い場所に配置された。親藩＝徳川一族、譜代＝古くからの家臣。"],
[0,"大名が1年おきに江戸と領地を往復する制度は？","参勤交代","五人組","楽市・楽座","刀狩","3代将軍家光が武家諸法度に加えた。大名の負担が重く、街道や宿場町が発達した。"],
[0,"江戸時代、人口の約85％を占めた身分は？","百姓","町人","武士","公家","百姓は年貢を納めた。町人は職人と商人。"],
[0,"百姓に、年貢の納入や犯罪防止の連帯責任を負わせた制度は？","五人組","株仲間","寺請制度","参勤交代","村では名主（庄屋）らが村を運営した。"],
[1,"1637年、キリスト教徒への弾圧や重い年貢に苦しむ人々が起こした一揆は？","島原・天草一揆","山城国一揆","加賀の一向一揆","打ちこわし","幕府は大軍で鎮圧し、禁教をさらに強めた。"],
[1,"キリスト教徒を見つけるため、キリストやマリアの像を踏ませたものは？","踏絵","寺請制度","高札","朱印状","寺請制度では、全員をいずれかの寺の檀家にした。"],
[1,"鎖国中、長崎の出島で幕府が貿易を認めたヨーロッパの国は？","オランダ","ポルトガル","イギリス","スペイン","1639年にポルトガル船の来航禁止、1641年にオランダ商館を出島へ移した。中国(清)とは唐人屋敷で貿易。"],
[1,"鎖国中、蝦夷地でアイヌの人々との交易を独占した藩は？","松前藩","薩摩藩","対馬藩","長州藩","薩摩藩は琉球王国、対馬藩は朝鮮との窓口。1669年にシャクシャインの戦いが起きた。"],
[1,"将軍の代がわりごとに日本へ派遣された朝鮮の使節は？","朝鮮通信使","遣唐使","遣隋使","遣明使","対馬藩の宗氏が国交回復に努めた。"],
[2,"「天下の台所」と呼ばれ、諸藩の蔵屋敷が置かれた都市は？","大阪（大坂）","江戸","京都","長崎","江戸は「将軍のおひざもと」、京都は朝廷や西陣織の町。"],
[2,"脱穀の効率を高めた農具は？","千歯こき","備中ぐわ","唐箕","踏車","備中ぐわ＝深く耕す、唐箕＝選別、踏車＝田に水を入れる。"],
[2,"五街道の起点となった場所は？","日本橋","品川","箱根","大坂城","東海道・中山道・日光街道・奥州街道・甲州街道。"],
[2,"享保の改革を行った8代将軍は？","徳川吉宗","徳川綱吉","徳川家光","徳川慶喜","上げ米、新田開発、公事方御定書、目安箱など。"],
[2,"株仲間を公認して税を取り、商業を重視した老中は？","田沼意次","松平定信","水野忠邦","新井白石","わいろが広がり、浅間山の噴火やききんで批判された。"],
[2,"寛政の改革を行った老中は？","松平定信","田沼意次","水野忠邦","柳沢吉保","囲い米、旧里帰農令、寛政異学の禁（朱子学以外の講義を禁止）。"],
[2,"1837年、大坂で元役人が貧しい人々を救うために起こした反乱は？","大塩平八郎の乱","島原・天草一揆","桜田門外の変","安政の大獄","幕府の元役人の反乱は幕府に衝撃を与えた。"],
[2,"天保の改革で、水野忠邦が株仲間に対して行ったことは？","解散させた","新たに公認した","税を免除した","保護を強化した","物価を下げるためだったが、かえって流通が混乱した。人返し令も出した。"],
[3,"人形浄瑠璃の脚本『曽根崎心中』を書いたのは？","近松門左衛門","井原西鶴","松尾芭蕉","歌川広重","西鶴は浮世草子、芭蕉は俳諧『奥の細道』。元禄文化は上方の町人が中心。"],
[3,"『富嶽三十六景』を描いた浮世絵師は？","葛飾北斎","歌川広重","菱川師宣","喜多川歌麿","広重は『東海道五十三次』。化政文化は江戸の町人が中心。"],
[3,"『解体新書』を翻訳した人物は？","杉田玄白","伊能忠敬","本居宣長","緒方洪庵","前野良沢らとオランダ語の医学書を翻訳。蘭学の始まり。"],
[3,"全国を測量して正確な日本地図をつくった人物は？","伊能忠敬","杉田玄白","渋川春海","本居宣長","天文学を学び、幕府の命で測量した。"],
[3,"『古事記伝』を著し、国学を大成した人物は？","本居宣長","杉田玄白","伊能忠敬","吉田松陰","国学は仏教・儒教が伝わる前の日本人の考えを研究する学問。"],
[3,"庶民の子どもが読み・書き・そろばんを学んだ教育機関は？","寺子屋","藩校","適塾","松下村塾","藩校は藩が武士の子のためにつくった学校。"],
[4,"1853年、浦賀に来航して開国を求めたアメリカの使節は？","ペリー","ハリス","ビドル","プチャーチン","ハリスは日米修好通商条約の交渉をした総領事。プチャーチンはロシアの使節。"],
[4,"1854年、日米和親条約で開かれた港は？","下田と函館","横浜と長崎","神奈川と兵庫","新潟と大阪","薪・水・食料の補給や漂流民の保護を認めた。"],
[4,"日米修好通商条約で、日本にないとされた「輸入品の関税を自分で決める権利」は？","関税自主権","領事裁判権","最恵国待遇","勘合貿易","アメリカには領事裁判権（治外法権）を認めた。不平等条約の内容。"],
[4,"1860年、大老井伊直弼が暗殺された事件は？","桜田門外の変","安政の大獄","大塩平八郎の乱","禁門の変","安政の大獄は、井伊直弼が吉田松陰らの反対派を処罰した事件。"],
[4,"薩摩藩と長州藩の同盟を仲立ちした土佐藩出身の人物は？","坂本龍馬","西郷隆盛","吉田松陰","徳川慶喜","1866年の薩長同盟。のち倒幕へ進んだ。"],
[4,"1867年、15代将軍徳川慶喜が政権を朝廷に返したできごとは？","大政奉還","王政復古の大号令","廃藩置県","版籍奉還","このあと王政復古の大号令が出され、1868年に戊辰戦争が始まった。"]
];
const D=R.map((a,i)=>({id:i,c:a[0],q:a[1],a:a[2],w:a.slice(3,6),e:a[6]}));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let W={};try{W=JSON.parse(localStorage.getItem("edoW")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("edoW",JSON.stringify(W))}catch(e){}};
const $=id=>document.getElementById(id), app=$("app");
let tab="study";

function nav(){
  const n=Object.keys(W).length;
  $("nav").innerHTML=[["study","まとめ"],["quiz","問題"],["fix","間違い直し"+(n?`（${n}）`:"")]]
    .map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}">${l}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
}
function render(){
  nav();
  if(tab==="study")study();else if(tab==="quiz")setup();else fix();
}
function study(){
  app.innerHTML=C.map((c,i)=>`<div class="card"><h2>${c}</h2><ul>${S[i].map(s=>`<li>${s}</li>`).join("")}</ul><button class="btn go" data-c="${i}">この単元の問題をやる（${D.filter(d=>d.c===i).length}問）</button></div>`).join("");
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{tab="quiz";nav();run(sh(D.filter(d=>d.c==b.dataset.c)),"quiz")});
}
function setup(){
  app.innerHTML=`<div class="card"><h2>どこから始める？</h2><p class="sub">まちがえた問題は「間違い直し」に自動で入ります。</p>
  <button class="btn go" data-c="all">総合 10問（ぜんぶの単元からランダム）</button>
  ${C.map((c,i)=>`<button class="btn" data-c="${i}">${c}（${D.filter(d=>d.c===i).length}問）</button>`).join("")}</div>`;
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const v=b.dataset.c;run(v==="all"?sh(D).slice(0,10):sh(D.filter(d=>d.c==v)),"quiz")});
}
function fix(){
  const ids=Object.keys(W);
  if(!ids.length){app.innerHTML=`<div class="card"><h2>間違いノートは空です</h2><p>「問題」でテストをして、まちがえた問題がここに集まります。</p></div>`;return}
  app.innerHTML=`<div class="card"><h2>まちがえた問題：${ids.length}問</h2><p class="sub">同じ問題を2回続けて正解すると、ノートから卒業できます。</p>
  <button class="btn go" id="st">間違い直しを始める</button>
  ${ids.map(i=>`<div class="miss"><b>${D[i].q}</b><br><span class="sub">${C[D[i].c]} ／ 連続正解 ${W[i]}/2</span></div>`).join("")}</div>`;
  $("st").onclick=()=>run(sh(ids.map(i=>D[i])),"fix");
}
function run(list,mode){
  let i=0,score=0,miss=[],grad=0;
  const show=()=>{
    const q=list[i],ch=sh([q.a,...q.w]);
    app.innerHTML=`<div class="bar"><i style="width:${i/list.length*100}%"></i></div>
    <div class="card"><div class="sub">${i+1}/${list.length}　${C[q.c]}</div><div class="q">${q.q}</div>
    ${ch.map(c=>`<button class="btn" data-v="${c}">${c}</button>`).join("")}<div id="fb"></div></div>`;
    app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.v===q.a;
      app.querySelectorAll("[data-v]").forEach(x=>{x.disabled=true;if(x.dataset.v===q.a)x.classList.add("ok")});
      if(!ok)b.classList.add("ng");
      let note="";
      if(ok){score++;if(mode==="fix"){W[q.id]=(W[q.id]||0)+1;if(W[q.id]>=2){delete W[q.id];grad++;note="　卒業！"}}}
      else{W[q.id]=0;miss.push(q)}
      save();nav();
      $("fb").innerHTML=`<p><b style="color:var(--${ok?"ok":"ng"})">${ok?"正解！":"ちがうよ。正解は「"+q.a+"」"}${note}</b></p><div class="exp">${q.e}</div><button class="btn go" id="nx">${i+1<list.length?"次の問題":"結果を見る"}</button>`;
      $("nx").focus();$("nx").onclick=()=>{i++;i<list.length?show():done()};
    });
  };
  const done=()=>{
    app.innerHTML=`<div class="card"><div class="score">${score} / ${list.length}</div>
    <p>${score===list.length?"ぜんぶ正解！":miss.length+"問まちがえました。解説を読み直そう。"}${mode==="fix"?`（ノートから卒業：${grad}問）`:""}</p>
    ${miss.map(q=>`<div class="miss"><b>${q.q}</b><br>答え：${q.a}<br><span class="sub">${q.e}</span></div>`).join("")}
    ${Object.keys(W).length?`<button class="btn go" id="f">間違い直しをやる（${Object.keys(W).length}問）</button>`:""}
    <button class="btn" id="b">${mode==="fix"?"まとめに戻る":"問題の選択に戻る"}</button></div>`;
    if($("f"))$("f").onclick=()=>{tab="fix";render();fix();run(sh(Object.keys(W).map(i=>D[i])),"fix")};
    $("b").onclick=()=>{tab=mode==="fix"?"study":"quiz";render()};
  };
  show();
}
render();
})();
</script>
</body>
</html>
