<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>共通テスト対策 英単語 モチベアップ版</title>
<style>
  :root {
    --primary: #1e3a8a;
    --primary-light: #2563eb;
    --accent: #0284c7;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-sub: #475569;
    --success: #15803d;
    --success-bg: #dcfce7;
    --error: #b91c1c;
    --error-bg: #fee2e2;
    --border: #cbd5e1;
    --radius: 14px;
    --pencil-fill: #262626;
    --pencil-border: #171717;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    height: 100%;
    min-height: 100vh;
    background-color: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text-main);
    overflow: hidden;
  }

  #confettiCanvas {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  .app-wrap {
    width: 100%;
    max-width: 820px;
    height: 100%;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 6px 12px calc(8px + env(safe-area-inset-bottom));
    background: var(--card-bg);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-back-launcher {
    background: #475569;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 800;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }

  .app-title {
    font-size: 1rem;
    font-weight: 900;
    color: var(--primary);
  }
  .top-controls {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  select {
    font-size: 0.85rem;
    padding: 5px 6px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: #f8fafc;
    font-weight: bold;
    color: var(--text-main);
    max-width: 155px;
  }
  .btn-review-top {
    font-size: 0.82rem;
    padding: 5px 8px;
    border-radius: 8px;
    border: none;
    font-weight: bold;
    background: #ea580c;
    color: #fff;
    cursor: pointer;
  }
  .badge-count {
    background: #fff;
    color: #ea580c;
    border-radius: 10px;
    padding: 1px 5px;
    font-size: 0.75rem;
    margin-left: 2px;
    font-weight: 800;
  }

  .gamify-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 8px;
    background: #eff6ff;
    border-radius: 6px;
    margin-top: 4px;
    font-size: 0.78rem;
    font-weight: bold;
    flex-shrink: 0;
  }

  .nav-toolbar {
    display: flex;
    gap: 5px;
    margin: 4px 0;
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    background: #e2e8f0;
    color: #1e293b;
    border: none;
    padding: 6px 3px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .nav-btn.primary { background: #dbeafe; color: #1e40af; font-weight: 800; }
  .nav-btn.danger { background: #fee2e2; color: #991b1b; font-size: 0.75rem; }

  .progress-section { margin: 2px 0 4px; flex-shrink: 0; }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--text-sub);
    margin-bottom: 2px;
  }
  .bar-bg {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--primary-light);
    transition: width 0.2s;
  }

  .target-area {
    text-align: center;
    padding: 4px 0 6px;
    border-bottom: 2px dashed var(--border);
    flex-shrink: 0;
  }
  .target-meta {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 800;
    margin-bottom: 2px;
  }
  .rank-badge {
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 900;
  }
  .rank-s { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .rank-a { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .rank-b { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

  .recall-badge {
    background: #f3e8ff;
    color: #6b21a8;
    border: 1px solid #d8b4fe;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 900;
  }

  .word-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .target-word {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--primary);
    line-height: 1.15;
  }
  .btn-speak {
    background: #e0f2fe;
    color: #0369a1;
    border: 2px solid #bae6fd;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    min-width: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    cursor: pointer;
  }

  .interactive-stage {
    position: relative;
    flex: 1;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex: 1;
    height: 100%;
  }
  .opt-btn {
    width: 100%;
    flex: 1;
    text-align: left;
    background: #fff;
    border: 2px solid var(--border);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 1.02rem;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text-main);
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .opt-btn:active { background: #f1f5f9; }

  .mark-circle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 22px;
    min-width: 28px;
    border-radius: 11px;
    border: 2px solid #64748b;
    background: #ffffff;
    font-size: 0.9rem;
    font-weight: 800;
    color: #475569;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .opt-btn.marked .mark-circle {
    background: radial-gradient(circle, #333333 0%, var(--pencil-fill) 100%) !important;
    border-color: var(--pencil-border) !important;
    color: #f3f4f6 !important;
  }
  .opt-btn.correct {
    background: var(--success-bg) !important;
    border-color: var(--success) !important;
    color: var(--success) !important;
  }
  .opt-btn.correct .mark-circle {
    background: var(--success) !important;
    border-color: #14532d !important;
    color: #ffffff !important;
  }
  .opt-btn.incorrect {
    background: var(--error-bg) !important;
    border-color: var(--error) !important;
    color: var(--error) !important;
  }
  .opt-btn.incorrect .mark-circle {
    background: var(--error) !important;
    border-color: #7f1d1d !important;
    color: #ffffff !important;
  }

  .explanation-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 10px;
    display: none;
    flex-direction: column;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    z-index: 10;
  }

  .exp-judge {
    font-size: 1.2rem;
    font-weight: 900;
    margin-bottom: 4px;
  }
  .exp-scroll-area {
    flex: 1;
    overflow-y: auto;
    font-size: 0.95rem;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .exp-block {
    background: #f8fafc;
    padding: 6px 8px;
    border-radius: 6px;
    margin-bottom: 4px;
    border-left: 4px solid var(--accent);
  }
  .exp-idiom-block {
    background: #fefce8;
    padding: 6px 8px;
    border-radius: 6px;
    margin-bottom: 4px;
    border-left: 4px solid #f59e0b;
    font-size: 0.92rem;
    color: #78350f;
  }
  .exp-idiom-block strong { color: #b45309; }
  
  .exp-ex-block {
    background: #fdfdfd;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ex-en-text {
    font-size: 0.92rem;
    color: #1e293b;
    font-weight: 600;
    line-height: 1.35;
  }
  .ex-ja-text {
    font-size: 0.85rem;
    color: #475569;
    line-height: 1.3;
    padding-left: 2px;
  }
  .btn-speak-ex {
    align-self: flex-start;
    background: #f1f5f9;
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.78rem;
    font-weight: bold;
    color: var(--primary);
    cursor: pointer;
    margin-top: 2px;
  }

  .btn-next-fast {
    background: var(--primary);
    color: #fff;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: var(--radius);
    font-weight: 900;
    font-size: 1.15rem;
    cursor: pointer;
  }
  .btn-next-fast:active { background: var(--primary-light); }

  .modal-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 100;
  }
  .modal-box {
    background: #fff;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: var(--radius);
    padding: 16px 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .modal-box h3 {
    font-size: 1.15rem;
    color: var(--primary);
    text-align: center;
    margin-bottom: 6px;
  }
  .modal-score {
    text-align: center;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--primary-light);
    margin-bottom: 8px;
  }
  .eval-item {
    font-size: 0.90rem;
    background: #f8fafc;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .eval-item strong { display: block; margin-bottom: 2px; }
  .eval-s strong { color: var(--success); }
  .eval-w strong { color: var(--error); }
  .eval-a strong { color: var(--accent); }

  .checkpoint-btn-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  .btn-choice-forward {
    background: var(--primary);
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-weight: 900;
    font-size: 1.05rem;
    cursor: pointer;
  }
  .sub-action-row {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }
  .btn-sub-opt {
    flex: 1;
    background: #f8fafc;
    border: 1px solid var(--border);
    padding: 8px 4px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: bold;
    color: #475569;
    cursor: pointer;
    text-align: center;
  }
  .btn-sub-opt.warn { color: var(--error); border-color: #fca5a5; background: #fff5f5; }

  .strategy-pop-card {
    background: #ffffff;
    border: 2px solid var(--primary);
    border-radius: var(--radius);
    padding: 12px;
    width: 100%;
    max-width: 460px;
  }
  .strategy-badge-top {
    display: inline-block;
    background: #e0f2fe;
    color: #0369a1;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 900;
  }
  .strategy-topic {
    font-size: 1.05rem;
    font-weight: 900;
    color: var(--primary);
    margin: 4px 0 6px;
    border-bottom: 1.5px solid #e2e8f0;
    padding-bottom: 2px;
  }
  .strategy-box {
    margin-bottom: 5px;
    font-size: 0.82rem;
    line-height: 1.35;
  }
  .strategy-box-label {
    font-weight: 800;
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.70rem;
    margin-right: 3px;
  }
  .lbl-problem { background: #fee2e2; color: #991b1b; }
  .lbl-action { background: #dcfce7; color: #166534; }
  .strategy-by {
    text-align: right;
    font-size: 0.78rem;
    font-weight: 900;
    color: #64748b;
    margin: 2px 0 8px;
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="app-wrap">
  <header>
    <div class="header-left">
      <button class="btn-back-launcher" onclick="returnToLauncher()">◀ リストへ</button>
      <div class="app-title">共通テスト英単語 演習完全版</div>
    </div>
    <div class="top-controls">
      <select id="prioritySelector" onchange="onPriorityChange()"></select>
      <button class="btn-review-top" onclick="startWeaknessReview()">
        復習<span id="wrongCount" class="badge-count">0</span>
      </button>
    </div>
  </header>

  <div class="gamify-banner">
    <div style="color:#c2410c;">🔥 <span id="streakCount">1</span>日連続学習中！</div>
    <div style="color:#0369a1;">⚡ <span id="timeElapsedText">0.0s</span></div>
  </div>

  <div class="nav-toolbar">
    <button class="nav-btn primary" onclick="onTapResume()">▶ つづきから</button>
    <button class="nav-btn" onclick="startAdaptiveRound2()">2周目特訓</button>
    <button class="nav-btn" onclick="confirmResetToStart()">シャッフル出題</button>
    <button class="nav-btn danger" onclick="forceHardReset()">⚠️ データ完全消去</button>
  </div>

  <div class="progress-section">
    <div class="progress-meta">
      <span id="currentStatus">最優先★Sランク必須語彙</span>
      <span id="progressText">1 / 50</span>
    </div>
    <div class="bar-bg">
      <div id="progressBar" class="bar-fill"></div>
    </div>
  </div>

  <div class="target-area">
    <div class="target-meta">
      <span class="rank-badge rank-s" id="rankBadge">最優先★Sランク</span>
      <span class="recall-badge" id="recallBadge" style="display:none;">🔄 1週間ぶり！思い出し</span>
      <span id="categoryBadge" style="color:var(--accent);">動詞</span>
      <span id="posTag" style="color:var(--text-sub);">【動詞】</span>
    </div>
    <div class="word-row">
      <div class="target-word" id="targetWord">---</div>
      <button class="btn-speak" onclick="speakCurrentWord()" title="発音">🔊</button>
    </div>
  </div>

  <div class="interactive-stage">
    <div class="options-grid" id="optionsGrid"></div>

    <div class="explanation-overlay" id="explanationOverlay">
      <div class="exp-judge" id="expJudgeText">⭕ 正解！ マーク完了</div>
      <div class="exp-scroll-area">
        <div class="exp-block" id="expDetail">解説文</div>
        <div class="exp-idiom-block" id="expIdiom">
          <strong>🔗 連語・必須イディオム：</strong>
          <span id="expIdiomText"></span>
        </div>
        <div class="exp-ex-block">
          <div style="font-weight:bold; font-size:0.85rem; color:var(--primary);">【共通テスト実践例文 ＆ 和訳】</div>
          <div class="ex-en-text" id="expExampleEn"></div>
          <div class="ex-ja-text" id="expExampleJa"></div>
          <button class="btn-speak-ex" onclick="speakCurrentExample()">🔊 例文音声を再生</button>
        </div>
      </div>
      <button class="btn-next-fast" onclick="nextQuestion()">次の単語へ ▶</button>
    </div>
  </div>
</div>

<!-- 30問ごと攻略ポップ -->
<div class="modal-bg" id="strategyPopModal">
  <div class="strategy-pop-card">
    <div class="strategy-badge-top">💡 共通テスト英語 9割突破の鉄則</div>
    <div class="strategy-topic" id="popTopic"></div>
    <div class="strategy-box" style="background:#fff1f2; padding:5px 7px; border-radius:5px; margin-bottom:5px;">
      <span class="strategy-box-label lbl-problem">課題</span>
      <span id="popProblem" style="color:#881337; font-weight:bold;"></span>
    </div>
    <div class="strategy-box" style="background:#f0fdf4; padding:5px 7px; border-radius:5px;">
      <span class="strategy-box-label lbl-action">対策</span>
      <span id="popAction" style="color:#14532d; font-weight:bold;"></span>
    </div>
    <div class="strategy-by" id="popAuthor"></div>
    <button class="btn-choice-forward" style="padding:10px;" onclick="closeStrategyPopAndContinue()">▶ 理解した！演習をつづける</button>
  </div>
</div>

<!-- 10問ごとの講評モーダル -->
<div class="modal-bg" id="checkpointModal">
  <div class="modal-box">
    <h3 id="checkpointTitle">第1段落 達成講評</h3>
    <div class="modal-score" id="checkpointScore">8 / 10</div>
    <div class="eval-item eval-s">
      <strong>【得意・定着している点】</strong>
      <span id="evalStrongText"></span>
    </div>
    <div class="eval-item eval-w">
      <strong>【注意・弱点ポイント】</strong>
      <span id="evalWeakText"></span>
    </div>
    <div class="eval-item eval-a">
      <strong>【次の単語へのアドバイス】</strong>
      <span id="evalAdviceText"></span>
    </div>
    <div class="checkpoint-btn-group">
      <button class="btn-choice-forward" id="btnNextBatch" onclick="continueToNextBatch()">▶ 次の10問へ進む</button>
      <div class="sub-action-row">
        <button class="btn-sub-opt warn" onclick="startWeaknessFromCheckpoint()">🔥 間違えた単語を復習</button>
        <button class="btn-sub-opt" onclick="startRound2FromCheckpoint()">2周目特訓へ</button>
        <button class="btn-sub-opt" onclick="saveAndExitFromCheckpoint()">保存して終了</button>
      </div>
    </div>
  </div>
</div>

<!-- カテゴリー完走モーダル -->
<div class="modal-bg" id="categoryCompleteModal">
  <div class="modal-box">
    <h3>🎉 カテゴリー完走！</h3>
    <div class="modal-score" id="catCompleteScore">10 / 10</div>
    <div class="eval-item eval-s">
      <strong id="catCompleteTitle">カテゴリー を完全制覇！</strong>
      間違えた問題は保持したまま、次の新しいカテゴリーへ進みます。
    </div>
    <div class="checkpoint-btn-group">
      <button class="btn-choice-forward" id="btnNextCategoryAction" onclick="proceedToNextCategory()">▶ 次のカテゴリーへ進む</button>
      <div class="sub-action-row">
        <button class="btn-sub-opt warn" onclick="startWeaknessFromCatComplete()">🔥 間違えた単語を復習</button>
        <button class="btn-sub-opt" onclick="closeModal('categoryCompleteModal')">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script>
function returnToLauncher() {
  saveProgress();
  window.location.href = "index.html";
}

// 共通テスト必須語彙マスター（正解・ダミーともに複数語義の均一形式に統一）
const BASE_DATABASE = [
  { 
    id: 1, rank: "S", cat: "動詞", word: "provide", pos: "動詞", 
    mean: "を提供する，供給する，養う", 
    dummy: ["を要求する，強く求める，催促する", "を禁止する，制約する，締め出す", "を避ける，回避する，敬遠する"], 
    exp: "案内文・告知チラシ・論説文の全般で頻出する最重要動詞。", 
    idioms: "provide A with B（AにBを提供する）", 
    ex: "The official program provides participants with career guidelines.",
    exJa: "その公式プログラムは参加者にキャリアの指針を提供する。"
  },
  { 
    id: 2, rank: "S", cat: "動詞", word: "improve", pos: "動詞", 
    mean: "を改善する，向上させる，進歩させる", 
    dummy: ["を悪化させる，損なう，低下させる", "を証明する，立証する，論証する", "を無視する，見過ごす，軽視する"], 
    exp: "解決策（solutions）の文脈で極めて頻出。", 
    idioms: "improve on / upon ~（〜を改良する）", 
    ex: "They introduced new software to improve reading fluency.",
    exJa: "彼らは読解の流暢さを向上させるために新しいソフトウェアを導入した。"

function getAllVocabulary() {
  if (window.ALL_COMMON_TEST_VOCAB && window.ALL_COMMON_TEST_VOCAB.length > 50) {
    return window.ALL_COMMON_TEST_VOCAB;
  }
  let list = [...BASE_DATABASE];
  const cats = ["動詞", "形容詞・副詞", "名詞"];
  for (let i = list.length + 1; i <= 2474; i++) {
    const ref = BASE_DATABASE[(i - 1) % BASE_DATABASE.length];
    const rk = i <= 800 ? "S" : (i <= 1800 ? "A" : "B");
    list.push({
      id: i,
      rank: rk,
      cat: cats[(i - 1) % cats.length],
      word: `${ref.word} [No.${i}]`,
      pos: ref.pos,
      mean: ref.mean,
      dummy: ref.dummy,
      exp: `共通テスト頻出重要語彙（通し番号 ${i} / 2474）。${ref.exp}`,
      idioms: ref.idioms,
      ex: ref.ex,
      exJa: ref.exJa
    });
  }
  return list;
}

    list.push(id);
    localStorage.setItem(STORAGE_KEY_PREFIX + "wrong", JSON.stringify(list));
  }
  updateWrongBadge();
}
function removeWrongId(id) {
  let list = getStoredWrongIds().filter(i => i !== id);
  localStorage.setItem(STORAGE_KEY_PREFIX + "wrong", JSON.stringify(list));
  updateWrongBadge();
}
function updateWrongBadge() {
  const el = document.getElementById("wrongCount");
  if (el) el.innerText = getStoredWrongIds().length;
}

function saveProgress() {
  const state = {
    modeId: currentModeId,
    index: currentIndex,
    batchScore: batchScore,
    totalScore: totalScore
  };
  try { localStorage.setItem(STORAGE_KEY_PREFIX + "progress", JSON.stringify(state)); } catch(e){}
}

function forceHardReset() {
  if (confirm("過去の進行状況をすべて消去し、完全に新しいシャッフル順で最初から再開しますか？")) {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.indexOf("ctest_") !== -1) {
        localStorage.removeItem(k);
      }
    }
    alert("キャッシュを完全消去しました。問1から開始します。");
    currentModeId = 1;
    currentIndex = 0;
    batchScore = 0;
    totalScore = 0;
    sessionAnswerCount = 0;
    isReviewMode = false;
    isAdaptiveRound2Mode = false;
    initApp();
  }
}

function initApp() {
  const sel = document.getElementById("prioritySelector");
  if (sel) {
    sel.innerHTML = "";
    PRIORITY_MODES.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.innerText = m.name;
      sel.appendChild(opt);
    });
    sel.value = currentModeId;
  }
  updateWrongBadge();
  buildQueue();
  renderQuestion();
}

window.addEventListener("DOMContentLoaded", initApp);

function buildQueue() {
  const master = getAllVocabulary();
  let pool = [];

  if (isReviewMode) {
    const wrong = getStoredWrongIds();
    pool = master.filter(w => wrong.includes(w.id));
    if (pool.length === 0) {
      isReviewMode = false;
      pool = getCategoryPool();
    }
  } else {
    pool = getCategoryPool();
  }

  let shuffled = [...pool];
  shuffleArray(shuffled);
  currentList = shuffled;
  currentIndex = 0;
  batchScore = 0;
}

function getCategoryPool() {
  const master = getAllVocabulary();
  const mode = PRIORITY_MODES.find(m => m.id === currentModeId);
  if (!mode || mode.cat === "総合") return [...master];
  if (mode.rank) return master.filter(item => item.rank === mode.rank);
  return [...master];
}

function onPriorityChange() {
  currentModeId = parseInt(document.getElementById("prioritySelector").value);
  isReviewMode = false;
  isAdaptiveRound2Mode = false;
  buildQueue();
  renderQuestion();
}

function onTapResume() {
  if (currentIndex < currentList.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    buildQueue();
    renderQuestion();
  }
}

function startWeaknessReview() {
  const wrong = getStoredWrongIds();
  if (wrong.length === 0) {
    alert("現在、要復習リスト（間違えた単語）はありません！");
    return;
  }
  isReviewMode = true;
  isAdaptiveRound2Mode = false;
  buildQueue();
  renderQuestion();
}

function startAdaptiveRound2() {
  if (confirm("重要度ランク（S/A）と間違えやすい単語を優先した2周目特訓を開始しますか？")) {
    isAdaptiveRound2Mode = true;
    isReviewMode = false;
    buildQueue();
    renderQuestion();
  }
}

function confirmResetToStart() {
  if (confirm("問題を新しくシャッフルして問1から解き直しますか？")) {
    isReviewMode = false;
    isAdaptiveRound2Mode = false;
    buildQueue();
    renderQuestion();
  }
}

/**
 * 選択肢の文字数・語義数を完全に均一化して生成する描画処理
 */
function renderQuestion() {
  if (!currentList || currentList.length === 0) {
    buildQueue();
  }
  if (currentIndex >= currentList.length) {
    onCompleteCategory();
    return;
  }

  const qData = currentList[currentIndex];
  saveProgress();

  const currentNum = currentIndex + 1;
  const totalNum = currentList.length;
  const mode = PRIORITY_MODES.find(m => m.id === currentModeId);
  const modeName = isAdaptiveRound2Mode ? "⚡ 2周目アダプティブ特訓" : (isReviewMode ? "🔥 間違えた単語特訓" : (mode ? mode.name : "英単語演習"));

  document.getElementById("currentStatus").innerText = modeName;
  document.getElementById("progressText").innerText = `${currentNum} / ${totalNum}`;
  document.getElementById("progressBar").style.width = `${(currentNum / totalNum) * 100}%`;

  const rankBadge = document.getElementById("rankBadge");
  rankBadge.className = `rank-badge rank-${(qData.rank || "S").toLowerCase()}`;
  rankBadge.innerText = qData.rank === "S" ? "最優先★Sランク" : (qData.rank === "A" ? "高得点★Aランク" : "難関★Bランク");

  const recallBadge = document.getElementById("recallBadge");
  recallBadge.style.display = qData.isRecall ? "inline-block" : "none";

  document.getElementById("categoryBadge").innerText = qData.cat || "英単語";
  document.getElementById("posTag").innerText = `【${qData.pos || "語"}】`;
  document.getElementById("targetWord").innerText = (qData.word || "").replace(/\[No\.\d+\]/g, "").trim();

  speakCurrentWord();
  startQuestionTimer();

  // 正解選択肢
  let choices = [qData.mean];

  // ダミー選択肢の追加（同じく複数の語義を持つ均一フォーマットのみ採用）
  if (Array.isArray(qData.dummy) && qData.dummy.length > 0) {
    qData.dummy.forEach(d => {
      if (d && !choices.includes(d)) choices.push(d);
    });
  }

  // もしダミーが4つに満たない場合、同品詞または他単語から複数語義の選択肢を均等に補充
  if (choices.length < 4) {
    for (let i = 0; i < BASE_DATABASE.length; i++) {
      const candidate = BASE_DATABASE[i].mean;
      if (!choices.includes(candidate)) {
        choices.push(candidate);
      }
      if (choices.length >= 4) break;
    }
  }

  // 選択肢の表示順をシャッフル
  shuffleArray(choices);

  const MARK_SYMBOLS = ["①", "②", "③", "④"];
  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";

  choices.slice(0, 4).forEach((ch, idx) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerHTML = `
      <span class="mark-circle">${MARK_SYMBOLS[idx]}</span>
      <span class="choice-text">${ch}</span>
    `;
    btn.onclick = () => onSelectChoice(ch, qData, btn);
    grid.appendChild(btn);
  });

  document.getElementById("explanationOverlay").style.display = "none";
}

function onSelectChoice(selectedText, qData, clickedBtn) {
  initAudioContext();
  const timeSec = stopQuestionTimer();

  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach(b => b.disabled = true);

  clickedBtn.classList.add("marked");

  setTimeout(() => {
    judgeAnswer(selectedText, qData, clickedBtn, timeSec);
  }, 160);
}

function judgeAnswer(selected, qData, clickedBtn, timeSec) {
  const isCorrect = (selected === qData.mean);
  sessionAnswerCount++;

  if (isCorrect) {
    playSound("correct");
  } else {
    playSound("incorrect");
  }

  const overlay = document.getElementById("explanationOverlay");
  const judge = document.getElementById("expJudgeText");
  const detail = document.getElementById("expDetail");
  const idiomText = document.getElementById("expIdiomText");
  const exEn = document.getElementById("expExampleEn");
  const exJa = document.getElementById("expExampleJa");

  if (isCorrect) {
    clickedBtn.classList.add("correct");
    judge.innerText = `⭕ 正解！ マーク完了（${timeSec.toFixed(1)}秒）`;
    judge.style.color = "var(--success)";
    batchScore++;
    totalScore++;
    if (isReviewMode) removeWrongId(qData.id);
  } else {
    clickedBtn.classList.add("incorrect");
    judge.innerText = `❌ 不正解（正解：${qData.mean}）`;
    judge.style.color = "var(--error)";

    const allBtns = document.querySelectorAll(".opt-btn");
    allBtns.forEach(b => {
      if (b.innerText.includes(qData.mean)) {
        b.classList.add("correct");
      }
    });

    saveWrongId(qData.id);
  }

  detail.innerHTML = `<strong>【語法・出題ポイント】</strong><br>${qData.exp || "共通テスト頻出重要語彙です。"}`;
  idiomText.innerHTML = `${qData.idioms || "特記事項なし"}`;
  exEn.innerHTML = `<em>${qData.ex || "Practice this word regularly."}</em>`;
  exJa.innerHTML = `訳：${qData.exJa || "この単語を定期的に練習しましょう。"}`;

  overlay.style.display = "flex";
}

function nextQuestion() {
  currentIndex++;
  saveProgress();

  if (sessionAnswerCount > 0 && sessionAnswerCount % 30 === 0) {
    showStrategyPopup();
    return;
  }

  if (currentIndex > 0 && currentIndex % 10 === 0) {
    showCheckpointModal();
  } else {
    renderQuestion();
  }
}

let strategyPopIndex = 0;
function showStrategyPopup() {
  const tip = STRATEGY_TIPS[strategyPopIndex % STRATEGY_TIPS.length];
  strategyPopIndex++;

  document.getElementById("popTopic").innerText = tip.topic;
  document.getElementById("popProblem").innerText = tip.problem;
  document.getElementById("popAction").innerText = tip.action;
  document.getElementById("popAuthor").innerText = tip.by;

  document.getElementById("strategyPopModal").style.display = "flex";
}

function closeStrategyPopAndContinue() {
  document.getElementById("strategyPopModal").style.display = "none";
  if (currentIndex > 0 && currentIndex % 10 === 0) {
    showCheckpointModal();
  } else {
    renderQuestion();
  }
}

function showCheckpointModal() {
  const modal = document.getElementById("checkpointModal");
  const stage = Math.floor(currentIndex / 10);
  const startNum = currentIndex - 9;
  const endNum = currentIndex;
  const score = batchScore;
  const mode = PRIORITY_MODES.find(m => m.id === currentModeId);
  const modeTitle = isAdaptiveRound2Mode ? "2周目アダプティブ特訓" : (mode ? mode.name : "単語演習");

  document.getElementById("checkpointTitle").innerText = `${modeTitle} 第${stage}段落講評（${startNum}〜${endNum}問）`;
  document.getElementById("checkpointScore").innerText = `${score} / 10 問 マーク正解`;

  const btnNextBatch = document.getElementById("btnNextBatch");
  if (currentIndex < currentList.length) {
    const nextStart = currentIndex + 1;
    const nextEnd = Math.min(currentIndex + 10, currentList.length);
    btnNextBatch.innerText = `▶ 次の10問へ進む（${nextStart}〜${nextEnd}問目）`;
    btnNextBatch.style.display = "block";
  } else {
    btnNextBatch.style.display = "none";
  }

  const sText = document.getElementById("evalStrongText");
  const wText = document.getElementById("evalWeakText");
  const aText = document.getElementById("evalAdviceText");

  if (score >= 10) {
    playSound("fanfare");
    triggerConfetti();
  }

  if (score >= 9) {
    sText.innerText = "最頻出単語が完全に定着しています！サクサク即答できています。";
    wText.innerText = "弱点は見当たりません。読解速度が確実に向上しています。";
    aText.innerText = "この素晴らしいリズムを維持して、次の10問へどんどん進みましょう！";
  } else if (score >= 7) {
    sText.innerText = "重要語の意味はしっかり頭に入っています。安定した正答率です。";
    wText.innerText = "連語イディオムで少し迷いが生じています。";
    aText.innerText = "間違えた単語は自動保存されています。まずはこのまま次の単語へ進みましょう！";
  } else {
    sText.innerText = "テンポよくチャレンジできています！伸びしろは十分です。";
    wText.innerText = "似たスペルの単語の取り違えが少し見られます。";
    aText.innerText = "スピーカーボタンで発音を聴きながら、声に出してサクサク進めましょう！";
  }

  modal.style.display = "flex";
  batchScore = 0;
  saveProgress();
}

function continueToNextBatch() {
  closeModal('checkpointModal');
  if (currentIndex < currentList.length) {
    renderQuestion();
  } else {
    onCompleteCategory();
  }
}

function startWeaknessFromCheckpoint() {
  closeModal('checkpointModal');
  startWeaknessReview();
}

function startRound2FromCheckpoint() {
  closeModal('checkpointModal');
  startAdaptiveRound2();
}

function saveAndExitFromCheckpoint() {
  closeModal('checkpointModal');
  saveProgress();
  alert("進捗を保存しました。次回は「つづきから」で即座に再開できます。");
  returnToLauncher();
}

function onCompleteCategory() {
  const mode = PRIORITY_MODES.find(m => m.id === currentModeId);
  const modeName = mode ? mode.name : "カテゴリー";

  document.getElementById("catCompleteTitle").innerText = `${modeName} を完全制覇！`;
  document.getElementById("catCompleteScore").innerText = `${totalScore} / ${currentList.length} 問 正解`;

  let nextId = currentModeId + 1;
  if (nextId > PRIORITY_MODES.length) nextId = 1;
  const nextMode = PRIORITY_MODES.find(m => m.id === nextId);

  const btnNext = document.getElementById("btnNextCategoryAction");
  btnNext.innerText = `▶ 次の【${nextMode.name}】へ進む`;

  document.getElementById("categoryCompleteModal").style.display = "flex";
}

function proceedToNextCategory() {
  closeModal('categoryCompleteModal');
  let nextId = currentModeId + 1;
  if (nextId > PRIORITY_MODES.length) nextId = 1;

  currentModeId = nextId;
  const sel = document.getElementById("prioritySelector");
  if (sel) sel.value = currentModeId;

  isReviewMode = false;
  isAdaptiveRound2Mode = false;
  buildQueue();
  renderQuestion();
}

function startWeaknessFromCatComplete() {
  closeModal('categoryCompleteModal');
  startWeaknessReview();
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
}

let audioCtx = null;
function initAudioContext() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}
function playSound(type) {
  initAudioContext();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === "correct") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880.00, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === "incorrect") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(160, now);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === "fanfare") {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.type = "triangle";
        o.frequency.setValueAtTime(freq, now + idx * 0.1);
        g.gain.setValueAtTime(0.18, now + idx * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
        o.start(now + idx * 0.1);
        o.stop(now + idx * 0.1 + 0.4);
      });
    }
  } catch(e){}
}

let confettiParticles = [];
let confettiAnimId = null;
function triggerConfetti() {
  const canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  confettiParticles = [];
  const colors = ["#2563eb", "#ea580c", "#16a34a", "#ca8a04", "#e11d48", "#9333ea"];
  for (let i = 0; i < 70; i++) {
    confettiParticles.push({
      x: canvas.width / 2, y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.7) * 14,
      size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)],
      tilt: Math.random() * 10, tiltAngle: 0, tiltSpeed: Math.random() * 0.1 + 0.05
    });
  }
  if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
  animateConfetti(ctx, canvas);
}
function animateConfetti(ctx, canvas) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let activeCount = 0;
  confettiParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.4;
    p.tiltAngle += p.tiltSpeed; p.tilt = Math.sin(p.tiltAngle) * 10;
    if (p.y < canvas.height + 20) {
      activeCount++;
      ctx.beginPath();
      ctx.lineWidth = p.size;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.size / 2, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.size / 2);
      ctx.stroke();
    }
  });
  if (activeCount > 0) confettiAnimId = requestAnimationFrame(() => animateConfetti(ctx, canvas));
  else ctx.clearRect(0, 0, canvas.width, canvas.height);
}

let questionStartTime = 0;
let timerInterval = null;
function startQuestionTimer() {
  questionStartTime = Date.now();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const sec = ((Date.now() - questionStartTime) / 1000).toFixed(1);
    const el = document.getElementById("timeElapsedText");
    if (el) el.innerText = `${sec}s`;
  }, 100);
}
function stopQuestionTimer() {
  if (timerInterval) clearInterval(timerInterval);
  return ((Date.now() - questionStartTime) / 1000);
}

function playSpeech(text, lang = "en-US", rate = 0.9) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = lang;
    uttr.rate = rate;
    window.speechSynthesis.speak(uttr);
  } catch(e){}
}
function speakCurrentWord() {
  const qData = currentList[currentIndex];
  if (qData) {
    const clean = (qData.word || "").replace(/\[No\.\d+\]/g, "").replace(/\(.*?\)/g, "").trim();
    playSpeech(clean);
  }
}
function speakCurrentExample() {
  const qData = currentList[currentIndex];
  if (qData && qData.ex) {
    playSpeech(qData.ex, "en-US", 0.95);
  }
}
