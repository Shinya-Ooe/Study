<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電気と磁界・発電機 期末テスト問題集</title>
<style>
:root{--bg:#f4f7f9;--fg:#18242c;--sub:#5a6a75;--ac:#0b6e8a;--card:#fff;--ok:#237a4b;--ng:#b3392b;--ln:#d3dde3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1519;--fg:#e5edf1;--sub:#97a8b3;--ac:#5cc3e0;--card:#172026;--ok:#6fcf9d;--ng:#ff8e7b;--ln:#27343c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1519;--fg:#e5edf1;--sub:#97a8b3;--ac:#5cc3e0;--card:#172026;--ok:#6fcf9d;--ng:#ff8e7b;--ln:#27343c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:.2em 0 .3em}
h2{font-size:1.15rem;margin:.8em 0 .3em}
a{color:var(--ac)}
.s{color:var(--sub);font-size:.9rem;line-height:1.7}
.c{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:4px;padding:12px 14px;margin:12px 0}
.b{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;font:inherit;font-size:.95rem;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:11px 14px;margin:8px 0;cursor:pointer}
.b:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b:disabled{cursor:default;opacity:.55}
.b.ok{border-color:var(--ok);color:var(--ok);opacity:1}
.b.ng{border-color:var(--ng);color:var(--ng);opacity:1}
.b.p{background:var(--ac);border-color:var(--ac);color:var(--card)}
b.ok{color:var(--ok)}b.ng{color:var(--ng)}
.bar{height:8px;background:var(--ln);border-radius:4px;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
</style>
</head>
<body>
<main id="a"></main>
<script>
var C=[
{t:"電流がつくる磁界",tip:"電流の向きと磁界の向き（右ねじ・右手の法則）を図に描いて確かめよう。磁力線は交わらず、間隔が狭いほど磁界が強い。",q:[
["導線に電流を流したとき、導線のまわりにできる磁界の形は。",["導線を中心とした同心円状","導線に平行な直線","導線から放射状","導線に垂直な直線"],0,"電流の向きに右ねじを進めるとき、ねじを回す向きが磁界の向きです。磁力線は導線を中心とした同心円になります。"],
["電流がつくる磁界を強くする方法として誤っているものは。",["電流を大きくする","コイルの巻数を増やす","コイルに鉄心を入れる","電流を小さくする"],3,"電流を大きくする・巻数を増やす・鉄心を入れると強くなります。電流を小さくすると弱くなるので誤りです。"],
["コイルの内側にできる磁界の向きを逆にするには。",["電流の向きを逆にする","巻数を増やす","電流を大きくする","鉄心を入れる"],0,"磁界の向きは電流の向きで決まります。巻数・電流の大きさ・鉄心は、磁界の強さを変えるだけで向きは変わりません。"],
["磁力線について正しいものは。",["N極から出てS極に入る","S極から出てN極に入る","途中で交わることがある","間隔が広いほど磁界が強い"],0,"磁力線はN極から出てS極に入る向きに描きます。交わることはなく、間隔が狭いところほど磁界が強いです。"]]},
{t:"電流が磁界から受ける力",tip:"力の向きは、電流か磁界のどちらか一方を逆にすると逆になる（両方逆なら変わらない）。モーターは整流子が電流の向きを切り替えて回り続ける。",q:[
["磁界の中の導線に流れる電流が受ける力の向きを逆にするには。（1つだけ変える）",["電流の向きだけを逆にする","電流を大きくする","磁石を強いものにする","コイルの巻数を増やす"],0,"力の向きは電流の向きと磁界の向きで決まります。どちらか一方だけを逆にすると力の向きが逆になります。大きさを変えても向きは変わりません。"],
["電流の向きと磁界の向きを同時に逆にすると、力の向きは。",["逆になる","変わらない","0になる","2倍になる"],1,"2つとも逆にすると、逆の逆で元と同じ向きになります。"],
["電流が磁界から受ける力を大きくする方法は。",["電流を大きくする","電圧を小さくする","磁石を遠ざける","抵抗を大きくする"],0,"電流を大きくするか、磁界を強くすると力は大きくなります。電圧を小さくする・抵抗を大きくすると電流が小さくなります。"],
["モーターでコイルが同じ向きに回り続けるよう、電流の向きを切り替える部品は。",["整流子","永久磁石","電池","鉄心"],0,"コイルが半回転するごとに、整流子とブラシが電流の向きを切り替えるため、回り続けます。"]]},
{t:"電磁誘導",tip:"磁界が「変化している間だけ」誘導電流が流れる。近づける・遠ざけるで向きが逆、速く・強く・巻数多くで大きくなる。",q:[
["コイルの中の磁界が変化して、コイルに電流が流れる現象で、流れる電流を何というか。",["誘導電流","直流","静電気","放電"],0,"この現象を電磁誘導といい、流れる電流を誘導電流といいます。"],
["検流計につないだコイルに棒磁石のN極を近づけると針が右に振れた。N極を遠ざけると針は。",["右に振れる","左に振れる","振れない","右に2倍振れる"],1,"近づけるときと遠ざけるときでは、コイルの中の磁界の変化が逆なので、誘導電流の向きも逆になります。"],
["誘導電流を大きくする方法として誤っているものは。",["磁石を速く動かす","強い磁石を使う","コイルの巻数を増やす","磁石をコイルの中で静止させる"],3,"磁石が動かず磁界が変化しないと、誘導電流は流れません。速く動かす・強い磁石・巻数を増やすと大きくなります。"],
["N極を近づけたときと比べ、S極を同じように近づけたときの誘導電流の向きは。",["同じ向き","逆向き","流れない","2倍の大きさ"],1,"磁石の極が逆になると、コイルの中の磁界の変化の向きが逆になり、誘導電流の向きも逆になります。"]]},
{t:"発電機と交流",tip:"発電機は電磁誘導の利用。交流は向きが周期的に変わる電流で、周波数は1秒間にくり返す回数。",q:[
["発電機で電流が生じる原理は。",["電磁誘導","電流が磁界から受ける力","静電気","化学変化"],0,"磁石の間でコイルを回すと、コイルの中の磁界が変化して誘導電流が生じます（電磁誘導）。"],
["発電機のコイルを回して得られる電流の特徴は。",["常に同じ向きの直流","周期的に向きが変わる交流","向きも大きさも変わらない","電流は流れない"],1,"コイルが回ると磁界の変化の向きが入れ替わるので、周期的に向きが変わる交流になります。"],
["発電機で得られる電流を大きくする方法は。",["コイルを速く回す","磁石を弱くする","コイルの巻数を減らす","ゆっくり回す"],0,"速く回す・強い磁石・巻数を増やすと、磁界の変化が大きくなり、電流が大きくなります。"],
["周波数が50Hzの交流とは。",["1秒間に50回同じ変化をくり返す","1秒間に50回だけ向きが変わる","50秒に1回向きが変わる","1分間に50回変化する"],0,"周波数は1秒間にくり返す回数です。50Hzでは、1秒間に向きが入れ替わる回数は100回になります。"]]},
{t:"発電のしくみ",tip:"どの発電も、最後は発電機を回します。エネルギーが変換される順を言えるようにしよう。",q:[
["水力発電で、エネルギーが変換される順は。",["位置→運動→電気エネルギー","熱→化学→電気エネルギー","電気→運動→位置エネルギー","光→熱→電気エネルギー"],0,"高い所の水がもつ位置エネルギーが、落ちるときの運動エネルギーになり、発電機で電気エネルギーに変わります。"],
["火力発電で、発電機のタービンを回すものは。",["高温・高圧の水蒸気","磁石","太陽光","地下水"],0,"燃料を燃やして水を沸かし、できた高温・高圧の水蒸気でタービンを回して発電します。"]]}
];
var R={},run=null,app=document.getElementById("a"),N=["①","②","③","④"];
try{R=JSON.parse(localStorage.getItem("denjiR")||"{}")}catch(e){R={}}
function save(){try{localStorage.setItem("denjiR",JSON.stringify(R))}catch(e){}}
function ids(c){return C[c].q.map(function(_,j){return c+"-"+j})}
function all(){return [].concat.apply([],C.map(function(_,c){return ids(c)}))}
function wrong(){return all().filter(function(i){return R[i]===0})}
function get(id){var p=id.split("-");return C[p[0]].q[p[1]]}
function top(){window.scrollTo(0,0)}
function home(){var w=wrong().length,n=all().length,h="<h1>電気と磁界・発電機 期末テスト問題集</h1><p class=s>全"+n+"問。答えるたびに解説が出ます。間違えた問題は復習でき、最後に得意・不得意の講評が出ます。</p><button class=\"b p\" onclick=\"start(all(),'全問')\"><b>全問に挑戦</b><span>"+n+"問</span></button>";
C.forEach(function(c,i){h+="<button class=b onclick=\"start(ids("+i+"),C["+i+"].t)\"><b>"+c.t+"</b><span>"+c.q.length+"問</span></button>"});
h+="<button class=b onclick=\"review()\""+(w?"":" disabled")+"><b>間違えた問題を復習</b><span>"+w+"問</span></button><button class=b onclick=\"rep()\"><b>講評を見る</b></button><p class=s><a href=# onclick=\"reset();return false\">記録を消す</a></p>";app.innerHTML=h;top()}
function start(l,name){run={ids:l,i:0,ok:0,name:name};ask()}
function review(){run={ids:wrong(),i:0,ok:0,name:"復習"};ask()}
function ask(){if(run.i>=run.ids.length)return fin();var q=get(run.ids[run.i]),h="<p class=s>"+run.name+"　"+(run.i+1)+" / "+run.ids.length+"</p><div class=c>"+q[0]+"</div>";
q[1].forEach(function(o,k){h+="<button class=b onclick=\"pick("+k+")\">"+N[k]+" "+o+"</button>"});app.innerHTML=h+"<div id=f></div>";top()}
function pick(k){var id=run.ids[run.i],q=get(id),ok=k==q[2];run.ok+=ok?1:0;R[id]=ok?1:0;save();
document.querySelectorAll(".b").forEach(function(e,j){e.disabled=true;if(j==q[2])e.classList.add("ok");else if(j==k)e.classList.add("ng")});
document.getElementById("f").innerHTML="<div class=c><b class="+(ok?"ok":"ng")+">"+(ok?"正解":"不正解")+"</b>　正解は "+N[q[2]]+"<br>"+q[3]+"</div><button class=b onclick=\"run.i++;ask()\">次へ</button>"}
function fin(){var w=wrong().length,h="<h2>結果　"+run.ok+" / "+run.ids.length+"</h2>";
h+="<button class=\"b p\" onclick=\"rep()\"><b>講評を見る</b></button>";
if(w)h+="<button class=b onclick=\"review()\"><b>間違えた問題を復習</b><span>"+w+"問</span></button>";
app.innerHTML=h+"<button class=b onclick=\"home()\">ホームへ</button>";top()}
function rep(){var tt=0,tc=0,h="<h2>講評</h2>",st=[],wk=[];
C.forEach(function(c,i){var d=0,o=0;ids(i).forEach(function(id){if(R[id]!==undefined){d++;o+=R[id]}});tt+=d;tc+=o;var p=d?Math.round(o*100/d):0;
h+="<b>"+c.t+"</b>　"+(d?o+" / "+d+"（"+p+"%）":"未回答")+"<div class=bar><i style=\"width:"+p+"%\"></i></div>";
if(d){if(p>=80)st.push(c.t);else if(p<60)wk.push(i)}});
if(!tt){app.innerHTML=h+"<p>まだ回答がありません。問題に挑戦すると講評が出ます。</p><button class=b onclick=\"home()\">ホームへ</button>";return top()}
var P=Math.round(tc*100/tt);
h+="<div class=c><b>全体　"+tc+" / "+tt+"（"+P+"%）</b><br>"+(P>=90?"とてもよくできています。この調子で、間違えた問題だけ見直せば満点が狙えます。":P>=70?"基本は身についています。弱い分野を直せば、さらに伸びます。":"基本から見直しましょう。解説を読んで、間違えた問題を復習で解き直すのが近道です。")+"</div>";
h+="<h2>得意な分野</h2><p>"+(st.length?st.join("、"):"80%以上の分野はまだありません。復習で伸ばしましょう。")+"</p><h2>弱い分野（60%未満）</h2>";
h+=wk.length?wk.map(function(i){return "<div class=c><b>"+C[i].t+"</b><br>"+C[i].tip+"</div>"}).join(""):"<p>60%未満の分野はありません。</p>";
var w=wrong().length;
if(w)h+="<button class=\"b p\" onclick=\"review()\"><b>間違えた問題を復習</b><span>"+w+"問</span></button>";
app.innerHTML=h+"<button class=b onclick=\"home()\">ホームへ</button>";top()}
function reset(){R={};save();home()}
home();
</script>
</body>
</html>
